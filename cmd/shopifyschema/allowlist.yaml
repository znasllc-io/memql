# The Shopify mirror allowlist -- what is mirrored, and how each domain is
# kept fresh. Read cmd/shopifyschema/allowlist.go for the field meanings and
# docs/public/operate/shopify-connector.md for the operator view.
#
# THIS FILE IS THE REVIEWED PART. Everything below a root type -- every
# field, every enum value, every child's shape -- comes from the Admin schema
# and is regenerated. What a person decides here is which root types the
# mirror carries, which connections are worth their own rows, which webhook
# topics are subscribed, and how a domain is reconciled when a webhook is
# lost. Shopify does not guarantee webhook delivery, so `reconcile` is not a
# backstop, it is the contract.
#
# TOPIC ASSIGNMENT, and the rule that is easy to get wrong: a topic is listed
# on the concept whose GID ITS PAYLOAD CARRIES. `refunds/create` carries a
# refund id, not an order id, so listing it under `order` would fetch
# node(<refund gid>) as an Order and get nothing. Refunds, transactions and
# fulfilments are materialised as children of the order and every one of them
# also moves the order's own updatedAt, so ORDERS_UPDATED carries them and
# they are deliberately not subscribed separately.

apiVersion: "2026-07"

types:
  # ---- Products -----------------------------------------------------
  - type: Product
    concept: product
    query: products
    scopes: [read_products]
    reconcile: updated_at
    bulk: true
    children:
      - {connection: variants, type: ProductVariant, page: 100}
    references: [collections, resourcePublications, sellingPlanGroups, media]
    topics:
      PRODUCTS_CREATE: upsert
      PRODUCTS_UPDATE: upsert
      PRODUCTS_DELETE: delete
      PRODUCT_PUBLICATIONS_CREATE: upsert
      PRODUCT_PUBLICATIONS_UPDATE: upsert
      PRODUCT_PUBLICATIONS_DELETE: upsert
      PRODUCT_LISTINGS_ADD: upsert
      PRODUCT_LISTINGS_UPDATE: upsert
      PRODUCT_LISTINGS_REMOVE: upsert
