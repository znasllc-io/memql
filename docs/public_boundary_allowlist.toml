# docs/public_boundary_allowlist.toml
#
# The links on published docs pages that break the public boundary today,
# let through until each page is fixed (memql#5717). Read by
# cmd/docs-gen/bundle: docs_public_boundary_test.go on every pull request,
# and the release lane's --check before it builds.
#
# THIS LIST ONLY SHRINKS. An entry that no longer matches a link is itself a
# violation, so fixing a link fails the gate until its entry is deleted here
# too, and a new boundary-breaking link can only land by being added in a
# change a reviewer reads. Do not add entries to make a new link pass: link
# the public page that covers the subject, or say it in prose.
#
# An allowlisted link ships as its plain text -- never as a link to GitHub or
# to a file outside docs/public -- so the site shows no dead link while the
# page waits for its fix.
#
# One entry per (file, target, rule), covering every occurrence of that
# target on that page:
#
#   file    the page, repository-relative
#   target  the link target exactly as written, fragment included
#   rule    leaves-public       resolves outside docs/public
#           unselected-target   a docs/public page the bundle does not publish
#                               (draft, historical, internal)
#           unrewritable-target a docs/public path that is not a page
#           missing-target      nothing tracked at that path
#   reason  optional
#
# The format is the subset of TOML .gitleaks.toml is written in: [[allow]]
# tables of double-quoted strings. Anything else is refused.
#
# Seeded from the tree on 2026-09-28: 89 entries (74 leaves-public, 14
# unselected-target, 1 unrewritable-target). Each entry is a page to fix.

