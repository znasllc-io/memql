variables:

  # --- seal floor (a developer .env MUST cover these to seal) ---

  - name: MEMQL_IDENTITY_BASE_URL
    component: identity
    scope: global
    required: ["identity"]
    description: "Public origin of the identity service (e.g. https://auth.example.com). Used as JWT `iss` and in outbound email links."

  - name: MEMQL_IDENTITY_VERIFIER_BASE_URL
    component: identity
    scope: global
    description: "URL non-identity binaries fetch JWKS from. Typically equals MEMQL_IDENTITY_BASE_URL; override only when internal-mesh routing differs from the public origin."

  - name: MEMQL_EMAIL_AZURE_TENANT_ID
    component: email
    scope: global
    description: "Azure AD tenant ID for the email integration's Microsoft Graph sender. (Legacy name `AZURE_TENANT_ID` still accepted by integrations/email as a fallback.)"

  - name: MEMQL_EMAIL_AZURE_CLIENT_ID
    component: email
    scope: global
    description: "Azure AD application ID for the email integration's Microsoft Graph sender. (Legacy name `AZURE_CLIENT_ID` still accepted.)"

  - name: MEMQL_EMAIL_SENDER
    component: email
    scope: global
    description: "Email address used as the sender for transactional mail (e.g. no-reply@znas.io). (Legacy name `MAIL_SENDER` still accepted.)"

  - name: MEMQL_EMAIL_FROM_NAME
    component: email
    scope: global
    default: "memQL"
    description: "Display name shown in the From header of transactional mail. (Legacy name `MAIL_FROM_NAME` still accepted.)"

  # --- outbound delivery (memql#2521) ---

  - name: MEMQL_OUTBOUND_ENABLED
    component: outbound
    scope: node
    optional: true
    default: "true"
    description: "Outbound-delivery worker on/off. Even when enabled the worker is inert until a per-medium allowlist admits targets (deny-by-default egress)."

  - name: MEMQL_OUTBOUND_EMAIL_ALLOWLIST
    component: outbound
    scope: node
    optional: true
    description: "Comma-separated recipient domain suffixes the outbound worker may email (e.g. `example.com,ops.example.org`; subdomains admitted). Empty = email medium disabled; rows targeting it fail fast."

  - name: MEMQL_OUTBOUND_WEBHOOK_ALLOWLIST
    component: outbound
    scope: node
    optional: true
    description: "Comma-separated URL prefixes the outbound worker may POST to. HTTPS required unless a prefix is an explicit http:// entry (cluster-internal opt-in). Empty = webhook medium disabled; rows targeting it fail fast."

  - name: MEMQL_OUTBOUND_POLL_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "15"
    description: "Outbound worker safety-net drain interval. The graph.node.created fast-path delivers same-replica rows immediately; the poll covers cross-replica rows, retry due-times, and dropped events."

  - name: MEMQL_OUTBOUND_STARTUP_DELAY_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "20"
    description: "Delay before the outbound worker's first drain so the engine + DSL finish loading."

  - name: MEMQL_OUTBOUND_MAX_ATTEMPTS
    component: outbound
    scope: node
    optional: true
    default: "5"
    description: "Delivery attempts before an outboundRequest row is stamped failed (bounded exponential backoff between attempts)."

  - name: MEMQL_OUTBOUND_MAX_PAYLOAD_BYTES
    component: outbound
    scope: node
    optional: true
    default: "262144"
    description: "Maximum outboundRequest body size accepted at drain time; larger rows fail permanently."

  - name: MEMQL_OUTBOUND_HTTP_TIMEOUT_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "10"
    description: "Per-request timeout for the outbound webhook transport."

  - name: MEMQL_OUTBOUND_CLAIM_TTL_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "300"
    description: "Attempt-scoped lease on the cross-replica delivery claim: how long a won claim blocks peers before a dead claimant's key is re-winnable, so a crash between claim and terminal stamp recovers instead of wedging the row until the guard retention prune. Keep it above MEMQL_OUTBOUND_HTTP_TIMEOUT_SECONDS."

  # --- inbound delivery (memql#2957) ---
  #
  # The per-source verification policy is a FAMILY of vars keyed on the source
  # name, so it cannot be enumerated here:
  #
  #   MEMQL_INBOUND_SOURCE_<NAME>_SECRET             the shared HMAC key
  #   MEMQL_INBOUND_SOURCE_<NAME>_SIGNATURE_SCHEME   hmac-sha256-hex | hmac-sha256-base64 | none
  #   MEMQL_INBOUND_SOURCE_<NAME>_SIGNATURE_HEADER   e.g. X-Hub-Signature-256
  #   MEMQL_INBOUND_SOURCE_<NAME>_SIGNATURE_PREFIX   e.g. "sha256=" (optional)
  #   MEMQL_INBOUND_SOURCE_<NAME>_TIMESTAMP_HEADER   enables the replay window (optional)
  #   MEMQL_INBOUND_SOURCE_<NAME>_DEDUPE_HEADER      sender idempotency key (optional)
  #
  # <NAME> is the source name uppercased with '-' mapped to '_'. The SECRET is
  # secret material and belongs in the deployment's secret store, never in an
  # overlay. A listed source that does not resolve to a usable policy is DROPPED
  # (404), never admitted unverified -- see docs/internal/design/inbound-delivery-adr.md.

  - name: MEMQL_INBOUND_ENABLED
    component: inbound
    scope: node
    optional: true
    default: "true"
    description: "Inbound-delivery receiver on/off. Even when enabled the receiver admits nothing until MEMQL_INBOUND_SOURCE_ALLOWLIST names a source (deny-by-default ingress)."

  - name: MEMQL_INBOUND_SOURCE_ALLOWLIST
    component: inbound
    scope: node
    optional: true
    description: "Comma-separated source names the receiver serves at POST /inbound/{source} (e.g. `shopify,tiktok`). Empty = every request is refused with 404. Each name needs its own MEMQL_INBOUND_SOURCE_<NAME>_* verification policy or it is dropped."

  - name: MEMQL_INBOUND_MAX_BODY_BYTES
    component: inbound
    scope: node
    optional: true
    default: "262144"
    description: "Maximum inbound request body the receiver reads; larger requests are refused with 413 and no row is staged. Bounds what an unauthenticated caller can make the node allocate before the signature check runs."

  - name: MEMQL_INBOUND_TIMESTAMP_TOLERANCE_SECONDS
    component: inbound
    scope: node
    optional: true
    default: "300"
    description: "Replay window for sources that sign a timestamp (MEMQL_INBOUND_SOURCE_<NAME>_TIMESTAMP_HEADER). A request outside the window in either direction is refused even when its signature is valid; without a timestamp header a signature is valid forever and dedupeKey is the only replay defence."

  # --- engine ---

  - name: MEMQL_AUTHORING_CAPTURE_ENABLED
    component: engine
    scope: node
    default: "true"
    optional: true
    description: "Master kill-switch for the planner authoring-capture path; set to a falsy value to disable capture cluster-wide for cost or incident control."

  - name: MEMQL_AUTHORING_CAPTURE_MODE
    component: engine
    scope: node
    default: "transcript"
    optional: true
    description: "Selects the authoring-capture mode, transcript (faithful record of literal calls) or author (the legacy LLM re-authoring path)."

  - name: MEMQL_AUTHORING_MAX_REPAIRS
    component: engine
    scope: node
    default: "4"
    optional: true
    description: "Per-bundle cap on authoring repair attempts before a broken bundle surfaces to the user rather than being retried."

  - name: MEMQL_DEMO_MODE
    component: engine
    scope: node
    default: "false"
    optional: true
    description: "Toggles demo-deployment behavior, notably for the webhook automation step."

  - name: MEMQL_DEPLOYMENT_ID
    component: engine
    scope: node
    default: "local"
    optional: true
    description: "Per-deploy identifier injected by the rollout and stamped on node and deployment records."

  - name: MEMQL_DEPLOY_ARGO_APP
    component: engine
    scope: node
    default: "memql"
    optional: true
    description: "ArgoCD Application name the deploy-pack executor targets; defaults to memql."

  - name: MEMQL_DEPLOY_PROVIDER
    component: engine
    scope: node
    optional: true
    description: "Explicit deploy-provider override; otherwise derived from the environment."

  - name: MEMQL_DEPLOY_REPO_ROOT
    component: engine
    scope: node
    optional: true
    description: "Repository root the deploy-control executor is anchored at; defaults to the process working directory."

  - name: MEMQL_ROWAUTHZ_SHADOW
    component: engine
    scope: node
    default: "false"
    optional: true
    description: "Row-authz SHADOW MODE (memql#2921). When true, the engine computes the predicate each concept's @rowAuthz declaration WOULD inject, decides whether the author's filter already implies it, and records a verdict (already-implied / would-narrow / undecidable). It INJECTS NOTHING: no predicate is added and no query returns a different row set with this on. A measurement tool for the #2803 Phase 3 enforcement ruling, not a production code path -- leave unset. The tree-wide measurement does not need this var at all; run `go test ./component/memql/ -run TestRowAuthzShadowReport -v`."

  - name: MEMQL_DSL_ALLOW_SKIPS
    component: engine
    scope: node
    default: "false"
    optional: true
    description: "Operator break-glass for strict DSL loading (memql#2357, memql#2830). Silences TWO independent gates: (1) engine.Init boots even if a unified loader skipped an in-tree construct or the uniqueness gate found a duplicate registration; (2) the automation loader loads even if an automation failed to read, lower, extract or compile, so the node boots with those automations MISSING. Both still ERROR-log their report. Leave unset (strict) in normal operation -- a skipped construct or dropped automation means the embedded tree or a pack half-loaded."

  - name: MEMQL_ENVIRONMENT
    component: engine
    scope: node
    default: "development"
    optional: true
    description: "Environment label stamped on system.startup events and metadata enrichment."

  - name: MEMQL_GENESIS_PATH
    component: engine
    scope: node
    default: "~/.memql/genesis.znas"
    optional: true
    description: "Path to the sealed genesis envelope that the engine decrypts at bootstrap."

  - name: MEMQL_MANIFEST_PATH
    component: engine
    scope: node
    optional: true
    description: "Explicit path to the secrets manifest.yaml, taking precedence over MEMQL_REPO and the embedded copy."

  - name: MEMQL_PUBLIC_PATH
    component: engine
    scope: node
    default: "/"
    optional: true
    description: "Base path prefix for the engine's HTTP handlers."

  - name: MEMQL_REGION
    component: engine
    scope: node
    default: "local"
    optional: true
    description: "Region label applied to events, deployment records, and metadata enrichment."

  - name: MEMQL_REPO
    component: engine
    scope: node
    optional: true
    description: "Repository root used to locate scripts/secrets/manifest.yaml when MEMQL_MANIFEST_PATH is unset."

  - name: MEMQL_TASKSTAMP_SELF_PLANNING_TOOLS
    component: engine
    scope: node
    optional: true
    description: "Comma-separated tool names added to the default self-planning set so ad-hoc calls to them are not wrapped in a synthetic adHocAction Plan."

  # --- transport ---

  - name: MEMQL_GRPC_ADDRESS
    component: transport
    scope: node
    required: ["all"]
    default: ":50051"
    optional: true
    description: "MemqlService gRPC listen address for this node."

  - name: MEMQL_GRPC_ENDPOINT
    component: transport
    scope: node
    optional: true
    description: "Target gRPC endpoint the secrets-seed and rolling-drain CLIs dial when no explicit flag is passed."

  # --- portal ---

  - name: MEMQL_PORTAL_DIST
    component: portal
    scope: node
    optional: true
    default: "/app/portal"
    description: "Directory the bff serves the memQL Portal SPA bundle from (GET /portal/*, memql#3314). The default is the image layout; point it at clients/portal/dist to serve a locally-built bundle. A missing directory logs one warning at boot and answers 404 -- it never fails the node."

  - name: MEMQL_PORTAL_OAUTH_CLIENT_ID
    component: portal
    scope: node
    optional: true
    default: "portal"
    description: "Public OAuth client_id the memQL Portal presents to the identity service (memql#3315). Published in GET /portal/runtime-config.json; the operator must register the same id with the portal's callback URI in MEMQL_IDENTITY_REGISTERED_CLIENTS. Override only when 'portal' is already taken on this identity service."

  - name: MEMQL_PORTAL_IDENTITY_URL
    component: portal
    scope: node
    optional: true
    description: "Browser-reachable identity-service origin the memQL Portal sends operators to for magic-link / OAuth sign-in (memql#3315). Rarely needed: the node derives it from MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER (the OIDC issuer, which is public by construction) and falls back to MEMQL_IDENTITY_BASE_URL. Set only when the issuer is not the URL a browser should dial. NOT MEMQL_IDENTITY_VERIFIER_BASE_URL -- that is the in-cluster address and does not resolve in a browser."

  - name: MEMQL_PORTAL_IDENTITY_API_BASE_URL
    component: portal
    scope: node
    optional: true
    description: "Where the memQL Portal's browser sends its identity JSON calls -- POST /oauth/token, /auth/refresh, /auth/logout (memql#3315). Set to the literal 'self' when the front door proxies those paths to identity on the portal's own origin, which is the topology docs/public/operate/auth/identity-service.md prescribes (it sidesteps a Safari HTTP/2 coalescing bug that intermittently fails cross-origin credentialed XHR). Unset defaults to the identity origin, which additionally needs the portal's origin in MEMQL_IDENTITY_CORS_ALLOWED_ORIGINS. Only affects XHR; the top-level /authorize navigation always goes to the identity origin."

  # --- cluster ---

  - name: MEMQL_CLUSTER_ID
    component: cluster
    scope: node
    optional: true
    description: "Identifier stamped on deployment and cut-version records to attribute them to a cluster."

  - name: MEMQL_NODE_ADDRESS
    component: cluster
    scope: node
    optional: true
    description: "Address peers dial back to reach this node; required in cluster mode."

  - name: MEMQL_NODE_FLAVOR
    component: cluster
    scope: node
    optional: true
    description: "Optional node sub-type metadata reserved for future use."

  - name: MEMQL_NODE_ID
    component: cluster
    scope: node
    default: "auto-generated UUID"
    optional: true
    description: "Stable identifier for this node instance, injected per pod via the k8s downward API."

  - name: MEMQL_NODE_LABELS
    component: cluster
    scope: node
    optional: true
    description: "Comma-separated key=value metadata labels attached to this node."

  - name: MEMQL_NODE_SERVICE_ADDRESS
    component: cluster
    scope: node
    default: ":50052"
    optional: true
    description: "NodeService gRPC listen address used for inter-node mesh communication."

  - name: MEMQL_NODE_TYPE
    component: cluster
    scope: node
    default: "bff"
    optional: true
    description: "Node role for untagged binaries; a compiled build tag takes precedence over this value."

  - name: MEMQL_PARENT_ADDRESS
