# memQL dev-secrets manifest
# ==========================
#
# Authoritative list of the secrets and variables a developer's local
# memQL needs for full-feature development. Values are NOT in this
# file -- each developer keeps them in ~/.memql/dev-secrets.yaml
# (gitignored). `make secrets-init` walks this manifest and prompts
# the developer; `make secrets-seed` reads their yaml and pushes the
# encrypted values into the running memQL's concept storage.
#
# Scope values:
#   - global:    row lives in the _system partition
#                (v1:platform:globalVariable / v1:platform:globalSecret)
#   - partition: row lives in the currently selected partition
#                (v1:platform:partitionVariable / v1:platform:partitionSecret)
#
# Kind values (optional, secret-only):
#   - vendor_api_key: router BYOK credential
#   - oauth_secret:   OAuth client secret
#   - integration:    generic integration credential
#
# optional: true  -- the entry is documented + sealed when present, but is
#   NOT part of the required floor (a .env that omits it still seals). Use for
#   secrets only some deployments carry (e.g. IDENTITY_SIGNING_KEY_B64, needed
#   by the HA identity manifest but not by local-dev disk-key mode). memql#619.
#
# See docs/planning/env-var-refactor-plan.md for the decision history.

# ---------------------------------------------------------------------
# Secrets (encrypted, sealed under MEMQL_MASTER_KEY)
# ---------------------------------------------------------------------

secrets:
  - name: OPENAI_API_KEY
    scope: global
    kind: vendor_api_key
    description: Instance-wide OpenAI API key. Used for chat, TTS, STT, and Realtime providers unless a tenant has their own partition-scoped key.

  - name: ANTHROPIC_API_KEY
    scope: global
    kind: vendor_api_key
    description: Instance-wide Anthropic API key. Used for Claude chat / vision providers unless overridden per tenant.

  - name: IDENTITY_KEY_ENCRYPTION_KEY
    scope: global
    kind: integration
    description: Master secret (>=16 bytes) wrapping the identity service's on-disk Ed25519 signing keypair (disk-key mode). Required in production only when IDENTITY_SIGNING_KEY_B64 is NOT set (i.e. the legacy on-disk KeyDir path).

  - name: IDENTITY_SIGNING_KEY_B64
    scope: global
    kind: integration
    optional: true
    description: Base64 (std) 32-byte Ed25519 signing seed (#550/#619). When set, identity runs in envMode -- every replica derives the SAME key + kid + JWKS from this seed, so identity needs NO single-writer RWO key PVC and runs >=2 replicas (HA). REQUIRED for the HA deploy/k8s/identity.yaml manifest; absent only in local-dev disk-key mode. Optional here so local seals don't fail; staging/prod envelopes MUST carry it. Rotate by re-sealing a new seed + rolling identity.

  - name: EMAIL_AZURE_CLIENT_SECRET
    scope: global
    kind: oauth_secret
    description: Azure Graph API client secret used by the email integration. (Legacy name `AZURE_CLIENT_SECRET` is still accepted as a fallback by integrations/email; remove the old row from the running memQL once everyone has re-seeded.)

  - name: ANAM_API_KEY
    scope: global
    kind: integration
    description: Anam avatar API key (server-side). Used by the voice-agent and the direct/Guide avatar path to mint/resolve Anam personas.

  - name: SIMLI_API_KEY
    scope: global
    kind: integration
    description: Simli avatar API key (server-side). Used by the voice-agent and the direct/Guide avatar path to mint/resolve Simli faces.

# ---------------------------------------------------------------------
# Plaintext variables (non-sensitive config)
# ---------------------------------------------------------------------

variables:
  - name: IDENTITY_BASE_URL
    scope: global
    description: Public origin of the identity service (e.g. https://auth.example.com). Used as JWT `iss` and in outbound email links.

  - name: IDENTITY_VERIFIER_BASE_URL
    scope: global
    description: URL non-identity binaries fetch JWKS from. Typically equals IDENTITY_BASE_URL; override only when internal-mesh routing differs from the public origin.

  - name: EMAIL_AZURE_TENANT_ID
    scope: global
    description: Azure AD tenant ID for the email integration's Microsoft Graph sender. (Legacy name `AZURE_TENANT_ID` still accepted by integrations/email as a fallback.)

  - name: EMAIL_AZURE_CLIENT_ID
    scope: global
    description: Azure AD application ID for the email integration's Microsoft Graph sender. (Legacy name `AZURE_CLIENT_ID` still accepted.)

  - name: EMAIL_SENDER
    scope: global
    description: Email address used as the sender for transactional mail (e.g. no-reply@znas.io). (Legacy name `MAIL_SENDER` still accepted.)

  - name: EMAIL_FROM_NAME
    scope: global
    default: memQL
    description: Display name shown in the From header of transactional mail. (Legacy name `MAIL_FROM_NAME` still accepted.)
