    description: "When truthy (1/true/yes/on), creates the configured blob container on startup if it is missing; used for local Azurite dev where the container is not pre-provisioned."

  - name: MEMQL_AZURE_BLOB_CONTAINER
    component: storage
    scope: node
    optional: true
    description: "Name of the Azure blob container the uploader writes objects into."

  # --- planner ---

  - name: MEMQL_PLANNER_APPROVAL_TOKEN_THRESHOLD
    component: planner
    scope: node
    default: "250000"
    optional: true
    description: "Up-front estimated token cost at or below which a plan auto-runs; above it the plan parks for user approval, and 0 disables the gate."

  - name: MEMQL_PLANNER_DEFAULT_TOKEN_BUDGET
    component: planner
    scope: node
    default: "2000000"
    optional: true
    description: "Fallback per-plan token ceiling enforced when a plan carries no explicit token budget; 0 disables the fallback."

  - name: MEMQL_PLANNER_GOAL_TRIAGE_ENABLED
    component: planner
    scope: node
    default: "true"
    optional: true
    description: "Enables the goal triage step that routes trivial deliverables direct; setting it off falls every goal back to the decompose loop."

  - name: MEMQL_PLANNER_MAX_IDENTICAL_DECISIONS
    component: planner
    scope: node
    default: "2"
    optional: true
    description: "Number of times the same non-terminal decision may repeat within one planner cycle before the loop parks."

  - name: MEMQL_PLANNER_MAX_INVOCATIONS_PER_PLAN
    component: planner
    scope: node
    default: "8"
    optional: true
    description: "Cumulative cap on plannerAgent invocations per plan before it parks, bounding runaway spend."

  - name: MEMQL_PLANNER_MAX_ITERATIONS_PER_CYCLE
    component: planner
    scope: node
    default: "5"
    optional: true
    description: "Per-cycle cap on planner loop iterations that stops a misbehaving model from spinning forever."

  - name: MEMQL_PLANNER_PHASE_CHECKPOINTS_ENABLED
    component: planner
    scope: node
    default: "true"
    optional: true
    description: "Enables phase-boundary checkpoints that pause a plan for user continuation between non-trivial phases."

  - name: MEMQL_PLANNER_PHASE_CHECKPOINT_MIN_TASKS
    component: planner
    scope: node
    default: "2"
    optional: true
    description: "Expected task count at or above which the next phase triggers a checkpoint; 0 checkpoints at every boundary."

  - name: MEMQL_PLANNER_REASONING_ESCALATION_ITER
    component: planner
    scope: node
    default: "3"
    optional: true
    description: "Per-cycle iteration at which the loop escalates from the cheap tier to the reasoning tier; a value of 0 or less disables escalation."

  - name: MEMQL_PLANNER_REASONING_PROVIDER
    component: planner
    scope: node
    default: "reasoningClaudeOpus"
    optional: true
    description: "Provider the planner loop escalates to for hard plans; an empty or whitespace override is ignored."

  - name: MEMQL_PLANNER_SECTIONABLE_ENABLED
    component: planner
    scope: node
    default: "true"
    optional: true
    description: "Enables the generated parallel sectionable-plan path; setting it off falls back to the serial decompose loop."

  - name: MEMQL_PLANNER_SPECIALIST_GATE_ENABLED
    component: planner
    scope: node
    default: "true"
    optional: true
    description: "Enables the gate guarding specialist creation and training; setting it off restores the always-allow behavior."

  # --- safety ---

  - name: MEMQL_ACTION_REPLAY_ENABLED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Enables action-library literal replay so fingerprinted steps replay recorded capability calls token-free instead of re-invoking the LLM."

  - name: MEMQL_ACTION_UTTERANCE_ALLOWLIST_ENFORCE
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "When true, action utterances must match one of the configured allowlist prefixes or they are rejected."

  - name: MEMQL_ACTION_UTTERANCE_ALLOWLIST_PREFIXES
    component: safety
    scope: node
    optional: true
    description: "Comma-separated list of allowed action-utterance prefixes; empty means no allowlist is applied."

  - name: MEMQL_ACTION_UTTERANCE_MAX_BYTES
    component: safety
    scope: node
    default: "65536"
    optional: true
    description: "Maximum byte size of an action-utterance payload, with a hard 1024-byte safety floor against misconfiguration."

  - name: MEMQL_AUTOMATION_BUDGET_ENABLED
    component: safety
    scope: node
    default: "true"
    optional: true
    description: "Enables the cross-executor automation execution budget that skips executions once a storm exceeds the configured caps."

  - name: MEMQL_AUTOMATION_BUDGET_WINDOW_SECONDS
    component: safety
    scope: node
    default: "60"
    optional: true
    description: "Rolling window in seconds over which automation execution counts are accumulated for the budget caps."

  - name: MEMQL_DELEGATION_ENABLED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Enables agent delegation, allowing an agent to act through a user's identity under a bounded role, scope, and lifetime."

  - name: MEMQL_MAX_AUTOMATION_EXECUTIONS_PER_AUTOMATION
    component: safety
    scope: node
    default: "120"
    optional: true
    description: "Per-automation execution ceiling within the budget window before further executions of that automation are skipped."

  - name: MEMQL_MAX_AUTOMATION_EXECUTIONS_PER_WINDOW
    component: safety
    scope: node
    default: "600"
    optional: true
    description: "Global cross-executor execution ceiling within the budget window before further automation executions are skipped."

  - name: MEMQL_MAX_UNGUARDED_AUTOMATION_EXECUTIONS_PER_WINDOW
    component: safety
    scope: node
    default: "50"
    optional: true
    description: "Cap on unguarded automation executions admitted per window during a database outage fail-open before the cluster guard fails closed."

  - name: MEMQL_UNGUARDED_AUTOMATION_WINDOW_SECONDS
    component: safety
    scope: node
    default: "60"
    optional: true
    description: "Rolling window in seconds over which the cluster guard counts unguarded automation executions during a database outage."

  # --- workbench ---

  - name: MEMQL_WORKBENCH_REMOTE
    component: workbench
    scope: node
    optional: true
    description: "When truthy, agent nodes route workbench dispatch to a dedicated remote workbench node via NodeService.Stream instead of running the integration in-process."

  # --- worker ---

  - name: MEMQL_WORKER_DIAL_ENDPOINT
    component: worker
    scope: node
    optional: true
    description: "Explicit operator override for the gRPC address the cockpit-worker dials for WorkerService.Stream on the agent node; falls back to derivation from the stored pairing URL when empty. Write the SCHEME (https://agent.example.com for TLS, http://... for plaintext) -- the value is relayed to the worker, which reads a bare host:port as plaintext no matter which port it names (memql#3437)."

  - name: MEMQL_WORKER_PEERS
    component: worker
    scope: node
    optional: true
    description: "Comma-separated type=host:port seed list of worker nodes for cluster bootstrap; DB-based discovery via v1:cluster:node takes over once peers register."

  # --- mcp ---

  - name: MEMQL_MCP_AUTH_SERVER_URL
    component: mcp
    scope: node
    optional: true
    description: "Public OAuth authorization-server issuer advertised by the MCP HTTP head's Protected Resource Metadata; falls back to MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER when unset."

  - name: MEMQL_MCP_HTTP_ADDR
    component: mcp
    scope: node
    default: ":8090"
    optional: true
    description: "Bind address for the MCP Streamable HTTP transport listener."

  - name: MEMQL_MCP_MODE
    component: mcp
    scope: node
    default: "authoring"
    optional: true
    description: "MCP capability tier (Gate A), one of sealed, authoring, or inline."

  - name: MEMQL_MCP_PUBLIC_URL
    component: mcp
    scope: node
    optional: true
    description: "Public URL of the MCP resource advertised in OAuth discovery metadata and the 401 WWW-Authenticate hint."

  - name: MEMQL_MCP_ROLE
    component: mcp
    scope: node
    optional: true
    description: "Acting role for the per-construct gate (Gate B); empty pins the role to the caller's verified token claim on HTTP."

  - name: MEMQL_MCP_TOOL_TIMEOUT
    component: mcp
    scope: node
    default: "30s"
    optional: true
    description: "Per-tools/call engine execution deadline as a Go duration; unset or invalid falls back to the default."

  - name: MEMQL_MCP_TRANSPORT
    component: mcp
    scope: node
    default: "stdio"
    optional: true
    description: "MCP transport selector, stdio for a local subprocess or http for the network listener."

  - name: MEMQL_MCP_USER
    component: mcp
    scope: node
    optional: true
    description: "Acting user that session-authored constructs are owner-scoped to; empty takes the user from the caller's token on HTTP."

  # --- observability ---

  - name: MEMQL_GEOIP_DB_PATH
    component: observability
    scope: node
    optional: true
    description: "Path to a GeoIP database; absent disables GeoIP enrichment."

