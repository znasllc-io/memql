    description: "DEPRECATED legacy alias for MEMQL_EMAIL_AZURE_CLIENT_SECRET; resolved via the boot-time alias shim. Remove after operators migrate."

  - name: IDENTITY_KEY_ENCRYPTION_KEY
    component: identity
    scope: global
    kind: integration
    optional: true
    description: "DEPRECATED legacy alias for MEMQL_IDENTITY_KEY_ENCRYPTION_KEY; resolved via the boot-time alias shim. Remove after operators migrate."

  - name: IDENTITY_SIGNING_KEY_B64
    component: identity
    scope: global
