# Native test budgets. Keep operation deadlines and package selections unchanged.
# The native runner tests pin the effective commands, selections and budgets.
databaseParallelism: 4
classes: |
  # lane  class     trees               timeout  mode      shards
  go      root      .                   300s     uncached  1
  go      default   -                   600s     -         3
  # component/memql on the bounded AKS runner, read from each step's `ok` line
  # in the log store: median 534s on 2026-10-16..20, 765s on 10-26..31, and 852s
  # from 11-01 18:00Z, when 4 of 13 runs exhausted the 900s alarm. A tree's
  # slower runs reach about 7% over its median. The 3223 tests common to 10-20
  # and 11-02 take the same time on both trees side by side; the 335 added since
  # cost the rest, at about 25s a day. Expect this alarm again near a 1120s
  # median.
  # The full engine shard passed in 582s on the bounded AKS runner, then
  # exhausted its 600s package alarm while a new test was only 1s old.
  # Allow aggregate suite headroom; retain every test, its operation
  # deadlines, the isolated database and the same execution resources.
  # The consolidated tree passed every other shard, then twice exhausted the 900s
  # package alarm while a new test was 0s and 3s old; the same shard took 838s
  # on the tree before it. Give the suite headroom; keep every test and its
  # operation deadlines.
  db      memql     component/memql     1200s    serial    2
  db      packages  component/packages  300s     -         1
  # All 809 Work cases pass in 176.217s on the bounded AKS runner.
  # Give this whole package headroom over the old 180s alarm; keep
  # its operation deadlines, uncached native pass and isolated DB.
  # By 2026-11-02 the median was 245s and the worst pass 278s of 300s, from 154s
  # and 184s on 10-16..20. Keep the same 1.7 times the worst pass.
  db      work      integrations/work  480s     serial    1
  # Revision workflows exercise two engines and must not compete with other DB suites.
  # Flat at a median near 135s since 10-16, but its worst pass reached 179.9s of
  # 180s, and 150.5s on 11-02. Give it 300s.
  db      library   integrations/library 300s   serial    1
  # The release suite passes in 154s on a laptop. With the same-tree reuse cases
  # it exhausted the 180s alarm on the bounded AKS runner while a new test was
  # only 3s old. Give the whole package headroom; keep every test and its
  # operation deadlines.
  # memql#6429's 38 tests took it from 81s to 238s side by side on a laptop, and
  # from a median of 150s to this alarm on both main runs of 2026-11-02, where
  # every other package kept its usual time. 90s of the rise is a real wait: six
  # tests run out githubrelease's settleDelays of 15s, which this package cannot
  # shorten. The rest scales about 1.9 times on the runner, so expect about 370s.
  db      release   integrations/release 600s   serial    1
  # The installation suite went from a median of 37s on 10-16..20 to 141s on
  # 11-02, with a worst pass of 162s of the default class's 180s. Give it its own
  # 300s; keep every test and its operation deadlines.
  # 17168d044 and 7d88c9f3c (2026-11-09) added the restore-lifecycle and
  # receiver-churn database suites, including end-to-end prepare, Apply,
  # completion and Restore runs: the package now takes 236s-317s on a laptop
  # and exhausted the 300s alarm on the bounded AKS runner (main's push runs for
  # e1d22855f and 7d88c9f3c, db-tests#5, 301.9s), where slower packages run
  # about 1.9 times their laptop time. 900s keeps 1.5 times an expected worst
  # pass near 600s; keep every test and its operation deadlines.
  db      installation integrations/installation 900s serial 1
  # Campaigns now covers 498 cases, including independent two-engine hops.
  # Keep each lock/write deadline assertion; give the full suite its own budget.
  db      campaigns component/campaigns 600s     serial,uncached 1
  # The email statistics rollup walks shared watermarks over the campaign rows,
  # so its suite runs alone and uncached; about 10s on a laptop.
  db      emailstats component/emailstats 300s   serial,uncached 1
  # The store mirror's suites (recording, held deliveries, privacy erasure) boot
  # a real engine for most cases. Side by side with main on a laptop, with this
  # lane's flags, integrations/shopify went from 21s to 125s and
  # component/datasync from 7s to 61s: about 6 and 9 times. From the 51s and
  # 15s the bounded AKS runner recorded for them (shard-timings.tsv), expect
  # about 310s and 135s, past or close to the default class's 180s. Each gets
  # its own class at about twice that; keep every test and its operation
  # deadlines.
  db      shopify   integrations/shopify 600s    serial    1
  db      datasync  component/datasync  300s     serial    1
  db      default   -                   180s     -         2
