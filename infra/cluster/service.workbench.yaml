# Cloud Run service configuration for the Workbench node.
#
# The workbench node hosts the per-Plan sandboxed Linux working
# environment that agent nodes call into for headless work (shell
# exec, filesystem, http_fetch). Per-Plan workspaces live on a
# GCS-FUSE mount at /var/lib/memql/workbenches so they persist
# across Cloud Run instance restarts and revision deploys.
#
# Provisioning the backing bucket (one-time, run from a shell with
# gcloud configured for the project):
#
#   PROJECT=fast-fire-486523-f3
#   BUCKET=memql-workbench-data
#   gcloud storage buckets create gs://${BUCKET} \
#     --project=${PROJECT} \
#     --location=us-central1 \
#     --uniform-bucket-level-access \
#     --soft-delete-duration=0d
#
#   # Grant the runtime SA write access:
#   gcloud storage buckets add-iam-policy-binding gs://${BUCKET} \
#     --member="serviceAccount:memql-runtime@${PROJECT}.iam.gserviceaccount.com" \
#     --role=roles/storage.objectUser \
#     --project=${PROJECT}
#
# The agent node must have MEMQL_WORKBENCH_REMOTE=1 in its env AND
# either MEMQL_PARENT_ADDRESS or a `workbench=<address>` entry in
# MEMQL_WORKER_PEERS so the WorkerDialer connects to this service.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: memql-workbench
  labels:
    memql-node-type: workbench
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # GCS-FUSE second-gen volume mount. The mount is per-instance,
        # not shared across instances -- per-Plan workspaces under
        # /var/lib/memql/workbenches/{planId}/ live as object-prefixes
        # in the bucket so they survive cold-start and concurrent
        # instances reading the same Plan see the same files.
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 30
      timeoutSeconds: 900
      containers:
        - image: us-central1-docker.pkg.dev/fast-fire-486523-f3/memql/memql-workbench:latest
          ports:
            - containerPort: 50058
              name: h2c
          env:
            - name: MEMQL_NODE_TYPE
              value: workbench
            - name: MEMQL_NODE_SERVICE_ADDRESS
              value: ":50058"
            - name: MEMQL_GRPC_ADDRESS
              value: ":50051"
            # Workspace root resolves to the GCS-FUSE mount below.
            - name: MEMQL_WORKBENCH_ROOT
              value: /var/lib/memql/workbenches
          resources:
            limits:
              # Workbench exec / http_fetch work is CPU-bursty; give
              # headroom for parallel tool calls within a single
              # instance (containerConcurrency=30).
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: workspaces
              mountPath: /var/lib/memql/workbenches
      volumes:
        - name: workspaces
          csi:
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: memql-workbench-data
              # Best-effort POSIX-like semantics for the workbench's
              # write patterns. The workbench writes small files
              # (notes.md / scratch outputs) and reads them back
              # within the same Plan, so file-mode latency dominates;
              # implicit-dirs=true lets fs_list show directories that
              # exist only as object prefixes.
              mountOptions: "implicit-dirs,file-mode=644,dir-mode=755"
