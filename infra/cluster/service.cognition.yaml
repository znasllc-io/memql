# Cloud Run service configuration for the Cognition node.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: memql-cognition
  labels:
    memql-node-type: cognition
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 3600
      containers:
        - image: us-central1-docker.pkg.dev/fast-fire-486523-f3/memql/memql-cognition:latest
          ports:
            - containerPort: 50054
              name: h2c
          env:
            - name: MEMQL_NODE_TYPE
              value: cognition
            - name: MEMQL_NODE_SERVICE_ADDRESS
              value: ":50054"
            - name: MEMQL_GRPC_ADDRESS
              value: ":50051"
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
