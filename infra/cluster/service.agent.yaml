# Cloud Run service configuration for the Agent node.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: memql-agent
  labels:
    memql-node-type: agent
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containerConcurrency: 50
      timeoutSeconds: 900
      containers:
        - image: us-central1-docker.pkg.dev/fast-fire-486523-f3/memql/memql-agent:latest
          ports:
            - containerPort: 50055
              name: h2c
          env:
            - name: MEMQL_NODE_TYPE
              value: agent
            - name: MEMQL_NODE_SERVICE_ADDRESS
              value: ":50055"
            - name: MEMQL_GRPC_ADDRESS
              value: ":50051"
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
