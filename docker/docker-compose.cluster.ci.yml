# CI / co-tenant override for the staging-parity cluster (memql#1261).
#
#   docker compose -f docker/docker-compose.cluster.yml \
#                  -f docker/docker-compose.cluster.ci.yml up -d
#
# Two jobs, both in service of running the cluster-e2e delivery gate
# (test/clustere2e) unattended -- in GitHub Actions, or locally NEXT TO an
# second cluster on the same daemon without fighting over host
# ports:
#
#   1. PORT ISOLATION + PLAIN FRONT DOOR. The base compose publishes
#      postgres:5432, identity:8081, azurite:10000 on the host and serves the
#      nginx front door at the TLS *.${DOMAIN} subdomains on :443 (memql#1313).
#      CI has no mkcert root CA, so a TLS front door fails verification, and
#      the host publishes collide with a second cluster. So this override:
#        - drops the singleton host publishes (`!override []`),
#        - swaps the nginx TLS templates for the plain-HTTP single-origin
#          config (docker/nginx/nginx.ci.conf) and republishes the plain
#          front door on :8085 (HTTP) / :50050 (gRPC) the harness drives,
#        - overrides the identity OAuth redirect to the localhost:8085 form
#          the harness uses (the base registers https://app.${DOMAIN}).
#      Everything still talks over the memql-cluster network by service name.
#      Requires Docker Compose v2.24+ for the !override / !reset merge tags.
#
#   2. NON-INTERACTIVE USER SEED. The base cluster runs identity in
#      `waitlist` registration; a fresh-DB CI cluster therefore has no users
#      and no way to self-register without an operator. We flip it to `open`
#      so scripts/test/cluster-e2e.sh can mint a probe user + token through
#      the first-run /setup owner path. This is a TEST-ONLY relaxation; the
#      base compose (and staging) keep waitlist.

# Both jobs use the compose `!override` / `!reset` merge tags (Docker Compose
# v2.24+). The singleton services pin a fixed `container_name` (memql-db,
# memql-identity, memql-lb, memql-azurite, memql-livekit) that collides with
# a second cluster on the same daemon; we !reset them so Compose auto-names
# each `<project>-<service>-N` and a co-tenant cluster coexists.
# Services stay reachable by SERVICE NAME on the cluster network regardless.
services:
  postgres:
    ports: !override []
    container_name: !reset null

  # PgBouncer transaction pooler (memql#1932): same co-tenant treatment as
  # postgres -- drop the host publish of 6432 and reset the fixed name so two
  # CI clusters on one daemon don't collide. The mesh still reaches it by the
  # `pgbouncer` service name on the cluster network.
  pgbouncer:
    ports: !override []
    container_name: !reset null

  identity:
    ports: !override []
    container_name: !reset null
    environment:
      # Test-only: allow the seed step to register a probe user without an
      # operator approving a waitlist entry. NEVER set this on staging/prod.
      IDENTITY_REGISTRATION_MODE: open
      # SERVICE_NAME is normally supplied by the genesis env envelope; set it
      # explicitly so the cluster boots against a minimal CI .env.local that
      # doesn't carry the per-service genesis vars.
      SERVICE_NAME: memQL-identity
      # CI plain front door (memql#1313): the harness drives the OAuth flow
      # through http://localhost:8085, so register the copresent callback +
      # the identity base URL on that origin instead of the dev TLS
      # app.${DOMAIN}/identity.${DOMAIN} subdomains. TEST-ONLY.
      IDENTITY_BASE_URL: http://localhost:8085
      IDENTITY_REGISTERED_CLIENTS: '[{"clientId":"copresent","redirectURIs":["http://localhost:8085/auth/callback"]},{"clientId":"cockpit","redirectURIs":["http://127.0.0.1/cockpit/callback","http://localhost/cockpit/callback"]}]'
      IDENTITY_CORS_ALLOWED_ORIGINS: "http://localhost:8085"
      # The issuer claim baked into JWTs must match what the bff verifier
      # expects; pin both to the plain front door for the CI gate.
      IDENTITY_VERIFIER_EXPECTED_ISSUER: http://localhost:8085

  # SERVICE_NAME is normally supplied per-node by the genesis env envelope;
  # set it explicitly for every node so the cluster boots against a minimal
  # CI .env.local that doesn't carry the per-service genesis vars.
  # The mesh nodes verify JWTs against the issuer baked into the token. The
  # CI identity issues with IDENTITY_BASE_URL=http://localhost:8085 (above),
  # so every verifier's expected issuer must match that plain front door,
  # not the dev TLS https://identity.${DOMAIN}. TEST-ONLY.
  bff:
    environment:
      SERVICE_NAME: memQL-bff
      IDENTITY_VERIFIER_EXPECTED_ISSUER: http://localhost:8085

  cognition:
    environment:
      SERVICE_NAME: memQL-cognition
      IDENTITY_VERIFIER_EXPECTED_ISSUER: http://localhost:8085

  agent:
    environment:
      SERVICE_NAME: memQL-agent
      IDENTITY_VERIFIER_EXPECTED_ISSUER: http://localhost:8085

  planner:
    environment:
      SERVICE_NAME: memQL-planner
      IDENTITY_VERIFIER_EXPECTED_ISSUER: http://localhost:8085

  voice:
    environment:
      SERVICE_NAME: memQL-voice
      IDENTITY_VERIFIER_EXPECTED_ISSUER: http://localhost:8085

  workbench:
    environment:
      SERVICE_NAME: memQL-workbench
      IDENTITY_VERIFIER_EXPECTED_ISSUER: http://localhost:8085

  # Swap the TLS template front door for the plain-HTTP single-origin CI
  # config and republish the plain front door (:8085 HTTP / :50050 gRPC) the
  # harness drives. !override on volumes replaces the base templates+certs
  # mounts entirely (mounting nginx.ci.conf at /etc/nginx/nginx.conf); the
  # DOMAIN / NGINX_ENVSUBST_FILTER env are inert for this static config.
  nginx:
    container_name: !reset null
    volumes: !override
      - ./nginx/nginx.ci.conf:/etc/nginx/nginx.conf:ro
    ports: !override
      - "8085:8080"
      - "50050:50051"

  azurite:
    ports: !override []
    container_name: !reset null

  livekit:
    container_name: !reset null
