# Docker Compose for memQL development (multi-node cluster).
#
# Runs the cluster: bff + cognition + agent + planner. Voice is
# opt-in via the polyphon overlay (docker-compose.polyphon.yml) since
# its STT/TTS providers want extra config the text-only flow doesn't
# need.
#
# Usage:
#   docker compose -f docker/docker-compose.full.yml up --build
#   docker compose -f docker/docker-compose.full.yml down

# Compose project name -- shows up as the stack label in
# `docker compose ls` and `docker ps` instead of the directory-derived
# default ("docker"). Keep this in sync with the cluster.yml +
# top-level compose so each topology is identifiable at a glance.
name: memql-cluster

services:
  # Shared PostgreSQL + TimescaleDB + pgvector
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: memql-db
    hostname: postgres
    environment:
      POSTGRES_USER: memql
      POSTGRES_PASSWORD: memql_dev
      POSTGRES_DB: memql
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memql"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - memql
    restart: unless-stopped

  # BFF node -- backend for frontend (domain-specific), primary API surface
  bff:
    build:
      context: ..
      dockerfile: docker/memql.Dockerfile
      args:
        BUILD_TAGS: bff
    container_name: memql-bff
    hostname: bff
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      MEMQL_NODE_TYPE: bff
      MEMQL_NODE_ID: bff-local
      MEMQL_NODE_ADDRESS: bff:50058
      MEMQL_NODE_SERVICE_ADDRESS: ":50058"
      MEMQL_NODE_FLAVOR: ""
      # Inter-node peer auth (memql#338). MEMQL_BFF_NODE_TOKEN is
      # minted by scripts/dev/mint-node-tokens.sh and exported into
      # the calling shell by scripts/dev/refresh.sh's step4b before
      # the cluster nodes get force-recreated. First-time
      # `docker compose up` before that step runs leaves
      # MEMQL_NODE_TOKEN empty -- the inter-node interceptor then
      # rejects every peer call with `authorization header missing`
      # until the bootstrap completes. Operators using
      # `docker compose up` directly should run:
      #   make dev-node-tokens-bootstrap
      #   source .env.local.node-tokens
      #   docker compose -f docker/docker-compose.full.yml \
      #       up -d --force-recreate bff voice cognition agent planner
      # Matches the same shell-interpolation pattern as
      # VOICE_AGENT_TOKEN (see docker-compose.polyphon.yml).
      MEMQL_NODE_TOKEN: ${MEMQL_BFF_NODE_TOKEN:-}
      # Static seed addresses for WorkerDialer. DB-based discovery
      # (via v1:cluster:node events) takes over once workers register
      # themselves; this is a first-boot safety net so BFF can route
      # AgentGenerate / AgentSuggest forwards before the mesh fills.
      MEMQL_WORKER_PEERS: "voice=voice:50059,agent=agent:50055,cognition=cognition:50054,planner=planner:50056"
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMORY_NODES_DATABASE_AUTO_MIGRATE: "false"
      # Identity verifier defaults to http://identity:8081 (local
      # identity service). Override via env to point elsewhere; no noauth shortcut.
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      # The issuer claim baked into JWTs is the public IDENTITY_BASE_URL
      # (what the browser sees), not the in-cluster service hostname. Bff/
      # voice/cognition/agent/planner verify against that exact value.
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
      # Master key forwarded from the calling shell. Make targets
      # extract it from ~/.memql/dev-secrets.yaml via
      # `go run ./scripts/secrets master-key` and export it before
      # invoking docker compose. .env.local is also loaded above for
      # backwards compat -- if MEMQL_MASTER_KEY is set there it
      # wins over the yaml-passthrough.
      MEMQL_MASTER_KEY: ${MEMQL_MASTER_KEY:-}
      SERVICE_NAME: memQL-bff
      SERVER_ADDRESS: 0.0.0.0:8088
      SERVER_PUBLIC_PATH: /
      SERVER_ALLOWED_ORIGINS: "*"
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVICE_CAPABILITIES_LOGGING: "true"
      SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL: debug
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql
    restart: unless-stopped

  # Nginx -- single TLS entry point for the dev cluster. Routes by
  # Host header to the right backend (SPA, identity, BFF, agent).
  # See docker/nginx/templates/default.conf.template for the full map.
  #
  # Hostnames resolve to 127.0.0.1 via a single wildcard DNS record
  # (`*.${IDENTITY_BOOTSTRAP_DOMAIN} -> 127.0.0.1`) on the operator's
  # owned domain. TLS certs are generated locally with mkcert
  # (`make setup-tls`) for that wildcard.
  #
  # The nginx config is a template -- nginx:alpine processes
  # /etc/nginx/templates/*.template through envsubst on container
  # start, expanding ${DOMAIN} only (per NGINX_ENVSUBST_FILTER) so
  # nginx-internal $host / $scheme / $remote_addr stay literal.
  nginx:
    image: nginx:alpine
    container_name: memql-lb
    hostname: nginx
    environment:
      DOMAIN: ${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # The SPA now runs in the `app` container (app_vite -> app:8080),
      # so the LB no longer needs the host. Kept as a fallback for
      # anyone who reverts app_vite to host.docker.internal:8080 to run
      # Vite natively on the host; host-gateway makes it work on Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      - bff
      - identity
      - agent
    networks:
      - memql
    restart: unless-stopped

  # CoPresent frontend dev server (Vite :8080 + Express :3000), run
  # IN-CONTAINER so local dev needs zero host Node. nginx proxies
  # https://app.${DOMAIN} here via the app_vite upstream. The SPA
  # source is bind-mounted for HMR; node_modules lives in a named
  # volume so the host's (absent / wrong-platform) modules don't
  # shadow the container's. The browser reaches the backend directly
  # through the absolute VITE_* URLs below (TLS-fronted by nginx), so
  # this container only serves SPA assets + the HMR socket -- it does
  # not dial the backend itself. The app definition lives in the
  # sibling copresent repo (bind-mounted at ../../copresent).
  app:
    image: node:22-alpine
    container_name: memql-app
    hostname: app
    working_dir: /app
    # Install deps into the named volume on first boot, then run the
    # full dev stack (Vite + Express). --legacy-peer-deps mirrors the
    # production Dockerfile.
    command: sh -c "npm install --legacy-peer-deps && npm run dev:full"
    environment:
      # Bind both dev servers to 0.0.0.0 so nginx (other container)
      # can reach them; run-app.mjs reads these.
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "8080"
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      # Reliable HMR file-watching across the bind mount on Linux.
      CHOKIDAR_USEPOLLING: "true"
      # The SPA's two SDK deps come from GitHub Packages (see
      # copresent/.npmrc). npm reads this token at install time; export
      # MEMQL_PACKAGES_TOKEN (a GitHub token with read:packages for both
      # the @visionarys-io and @znasllc-io scopes) before dev-refresh.
      NODE_AUTH_TOKEN: ${MEMQL_PACKAGES_TOKEN:-}
      # Browser-facing URLs (absolute, TLS-fronted by nginx). Client id
      # "app" matches the OAuth client registered on the identity
      # service below (IDENTITY_REGISTERED_CLIENTS).
      VITE_MEMQL_WS_URL: wss://bff.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}/memql/ws
      VITE_MEMQL_API_URL: https://bff.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      VITE_IDENTITY_BASE_URL: https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      VITE_IDENTITY_CLIENT_ID: app
    volumes:
      - ../../copresent:/app
      - app_node_modules:/app/node_modules
    networks:
      - memql
    restart: unless-stopped

  # Cognition node -- conversation intelligence (scoring, response generation)
  cognition:
    build:
      context: ..
      dockerfile: docker/memql.Dockerfile
      args:
        BUILD_TAGS: cognition
    container_name: memql-cognition
    hostname: cognition
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Node identity
      MEMQL_NODE_TYPE: cognition
      MEMQL_NODE_ID: cognition-local
      MEMQL_NODE_ADDRESS: cognition:50054
      MEMQL_NODE_SERVICE_ADDRESS: ":50054"
      # Inter-node peer auth (memql#338) -- see the bff service for the
      # full annotation.
      MEMQL_NODE_TOKEN: ${MEMQL_COGNITION_NODE_TOKEN:-}
      # Dial BFF so events originated here (SI responses, presence
      # updates) flow back to BFF's event bus and reach frontend
      # subscribers. Without this the worker has no outbound stream
      # to BFF and EventBridge silently no-ops.
      MEMQL_PARENT_ADDRESS: bff:50058
      # Cognition runs its own WorkerDialer (narrowed to agent peers)
      # so it can forward AgentGenerateTurnMsg to an agent node
      # instead of generating replies locally. Seeded for first-boot;
      # DB discovery via v1:cluster:node takes over once the agent
      # registers.
      MEMQL_WORKER_PEERS: "agent=agent:50055"

      # Database (migrations are external)
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable

      # Master key (see bff service for full context)
      MEMQL_MASTER_KEY: ${MEMQL_MASTER_KEY:-}

      # Server
      SERVICE_NAME: memQL-cognition
      SERVER_ADDRESS: 0.0.0.0:8086
      SERVER_PUBLIC_PATH: /
      SERVER_ALLOWED_ORIGINS: "*"
      MEMQL_GRPC_ADDRESS: ":50051"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      # The issuer claim baked into JWTs is the public IDENTITY_BASE_URL
      # (what the browser sees), not the in-cluster service hostname. Bff/
      # voice/cognition/agent/planner verify against that exact value.
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}

      # Logging
      SERVICE_CAPABILITIES_LOGGING: "true"
      SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL: debug
      MEMORY_ENGINE_CAPABILITIES_LOGGING: "true"
      MEMORY_ENGINE_CAPABILITIES_LOGGING_LOG_LEVEL: debug

    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql
    restart: unless-stopped

  # Planner node -- task planning and orchestration
  planner:
    build:
      context: ..
      dockerfile: docker/memql.Dockerfile
      args:
        BUILD_TAGS: planner
    container_name: memql-planner
    hostname: planner
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Inter-node peer auth (memql#338) -- see the bff service for the
      # full annotation.
      MEMQL_NODE_TOKEN: ${MEMQL_PLANNER_NODE_TOKEN:-}
      # Node identity
      MEMQL_NODE_TYPE: planner
      MEMQL_NODE_ID: planner-local
      MEMQL_NODE_ADDRESS: planner:50056
      MEMQL_NODE_SERVICE_ADDRESS: ":50056"
      MEMQL_PARENT_ADDRESS: bff:50058

      # Database (migrations are external)
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable

      # Master key (see bff service for full context)
      MEMQL_MASTER_KEY: ${MEMQL_MASTER_KEY:-}

      # Server
      SERVICE_NAME: memQL-planner
      SERVER_ADDRESS: 0.0.0.0:8087
      SERVER_PUBLIC_PATH: /
      SERVER_ALLOWED_ORIGINS: "*"
      MEMQL_GRPC_ADDRESS: ":50051"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      # The issuer claim baked into JWTs is the public IDENTITY_BASE_URL
      # (what the browser sees), not the in-cluster service hostname. Bff/
      # voice/cognition/agent/planner verify against that exact value.
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}

      # Logging
      SERVICE_CAPABILITIES_LOGGING: "true"
      SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL: debug
      MEMORY_ENGINE_CAPABILITIES_LOGGING: "true"
      MEMORY_ENGINE_CAPABILITIES_LOGGING_LOG_LEVEL: debug

    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql
    restart: unless-stopped

  # Voice node -- audio I/O pipeline (streaming ASR for in-app dictation,
  # TTS for read-aloud, LiveKit transport when realtime voice is on).
  # The BFF forwards AiTranscribeStream* envelopes here via the
  # AiForwardRouter; without this service the BFF has no peer to proxy
  # to and the streaming-transcribe handler short-circuits with
  # "streaming transcription is not configured" (BFF builds intentionally
  # don't init STT locally -- see app/integrations_voice.go).
  voice:
    build:
      context: ..
      dockerfile: docker/memql.Dockerfile
      args:
        BUILD_TAGS: voice
    container_name: memql-voice
    hostname: voice
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Node identity
      MEMQL_NODE_TYPE: voice
      MEMQL_NODE_ID: voice-local
      MEMQL_NODE_ADDRESS: voice:50059
      MEMQL_NODE_SERVICE_ADDRESS: ":50059"
      MEMQL_PARENT_ADDRESS: bff:50058
      # Inter-node peer auth (memql#338) -- see the bff service for the
      # full annotation.
      MEMQL_NODE_TOKEN: ${MEMQL_VOICE_NODE_TOKEN:-}

      # Database (migrations are external)
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable

      # Master key (see bff service for full context)
      MEMQL_MASTER_KEY: ${MEMQL_MASTER_KEY:-}

      # Server
      SERVICE_NAME: memQL-voice
      SERVER_ADDRESS: 0.0.0.0:8085
      SERVER_PUBLIC_PATH: /
      SERVER_ALLOWED_ORIGINS: "*"
      MEMQL_GRPC_ADDRESS: ":50051"
      # Identity verifier defaults to http://identity:8081 (local
      # identity service). Override via env to point elsewhere; no noauth shortcut.
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      # The issuer claim baked into JWTs is the public IDENTITY_BASE_URL
      # (what the browser sees), not the in-cluster service hostname. Bff/
      # voice/cognition/agent/planner verify against that exact value.
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}

      # Logging
      SERVICE_CAPABILITIES_LOGGING: "true"
      SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL: debug

      # ---- STT provider selection ----
      # Auto-selected default is "deepgram" when MEMQL_DEEPGRAM_API_KEY
      # is set, else "openai-realtime". Valid explicit values:
      # "deepgram", "openai-realtime", "openai-whisper".
      MEMQL_STT_PROVIDER: "${MEMQL_STT_PROVIDER:-}"

      # ---- Deepgram (default when key present) ----
      MEMQL_DEEPGRAM_API_KEY: "${MEMQL_DEEPGRAM_API_KEY:-}"
      POLYPHON_DEEPGRAM_ASR_MODEL: "${POLYPHON_DEEPGRAM_ASR_MODEL:-}"
      POLYPHON_DEEPGRAM_TTS_MODEL: "${POLYPHON_DEEPGRAM_TTS_MODEL:-}"
      POLYPHON_DEEPGRAM_LANGUAGE: "${POLYPHON_DEEPGRAM_LANGUAGE:-}"
      POLYPHON_DEEPGRAM_ENDPOINTING_MS: "${POLYPHON_DEEPGRAM_ENDPOINTING_MS:-}"
      POLYPHON_DEEPGRAM_UTTERANCE_END_MS: "${POLYPHON_DEEPGRAM_UTTERANCE_END_MS:-}"
      POLYPHON_DEEPGRAM_CLIENT_EOU_TIMEOUT_MS: "${POLYPHON_DEEPGRAM_CLIENT_EOU_TIMEOUT_MS:-}"

      # ---- OpenAI (fallback) ----
      # Realtime model name. Defaults to "whisper-1" (universally
      # available + supported by Realtime API's transcription-only mode).
      # Override to "gpt-4o-transcribe" / "gpt-4o-mini-transcribe" if
      # your OpenAI project has access. Falls back to
      # POLYPHON_OPENAI_ASR_MODEL so a single env var can drive both.
      MEMQL_OPENAI_REALTIME_MODEL: "${MEMQL_OPENAI_REALTIME_MODEL:-}"

      # OpenAI Whisper batch fallback when realtime unavailable.
      MEMQL_WHISPER_MODEL: "${MEMQL_WHISPER_MODEL:-whisper-1}"

    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql
    restart: unless-stopped

  # Agent node -- task execution and SI work (where the actual reply
  # generation happens). Cognition decides who should respond + what
  # context to send; agent runs the prompt, the tool-calling loop,
  # and streams deltas back via NodeService.AiForward.
  agent:
    build:
      context: ..
      dockerfile: docker/memql.Dockerfile
      args:
        BUILD_TAGS: agent
    container_name: memql-agent
    hostname: agent
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Node identity
      MEMQL_NODE_TYPE: agent
      MEMQL_NODE_ID: agent-local
      MEMQL_NODE_ADDRESS: agent:50055
      MEMQL_NODE_SERVICE_ADDRESS: ":50055"
      MEMQL_PARENT_ADDRESS: bff:50058
      # Inter-node peer auth (memql#338) -- see the bff service for the
      # full annotation.
      MEMQL_NODE_TOKEN: ${MEMQL_AGENT_NODE_TOKEN:-}

      # Database (migrations are external)
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable

      # Master key (see bff service for full context)
      MEMQL_MASTER_KEY: ${MEMQL_MASTER_KEY:-}

      # Server
      SERVICE_NAME: memQL-agent
      SERVER_ADDRESS: 0.0.0.0:8089
      SERVER_PUBLIC_PATH: /
      SERVER_ALLOWED_ORIGINS: "*"
      MEMQL_GRPC_ADDRESS: ":50051"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      # The issuer claim baked into JWTs is the public IDENTITY_BASE_URL
      # (what the browser sees), not the in-cluster service hostname. Bff/
      # voice/cognition/agent/planner verify against that exact value.
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}

      # Logging
      SERVICE_CAPABILITIES_LOGGING: "true"
      SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL: debug
      MEMORY_ENGINE_CAPABILITIES_LOGGING: "true"
      MEMORY_ENGINE_CAPABILITIES_LOGGING_LOG_LEVEL: debug

    ports:
      - "8089:8089"
      # No raw gRPC port exposure -- nginx terminates TLS on
      # https://agent.${IDENTITY_BOOTSTRAP_DOMAIN}:443 and forwards
      # to agent:50051 in-network. Cockpits and any other external
      # clients dial the hostname; the agent gRPC surface is
      # reachable via that path only.
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql
    restart: unless-stopped

  # Identity node -- in-house auth provider (magic-link, JWT issuance,
  # JWKS publishing, web UI, admin app, PAT management).
  #
  # Always built and brought up so the identity binary is reachable
  # at http://localhost:8081 (browser) and http://identity:8081
  # (in-cluster) for the bff/voice/etc. JWKS verifier path.
  #
  # Auth on the worker nodes (bff/voice/cognition/agent/planner) is
  # ON by default in dev -- IDENTITY_VERIFIER_BASE_URL defaults to
  # http://identity:8081 so the dev stack mirrors production: every
  # gRPC call carries a JWT, every binary verifies against this
  # JWKS feed. The cockpit pairs against the local identity service
  # via `memql-cockpit authorize http://localhost:8081`. There is no
  # noauth shortcut.
  identity:
    build:
      context: ..
      dockerfile: docker/memql.Dockerfile
      args:
        BUILD_TAGS: identity
    container_name: memql-identity
    hostname: identity
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      MEMQL_NODE_TYPE: identity
      MEMQL_NODE_ID: identity-local
      MEMQL_NODE_ADDRESS: identity:50061
      MEMQL_NODE_SERVICE_ADDRESS: ":50061"
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMORY_NODES_DATABASE_AUTO_MIGRATE: "false"
      MEMQL_MASTER_KEY: ${MEMQL_MASTER_KEY:-}
      SERVICE_NAME: memQL-identity
      SERVER_ADDRESS: 0.0.0.0:8081
      SERVER_PUBLIC_PATH: /
      SERVER_ALLOWED_ORIGINS: "*"
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVICE_CAPABILITIES_LOGGING: "true"
      SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL: debug
      # Identity-binary specific knobs
      IDENTITY_ENABLED: "true"
      # Public origin browsers and cockpits dial. The matching DNS
      # record (`*.${IDENTITY_BOOTSTRAP_DOMAIN}` -> 127.0.0.1) plus
      # the nginx :443 server block deliver this URL to the identity
      # HTTP listener. The host-routed nginx config is in
      # docker/nginx/templates/default.conf.template.
      IDENTITY_BASE_URL: https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      IDENTITY_KEY_DIR: /var/identity/keys

      # Node-bootstrap secret (memql#338). When set on the identity
      # service, the POST /node/bootstrap endpoint is enabled; nodes
      # that boot without an operator-provisioned MEMQL_NODE_TOKEN
      # present this shared secret to self-mint a class="node" JWT.
      # Must match the value set on each cluster binary that should be
      # allowed to self-bootstrap.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      # Dev escape hatch: admit plaintext HTTP requests to /node/bootstrap.
      # The docker network is in-cluster plain HTTP between containers; the
      # bootstrap endpoint defaults to requiring HTTPS (the secret is a
      # long-lived bearer credential). Production deploys must leave this
      # unset and terminate TLS at the ingress (or set X-Forwarded-Proto:
      # https on the proxy).
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # Same dev escape hatch for the pair endpoints. Already part of the
      # pre-existing #338 surface but compose never set it; included here
      # so the pair-redeem path also works under the in-cluster plain HTTP.
      MEMQL_IDENTITY_ALLOW_INSECURE_PAIR: ${MEMQL_IDENTITY_ALLOW_INSECURE_PAIR:-1}
      # Plaintext-on-disk in dev. In staging/prod set
      # IDENTITY_KEY_ENCRYPTION_KEY (>=16 chars) to wrap with AES-256-GCM.
      IDENTITY_KEY_ENCRYPTION_KEY: ""
      # Registered OAuth clients. Two by default:
      #   - app:     the SPA at https://app.${IDENTITY_BOOTSTRAP_DOMAIN}.
      #   - cockpit: the native memql-cockpit binary. The redirect
      #              URIs intentionally have NO port -- per
      #              AllowsRedirectURI's RFC-8252 loopback rule, the
      #              cockpit can listen on any ephemeral loopback
      #              port and the auth flow still admits its
      #              callback. Two host forms (127.0.0.1 + localhost)
      #              because openBrowser sometimes resolves one to
      #              the other depending on the user's browser.
      IDENTITY_REGISTERED_CLIENTS: '[{"clientId":"app","redirectURIs":["https://app.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}/auth/callback"]},{"clientId":"cockpit","redirectURIs":["http://127.0.0.1/cockpit/callback","http://localhost/cockpit/callback"]}]'
      IDENTITY_CORS_ALLOWED_ORIGINS: "https://app.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}"
      # Discovery overrides for the /.well-known/memql-config.json
      # response. These tell the cockpit which gRPC endpoint to dial
      # and which client_id to present. Empty (default) means the
      # discovery handler falls back to the FIRST registered client
      # (app) -- which is wrong for the cockpit.
      # Always use the `https://` scheme so the cockpit's dial-URL
      # parser picks TLS automatically (a bare host:port falls
      # through to plain gRPC; with the scheme present the cockpit
      # builds a TLS connection against the system trust store --
      # mkcert installed the dev root CA into that trust store).
      MEMQL_DISCOVERY_GRPC_ENDPOINT: https://bff.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      MEMQL_DISCOVERY_CLIENT_ID: cockpit
      MEMQL_DISCOVERY_CLUSTER_NAME: local
      # Worker pairing redeems on the identity service stamp THIS URL
      # into the response so cockpits dial the agent node directly for
      # WorkerService.Stream (not the BFF, which doesn't host that
      # service). nginx routes https://agent.${IDENTITY_BOOTSTRAP_DOMAIN}:443
      # -> agent:50051.
      MEMQL_WORKER_DIAL_ENDPOINT: https://agent.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      # Unattended-deploy bootstrap. When every required value is
      # set (DOMAIN + OWNER_EMAIL + OWNER_FIRST_NAME +
      # OWNER_LAST_NAME + REGISTRATION_MODE), identity stamps
      # clusterSettings + emails the owner magic link automatically
      # on startup; no /setup visit required. Operators who leave
      # any required var unset go through the interactive wizard at
      # /setup, which prefills from whatever values ARE present.
      #
      # DOMAIN is set explicitly because other env values reference
      # it via ${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      # substitution (IDENTITY_BASE_URL, MEMQL_DISCOVERY_GRPC_ENDPOINT,
      # MEMQL_WORKER_DIAL_ENDPOINT, etc.) at compose-parse time --
      # those substitutions read the SHELL env, not env_file values,
      # so the var has to be visible to the shell.
      #
      # The remaining IDENTITY_BOOTSTRAP_* values flow in through
      # `env_file: ../.env.local` -- explicit `environment:` entries
      # used to clobber env_file values with empty strings (the
      # `${VAR:-}` pattern resolves to "" when the shell doesn't
      # set them, and explicit env beats env_file in compose's
      # precedence order). Don't add per-key entries here unless
      # another env value substitutes from them.
      IDENTITY_BOOTSTRAP_DOMAIN: ${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      # Waitlist is the conservative default — strangers can't grab
      # accounts on a fresh cluster, the operator reviews each request
      # from /admin/access-requests. Switch to open / domain_restricted /
      # invite_only after first-run setup if/when you want a different
      # posture; this just seeds the wizard's prefilled choice.
      IDENTITY_REGISTRATION_MODE: waitlist
      # Branding -- intentionally unset by default so the operator
      # picks their own brand at /admin/settings. The in-code fallback
      # "memQL" renders if neither env var nor saved settings provide
      # a brand. Override locally by exporting IDENTITY_BRAND_NAME.
      IDENTITY_BRAND_NAME: ${IDENTITY_BRAND_NAME:-}
      IDENTITY_BRAND_PRIMARY_COLOR: ${IDENTITY_BRAND_PRIMARY_COLOR:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - identity_keys:/var/identity/keys
    healthcheck:
      # Other nodes wait on this before starting their JWKS fetch.
      # Without this gate every bff/voice/cognition/agent/planner
      # races identity at startup; the slow one fatals on the
      # initial JWKS fetch and burns a Docker restart.
      test: ["CMD", "/app/healthcheck", "8081"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - memql
    restart: unless-stopped

  # pgAdmin (optional - use with --profile tools)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memql-dbadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@memql.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - memql
    profiles:
      - tools
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  identity_keys:
    driver: local
  # node_modules for the in-container CoPresent frontend dev server.
  # Keeps the host's bind-mounted copresent/ free of a node_modules
  # tree (and avoids a host/musl platform mismatch).
  app_node_modules:
    driver: local

networks:
  memql:
    driver: bridge
