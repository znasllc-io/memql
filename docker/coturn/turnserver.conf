# Standalone coturn for the local Polyphon stack (memql#764 / #770).
#
# Why this exists: the Anam direct/Guide avatar needs Anam's CLOUD engine
# to exchange WebRTC media with the LOCAL dev LiveKit. The browser is on
# the same host and reaches LiveKit fine, but Anam's cloud cannot reach
# loopback, and ngrok only tunnels signaling -- not UDP media. So Anam
# relays its media through this TURN server, reached over a RAW ngrok TCP
# endpoint:
#
#   Anam --turn:<ngrok-tcp-host>:<port>?transport=tcp--> ngrok (raw TCP
#   passthrough) --> coturn:3478 --> relays to LiveKit over the docker net.
#
# Gotchas baked in (each cost a debugging cycle -- see docs/voice/turn-relay.md):
#   1. Use a RAW ngrok TCP endpoint + plain `turn:` (transport=tcp), NOT an
#      ngrok TLS endpoint + `turns:`. ngrok's TLS endpoint terminates the
#      handshake but mangles the bidirectional TURN stream (turnutils fails
#      "recv: Success"). So coturn listens PLAINTEXT here (no-tls/no-dtls)
#      and the ngrok tunnel is raw TCP passthrough.
#   2. LiveKit's rtc.node_ip must be LiveKit's docker IP (not 127.0.0.1) or
#      coturn's CreatePermission for LiveKit's candidate fails 403
#      Forbidden IP (loopback is coturn itself). dev-refresh stamps it.
#   3. A standalone coturn (this) is used instead of LiveKit's embedded
#      turn: block because the embedded one emits ZERO logs even at debug.

listening-port=3478
listening-ip=0.0.0.0
realm=local.znas.io
lt-cred-mech
# Pinned dev-only static credential. Kept in sync with the matching
# rtc.turn_servers.credential in docker/livekit/livekit-dev.yaml (both
# committed with this same literal -- dev-only, never a real secret).
user=livekit:54fc7588c919556c921567b313a66585
no-tls
no-dtls
no-cli
no-multicast-peers
# Relay port range coturn allocates for media. Kept small + published so
# the host (and thus ngrok) can reach the allocations.
min-port=49160
max-port=49200
fingerprint
verbose
log-file=stdout
