# Voice/Avatar overlay for the parity cluster (memql#1310).
#
# Layers the opt-in voice-agent + avatar TURN-relay path ON TOP of the
# staging-parity cluster:
#
#   docker compose -f docker/docker-compose.cluster.yml \
#                  -f docker/docker-compose.polyphon.yml up --build -d
#
# or via the make target:
#
#   make dev-cluster-voice
#
# This overlay is MINIMAL + ADDITIVE. It re-homes the voice-agent + the
# avatar TURN-relay plumbing that previously rode the retired single-node
# stack (full.yml, memql#1311) onto the cluster. It does NOT redefine the
# cluster's bff / voice / cognition services (their domain env + 2-replica
# build + LiveKit env are already correct in the base) and it NEVER touches
# the cluster's nginx TLS subdomain front door (memql#1313) -- overriding
# nginx here would destroy the *.local.znas.io front door.
#
# What it ADDS:
#   - voice-agent  -- the Go `memql-voice voice-agent` LiveKit room
#                     participant (epic #449). Joins rooms as the General
#                     Assistant's media participant; runs STT -> cognition
#                     -> TTS (or the gpt-realtime executor). Points at the
#                     cluster's services (livekit:7880, bff:50051).
#   - coturn       -- standalone TURN relay for the cloud avatar engine
#                     (memql#764 / #770), unchanged from the old overlay.
#
# What it OVERRIDES (minimally):
#   - livekit      -- the cluster's livekit runs bare `--dev` with no TURN
#                     config; the avatar relay needs livekit-dev.yaml
#                     (rtc.turn_servers + rtc.node_ip). This overlay swaps
#                     the command to mount that config and renames the
#                     container to `polyphon-livekit` so the dev-refresh
#                     TURN-stamping path (scripts/dev/lib.sh
#                     lib_refresh_turn_relay) can find + restart it. Same
#                     ports as the base (7880/7881/7882).
#
# What it DROPS vs the old overlay:
#   - redis        -- the old overlay shipped a `redis` service, but nothing
#                     in the cluster + this overlay consumes it (the
#                     voice-agent talks to bff over gRPC; LiveKit runs
#                     standalone with no Redis). Dropped.
#   - bff/voice/cognition/nginx redefinitions -- the cluster base already
#                     carries the correct LiveKit env on bff/voice/cognition
#                     and the TLS front door on nginx. Re-stating them here
#                     would clobber the domain env / 2-replica / front door.
#                     Dropped.
#
# HARD CAVEAT (memql#1277): local cloud-avatar VIDEO (Anam / Simli direct
# avatar) does NOT render. The cloud vendor engine joins LiveKit signaling
# but its WebRTC media leg to the dockerized LiveKit never connects over the
# free ngrok TURN relay (both sides only offer unreachable host ICE
# candidates; the cloud engine forms no relay candidate). This overlay
# restores the voice-agent + the relay PLUMBING -- it does NOT make local
# Simli/Anam avatar video work. Avatar video is validated on STAGING only
# (memql#784). Direct avatar runs audio-only locally.
#
# Architecture:
#   LOCAL (Docker):  cluster (postgres, identity, bff, voice, cognition,
#                    agent, planner, workbench, livekit, ...) + voice-agent
#                    + coturn
#   Cloud (API):     Deepgram (ASR + TTS), optional OpenAI gpt-realtime,
#                    Anam / Simli avatar vendor

services:
  # LiveKit override (memql#1310). The cluster's base livekit runs bare
  # `--dev` (built-in devkey/secret, auto ICE) with NO config mount. The
  # avatar TURN relay needs an explicit config so rtc.turn_servers +
  # rtc.node_ip can be stamped (scripts/dev/lib.sh lib_refresh_turn_relay).
  #
  # We override command + volumes + container_name and KEEP the base ports.
  # The explicit config pins rtc.node_ip to a stamped docker IP (NOT
  # 127.0.0.1): with --dev's auto-detect, LiveKit advertises the container's
  # internal IP (unreachable from the browser) plus a STUN-srflx public-IP
  # candidate (typically blocked by home-router NAT loopback), so peer
  # negotiation fails. The container is renamed `polyphon-livekit` because
  # lib_refresh_turn_relay reads its docker IP + restarts it BY THAT NAME.
  livekit:
    container_name: polyphon-livekit
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ./livekit/livekit-dev.yaml:/etc/livekit.yaml:ro

  # coturn -- standalone TURN relay for the cloud avatar engine
  # (memql#764 / #770). Anam's/Simli's CLOUD engine cannot reach the local
  # LiveKit's loopback media, and ngrok only tunnels signaling. coturn
  # bridges the gap: the cloud engine reaches it over a RAW ngrok TCP
  # endpoint (scripts/dev/lib.sh lib_refresh_turn_relay stands the tunnel up
  # and stamps livekit-dev.yaml's rtc.turn_servers + node_ip), and coturn
  # relays the media to polyphon-livekit over the cluster network.
  # See docs/internal/design/voice-turn-relay.md for the full path + gotchas.
  coturn:
    image: coturn/coturn:latest
    container_name: memql-coturn
    hostname: coturn
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      # Published so the ngrok TCP tunnel (host:3478) reaches coturn.
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # The relay allocation range (min-port/max-port in the config).
      - "49160-49200:49160-49200/udp"
    networks:
      - memql-cluster
    restart: unless-stopped

  # voice-agent (epic #449). The Go voice-agent media participant: the
  # `voice-agent` subcommand of the memql-voice binary
  # (`memql-voice voice-agent`). It joins a LiveKit room as the General
  # Assistant, opens a MemqlService.Stream gRPC session against the cluster
  # BFF, and runs the STT -> cognition -> TTS cascade (or the gpt-realtime
  # executor) for the room's voice turns. Built from the same voice-runtime
  # CGO stage as the cluster's `voice` node (libopus/opusfile/soxr). Speaks
  # the VoiceAgent* gRPC contract on MemqlService.Stream with a
  # class="voice_agent" bearer token; the voice_agent_stream_interceptor
  # pins this identity-type to the voice-agent message surface only.
  #
  # Single instance (NOT 2 replicas): the voice-agent is a room participant,
  # not a mesh node -- it dials INTO the cluster, it isn't part of the
  # replica fan-out the parity cluster exercises.
  voice-agent:
    build:
      context: ..
      dockerfile: Dockerfile
      target: voice-runtime
      args:
        BUILD_TAGS: voice
        CGO_ENABLED: "1"
    container_name: memql-voice-agent
    hostname: voice-agent
    # The voice-runtime image's ENTRYPOINT is /app/memql; `voice-agent`
    # selects the subcommand (subcommand_voice_agent.go, build-tagged
    # `voice`). RoomName falls back to MEMQL_VOICE_ROOM_NAME when no
    # --room flag is passed.
    command: ["voice-agent"]
    # env_file is the source of truth for vendor secrets sourced from the
    # genesis env (Deepgram key, Anam / Simli keys, OpenAI key). DO NOT
    # re-declare those keys under `environment:` -- compose treats the
    # `environment:` block as overriding env_file, and `${VAR:-}` evaluates
    # against the docker-compose-invoking SHELL (where vendor keys are not
    # exported), which shadows the env-file value with empty.
    #
    # VOICE_AGENT_TOKEN is the runtime credential authenticating the
    # voice-agent on MemqlService.Stream. Two provisioning paths are
    # supported (see integrations/voice/agent/bootstrap.go,
    # ResolveVoiceAgentToken):
    #
    #   1. Out-of-band mint (production / dev-refresh): the pipeline mints a
    #      class="voice_agent" JWT via the identity admin CLI and injects it
    #      as VOICE_AGENT_TOKEN. dev-refresh follows the same shape (#184).
    #
    #   2. Self-bootstrap (dev, memql#342): when VOICE_AGENT_TOKEN is empty
    #      AND MEMQL_NODE_BOOTSTRAP_TOKEN is set, the Go voice-agent's
    #      ResolveVoiceAgentToken calls identity's /node/bootstrap with
    #      tokenClass="voice_agent" and mints its own token. This is the
    #      path that makes a stock `make dev-cluster-voice` work without
    #      dev-refresh's mint-and-recreate dance.
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Container-internal infra knobs -- safe to set here since they're
      # hardcoded for dev rather than sourced from the genesis env. Points
      # at the cluster's service names/ports (livekit, bff).
      POLYPHON_LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      # The cluster BFF's gRPC address. Both var names are set: the agent
      # config reads MEMQL_GRPC_ADDR; some helpers read MEMQL_GRPC_ADDRESS.
      MEMQL_GRPC_ADDR: "bff:50051"
      MEMQL_GRPC_ADDRESS: "bff:50051"
      # Voice executor: "realtime" (OpenAI gpt-realtime speech-to-speech,
      # the converged #475 default -- the model owns the turn and authors
      # the reply; needs OPENAI_API_KEY from the genesis env) or "cascade"
      # (Deepgram STT -> cognition -> Deepgram TTS). Realtime is the only
      # working reply path on the post-#479 cognition path.
      MEMQL_VOICE_EXECUTOR: "${MEMQL_VOICE_EXECUTOR:-realtime}"
      # Realtime model id (GA Realtime API). The agent reads
      # MEMQL_REALTIME_MODEL, NOT MEMQL_OPENAI_REALTIME_MODEL.
      MEMQL_REALTIME_MODEL: "${MEMQL_REALTIME_MODEL:-gpt-realtime-2}"
      # Native STT: keep Deepgram OFF the realtime critical path so
      # gpt-realtime-2 owns STT + turn detection + voice + tool-calling.
      MEMQL_VOICE_REALTIME_NATIVE_STT: "${MEMQL_VOICE_REALTIME_NATIVE_STT:-true}"
      # Deepgram key for the cascade STT/TTS path. Sourced from the genesis
      # env via env_file; the ${VAR:-} form lets a shell export win without
      # shadowing the env-file value with empty (it resolves against the
      # genesis-exported shell on the dev-refresh path).
      MEMQL_DEEPGRAM_API_KEY: "${MEMQL_DEEPGRAM_API_KEY:-}"
      # Avatar vendor selection + keys. Vendor keys come from the genesis
      # env (env_file); MEMQL_AVATAR_VENDOR picks anam (default) / simli /
      # none. The persona's stamped avatarVendor wins over this at runtime
      # when set. NB (#1277): local avatar VIDEO does not render -- this
      # wires the plumbing only.
      MEMQL_AVATAR_VENDOR: "${MEMQL_AVATAR_VENDOR:-}"
      # Anam live render model for the direct/Guide avatar (memql#772).
      MEMQL_ANAM_AVATAR_MODEL: "${MEMQL_ANAM_AVATAR_MODEL:-}"
      # Room to join. The memQL convention is polyphon-<spaceId>; the voice
      # node assigns concrete rooms at runtime, so this is the bring-up
      # default for a stock `make dev-cluster-voice`.
      MEMQL_VOICE_ROOM_NAME: "${MEMQL_VOICE_ROOM_NAME:-}"
      VOICE_AGENT_LOG_LEVEL: "${VOICE_AGENT_LOG_LEVEL:-INFO}"
      # Path 1 (out-of-band): operator-provisioned JWT wins when set.
      VOICE_AGENT_TOKEN: "${VOICE_AGENT_TOKEN:-}"
      # Path 2 (self-bootstrap, dev default). Mirrors the cluster's node
      # services' MEMQL_NODE_BOOTSTRAP_TOKEN sentinel (#338/#340) so
      # `make dev-cluster-voice` works out of the box.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      MEMQL_VOICE_AGENT_INSTANCE_ID: ${MEMQL_VOICE_AGENT_INSTANCE_ID:-voice-agent-local}
    depends_on:
      - livekit
      - bff
    networks:
      - memql-cluster
    restart: unless-stopped
