# Polyphon Development Stack
#
# Adds LiveKit, Redis, and the Go voice-agent to the standard memQL
# development stack. The voice-agent joins LiveKit rooms as the General
# Assistant's media participant and runs the STT -> cognition -> TTS
# cascade (or the gpt-realtime speech-to-speech executor) over Deepgram
# Nova-3 + Aura-2.
#
# Usage:
#   docker-compose -f docker/docker-compose.full.yml -f docker/docker-compose.polyphon.yml up -d
#
# Architecture:
#   LOCAL (Docker):  PostgreSQL, memQL, LiveKit, Redis, Go voice-agent
#   Cloud (API):     Deepgram (ASR + TTS), optional OpenAI gpt-realtime

services:
  # LiveKit Server
  # Open-source WebRTC SFU for multi-party audio rooms.
  # Agents join rooms as participants; humans connect via LiveKit SDK in browser.
  livekit:
    image: livekit/livekit-server:latest
    container_name: polyphon-livekit
    hostname: livekit
    # Use an explicit config file instead of --dev so we can pin
    # rtc.node_ip to 127.0.0.1. With --dev's auto-detect, LiveKit
    # advertises the container's internal IP (unreachable from the
    # browser) plus a STUN-srflx public-IP candidate (typically
    # blocked by home-router NAT loopback), and the browser's
    # peer-connection negotiation fails with "could not establish
    # pc connection" even though signaling came up cleanly.
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    volumes:
      - ./livekit/livekit-dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"   # HTTP + WebSocket signaling (proxied via wss://livekit.${DOMAIN})
      - "7881:7881/tcp"  # RTC TCP fallback
      - "7882:7882/udp"  # RTC UDP -- the browser-reachable media port
    networks:
      - memql
    restart: unless-stopped

  # Redis
  # Shared conversation state for Polyphon sessions.
  redis:
    image: redis:7-alpine
    container_name: polyphon-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - memql
    restart: unless-stopped

  # Bridge Agent has been retired (Initiative C, Phase 11) and the Python
  # voice-agent (LiveKit Agents 1.5) has been cut over to the Go
  # voice-agent (epic #449; the `voice-agent` service below). The Go
  # voice-agent is now the sole voice + video participant for the General
  # Assistant in LiveKit rooms. See docs/voice/ for the architecture.

  # Stamp LiveKit env on every memQL node that
  # touches the voice path. The BFF mints LiveKit room tokens for
  # browsers (PolyphonRoomTokenMsg gRPC) and dispatches a join
  # request to the voice-agent; the voice node forwards
  # transcription work; the cognition node forwards agent responses
  # to the voice-agent for TTS publication. The legacy `memql:`
  # override block targeted a single-binary service that no longer
  # exists in docker-compose.full.yml -- the cluster split moved
  # the voice surface to bff + voice + cognition.
  bff:
    environment:
      # Internal URL the BFF uses for any backend chatter (none today).
      POLYPHON_LIVEKIT_URL: "ws://livekit:7880"
      # Browser-reachable LiveKit signal URL handed to the SPA in the
      # polyphon room token (component/polyphon/localroom.go). The
      # `${VAR:-default}` form lets a shell/genesis/.env.local value win
      # -- e.g. an ngrok wss:// URL, which is REQUIRED when the avatar
      # vendor is a cloud engine (Anam) that must reach LiveKit from the
      # public internet. When nothing is exported (plain local stack, no
      # ngrok), it falls back to the nginx-terminated dev domain so the
      # browser still gets a usable wss:// URL instead of the internal
      # ws://livekit:7880 -- which an HTTPS page blocks as mixed content.
      POLYPHON_LIVEKIT_PUBLIC_URL: ${POLYPHON_LIVEKIT_PUBLIC_URL:-wss://livekit.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
      POLYPHON_LIVEKIT_API_KEY: "devkey"
      POLYPHON_LIVEKIT_API_SECRET: "secret"
      # VOICE_AGENT_TOKEN is the voice-agent's own credential and
      # is NOT consumed by the bff. dev-refresh mints it post-
      # identity-up and injects it into the voice-agent service's
      # shell-env path; see the voice-agent block below and #184.
    depends_on:
      - livekit

  # Make nginx wait for livekit so the livekit.${DOMAIN} server
  # block has a healthy upstream to resolve at first request.
  nginx:
    depends_on:
      - livekit

  voice:
    environment:
      POLYPHON_LIVEKIT_URL: "ws://livekit:7880"
      POLYPHON_LIVEKIT_PUBLIC_URL: ${POLYPHON_LIVEKIT_PUBLIC_URL:-wss://livekit.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
      POLYPHON_LIVEKIT_API_KEY: "devkey"
      POLYPHON_LIVEKIT_API_SECRET: "secret"
    depends_on:
      - livekit

  cognition:
    environment:
      POLYPHON_LIVEKIT_URL: "ws://livekit:7880"
      POLYPHON_LIVEKIT_PUBLIC_URL: ${POLYPHON_LIVEKIT_PUBLIC_URL:-wss://livekit.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
      POLYPHON_LIVEKIT_API_KEY: "devkey"
      POLYPHON_LIVEKIT_API_SECRET: "secret"
    depends_on:
      - livekit

  # voice-agent (epic #449). The Go voice-agent media participant: the
  # `voice-agent` subcommand of the memql-voice binary
  # (`memql-voice voice-agent`). It joins a LiveKit room as the General
  # Assistant, opens a MemqlService.Stream gRPC session, and runs the
  # STT -> cognition -> TTS cascade (or the gpt-realtime executor) for
  # the room's voice turns. Built from the same voice-runtime CGO stage
  # as the `voice` node above (libopus/opusfile/soxr). Speaks the
  # VoiceAgent* gRPC contract on MemqlService.Stream with a
  # class="voice_agent" bearer token; the voice_agent_stream_interceptor
  # pins this identity-type to the voice-agent message surface only.
  voice-agent:
    build:
      context: ..
      dockerfile: docker/memql.Dockerfile
      target: voice-runtime
      args:
        BUILD_TAGS: voice
        CGO_ENABLED: "1"
    container_name: polyphon-voice-agent
    hostname: voice-agent
    # The voice-runtime image's ENTRYPOINT is /app/memql; `voice-agent`
    # selects the subcommand (subcommand_voice_agent.go, build-tagged
    # `voice`). RoomName falls back to MEMQL_VOICE_ROOM_NAME when no
    # --room flag is passed.
    command: ["voice-agent"]
    # env_file is the source of truth for vendor secrets sourced
    # from .env.local (Deepgram key, Anam / Simli keys, OpenAI key).
    # DO NOT re-declare those keys under `environment:` -- compose
    # treats the `environment:` block as overriding env_file, and
    # `${VAR:-}` evaluates against the docker-compose-invoking SHELL
    # (where vendor keys are not exported), which shadows the
    # .env.local value with empty.
    #
    # VOICE_AGENT_TOKEN is the runtime credential authenticating
    # the voice-agent on MemqlService.Stream. Two provisioning paths
    # are supported (see integrations/voice/agent/bootstrap.go,
    # ResolveVoiceAgentToken):
    #
    #   1. Out-of-band mint (production): the deploy pipeline mints
    #      a class="voice_agent" JWT via the identity admin CLI and
    #      injects it as VOICE_AGENT_TOKEN. dev-refresh follows the
    #      same shape (see scripts/dev/refresh.sh + #184).
    #
    #   2. Self-bootstrap (dev, memql#342): when VOICE_AGENT_TOKEN
    #      is empty AND MEMQL_NODE_BOOTSTRAP_TOKEN is set, the Go
    #      voice-agent's ResolveVoiceAgentToken calls identity's
    #      /node/bootstrap with tokenClass="voice_agent" and mints
    #      its own token. This is the path that makes a stock
    #      `docker compose up` work without dev-refresh's
    #      mint-and-recreate dance. Production deploys that
    #      provision tokens out-of-band leave
    #      MEMQL_NODE_BOOTSTRAP_TOKEN unset on the identity side and
    #      the endpoint stays dark.
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Container-internal infra knobs -- safe to set here since
      # they're hardcoded for dev rather than sourced from .env.local.
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      MEMQL_GRPC_ADDR: "bff:50051"
      # Voice executor: "realtime" (OpenAI gpt-realtime speech-to-speech,
      # the converged #475 default -- the model owns the turn and authors
      # the reply; needs OPENAI_API_KEY from .env.local) or "cascade"
      # (Deepgram STT -> cognition -> Deepgram TTS). Cascade is retired on
      # the post-#479 cognition path: cognition no longer authors voice
      # replies (it publishes a gate directive for the realtime model to
      # author), so cascade has no reply text to speak. Realtime is the
      # only working path -- keep cascade only for isolated executor tests.
      MEMQL_VOICE_EXECUTOR: "${MEMQL_VOICE_EXECUTOR:-realtime}"
      # Realtime model id (GA Realtime API). gpt-realtime-2 is OpenAI's GA
      # speech-to-speech model; the older beta surface was retired, so the
      # client dials /v1/realtime with Bearer auth only (no OpenAI-Beta
      # header). Note the var name -- the agent reads MEMQL_REALTIME_MODEL,
      # NOT MEMQL_OPENAI_REALTIME_MODEL.
      MEMQL_REALTIME_MODEL: "${MEMQL_REALTIME_MODEL:-gpt-realtime-2}"
      # Native STT: keep Deepgram OFF the realtime critical path so gpt-realtime-2
      # owns STT + turn detection + voice + tool-calling (snappiest). Set to
      # "false" to re-enable the Deepgram labeled-transcript read side.
      MEMQL_VOICE_REALTIME_NATIVE_STT: "${MEMQL_VOICE_REALTIME_NATIVE_STT:-true}"
      # Room to join. The memQL convention is polyphon-<spaceId>; the
      # voice node assigns concrete rooms at runtime, so this is the
      # bring-up default for a stock `docker compose up`.
      MEMQL_VOICE_ROOM_NAME: "${MEMQL_VOICE_ROOM_NAME:-}"
      VOICE_AGENT_LOG_LEVEL: "${VOICE_AGENT_LOG_LEVEL:-INFO}"
      # Path 1 (out-of-band): operator-provisioned JWT wins when set.
      VOICE_AGENT_TOKEN: "${VOICE_AGENT_TOKEN:-}"
      # Path 2 (self-bootstrap, dev default). Mirrors the cluster /
      # full compose dev sentinel for MEMQL_NODE_BOOTSTRAP_TOKEN
      # from #340 so `docker compose up` works out of the box.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      MEMQL_VOICE_AGENT_INSTANCE_ID: ${MEMQL_VOICE_AGENT_INSTANCE_ID:-voice-agent-local}
    depends_on:
      - livekit
      - bff
    networks:
      - memql
    restart: unless-stopped

volumes:
  redis_data:

# The `memql` network is created by docker-compose.full.yml (the
# overlay we sit on top of). Don't redeclare it as external -- when
# dev-refresh wipes volumes the docker_memql network is gone, and
# the external lookup fails. Compose merges the network reference
# from full.yml when no declaration is present here.
