# Docker Compose for memQL cluster mode -- STAGING-PARITY topology.
#
# Usage:
#   docker compose -f docker/docker-compose.cluster.yml up --build
#   docker compose -f docker/docker-compose.cluster.yml down
#
# Or via the make targets:
#   make dev-cluster                 (foreground, build + up)
#   make dev-cluster-restart         (fresh binaries, data preserved)
#   make dev-cluster-restart-purge   (fresh binaries + fresh DB)
#
# PARITY GOAL (memql#1212). This compose is built to match the staging
# AKS topology (deploy/k8s/base/*.yaml) so cluster-only bugs -- replica
# fan-out, cross-node event double-delivery, leader/singleton races --
# reproduce locally. Specifically:
#
#   - >=2 replicas per mesh node (memql#1213). bff/cognition/agent/
#     planner/workbench/voice run `deploy.replicas: 2`, like staging.
#   - per-replica UNIQUE node id (memql#1213). The static
#     MEMQL_NODE_ID=<type>-local is REMOVED from replicated services;
#     the binary derives its id from the container hostname
#     (os.Hostname() in component/node/identity.go), the compose
#     equivalent of staging's `fieldRef: metadata.name`. A static id
#     would collide across replicas and break PeerManager keying (the
#     memql#1042 chat-outage shape).
#   - copresent SPA behind the front door (memql#1214).
#   - LiveKit for the voice/video path (memql#1215).
#
# Because replicas need unique container hostnames, the replicated
# services do NOT set `container_name` or `hostname` -- Compose assigns
# each replica `<project>-<service>-<n>` automatically, which is exactly
# the unique per-replica id we want. Address services by SERVICE NAME
# (bff, cognition, ...); Docker DNS round-robins across the replica IPs.
#
# Along the MESH-DELIVERY PATH (the 2-replica bff + worker fan-out this
# cluster exists to exercise) topology + build model are identical to
# staging; only config differs (DB endpoint = local Postgres, blob =
# Azurite, secrets = dev defaults, LiveKit = dev keys). Identity now runs
# at 2 replicas too (memql#1304) -- full replica parity with staging --
# reached via the nginx front door (no host port). A few nodes still
# diverge for concrete local-host reasons (voice-agent opt-in via
# docker-compose.polyphon.yml, lifecycle probes deferred to Phase 3).
# Each is enumerated + justified in the divergence audit:
# docs/public/operate/reproduce-staging-locally.md (memql#1260).

# Compose project name. The retired single-node full.yml used the
# "memql-cluster" project name; this multinode topology keeps its own
# distinct name so any leftover containers don't collide.
name: memql-cluster-multinode

services:
  # Shared PostgreSQL + TimescaleDB (single instance for all nodes).
  # Config-only difference from staging (Tiger Cloud).
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: memql-db
    hostname: postgres
    environment:
      POSTGRES_USER: memql
      POSTGRES_PASSWORD: memql_dev
      POSTGRES_DB: memql
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - cluster_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memql"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - memql-cluster
    restart: unless-stopped

  # BFF node -- backend for frontend, primary API surface + mesh parent.
  # 2 replicas (staging parity). No container_name/hostname/static
  # MEMQL_NODE_ID -> each replica gets a unique hostname-derived id.
  bff:
    build:
      # Carrier-built (engine + CoPresent DSL), same source as staging (#1053):
      # the carrier Dockerfile with context = workspace parent (memql +
      # memql-bff-copresent as siblings, per the `replace ../memql` directive).
      context: ../..
      dockerfile: memql-bff-copresent/Dockerfile
      args:
        BUILD_TAGS: bff
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      MEMQL_NODE_TYPE: bff
      # memql#1042 fix: force MEMQL_NODE_ID empty so the per-replica
      # hostname id (memql#1213) wins over the shared "bff-local" that
      # leaks in from the genesis env_file. Empty -> os.Hostname().
      MEMQL_NODE_ID: ""
      # Allow the in-cluster plaintext http://identity:8081 node-bootstrap
      # (the worker self-mints its class="node" JWT). Without this the
      # node sends no auth header and every NodeService.Stream call fails.
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # MEMQL_NODE_ID intentionally UNSET -- derived from the container
      # hostname per replica (memql#1213). Setting it would collide.
      MEMQL_NODE_ADDRESS: bff:50058
      MEMQL_NODE_SERVICE_ADDRESS: ":50058"
      MEMQL_NODE_FLAVOR: ""
      # Inter-node peer auth (memql#338). MEMQL_BFF_NODE_TOKEN is minted by
      # scripts/dev/mint-node-tokens.sh; first-boot before that runs leaves
      # it empty and the node self-mints via MEMQL_NODE_BOOTSTRAP_TOKEN.
      MEMQL_NODE_TOKEN: ${MEMQL_BFF_NODE_TOKEN:-}
      # Static seed addresses for WorkerDialer. DB-based discovery
      # (via v1:cluster:node events) takes over once workers register
      # themselves, so this is a first-boot safety net -- not the
      # long-term source of truth.
      MEMQL_WORKER_PEERS: "voice=voice:50059,agent=agent:50055,cognition=cognition:50054,planner=planner:50056,workbench=workbench:50060"
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVER_ADDRESS: "0.0.0.0:8088"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Self-hosted LiveKit (memql#1215 / staging #1043). The BFF mints
      # LiveKit room tokens, so it needs the URL + the dev key/secret
      # pair (shared with the livekit service + the voice node). The
      # public URL points at the local LiveKit port so a browser can
      # reach the signaling WS same-host.
      POLYPHON_LIVEKIT_URL: ${POLYPHON_LIVEKIT_URL:-ws://livekit:7880}
      POLYPHON_LIVEKIT_PUBLIC_URL: ${POLYPHON_LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      POLYPHON_LIVEKIT_API_KEY: ${POLYPHON_LIVEKIT_API_KEY:-devkey}
      POLYPHON_LIVEKIT_API_SECRET: ${POLYPHON_LIVEKIT_API_SECRET:-secret}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
    deploy:
      # Staging parity (#1213): two replicas exercise the cross-replica
      # fan-out path that single-replica local dev structurally cannot.
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      # nginx (and any gRPC client routed through it) must wait for the
      # bff's HTTP/gRPC listeners to ACCEPT before traffic flows, else a
      # request that races bring-up gets a 502 from the LB (copresent#313).
      # Mirrors the identity gate. 8088 is the bff's HTTP server (/healthz).
      test: ["CMD", "/app/healthcheck", "8088"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - memql-cluster

  # Nginx front door (memql#1313) -- TLS subdomain entry point matching
  # staging's per-subdomain ingress AND full.yml's proven dev front door.
  # Routes by Host header to the right backend:
  #   app.${DOMAIN}        -> copresent SPA
  #   identity.${DOMAIN}   -> identity service
  #   bff.${DOMAIN}        -> BFF gRPC + HTTP (/memql/ws, attachments, healthz)
  #   agent.${DOMAIN}      -> Agent gRPC (WorkerService.Stream) + HTTP
  #   voice.${DOMAIN}      -> voice (/memql/audio)
  #   livekit.${DOMAIN}    -> LiveKit signaling
  # Load-balances across the 2-replica mesh nodes via the resolver +
  # variable-upstream trick. See docker/nginx/templates/default.conf.template.
  #
  # Hostnames resolve to 127.0.0.1 via a wildcard DNS record
  # (`*.${IDENTITY_BOOTSTRAP_DOMAIN}` -> 127.0.0.1) on the operator's
  # owned domain. TLS certs are generated locally with mkcert
  # (scripts/dev/setup-tls.sh, run by cluster-refresh.sh) for that wildcard.
  #
  # nginx:alpine processes /etc/nginx/templates/*.template through envsubst
  # on container start, expanding ${DOMAIN} only (per NGINX_ENVSUBST_FILTER)
  # so nginx-internal $host / $scheme / $remote_addr stay literal.
  nginx:
    image: nginx:alpine
    container_name: memql-lb
    hostname: nginx
    environment:
      DOMAIN: ${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # Fallback for anyone who reverts the SPA upstream to a host-run
      # Vite dev server (copresent:8080 -> host.docker.internal:8080);
      # host-gateway makes it work on Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      bff:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql-cluster
    restart: unless-stopped

  # CoPresent SPA (memql#1214) -- the actual app UI, built from the
  # sibling copresent repo (../copresent) exactly like staging
  # (deploy/k8s/base/copresent.yaml), NOT a Vite dev server. VITE_* args
  # point the bundle at the TLS subdomain front door (memql#1313) so auth
  # + WS hit the same per-subdomain origins staging uses
  # (app./bff./identity.${DOMAIN}), mirroring app.staging.copresent.ai.
  #
  # The private @visionarys-io/@znasllc-io SDKs need a GitHub Packages
  # token at install time -- passed as a BuildKit secret (never baked
  # into the image). Export MEMQL_PACKAGES_TOKEN (read:packages for both
  # scopes) before `make dev-cluster`. 2 replicas (staging parity #551).
  copresent:
    build:
      # The copresent SPA repo is a workspace SIBLING of memql
      # (../../copresent from docker/). The carrier nodes build from the
      # workspace parent (../..); the SPA builds from its own repo root.
      context: ../../copresent
      dockerfile: Dockerfile
      args:
        # Browser-facing absolute URLs, TLS-fronted by nginx (memql#1313).
        # nginx routes bff.${DOMAIN} -> /memql/ws + /memql/audio (audio is
        # forwarded to voice) + the BFF HTTP/gRPC surface; identity.${DOMAIN}
        # -> the identity service (/auth, /oauth, /.well-known, ...).
        VITE_MEMQL_WS_URL: ${VITE_MEMQL_WS_URL:-wss://bff.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}/memql/ws}
        VITE_MEMQL_AUDIO_WS_URL: ${VITE_MEMQL_AUDIO_WS_URL:-wss://bff.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}/memql/audio}
        VITE_MEMQL_API_URL: ${VITE_MEMQL_API_URL:-https://bff.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
        VITE_MEMQL_TOKEN_EXCHANGE_URL: ${VITE_MEMQL_TOKEN_EXCHANGE_URL:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}/oauth/token}
        VITE_IDENTITY_BASE_URL: ${VITE_IDENTITY_BASE_URL:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
        VITE_IDENTITY_CLIENT_ID: ${VITE_IDENTITY_CLIENT_ID:-copresent}
      secrets:
        - node_auth_token
    environment:
      NODE_ENV: production
      APP_PORT: "8080"
      FRONTEND_PORT: "8080"
      CORS_ALLOWED_ORIGIN: "*"
      # Server-side memQL URL for the Express /api/* endpoints (internal BFF,
      # in-cluster service name -- not the public subdomain).
      VITE_MEMQL_API_URL: http://bff:8088
    deploy:
      replicas: 2
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - memql-cluster
    restart: unless-stopped

  # Cognition node -- conversation intelligence (scoring, response generation).
  # 2 replicas (staging parity); per-replica hostname-derived node id.
  cognition:
    build:
      # Carrier-built (engine + CoPresent DSL), same source as staging (#1053).
      context: ../..
      dockerfile: memql-bff-copresent/Dockerfile
      args:
        BUILD_TAGS: cognition
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      MEMQL_NODE_TYPE: cognition
      # memql#1042 fix: force MEMQL_NODE_ID empty so the per-replica
      # hostname id (memql#1213) wins over the shared "bff-local" that
      # leaks in from the genesis env_file. Empty -> os.Hostname().
      MEMQL_NODE_ID: ""
      # Allow the in-cluster plaintext http://identity:8081 node-bootstrap
      # (the worker self-mints its class="node" JWT). Without this the
      # node sends no auth header and every NodeService.Stream call fails.
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # MEMQL_NODE_ID UNSET -> hostname-derived per replica (#1213).
      MEMQL_NODE_ADDRESS: cognition:50054
      MEMQL_NODE_SERVICE_ADDRESS: ":50054"
      # Inter-node peer auth (memql#338).
      MEMQL_NODE_TOKEN: ${MEMQL_COGNITION_NODE_TOKEN:-}
      # Dial BFF so events originated here (SI responses, presence updates)
      # flow back to BFF's event bus and reach the frontend subscribers.
      # Without this the worker has no outbound stream to BFF; EventBridge
      # iterates AllPeers but every peer.Connection is nil, so forwards are
      # silent no-ops. The BFF -> worker direction is already covered by
      # BFF's WorkerDialer.
      MEMQL_PARENT_ADDRESS: bff:50058
      # Cognition runs its own WorkerDialer (narrowed to agent peers) so
      # it can forward AgentGenerateTurnMsg to an agent node instead of
      # generating replies locally. Seeded with agent's address for
      # first-boot; DB discovery via v1:cluster:node takes over once the
      # agent registers. Other worker types are filtered out by
      # dialer.SetDialTypes(NodeTypeAgent) in app/cluster.go.
      MEMQL_WORKER_PEERS: "agent=agent:50055"

      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVER_ADDRESS: "0.0.0.0:8085"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql-cluster

  # Voice node -- audio I/O pipeline (ASR, TTS, LiveKit). Built with
  # CGO + the voice-runtime stage because the Go voice-agent's LiveKit
  # server-sdk-go + media-sdk pull a CGO libopus/opusfile/soxr dependency
  # (docs/voice/451-livekit-go-room-participation.md, Caveat 1).
  # 2 replicas (staging parity); per-replica hostname-derived node id.
  voice:
    build:
      context: ..
      dockerfile: Dockerfile
      target: voice-runtime
      args:
        BUILD_TAGS: voice
        CGO_ENABLED: "1"
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Inter-node peer auth (memql#338).
      MEMQL_NODE_TOKEN: ${MEMQL_VOICE_NODE_TOKEN:-}
      MEMQL_NODE_TYPE: voice
      # memql#1042 fix: force MEMQL_NODE_ID empty so the per-replica
      # hostname id (memql#1213) wins over the shared "bff-local" that
      # leaks in from the genesis env_file. Empty -> os.Hostname().
      MEMQL_NODE_ID: ""
      # Allow the in-cluster plaintext http://identity:8081 node-bootstrap
      # (the worker self-mints its class="node" JWT). Without this the
      # node sends no auth header and every NodeService.Stream call fails.
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # MEMQL_NODE_ID UNSET -> hostname-derived per replica (#1213).
      MEMQL_NODE_ADDRESS: voice:50059
      MEMQL_NODE_SERVICE_ADDRESS: ":50059"
      MEMQL_PARENT_ADDRESS: bff:50058
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVER_ADDRESS: "0.0.0.0:8085"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Self-hosted LiveKit (memql#1215). The voice node joins LiveKit
      # rooms as the assistant participant; same dev key/secret as the
      # BFF (which mints the room tokens) + the livekit service.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${POLYPHON_LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${POLYPHON_LIVEKIT_API_SECRET:-secret}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}

      # ---- STT provider selection ----
      # Auto-selected default is "deepgram" when MEMQL_DEEPGRAM_API_KEY
      # is set, else "openai-realtime". Valid explicit values:
      # "deepgram", "openai-realtime", "openai-whisper".
      MEMQL_STT_PROVIDER: "${MEMQL_STT_PROVIDER:-}"

      # ---- Deepgram (default when key present) ----
      MEMQL_DEEPGRAM_API_KEY: "${MEMQL_DEEPGRAM_API_KEY:-}"
      POLYPHON_DEEPGRAM_ASR_MODEL: "${POLYPHON_DEEPGRAM_ASR_MODEL:-}"
      POLYPHON_DEEPGRAM_TTS_MODEL: "${POLYPHON_DEEPGRAM_TTS_MODEL:-}"
      POLYPHON_DEEPGRAM_LANGUAGE: "${POLYPHON_DEEPGRAM_LANGUAGE:-}"
      POLYPHON_DEEPGRAM_ENDPOINTING_MS: "${POLYPHON_DEEPGRAM_ENDPOINTING_MS:-}"
      POLYPHON_DEEPGRAM_UTTERANCE_END_MS: "${POLYPHON_DEEPGRAM_UTTERANCE_END_MS:-}"
      POLYPHON_DEEPGRAM_CLIENT_EOU_TIMEOUT_MS: "${POLYPHON_DEEPGRAM_CLIENT_EOU_TIMEOUT_MS:-}"

      # ---- OpenAI Realtime (fallback) ----
      # Transcription model used by the Realtime API. Defaults to
      # "whisper-1" -- universally available on every OpenAI project
      # AND supported by the Realtime API's transcription-only mode
      # (streams interim deltas, unlike the batch /audio/transcriptions
      # endpoint). Upgrade to "gpt-4o-transcribe" for slightly better
      # quality IFF your OpenAI project has that model enabled on the
      # dashboard (it is gated per-project). Other options:
      # "gpt-4o-mini-transcribe" (cheaper than gpt-4o-transcribe).
      # Falls back to POLYPHON_OPENAI_ASR_MODEL if set, so the same env
      # var can drive both the STT path and the Polyphon voice path.
      MEMQL_OPENAI_REALTIME_MODEL: "${MEMQL_OPENAI_REALTIME_MODEL:-}"

      # ---- OpenAI Whisper (fallback) ----
      # Used when explicit MEMQL_STT_PROVIDER selects whisper, or when
      # the Realtime path is unavailable at startup.
      MEMQL_WHISPER_MODEL: "${MEMQL_WHISPER_MODEL:-whisper-1}"
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql-cluster

  # Agent node -- task execution and AI work.
  # 2 replicas (staging parity); per-replica hostname-derived node id.
  agent:
    build:
      # Carrier-built (engine + CoPresent DSL), same source as staging (#1053).
      context: ../..
      dockerfile: memql-bff-copresent/Dockerfile
      args:
        BUILD_TAGS: agent
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      MEMQL_NODE_TYPE: agent
      # memql#1042 fix: force MEMQL_NODE_ID empty so the per-replica
      # hostname id (memql#1213) wins over the shared "bff-local" that
      # leaks in from the genesis env_file. Empty -> os.Hostname().
      MEMQL_NODE_ID: ""
      # Allow the in-cluster plaintext http://identity:8081 node-bootstrap
      # (the worker self-mints its class="node" JWT). Without this the
      # node sends no auth header and every NodeService.Stream call fails.
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # MEMQL_NODE_ID UNSET -> hostname-derived per replica (#1213).
      MEMQL_NODE_ADDRESS: agent:50055
      MEMQL_NODE_SERVICE_ADDRESS: ":50055"
      MEMQL_PARENT_ADDRESS: bff:50058
      # Inter-node peer auth (memql#338).
      MEMQL_NODE_TOKEN: ${MEMQL_AGENT_NODE_TOKEN:-}
      # Cluster-mode workbench: route workbenchHost calls to the
      # dedicated workbench node-type binary instead of dispatching
      # locally. The dialer needs a seed address; v1:cluster:node
      # event-driven discovery refines this once workbench registers.
      MEMQL_WORKBENCH_REMOTE: "1"
      MEMQL_WORKER_PEERS: "workbench=workbench:50060"

      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVER_ADDRESS: "0.0.0.0:8085"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
      # Local Azure Blob Storage via Azurite (memql#806).
      # The well-known Azurite dev account + key are public constants
      # (non-secret; https://learn.microsoft.com/azure/storage/common/storage-use-azurite).
      # Uses the in-network hostname `azurite` (NOT 127.0.0.1) so the
      # agent container reaches the emulator. Cloud deploys override
      # both vars via genesis; dev works out of the box with no reseal.
      MEMQL_AZURE_STORAGE_CONNECTION_STRING: ${MEMQL_AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      MEMQL_AZURE_BLOB_CONTAINER: ${MEMQL_AZURE_BLOB_CONTAINER:-attachments}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - memql-cluster

  # Workbench node -- per-Plan sandboxed Linux execution environment
  # for agent headless work (shell exec, filesystem, http_fetch).
  # Receives WorkbenchForwardRequest envelopes from agent peers via
  # NodeService.Stream and dispatches into the local workbench
  # integration's six action handlers. Workspaces live under
  # /var/lib/memql/workbenches and persist across container restarts
  # via the workbench_workspaces named volume.
  #
  # 2 replicas (staging parity). With replicas the per-Plan workspace is
  # no longer pinned to one container (the agent dialer picks a replica
  # via service-DNS / DB discovery) -- intentional parity surface that
  # exposes the same cross-node workbench routing path staging sees. The
  # named volume is shared across replicas on a single host, so a
  # workspace provisioned by one replica is visible to the other on the
  # same Docker engine.
  workbench:
    build:
      # Carrier-built (engine + CoPresent DSL), same source as staging (#1053).
      context: ../..
      dockerfile: memql-bff-copresent/Dockerfile
      args:
        BUILD_TAGS: workbench
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      MEMQL_NODE_TYPE: workbench
      # memql#1042 fix: force MEMQL_NODE_ID empty so the per-replica
      # hostname id (memql#1213) wins over the shared "bff-local" that
      # leaks in from the genesis env_file. Empty -> os.Hostname().
      MEMQL_NODE_ID: ""
      # Allow the in-cluster plaintext http://identity:8081 node-bootstrap
      # (the worker self-mints its class="node" JWT). Without this the
      # node sends no auth header and every NodeService.Stream call fails.
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # MEMQL_NODE_ID UNSET -> hostname-derived per replica (#1213).
      MEMQL_NODE_ADDRESS: workbench:50060
      MEMQL_NODE_SERVICE_ADDRESS: ":50060"
      MEMQL_PARENT_ADDRESS: bff:50058
      MEMQL_WORKBENCH_ROOT: /var/lib/memql/workbenches
      # Inter-node peer auth (memql#338).
      MEMQL_NODE_TOKEN: ${MEMQL_WORKBENCH_NODE_TOKEN:-}

      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVER_ADDRESS: "0.0.0.0:8085"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
      # Local Azure Blob Storage via Azurite (memql#806). Matches the
      # agent node so workbench-initiated uploads go to the same emulator.
      MEMQL_AZURE_STORAGE_CONNECTION_STRING: ${MEMQL_AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      MEMQL_AZURE_BLOB_CONTAINER: ${MEMQL_AZURE_BLOB_CONTAINER:-attachments}
    deploy:
      replicas: 2
    volumes:
      - workbench_workspaces:/var/lib/memql/workbenches
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - memql-cluster

  # Planner node -- task planning and orchestration.
  # 2 replicas (staging parity); per-replica hostname-derived node id.
  planner:
    build:
      # Carrier-built (engine + CoPresent DSL), same source as staging (#1053).
      context: ../..
      dockerfile: memql-bff-copresent/Dockerfile
      args:
        BUILD_TAGS: planner
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      # Inter-node peer auth (memql#338).
      MEMQL_NODE_TOKEN: ${MEMQL_PLANNER_NODE_TOKEN:-}
      MEMQL_NODE_TYPE: planner
      # memql#1042 fix: force MEMQL_NODE_ID empty so the per-replica
      # hostname id (memql#1213) wins over the shared "bff-local" that
      # leaks in from the genesis env_file. Empty -> os.Hostname().
      MEMQL_NODE_ID: ""
      # Allow the in-cluster plaintext http://identity:8081 node-bootstrap
      # (the worker self-mints its class="node" JWT). Without this the
      # node sends no auth header and every NodeService.Stream call fails.
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # MEMQL_NODE_ID UNSET -> hostname-derived per replica (#1213).
      MEMQL_NODE_ADDRESS: planner:50056
      MEMQL_NODE_SERVICE_ADDRESS: ":50056"
      MEMQL_PARENT_ADDRESS: bff:50058

      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVER_ADDRESS: "0.0.0.0:8085"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - memql-cluster

  # Identity node -- in-house auth provider (magic-link, JWT issuance,
  # JWKS publishing, web UI, admin app, PAT management).
  #
  # 2 replicas -- FULL staging parity (memql#1304). Staging runs identity at
  # replicas: 2 with a per-replica fieldRef node id (deploy/k8s/base/identity.yaml);
  # this mirrors that on a single Docker host by:
  #   (a) dropping the host port-map 8081:8081 -- two replicas can't bind one
  #       host port, so identity is reached ONLY through the nginx :443 front
  #       door on the identity.${DOMAIN} subdomain (memql#1313), which proxies
  #       the full identity surface to identity:8081 via the resolver +
  #       variable-upstream pattern, so it load-balances across both replicas;
  #   (b) dropping container_name + hostname + the static MEMQL_NODE_ID so each
  #       replica gets a unique container name and a hostname-derived node id
  #       (memql#1213), avoiding the memql#1042 node-id collision; and
  #   (c) moving IDENTITY_BASE_URL + the issuer claim onto the TLS
  #       identity.${DOMAIN} subdomain (IDENTITY_VERIFIER_BASE_URL still uses
  #       the in-cluster identity:8081 service name for the JWKS fetch, which
  #       DNS-round-robins across replicas).
  # See docs/public/operate/reproduce-staging-locally.md.
  identity:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_TAGS: identity
    deploy:
      replicas: 2
    env_file:
      - ${GENESIS_ENV_FILE:-../.env.local}
    environment:
      MEMQL_NODE_TYPE: identity
      # memql#1042 fix: force MEMQL_NODE_ID empty so the per-replica
      # hostname id (memql#1213) wins over the shared "bff-local" that
      # leaks in from the genesis env_file. Empty -> os.Hostname().
      MEMQL_NODE_ID: ""
      # MEMQL_NODE_ID intentionally UNSET -- derived from the container hostname
      # per replica (memql#1213). A static id would collide across the 2
      # replicas (the memql#1042 node-id-collision chat-outage shape).
      MEMQL_NODE_ADDRESS: identity:50061
      MEMQL_NODE_SERVICE_ADDRESS: ":50061"
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@postgres:5432/memql?sslmode=disable
      MEMQL_GRPC_ADDRESS: ":50051"
      SERVER_ADDRESS: "0.0.0.0:8081"
      IDENTITY_VERIFIER_BASE_URL: ${IDENTITY_VERIFIER_BASE_URL:-http://identity:8081}
      # Node-bootstrap secret (memql#338). When set on both this node
      # AND the identity service, a node that boots without an
      # operator-provisioned MEMQL_NODE_TOKEN self-mints a class="node"
      # JWT via identity's POST /node/bootstrap. Default is a known dev
      # value so `docker compose up` works out of the box; production
      # overrides via .env.local or shell export.
      MEMQL_NODE_BOOTSTRAP_TOKEN: ${MEMQL_NODE_BOOTSTRAP_TOKEN:-dev-bootstrap-do-not-use-in-production-memql338}
      IDENTITY_VERIFIER_EXPECTED_ISSUER: ${IDENTITY_VERIFIER_EXPECTED_ISSUER:-https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}}
      IDENTITY_ENABLED: "true"
      # Public origin browsers + cockpits dial (memql#1313). The wildcard
      # DNS record (`*.${IDENTITY_BOOTSTRAP_DOMAIN}` -> 127.0.0.1) plus the
      # nginx :443 server block for identity.${DOMAIN} deliver this URL to
      # the identity HTTP listener (host-routed config in
      # docker/nginx/templates/default.conf.template).
      IDENTITY_BASE_URL: https://identity.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      IDENTITY_KEY_DIR: /var/identity/keys

      # Dev escape hatch: admit plaintext HTTP requests to /node/bootstrap.
      # The docker network is in-cluster plain HTTP between containers; the
      # bootstrap endpoint defaults to requiring HTTPS (the secret is a
      # long-lived bearer credential). Production deploys must leave this
      # unset and terminate TLS at the ingress (or set X-Forwarded-Proto:
      # https on the proxy).
      MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP: ${MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP:-1}
      # Same dev escape hatch for the pair endpoints. Already part of the
      # pre-existing #338 surface but compose never set it; included here
      # so the pair-redeem path also works under the in-cluster plain HTTP.
      MEMQL_IDENTITY_ALLOW_INSECURE_PAIR: ${MEMQL_IDENTITY_ALLOW_INSECURE_PAIR:-1}
      IDENTITY_KEY_ENCRYPTION_KEY: ""
      # Registered OAuth clients (memql#1313). The copresent SPA (#1214) is
      # served at https://app.${DOMAIN} through the nginx :443 front door, so
      # its callback targets that subdomain; the cockpit loopback rule keeps
      # the RFC-8252 portless 127.0.0.1 + localhost forms. clientId stays
      # `copresent` (the VITE_IDENTITY_CLIENT_ID the SPA bundle is built with).
      IDENTITY_REGISTERED_CLIENTS: '[{"clientId":"copresent","redirectURIs":["https://app.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}/auth/callback"]},{"clientId":"cockpit","redirectURIs":["http://127.0.0.1/cockpit/callback","http://localhost/cockpit/callback"]}]'
      IDENTITY_CORS_ALLOWED_ORIGINS: "https://app.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}"
      # Discovery overrides for /.well-known/memql-config.json -- tell the
      # cockpit which gRPC endpoint to dial + which client_id to present.
      # The `https://` scheme makes the cockpit dial TLS against the system
      # trust store (mkcert root CA). nginx routes bff.${DOMAIN}:443 -> the
      # bff gRPC surface; the agent dial endpoint -> agent:50051.
      MEMQL_DISCOVERY_GRPC_ENDPOINT: https://bff.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      MEMQL_DISCOVERY_CLIENT_ID: cockpit
      MEMQL_DISCOVERY_CLUSTER_NAME: local
      # Worker pairing redeems stamp THIS URL so cockpits dial the agent
      # node directly for WorkerService.Stream. nginx routes
      # agent.${DOMAIN}:443 -> agent:50051.
      MEMQL_WORKER_DIAL_ENDPOINT: https://agent.${IDENTITY_BOOTSTRAP_DOMAIN:-local.znas.io}
      IDENTITY_REGISTRATION_MODE: waitlist
      # Branding intentionally unset; operator picks at /admin/settings.
      IDENTITY_BRAND_NAME: ${IDENTITY_BRAND_NAME:-}
      IDENTITY_BRAND_PRIMARY_COLOR: ${IDENTITY_BRAND_PRIMARY_COLOR:-}
    # No host port publish: two replicas can't share 8081:8081. Identity is
    # reached via the nginx :443 front door on identity.${DOMAIN} (see the
    # header note); the internal SERVER_ADDRESS :8081 + the identity:8081
    # service name still work in-cluster and DNS-round-robin across replicas.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cluster_identity_keys:/var/identity/keys
    healthcheck:
      # Other nodes wait on this before starting their JWKS fetch.
      # Same rationale as the full-mode compose: without this gate
      # bff/voice/cognition/agent/planner race identity at startup
      # and burn Docker restarts on the initial JWKS fetch.
      test: ["CMD", "/app/healthcheck", "8081"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - memql-cluster
    restart: unless-stopped

  # LiveKit (memql#1215) -- self-hosted open-source livekit-server for
  # the local voice/video path. Mirrors staging
  # (deploy/k8s/base/livekit.yaml) but uses a single-host dev config:
  # the dev key/secret pair (devkey / secret) is shared with the BFF
  # (mints room tokens) and the voice node (joins rooms). Same major as
  # staging (v1.8). Single replica -- no Redis, standalone node.
  #
  # Dev voice-agent token mint: the BFF mints LiveKit room tokens via
  # PolyphonRoomTokenMsg using POLYPHON_LIVEKIT_API_KEY/SECRET; the voice
  # node joins with LIVEKIT_API_KEY/SECRET (the same pair). No external
  # key vault -- the dev pair is the source of truth locally. For a
  # manual mint, `livekit-cli create-token --api-key devkey --api-secret
  # secret --join --room <room> --identity <id>` against ws://localhost:7880.
  livekit:
    image: livekit/livekit-server:v1.8.0
    container_name: memql-livekit
    hostname: livekit
    # --dev enables the built-in dev key pair (apiKey=devkey,
    # secret=secret) AND relaxes the bind/ICE config for a single-host
    # setup. The BFF + voice nodes default their key/secret to that SAME
    # devkey/secret pair, so tokens minted by the BFF validate here out of
    # the box. NOTE: in --dev mode livekit-server uses its built-in keys;
    # a non-default POLYPHON_LIVEKIT_API_KEY/SECRET override on the BFF
    # would NOT match (drop --dev and mount a config with explicit keys,
    # mirroring deploy/k8s/base/livekit.yaml, if you need a custom pair).
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      # Signaling (ws) + media (WebRTC) on the host so a browser can
      # reach ws://localhost:7880 same-host.
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - memql-cluster
    restart: unless-stopped

  # Azurite -- Azure Blob Storage emulator (memql#806).
  # Provides a local Azure-compatible blob endpoint so attachment uploads
  # from the agent/workbench/computer-use nodes produce real downloadable
  # URLs (http://localhost:10000/devstoreaccount1/<container>/<blob>)
  # instead of the `local://` placeholder that fires when no connection
  # string is set. The agent service reads the well-known dev connection
  # string via MEMQL_AZURE_STORAGE_CONNECTION_STRING (set below).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: memql-azurite
    hostname: azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - cluster_azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - memql-cluster
    restart: unless-stopped

  # pgAdmin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memql-dbadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@memql.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - memql-cluster
    profiles:
      - tools
    restart: unless-stopped

# CoPresent SPA build needs the GitHub Packages token for the private
# @visionarys-io/@znasllc-io SDKs (BuildKit secret, never baked in).
# Export MEMQL_PACKAGES_TOKEN (read:packages for both scopes) before
# `make dev-cluster`. The token resolves from that env var.
secrets:
  node_auth_token:
    environment: MEMQL_PACKAGES_TOKEN

volumes:
  cluster_postgres_data:
    driver: local
  cluster_identity_keys:
    driver: local
  workbench_workspaces:
    driver: local
  cluster_azurite_data:
    driver: local

networks:
  memql-cluster:
    driver: bridge
