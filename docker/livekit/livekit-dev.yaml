# LiveKit dev config for the local Polyphon stack.
#
# Two ICE paths share this server:
#
#  - Browser (same host): negotiates ICE to the `rtc.node_ip` host
#    candidate. Signaling rides ngrok (wss://<random>.ngrok.app -> :7880).
#
#  - Anam CLOUD avatar engine (memql#764 / #770): cannot reach the host's
#    loopback, and ngrok only tunnels signaling -- not UDP media. So Anam
#    relays its media through a standalone coturn reached over a RAW ngrok
#    TCP endpoint, advertised below as an external `rtc.turn_servers` entry.
#
# `use_external_ip: true` is deliberately OFF: it made LiveKit STUN-discover
# the WAN IP and advertise THAT ALONE (overriding node_ip); the browser tried
# the dead WAN candidate first and spent ~15s timing out every join, and Anam
# can't use a WAN UDP candidate either (ngrok doesn't tunnel arbitrary UDP).
#
# THREE values below are environment-specific and re-stamped on every
# `make dev-refresh` by scripts/dev/lib.sh lib_refresh_turn_relay:
#   - rtc.node_ip                 -> polyphon-livekit's docker-bridge IP
#   - rtc.turn_servers[0].host    -> the ngrok TCP tunnel host
#   - rtc.turn_servers[0].port    -> the ngrok TCP tunnel port
# The committed values are safe defaults: node_ip 127.0.0.1 keeps the
# browser-only path working on a stock `docker compose up` (no dev-refresh),
# and the placeholder TURN host is harmless until dev-refresh stamps the real
# tunnel (the browser ignores a dead TURN candidate; only Anam needs it).
# See docs/internal/design/voice-turn-relay.md for the full path + hard-won gotchas.
#
# NB (memql#1277): this relay carries SIGNALING + browser<->LiveKit media only.
# Local CLOUD-avatar VIDEO (Anam / Simli direct avatar) does NOT render -- the
# cloud engine joins signaling but its WebRTC media leg never connects (both
# sides only offer unreachable host candidates; the cloud engine forms no relay
# candidate). Cloud-avatar video is validated on staging (#784).

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # node_ip is the host candidate LiveKit advertises to EVERY participant.
  # For the Anam relay it must be polyphon-livekit's docker-bridge IP (NOT
  # 127.0.0.1): from coturn's container 127.0.0.1 is coturn itself, so the
  # TURN CreatePermission for a loopback candidate fails "403 Forbidden IP".
  # dev-refresh stamps the real docker IP here; 127.0.0.1 is the safe
  # browser-only default for a stock compose-up.
  node_ip: 127.0.0.1
  # External TURN so the Anam CLOUD engine can relay WebRTC media to this
  # local LiveKit. Anam reaches coturn over a RAW ngrok TCP endpoint:
  #   Anam --turn:<ngrok-tcp>?transport=tcp--> ngrok (raw passthrough) --> coturn:3478
  #   coturn relays to LiveKit over the docker network.
  # NB: a RAW ngrok TCP endpoint + plain turn:?transport=tcp, NOT an ngrok TLS
  # endpoint + turns: -- the TLS endpoint mangles the bidirectional TURN
  # stream ("recv: Success"). host/port are stamped from the live tunnel by
  # dev-refresh (a RESERVED ngrok TCP addr keeps them stable across restarts;
  # see docs/internal/design/voice-turn-relay.md). credential is the pinned dev-only literal,
  # kept in sync with docker/coturn/turnserver.conf.
  turn_servers:
    - host: turn-host.stamped-by-dev-refresh.invalid
      port: 3478
      protocol: tcp
      username: livekit
      credential: 54fc7588c919556c921567b313a66585

keys:
  devkey: secret

logging:
  level: debug

development: true
