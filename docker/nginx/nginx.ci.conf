# Nginx front door -- CI / co-tenant override ONLY (memql#1313).
#
# The DEV front door (docker-compose.cluster.yml) now serves at the TLS
# `*.${DOMAIN}` subdomains via docker/nginx/templates/default.conf.template.
# The cross-replica delivery gate (scripts/test/cluster-e2e.sh +
# test/clustere2e) runs UNATTENDED in CI where mkcert's root CA is not
# installed, so a TLS front door would fail cert verification. This config
# is a plain-HTTP, single-origin front door (http://localhost:8085 ->
# container :8080, gRPC :50050 -> container :50051) that the CI override
# (docker-compose.cluster.ci.yml) mounts in place of the TLS templates so
# the synthetic gate can drive the cluster over plaintext.
#
# It mirrors the staging public-entry ingress along the routing map (path-
# based, single origin) -- NOT the dev TLS subdomains. Keep it in sync with
# the template's upstream port map (bff:8088 / bff:50051 / identity:8081 /
# voice:8085 / copresent:8080).
#
# Multi-replica load balancing (memql#1213): every upstream is addressed
# through a runtime *variable* (`set $bff_t bff:8088; proxy_pass ...`)
# paired with the `resolver` below, so per-request re-resolution spreads
# traffic across replica IPs (and survives a replica being recreated).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS (127.0.0.11). 10s TTL so a recreated replica
    # (new IP) is picked up quickly; ipv6=off avoids the AAAA /
    # link-local unreachable path documented in the TLS template.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade: map the Upgrade header so idle (non-WS) requests
    # don't carry a bogus "Connection: upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Shared proxy headers applied in every HTTP location below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # --------------------------------------------------------------
    # HTTP front door (host :8085 -> container :8080). Single origin,
    # path-routed, mirrors the staging app-main + app-identity-proxy
    # ingresses.
    # --------------------------------------------------------------
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # Big bodies for attachment uploads (/spaces/{id}/attachments).
        client_max_body_size 50m;

        # ---- Identity surface -> identity (mirror staging app-identity-proxy) ----
        # Identity runs 2 replicas with NO host port (memql#1304), so the
        # FULL identity surface is reached through this front door. The
        # `set $id_t identity:8081` variable + `resolver` DNS-round-robin
        # spreads these across BOTH identity replicas.
        #
        # The two SPA-owned /auth routes are pinned with EXACT matches so the
        # longest-prefix `location /auth/` below cannot steal them:
        #   - /auth/callback : the post-magic-link redirect lands in the SPA.
        #   - /auth/oauth    : SPA client-side route.
        location = /auth/callback { set $spa_a copresent:8080; proxy_pass http://$spa_a; }
        location = /auth/oauth    { set $spa_a copresent:8080; proxy_pass http://$spa_a; }
        # Everything else under these identity-owned prefixes -> identity
        # (login / magic-link / complete / refresh / logout, the OAuth token
        # endpoint, JWKS, the first-run /setup wizard, and the /admin app).
        location /auth/        { set $id_t identity:8081; proxy_pass http://$id_t; }
        location /oauth/       { set $id_t identity:8081; proxy_pass http://$id_t; }
        location /.well-known/ { set $id_t identity:8081; proxy_pass http://$id_t; }
        location /setup        { set $id_t identity:8081; proxy_pass http://$id_t; }
        location /admin        { set $id_t identity:8081; proxy_pass http://$id_t; }

        # ---- Audio WS -> voice (STT lives on voice, not bff) ----
        # Longer prefix than /memql so it wins.
        location /memql/audio {
            set $voice_t voice:8085;
            proxy_pass http://$voice_t;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ---- memQL WS bridge + HTTP (/memql/ws, /spaces/.../attachments,
        #      /polyphon/*, /healthz) -> bff. Load-balanced across bff
        #      replicas via the resolver + variable upstream. ----
        location /memql {
            set $bff_t bff:8088;
            proxy_pass http://$bff_t;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ---- SPA (everything else) -> copresent. ----
        location / {
            set $spa_t copresent:8080;
            proxy_pass http://$spa_t;
            # copresent's Express server also serves the bundle; WS upgrade
            # is harmless here and lets any same-origin WS ride through.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # --------------------------------------------------------------
    # gRPC front door (host :50050 -> container :50051). MemqlService +
    # NodeService on the bff, load-balanced across bff replicas.
    # --------------------------------------------------------------
    server {
        listen 50051 http2;
        listen [::]:50051 http2;
        server_name _;

        location / {
            set $bff_grpc bff:50051;
            grpc_pass grpc://$bff_grpc;
            grpc_set_header Host      $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
        }
    }
}
