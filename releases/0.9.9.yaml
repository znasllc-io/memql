# Release lockfile (deployment-v2 Phase 4, znasllc-io/memql#702).
#
# An ATOMIC release = the set of 8 component digests validated together. This is
# the unit of promotion: staging->prod copies these EXACT digests into the prod
# overlay (no rebuild; environments differ only by config). A digest can only be
# promoted if it appears in a lockfile, and a lockfile is only written after a
# green deep gate -- so a tag can never drift from what was validated (#684 at
# the release level).
#
# 0.9.9 is the inaugural lockfile: the digests captured from the live staging
# cluster at the Phase 1 (#699) digest cutover. Assembled by
# scripts/release/assemble-lockfile.sh; promoted by scripts/release/promote.sh.
