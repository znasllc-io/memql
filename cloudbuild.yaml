# memQL Cloud Build — Google Cloud Run (Multi-Client)
#
# Usage:
#   Manual:  gcloud builds submit --config cloudbuild.yaml \
#              --substitutions=COMMIT_SHA=$(git rev-parse HEAD),_MEMQL_SERVICE_NAME=memql-anequim,...
#   Trigger: Attach to a Cloud Build trigger on the desired branch
#            with substitution overrides for the target client.
#
# This builds the memQL Docker image, pushes it to Artifact Registry,
# and deploys to Cloud Run using service.yaml as the service definition.
#
# Default substitution values target the Anequim client.
# Override via trigger or --substitutions for other clients.
#
# See DEPLOYMENT_STRATEGY.md for full deployment documentation.

substitutions:
  _DEPLOY_REGION: 'us-central1'
  _MEMQL_SERVICE_NAME: 'anequim-memql-staging'
  _MEMQL_HOST: 'anequim-memql-staging-439288787761.us-central1.run.app'
  _DSN_SECRET: 'MEMORY_NODES_DATABASE_DSN_ANEQUIM'
  _CONTENTID_SALT_SECRET: 'MEMORY_NODES_CONTENTID_SALT_ANEQUIM'
  _IDENTITY_HOST: 'auth.example.com'

steps:
  # ===========================================================================
  # 1. Build the Docker image
  #    Tagged with $COMMIT_SHA (unique, forces new Cloud Run revision)
  #    and :latest (convenience for humans)
  # ===========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:latest'
      - '.'

  # ===========================================================================
  # 2. Push BOTH tags to Artifact Registry
  # ===========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:latest']

  # ===========================================================================
  # 3. Prepare service.yaml (inject all client-specific values)
  # ===========================================================================
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|IMAGE_PLACEHOLDER|us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA|g" service.yaml
        sed -i "s|SERVICE_NAME_PLACEHOLDER|${_MEMQL_SERVICE_NAME}|g" service.yaml
        sed -i "s|REGION_PLACEHOLDER|${_DEPLOY_REGION}|g" service.yaml
        sed -i "s|DSN_SECRET_PLACEHOLDER|${_DSN_SECRET}|g" service.yaml
        sed -i "s|CONTENTID_SALT_SECRET_PLACEHOLDER|${_CONTENTID_SALT_SECRET}|g" service.yaml
        sed -i "s|IDENTITY_HOST_PLACEHOLDER|${_IDENTITY_HOST}|g" service.yaml
        sed -i "s|MEMQL_HOST_PLACEHOLDER|${_MEMQL_HOST}|g" service.yaml

  # ===========================================================================
  # 4. Deploy to Cloud Run via service.yaml
  #    The $COMMIT_SHA tag forces Cloud Run to create a new revision every
  #    time, avoiding the ":latest no-op" trap.
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'service.yaml'
      - '--region=${_DEPLOY_REGION}'

  # ===========================================================================
  # 5. Allow unauthenticated traffic (idempotent)
  #    Required for new services; gcloud run services replace does not set IAM.
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - '${_MEMQL_SERVICE_NAME}'
      - '--region=${_DEPLOY_REGION}'
      - '--member=allUsers'
      - '--role=roles/run.invoker'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:latest'

options:
  logging: CLOUD_LOGGING_ONLY
