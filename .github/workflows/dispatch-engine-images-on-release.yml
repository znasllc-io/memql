name: dispatch-engine-images-on-release

# Structural gap closed by #2519: release 0.12.1 was cut but
# build-engine-images (workflow_dispatch-only) was never run for it, so the
# release silently had no images in ACR.
#
# This workflow fires on every published release and re-dispatches
# build-engine-images with the release tag as the version. It deliberately
# does NOT build images itself: the Azure OIDC federated credential subject is
# `repo:znasllc-io/memql:ref:refs/heads/main`, and a release-event run executes
# on the tag ref, so azure/login would fail here. workflow_dispatch runs on the
# default branch, which preserves the OIDC subject -- the same reason the build
# workflow is dispatch-shaped in the first place.
#
# GITHUB_TOKEN can create workflow_dispatch events (it is one of the two
# documented exceptions to the no-recursive-triggering rule), so no PAT is
# needed. Manual dispatch of build-engine-images remains available for
# backfills and re-pushes (allow_overwrite).

on:
  release:
    types: [published]

# Default the whole workflow to read-only; the one job that needs to create a
# workflow_dispatch event narrows UP to actions:write locally, so the elevated
# token is never granted at the top level (Scorecard Token-Permissions #415).
permissions:
  contents: read

jobs:
  dispatch:
    name: dispatch build-engine-images ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # gh workflow run creates a workflow_dispatch event
    steps:
      - name: Dispatch build-engine-images for the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # TWO CONVENTIONS, ONE RELEASE (memql#4061). Git tags carry the `v`
          # -- clone-stack.sh checks out exactly `v0.19.0` -- and image tags do
          # not. `imageTagFor()` in the extension strips it, so an install pins
          # ghcr.io/znasllc-io/memql-bff:0.19.0, and build-engine-images uses
          # this input VERBATIM as the tag it pushes.
          #
          # So forwarding the tag unchanged builds `memql-bff:v0.19.0`: a green
          # build, an immutable tag burned at the wrong name, and every pod of
          # the release in ImagePullBackOff. Strip it here, where the release
          # event is the only thing that knows the value came from a ref.
          VERSION="${TAG#v}"
          echo "Dispatching build-engine-images for version ${VERSION} (release tag ${TAG})"
          gh workflow run build-engine-images.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f version="$VERSION"
