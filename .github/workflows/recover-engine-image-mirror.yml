name: recover-engine-image-mirror

# Repair a partial two-registry publication without rebuilding or moving tags.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Bare published release version (X.Y.Z)
        required: true
        type: string
      source_sha:
        description: Full commit named by the published release tag
        required: true
        type: string
      node:
        description: Engine node whose GHCR version tag is missing
        required: true
        type: choice
        options: [identity, mcp, bff, agent, planner, workbench, edge]
      digest:
        description: Exact sha256 digest already published under this ACR version tag
        required: true
        type: string

permissions:
  contents: read

# Serialize with the original publisher as well as other recovery attempts.
concurrency:
  group: build-engine-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && github.repository == 'znasllc-io/memql'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the reviewed recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for binary metadata inspection
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the digest-preserving registry copier
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Authenticate to Azure through OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to the source registry
        run: az acr login --name acrmemql

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify provenance and recover the missing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          NODE: ${{ inputs.node }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          # Both registry logins wrote Docker's auth file; skopeo reads it too.
          export REGISTRY_AUTH_FILE="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          scripts/release/recover-engine-image-mirror.sh \
            --version="$VERSION" --sourceSha="$SOURCE_SHA" --node="$NODE" --digest="$DIGEST" \
            | tee "$RUNNER_TEMP/engine-mirror-result.json"
          jq -r '.result | "Recovered release image: \(.status)\n\nSource: `\(.source)`\n\nTarget: `\(.target)`\n\nVerified digest: `\(.digest)`\n\nRelease commit: `\(.sourceSha)`"' \
            "$RUNNER_TEMP/engine-mirror-result.json" >> "$GITHUB_STEP_SUMMARY"
