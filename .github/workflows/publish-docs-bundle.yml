name: publish-docs-bundle

# Attaches `docs-<X.Y.Z>.tgz` -- the documentation bundle memql.io consumes --
# to a GitHub Release. Docs version == engine release (VERSIONING.md,
# docs/DOCS_STANDARD.md section 5).
#
# The bundle is built AT THE RELEASE TAG by scripts/docs/build-docs-bundle.sh:
# docs/public/** whose front-matter is `audience: public`, plus the generated
# reference (cmd/docs-gen) and a manifest.json nav tree. The website's
# scripts/fetch-docs-bundle.mjs downloads this asset by name.
#
# Why this is a workflow: the asset used to be attached by
# scripts/release/publish-releases.sh (#1172), which was removed along with the
# product release estate in #2429 -- silently dropping the asset from 0.12.0
# onward and stranding memql.io on stale docs. Per CLAUDE.md the build server is
# the source of truth for release artifacts, not an operator machine, so it
# belongs here rather than in a hand-run script.
#
# workflow_dispatch backfills a release cut before this workflow existed, or
# re-uploads after a docs fix. NOTE: the bundle always reflects the docs AS OF
# THAT TAG -- backfilling an old tag will not pick up later docs fixes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build and attach the bundle for (e.g. 0.14.0)'
        required: true
        type: string

permissions:
  contents: write # gh release upload

jobs:
  publish:
    name: build + attach docs bundle
    runs-on: ubuntu-latest
    steps:
      - name: resolve target tag
        id: target
        env:
          # On a release event this is the tag; on workflow_dispatch it is the input.
          TAG: ${{ github.event.inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "ERROR: could not resolve a release tag" >&2
            exit 1
          fi
          # The site resolves bundles by bare X.Y.Z. Other tags in this repo do
          # cut releases (e.g. memql-sdk-core-v*) and have no docs bundle -- skip
          # those quietly rather than failing the run on an unrelated release.
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "INFO: '$TAG' is not a bare X.Y.Z engine release; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "INFO: building docs bundle for $TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.target.outputs.skip != 'true'
        with:
          go-version: '1.26.5'

      - name: build bundle
        if: steps.target.outputs.skip != 'true'
        run: bash scripts/docs/build-docs-bundle.sh --version="${{ steps.target.outputs.tag }}"

      - name: verify bundle
        if: steps.target.outputs.skip != 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          tarball="docs-${TAG}.tgz"
          [ -f "$tarball" ] || { echo "ERROR: $tarball was not produced" >&2; exit 1; }
          # A bundle with no manifest is unusable to the site; fail loudly rather
          # than attaching a broken asset.
          tar -tzf "$tarball" | grep -qx './manifest.json' \
            || { echo "ERROR: $tarball has no manifest.json" >&2; exit 1; }
          echo "INFO: $tarball contains $(tar -tzf "$tarball" | grep -c '\.md$') markdown files"

      - name: attach to release
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: gh release upload "$TAG" "docs-${TAG}.tgz" --clobber
