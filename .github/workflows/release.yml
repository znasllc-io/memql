name: Release binaries

on:
  # `created`, not `published` (memql-cockpit#525): cut-release.sh creates
  # the release as a DRAFT, this workflow fills it, and the script publishes
  # it only once every asset is there -- so `releases/latest` never points at
  # a release whose binaries are still building. A release published
  # directly, without a draft, fires `created` too.
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to"
        required: true

# Top-level read-only; the jobs that upload release assets elevate to
# contents:write themselves (Scorecard TokenPermissions: workflow-level write
# over-grants every job).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: memql-cockpit/go.mod

      - name: Tidy modules (sync go.mod/go.sum with the memql sibling)
        working-directory: memql-cockpit
        run: go mod tidy

      - name: Package distributable archives + checksums (headless, all platforms)
        working-directory: memql-cockpit
        run: make dist

      - name: Upload raw binaries to the release
        working-directory: memql-cockpit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            bin/memql-darwin-arm64 \
            bin/memql-darwin-amd64 \
            bin/memql-linux-amd64 \
            bin/memql-linux-arm64 \
            --clobber
          # The raw headless binaries' own manifest (memql-cockpit#525): the
          # installers verify a binary against it BEFORE running it. The
          # versioned memql-<version>-SHA256SUMS keeps covering exactly the
          # tar.gz archives.
          (cd bin && sha256sum memql-darwin-arm64 memql-darwin-amd64 memql-linux-amd64 memql-linux-arm64) > memql-SHA256SUMS
          cat memql-SHA256SUMS
          gh release upload "$TAG" memql-SHA256SUMS --clobber

      - name: Upload distributable archives + SHA256SUMS to the release
        working-directory: memql-cockpit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*-SHA256SUMS --clobber

  # The computer-use variant is built NATIVELY, one runner per platform: CGO +
  # RobotGo rules out cross-compiling the four platforms from the one ubuntu
  # host the headless job uses, and the token installers under scripts/install/
  # download memql-computeruse-<os>-<arch> raw binaries (--computeruse), so
  # each leg builds for its own host and uploads exactly one asset. Raw
  # binaries on purpose -- dist tarballs stay headless-only (documented in the
  # Makefile's dist section).
  #
  # Runner labels: macos-latest is the Apple Silicon image; macos-15-intel is
  # GitHub's last x86_64 macOS image (macos-13 was retired 2025-12-04,
  # actions/runner-images#13046; the Intel label is #13045, available until
  # Aug 2027); ubuntu-24.04-arm is the GA arm64 runner for public repos.
  computeruse:
    strategy:
      # One retired/mislabeled runner must not sink the other three uploads;
      # the checksums job below still gates the manifest on all four.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    name: computeruse (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: memql-cockpit/go.mod

      - name: Refuse to publish a mislabeled binary
        # The artifact NAME comes from the matrix; the binary comes from the
        # HOST. If a runner label ever drifts (macos-latest changing arch is
        # the live precedent), the mismatch would ship a binary that fails
        # with 'exec format error' on the platform its name claims -- and the
        # workflow would stay green. Fail the leg instead.
        env:
          WANT_OS: ${{ matrix.os }}
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          host_os="$(go env GOOS)"; host_arch="$(go env GOARCH)"
          if [ "$host_os" != "$WANT_OS" ] || [ "$host_arch" != "$WANT_ARCH" ]; then
            echo "::error::runner is ${host_os}/${host_arch} but the matrix leg says ${WANT_OS}/${WANT_ARCH}; a native CGO build here would publish a mislabeled binary"
            exit 1
          fi
          echo "host matches matrix: ${host_os}/${host_arch}"

      - name: Tidy modules (sync go.mod/go.sum with the memql sibling)
        working-directory: memql-cockpit
        run: go mod tidy

      - name: Install X11 dev headers (RobotGo CGO deps)
        if: runner.os == 'Linux'
        # The same list ci.yml's build-computeruse job compiles green with --
        # the Makefile's four (libxtst/libxinerama/libxkbcommon/libpng) plus
        # the xkbcommon-x11 / x11 / xi headers RobotGo's cgo actually
        # includes on these images.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libpng-dev libx11-dev libxi-dev

      - name: Build computeruse (native CGO, host-stamped artifact name)
        working-directory: memql-cockpit
        run: make cockpit-computeruse-host

      - name: Package native menu companion (macOS)
        if: runner.os == 'macOS'
        working-directory: memql-cockpit
        run: |
          ./scripts/macos/package-menubar.sh --arch=${{ matrix.arch }}
          python3 scripts/macos/package_test.py --archive=dist/memql-menubar-darwin-${{ matrix.arch }}.tar.gz

      - name: Upload native menu companion and checksum
        if: runner.os == 'macOS'
        working-directory: memql-cockpit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/memql-menubar-*.tar.gz dist/memql-menubar-*.sha256 --clobber

      - name: Package native permission-bearing MemQL app
        if: runner.os == 'macOS'
        working-directory: memql-cockpit
        run: |
          ./scripts/macos/package-app.sh --worker="$PWD/bin/memql-computeruse-darwin-${{ matrix.arch }}" --arch=${{ matrix.arch }}
          python3 scripts/macos/app_package_test.py --archive=dist/memql-app-darwin-${{ matrix.arch }}.tar.gz

      - name: Upload native MemQL app and checksum
        if: runner.os == 'macOS'
        working-directory: memql-cockpit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/memql-app-*.tar.gz dist/memql-app-*.sha256 --clobber

      - name: Upload computeruse binary to the release
        working-directory: memql-cockpit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BINARY: bin/memql-computeruse-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          gh release upload "$TAG" "$BINARY" --clobber

  # The headless SHA256SUMS is written by `make dist` inside one job, but the
  # four computeruse binaries come from four separate runners, so their
  # manifest is assembled AFTER the uploads from what actually landed on the
  # release. A separate memql-computeruse-SHA256SUMS asset on purpose: the
  # headless memql-<version>-SHA256SUMS is grep'd by asset name in install.sh
  # and must keep covering exactly the tar.gz archives.
  #
  # needs: [computeruse] only (not build): the manifest covers only the
  # computeruse binaries, and it should still land when the headless job
  # fails independently. The explicit four-name sha256sum below is the
  # completeness gate -- a missing binary fails this job rather than
  # shipping a manifest that silently covers three.
  computeruse-checksums:
    needs: [computeruse]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksum the four computeruse binaries + upload the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir assets
          # Exact-name patterns, never memql-computeruse-*: on a re-run that
          # glob also matches the manifest itself, which would then checksum
          # its own previous version into the new one.
          gh release download "$TAG" --dir assets \
            --pattern 'memql-computeruse-darwin-arm64' \
            --pattern 'memql-computeruse-darwin-amd64' \
            --pattern 'memql-computeruse-linux-amd64' \
            --pattern 'memql-computeruse-linux-arm64'
          cd assets
          sha256sum \
            memql-computeruse-darwin-arm64 \
            memql-computeruse-darwin-amd64 \
            memql-computeruse-linux-amd64 \
            memql-computeruse-linux-arm64 \
            > memql-computeruse-SHA256SUMS
          cat memql-computeruse-SHA256SUMS
          gh release upload "$TAG" memql-computeruse-SHA256SUMS --clobber

  sbom:
    needs: [build, computeruse, computeruse-checksums]
    permissions:
      contents: write
    uses: ./.github/workflows/sbom.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
