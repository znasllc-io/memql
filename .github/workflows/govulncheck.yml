name: govulncheck

# govulncheck is a non-blocking advisory scanner: a newly-disclosed
# CVE in a dependency is not introduced by the PR under review, so
# gating every PR on it adds runner time without catching regressions
# the author can act on. It runs on every push to main and weekly on a
# schedule (Tier 0, #855); the merge queue (#858) re-runs it on the
# batched merge candidate.
on:
  push:
    branches: [main]
  # Merge queue (#858): re-run the advisory scan on the batched merge
  # candidate, matching the header note. This job publishes the check-run
  # `govulncheck` (memql#3210); it is advisory and is NOT a required context
  # in ruleset 16630577, which requires `ci-required` only.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The check-run name is `govulncheck`, not `scan` (memql#3210) -- see the
  # note on gitleaks.yml's job for why. Guarded by
  # `scripts/dev/workflow_check_name_uniqueness_test.go`.
  scan:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: govulncheck ./...
