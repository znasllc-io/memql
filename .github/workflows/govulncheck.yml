name: govulncheck

# govulncheck is a non-blocking advisory scanner: a newly-disclosed
# CVE in a dependency is not introduced by the PR under review, so
# gating every PR on it adds runner time without catching regressions
# the author can act on. It runs on every push to main and weekly on a
# schedule (Tier 0, #855); the merge queue (#858) re-runs it on the
# batched merge candidate.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.4'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: govulncheck ./...
