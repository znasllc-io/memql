name: govulncheck

# govulncheck is a non-blocking advisory scanner: a newly-disclosed
# CVE in a dependency is not introduced by the PR under review, so
# gating every PR on it adds runner time without catching regressions
# the author can act on. It runs on every push to main and weekly on a
# schedule (Tier 0, #855); the merge queue (#858) re-runs it on the
# batched merge candidate.
on:
  push:
    branches: [main]
  # Merge queue (#858): re-run the advisory scan on the batched merge
  # candidate, matching the header note. The `scan` context that gates
  # the queue is satisfied by gitleaks; this adds govulncheck's advisory
  # coverage to the candidate too.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: govulncheck ./...
