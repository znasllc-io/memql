name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue (Tier 3, #858): if the "Analyze" checks are required for
  # merge, they must also run on the queue's merge candidate or the queue
  # would stall on a never-reported required check.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

# Cancel a superseded CodeQL run when a new commit is pushed to the
# same PR; main pushes key off the commit SHA so they never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Least-privilege at the workflow level: every step that doesn't
# need to write security-events gets read-only. security-events:
# write is hoisted INTO the analyze job only -- the only place
# SARIF gets uploaded.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # Richer suite: security queries + maintainability/quality
          # queries, instead of the default security-only set.
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:${{ matrix.language }}"
