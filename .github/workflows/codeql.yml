name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue (Tier 3, #858): if the "Analyze" checks are required for
  # merge, they must also run on the queue's merge candidate or the queue
  # would stall on a never-reported required check.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

# Cancel a superseded CodeQL run when a new commit is pushed to the
# same PR; main pushes key off the commit SHA so they never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Least-privilege at the workflow level: every step that doesn't
# need to write security-events gets read-only. security-events:
# write is hoisted INTO the analyze job only -- the only place
# SARIF gets uploaded.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # go + python + javascript-typescript (memql#3157). GitHub Code
        # Quality used to cover these three; it was retired because it is the
        # ONLY billable line item on this org ($27.03 in 2026-07) while this
        # workflow runs free on a public repo. It is BACK -- see the note on
        # `queries:` below, which is why that suite narrowed -- but this matrix
        # does not change: dropping a language here would be a real SAST
        # regression, not a cleanup, and the repo genuinely contains Python
        # (74 KB) and TypeScript (257 KB).
        language: [go, python, javascript-typescript]

    steps:
      # Merge-queue fast pass (memql#1539): on `merge_group` we do NOT re-run
      # CodeQL. The analyze step uploads SARIF keyed to the ephemeral
      # `gh-readonly-queue/main/pr-*` ref, which the merge queue tears down
      # before the upload lands -- the upload then errors with "ref ... not
      # found" and the `Analyze (<lang>)` checks go red, wedging the queue.
      # Re-analysis on the merge candidate adds no coverage anyway: the
      # same tree was already analyzed on the PR, and push-to-main + the weekly
      # cron re-scan after merge. So on `merge_group` the job is a no-op that
      # simply reports each `Analyze (<lang>)` context green; the real
      # CodeQL run stays on pull_request / push:main / schedule.
      - name: merge-queue no-op (CodeQL already ran on the PR)
        if: github.event_name == 'merge_group'
        run: echo "CodeQL is not re-run on merge_group; PR + push:main + weekly schedule provide coverage (memql#1539)."
      - if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name != 'merge_group'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # SECURITY QUERIES, EXTENDED -- not `security-and-quality`.
          #
          # CORRECTION (memql#5016). This comment previously said the quality
          # half produced a result set the analysis could not hold, and that
          # narrowing the suite was "the whole of this workflow's
          # reliability". THAT WAS WRONG, and it is left here stated rather
          # than quietly rewritten, because the wrong reason is the more
          # instructive one.
          #
          # The narrowing worked as a narrowing -- 57 queries became 36 -- and
          # changed the crash not at all. `Analyze (go)` still died with
          #
          #     [36/36 eval 13m34s] Query failed:
          #       codeql/go-queries/Security/CWE-601/BadRedirectCheck.ql
          #       (Result set is larger than the limit of 2GiB).
          #
          # ONE query is the load, not the accumulation: the failure is
          # attributed by name, the other 35 wrote their results successfully,
          # and it ran LONGER after the narrowing (13m34s against 9m10s) --
          # with less competing for the same `--ram --threads`, it took more of
          # the box. That query is excluded by rule id in
          # .github/codeql/codeql-config.yml, which is what actually fixed
          # this; the reasoning lives there, beside the exclusion.
          #
          # The narrowing is KEPT on its own merits, which are real but
          # smaller: the maintainability half is already computed on every
          # commit by GitHub's Code Quality product (`dynamic/github-code-
          # quality/codeql`, green throughout), so running it here bought a
          # duplicate.
          # GitHub disables diff-informed analysis past ~300 changed files, so
          # a small pull request never reaches the crashing step and a large
          # one always does -- along with every push to main, which is always
          # a full run. The lane was therefore broken for exactly the changes
          # that most need it (refactors, removals, regenerations) while small
          # ones sailed through, and a red `Analyze (go)` blocked the owner
          # merge path (scripts/dev/merge-as-owner.sh) on those and only those.
          #
          # WHY DROPPING THE QUALITY HALF COSTS NOTHING. The matrix comment
          # above says GitHub's Code Quality product "was retired because it is
          # the ONLY billable line item on this org". That is no longer true:
          # Code Quality runs on every pull request, every push to main and on
          # a schedule (16 runs in the last 100 workflow runs at the time of
          # writing, all green), under `dynamic/github-code-quality/codeql`.
          #
          # BEWARE when reading a rollup: that product emits a check named
          # `Analyze (go)` TOO, and its run is always green. Two checks, one
          # name. Discriminate on the run's `path` -- `.github/workflows/
          # codeql.yml` is this workflow, `dynamic/github-code-quality/codeql`
          # is the other product.
          #
          # `security-extended` rather than plain `security`: it keeps more
          # security queries than the default set, so this narrowing loses no
          # SECURITY coverage at all. Only the quality half goes.
          #
          # THE NEGATIVE CONTROL for any future change to this line or to the
          # config's filters is the query count the log prints as
          # `[N/N eval ...]`. It is 36 with this suite and 35 with the
          # exclusion. A filter naming an id that does not exist excludes
          # nothing and is indistinguishable from one that works -- both leave
          # a green check once the crash stops, and the crash only stops if
          # the count actually drops.
          queries: security-extended
      # autobuild is only meaningful for the compiled language. python and
      # javascript-typescript are interpreted -- CodeQL extracts them without
      # a build, so autobuild is at best a no-op and at worst a spurious
      # failure against them.
      - if: github.event_name != 'merge_group' && matrix.language == 'go'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - if: github.event_name != 'merge_group'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
