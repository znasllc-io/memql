name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue (Tier 3, #858): if the "Analyze" checks are required for
  # merge, they must also run on the queue's merge candidate or the queue
  # would stall on a never-reported required check.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

# Cancel a superseded CodeQL run when a new commit is pushed to the
# same PR; main pushes key off the commit SHA so they never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Least-privilege at the workflow level: every step that doesn't
# need to write security-events gets read-only. security-events:
# write is hoisted INTO the analyze job only -- the only place
# SARIF gets uploaded.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      # Merge-queue fast pass (memql#1539): on `merge_group` we do NOT re-run
      # CodeQL. The analyze step uploads SARIF keyed to the ephemeral
      # `gh-readonly-queue/main/pr-*` ref, which the merge queue tears down
      # before the upload lands -- the upload then errors with "ref ... not
      # found" and the required `Analyze (go)` check goes red, wedging the
      # queue. Re-analysis on the merge candidate adds no coverage anyway: the
      # same tree was already analyzed on the PR, and push-to-main + the weekly
      # cron re-scan after merge. So on `merge_group` the job is a no-op that
      # simply reports the required `Analyze (go)` context green; the real
      # CodeQL run stays on pull_request / push:main / schedule.
      - name: merge-queue no-op (CodeQL already ran on the PR)
        if: github.event_name == 'merge_group'
        run: echo "CodeQL is not re-run on merge_group; PR + push:main + weekly schedule provide coverage (memql#1539)."
      - if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name != 'merge_group'
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # Richer suite: security queries + maintainability/quality
          # queries, instead of the default security-only set.
          queries: security-and-quality
      - if: github.event_name != 'merge_group'
        uses: github/codeql-action/autobuild@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
      - if: github.event_name != 'merge_group'
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          category: "/language:${{ matrix.language }}"
