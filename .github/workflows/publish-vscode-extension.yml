name: publish-vscode-extension

# Publishes the MemQL VS Code extension to the VS Code Marketplace and to
# Open VSX (memql#5075). Trigger by pushing a tag like
# `memql-vscode-v0.3.2`, or run manually -- the manual lane is a DRY RUN
# unless you say otherwise.
#
# Bump editors/vscode/package.json "version" before tagging: `vsce` reads the
# version from the manifest, never from the tag, and the check below refuses
# the pair when they disagree.
#
# WHY BOTH REGISTRIES. scripts/vscode/install.sh already advertises
# `--editor-cmd=cursor` and `codium`, and both editors can only install from
# Open VSX. Publishing to the Marketplace alone would leave the editors this
# repository claims to support with no registry path at all.
#
# WHY A MATRIX. The extension bundles memql-lsp per platform, at
# bin/<node-platform>-<node-arch>/, which resolveServerPath reads at run time.
# One archive built here would carry only linux-x64 and every macOS user would
# install an extension whose language server does not exist. The LSP builds
# CGO_ENABLED=0, so one ubuntu runner cross-compiles every target.
on:
  push:
    tags:
      - 'memql-vscode-v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Package every target and stop, without publishing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG_PREFIX: memql-vscode-v

jobs:
  # A CHEAP GATE BEFORE ANYTHING EXPENSIVE OR IRREVERSIBLE. Past the publish
  # step a version cannot be taken back, so the one input that can be wrong in
  # a way nothing else catches is checked first, alone, in seconds.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the tag and the manifest must name the same version
        id: check
        run: |
          set -euo pipefail
          manifest="$(node -p "require('./editors/vscode/package.json').version")"
          echo "version=${manifest}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "INFO: not a tag run; publishing version ${manifest} from the manifest."
            exit 0
          fi
          tagged="${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
          if [ "$tagged" != "$manifest" ]; then
            echo "ERROR: ${GITHUB_REF_NAME} says ${tagged}; editors/vscode/package.json says ${manifest}." >&2
            echo "       vsce publishes the MANIFEST version, so this tag would have published" >&2
            echo "       ${manifest} under a name claiming ${tagged} -- and a published version" >&2
            echo "       cannot be taken back. Bump the manifest, or retag." >&2
            exit 1
          fi
          echo "INFO: ${GITHUB_REF_NAME} and the manifest agree on ${manifest}."

  publish:
    name: publish ${{ matrix.target }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # NOT fail-fast: a target that fails to PUBLISH has still told us
      # something about the others, and a half-published version is a state
      # worth seeing in full rather than one row at a time.
      fail-fast: false
      matrix:
        include:
          # goos/goarch BUILD the bundled binary; target MARKS the archive.
          # `scripts/ci/publish_vscode_workflow_test.go` asserts the three agree
          # on every row, because nothing at package time checks that they do.
          - { target: linux-x64,    goos: linux,  goarch: amd64 }
          - { target: linux-arm64,  goos: linux,  goarch: arm64 }
          - { target: darwin-arm64, goos: darwin, goarch: arm64 }
          - { target: darwin-x64,   goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
          cache: false

      # ONE ARCHIVE, PUBLISHED TWICE. Packaging separately per registry is the
      # obvious shape and is wrong: two archives built from one commit can still
      # differ, and then the registries serve different bytes under one version
      # with nothing to compare.
      - name: package ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash scripts/vscode/package.sh \
            --goos=${{ matrix.goos }} \
            --goarch=${{ matrix.goarch }} \
            --target=${{ matrix.target }} \
            --out="$RUNNER_TEMP/memql-${{ matrix.target }}.vsix"

      # Kept whatever happens next, so a failed publish still leaves the exact
      # bytes that were about to be published.
      - name: keep the archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memql-${{ matrix.target }}.vsix
          path: ${{ runner.temp }}/memql-${{ matrix.target }}.vsix
          if-no-files-found: error

      - name: publish to the VS Code Marketplace
        if: ${{ inputs.dryRun != true }}
        run: npx --yes @vscode/vsce@latest publish --packagePath "$RUNNER_TEMP/memql-${{ matrix.target }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: publish to Open VSX
        if: ${{ inputs.dryRun != true }}
        run: npx --yes ovsx@latest publish "$RUNNER_TEMP/memql-${{ matrix.target }}.vsix"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: say what a dry run did
        if: ${{ inputs.dryRun == true }}
        run: |
          echo "DRY RUN: packaged ${{ matrix.target }} (version ${{ needs.version.outputs.version }}) and published nothing."
          echo "The archive is on this run as an artifact. Re-run with dryRun unchecked to publish."

  publish-web:
    name: publish web
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: package web without native executables
        run: bash scripts/vscode/package.sh --target=web --out="$RUNNER_TEMP/memql-web.vsix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memql-web.vsix
          path: ${{ runner.temp }}/memql-web.vsix
          if-no-files-found: error
      - name: publish to the VS Code Marketplace
        if: ${{ inputs.dryRun != true }}
        run: npx --yes @vscode/vsce@latest publish --packagePath "$RUNNER_TEMP/memql-web.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: publish to Open VSX
        if: ${{ inputs.dryRun != true }}
        run: npx --yes ovsx@latest publish "$RUNNER_TEMP/memql-web.vsix"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
