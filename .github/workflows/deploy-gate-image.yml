name: deploy-gate-image

# deployment-v2 Phase 3 (#701/#712). Builds the gate-client image
# (acrmemql.azurecr.io/deploy-gate) the Argo Rollouts AnalysisTemplate runs, so a
# Dockerfile/entrypoint regression is caught in CI. Build-only here (no registry
# push); the digest-emitting ACR push is wired with the per-repo CI image
# pipeline (release lockfile, #702) once ACR OIDC is set up.

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/deploy-gate-check/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-gate-image.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/deploy-gate-check/**'

permissions:
  contents: read

jobs:
  build-image:
    name: build deploy-gate image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/deploy-gate-check/Dockerfile
          push: false
          tags: acrmemql.azurecr.io/deploy-gate:ci
