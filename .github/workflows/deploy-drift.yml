name: deploy-drift

# deployment-v2 Phase 1 (znasllc-io/memql#699): the committed kustomize overlay
# deploy/k8s/overlays/<env> is the SINGLE image authority -- every image pinned
# by @sha256: digest. This gate renders each overlay and FAILS if any image is
# left on a floating tag (the #684 root cause). It needs no cluster access (the
# live-vs-cluster drift check runs from aks-deploy.sh / a scheduled job / Argo
# CD's OutOfSync status). Runs only when deploy manifests or the script change.

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/k8s/**'
      - 'scripts/deploy/drift-check.sh'
      - '.github/workflows/deploy-drift.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/k8s/**'
      - 'scripts/deploy/drift-check.sh'

permissions:
  contents: read

jobs:
  rendered-digest-gate:
    name: overlays are digest-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.30.0'
      - name: assert every env overlay pins images by digest
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for overlay in deploy/k8s/overlays/*/; do
            env="$(basename "$overlay")"
            echo "::group::drift-check --rendered --env=$env"
            bash scripts/deploy/drift-check.sh --rendered --env="$env"
            echo "::endgroup::"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "ERROR: no overlays found under deploy/k8s/overlays/"; exit 1
          fi
