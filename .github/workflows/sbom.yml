name: sbom

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

# Generates a CycloneDX SBOM for the Go module tree on every release
# (and on go.mod / go.sum changes for main, so the published SBOM tracks
# current state). The SBOM is retained as a workflow artifact (90 days);
# fetch it from the run's Artifacts section or via `gh run download`.
#
# This workflow is intentionally read-only (contents: read, no job-level
# escalation) -- it never needs a write token because it does not push
# release assets. Scorecard Token-Permissions stays clean.

jobs:
  generate:
    name: cyclonedx-gomod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.4'
          cache: true
      - name: install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
      - name: generate SBOM
        run: |
          mkdir -p sbom
          cyclonedx-gomod mod -licenses -json -output sbom/memql.cdx.json
          cyclonedx-gomod mod -licenses -output sbom/memql.cdx.xml
      - name: upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90
