# Cluster-e2e compile/vet lane (memql#4212). The live suite needs a
# provisioned parity cluster and does not run here. The package used to
# rot silently -- it did not even compile until #4201 -- because nothing
# in CI built it. This workflow compiles and vets under the clustere2e
# tag so that class of rot cannot recur. Not a provisioned cluster:
# `go test -c` plus `go vet` only.
#
# Sibling of ci.yml because the git OAuth token lacks `workflow` scope
# to edit the 100KB ci.yml; this file is the smallest compile/vet job.
name: clustere2e-compile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-clustere2e:
    name: build clustere2e
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: go test -tags clustere2e -c (compile only)
        run: go test -tags clustere2e -c -o /tmp/clustere2e.test ./test/clustere2e/
      - name: go vet -tags clustere2e
        run: go vet -tags clustere2e ./test/clustere2e/
