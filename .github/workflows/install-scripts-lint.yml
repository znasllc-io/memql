name: install-scripts-lint

# Lints + smoke-tests the install scripts: the token-driven worker
# installers under scripts/install/, and the root install.sh that
# `curl | sh` fetches. These are pure shell (no Go), so this lane is
# independent of the memql sibling checkout the build/test lanes need.
#
# The root install.sh is IN SCOPE because the rename gave it real logic --
# it migrates the pre-rename service and removes the pre-rename binaries --
# and because it RESTATES four names lib.sh owns (it is fetched alone by
# `curl | sh` and has nothing to source). lib_test.sh reads both files to
# check they agree, and that assertion is inert if this lane does not run
# when install.sh alone changes.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'native/macos/mark.svg'
      - 'install.sh'
      - '.github/workflows/install-scripts-lint.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'native/macos/mark.svg'
      - 'install.sh'
      - '.github/workflows/install-scripts-lint.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + lib_test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bash -n (syntax check)
        run: |
          for f in scripts/install/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
          # install.sh declares /bin/sh, not bash -- check it with the
          # shell it names, or the check passes on bashisms the real
          # interpreter would refuse.
          echo "sh -n install.sh"
          sh -n install.sh

      # shellcheck ships on the GitHub-hosted ubuntu runners. -x follows the
      # `source lib.sh` so the sourced helpers are analysed too; --source-path
      # points it at the install dir so the source= directives resolve.
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then brew install shellcheck; fi
          shellcheck --version
          shellcheck -x --source-path=scripts/install scripts/install/*.sh
          # POSIX sh dialect, matching install.sh's own shebang.
          shellcheck -s sh install.sh

      - name: lib_test.sh (helper smoke tests)
        run: bash scripts/install/lib_test.sh
      - name: release draft-then-publish
        run: |
          shellcheck scripts/release/cut-release.sh scripts/release/cut_release_test.sh
          bash scripts/release/cut_release_test.sh

      - name: Menu archive boundary tests
        run: bash scripts/install/menubar_test.sh

      - name: Canonical terminal mark and installer presentation
        run: |
          python3 scripts/install/render-mark.py --check
          python3 scripts/install/ui_test.py
