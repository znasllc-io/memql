name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue (Tier 3, #858). Once the queue is enabled on main, each
  # batched merge candidate builds on a temporary `gh-readonly-queue/*`
  # ref and this event fires against it -- so the FULL suite runs once on
  # the exact tree that will land, instead of re-running on every PR push.
  # Affected-lane routing only narrows `pull_request`; a merge_group event
  # (like push to main) runs every lane for full pre-merge coverage.
  merge_group:

# Cancel a superseded run when a new commit is pushed to the same PR
# (or the same ref). On main we key off the commit SHA so each push to
# main gets its own non-cancellable run. A merge_group candidate has no
# pull_request.number, so it keys off github.sha (the unique queue merge
# commit) and runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Affected-lane routing (Tier 1, #856) + warm-cache consolidation (Tier 2, #857)
# -----------------------------------------------------------------------------
# `changes` classifies the PR diff into coarse buckets (go / dsl / sdkts /
# voice / ci). The CGO-free Go work that used to live in six separate jobs --
# build, vet, test, harness-eval, dsl-lint, engine-load-check, sdk-gen-check --
# is now ONE `go-checks` job so a single warm GOCACHE serves the whole
# sequence (build populates the compiled-package cache; vet/test/run/lint
# reuse it) instead of six runners each cold-compiling the module.
#
# Routing is preserved at the STEP level: each step keeps the same path gate
# it had as a standalone lane (RUN_GO vs RUN_DSL), so a DSL-only PR still
# skips build/vet/test and a docs-only PR skips the whole job -- no regression
# of the #856 win.
#
# Routing applies to `pull_request` only; `push` to main (and the future
# merge_group) runs everything unconditionally.
#
# BRANCH-PROTECTION SAFETY: the SINGLE required check is the `ci-required`
# aggregator at the bottom; it always runs and passes when every lane is
# skipped-or-successful. The individual jobs must NOT be required checks.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      dsl: ${{ steps.filter.outputs.dsl }}
      sdkts: ${{ steps.filter.outputs.sdkts }}
      voice: ${{ steps.filter.outputs.voice }}
      proto: ${{ steps.filter.outputs.proto }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            # A CI/build-config change re-runs everything -- a workflow or
            # Makefile edit can affect any lane, so never narrow it.
            ci:
              - '.github/workflows/**'
              - 'Makefile'
            # Any Go source or the module graph. Voice + generator + sdk/go
            # are Go too, so they are a subset of this.
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
            # The embedded DSL tree.
            dsl:
              - 'dsl/**'
            # The TypeScript SDK and the generator that emits it.
            sdkts:
              - 'sdk/ts/**'
              - 'scripts/sdk-gen/**'
            # The CGO voice path (informational; the voice lane gates on
            # `go` because the tagged build compiles the whole module).
            voice:
              - 'integrations/voice/**'
            # Proto sources + their generated bindings + the gate script
            # (memql#928 drift gate). A .proto edit WITHOUT its regenerated
            # .pb.go matches here but NOT `go`, so this is what makes the
            # "forgot to regenerate" case run the check.
            proto:
              - '**/*.proto'
              - 'component/grpc/gen/**'
              - 'component/node/gen/**'
              - 'scripts/dev/proto-gen.sh'

  # Consolidated CGO-free Go lane. One job, one warm GOCACHE, every
  # CGO-free Go check run in sequence. The job runs when `go` OR `dsl`
  # changed (or on push / a CI-config change); within it each step keeps
  # its original path gate so DSL-only PRs skip the pure-Go steps.
  #
  #   RUN_GO  -> build / vet / test / harness-eval         (go bucket)
  #   RUN_DSL -> dsl-lint / engine-load / sdk-gen-check     (go OR dsl bucket)
  #
  # Step order matters: `go build ./...` runs first so the compiled-package
  # cache is warm for vet/test/run/lint that follow.
  go-checks:
    name: go-checks
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' || needs.changes.outputs.proto == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUN_GO: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
      RUN_DSL: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
      RUN_PROTO: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.4'
          cache: true

      # --- pure-Go lanes (go bucket) -- build first to warm the cache ---
      - name: go build
        if: ${{ env.RUN_GO == 'true' }}
        run: go build ./...
      - name: go vet
        if: ${{ env.RUN_GO == 'true' }}
        run: go vet ./...
      - name: go test
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -count=1 -timeout=300s ./...
      # Build-tagged test lane (#1338). The untagged `go test ./...` above
      # never compiles //go:build-tagged test files, so tagged suites are
      # CI-invisible without an explicit -tags run. Audit of the tree
      # (grep -rl "^//go:build" --include='*_test.go'):
      #   - agent      -> integrations/agent/worker (scope / safety-descriptor
      #                   / list-workers / generated-output tables). Covered
      #                   HERE; CGO-free, so it rides the warm go-checks cache.
      #   - clustere2e -> test/clustere2e. Covered by its own workflow
      #                   (cluster-e2e.yml), which provisions the parity
      #                   cluster the suite needs -- NOT runnable here.
      #   - voice      -> no tagged *_test.go files; the untagged
      #                   integrations/voice/agent tests run in the step above,
      #                   and the build-voice (CGO) job below already runs
      #                   `go test -tags voice ./integrations/voice/...`.
      # No other build tag (cognition / planner / bff / workbench / identity)
      # carries test files today. If you add a tagged test elsewhere, add its
      # directory to this step (or a new lane if it needs system deps).
      - name: go test -tags agent (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -tags agent -count=1 -timeout=300s ./integrations/agent/worker/
      # Harness eval gate (#589). Fixture-driven regression tripwire over an
      # in-memory graph (NO Postgres, NO LLM) -- catches a harness change
      # that reorders dispatch, mis-fails a plan, or makes the loop chattier.
      - name: harness eval (regression gate)
        if: ${{ env.RUN_GO == 'true' }}
        run: go run ./cmd/harness-eval

      # --- DSL lanes (go OR dsl bucket) ---
      # DSL-lint: runs `memqllint` over the embedded DSL tree, catching the
      # parse/import/reference failures the runtime loader's WARN+ skip paths
      # would surface at boot. See memql#278.
      - name: dsl lint
        if: ${{ env.RUN_DSL == 'true' }}
        run: go run ./cmd/memqllint dsl/
      # Engine-bootstrap smoke gate. dsl-lint runs the parse/diagnostic
      # pipeline, but the engine's concept + relationship validation (and the
      # spec/shape/function/builtin/tool/prompt/provider/policy loaders) run
      # ONLY at engine Init -- which no other lane exercises without Postgres.
      # That gap let #597 (an unregistered `dependsOn` relationship type)
      # merge green and crash every node at boot. See #599.
      - name: engine load check (engine init over full DSL tree)
        if: ${{ env.RUN_DSL == 'true' }}
        run: go test -count=1 -run TestEngineInitLoadsFullDSL ./component/memql/
      # SDK drift check: regenerates the typed Go SDK from the DSL and fails
      # on a diff. The generator is Go and reads dsl/, so it gates with the
      # DSL lanes.
      - name: sdk-gen-check (typed SDK drift)
        if: ${{ env.RUN_DSL == 'true' }}
        run: make sdk-gen-check
      # Proto drift check (memql#928): regenerate the pinned-toolchain proto
      # bindings (component/grpc + node; bus excluded pending a consumer-
      # touching normalization) and diff against the checked-in tree, ignoring
      # the cosmetic protoc version stamp. Catches a .proto edited without its
      # .pb.go regenerated -- the gap that let stale bindings merge green.
      # Needs the protobuf compiler; the script go-installs the pinned plugins.
      - name: install protoc
        if: ${{ env.RUN_PROTO == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: proto-gen-check (proto drift)
        if: ${{ env.RUN_PROTO == 'true' }}
        run: make proto-gen-check

  # Voice node CGO build lane -- kept SEPARATE from go-checks because it needs
  # the libopus/opusfile/soxr C deps + CGO_ENABLED=1 and builds under the
  # `voice` build tag; folding it into the CGO-free lane would force the CGO
  # toolchain (and apt installs) onto every check. The Go voice-agent
  # (integrations/voice/agent, epic #449) joins LiveKit rooms via
  # github.com/livekit/server-sdk-go/v2 + its media-sdk, which pull the CGO
  # dependency (docs/voice/451-livekit-go-room-participation.md, Caveat 1).
  # All such code is behind `//go:build voice`. Gates on `go` (not just voice
  # paths): the tagged build compiles the whole module, so any Go change can
  # break it.
  build-voice:
    name: build voice (cgo)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.4'
          cache: true
      - name: install libopus + soxr dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopus-dev libopusfile-dev libsoxr-dev
      - name: go build -tags voice (CGO)
        env:
          CGO_ENABLED: '1'
        run: go build -tags voice ./...
      - name: go vet -tags voice (CGO)
        env:
          CGO_ENABLED: '1'
        run: go vet -tags voice ./...
      - name: go test -tags voice (CGO)
        env:
          CGO_ENABLED: '1'
        run: go test -tags voice -count=1 -timeout=300s ./integrations/voice/...

  # Node-tag compile lane (#1584). go-checks builds/tests with the DEFAULT
  # build tags, so a file gated behind a node build tag
  # (`//go:build identity|mcp|cognition|agent|planner|workbench`) is NEVER
  # compiled in CI -- a tagged-only compile error passes every PR gate and
  # only fails at image-build time on the GitHub build server. That gap
  # surfaced the 0.9.61 break: #1570 changed Store.CreateAuthCode but missed
  # app/integrations_identity.go (`//go:build identity`); go-checks stayed
  # green and `go build -tags identity` only failed when build-engine-images
  # built the identity image. This matrix compiles every CGO-free node tag so
  # a tagged-only break is a required-check failure pre-merge. The `voice` tag
  # is NOT here -- it needs CGO_ENABLED=1 + the libopus C deps and is already
  # covered by the build-voice lane below. Gates on `go` (like build-voice):
  # a tagged build compiles the whole module, so any Go change can break it.
  build-node-tags:
    name: build node tags
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [identity, mcp, cognition, agent, planner, workbench]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.4'
          cache: true
      - name: go build -tags ${{ matrix.tag }}
        run: go build -tags ${{ matrix.tag }} ./...
      - name: go vet -tags ${{ matrix.tag }}
        run: go vet -tags ${{ matrix.tag }} ./...

  # TypeScript SDK lane. Gates on `sdkts` (sdk/ts/** + the generator) so a
  # pure Go change that doesn't touch the generator skips the Node lane.
  sdk-ts-typecheck:
    name: sdk-ts-typecheck
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.sdkts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '20'
      - name: install sdk/ts deps
        run: make sdk-ts-install
      - name: typecheck sdk/ts
        run: make sdk-ts-typecheck
      - name: test sdk/ts
        run: make sdk-ts-test

  # MCP conformance suite (memql#1715) -- the capstone regression gate for epic
  # #1704. Unlike go-checks (which has no database, so every *_db_test.go skips),
  # this job provisions a TimescaleDB service so the DB-backed contract dimensions
  # actually RUN and gate: per-tool create->read->update->delete lifecycle,
  # inclusion/exclusion filtered queries (#1708), canonical array envelope (#1710),
  # partial-update-preserves-siblings (#1709), @pii scrub on hard-delete (#1711),
  # event-trigger logic binding (#1706), bare-literal AST eval (#1705), plus the
  # DB-free single-schema-source (#1713), system-id (#1712), and entry-point
  # (#1707) dimensions. The suite migrates the blank service DB on first connect
  # (the production NewMemoryNodesDatabase + Start path) and publishes a pass-rate
  # line + a step-summary table per build. Gates on go OR dsl (a DSL change can
  # move a contract); push + merge_group run it unconditionally so the merge
  # candidate that actually lands is gated. Added to ci-required below.
  conformance:
    name: mcp-conformance
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
    runs-on: ubuntu-latest
    services:
      # Same image the dev cluster + cluster-e2e use; bundles TimescaleDB +
      # pgvector so the memory-nodes migrations (hypertable + vector) apply.
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: memql
          POSTGRES_PASSWORD: memql_dev
          POSTGRES_DB: memql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MEMORY_NODES_DATABASE_DSN: postgres://memql:memql_dev@localhost:5432/memql?sslmode=disable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.4'
          cache: true
      # Create the extensions the migrations expect (mirrors docker/init-db.sql,
      # which a service container can't mount). The suite migrates the rest.
      - name: create required Postgres extensions
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=memql_dev pg_isready -h localhost -U memql && break
            echo "waiting for postgres ($i)"; sleep 2
          done
          PGPASSWORD=memql_dev psql -h localhost -U memql -d memql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - name: mcp conformance suite (regression gate, seeded test DB)
        run: go test -count=1 -timeout=300s -v ./test/conformance/...

  # Aggregator -- the SINGLE required status check for branch protection.
  # It always runs (even when every lane is path-skipped) and fails only if
  # a lane it depends on actually failed or was cancelled; a `skipped` lane
  # is treated as a pass. Point the ruleset's required check at `ci-required`
  # ONLY, never at the individual jobs.
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - changes
      - go-checks
      - build-voice
      - build-node-tags
      - sdk-ts-typecheck
      - conformance
    runs-on: ubuntu-latest
    steps:
      - name: verify required lanes succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          status=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "FAIL: a required lane reported '$r'"; status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "ci-required: at least one lane did not pass"
            exit 1
          fi
          echo "OK: all required lanes succeeded or were path-skipped"
