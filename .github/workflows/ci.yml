name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue (Tier 3, #858). Once the queue is enabled on main, each
  # batched merge candidate builds on a temporary `gh-readonly-queue/*`
  # ref and this event fires against it -- so the FULL suite runs once on
  # the exact tree that will land, instead of re-running on every PR push.
  # Affected-lane routing only narrows `pull_request`; a merge_group event
  # (like push to main) runs every lane for full pre-merge coverage.
  merge_group:

# Cancel a superseded run when a new commit is pushed to the same PR
# (or the same ref). On main we key off the commit SHA so each push to
# main gets its own non-cancellable run. A merge_group candidate has no
# pull_request.number, so it keys off github.sha (the unique queue merge
# commit) and runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  # Pull the GHCR-mirrored Postgres fixture the DB-gated lanes run as a
  # service container (memql#2793).
  packages: read

# Affected-lane routing (Tier 1, #856) + warm-cache consolidation (Tier 2, #857)
# -----------------------------------------------------------------------------
# `changes` classifies the PR diff into coarse buckets (go / dsl / sdkts /
# voice / ci). The CGO-free Go work that used to live in six separate jobs --
# build, vet, test, harness-eval, dsl-lint, engine-load-check, sdk-gen-check --
# is now ONE `go-checks` job so a single warm GOCACHE serves the whole
# sequence (build populates the compiled-package cache; vet/test/run/lint
# reuse it) instead of six runners each cold-compiling the module.
#
# Routing is preserved at the STEP level: each step keeps the same path gate
# it had as a standalone lane (RUN_GO vs RUN_DSL), so a DSL-only PR still
# skips build/vet/test and a docs-only PR skips the whole job -- no regression
# of the #856 win.
#
# Routing applies to `pull_request` only; `push` to main (and the future
# merge_group) runs everything unconditionally.
#
# BRANCH-PROTECTION SAFETY: the SINGLE required check is the `ci-required`
# aggregator at the bottom; it always runs and passes when every lane is
# skipped-or-successful. The individual jobs must NOT be required checks.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gates: ${{ steps.filter.outputs.gates }}
      go: ${{ steps.filter.outputs.go }}
      dsl: ${{ steps.filter.outputs.dsl }}
      sdkts: ${{ steps.filter.outputs.sdkts }}
      voice: ${{ steps.filter.outputs.voice }}
      proto: ${{ steps.filter.outputs.proto }}
      vscode: ${{ steps.filter.outputs.vscode }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            # A CI/build-config change re-runs everything -- a workflow or
            # Makefile edit can affect any lane, so never narrow it.
            ci:
              - '.github/workflows/**'
              - 'Makefile'
            # Non-Go files that are INPUTS to a Go-hosted gate (memql#2972).
            #
            # Kept separate from `go` on purpose: "this is Go source" and "this
            # is something a Go gate reads" are different claims, and collapsing
            # them makes the filter unreadable at exactly the point where a
            # future narrowing needs to be obvious.
            #
            # Without this bucket a PR touching only these files matched NO
            # bucket, every lane skipped, and `ci-required` reported success
            # over a diff nothing verified -- while the gate that would have
            # caught it sat in the skipped `go test` step. Measured at the time:
            # 383 of 2936 tracked files matched no filter, and 18 of the last
            # 400 non-merge commits had a whole diff in that set.
            #
            # Each entry below is a file some Go test actually READS:
            #   *.md                          -> the docs gates in the root
            #                                    package (construct names,
            #                                    retired keywords, deleted Go
            #                                    extension points, product
            #                                    neutrality, lifecycle docs).
            #                                    Repo-wide, NOT docs/** -- they
            #                                    sweep `git ls-files`, and
            #                                    CLAUDE.md is the file two of
            #                                    them name as the sharp edge.
            #   *.memql outside dsl/          -> docs_construct_names_test.go
            #                                    and the referencepack tests.
            #                                    `dsl/**` already has a bucket.
            #   the two manifest copies       -> TestEmbeddedManifestInSync and
            #                                    cmd/envscan's registry.
            #   architecture/embedded/**      -> TestArchitectureModelIsNotStale.
            #   scripts/**                    -> the capability-script contract
            #                                    test, help.sh, seed-secrets.sh
            #                                    and release.sh guards.
            gates:
              - '**/*.md'
              - '**/*.memql'
              - 'scripts/secrets/manifest.yaml'
              - 'component/genesis/manifest.yaml'
              - 'component/architecture/embedded/**'
              - 'scripts/**'
            # Any Go source or the module graph. Voice + generator + sdk/go
            # are Go too, so they are a subset of this.
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
            # The embedded DSL tree.
            dsl:
              - 'dsl/**'
            # The TypeScript SDK and the generator that emits it.
            sdkts:
              - 'sdk/ts/**'
              - 'scripts/sdk-gen/**'
            # The CGO voice path (informational; the voice lane gates on
            # `go` because the tagged build compiles the whole module).
            voice:
              - 'integrations/voice/**'
            # Proto sources + their generated bindings + the gate script
            # (memql#928 drift gate). A .proto edit WITHOUT its regenerated
            # .pb.go matches here but NOT `go`, so this is what makes the
            # "forgot to regenerate" case run the check.
            proto:
              - '**/*.proto'
              - 'component/grpc/gen/**'
              - 'component/node/gen/**'
              - 'scripts/dev/proto-gen.sh'
            # The VS Code extension + the offline LSP binary it bundles + the
            # packaging script.
            vscode:
              - 'editors/vscode/**'
              - 'cmd/memql-lsp/**'
              - 'scripts/vscode/**'

  # Consolidated CGO-free Go lane. One job, one warm GOCACHE, every
  # CGO-free Go check run in sequence. The job runs when `go` OR `dsl`
  # changed (or on push / a CI-config change); within it each step keeps
  # its original path gate so DSL-only PRs skip the pure-Go steps.
  #
  #   RUN_GO  -> build / vet / test / harness-eval         (go bucket)
  #   RUN_DSL -> dsl-lint / engine-load / sdk-gen-check     (go OR dsl bucket)
  #
  # Step order matters: `go build ./...` runs first so the compiled-package
  # cache is warm for vet/test/run/lint that follow.
  go-checks:
    name: go-checks
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.gates == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUN_GO: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
      RUN_DSL: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
      RUN_PROTO: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' }}
      # Only when the FULL suite is not already running. `go test ./...` under
      # RUN_GO covers every gate package, so firing both would just run them
      # twice (memql#2972).
      RUN_GATES: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ci != 'true' && needs.changes.outputs.go != 'true' && needs.changes.outputs.gates == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true

      # --- gate inputs (gates bucket) -- a non-Go change a Go test reads ---
      #
      # Runs the packages that host repo-sweeping gates, and ONLY when the
      # full suite is not already running. A PR touching only `.md`, a
      # manifest, the architecture model or a shell script used to match no
      # bucket at all: every lane skipped and `ci-required` went green over a
      # diff nothing verified, while the test that would have caught it sat in
      # the skipped step below (memql#2972).
      #
      # A docs-only PR deliberately does NOT pay the whole suite here -- that
      # is the #856 routing win and the stated intent in this file's header.
      # It pays the gates that actually read what it changed.
      #
      # Be exact about what that saves, because it is less than it reads:
      # the saving is in TEST time (~35s here against the full suite), not in
      # COMPILE time. The root package imports app, which pulls in most of the
      # module, so a docs-only PR now pays a near-full build it previously
      # skipped entirely -- measured at ~6min wall on a cold cache against
      # ~35s of actual test execution (memql#3060 review). That is the price
      # of the bucket, and it is worth paying against a green tick over an
      # unverified diff; it is not free.
      #
      # No `-run` / `-skip`: a selector matching nothing exits 0 having tested
      # nothing, which is the defect class this bucket is part of (#2923,
      # #3003). scripts/dev/gate_inputs_lane_scope_test.go pins that, pins the
      # package list against the bucket's globs, and pins the bucket against
      # the paths those packages read.
      #
      # ./dsl and ./examples are here because the `**/*.memql` glob would
      # otherwise promise coverage this step does not deliver -- the bucket
      # comment cites the referencepack tests, and they live in
      # examples/referencepack, not in any package above. dsl/ also hosts
      # TestPublicExamplesAreAnnotated, which reads a docs/public `.md`.
      # Together they cost ~2s (memql#3060 review).
      #
      # STATED BOUNDARY: component/memql also reads bucket files -- its
      # reference-pack load test and sense's walk of the dsl/ tree -- and is
      # deliberately NOT here. That package costs ~90s, which is most of a
      # docs-only PR's budget, and its gates are covered whenever RUN_GO or
      # RUN_DSL fires. Adding it belongs with a decision about what a
      # docs-only PR should pay, not with closing this bucket.
      - name: go test (gate inputs)
        if: ${{ env.RUN_GATES == 'true' }}
        run: go test -count=1 -timeout=300s ./ ./cmd/envscan/... ./component/architecture/... ./component/genesis/... ./scripts/... ./dsl/... ./examples/...

      # --- pure-Go lanes (go bucket) -- build first to warm the cache ---
      - name: go build
        if: ${{ env.RUN_GO == 'true' }}
        run: go build ./...
      - name: go vet
        if: ${{ env.RUN_GO == 'true' }}
        run: go vet ./...
      - name: go test
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -count=1 -timeout=300s ./...
      # Build-tagged test lanes (#1338, #2903). The untagged `go test ./...`
      # above never RUNS a //go:build-tagged test file, so a tagged suite is
      # CI-invisible without an explicit -tags run.
      #
      # This used to carry a hand-maintained audit of which tags have test
      # files and which lane covers each. It drifted on FOUR tags at once (mcp
      # omitted entirely with three files; identity, telnyx_live and voice all
      # covered by a closing "no other build tag carries test files today" that
      # was false of each), which is how three mcp-tagged suites went their
      # whole life without executing -- including the file the #2888
      # vulnerability lives in.
      #
      # The audit is now EXECUTABLE: cmd/citags/scan reads the tags actually
      # present on *_test.go files and the `go test -tags ...` invocations
      # actually present in this directory, and fails the untagged lane when
      # they disagree. Add a tagged suite without a lane and CI goes red with
      # the file list. Do not reintroduce a prose audit here; a second
      # hand-maintained copy is the defect that gate exists to prevent.
      #
      # These lanes are CGO-free, so they ride the warm go-checks cache.
      - name: go test -tags agent (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -tags agent -count=1 -timeout=300s ./integrations/agent/worker/
      # RUN_GO or RUN_DSL: component/mcp/real_engine_surface_test.go pins DSL
      # contracts (e.g. @mcp on readyHarnessStep), so a DSL-only change can red
      # this lane. Mirrors the engine-load-check step's gating.
      - name: go test -tags mcp (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' || env.RUN_DSL == 'true' }}
        run: go test -tags mcp -count=1 -timeout=300s ./app/ ./component/mcp/
      - name: go test -tags identity (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -tags identity -count=1 -timeout=300s ./app/
      # Harness eval gate (#589). Fixture-driven regression tripwire over an
      # in-memory graph (NO Postgres, NO LLM) -- catches a harness change
      # that reorders dispatch, mis-fails a plan, or makes the loop chattier.
      - name: harness eval (regression gate)
        if: ${{ env.RUN_GO == 'true' }}
        run: go run ./cmd/harness-eval
      # Env-var registry drift gate (7.2 / memql#2105). Fails on drift in
      # either direction: a var read in code but not registered in
      # scripts/secrets/manifest.yaml, or a registry entry that appears
      # nowhere in the repo. The TestNoEnvRegistryDrift Go test in the
      # `go test` step above is the same check; this step is the explicit,
      # named signal.
      - name: env-registry-check (registry drift gate)
        if: ${{ env.RUN_GO == 'true' }}
        run: make env-registry-check

      # --- DSL lanes (go OR dsl bucket) ---
      # DSL-lint: runs `memqllint` over the embedded DSL tree, catching the
      # parse/import/reference failures the runtime loader's WARN+ skip paths
      # would surface at boot. See memql#278.
      - name: dsl lint
        if: ${{ env.RUN_DSL == 'true' }}
        run: go run ./cmd/memqllint dsl/
      # Engine-bootstrap smoke gate. dsl-lint runs the parse/diagnostic
      # pipeline, but the engine's concept + relationship validation (and the
      # spec/shape/function/builtin/tool/prompt/provider/policy loaders) run
      # ONLY at engine Init -- which no other lane exercises without Postgres.
      # That gap let #597 (an unregistered `dependsOn` relationship type)
      # merge green and crash every node at boot. See #599.
      - name: engine load check (engine init over full DSL tree)
        if: ${{ env.RUN_DSL == 'true' }}
        run: go test -count=1 -run TestEngineInitLoadsFullDSL ./component/memql/
      # SDK drift check: regenerates the typed Go SDK from the DSL and fails
      # on a diff. The generator is Go and reads dsl/, so it gates with the
      # DSL lanes.
      - name: sdk-gen-check (typed SDK drift)
        if: ${{ env.RUN_DSL == 'true' }}
        run: make sdk-gen-check
      # Proto drift check (memql#928): regenerate the pinned-toolchain proto
      # bindings (component/grpc + node; bus excluded pending a consumer-
      # touching normalization) and diff against the checked-in tree, ignoring
      # the cosmetic protoc version stamp. Catches a .proto edited without its
      # .pb.go regenerated -- the gap that let stale bindings merge green.
      # FALLBACK only. proto-gen.sh provisions its own pinned protoc into
      # bin/tools/; this apt copy exists so a GitHub-releases outage degrades
      # to a working lane instead of a red build (the drift diff ignores the
      # version stamp, so a differing protoc still gives a correct verdict).
      - name: install protoc (fallback for the pinned download)
        if: ${{ env.RUN_PROTO == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: proto-gen-check (proto drift)
        if: ${{ env.RUN_PROTO == 'true' }}
        run: make proto-gen-check

  # Voice node CGO build lane -- kept SEPARATE from go-checks because it needs
  # the libopus/opusfile/soxr C deps + CGO_ENABLED=1 and builds under the
  # `voice` build tag; folding it into the CGO-free lane would force the CGO
  # toolchain (and apt installs) onto every check. The Go voice-agent
  # (integrations/voice/agent, epic #449) joins LiveKit rooms via
  # github.com/livekit/server-sdk-go/v2 + its media-sdk, which pull the CGO
  # dependency (docs/voice/451-livekit-go-room-participation.md, Caveat 1).
  # All such code is behind `//go:build voice`. Gates on `go` (not just voice
  # paths): the tagged build compiles the whole module, so any Go change can
  # break it.
  build-voice:
    name: build voice (cgo)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: install libopus + soxr dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopus-dev libopusfile-dev libsoxr-dev
      - name: go build -tags voice (CGO)
        env:
          CGO_ENABLED: '1'
        run: go build -tags voice ./...
      - name: go vet -tags voice (CGO)
        env:
          CGO_ENABLED: '1'
        run: go vet -tags voice ./...
      - name: go test -tags voice (CGO)
        env:
          CGO_ENABLED: '1'
        run: go test -tags voice -count=1 -timeout=300s ./integrations/voice/...

  # Node-tag compile lane (#1584). go-checks builds/tests with the DEFAULT
  # build tags, so a file gated behind a node build tag
  # (`//go:build identity|mcp|cognition|agent|planner|workbench`) is NEVER
  # compiled in CI -- a tagged-only compile error passes every PR gate and
  # only fails at image-build time on the GitHub build server. That gap
  # surfaced the 0.9.61 break: #1570 changed Store.CreateAuthCode but missed
  # app/integrations_identity.go (`//go:build identity`); go-checks stayed
  # green and `go build -tags identity` only failed when build-engine-images
  # built the identity image. This matrix compiles every CGO-free node tag so
  # a tagged-only break is a required-check failure pre-merge. The `voice` tag
  # is NOT here -- it needs CGO_ENABLED=1 + the libopus C deps and is already
  # covered by the build-voice lane below. Gates on `go` (like build-voice):
  # a tagged build compiles the whole module, so any Go change can break it.
  build-node-tags:
    name: build node tags
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [identity, mcp, cognition, agent, planner, workbench]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: go build -tags ${{ matrix.tag }}
        run: go build -tags ${{ matrix.tag }} ./...
      - name: go vet -tags ${{ matrix.tag }}
        run: go vet -tags ${{ matrix.tag }} ./...

  # TypeScript SDK lane. Gates on `sdkts` (sdk/ts/** + the generator) so a
  # pure Go change that doesn't touch the generator skips the Node lane.
  sdk-ts-typecheck:
    name: sdk-ts-typecheck
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.sdkts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      - name: install sdk/ts deps
        run: make sdk-ts-install
      - name: typecheck sdk/ts
        run: make sdk-ts-typecheck
      - name: test sdk/ts
        run: make sdk-ts-test

  # MCP conformance suite (memql#1715) -- the capstone regression gate for epic
  # #1704. Unlike go-checks (which has no database, so every *_db_test.go skips),
  # this job provisions a TimescaleDB service so the DB-backed contract dimensions
  # actually RUN and gate: per-tool create->read->update->delete lifecycle,
  # inclusion/exclusion filtered queries (#1708), canonical array envelope (#1710),
  # partial-update-preserves-siblings (#1709), @pii scrub on hard-delete (#1711),
  # event-trigger logic binding (#1706), bare-literal AST eval (#1705), plus the
  # DB-free single-schema-source (#1713), system-id (#1712), and entry-point
  # (#1707) dimensions. The suite migrates the blank service DB on first connect
  # (the production NewMemoryNodesDatabase + Start path) and publishes a pass-rate
  # line + a step-summary table per build. Gates on go OR dsl (a DSL change can
  # move a contract); push + merge_group run it unconditionally so the merge
  # candidate that actually lands is gated. Added to ci-required below.
  conformance:
    name: mcp-conformance
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
    runs-on: ubuntu-latest
    services:
      # Same image the dev cluster uses; bundles TimescaleDB +
      # pgvector so the memory-nodes migrations (hypertable + vector) apply.
      #
      # Pulled from our GHCR MIRROR, pinned by digest (memql#2793). Docker Hub
      # pulls here are unauthenticated and happen at job setup, before any step
      # runs -- a Hub blip took this lane down before a test executed, and
      # because it feeds ci-required the merge queue EVICTED the candidate
      # (twice in ~9h: #2777, #2826). Refresh with the mirror-fixture-images
      # workflow, then update this digest in a PR; a floating tag here would
      # reintroduce the silent-drift half of #2793.
      postgres:
        image: ghcr.io/znasllc-io/ci-timescaledb@sha256:d8336a5c9cc49bdbf1e935234e8c87ab64b6d6d195fd2ecedff7b00185557631
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: memql
          POSTGRES_PASSWORD: memql_dev
          POSTGRES_DB: memql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MEMQL_DATABASE_DSN: postgres://memql:memql_dev@localhost:5432/memql?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      # Create the extensions the migrations expect (mirrors docker/init-db.sql,
      # which a service container can't mount). The suite migrates the rest.
      - name: create required Postgres extensions
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=memql_dev pg_isready -h localhost -U memql && break
            echo "waiting for postgres ($i)"; sleep 2
          done
          PGPASSWORD=memql_dev psql -h localhost -U memql -d memql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - name: mcp conformance suite (regression gate, seeded test DB)
        run: go test -count=1 -timeout=300s -v ./test/conformance/...

  # DB-seeded suite for the `*_db_test.go` packages (memql#2342). These
  # tests are NeedsDB: they self-skip when no Postgres is reachable, so they
  # NEVER ran in CI before -- only `test/conformance` was seeded -- and
  # silently rotted (referencing constructs that later migrations renamed).
  # This lane mirrors the conformance job's seeded-DB setup and runs the
  # remaining DB-gated suites so that whole class of test can't rot unseen
  # again.
  #
  # The selector below is no longer kept in sync BY HAND -- scripts/cidb does it
  # executably (memql#2886). The old rule written here, "keep this list in sync
  # with the packages that carry `*_db_test.go` files", was already wrong when
  # it was written: examples/referencepack carries none, and four of the seven
  # db-gated packages in the tree carry none either. The real rule, and the one
  # the gate asserts, is that every package with a TestMain calling
  # dbtest.EnsureSchema must appear below.
  #
  # These per-package binaries run as PARALLEL processes against this ONE shared
  # DB, so each such package must migrate the schema through that TestMain (a
  # cross-process advisory lock serializes it); otherwise the suites race on a
  # half-created schema and fail with `relation "MemoryNodes" does not exist`
  # (memql#2551). A new db-gated package needs both an entry below AND that
  # TestMain -- and adding the TestMain without the entry now fails the gate.
  db-tests:
    name: db-tests
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
    runs-on: ubuntu-latest
    services:
      # Same image the dev cluster + conformance use; bundles
      # TimescaleDB + pgvector so the memory-nodes migrations (hypertable +
      # vector) apply. GHCR mirror, pinned by digest -- see the note on the
      # mcp-conformance service above (memql#2793).
      postgres:
        image: ghcr.io/znasllc-io/ci-timescaledb@sha256:d8336a5c9cc49bdbf1e935234e8c87ab64b6d6d195fd2ecedff7b00185557631
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: memql
          POSTGRES_PASSWORD: memql_dev
          POSTGRES_DB: memql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MEMQL_DATABASE_DSN: postgres://memql:memql_dev@localhost:5432/memql?sslmode=disable
      # Without this the whole point of the lane is optional (memql#2886). Every
      # db-gated test self-skips when it cannot reach Postgres, so a service
      # container that is slow to become healthy, unhealthy, or pulled from an
      # unreachable registry (memql#2793) degrades the entire DB-gated suite to
      # GREEN SKIPS rather than a red build -- and the PRs that rest their only
      # end-to-end evidence on this lane merge on a signal that never fired.
      #
      # MEMQL_REQUIRE_DB=1 converts every such skip into a failure
      # (component/database/dbtest.Unreachable). It is set HERE rather than
      # globally on purpose: a local `go test ./...` leaves it unset and keeps
      # the skip behaviour, which is the intended split.
      #
      # Do not remove it. scripts/cidb asserts this key is present and truthy,
      # and that this lane's package selector still matches at least one
      # db-gated test -- the "executed zero of them" failure one level up.
      MEMQL_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      # Create the extensions the migrations expect (mirrors docker/init-db.sql,
      # which a service container can't mount). The suite migrates the rest.
      - name: create required Postgres extensions
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=memql_dev pg_isready -h localhost -U memql && break
            echo "waiting for postgres ($i)"; sleep 2
          done
          PGPASSWORD=memql_dev psql -h localhost -U memql -d memql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - name: db-gated suites (seeded test DB)
        run: go test -count=1 -timeout=300s ./component/memql/... ./component/automations/steps/... ./examples/referencepack/...

  # VS Code extension lane: run every cmd/memql-lsp drift guard over the
  # checked-in editors/vscode assets, then build the offline LSP binary
  # (darwin-arm64, the standardized dev target), compile the TypeScript client,
  # and package the VSIX. go-checks also runs these tests via `go test ./...`,
  # but it gates on the `go` bucket, so an editors/vscode-only PR skips it and
  # this lane is the only coverage those guards get. Gates on the vscode bucket
  # (editors/vscode, cmd/memql-lsp, scripts/vscode); push + merge_group run it.
  vscode-extension:
    name: vscode-extension
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.vscode == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      # Every drift guard over a checked-in editors/vscode asset lives under
      # cmd/memql-lsp (grammar, language configuration, extension manifest).
      # Run the whole tree, not just the grammar package: an editors/vscode-only
      # PR -- the shape every dependabot bump takes -- path-skips `go-checks`,
      # so this lane is the ONLY place those guards get to fire (memql#2792).
      # scripts/dev/vscode_lane_scope_test.go fails if this narrows again.
      - name: editors/vscode drift checks (grammar, language config, manifest)
        run: go test -count=1 ./cmd/memql-lsp/...
      - name: package extension (build binary + compile + vsce package)
        run: bash scripts/vscode/package.sh --out="$RUNNER_TEMP/memql.vsix"

  # Aggregator -- the SINGLE required status check for branch protection.
  # It always runs (even when every lane is path-skipped) and fails only if
  # a lane it depends on actually failed or was cancelled; a `skipped` lane
  # is treated as a pass. Point the ruleset's required check at `ci-required`
  # ONLY, never at the individual jobs.
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - changes
      - go-checks
      - build-voice
      - build-node-tags
      - sdk-ts-typecheck
      - conformance
      - db-tests
      - vscode-extension
    runs-on: ubuntu-latest
    steps:
      - name: verify required lanes succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          # An empty result set is a fail-open, not a pass: it means the
          # aggregator waited on nothing, so EVERY lane is advisory at once
          # (memql#3019). The static guard for this lives in go-checks -- which
          # is itself one of the aggregated lanes, so emptying `needs` also
          # stops that guard gating. This is the independent backstop.
          if [ -z "$(echo "$RESULTS" | tr -d '[:space:]')" ]; then
            echo "ci-required: no lane results at all -- refusing to report success"
            exit 1
          fi
          status=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "FAIL: a required lane reported '$r'"; status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "ci-required: at least one lane did not pass"
            exit 1
          fi
          echo "OK: all required lanes succeeded or were path-skipped"
