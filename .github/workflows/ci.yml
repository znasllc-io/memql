name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue (Tier 3, #858). Once the queue is enabled on main, each
  # batched merge candidate builds on a temporary `gh-readonly-queue/*`
  # ref and this event fires against it -- so the FULL suite runs once on
  # the exact tree that will land, instead of re-running on every PR push.
  # Affected-lane routing only narrows `pull_request`; a merge_group event
  # (like push to main) runs every lane for full pre-merge coverage.
  merge_group:

# Cancel a superseded run when a new commit is pushed to the same PR
# (or the same ref). On main we key off the commit SHA so each push to
# main gets its own non-cancellable run. A merge_group candidate has no
# pull_request.number, so it keys off github.sha (the unique queue merge
# commit) and runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  # Pull the GHCR-mirrored Postgres fixture the DB-gated lanes run as a
  # service container (memql#2793).
  packages: read

# Affected-lane routing (Tier 1, #856) + warm-cache consolidation (Tier 2, #857)
# -----------------------------------------------------------------------------
# `changes` classifies the PR diff into coarse buckets (go / dsl / sdkts /
# ci). The CGO-free Go work that used to live in six separate jobs --
# build, vet, test, dsl-lint, engine-load-check, sdk-gen-check --
# is now ONE `go-checks` job so a single warm GOCACHE serves the whole
# sequence (build populates the compiled-package cache; vet/test/run/lint
# reuse it) instead of six runners each cold-compiling the module.
#
# Routing is preserved at the STEP level: each step keeps the same path gate
# it had as a standalone lane (RUN_GO vs RUN_DSL), so a DSL-only PR still
# skips build/vet/test and a docs-only PR skips the whole job -- no regression
# of the #856 win.
#
# Routing applies to `pull_request` only; `push` to main (and the future
# merge_group) runs everything unconditionally.
#
# BRANCH-PROTECTION SAFETY: the SINGLE required check is the `ci-required`
# aggregator at the bottom; it always runs and passes when every lane is
# skipped-or-successful. The individual jobs must NOT be required checks.
jobs:
  changes:
    name: changes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gates: ${{ steps.filter.outputs.gates }}
      go: ${{ steps.filter.outputs.go }}
      dsl: ${{ steps.filter.outputs.dsl }}
      sdkts: ${{ steps.filter.outputs.sdkts }}
      viewkit: ${{ steps.filter.outputs.viewkit }}
      proto: ${{ steps.filter.outputs.proto }}
      vscode: ${{ steps.filter.outputs.vscode }}
      portal: ${{ steps.filter.outputs.portal }}
      osclient: ${{ steps.filter.outputs.osclient }}
      proving: ${{ steps.filter.outputs.proving }}
      ci: ${{ steps.filter.outputs.ci }}
      # Target-module buckets (memql#3163 / design D3). Declared so the split
      # in memql#3165 is a no-op for CI, per decision F. NOT yet consumed by any
      # lane's `if:` -- see the block above the definitions for why.
      base: ${{ steps.filter.outputs.base }}
      engine: ${{ steps.filter.outputs.engine }}
      platform: ${{ steps.filter.outputs.platform }}
      integrations: ${{ steps.filter.outputs.integrations }}
      server-grpc: ${{ steps.filter.outputs['server-grpc'] }}
      server-http: ${{ steps.filter.outputs['server-http'] }}
      server-mcp: ${{ steps.filter.outputs['server-mcp'] }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # A CI/build-config change re-runs everything -- a workflow or
            # Makefile edit can affect any lane, so never narrow it.
            ci:
              - '.github/workflows/**'
              - 'Makefile'
            # Non-Go files that are INPUTS to a Go-hosted gate (memql#2972).
            #
            # Kept separate from `go` on purpose: "this is Go source" and "this
            # is something a Go gate reads" are different claims, and collapsing
            # them makes the filter unreadable at exactly the point where a
            # future narrowing needs to be obvious.
            #
            # Without this bucket a PR touching only these files matched NO
            # bucket, every lane skipped, and `ci-required` reported success
            # over a diff nothing verified -- while the gate that would have
            # caught it sat in the skipped `go test` step. Measured at the time:
            # 383 of 2936 tracked files matched no filter, and 18 of the last
            # 400 non-merge commits had a whole diff in that set.
            #
            # Each entry below is a file some Go test actually READS:
            #   *.md                          -> the docs gates in the root
            #                                    package (construct names,
            #                                    retired keywords, deleted Go
            #                                    extension points, product
            #                                    neutrality, lifecycle docs).
            #                                    Repo-wide, NOT docs/** -- they
            #                                    sweep `git ls-files`, and
            #                                    CLAUDE.md is the file two of
            #                                    them name as the sharp edge.
            #   *.memql outside dsl/          -> docs_construct_names_test.go
            #                                    and the referencepack tests.
            #                                    `dsl/**` already has a bucket.
            #   the two manifest copies       -> TestEmbeddedManifestInSync and
            #                                    cmd/envscan's registry.
            #   architecture/embedded/**      -> TestArchitectureModelIsNotStale.
            #   scripts/**                    -> the capability-script contract
            #                                    test, help.sh, seed-secrets.sh
            #                                    and release.sh guards.
            #
            # THE EMBEDDED-ASSET BLOCK (the second group below) closes a
            # DELAYED-BLAME fail-open that cb264c02 armed (memql#3165 review).
            #
            # embed_inventory_test.go pins the per-package `//go:embed` file
            # COUNT for 11 packages / 270 files, and it lives in the root
            # package -- which runs ONLY under RUN_GO (go-tests) or RUN_GATES
            # (the gate-inputs step below). Measured with picomatch against the
            # real pinned inventory, 68 of those 270 files reached NEITHER:
            #
            #   28  component/database/memory-nodes/migrations/*.sql   NO BUCKET
            #   27  dsl/**/*.tmpl + dsl/deployment/namespace.pin       dsl only
            #    9  component/identity/web/static/**                   NO BUCKET
            #    1  component/mcp/icon.svg                             NO BUCKET
            #    1  integrations/integrations.json                     NO BUCKET
            #    1  examples/referencepack/dsl/namespace.pin           NO BUCKET
            #    1  VERSION                                            NO BUCKET
            #
            # A PR adding only `component/database/.../0099_x.sql` therefore
            # matched no consumed bucket, every lane skipped, `ci-required`
            # went green -- and then the guard fired on the next `push` to
            # main, where there is no merge_queue rule to catch it first:
            #
            #   --- FAIL: TestEmbeddedFileCountsAreStable
            #       component/database embeds 30 files; 28 expected (2 added)
            #
            # (2, not 1: a real migration is an up/down pair.)
            #
            # THE NEXT UNRELATED AUTHOR OWNS THAT FAILURE. Before cb264c02 a
            # migration-only PR was unverified but harmless; after it, the same
            # PR breaks main for someone else. A guard is not allowed to ship a
            # new way for main to go red on a diff its own PR was told was
            # green, so every path the inventory pins is routed here.
            #
            # Derived from the `//go:embed` directives, not from today's file
            # list, and stated as TREES rather than extensions so a new file of
            # a new type inside an embedded tree cannot slip back out:
            #
            #   VERSION                       -> embed.go
            #   database/.../migrations/**    -> component/database/timescaledb.go
            #   component/identity/web/**     -> its embed.go `static/* legal/*.md`
            #   component/mcp/*.svg           -> component/mcp/icon.go
            #   dsl/**                        -> dsl/embed.go's 32 `all:<domain>`
            #                                    patterns. `**/*.memql` already
            #                                    routed 190 of those 217 files
            #                                    here; this completes the tree
            #                                    rather than starting a new
            #                                    route.
            #   examples/*/dsl/**             -> the deploypack + referencepack +
            #                                    reviewspack `all:dsl` embeds.
            #   integrations/*.json           -> integrations/embed.go
            #
            # The remaining pinned packages (component/architecture/embedded,
            # component/envregistry, docs) are already covered by entries above.
            #
            # Over-matching here is close to free: RUN_GATES fires only when
            # `ci` and `go` are BOTH false, so every Go file these trees also
            # contain is inert. Under-matching is the defect.
            gates:
              - '**/*.md'
              - '**/*.memql'
              # .claude/settings.json is TRACKED on purpose (the .gitignore
              # negation, memql#3344) and scripts/dev/repo_hygiene_test.go
              # asserts it stays non-ignored via sharedClaudeState. That test
              # runs in THIS lane, but `scripts/**` below does not match the
              # file itself -- so editing it ran zero lanes until memql#3440
              # made it tracked and the coverage guard noticed.
              - '.claude/settings.json'
              # .memql/runs.json is tracked for the same reason and needs the
              # same routing. It is the run configuration a repository SHIPS
              # (component/edge... see editors/vscode/src/run/runConfig.ts), so
              # it is repo content -- and TestEngineIsProductNeutral sweeps
              # `git ls-files` skipping only .git, bin and node_modules, which
              # means it reads this file's PATH AND BODY. Its `args` are
              # free-form operator text in a public repository, so the sweep is
              # exactly the gate that should run when it changes. The coverage
              # guard could not see that on its own and said so: a test that
              # sweeps `git ls-files` reads files without naming them, so the
              # absence of a mention was evidence, not proof.
              - '.memql/runs.json'
              # The three paths that were allow-listed as "no gate reads it"
              # until memql#3451 made that claim checkable and it turned out to
              # be false of each. All three are read by a Go test in
              # scripts/ci or scripts/dev, which `scripts/**` above puts in
              # THIS lane -- but `scripts/**` does not match the files
              # themselves, so a PR editing only one of them ran zero lanes and
              # handed the failure to whoever pushed next.
              #
              #   .gitignore  -> scripts/dev/repo_hygiene_test.go. Dropping the
              #                  `!sdk/ts/package-lock.json` negation, or
              #                  un-ignoring .claude/settings.local.json, reds
              #                  that test.
              #   Dockerfile  -> scripts/ci/dockerfile_module_manifests_test.go
              #                  (a nested module's COPY line) and
              #                  portal_image_wiring_test.go (the portal stage
              #                  selector). No PR lane BUILDS these images --
              #                  that part of the old reason was true -- but
              #                  the guards over them are Go tests, and those
              #                  have to run.
              #   cmd/deploy-gate-check/Dockerfile -> the same manifest guard,
              #                  which asserts on both Dockerfiles by name.
              #   docker/memql.Dockerfile -> release_stamp_test.go in the root
              #                  package (memql#3998), which asserts BOTH image
              #                  builds link the release into the binary and
              #                  that neither re-adds the VERSION-file stamp.
              #                  Same shape as the two above: no PR lane builds
              #                  this image, but the guard over it is a Go test
              #                  and has to run. It moved here out of the
              #                  `docker/**` allow-list, whose "no gate reads
              #                  them" reason stopped being true the moment
              #                  that test named the file -- which is exactly
              #                  the memql#3451 check firing as designed.
              - '.gitignore'
              - 'Dockerfile'
              - 'cmd/deploy-gate-check/Dockerfile'
              - 'docker/memql.Dockerfile'
              #   deploy/db-image/** -> scripts/ci/db_image_wiring_test.go
              #                  (epic memql#3842 / #3844). The database operand
              #                  image's Dockerfile and its smoke test, both READ
              #                  by that guard: it asserts the TimescaleDB version
              #                  pair agrees across its four copies, that the
              #                  Dockerfile still makes its build-time `test -f`
              #                  assertions, and that the workflow smoke-tests
              #                  before it pushes.
              #
              #                  Same shape as the two Dockerfiles above -- no PR
              #                  lane BUILDS this image, but the Go guards over it
              #                  have to run, and `deploy/**` matches no bucket at
              #                  all today. Without this entry a PR editing only
              #                  the operand Dockerfile ran zero lanes and handed
              #                  the version-drift failure to whoever pushed next.
              - 'deploy/db-image/**'
              #   deploy/fleet/** -> deploy/fleet/bundle_test.go (epic memql#3852
              #                  / #3853). The MemQL Cloud control plane's DSL
              #                  bundle and the data-only image that delivers it.
              #                  The .memql files already route via '**/*.memql'
              #                  above; the DOCKERFILE matched nothing, and it is
              #                  the file whose failure is invisible -- its single
              #                  COPY line is the image's entire content, so a
              #                  stale source path builds and pushes an image that
              #                  copies nothing into MEMQL_DSL_PATH, and every node
              #                  boots a mesh with no control plane in it.
              #                  TestBundleImageCopiesTheBundle reads it.
              - 'deploy/fleet/**'
              - 'scripts/secrets/manifest.yaml'
              - 'component/envregistry/manifest.yaml'
              - 'component/architecture/embedded/**'
              - 'scripts/**'
              # every path embed_inventory_test.go pins -- see above
              - 'VERSION'
              - 'component/database/memory-nodes/migrations/**'
              - 'component/identity/web/**'
              # brand/ is an INPUT to component/identity/web's embed: the
              # generated static/app.css is Tailwind over brand/tokens.css +
              # theme.css, and brand/fonts/ + favicon.svg are copied next to it
              # (memql#4266). So a brand-only PR changes what the identity
              # binary ships, and brand_shared_source_test.go in the root
              # package is the guard over it -- which is the same delayed-blame
              # fail-open this block exists to close.
              - 'brand/**'
              - 'component/mcp/*.svg'
              - 'dsl/**'
              - 'examples/deploypack/dsl/**'
              - 'examples/referencepack/dsl/**'
              - 'examples/reviewspack/dsl/**'
              - 'integrations/*.json'
              # The `clients/` tree (memql#3326). clients_allowlist_test.go in
              # the ROOT package sweeps `git ls-files clients` and fails on a
              # directory that is not in its allowlist -- the structural half of
              # product neutrality, which the banned-NAMES sweep next to it
              # cannot cover.
              #
              # It needs a route of its own because a new client is TypeScript:
              # `clients/acme-spa/**` sets the `portal` bucket, and portal-checks
              # runs npm, not Go. Without this entry the one PR shape the guard
              # exists for -- a product SPA landing under clients/ -- matches no
              # bucket that reaches a Go lane, and the guard never fires.
              - 'clients/**'
              # Not embedded, but a gate input read by a package this lane
              # already runs (`./component/architecture/...`), and found in the
              # same sweep: it was in NO consumed bucket while being able to
              # redden `main` on the next author's push -- renaming a
              # `service:` fails TestArchitectureModelIsNotStale.
              - 'arch.yaml'
              # Cross-language contract fixtures (memql#3399). A fixture here is
              # the shared statement two halves of the repo are BOTH asserted
              # against -- today, what the identity service advertises as a dial
              # address versus what a client will accept. The Go side reads it
              # from the root package and from component/identity; the
              # TypeScript side reads the same file, which is why this path is
              # ALSO in the `vscode` bucket. Editing the fixture alone must run
              # both, or the coupling the fixture exists to create is only
              # enforced on whichever half a PR happens to touch.
              - 'test/fixtures/**'
              # component/backup/testdata/** -> the backup COMPATIBILITY GATE
              # (component/backup/compatibility_test.go). Each fixture is a real
              # backup in a format version this engine once wrote, and the test
              # restores every one. They are the only evidence behind the promise
              # that a newer engine reads every older backup, so a change to one
              # has to run the gate that reads it.
              - 'component/backup/testdata/**'
              # The REST of the env-registry corpus (memql#3223).
              #
              # `cmd/envscan/scan.repoCorpus` walks the WHOLE repository and
              # reads every `.go`, `.memql`, `.yaml`, `.yml` and `.env*` file;
              # `TestNoEnvRegistryDrift` then fails when a registered env var
              # appears nowhere in that corpus. `./cmd/envscan/...` runs in the
              # gate-inputs step below, so `gates` is the bucket that reaches
              # it.
              #
              # The `.go` and `.memql` halves of that corpus were already routed
              # (`go`, and `**/*.memql` above). The yaml/env half was NOT -- so
              # deleting the last reference to a registered var from a k8s
              # manifest ran ZERO lanes, merged green, and reddened `main` for
              # the next unrelated author. Same delayed-blame shape the embed
              # inventory had, different corpus. Measured at 62 files, mostly
              # `deploy/**`, `infra/**` and `.github/*.yml`.
              #
              # Stated as EXTENSIONS rather than as directories on purpose: the
              # scanner's trigger IS the extension, so a new manifest in a new
              # directory must not be able to slip back out.
              #
              # Be exact about the cost, because this one is NOT the "free
              # over-matching" case noted at the top of this bucket. That note
              # is about Go files inside already-routed embedded trees being
              # inert. These files previously ran NOTHING, so a
              # manifest-only PR goes from zero lanes to the gate-inputs lane
              # and pays the near-full build documented on that step (~6min
              # wall, cold cache, against ~35s of actual test execution).
              #
              # That is the price of not handing the next author a red `main`
              # for a diff their own PR was told was green. It is worth paying;
              # it is not free.
              - '**/*.yaml'
              - '**/*.yml'
              - '**/.env*'
            # Any Go source or the module graph. The generator and sdk/go
            # are Go too, so they are a subset of this.
            #
            # The module files are matched at ANY DEPTH, not only at the repo
            # root (memql#3165 review). The root-only literals left a NESTED
            # `go.mod` matching no bucket ANY LANE CONSULTS -- every lane
            # skipped and `ci-required` went green over the single file type
            # that changes what every Go selector in this workflow resolves to.
            # Verified against picomatch (the matcher dorny/paths-filter uses),
            # scoring only the seven buckets an `if:` actually reads (ci, gates,
            # go, dsl, sdkts, proto, vscode -- the target-module buckets below
            # are declared but wired to nothing, so matching them routes
            # nothing):
            #
            #   go.mod                    -> go
            #   component/memql/go.mod    -> NO BUCKET   <-- whole pipeline skips
            #   core/go.mod               -> NO BUCKET
            #   integrations/go.mod       -> NO BUCKET
            #   dsl/agents/roles/go.mod   -> dsl only, so RUN_GO and RUN_GATES
            #                                are BOTH false and neither the
            #                                root-package step nor the
            #                                complement step runs
            #
            # That last one is not hypothetical: a boundary there silently
            # drops 12 embedded files, and embed_inventory_test.go -- the guard
            # written for exactly that -- did not execute for it.
            #
            # The root literals are KEPT alongside the `**/` forms rather than
            # replaced by them. picomatch's `**/go.mod` does match a root
            # `go.mod` today (verified), but the failure class being closed
            # here IS "a pattern silently matches less than its author
            # thought", so root coverage is stated outright instead of resting
            # on globstar's zero-directory case.
            # THE PROVING SUITE (epic memql#4993). Its own bucket rather than a
            # corner of `go`, because the CORPUS IS DATA: a scenario JSON or a
            # cassette changes what the lane measures without changing a line
            # of Go, and a `**/*.go` filter would skip the lane on exactly the
            # diff that needs it most. The generated scorecard and page are
            # here for the same reason -- the lane checks the page against the
            # committed JSON, so an edit to either must run it.
            proving:
              - '.github/workflows/ci.yml'
              - 'cmd/memql-bench/**'
              - 'component/proving/**'
              - 'component/automations/**'
              - 'component/work/**'
              - 'dsl/bench/**'
              - 'test/proving/**'
              - 'docs/public/overview/proving-scorecard.md'
              - 'docs/public/overview/proving/scorecard/**'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - '**/go.mod'
              - '**/go.sum'
              - '**/go.work'
              - '**/go.work.sum'
              # Testdata read by a Go gate, routed HERE and not to `gates`:
              # TestNoNewSpaceIdInCore lives in `component/memql`, which the
              # gate-inputs step deliberately does not run (~90s, see the
              # STATED BOUNDARY note on that step). `component/memql` runs in
              # db-tests, which gates on this bucket -- so `go` is the bucket
              # that actually reaches the test. It was in no consumed bucket
              # at all: dropping a line from the baseline merged green and
              # reddened `main` for the next author.
              - 'component/memql/testdata/**'
              # The recorded Shopify Admin introspection the mirror generator
              # reads. Same reasoning as the line above: the drift gate that
              # consumes it (cmd/shopifyschema) regenerates the whole tree from
              # it and diffs against what is checked in, so a change to the
              # fixture IS a change to 155 generated files -- and the gate-inputs
              # step does not run cmd/**. Routed here rather than to `gates`
              # because `go` is the bucket that reaches the test.
              - 'cmd/shopifyschema/testdata/**'
            # The embedded DSL tree.
            dsl:
              - 'dsl/**'
            # The TypeScript SDK and the generator that emits it.
            sdkts:
              - 'sdk/ts/**'
              - 'scripts/sdk-gen/**'
            # The framework-agnostic renderer shared by the VS Code extension
            # and the portal. Its own bucket rather than folded into `sdkts`:
            # it is a separate package with a separate install + test cycle,
            # and a change confined to it must still run its lane.
            viewkit:
              - 'sdk/ts-viewkit/**'
            # Proto sources + their generated bindings + the gate script
            # (memql#928 drift gate). A .proto edit WITHOUT its regenerated
            # .pb.go matches here but NOT `go`, so this is what makes the
            # "forgot to regenerate" case run the check.
            # The three generated trees are the whole D3 `wire` tier.
            # `component/bus/gen` was missing until memql#3213, so a change
            # confined to its generated output matched `go` but not `proto` and
            # skipped the drift gate that the identical change under grpc/gen
            # or node/gen ran. TestProtoBucketCoversEveryGeneratedWireTree
            # (scripts/ci) discovers the trees from the `*.pb.go` on disk
            # rather than trusting this list, so a fourth cannot be omitted.
            proto:
              - '**/*.proto'
              - 'component/bus/gen/**'
              - 'component/grpc/gen/**'
              - 'component/node/gen/**'
              - 'scripts/dev/proto-gen.sh'
            # The VS Code extension + the offline LSP binary it bundles + the
            # packaging script.
            #
            # sdk/ts and sdk/ts-viewkit are in here as well as in their OWN
            # buckets, deliberately. The extension consumes both as `file:`
            # dependencies and esbuild inlines them into out/extension.js, so a
            # change confined to either package can break the extension's
            # typecheck, its tests, and `vsce package` -- while the sdkts /
            # viewkit lanes run that package's own tests, go green, and report
            # nothing. Renaming an export is enough to do it. The consumer must
            # rebuild whenever what it compiles against moves.
            vscode:
              - 'editors/vscode/**'
              - 'cmd/memql-lsp/**'
              - 'scripts/vscode/**'
              - 'sdk/ts/**'
              - 'sdk/ts-viewkit/**'
              # The cross-language contract fixtures (memql#3399), which the
              # extension's tests read directly. Also in `gates`, because the
              # Go half reads the same file -- see the note there.
              - 'test/fixtures/**'
            # The `clients/` category -- surfaces built on the platform, of
            # which this repo carries exactly one, the MemQL Portal
            # (memql#3314). Written as `clients/**` rather than
            # `clients/portal/**` so a second inhabitant is covered the day it
            # lands rather than the day someone remembers this file.
            #
            # sdk/ts and sdk/ts-viewkit are in here as well as in their OWN
            # buckets, for exactly the reason spelled out above the `vscode`
            # bucket -- and that lesson is why they are here from the start.
            # The portal consumes both as `file:` dependencies and Vite bundles
            # them into the SPA, so a change confined to either package can
            # break the portal's typecheck, its tests and `vite build`, while
            # the sdkts / viewkit lanes run that package's own tests, go green,
            # and report nothing. Renaming an export is enough to do it.
            # scripts/dev/portal_lane_scope_test.go fails if either is dropped.
            #
            # scripts/portal/** is the install/build cycle every portal command
            # goes through, so a change there breaks the lane's own recipe.
            #
            # component/portal/** WAS here too: the Go code that served the
            # bundle, on the theory that a bug there could break the portal in
            # the same sense a bad build.sh could. It is retired (memql#3711
            # -- the portal is site #1, served by the GENERIC component/edge,
            # not portal-specific Go). component/edge/** is NOT added in its
            # place: the edge serves every hosted site, not only the portal,
            # so folding it into this npm-only lane's trigger set would make
            # an unrelated customer-site change re-run portal-checks for no
            # reason. component/edge's own Go test suite covers it instead.
            portal:
              - 'clients/**'
              - 'sdk/ts/**'
              - 'sdk/ts-viewkit/**'
              - 'scripts/portal/**'
              # The portal's stylesheet @imports brand/ directly, so a token
              # change is a portal change even with nothing under clients/
              # touched (memql#4266).
              - 'brand/**'
              # And the Dockerfile, because its `portal-build` stage is the
              # thing the isolation step above tests -- a COPY dropped from
              # that stage is a portal break with nothing under clients/
              # touched, which is exactly how memql#4458 reached a release.
              - 'Dockerfile'

            # The MemQL OS shell (clients/os, memql#4705). Its own bucket
            # rather than riding `portal`: the portal bucket fires portal-checks,
            # which tests the PORTAL -- before this bucket existed the OS suite
            # ran in NO lane at all, so an OS regression shipped behind a green
            # ci-required. sdk/ts is here because the OS consumes it as a
            # `file:` dependency (same reasoning as the portal bucket);
            # scripts/os because the lane's own recipe lives there; brand
            # because the OS stylesheet @imports brand/fonts.css directly.
            # The Dockerfile stays with the portal bucket only -- the
            # stage-isolation docker step runs in portal-checks and already
            # builds the OS bundle in the same stage.
            osclient:
              - 'clients/os/**'
              - 'sdk/ts/**'
              - 'scripts/os/**'
              - 'brand/**'

            # ---------------------------------------------------------------
            # TARGET-MODULE BUCKETS (memql#3163 / design D3)
            #
            # These describe the module topology memql#3165 will draw
            # `go.mod` boundaries around: app -> servers -> integrations ->
            # platform -> engine -> base -> wire. Written against CURRENT
            # paths, so when the modules land no path moves -- that is what
            # decision F buys.
            #
            # DELIBERATELY NOT WIRED TO ANY LANE'S `if:` YET, and the reason
            # matters more than the buckets:
            #
            #   1. Every Go lane today runs a `./...`-style selector -- the
            #      test lane runs the whole complement, and the build lanes run
            #      `go build -tags X ./...`. A dependency-closed bucket cannot
            #      narrow a lane that compiles everything, so wiring these in
            #      would buy ~zero job-minutes until per-module lanes exist.
            #   2. Scoping the TAGGED build lanes by path would be UNSOUND.
            #      `go build -tags X ./...` compiles the whole module, so any
            #      Go change can break it -- which is exactly why
            #      build-node-tags already gates on the whole `go` bucket
            #      rather than on the tree its tag names. Narrowing them would
            #      let a breaking change skip the lane: faster CI that verifies
            #      less.
            #
            # So the closure becomes meaningful AFTER the module split, not
            # before it. Wiring these up is tracked as follow-up to memql#3163.
            #
            # NOTE: `wire` from the D3 table is the existing `proto` bucket
            # above (**/*.proto + the generated gen/ trees); it is not
            # duplicated here.
            # component/{auth,bus,events,safety} are BASE, not platform
            # (memql#3239). Drawn in platform they made engine and platform a
            # mutual module requirement -- component/memql (engine) imports all
            # four, while component/node/bootstrap.go:9 (platform) imports
            # component/memql. That is a genuine module cycle, which Go rejects.
            #
            # Demoting them resolves it with zero code changes: re-measured
            # 2026-08-07, their internal dependencies are core (base) and the
            # gen/ trees (wire) only, so base acquires no upward edge.
            base:
              - 'core/**'
              - 'component/language/annotations/**'
              - 'component/language/ast/**'
              - 'component/language/dslclause/**'
              - 'component/auth/**'
              - 'component/events/**'
              - 'component/bus/**'
              - 'component/safety/**'
            engine:
              - 'component/memql/**'
              - 'component/language/**'
              - 'component/database/**'
              - 'component/actions/**'
              - 'dsl/**'
            platform:
              - 'component/node/**'
              - 'component/identity/**'
            integrations:
              - 'integrations/**'
            # component/grpc EXCLUDING its generated gen/ tree, which is `wire`
            # (L0, 40 importers as measured in memql#3165) and is targeted to
            # version independently.
            #
            # The exclusion is ENUMERATED POSITIVELY, and it has to be
            # (memql#3222). This bucket previously read:
            #
            #   - 'component/grpc/**'
            #   - '!component/grpc/gen/**'
            #
            # which looks like a subtraction and is an addition.
            # `dorny/paths-filter` compiles every pattern into its own matcher
            # and ORs the results (`src/filter.ts`, `.some()`), so the second
            # line was an independent term meaning "any path NOT under
            # component/grpc/gen" -- true for nearly the whole repository.
            # Measured against the pinned action's own matcher: the bucket was
            # true for 3085 of 3085 tracked files, INCLUDING
            # `component/grpc/gen/memql.pb.go`, the one file the negation
            # existed to remove.
            #
            # Exclusion cannot be expressed in a paths-filter pattern list at
            # all, so `component/grpc/*` (top-level sources) plus each non-`gen`
            # subtree is the only faithful spelling.
            # `TestServerGrpcBucketEnumeratesEveryNonGenSubtree` fails when a
            # new subdirectory appears here, so the enumeration cannot silently
            # go stale; `TestNoNegatedPatternWidensItsBucket` stops the negation
            # form coming back in any bucket.
            server-grpc:
              - 'component/grpc/*'
              - 'component/grpc/google/**'
            server-http:
              - 'component/server/**'
            server-mcp:
              - 'component/mcp/**'
            app:
              - 'app/**'
              - 'cmd/**'
              - 'main.go'

  # Routing guard -- the ONE lane in this workflow with no `if:` and no
  # `needs:` (memql#3451).
  #
  # Everything above routes: a lane runs when the diff matches the bucket its
  # `if:` reads. That is the #856 win and it is kept. But it cannot be applied
  # to the guard that objects to a file matching NO bucket, because such a file
  # sets every bucket false -- so the guard would be switched off by exactly
  # the diff it exists to catch.
  #
  # That is not hypothetical. It is how `.claude/settings.json` became tracked,
  # matched no consumed bucket, scheduled zero lanes, merged green, and then
  # reddened `main` for an unrelated author days later. The guard was correct
  # throughout; it simply did not run on the PR that could have acted on it.
  #
  # A catch-all `**` bucket would be the other obvious fix and this repository
  # already rejects that shape: TestNoBucketMatchesEveryTrackedFile fails any
  # bucket true for every tracked file, on the stated grounds that "a bucket
  # that genuinely must always fire should be an unconditional lane, not a
  # filter". So it is a lane.
  #
  # Deliberately TINY, because it runs on every PR: two packages of static
  # guards over ci.yml and the tracked-file list, ~3.5s of tests, no database,
  # no npm, no CGO, no build of the module. It duplicates work that go-tests
  # also does on a Go PR; that duplication is the price of the guard being
  # unconditional, and it is seconds.
  #
  # -count=1 for the reason the root package carries it: these guards sweep
  # `git ls-files` in a subprocess, and Go's test cache records the files a
  # test OPENS, not the set a subprocess returned -- so a newly tracked file
  # leaves the cache key unchanged and the guard reports a stale green over a
  # path it never scored. That is this lane's whole failure mode, cached.
  #
  # scripts/dev/path_routing_lane_scope_test.go asserts the shape of this lane:
  # no condition, no dependency, both packages covered, no -run selector, no
  # swallowed failure.
  path-routing:
    name: path-routing
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      - name: go test (path routing + CI-configuration guards)
        run: go test -count=1 -timeout=300s ./scripts/ci/ ./scripts/dev/

  # Consolidated CGO-free Go lane. One job, one warm GOCACHE, every
  # CGO-free Go check run in sequence. The job runs when `go` OR `dsl`
  # changed (or on push / a CI-config change); within it each step keeps
  # its original path gate so DSL-only PRs skip the pure-Go steps.
  #
  #   RUN_GO  -> build / vet / test                        (go bucket)
  #   RUN_DSL -> dsl-lint / engine-load / sdk-gen-check     (go OR dsl bucket)
  #
  # Step order matters: `go build ./...` runs first so the compiled-package
  # cache is warm for vet/test/run/lint that follow.
  go-checks:
    name: go-checks
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.gates == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUN_GO: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
      RUN_DSL: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
      RUN_PROTO: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' }}
      # Only when the FULL suite is not already running. `go test ./...` under
      # RUN_GO covers every gate package, so firing both would just run them
      # twice (memql#2972).
      RUN_GATES: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ci != 'true' && needs.changes.outputs.go != 'true' && needs.changes.outputs.gates == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css

      # --- gate inputs (gates bucket) -- a non-Go change a Go test reads ---
      #
      # Runs the packages that host repo-sweeping gates, and ONLY when the
      # full suite is not already running. A PR touching only `.md`, a
      # manifest, the architecture model or a shell script used to match no
      # bucket at all: every lane skipped and `ci-required` went green over a
      # diff nothing verified, while the test that would have caught it sat in
      # the skipped step below (memql#2972).
      #
      # A docs-only PR deliberately does NOT pay the whole suite here -- that
      # is the #856 routing win and the stated intent in this file's header.
      # It pays the gates that actually read what it changed.
      #
      # Be exact about what that saves, because it is less than it reads:
      # the saving is in TEST time (~35s here against the full suite), not in
      # COMPILE time. The root package imports app, which pulls in most of the
      # module, so a docs-only PR now pays a near-full build it previously
      # skipped entirely -- measured at ~6min wall on a cold cache against
      # ~35s of actual test execution (memql#3060 review). That is the price
      # of the bucket, and it is worth paying against a green tick over an
      # unverified diff; it is not free.
      #
      # No `-run` / `-skip`: a selector matching nothing exits 0 having tested
      # nothing, which is the defect class this bucket is part of (#2923,
      # #3003). scripts/dev/gate_inputs_lane_scope_test.go pins that, pins the
      # package list against the bucket's globs, and pins the bucket against
      # the paths those packages read.
      #
      # ./test/dslconformance and ./examples are here because the
      # `**/*.memql` glob would otherwise promise coverage this step does not
      # deliver -- the bucket comment cites the referencepack tests, and they
      # live in examples/referencepack, not in any package above. The DSL
      # conformance suite also hosts TestPublicExamplesAreAnnotated, which
      # reads a docs/public `.md`. Together they cost ~2s (memql#3060 review).
      #
      # That suite USED to be `./dsl/...`, and it is the same tests: memql#3242
      # made `dsl` a module, and a suite importing `component/memql` cannot sit
      # inside the module `component/memql` requires. It moved up to the root
      # module; only the selector changed.
      #
      # STATED BOUNDARY: component/memql also reads bucket files -- its
      # reference-pack load test and sense's walk of the dsl/ tree -- and is
      # deliberately NOT here. That package costs ~90s, which is most of a
      # docs-only PR's budget, and its gates are covered whenever RUN_GO or
      # RUN_DSL fires. Adding it belongs with a decision about what a
      # docs-only PR should pay, not with closing this bucket.
      - name: go test (gate inputs)
        if: ${{ env.RUN_GATES == 'true' }}
        # KNOWN NARROW OVERLAP, deliberately kept (memql#3160). `./examples/...`
        # includes examples/referencepack, which db-tests also owns. Removing it
        # here is NOT the fix: RUN_GATES fires on docs-only and
        # `.memql`-outside-dsl PRs where db-tests does NOT run, so dropping it
        # would open a coverage hole in exactly the fail-open the gates bucket
        # was added to close (memql#2972). The overlap is 3 test files.
        #
        # It used to be narrower: "only on a PR touching dsl/** PLUS a gate
        # input with no .go file at all". That conjunction no longer holds --
        # `dsl/**` is itself a `gates` entry now, so any dsl-only PR satisfies
        # both halves on its own. In practice `**/*.memql` already made it true
        # for most dsl PRs; the change extends it to `.tmpl`/`.pin`-only ones.
        # Still bounded by `any .go change sets RUN_GO, which makes RUN_GATES
        # false`, which is the part that actually caps the cost.
        #
        # `./component/auth/...` IS HERE FOR THE SAME REASON `./deploy/...` IS
        # (epic memql#4832). role_ladder_client_parity_test.go reads THREE
        # files this bucket routes and this lane otherwise never ran a test
        # over: clients/os/src/system/roles.ts, clients/os/test/seededLadder.ts
        # and dsl/rbac/seeds.memql. It refuses a hardcoded role ordering in the
        # shell and pins the ladder's three readings to one set of numbers.
        #
        # Without this entry the gate's own inputs reach NO lane that runs it:
        # `clients/**` and `**/*.memql` are `gates` entries, and a PR touching
        # only those sets RUN_GO false -- so re-introducing the divergence this
        # epic closed would have merged green, in exactly the shape the two
        # ladders arrived in the first time. Cheap: the package is small and
        # DB-free.
        #
        # `./deploy/...` CLOSES A HOLE THIS BUCKET ALREADY MEANT TO COVER
        # (memql#4487). `**/*.yaml` is a `gates` entry, and two deploy trees
        # are routed here BY NAME with comments saying which Go test reads
        # them -- but the selector above never included the packages those
        # tests live in, so `deploy/fleet/**` reached `gates` and
        # TestBundleImageCopiesTheBundle still did not run. RUN_GATES is false
        # whenever RUN_GO is true, so a manifest-only PR is EXACTLY the diff
        # that reaches this step and nothing else: go-tests skips (its `if` is
        # ci || go || dsl), and every gate under deploy/ sat unreached.
        #
        # What that made inert is the whole render-gate family -- the
        # front-door staleness checks, the module holds, and the
        # ExternalSecret gates added with this comment. Deleting a
        # `$patch: delete` from an overlay is a yaml-only diff by
        # construction, which is to say the gate was absent for precisely the
        # change it exists to catch, and `ci-required` went green over it.
        #
        # Cost is ~20s, against component/memql's ~90s in the STATED BOUNDARY
        # above -- and unlike that package, these tests read the bucket files
        # themselves rather than merely importing something that does.
        # deploy/ is not a db-gated tree, so this adds no database dependency;
        # the render halves self-skip without kustomize or kubectl on the
        # runner, and the text-level halves, which are the ones that must not
        # skip, do not.
        run: go test -count=1 -timeout=300s ./ ./cmd/envscan/... ./component/architecture/... ./component/envregistry/... ./scripts/... ./test/dslconformance/... ./examples/... ./component/auth/... ./deploy/...

      # --- pure-Go lanes (go bucket) -- build first to warm the cache ---
      #
      # Selector is the MODULE pattern, not `./...` (memql#3165). The two are
      # identical today -- one module, no go.work -- and stop being identical
      # the moment a second `go.mod` appears anywhere beneath the root:
      # `./...` then silently means "this module only", so the packages that
      # moved into the new module are no longer built, vetted or tested and
      # nothing goes red. Naming the module makes the selector say what it
      # means, and makes a future per-module lane a one-line change instead of
      # a silent scope loss.
      - name: go build
        if: ${{ env.RUN_GO == 'true' }}
        run: go build github.com/znasllc-io/memql/...
      - name: go vet
        if: ${{ env.RUN_GO == 'true' }}
        run: go vet github.com/znasllc-io/memql/...
      # Env-var registry drift gate (7.2 / memql#2105). Fails on drift in
      # either direction: a var read in code but not registered in
      # scripts/secrets/manifest.yaml, or a registry entry that appears
      # nowhere in the repo. The TestNoEnvRegistryDrift Go test in the
      # `go test` step above is the same check; this step is the explicit,
      # named signal.
      - name: env-registry-check (registry drift gate)
        if: ${{ env.RUN_GO == 'true' }}
        run: make env-registry-check

      # --- DSL lanes (go OR dsl bucket) ---
      # DSL-lint: runs `memqllint` over the embedded DSL tree, catching the
      # parse/import/reference failures the runtime loader's WARN+ skip paths
      # would surface at boot. See memql#278.
      #
      # THIS IS the "lint dsl/" CI gate the dsl-engine-mvp-foundation planning
      # doc recorded as an unchecked, disabled placeholder waiting on the
      # memql-cockpit binary becoming installable on the runner (memql#4109).
      # It is enforced, and it never needed the cockpit: `cmd/memqllint` is an
      # in-tree Go program, so `go run` builds it from the checkout with no
      # cross-repo install step and no binary to distribute. Do not "restore"
      # a cockpit-based gate on top of this one -- it would add a cross-repo
      # dependency to buy nothing.
      - name: dsl lint
        if: ${{ env.RUN_DSL == 'true' }}
        run: go run ./cmd/memqllint dsl/
      # Engine-bootstrap smoke gate. dsl-lint runs the parse/diagnostic
      # pipeline, but the engine's concept + relationship validation (and the
      # spec/shape/function/builtin/tool/prompt/provider/policy loaders) run
      # ONLY at engine Init -- which no other lane exercises without Postgres.
      # That gap let #597 (an unregistered `dependsOn` relationship type)
      # merge green and crash every node at boot. See #599.
      - name: engine load check (engine init over full DSL tree)
        if: ${{ env.RUN_DSL == 'true' }}
        run: go test -run TestEngineInitLoadsFullDSL ./component/memql/
      # SDK drift check: regenerates the typed Go SDK from the DSL and fails
      # on a diff. The generator is Go and reads dsl/, so it gates with the
      # DSL lanes.
      - name: sdk-gen-check (typed SDK drift)
        if: ${{ env.RUN_DSL == 'true' }}
        run: make sdk-gen-check
      # Proto drift check (memql#928): regenerate the pinned-toolchain proto
      # bindings (component/grpc, component/node and component/bus -- bus was
      # normalized onto the pinned toolchain in memql#928 itself, so the
      # exclusion this comment used to claim had not existed for some time) and
      # diff against the checked-in tree, ignoring the cosmetic protoc version
      # stamp. Catches a .proto edited without its .pb.go regenerated -- the gap
      # that let stale bindings merge green.
      # Cache the PINNED protoc that proto-gen.sh provisions into bin/tools/
      # (memql#3166 / design D4.2). Without this it is re-downloaded from
      # github releases on every run: a network dependency on the critical
      # path, in exactly the class of step that failed during the 2026-08-06
      # incident. On a warm cache the proto lane makes ZERO network calls for
      # its toolchain.
      #
      # Keyed on proto-gen.sh's hash rather than a duplicated version literal,
      # so bumping PROTOC_VERSION in that script invalidates the cache by
      # construction instead of by remembering to edit two places.
      - name: cache pinned protoc
        id: protoc-cache
        if: ${{ env.RUN_PROTO == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: protoc-${{ runner.os }}-${{ hashFiles('scripts/dev/proto-gen.sh') }}
      # FALLBACK only, and now only when it can actually be needed. proto-gen.sh
      # uses the pinned bin/tools/ copy when present and falls back to a system
      # protoc if the pinned DOWNLOAD fails (a releases outage degrades the lane
      # instead of reddening it; the drift diff ignores the version stamp, so a
      # differing protoc still gives a correct verdict).
      #
      # On a cache HIT no download is attempted, so the fallback is unreachable
      # and this apt-get was 14s of pure waste on the critical path (audit W4).
      # It now runs only on a cache miss -- precisely the runs where a download
      # will be attempted and could fail.
      - name: install protoc (fallback, only when the pinned copy is not cached)
        if: ${{ env.RUN_PROTO == 'true' && steps.protoc-cache.outputs.cache-hit != 'true' }}
        run: |
          scripts/ci/retry.sh -- timeout 120 sudo apt-get update
          scripts/ci/retry.sh -- timeout 300 sudo apt-get install -y protobuf-compiler
      - name: proto-gen-check (proto drift)
        if: ${{ env.RUN_PROTO == 'true' }}
        run: make proto-gen-check

  # Test lane (memql#3161 / design D5.3c). Split out of go-checks so that lane's
  # duration becomes max(test, build+vet+drift) rather than their sum: `go test`
  # was 223s of go-checks' 364s and the drift checks (15s combined) sat behind
  # it for no reason.
  #
  # BE PRECISE ABOUT WHAT THIS BUYS. It does NOT take time-to-green to ~3.5m.
  # Every lane fans out in parallel from `changes`, and db-tests is 5.8m (audit
  # section 5) -- so once this lane drops to ~4m, db-tests becomes the binding
  # constraint at 0.1 + 5.8 + 0.1 = 6.0m. The design's "~3.5m" is the go-checks
  # LANE figure, not the pipeline figure. Nothing in this epic shortens db-tests.
  #
  # The intra-run warm GOCACHE from ce366821 is partly given up: `go build` in
  # go-checks no longer warms this lane within the same run. Both lanes still
  # restore GOCACHE through actions/setup-go's cache, so what is lost is the
  # same-run warmth, not caching.
  go-tests:
    name: go-tests
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUN_GO: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
      RUN_DSL: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      # Runs the COMPLEMENT of the db-gated trees, not `./...` (memql#3160 /
      # design D5.3b). Those six trees carry 543+ test files that db-tests owns
      # and re-runs in full, so testing them here compiled and executed the same
      # files twice on every PR. Their non-DB tests are not lost: db-tests runs
      # the whole package, not just the gated cases.
      #
      # The set is canonical in scripts/ci/db-gated-packages.sh; db-tests keeps
      # literal arguments because scripts/cidb/dbgate_test.go derives its
      # selector from them. The two cannot drift -- scripts/ci asserts they are
      # identical.
      # The root package KEEPS -count=1 (memql#3162). Seven gates there sweep
      # `git ls-files` and read what it returns; Go's cache records the files a
      # test OPENS but not the SET a subprocess returned, so a newly added `.md`
      # leaves the cache key unchanged and the gate reports a stale green over a
      # file it never read -- the memql#2972 fail-open, reopened by caching.
      - name: go test (root package, deliberately uncached -- sweeps git ls-files)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -count=1 -timeout=300s .
      # Everything else drops -count=1 so the Go test cache actually works
      # (memql#3162 / design D5.3a). actions/setup-go already restores GOCACHE,
      # where Go stores test results -- the cache was being populated on every
      # run and then explicitly ignored. Open item O1 resolved this as original
      # boilerplate: it entered in the first CI commit (98667d60) with no
      # rationale recorded, and the one commit that reasons about it (5be808a1)
      # documents it MASKING a defect CI "would never have caught (fresh
      # container, -count=1)".
      #
      # The package list is captured into a variable BEFORE `go test` sees it,
      # and that is load-bearing (memql#3165). Inlined as
      # `go test $(script)`, a script that exits non-zero does NOT fail the
      # step: `bash -e` does not abort on a command substitution inside an
      # argument list, so `go test` runs with NO package arguments, tests the
      # current directory, and exits 0. A broken selector would report a green
      # lane over 169 untested packages -- the memql#2972 fail-open shape. As
      # an assignment, the substitution's exit status IS the statement's, so
      # `bash -e` aborts and the lane goes red. The empty check covers the
      # other half: a script that exits 0 with no output.
      # THE PER-PACKAGE TIMEOUT IS 600s, RAISED FROM 300s (epic memql#4794),
      # and the reason is a measurement rather than a preference.
      #
      # `-timeout` is per PACKAGE, and cmd/memql-lsp was already running at
      # 209s and 245s of the 300s budget on green main runs -- 70% and 82%.
      # That is not a margin: it makes every lane red a coin flip on runner
      # speed, and it makes the NEXT change to the DSL tree the one that gets
      # blamed. The packages epic added ~30 constructs, which grows every tree
      # load that package makes, and tipped it -- twice, with a pass in
      # between, which is the signature of a budget sitting at its limit rather
      # than of a hang.
      #
      # 600s is 2.4x the worst observed rather than a round number pulled from
      # nowhere. It does not hide a genuinely hung test: the JOB carries
      # `timeout-minutes: 20` above, so a deadlock still fails the lane -- this
      # only stops a SLOW package being reported as a hung one.
      #
      # If a package ever approaches 600s, the answer is to make it cheaper
      # rather than to raise this again. cmd/memql-lsp is slow because most of
      # its cases build a full engine from the embedded DSL tree.
      - name: go test (excluding the db-gated trees db-tests owns)
        if: ${{ env.RUN_GO == 'true' }}
        run: |
          pkgs="$(scripts/ci/db-gated-packages.sh --complement-cacheable)"
          test -n "$pkgs" || { echo "::error::db-gated-packages.sh produced an empty package list"; exit 1; }
          go test -timeout=600s $pkgs
      # Build-tagged test lanes (#1338, #2903). The untagged `go test ./...`
      # above never RUNS a //go:build-tagged test file, so a tagged suite is
      # CI-invisible without an explicit -tags run.
      #
      # This used to carry a hand-maintained audit of which tags have test
      # files and which lane covers each. It drifted on FOUR tags at once (mcp
      # omitted entirely with three files; three more covered by a closing "no
      # other build tag carries test files today" that was false of each),
      # which is how three mcp-tagged suites went their whole life without
      # executing -- including the file the #2888 vulnerability lives in.
      #
      # The audit is now EXECUTABLE: cmd/citags/scan reads the tags actually
      # present on *_test.go files and the `go test -tags ...` invocations
      # actually present in this directory, and fails the untagged lane when
      # they disagree. Add a tagged suite without a lane and CI goes red with
      # the file list. Do not reintroduce a prose audit here; a second
      # hand-maintained copy is the defect that gate exists to prevent.
      #
      # These lanes are CGO-free, so they ride the warm go-checks cache.
      - name: go test -tags agent (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -tags agent -timeout=300s ./integrations/agent/ ./integrations/agent/worker/
      # RUN_GO or RUN_DSL: component/mcp/real_engine_surface_test.go pins DSL
      # contracts (e.g. @mcp on readyHarnessStep), so a DSL-only change can red
      # this lane. Mirrors the engine-load-check step's gating.
      - name: go test -tags mcp (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' || env.RUN_DSL == 'true' }}
        run: go test -tags mcp -timeout=300s ./app/ ./component/mcp/
      - name: go test -tags identity (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -tags identity -timeout=300s ./app/
      - name: go test -tags edge (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -tags edge -timeout=300s ./app/ ./component/server/
      # POST /sites/{id}/bundles (memql#3713): app/transport_sites_test.go is
      # //go:build bff and would otherwise never execute -- the exact defect
      # this audit exists to catch, caught against this PR before merge
      # rather than after.
      - name: go test -tags bff (build-tagged suites)
        if: ${{ env.RUN_GO == 'true' }}
        run: go test -tags bff -timeout=300s ./app/ ./component/server/

  # Node-tag compile lane (#1584). go-checks builds/tests with the DEFAULT
  # build tags, so a file gated behind a node build tag
  # (`//go:build identity|mcp|agent|planner|workbench`) is NEVER
  # compiled in CI -- a tagged-only compile error passes every PR gate and
  # only fails at image-build time on the GitHub build server. That gap
  # surfaced the 0.9.61 break: #1570 changed Store.CreateAuthCode but missed
  # app/integrations_identity.go (`//go:build identity`); go-checks stayed
  # green and `go build -tags identity` only failed when build-engine-images
  # built the identity image. This matrix compiles every node tag so a
  # tagged-only break is a required-check failure pre-merge. Gates on `go`:
  # a tagged build compiles the whole module, so any Go change can break it.
  build-node-tags:
    name: build node tags
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [identity, mcp, agent, planner, workbench]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      - name: go build -tags ${{ matrix.tag }}
        run: go build -tags ${{ matrix.tag }} github.com/znasllc-io/memql/...
      - name: go vet -tags ${{ matrix.tag }}
        run: go vet -tags ${{ matrix.tag }} github.com/znasllc-io/memql/...

  # Cluster-e2e compile/vet lane (memql#4212). test/clustere2e is gated behind
  # `//go:build clustere2e` and needs a provisioned 2-replica parity cluster to
  # RUN, so no lane here runs it -- scripts/citags records the exclusion. But a
  # package nothing compiles rots silently: it did not even build until
  # memql#4201, and nothing in CI could tell. This job compiles and vets it
  # under its tag, and nothing more: `go test -c` to a discarded binary, never
  # a run (scripts/citags does not count a `-c` step as coverage, so the
  # exclusion stays honest). GOWORK=off matches scripts/test/cluster-e2e.sh,
  # which runs the live suite that way, so a require the root go.mod lacks
  # fails here rather than on the cluster. Gates on `go` (like
  # build-node-tags): any Go change can break it. Listed in ci-required below;
  # scripts/citags TestClusterE2ECompileLaneGatesTheMerge pins all of this.
  build-clustere2e:
    name: build clustere2e
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Quoted: a bare `off` is a YAML 1.1 boolean to some parsers.
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      # Needed here since memql#4302, when the cross-replica magic-link gate
      # started importing that package -- vet fails with "pattern
      # static/app.css: no matching files found" without it, which names the
      # missing file but not the missing build step.
      - uses: ./.github/actions/identity-css
      - name: go vet -tags clustere2e
        run: go vet -tags clustere2e ./test/clustere2e/
      - name: go test -tags clustere2e -c (compile only, never run)
        run: go test -tags clustere2e -c -o /dev/null ./test/clustere2e/

  # TypeScript SDK lane. Gates on `sdkts` (sdk/ts/** + the generator) so a
  # pure Go change that doesn't touch the generator skips the Node lane.
  sdk-ts-typecheck:
    name: sdk-ts-typecheck
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.sdkts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      # Retried (memql#3166 / design D4.3): dependency install is a network op.
      # The typecheck and test steps below are deliberately NOT retried --
      # retrying a test is how a flake becomes invisible.
      - name: install sdk/ts deps
        run: scripts/ci/retry.sh -- make sdk-ts-install
      - name: typecheck sdk/ts
        run: make sdk-ts-typecheck
      - name: test sdk/ts
        run: make sdk-ts-test

  # view-kit lane. Gates on `viewkit` (sdk/ts-viewkit/**) so a change confined
  # to the renderer runs its tests without dragging the whole Go suite.
  viewkit-checks:
    name: viewkit-checks
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.viewkit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      - name: install
        run: scripts/ci/retry.sh -- make viewkit-install
      - name: typecheck
        run: make viewkit-typecheck
      - name: test
        run: make viewkit-test

  # MemQL Portal lane (memql#3314). Gates on `portal`, which deliberately
  # includes the portal's `file:` dependencies (sdk/ts, sdk/ts-viewkit) --
  # see the bucket definition for why omitting them is a silent fail-open.
  #
  # Node 22 rather than the 20 the other TS lanes use: Vite 7 requires
  # ^20.19 || >=22.12, and pinning the floor exactly would make a patch
  # release of Node the thing that reds the lane.
  portal-checks:
    name: portal-checks
    timeout-minutes: 15
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.portal == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
      # Retried (memql#3166 / design D4.3): dependency install is a network op.
      # The three steps below are deliberately NOT retried -- retrying a test
      # is how a flake becomes invisible.
      - name: install
        run: scripts/ci/retry.sh -- make portal-install
      - name: typecheck
        run: make portal-typecheck
      - name: test
        run: make portal-test
      # The build is a gate, not a packaging step: a type error `tsc` tolerates
      # (a bad Tailwind token reference, a broken CSS import, a dynamic import
      # that does not resolve) shows up only here, and the image build runs
      # exactly this command.
      - name: build
        run: make portal-build

      # THE SAME BUILD, IN THE ISOLATION THE IMAGE GIVES IT (memql#4458).
      #
      # `make portal-build` above runs in a full checkout, where every path the
      # portal reaches for obviously exists. The Dockerfile's `portal-build`
      # stage COPYs a hand-maintained subset -- and when memql#4266 made the
      # portal import `../../../../brand/*.css`, that subset silently stopped
      # covering it. The step above stayed green for three days. What finally
      # ran the stage was the v0.19.7 release cut, which failed at the `edge`
      # image with eight of nine images already pushed.
      #
      # `--target portal-build` rather than the whole edge image: this is the
      # stage that broke and it is a fraction of the cost (no Go build), so the
      # lane pays about a minute for a class of failure that otherwise surfaces
      # at a release. `dockerfile_portal_stage_test.go` is the cheap static half
      # and catches a missing ROOT path specifically; this catches the rest --
      # a dropped `sdk/ts` COPY, a build script that reads something new.
      - name: build the portal the way the image does (stage isolation)
        run: docker build --target portal-build .

  # MemQL OS shell lane (the desktop client at clients/os). Gates on
  # `osclient` -- before this lane existed the OS suite ran NOWHERE in CI:
  # make os-test existed, #4705/#4706 merged with tests, and no job called
  # them, so ci-required was green over an untested client. Node 22 for the
  # same Vite 7 reason as portal-checks. The docker stage-isolation step is
  # deliberately NOT repeated here: portal-checks runs it and that one
  # stage builds BOTH bundles, so a second run would pay the stage twice
  # for the same proof.
  os-checks:
    name: os-checks
    timeout-minutes: 15
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.osclient == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
      # Retried (memql#3166 / design D4.3): dependency install is a network
      # op. The three steps below are deliberately NOT retried -- retrying a
      # test is how a flake becomes invisible.
      - name: install
        run: scripts/ci/retry.sh -- make os-install
      - name: typecheck
        run: make os-typecheck
      - name: test
        run: make os-test
      # A gate, not a packaging step: what tsc tolerates (a broken CSS
      # import, a dynamic import that does not resolve) shows up only here,
      # and the image build runs exactly this command.
      - name: build
        run: make os-build

  # MCP conformance suite (memql#1715) -- the capstone regression gate for epic
  # #1704. Unlike go-checks (which has no database, so every *_db_test.go skips),
  # this job provisions a TimescaleDB service so the DB-backed contract dimensions
  # actually RUN and gate: per-tool create->read->update->delete lifecycle,
  # inclusion/exclusion filtered queries (#1708), canonical array envelope (#1710),
  # partial-update-preserves-siblings (#1709), @pii scrub on hard-delete (#1711),
  # event-trigger logic binding (#1706), bare-literal AST eval (#1705), plus the
  # DB-free single-schema-source (#1713), system-id (#1712), and entry-point
  # (#1707) dimensions. The suite migrates the blank service DB on first connect
  # (the production NewMemoryNodesDatabase + Start path) and publishes a pass-rate
  # line + a step-summary table per build. Gates on go OR dsl (a DSL change can
  # move a contract); push + merge_group run it unconditionally so the merge
  # candidate that actually lands is gated. Added to ci-required below.
  conformance:
    name: mcp-conformance
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
    runs-on: ubuntu-latest
    services:
      # Same image the dev cluster uses; bundles TimescaleDB +
      # pgvector so the memory-nodes migrations (hypertable + vector) apply.
      #
      # Pulled from our GHCR MIRROR, pinned by digest (memql#2793). Docker Hub
      # pulls here are unauthenticated and happen at job setup, before any step
      # runs -- a Hub blip took this lane down before a test executed, and
      # because it feeds ci-required the merge queue EVICTED the candidate
      # (twice in ~9h: #2777, #2826). Refresh with the mirror-fixture-images
      # workflow, then update this digest in a PR; a floating tag here would
      # reintroduce the silent-drift half of #2793.
      postgres:
        image: ghcr.io/znasllc-io/ci-timescaledb@sha256:d8336a5c9cc49bdbf1e935234e8c87ab64b6d6d195fd2ecedff7b00185557631
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: memql
          POSTGRES_PASSWORD: memql_dev
          POSTGRES_DB: memql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MEMQL_DATABASE_DSN: postgres://memql:memql_dev@localhost:5432/memql?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      # Create the extensions the migrations expect (mirrors docker/init-db.sql,
      # which a service container can't mount). The suite migrates the rest.
      - name: create required Postgres extensions
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=memql_dev pg_isready -h localhost -U memql && break
            echo "waiting for postgres ($i)"; sleep 2
          done
          PGPASSWORD=memql_dev psql -h localhost -U memql -d memql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - name: mcp conformance suite (regression gate, seeded test DB)
        run: go test -count=1 -timeout=300s -v ./test/conformance/...

  # DB-seeded suite for the `*_db_test.go` packages (memql#2342). These
  # tests are NeedsDB: they self-skip when no Postgres is reachable, so they
  # NEVER ran in CI before -- only `test/conformance` was seeded -- and
  # silently rotted (referencing constructs that later migrations renamed).
  # This lane mirrors the conformance job's seeded-DB setup and runs the
  # remaining DB-gated suites so that whole class of test can't rot unseen
  # again.
  #
  # The selector below is no longer kept in sync BY HAND -- scripts/cidb does it
  # executably (memql#2886). The old rule written here, "keep this list in sync
  # with the packages that carry `*_db_test.go` files", was already wrong when
  # it was written: examples/referencepack carries none, and four of the seven
  # db-gated packages in the tree carry none either.
  #
  # DO NOT restate the gate's rules here. scripts/cidb enforces several, in both
  # directions -- a package can be missing from this list, and a list entry can
  # match nothing -- with deliberate exemptions, and its failure messages name
  # the offending package and the remedy. Two attempts to summarise those rules
  # in this comment were both wrong, the second one harmfully: it told the
  # reader to add any db-gated package below, which for scripts/cidb (exempt on
  # purpose, see selfPkg in dbgate_test.go) is the one edit that reds the lane.
  # A short restatement of a multi-rule gate is a comment that goes stale the
  # next time a rule moves, and a wrong comment about CI costs more than no
  # comment.
  #
  # The authority is scripts/cidb/doc.go for the rationale, dbgate_test.go for
  # the rules, and the gate's own output when it fails. memql#3030 tightened it
  # from LOGGING uncovered packages to FAILING on them.
  #
  # The packages below run as PARALLEL processes against this ONE shared DB, so
  # each must migrate the schema through a TestMain calling dbtest.EnsureSchema
  # (a cross-process advisory lock serializes it); otherwise the suites race on
  # a half-created schema and fail with `relation "MemoryNodes" does not exist`
  # (memql#2551). A new db-gated package needs both an entry below AND that
  # TestMain -- and adding the TestMain without the entry now fails the gate.
  db-tests:
    name: db-tests
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.dsl == 'true' }}
    runs-on: ubuntu-latest
    services:
      # Same image the dev cluster + conformance use; bundles
      # TimescaleDB + pgvector so the memory-nodes migrations (hypertable +
      # vector) apply. GHCR mirror, pinned by digest -- see the note on the
      # mcp-conformance service above (memql#2793).
      postgres:
        image: ghcr.io/znasllc-io/ci-timescaledb@sha256:d8336a5c9cc49bdbf1e935234e8c87ab64b6d6d195fd2ecedff7b00185557631
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: memql
          POSTGRES_PASSWORD: memql_dev
          POSTGRES_DB: memql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MEMQL_DATABASE_DSN: postgres://memql:memql_dev@localhost:5432/memql?sslmode=disable
      # Without this the whole point of the lane is optional (memql#2886). Every
      # db-gated test self-skips when it cannot reach Postgres, so a service
      # container that is slow to become healthy, unhealthy, or pulled from an
      # unreachable registry (memql#2793) degrades the entire DB-gated suite to
      # GREEN SKIPS rather than a red build -- and the PRs that rest their only
      # end-to-end evidence on this lane merge on a signal that never fired.
      #
      # MEMQL_REQUIRE_DB=1 converts every such skip into a failure
      # (component/database/dbtest.Unreachable). It is set HERE rather than
      # globally on purpose: a local `go test ./...` leaves it unset and keeps
      # the skip behaviour, which is the intended split.
      #
      # Do not remove it. scripts/cidb asserts this key is present and truthy,
      # and separately asserts the selector's coverage -- see the selector
      # comment above, and scripts/cidb itself for what it checks.
      MEMQL_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      # Create the extensions the migrations expect (mirrors docker/init-db.sql,
      # which a service container can't mount). The suite migrates the rest.
      - name: create required Postgres extensions
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=memql_dev pg_isready -h localhost -U memql && break
            echo "waiting for postgres ($i)"; sleep 2
          done
          PGPASSWORD=memql_dev psql -h localhost -U memql -d memql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      # NOTHING GOT SLOW. memql#3257 asked what added the time between the last
      # green run and the first red one, and the answer, measured against a real
      # Postgres across exactly that boundary, is nothing:
      #
      #   8b8db012 (last green)   component/memql  133.9s
      #   c650da97 (first red)    component/memql  123.6s
      #
      # It got ~10s FASTER. The suspected commits (concept_parser.go +211 and
      # ten dsl/*/concepts.memql, memql#3196 / #3197 / #3198) cost nothing
      # measurable. Nor is CI's 2.4x over local a contention artefact: pinned to
      # two cores with GOMAXPROCS=2, mirroring this runner, the package still
      # finishes in 120.3s. It is simply slower here -- a hosted runner's cores
      # and its Postgres round-trips.
      #
      # What actually happened is that the budget was a coin flip. Two runs of
      # IDENTICAL code, four minutes apart:
      #
      #   run 31206771705   290s
      #   run 31210413414   310s
      #
      # ~7% run-to-run variance against a 300s budget the package was already
      # consuming ~295s of. There was under 10s of headroom, so it was going to
      # go red on SOME run no matter what anyone committed -- and when it did,
      # the panic named whichever 1-second test held the clock, which reads as a
      # flake in an unrelated test rather than as a budget. The author blamed is
      # never the cause, because there is no cause to find.
      #
      # So the fix is the lane's SHAPE, which is what memql#3257 asked for
      # second and is the half that generalises:
      #
      #   1. SPLIT THE STEP. component/memql gets its own budget, named as its
      #      own. The other five need seconds, so they get a tight one -- a hang
      #      in any of them now surfaces in ~2 minutes instead of taking the
      #      slow package's 10. Previously one number covered all six, sized for
      #      the worst, which made the other five's timeout meaningless.
      #
      #   2. REPORT HEADROOM. "How much room is left" required a bisect against
      #      a live database to answer; memql#3257 called that out as its own
      #      problem, and it was the reason nobody saw the cliff coming. Each
      #      step now prints elapsed against budget, so the answer is in the log
      #      of every run.
      #
      #   3. WARN BEFORE THE CLIFF, don't just fail at it. Crossing
      #      DB_HEADROOM_WARN_PCT annotates the run. A warning is deliberate
      #      rather than a failure: a slow runner is not a broken PR, and
      #      failing on it would hand the next author exactly the unearned blame
      #      this comment exists to explain. It is the advance notice that was
      #      missing.
      #
      # Do NOT raise a budget in response to a warning. The warning means the
      # package is growing into its budget, and the answer is to split the
      # package by concern -- the way memql#4075 split engine-MUTATING tests
      # (private boot) from engine-BORROWING ones (one shared engine) when a
      # full engine boot per db-gated test, the cost driver of both breaches
      # recorded here, had eaten this budget twice.
      #
      # THE 600s BUDGET WAS BREACHED, NOT WARNED ABOUT (memql#4075). On
      # 2026-08-17 a green run on main printed `used 628s of its 600s budget`
      # -- step time including compile, i.e. the test binary finishing at
      # ~595-599s of exactly 600 -- and the next PR (#4074, touching no Go this
      # lane compiles) drew two slow runners in a row and panicked at 10m both
      # times, each panic naming whichever 1-second test held the clock. That
      # is memql#3257's signature repeating at the doubled number: no headroom
      # means it goes red on SOME run no matter what anyone committed, and the
      # author blamed is never the cause. So 600 -> 900 is the recorded BRIDGE,
      # not a burial of the rule above: the warn machinery needs headroom to
      # exist before it can warn, and the split (memql#4075) remains the fix
      # for the cost itself.
      #
      # THE BRIDGE IS RETIRED: memql#4075 landed that split. 83 of the 103
      # per-test engine boots (~2.1s each, ~216s of identical boots) now
      # borrow ONE package-shared engine (sharedReadMergeEngine in
      # component/memql/executor_mutation_readmerge_db_test.go); only
      # engine-MUTATING tests still boot privately. Measured on the machine
      # and database that measured 504.7s before the split, the same
      # `go test -count=1 ./component/memql/...` runs in ~322s after it --
      # so the 600s budget below is RESTORED with real headroom, not
      # re-bridged.
      #
      # THE BRIDGE IS BACK, AND THE HEADROOM IT WAS RESTORED WITH IS SPENT
      # (2026-08-25). The package has grown from the ~322s that justified the
      # restore to 594.969s, and the two numbers that show it come from ONE
      # commit run twice: PR memql#4562 reported
      # `ok github.com/znasllc-io/memql/component/memql 594.969s` and passed;
      # the same tree on main reported 600.460s and panicked. Five seconds of
      # variance, on either side of the line. Nothing in that diff touches
      # this package -- it depends on the change only through two new scalar
      # fields on one generated proto message -- so the author blamed was not
      # the cause, which is memql#3257's signature for the third time.
      #
      # 600 -> 900 again, and again as a BRIDGE. The rule above stands: the
      # fix for the cost is to split by CONCERN, and that is memql#4569. This
      # buys the headroom the warn machinery needs to exist before it can
      # warn, which is the same reason the first bridge was taken.
      #
      # WHAT THE COST ACTUALLY IS, MEASURED (memql#4569). The issue asked for
      # the ~270s of new growth to be FOUND before a fourth bridge, and it has
      # been. Against the pinned CI database image, `go test -count=1 -v`:
      #
      #   1974 top-level tests                     268.3s
      #     119 tests at >= 1.0s                   215.4s   (80% of the package)
      #     102 of them in the 1-2s band           164.1s   (61% of the package)
      #     1745 tests at < 0.1s                    10.2s   ( 4% of the package)
      #
      #   BenchmarkDblessEngineInit                  1.428s/op
      #   LoadUnifiedConcepts alone                  0.025s/op
      #
      # So the 1-2s band IS one operation, once per test: the DB-LESS engine
      # boot -- LoadUnifiedConcepts + New(nil) + Init -- for a test that only
      # wants to ASK the engine something. It is not the tree parse (25ms), and
      # it is not any single slow test (the worst is 7.3s).
      #
      # THAT IS memql#4075's FINDING IN THE HALF IT DID NOT COVER. #4075 moved
      # the DB-GATED boots onto sharedReadMergeEngine; the db-less ones kept
      # booting privately, and there are now about a hundred of them. The same
      # remedy applies and is now in the tree: sharedDblessEngine
      # (component/memql/shared_dbless_engine_test.go), with
      # TestSharedDblessEngine_SharesOneBoot asserting the sharing as a COUNT
      # rather than as wall time -- a regression measured in duration only goes
      # red months later, which is this issue's own shape three times over.
      #
      # EIGHT HELPERS MIGRATED SO FAR, and the effect is measured rather than
      # projected: 268.3s -> 235.9s on the same machine and database, -12%.
      # The remaining ~90 sites are mechanical and are the rest of the saving;
      # they are per-test inline boots rather than shared helpers, which is why
      # they are a follow-on rather than one sweep.
      #
      # THE BRIDGE IS RETIRED (2026-08-31, memql#4569), AFTER THE SPLIT THAT
      # EARNED IT. This paragraph replaces one that argued for keeping it; both
      # readings are kept below because the second only makes sense against the
      # first.
      #
      # WHAT WAS TRIED AND WITHDRAWN. The retirement condition was "a CI run
      # reports the package comfortably under 600s". One did -- 472.018s -- and
      # 600 was restored on it. Every subsequent run of the same lane, on diffs
      # containing nothing but a comment, came in higher:
      #
      #   472.018s   482.423s   532.794s   539.025s      (before the split)
      #   range 67.0s; max/min 1.142
      #
      # 539.025s leaves 10.2% under 600, less than that spread, so the restore
      # was withdrawn. The error was not the number; it was reasoning from ONE
      # sample as though it were the mean, when it was the best case.
      #
      # WHAT CHANGED: THE SPLIT, NOT THE RUNNER. component/memql's fixture-
      # mounting test files booted one engine PER TEST over the same fixture --
      # eleven identical boots in one file. They now boot once per file, under a
      # parent test whose cleanup keeps the isolation the per-test mounts
      # provided. Local: 233.909s -> 191.454s, -18.2%, full suite green, no test
      # removed (25 became subtests keeping their own names).
      #
      # MEASURED ON CI, THREE TIMES, ON THE NEW TREE:
      #
      #   425.940s   (PR memql#4756)
      #   419.276s   (main, post-merge)
      #   420.878s   (PR memql#4757 -- the first run under this 600s ceiling)
      #
      # range 6.7s, 1.6% -- against 14.2% before the split. The spread did not
      # merely shift down, it COLLAPSED, which is itself evidence about where
      # the variance was coming from: the per-test engine boots. Fewer boots,
      # less to vary.
      #
      # THE DECISION RULE, stated so it can be checked rather than trusted.
      # Three tight samples still do not bound a distribution -- that is the
      # lesson above, and 1.6% over three runs is exactly what 472/482 looked
      # like before 539 arrived. So the bound does NOT come from these samples.
      # It comes from the OLD regime's worst observed spread (max/min 1.142)
      # applied to the NEW regime's minimum, i.e. assuming every sample so far
      # sits at the bottom of the range:
      #
      #   419.276s x 1.142 = 478.8s worst case, 20.2% under 600
      #
      # And for 600 to be breached at all, the package would have to reach
      # 419.276 x 1.431 -- a 43% swing, where the largest ever seen on this lane
      # is 14.2%. That is three times the worst spread on record, which is the
      # margin the previous restore did not have (it needed only 10%).
      #
      # IF THIS WARNS AGAIN, SPLIT BY CONCERN AGAIN -- never raise it, never
      # partition by -run. The next candidates, measured, with the reason each
      # was left alone this time:
      #
      #   14.2s / 10 tests  lint_parity_test.go        -- each test builds a
      #                                                   DIFFERENT fstest.MapFS
      #                                                   root; the boot IS the
      #                                                   thing under test
      #   14.5s /  6 tests  staged_write_test.go
      #   10.4s /  4 tests  build_offline_sense_test.go -- as lint_parity
      #   10.3s /  3 tests  contract_gates_3629_test.go -- feeds Init a
      #                                                   deliberately violating
      #                                                   bundle
      #
      # And the shape that worked, for whoever needs it next: a file whose tests
      # all mount the SAME fixture can share one engine, but ONLY under a parent
      # test. A package-level sync.Once cannot be used -- those mounts restore
      # the process-wide concept registry through t.Cleanup, and other tests here
      # walk memorynodes.All() (rowauthz_pii_unbound_test.go,
      # rowauthz_shadow_test.go). Leaving a fixture concept in front of them is a
      # correctness bug, not a slow test.
      #
      # -run SHARDING WAS CONSIDERED FOR THIS STEP AND REJECTED. Partitioning
      # one package's tests across several `go test -run <pattern>` blocks
      # would hand each shard its own budget, but the partition is maintained
      # by nothing: a test function matching NO shard's pattern does not fail
      # -- it silently never runs, forever, while every shard stays green.
      # That fail-open is a shape this repo keeps getting bitten by (the
      # `./...` selector that never compiled the engine, memql#4032; the
      # wrapper-script rule in the next paragraph, which exists because a
      # refactor quietly disarmed this very lane's gate). The shared engine
      # removes the boot-per-test growth driver without minting that
      # landmine; if this budget tightens again, split by CONCERN again --
      # never by -run partition.
      #
      # Kept as two PLAIN `go test` blocks on purpose. scripts/cidb/dbgate_test.go
      # derives this lane's selector by parsing literal `./`-prefixed arguments
      # out of these `run:` blocks, and treats a block containing a shell control
      # keyword (`if`, `for`, `exit`, `cd`, `source`, ...) as non-plain. Moving
      # the invocation behind a wrapper script empties its derived package list
      # and silently disarms the gate -- confirmed while writing this: a
      # `bash scripts/...` form reds dbgate_test.go with "no `go test` step, so
      # the env key it sets guards nothing". Keep `go test` and its patterns
      # literal and inline. scripts/ci/db-gated-packages.sh carries the same
      # warning for the same reason.
      #
      # The `start=$SECONDS` / trailing `echo` pair is the headroom report, and
      # is deliberately the most that fits: capturing the status to also print on
      # FAILURE needs `|| status=$?` plus `exit "$status"`, and `exit` is one of
      # the control keywords above. On a timeout the step NAME already carries
      # the attribution that was missing, so the loss is small.
      #
      # THE REPORT COMPARED TWO DIFFERENT THINGS, WHICH IS WHY IT NEVER
      # WARNED (2026-08-25). `$SECONDS` is STEP wall time -- compile plus test
      # -- and the budget bounds the TEST ONLY, so the line read
      # `used 642s of its 600s budget` on a run that PASSED with 594.969s of
      # test. A report that is over budget on every green run is a report
      # nobody can act on, and it printed exactly that through both recorded
      # breaches (memql#4075 quotes `used 628s of its 600s budget` from one).
      #
      # It states what it measures now, and points at the number the budget is
      # actually about -- go test's own per-package line. It is also a
      # `::notice::`, so it lands in the run SUMMARY rather than only in a log
      # that gets opened after something is already red. Still no conditional:
      # `if` is one of the control keywords that would disarm this lane's gate.
      - name: db-gated -- component/memql (own budget, the slow one)
        run: |
          start=$SECONDS
          go test -count=1 -timeout=600s ./component/memql/...
          echo "::notice::component/memql step wall time (compile + test): $((SECONDS - start))s. The 600s budget bounds the TEST ONLY -- read that off the 'ok github.com/znasllc-io/memql/component/memql <N>s' line in this step's log. After the per-file engine split (memql#4756) CI measured 425.940s, 419.276s and 420.878s -- a 1.6% spread, against 472-539s and 14.2% before it; the 900s bridge was retired on that (memql#4569). If this warns, SPLIT BY CONCERN -- the measured candidates and the working pattern are in the comment above. Never raise it, and never partition by -run."
      # Named for the budget, not the count (memql#3985). It was "the fast
      # five", and then TWO packages joined within a day of each other --
      # integrations/embedding (memql#4037) and component/backup, when its
      # export path got its first db-gated coverage. Neither author was wrong
      # to leave the label; it just quietly became a number that was still
      # being read as authoritative, in both the step name and its own echo.
      # So the name states what the step actually asserts -- the 180s budget --
      # which holds with room to spare: component/backup runs in ~0.5s,
      # migrations included.
      - name: db-gated -- the fast packages (tight budget)
        run: |
          start=$SECONDS
          go test -count=1 -timeout=180s ./component/automations/... ./component/backup/... ./component/grpc/... ./component/identity/... ./component/logstore/... ./component/sitetraffic/... ./examples/referencepack/... ./integrations/embedding/... ./integrations/planner/... ./integrations/shopify/... ./integrations/work/...
          echo "headroom: the fast packages used $((SECONDS - start))s of their 180s budget"

      # SPLIT OUT RATHER THAN ADMITTED (epic memql#4885). component/packages
      # joined the fast lane when this epic gave it its first db-gated
      # coverage, and the first CI run said what a local run had not: the
      # package takes 152s on its own and the eleven-package step took 258s of
      # a 180s budget. Two things were wrong with leaving it there, and only
      # the second one is loud. The step's whole claim -- the one its name and
      # its own echo assert -- had quietly become false. And 152s against the
      # 180s per-BINARY timeout it shared is 84% of it, so a slower runner does
      # not print a warning, it fails the lane, and it fails it for a package
      # that was merely sharing a room.
      #
      # The fix the step above prescribes for its sibling is the one taken
      # here: split by concern, never raise the number. The fast lane keeps its
      # 180s and gets its claim back; this one gets a budget with real headroom
      # over what was measured. If THIS warns, split it -- the credential
      # story's db cases and the pipeline's are separable -- rather than
      # raising 300.
      - name: db-gated -- packages (the deploy pipeline)
        run: |
          start=$SECONDS
          go test -count=1 -timeout=300s ./component/packages/...
          echo "headroom: component/packages used $((SECONDS - start))s of its 300s budget (152s when this step was split out)"

  # VS Code extension lane: run every cmd/memql-lsp drift guard over the
  # checked-in editors/vscode assets, then build the offline LSP binary
  # (darwin-arm64, the standardized dev target), compile the TypeScript client,
  # and package the VSIX. go-checks also runs these tests via `go test ./...`,
  # but it gates on the `go` bucket, so an editors/vscode-only PR skips it and
  # this lane is the only coverage those guards get. Gates on the vscode bucket
  # (editors/vscode, cmd/memql-lsp, scripts/vscode); push + merge_group run it.
  # THE PROVING SUITE (epic memql#4993), in the slot the harness eval gate left
  # when epic A1 deleted it -- with one difference that made it a JOB rather
  # than a step in go-checks: the harness eval ran with NO Postgres, and this
  # cannot. The epic is explicit that the only real infrastructure is Postgres
  # with TimescaleDB, "because a speed claim must include it", and a benchmark
  # that measured the platform without its database would be measuring a
  # different product.
  #
  # WHAT BLOCKS AND WHAT MERELY REPORTS (design P2). A scenario that stops
  # passing, a replay that reaches a provider, a duplicated side effect, a
  # failed governance property, or a NEGATIVE CONTROL THAT READ ZERO all fail
  # this lane. Cost and speed movements are computed, printed and never red:
  # they are noisy on a shared runner, the first fix anybody reaches for is
  # widening the threshold until it means nothing, and the structural half
  # dies with it.
  #
  # The envelope is piped through `jq` on purpose. cmd/memql-bench claims to be
  # under the capability-script contract and no shell-side conformance test can
  # see a Go binary -- scripts/lib/capability_contract_test.go walks
  # scripts/**/*.sh -- so this step is half of what stands behind that claim.
  # The other half is component/proving/capability's drift gate, which reads
  # the printf formats out of scripts/lib/capability.sh at test time.
  proving:
    name: proving
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.proving == 'true' }}
    runs-on: ubuntu-latest
    services:
      # The same pinned mirror the conformance and db-tests lanes use, for the
      # reason recorded there: an unauthenticated Hub pull happens at job setup
      # before any step runs, and a blip evicts the merge-queue candidate.
      postgres:
        image: ghcr.io/znasllc-io/ci-timescaledb@sha256:d8336a5c9cc49bdbf1e935234e8c87ab64b6d6d195fd2ecedff7b00185557631
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: memql
          POSTGRES_PASSWORD: memql_dev
          POSTGRES_DB: memql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MEMQL_DATABASE_DSN: postgres://memql:memql_dev@localhost:5432/memql?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      - name: create required Postgres extensions
        run: |
          for i in $(seq 1 30); do
            PGPASSWORD=memql_dev pg_isready -h localhost -U memql && break
            echo "waiting for postgres ($i)"; sleep 2
          done
          PGPASSWORD=memql_dev psql -h localhost -U memql -d memql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL
      - name: memql-bench --print-spec (the capability descriptor parses, on one line)
        run: |
          go run ./cmd/memql-bench --print-spec > /tmp/proving-spec.json
          test "$(wc -l < /tmp/proving-spec.json)" -eq 1 || { echo "::error::--print-spec wrote more than one line"; exit 1; }
          jq -e '.capability == "bench.run" and (.params | length) > 0' /tmp/proving-spec.json > /dev/null
      - name: proving gate (structural properties block; cost and speed report)
        run: |
          go run ./cmd/memql-bench --do=gate --runner=ubuntu-latest > /tmp/proving-envelope.json 2> /tmp/proving-gate.txt
          status=$?
          cat /tmp/proving-gate.txt
          # EXACTLY ONE LINE ON STDOUT, asserted rather than assumed. The
          # contract says one envelope, and `jq -e` alone does not check it:
          # given several JSON lines it evaluates each and exits on the LAST,
          # so a run whose stdout was polluted by log records still passes
          # while a caller reading one line gets a log record. That is what
          # happened here before the binary took os.Stdout out of the
          # engine's reach.
          lines=$(wc -l < /tmp/proving-envelope.json)
          test "$lines" -eq 1 || { echo "::error::stdout carried $lines lines; the capability contract is exactly one envelope"; cat /tmp/proving-envelope.json; exit 1; }
          jq -e '.ok == true' /tmp/proving-envelope.json > /dev/null
          exit $status
      - name: the generated page is not stale against the committed scorecard
        run: go run ./cmd/memql-bench --do=scorecard --check | jq -e '.ok == true' > /dev/null
      - name: publish the gate's report
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Proving gate'
            echo '```'
            cat /tmp/proving-gate.txt 2>/dev/null || echo '(the gate did not run)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vscode-extension:
    name: vscode-extension
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.vscode == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      # Every drift guard over a checked-in editors/vscode asset lives under
      # cmd/memql-lsp (grammar, language configuration, extension manifest).
      # Run the whole tree, not just the grammar package: an editors/vscode-only
      # PR -- the shape every dependabot bump takes -- path-skips `go-checks`,
      # so this lane is the ONLY place those guards get to fire (memql#2792).
      # scripts/dev/vscode_lane_scope_test.go fails if this narrows again.
      - name: editors/vscode drift checks (grammar, language config, manifest)
        run: go test -count=1 ./cmd/memql-lsp/...
      # `vscode-test` depends on `vscode-deps` in the Makefile so it stays
      # self-sufficient from a clean checkout. A standalone retry-wrapped
      # "build deps" step here would run the same npm installs a SECOND time,
      # unretried, as vscode-test's own prerequisite -- defeating the retry.
      # Wrap the single remaining invocation instead so the one place the
      # flaky-registry calls actually happen is retried.
      - name: extension unit tests
        run: scripts/ci/retry.sh -- make vscode-test
      # DELIBERATELY NOT PASSING --skip-deps, even though the step above has
      # already built the workspace deps (memql#3340). This step used to pass
      # ONLY because of that: package.sh built no `file:` dependency of its own,
      # so it compiled against the dist/ the previous step happened to leave on
      # disk. The lane was broken from a clean checkout -- `make vscode-install`
      # failed with 10 TypeScript errors for every developer -- and CI reported
      # it healthy for as long as these two steps stayed in this order.
      #
      # Running the full lane keeps CI exercising what a developer actually
      # runs. The duplicated dep build costs seconds (both are idempotent), and
      # buying an ordering-independent signal with them is the trade this
      # comment exists to defend against being "optimized" away.
      #
      # Retry-wrapped because it is a NETWORK step -- npm ci plus
      # `npx @vscode/vsce` -- which is retry.sh's documented use. It is not a
      # test, so the never-retry-a-test rule does not apply.
      - name: package extension (build binary + compile + vsce package)
        run: scripts/ci/retry.sh -- bash scripts/vscode/package.sh --out="$RUNNER_TEMP/memql.vsix"

  # VS Code EXTENSION DEVELOPMENT HOST smoke lane (memql#3302).
  #
  # Separate from `vscode-extension` because it is a different kind of test at a
  # different cost: it downloads a real VS Code and launches Electron under
  # xvfb, where that lane runs `node --test` over the modules that do not import
  # `vscode` and finishes in seconds. Folding them together would make the fast
  # lane slow and make an Electron startup problem look like a unit-test
  # failure.
  #
  # WHY IT EXISTS AT ALL. Both defects the B1 review caught passed every one of
  # the extension's automated tests and failed only against a real host: an
  # unguarded `WebSocket.OPEN` dereference on a runtime with no global
  # WebSocket, and a `createFileSystemWatcher` that silently never fired for a
  # path outside the workspace. Neither is a logic bug, so no amount of unit
  # testing reaches them. This lane asserts activation, manifest-to-registration
  # command drift, the activity-bar contributions, the host runtime's WebSocket
  # story, watching a path outside the workspace, and webview creation.
  #
  # THE MATRIX IS THE POINT, not thoroughness for its own sake. `1.91.0` is the
  # manifest's declared `engines.vscode` floor -- Node 20, no global WebSocket,
  # and a non-recursive watcher that never recovers from a missing base
  # directory. It is where this bug class actually fires, and it caught a third
  # instance of it on the lane's first run. `stable` is what users are on today.
  # A green floor with a red stable (or the reverse) is a real answer either
  # way, so fail-fast is off.
  #
  # NOT wrapped in scripts/ci/retry.sh: that script's own header says never to
  # retry a test, because a retried flake is an invisible flake. Only the npm
  # steps ahead of it -- the genuinely network-flaky part -- are retried.
  vscode-extension-host:
    name: vscode-extension-host
    timeout-minutes: 25
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.vscode == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.91.0', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
      # Electron needs a display and a handful of shared libraries the runner
      # image does not carry. libasound's package was renamed in Ubuntu 24.04
      # (the t64 time_t transition), so both spellings are attempted rather than
      # pinning the lane to one runner image generation.
      - name: install Electron's runtime dependencies
        run: |
          # BOUNDED AND RETRIED, both, because they cover different failures
          # (memql#4083's CI half). retry.sh retries a FAILED apt; it cannot
          # help a HUNG one, since a wedged mirror never exits -- and that is
          # what actually happened: this step's `apt-get update` (the one line
          # here that was neither bounded nor retried, beneath install lines
          # that were) hung for the job's whole 25-minute budget, twice in a
          # row, on the 1.91.0 leg while the stable leg's identical step took
          # seconds. `timeout` turns the hang into exit 124, which is exactly
          # the shape retry.sh exists to retry.
          scripts/ci/retry.sh -- timeout 120 sudo apt-get update
          scripts/ci/retry.sh -- timeout 300 sudo apt-get install -y xvfb libnss3 libgbm1 libxkbfile1 libsecret-1-0
          scripts/ci/retry.sh -- timeout 300 sudo apt-get install -y libasound2t64 \
            || scripts/ci/retry.sh -- timeout 300 sudo apt-get install -y libasound2
      - name: workspace dependencies (sdk/ts + sdk/ts-viewkit)
        run: scripts/ci/retry.sh -- make vscode-deps
      - name: extension dependencies
        run: scripts/ci/retry.sh -- npm ci --no-audit --no-fund --prefix editors/vscode
      # WITHOUT THIS BINARY THE LANE IS MEANINGLESS: activate() shows its
      # "memql-lsp not found" message and returns before registering a single
      # command, view, or watcher, so every case downstream of activation would
      # fail for a reason unrelated to what it tests. Staged under the
      # Node-named directory resolveServerPath() reads (process.platform /
      # process.arch), not Go's GOOS/GOARCH. The runner refuses to start if it
      # is missing, so this cannot silently degrade.
      - name: build and stage memql-lsp
        run: |
          mkdir -p editors/vscode/bin/linux-x64
          CGO_ENABLED=0 go build -o editors/vscode/bin/linux-x64/memql-lsp ./cmd/memql-lsp
      - name: host smoke lane (VS Code ${{ matrix.vscode }})
        env:
          MEMQL_VSCODE_VERSION: ${{ matrix.vscode }}
        run: bash scripts/vscode/host-test.sh --skip-deps

  # THE lane that makes the module boundary real (memql#3240, design D3).
  #
  # A `go.work` does NOT enforce the boundary. Under workspace mode a module
  # silently satisfies an import it does not `require`, so every other Go lane
  # in this file -- all of which run in workspace mode -- is blind to a
  # dependency-direction violation. Demonstrated on this tree by giving the
  # wire tier an upward import of component/safety (base):
  #
  #     $ go build ./...                 # workspace mode, as every other lane
  #     exit=0                           # <- the violation is INVISIBLE
  #
  #     $ GOWORK=off go build ./...
  #     violation_demo.go:7:8: no required module provides package
  #         github.com/znasllc-io/memql/component/safety
  #     exit=1
  #
  # So compiler enforcement requires GOWORK=off, per module. Without this lane
  # the boundary is real only on the day someone runs it by hand -- which is to
  # say it is a comment. It ships with the FIRST module rather than later, so
  # every tier that follows is verified as it lands instead of retro-fitted.
  #
  # Deliberately NOT path-filtered beyond `go`/`ci`: the whole point is that any
  # Go change can introduce an upward import, so narrowing this by directory
  # would let the violation it exists to catch skip the lane.
  module-boundaries:
    name: module-boundaries
    timeout-minutes: 15
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # component/identity/web embeds static/app.css by name; generate it.
      - uses: ./.github/actions/identity-css
      - name: go.work lists every module in the tree
        run: |
          set -euo pipefail
          # Keeps workspace mode and the GOWORK=off step below agreed about
          # what the tree is. A module absent from go.work is still verified by
          # the step below, but is outside the workspace that every OTHER lane,
          # gopls and `go test ./...` resolve against -- so the two modes check
          # different trees, silently. Assert the sets match rather than
          # trusting review to notice.
          on_disk="$(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sed 's|^\./||;s|^\.$|.|' | sort)"
          in_work="$(go work edit -json | python3 -c 'import json,sys; [print(u["DiskPath"].removeprefix("./")) for u in json.load(sys.stdin)["Use"]]' | sort)"
          if [ "$on_disk" != "$in_work" ]; then
            echo "go.work does not match the modules on disk."
            diff <(echo "$in_work") <(echo "$on_disk") || true
            exit 1
          fi
          echo "go.work covers all $(echo "$on_disk" | wc -l) modules"
      - name: every module builds and vets with GOWORK=off
        run: |
          set -euo pipefail
          status=0
          while read -r dir; do
            echo "::group::GOWORK=off $dir"
            if ! ( cd "$dir" && GOWORK=off go build ./... && GOWORK=off go vet ./... ); then
              echo "::error::$dir fails to build or vet with GOWORK=off -- it imports a package no module it requires provides (a dependency-direction violation). If the message above is 'updates to go.mod needed', it is instead a stale go.mod and the tidy step below prints the exact delta"
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sed 's|^\./||;s|^\.$|.|' | sort)
          exit "$status"
      # A nested module's go.mod is a function of its RELATIVE-PATH SIBLINGS,
      # not only of its own file (memql#3280). component/database carries
      #
      #     replace github.com/znasllc-io/memql/core => ../../core
      #
      # so bumping core/go.mod's indirect set changes what component/database's
      # own go.mod must say -- while touching none of its files. Dependabot has
      # no model of that edge: it resolves each module independently, applies
      # the bump correctly to core, and leaves the five modules that replace
      # core stale and untouched, so they look uninvolved in review.
      #
      # That is how `main` went red on 2026-08-07. PR #3269 bumped core; PR
      # #3273 created component/database. Each was green on its own branch --
      # #3269's base predates the module existing, #3273's base predates the
      # bump -- and NEITHER TREE EVER CONTAINED THE COMBINATION. A semantic
      # merge conflict: two individually-green PRs that are red together.
      #
      # No lane can catch that pre-merge, because the failing tree is not the
      # tree either PR tested. The structural fix is the merge queue
      # (`merge_group` is already a trigger in this file) or
      # `strict_required_status_checks_policy: true` on the `default` ruleset,
      # which currently sets it false -- both are repo settings, not workflow.
      # What this step buys is DIAGNOSIS: `go mod tidy -diff` prints the exact
      # go.mod/go.sum delta and exits non-zero WITHOUT writing, so the failure
      # names what is stale instead of the bare "updates to go.mod needed" that
      # reads like a dependency-direction violation and sent the first reader
      # of memql#3280 hunting a bad dependabot bump that was not the cause.
      #
      # It also strictly widens coverage. build+vet only needs the modules the
      # code actually imports, so a go.sum carrying superseded entries passes
      # them and fails tidy: component/harness was in exactly that state,
      # stale from the same core bump, and invisible to the step above.
      #
      # Runs AFTER build+vet so the module cache is warm, and on !cancelled()
      # so a build failure that is really a stale go.mod still gets its delta
      # printed rather than being masked by the step it explains.
      - name: every module's go.mod and go.sum are tidy
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          status=0
          while read -r dir; do
            echo "::group::go mod tidy -diff $dir"
            if ! out="$( cd "$dir" && GOWORK=off go mod tidy -diff 2>&1 )"; then
              echo "$out"
              echo "::error::$dir has a stale go.mod/go.sum -- run 'cd $dir && GOWORK=off go mod tidy'. If you did not touch this module, a sibling it replaces by relative path was bumped (see memql#3280)"
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path './.git/*' -printf '%h\n' | sed 's|^\./||;s|^\.$|.|' | sort)
          exit "$status"
      - name: every module is on the workspace's version set
        run: |
          set -euo pipefail
          # WHY THIS IS A GATE AND NOT A CONVENTION.
          #
          # `go mod tidy` in a nested module resolves external dependencies by
          # THAT MODULE's own minimal-version selection. A module needing only
          # grpc's basics picks an older grpc than the root does, and nothing
          # local notices: the workspace resolves the maximum across modules, so
          # every build and every test stays green over a tree whose go.mod
          # files disagree.
          #
          # What does notice is Dependabot, which reads each go.mod separately
          # and opens one PR per (module, dependency) to close each gap. That is
          # what produced a PR per module for grpc alone after memql#3241
          # (1.81.0-dev -> 1.82.1 across component/harness, component/node/gen
          # and the root) -- not Dependabot misbehaving, but correctly reporting
          # drift the split introduced.
          #
          # `go work sync` pushes the workspace's selected versions back into
          # every go.mod. A no-op means the tree is on one version set.
          go work sync
          if ! git diff --quiet; then
            echo "::error::modules have drifted off the workspace version set -- run 'go work sync' and commit the result"
            git diff --stat
            exit 1
          fi
          echo "all modules on one version set"
      - name: package count is preserved across the split
        run: |
          set -euo pipefail
          # `go list ./...` is NOT the right pattern once modules are nested --
          # from the root module it sees only the root module's packages and
          # silently undercounts. The module-path pattern spans the workspace.
          n="$(go list github.com/znasllc-io/memql/... | wc -l)"
          echo "packages (untagged, module-path pattern): $n"
          if [ "$n" -lt 181 ]; then
            echo "::error::package count fell to $n; a go.mod beneath the root can silently drop packages out of the pattern"
            exit 1
          fi

  # Aggregator -- the SINGLE required status check for branch protection.
  # It always runs (even when every lane is path-skipped) and fails only if
  # a lane it depends on actually failed or was cancelled; a `skipped` lane
  # is treated as a pass. Point the ruleset's required check at `ci-required`
  # ONLY, never at the individual jobs.
  # THE ONE LANE THAT RUNS A DIFFERENT BASH (macOS install portability).
  #
  # Every other job here runs on ubuntu-latest, where bash is 5.x. macOS ships
  # bash 3.2.57 as /bin/bash and always will -- bash 4 went GPLv3 -- and
  # scripts/lib/platform.sh lists darwin/arm64 as a SUPPORTED install target
  # with digest-pinned tools in scripts/install/tool-pins.env. So `local -n` (a
  # bash 4.3 nameref) shipped in scripts/install/seed-bootstrap.sh, broke 100%
  # of macOS installs, and every lane stayed green.
  #
  # THE IMAGE, NOT A macOS RUNNER. GitHub's macOS runners have no usable
  # Docker, so install-cluster-e2e.yml -- which DOES drive the real
  # seedBootstrap -- cannot run there at all. This is the same interpreter on
  # the runner we already pay for. Pinned by digest for the reason
  # scripts/k3d/up.sh's K3S_VERSION comment gives: pinning one side of a pair
  # and floating the other is how the pair drifts apart on the calendar.
  #
  # It complements rather than duplicates scripts/lib/bash_portability_test.go:
  # that scans for the constructs we know about, this runs the interpreter,
  # which is what catches the one nobody thought to add to a list.
  bash32-smoke:
    name: bash32-smoke
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.gates == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: capability scripts answer their meta paths under stock macOS bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w \
            bash@sha256:3a13e5da38baa575985778cd09ce8ac736d4b4dafc91a430e71271f6e5311b89 \
            ./scripts/ci/bash32-smoke.sh

  ci-required:
    name: ci-required
    timeout-minutes: 10
    if: ${{ always() }}
    needs:
      - changes
      - path-routing
      - go-checks
      - go-tests
      - build-node-tags
      - build-clustere2e
      - sdk-ts-typecheck
      - viewkit-checks
      - portal-checks
      - os-checks
      - conformance
      - db-tests
      - proving
      - vscode-extension
      - vscode-extension-host
      - module-boundaries
      - bash32-smoke
    runs-on: ubuntu-latest
    steps:
      - name: verify required lanes succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          # An empty result set is a fail-open, not a pass: it means the
          # aggregator waited on nothing, so EVERY lane is advisory at once
          # (memql#3019). The static guard for this lives in go-checks -- which
          # is itself one of the aggregated lanes, so emptying `needs` also
          # stops that guard gating. This is the independent backstop.
          if [ -z "$(echo "$RESULTS" | tr -d '[:space:]')" ]; then
            echo "ci-required: no lane results at all -- refusing to report success"
            exit 1
          fi
          status=0
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "FAIL: a required lane reported '$r'"; status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "ci-required: at least one lane did not pass"
            exit 1
          fi
          echo "OK: all required lanes succeeded or were path-skipped"
