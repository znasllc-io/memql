name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true
      - name: go build
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true
      - name: go test
        run: go test -count=1 -timeout=300s ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true
      - name: go vet
        run: go vet ./...

  sdk-gen-check:
    name: sdk-gen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true
      - name: regenerate typed SDK and check for drift
        run: make sdk-gen-check

  sdk-ts-typecheck:
    name: sdk-ts-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
      - name: install sdk/ts deps
        run: make sdk-ts-install
      - name: typecheck sdk/ts
        run: make sdk-ts-typecheck
      - name: test sdk/ts
        run: make sdk-ts-test

  # DSL-lint gate. Runs `memql-cockpit lint dsl/` once the cockpit
  # binary is available on the runner (it lives in a separate repo,
  # github.com/znasllc-io/memql-cockpit). The gate is wired here as
  # a placeholder so the workflow grows with the tooling rather
  # than getting added later as a one-off. Disabled by default
  # via the `if:` guard; flip the literal to `true` to enable.
  dsl-lint:
    name: dsl lint
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: install memql-cockpit
        run: |
          # TODO: install or build the cockpit binary on the runner.
          # When enabled, this should pin a known-good version.
          echo "memql-cockpit installation not yet automated"
          exit 1
      - name: lint dsl tree
        run: memql-cockpit lint dsl/
