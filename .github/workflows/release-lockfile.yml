name: release-lockfile

# deployment-v2 Phase 4 (znasllc-io/memql#702). A release lockfile
# (releases/<version>.yaml) pins all 8 components by @sha256: digest; it is the
# atomic unit of staging->prod promotion (digest copy, no rebuild). This gate
# keeps every lockfile honest: 8 components present, all digest-pinned, and the
# carrier + SPA coherent with the engine version (builtAgainstEngine ==
# engineVersion). An incoherent set fails here instead of shipping.

on:
  pull_request:
    branches: [main]
    paths:
      - 'releases/**'
      - 'scripts/release/**'
      - '.github/workflows/release-lockfile.yml'
  push:
    branches: [main]
    paths:
      - 'releases/**'
      - 'scripts/release/**'

permissions:
  contents: read

jobs:
  coherence:
    name: lockfiles are coherent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: coherence-check all release lockfiles
        run: bash scripts/release/coherence-check.sh --all
