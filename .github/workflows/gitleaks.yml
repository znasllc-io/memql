name: gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue (Tier 3, #858): run on the queue's merge candidate too,
  # so a required secret-scan check is reported for the batched tree.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

# Cancel a superseded gitleaks run when a new commit is pushed to the
# same PR; main pushes key off the commit SHA so they never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Installs the gitleaks binary directly from go install rather than using
# `gitleaks/gitleaks-action`, whose v2 release requires a paid license for
# any private repo in an org. The CLI is free everywhere; we use the same
# workflow shape across memql, memql-cockpit, and the product carrier repo for
# consistency.
#
# Two scan modes (Tier 0, #855):
#   - Pull requests run a FAST working-tree scan (`gitleaks dir .`) on a
#     shallow checkout -- it inspects the current file contents the PR
#     would merge, with no full-history clone or history walk.
#   - Pushes to main, the merge queue, and the weekly schedule run the heavy
#     FULL-HISTORY scan (`gitleaks git .`) on a fetch-depth:0 checkout, the
#     authoritative pass that also catches secrets added-then-removed
#     across commits.
#
# The full-history lane is pinned to the HEAD ancestry (memql#2996). A
# fetch-depth:0 checkout fetches EVERY branch, and `gitleaks git .` defaults to
# walking every ref it can reach -- not just the commit under test. So two
# synthetic test fixtures on one open, unmerged branch failed every merge
# candidate AND every push to main, whatever their own diffs contained. That
# wedged the queue repo-wide: six consecutive candidates across three unrelated
# PRs were evicted and main stayed red, none of them containing the branch at
# fault.
#
# Scoping the walk to HEAD keeps it a FULL-history walk -- every commit
# reachable from the candidate is still read, so added-then-removed secrets are
# still caught -- it just stops walking refs that are not the candidate.
# Measured when this landed: unscoped 2145 commits, scoped 2124, the delta being
# exactly the unmerged branch. Do not drop the flag on the run step below:
# without it one unmerged branch blocks every merge in the repo.
# `scripts/dev/gitleaks_scan_scope_test.go` enforces that it stays.

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      # PR lane: shallow checkout (default fetch-depth: 1) -- fast.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # main / merge queue / schedule lane: full history required for
      # `gitleaks git .`.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: install gitleaks
        # The GitHub org moved to gitleaks/gitleaks but the Go module path
        # is still the original zricethezav/gitleaks namespace.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: scan working tree (PR, fast incremental)
        if: github.event_name == 'pull_request'
        run: gitleaks dir . --no-banner
      - name: scan full history (main / merge queue / schedule)
        if: github.event_name != 'pull_request'
        # Scoped to the candidate's own ancestry -- see the header comment.
        # Without this, an unmerged branch fails every merge candidate.
        run: gitleaks git . --no-banner --log-opts="HEAD"
