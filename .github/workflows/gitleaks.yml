name: gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue (Tier 3, #858): run on the queue's merge candidate too,
  # so a required secret-scan check is reported for the batched tree.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

# Cancel a superseded gitleaks run when a new commit is pushed to the
# same PR; main pushes key off the commit SHA so they never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Installs the gitleaks binary directly from go install rather than using
# `gitleaks/gitleaks-action`, whose v2 release requires a paid license for
# any private repo in an org. The CLI is free everywhere; we use the same
# workflow shape across memql, memql-cockpit, and the product carrier repo for
# consistency.
#
# Two scan modes (Tier 0, #855):
#   - Pull requests run a FAST working-tree scan (`gitleaks dir .`) on a
#     shallow checkout -- it inspects the current file contents the PR
#     would merge, with no full-history clone or history walk.
#   - Pushes to main, the merge queue, and the weekly schedule run the heavy
#     FULL-HISTORY scan (`gitleaks git .`) on a fetch-depth:0 checkout, the
#     authoritative pass that also catches secrets added-then-removed
#     across commits.
#
# EDITING A FILE DOES NOT CLEAR A HISTORICAL FINDING (memql#3484). Read this
# before "fixing" a red push lane, because the obvious fix does not work and
# three separate people have already tried it.
#
# `gitleaks dir .` reads the WORKING TREE. `gitleaks git .` reads COMMITS.
# Renaming a fixture, or splitting a literal across a newline so the regex
# stops matching, makes the PR lane green and leaves the push lane red
# forever: the offending blob is still in the commit that introduced it, and
# history is immutable. That asymmetry means the PR lane actively TEACHES the
# wrong fix -- it goes green on a tree the push lane is red on, and the author
# reasonably concludes they are done. On memql#3484 that produced three
# rounds of it (integrations/email/status_test.go,
# docs/public/language/vscode-runtime-panel.md, and
# editors/vscode/test/addClusterState.test.ts) and eight live findings.
#
# The fix for a historical finding is an entry in `.gitleaks.toml` saying WHY
# the value is not a credential -- see that file's header for when to key the
# entry on the value (no `paths`) versus scope it to a path. Fix the fixture
# too if it deserves fixing, but do not expect that to turn the lane green.
#
# The full-history lane is pinned to the HEAD ancestry (memql#2996). A
# fetch-depth:0 checkout fetches EVERY branch, and `gitleaks git .` defaults to
# walking every ref it can reach -- not just the commit under test. So two
# synthetic test fixtures on one open, unmerged branch failed every merge
# candidate AND every push to main, whatever their own diffs contained. That
# wedged the queue repo-wide: six consecutive candidates across three unrelated
# PRs were evicted and main stayed red, none of them containing the branch at
# fault.
#
# Scoping the walk keeps it a FULL-history walk -- every commit reachable from
# the candidate is still read, so added-then-removed secrets are still caught --
# it just stops walking refs that are not the candidate.
#
# `--tags` is part of the scope, not decoration. The default gitleaks walk is
# `--all`, which covers refs/tags/* as well; scoping to HEAD alone would drop
# any tag that is not an ancestor of main and leave that history permanently
# unscanned. This repo has exactly one such tag today (v0.1.0, 6 commits).
# Counts on the commit that introduced this: HEAD 3690, HEAD --tags 3696,
# --all 3711 -- so `--tags` recovers those 6 while still excluding the 15
# commits that live only on unmerged branches, which is the whole point.
#
# The quoting is load-bearing: the value is two tokens, so an unquoted
# --log-opts=HEAD --tags would pass `--tags` to gitleaks itself rather than to
# git log. Do not weaken the flag on the run step below -- without it one
# unmerged branch blocks every merge in the repo, and a second --log-opts would
# silently win over the first (pflag takes the last occurrence).
#
# `scripts/dev/gitleaks_scan_scope_test.go` guards the mechanical parts: the
# scope value, a single invocation, fetch-depth: 0, and the event gate. It
# cannot police everything a workflow edit could do -- treat it as a tripwire,
# not a proof.

jobs:
  # The check-run name is `gitleaks`, not `scan` (memql#3210). govulncheck.yml
  # also declares `jobs.scan`, and the two share three triggers (push:main,
  # merge_group, schedule), so under the old `name: scan` both published a
  # check-run under one name -- indistinguishable in the checks UI, and
  # unaddressable as a ruleset required context. The job KEY stays `scan`
  # because nothing outside this file reads it; the published name is what had
  # to become unique. `scripts/dev/workflow_check_name_uniqueness_test.go`
  # holds the line for every workflow, not just these two.
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # PR lane: shallow checkout (default fetch-depth: 1) -- fast.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # main / merge queue / schedule lane: full history required for
      # `gitleaks git .`.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: install gitleaks
        # The GitHub org moved to gitleaks/gitleaks but the Go module path
        # is still the original zricethezav/gitleaks namespace.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: scan working tree (PR, fast incremental)
        # WORKING TREE ONLY. Green here does NOT mean the push lane below is
        # green -- see "EDITING A FILE DOES NOT CLEAR A HISTORICAL FINDING" in
        # the header comment.
        if: github.event_name == 'pull_request'
        run: gitleaks dir . --no-banner
      - name: scan full history (main / merge queue / schedule)
        if: github.event_name != 'pull_request'
        # Scoped to the candidate's ancestry plus tags -- see the header
        # comment. Without this, an unmerged branch fails every merge candidate.
        #
        # COMMITS, not files. A finding here is cleared by a `.gitleaks.toml`
        # entry, never by editing the file that introduced it (memql#3484).
        run: gitleaks git . --no-banner --log-opts="HEAD --tags"
