name: build-engine-images

# Build-speed C3 (epic znasllc-io/memql#1505, #1508). Builds + pushes the
# PRODUCT-AGNOSTIC ENGINE images to ACR `acrmemql` on a release cut, moving the
# build off the operator laptop onto native linux/amd64 CI.
#
# Platform consolidation (#2472 Step 2 / #2484): the engine now ships EVERY node
# type as a product-agnostic image -- identity, voice, mcp, and the mesh nodes
# bff / cognition / agent / planner / workbench. Product DSL is delivered at
# runtime via MEMQL_DSL_PATH (a bundle image's init-container -> shared volume),
# so these nodes no longer need to be carrier-built. A product's own repo builds
# only its tiny DSL-bundle image + its SPA.
#
# Auth: GitHub OIDC -> Azure (no long-lived secret). The federated credential
# subject is `repo:znasllc-io/memql:ref:refs/heads/main`, so this MUST run on
# main -- hence workflow_dispatch (which runs on the default branch).
#
# Triggering (#2519): dispatch-engine-images-on-release.yml re-dispatches this
# workflow automatically for every published release, so a cut release can no
# longer silently lack images. Manual dispatch remains for backfills and
# allow_overwrite re-pushes.
#
# Tag scheme: memql-<node>:<version>, release tags immutable (mirrors the
# downstream product pack's deploy build path). The lockfile-assembly step
# (C6, #1511) resolves each component's @sha256 digest from ACR by this tag, so
# this workflow only needs to push the tag (digests are also surfaced in the run
# summary for visibility).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, used as the image tag (e.g. 0.9.61)."
        required: true
        type: string
      allow_overwrite:
        description: "Re-push an existing tag (release tags are normally immutable)."
        required: false
        default: false
        type: boolean
      recreate_ghcr_package:
        description: "Delete the GHCR package first so it is recreated under the org's CURRENT default visibility. Deletes every version of it on GHCR; ACR is untouched."
        required: false
        default: false
        type: boolean

# Read-only at the top level (Scorecard Token-Permissions); the writes the
# build needs -- the OIDC token for azure/login and the GHCR push -- are
# granted on the one job below, never workflow-wide.
permissions:
  contents: read

env:
  ACR_NAME: acrmemql
  ACR_LOGIN_SERVER: acrmemql.azurecr.io
  # GHCR carries the SAME images under a public name, because a local install
  # has to be able to pull them (memql#3572). ACR is private and reachable only
  # by the deployment that owns it; an operator installing a local cluster has
  # no Azure credentials and no reason to acquire any. The alternative was
  # building all eight node types on their machine at install time.
  #
  # One build, two tags: the image is identical, so there is no second thing to
  # keep in step and no way for the two registries to disagree.
  GHCR_LOGIN_SERVER: ghcr.io/znasllc-io

jobs:
  build:
    name: build memql-${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token for azure/login
      contents: read # checkout
      packages: write # push the same images to GHCR (memql#3572)
    strategy:
      fail-fast: false
      matrix:
        # `portal` names the Dockerfile stage the runtime copies the memQL
        # Portal bundle from (memql#3314). The portal is site #1, served by
        # the edge (component/edge, memql#3711) -- component/portal, which
        # used to serve it from the bff, is retired. Every entry here takes
        # `portal-skip`, an empty directory, and never pulls the Node image,
        # EXCEPT `edge` below, which takes `portal-build` -- it is the only
        # node type that serves the bundle, so it is the only one that pays
        # for the Node stage that builds it (memql#3714). Set on every entry
        # rather than defaulted, because `FROM ${PORTAL_DIST_STAGE}` cannot
        # take an empty string and a missing matrix key renders as one.
        include:
          # identity: CGO-free; matches build_one (no --target -> the
          # Dockerfile's last stage). voice: CGO + the voice-runtime stage.
          - node: identity
            cgo: "0"
            target: ""
            portal: portal-skip
          - node: voice
            cgo: "1"
            target: voice-runtime
            portal: portal-skip
          # mcp: engine-built (no product DSL), CGO-free -- same shape as
          # identity. Remote MCP node (memql#1554); CI gap fixed in #1581.
          - node: mcp
            cgo: "0"
            target: ""
            portal: portal-skip
          # Platform consolidation (#2472 Step 2): every node type now ships as
          # a PRODUCT-AGNOSTIC engine image. Product DSL is delivered at runtime
          # via MEMQL_DSL_PATH (dsl.MountRuntimeDomainsFromEnv, #2484), so these
          # nodes no longer need to be carrier-built. CGO-free, default runtime
          # stage -- same shape as identity/mcp.
          #
          # bff no longer carries the portal bundle (memql#3711) -- the portal
          # is site #1, served by the edge at its own hostname, not a /portal/
          # sub-path of the bff.
          - node: bff
            cgo: "0"
            target: ""
            portal: portal-skip
          - node: cognition
            cgo: "0"
            target: ""
            portal: portal-skip
          - node: agent
            cgo: "0"
            target: ""
            portal: portal-skip
          - node: planner
            cgo: "0"
            target: ""
            portal: portal-skip
          - node: workbench
            cgo: "0"
            target: ""
            portal: portal-skip
          # edge: serves every hosted site, including the portal (site #1,
          # memql#3711) -- the only node type that takes portal-build, so
          # staging/prod carry the same bundle the local build path already
          # does (memql#3714).
          - node: edge
            cgo: "0"
            target: ""
            portal: portal-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immutability guard
        if: ${{ !inputs.allow_overwrite }}
        run: |
          img="memql-${{ matrix.node }}:${{ inputs.version }}"
          if az acr repository show --name "$ACR_NAME" --image "$img" >/dev/null 2>&1; then
            echo "::error::${img} already exists in ${ACR_NAME} -- release tags are immutable. Bump version or re-run with allow_overwrite=true." >&2
            exit 1
          fi

      # A package's visibility is fixed WHEN IT IS CREATED, and there is no API
      # to change it afterwards -- GitHub's packages REST surface covers list,
      # get, delete and restore, and nothing else (memql#3578). So when the
      # organization's default changes, the only way to move an existing package
      # onto it is to delete the package and let the next push recreate it.
      #
      # Gated on an input and off by default, because it destroys every version
      # of that package on GHCR. It is safe for a registry nothing consumes yet
      # and would not be later, which is exactly why it is a deliberate choice
      # rather than something this workflow does on its own. ACR is a separate
      # registry and is never touched by this step.
      - name: Recreate the GHCR package under the current default visibility
        if: ${{ inputs.recreate_ghcr_package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: memql-${{ matrix.node }}
        run: |
          if gh api "/orgs/${OWNER}/packages/container/${PKG}" >/dev/null 2>&1; then
            gh api --method DELETE "/orgs/${OWNER}/packages/container/${PKG}"
            echo "deleted GHCR package ${PKG}; the push below recreates it"
          else
            echo "no GHCR package ${PKG} yet -- nothing to recreate"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      - name: Build + push memql-${{ matrix.node }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          target: ${{ matrix.target }}
          # MEMQL_RELEASE is the release this image IS, linked into the binary
          # so the node can state it on ServerHello.engine_version and
          # memqlVersion() (memql#3998). It is the SAME value as the image tag
          # and the OCI version label below: this workflow is the one place that
          # knows the release, and it now tells the binary as well as the
          # registry. Before this, a released node reported a build stamp
          # derived from a checked-in file that had been stale since v0.16.1,
          # so no installed cluster could say which release it was running.
          build-args: |
            BUILD_TAGS=${{ matrix.node }}
            CGO_ENABLED=${{ matrix.cgo }}
            PORTAL_DIST_STAGE=${{ matrix.portal }}
            MEMQL_RELEASE=${{ inputs.version }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/memql-${{ matrix.node }}:${{ inputs.version }}
            ${{ env.GHCR_LOGIN_SERVER }}/memql-${{ matrix.node }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/znasllc-io/memql
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=memql-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=memql-${{ matrix.node }}

      - name: Digest summary
        run: |
          {
            echo "### memql-${{ matrix.node }}:${{ inputs.version }}"
            echo '```'
            echo "${ACR_LOGIN_SERVER}/memql-${{ matrix.node }}@${{ steps.build.outputs.digest }}"
            echo "${GHCR_LOGIN_SERVER}/memql-${{ matrix.node }}:${{ inputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
