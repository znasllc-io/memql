name: build-engine-images

# Build-speed C3 (epic znasllc-io/memql#1505, #1508). Builds + pushes the
# PRODUCT-AGNOSTIC ENGINE images to ACR `acrmemql` on a release cut, moving the
# build off the operator laptop onto native linux/amd64 CI.
#
# Platform consolidation (#2472 Step 2 / #2484): the engine now ships EVERY node
# type as a product-agnostic image -- identity, voice, mcp, and the mesh nodes
# bff / cognition / agent / planner / workbench. Product DSL is delivered at
# runtime via MEMQL_DSL_PATH (a bundle image's init-container -> shared volume),
# so these nodes no longer need to be carrier-built. A product's own repo builds
# only its tiny DSL-bundle image + its SPA.
#
# Auth: GitHub OIDC -> Azure (no long-lived secret). The federated credential
# subject is `repo:znasllc-io/memql:ref:refs/heads/main`, so this MUST run on
# main -- hence workflow_dispatch (which runs on the default branch).
#
# Triggering (#2519): dispatch-engine-images-on-release.yml re-dispatches this
# workflow automatically for every published release, so a cut release can no
# longer silently lack images. Manual dispatch remains for backfills and
# allow_overwrite re-pushes.
#
# Tag scheme: memql-<node>:<version>, release tags immutable (mirrors the
# downstream product pack's deploy build path). The lockfile-assembly step
# (C6, #1511) resolves each component's @sha256 digest from ACR by this tag, so
# this workflow only needs to push the tag (digests are also surfaced in the run
# summary for visibility).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, used as the image tag (e.g. 0.9.61)."
        required: true
        type: string
      allow_overwrite:
        description: "Re-push an existing tag (release tags are normally immutable)."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write # mint the OIDC token for azure/login
  contents: read

env:
  ACR_NAME: acrmemql
  ACR_LOGIN_SERVER: acrmemql.azurecr.io

jobs:
  build:
    name: build memql-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # identity: CGO-free; matches build_one (no --target -> the
          # Dockerfile's last stage). voice: CGO + the voice-runtime stage.
          - node: identity
            cgo: "0"
            target: ""
          - node: voice
            cgo: "1"
            target: voice-runtime
          # mcp: engine-built (no product DSL), CGO-free -- same shape as
          # identity. Remote MCP node (memql#1554); CI gap fixed in #1581.
          - node: mcp
            cgo: "0"
            target: ""
          # Platform consolidation (#2472 Step 2): every node type now ships as
          # a PRODUCT-AGNOSTIC engine image. Product DSL is delivered at runtime
          # via MEMQL_DSL_PATH (dsl.MountRuntimeDomainsFromEnv, #2484), so these
          # nodes no longer need to be carrier-built. CGO-free, default runtime
          # stage -- same shape as identity/mcp.
          - node: bff
            cgo: "0"
            target: ""
          - node: cognition
            cgo: "0"
            target: ""
          - node: agent
            cgo: "0"
            target: ""
          - node: planner
            cgo: "0"
            target: ""
          - node: workbench
            cgo: "0"
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Immutability guard
        if: ${{ !inputs.allow_overwrite }}
        run: |
          img="memql-${{ matrix.node }}:${{ inputs.version }}"
          if az acr repository show --name "$ACR_NAME" --image "$img" >/dev/null 2>&1; then
            echo "::error::${img} already exists in ${ACR_NAME} -- release tags are immutable. Bump version or re-run with allow_overwrite=true." >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      - name: Build + push memql-${{ matrix.node }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          target: ${{ matrix.target }}
          build-args: |
            BUILD_TAGS=${{ matrix.node }}
            CGO_ENABLED=${{ matrix.cgo }}
          tags: ${{ env.ACR_LOGIN_SERVER }}/memql-${{ matrix.node }}:${{ inputs.version }}
          cache-from: type=gha,scope=memql-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=memql-${{ matrix.node }}

      - name: Digest summary
        run: |
          {
            echo "### memql-${{ matrix.node }}:${{ inputs.version }}"
            echo '```'
            echo "${ACR_LOGIN_SERVER}/memql-${{ matrix.node }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
