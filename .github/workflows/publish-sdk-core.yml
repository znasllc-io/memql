name: publish-sdk-core

# Publishes @znasllc-io/memql-sdk-core (sdk/ts) to GitHub Packages.
# Trigger by pushing a tag like `memql-sdk-core-v0.1.0`, or run
# manually via workflow_dispatch. Bump sdk/ts/package.json "version"
# before tagging -- npm refuses to republish an existing version.
on:
  push:
    tags:
      - 'memql-sdk-core-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@znasllc-io'
      - name: install deps
        run: npm install --no-audit --no-fund
      - name: build
        run: npm run build
      - name: publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
