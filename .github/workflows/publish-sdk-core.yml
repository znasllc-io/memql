name: publish-sdk-core

# Publishes @znasllc-io/memql-sdk-core (sdk/ts) to GitHub Packages.
# Trigger by pushing a tag like `memql-sdk-core-v0.1.0`, or run
# manually via workflow_dispatch. Bump sdk/ts/package.json "version"
# before tagging -- npm refuses to republish an existing version.
on:
  push:
    tags:
      - 'memql-sdk-core-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@znasllc-io'
      # `npm ci`, not `npm install`: this lane produces a PUBLISHED artifact, so
      # it is the one place the integrity-pinned, lockfile-exact install matters
      # most. sdk/ts commits its package-lock.json as of memql#3344.
      - name: install deps
        run: npm ci --no-audit --no-fund
      - name: build
        run: npm run build
      - name: publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
