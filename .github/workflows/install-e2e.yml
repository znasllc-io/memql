name: install-e2e

# The install/uninstall ROUND TRIP on a clean machine.
#
# The install receipt is a promise: everything the installer put on this
# machine can be taken back. "The uninstall looked clean" is an opinion, so
# this workflow holds the promise to account the only way it can be held --
# fingerprint the machine, install, uninstall, fingerprint again, DIFF. A
# difference is a receipt that lied.
#
# ============================ WHAT THIS PROVES ============================
#
#   * The graph reader, the runner and the executor drive the REAL capability
#     scripts end to end, not a mock of them.
#   * install.binary places the three pinned tools, and remove-artifact.sh
#     takes them back, leaving ~/.memql with no files in it.
#   * hosts-entries.sh writes its marked block into the REAL /etc/hosts and
#     remove-artifact.sh removes exactly that block, leaving the file
#     byte-identical -- every other line in a shared system file untouched.
#   * install.cloneStack checks the stack out at a TAG and the removal takes
#     the checkout back.
#   * The receipt survives the round trip and is what the uninstall reads its
#     --path and --pre-existing from. It is uploaded as an artifact so a
#     failure can be read afterwards.
#   * THE INSTALL SPENDS NO AI CREDIT AND CONTACTS NO AI VENDOR (epic
#     memql#4440, widened by epic memql#5088). `round-trip` runs the whole
#     graph and asserts TWO things a unit test cannot: that the install
#     changes the machine and reverses cleanly, and that the
#     `providerFederation` gate was SKIPPED -- satisfied -- while every step
#     behind it still ran.
#
#     THERE USED TO BE THREE JOBS HERE, AND THE OTHER TWO ARE DELETED. They
#     were `round-trip` (an install with `--provider-key-file`, verified
#     against a local stub answering 200) and `refused-key` (the same with a
#     stub answering 401, asserting the machine was left untouched). Both are
#     unreachable: there is no vendor API key in the product, the CLI declares
#     no flag that could carry one, and `verify-provider-key.sh` no longer
#     takes a key or a base URL -- it execs `provider-auth check` INSIDE a pod,
#     because workload identity federation's credential is a projected token
#     and the pod is the only thing that holds it. A stub on 127.0.0.1 has
#     nothing to answer.
#
#     WHAT THE DELETION COSTS, said rather than implied. `refused-key` was the
#     only lane that watched the EXECUTOR honour a failed step's dependency
#     edges in a live run -- installGraph.test.ts asserts the document declares
#     them, which is a different claim. The nearest surviving cover is
#     installExecutor.test.ts, whose skip-blocks-dependents and
#     satisfied-skip-does-not cases exercise the same code with a fake runner.
#     That is genuinely weaker, and it is the honest position: rebuilding the
#     negative case needs a step that can be made to fail EARLY (before
#     anything mutates) and on purpose, which the graph does not currently
#     offer. Reaching for a key to fail is what is no longer available.
#
# ========================== WHAT IT DOES NOT PROVE ========================
#
# Be honest about the gaps rather than let a green tick imply more than it is:
#
#   * THE CLUSTER LANE DOES NOT RUN HERE. clusterUp / seedBootstrap /
#     frontDoor / magicLink need a real k3d cluster reconciled by ArgoCD, which
#     this workflow does not build. So two of the four surfaces -- dockerImages
#     and k3dClusters -- are TRIVIALLY unchanged here: nothing that ran could
#     have touched them. They are still snapshotted and diffed, because a diff
#     that only exists when it is convenient proves nothing.
#
#     IT RUNS IN `.github/workflows/install-cluster-e2e.yml` (nightly, plus
#     pull requests touching scripts/install, scripts/k3d, deploy/k8s or the
#     installer). That lane executes the WHOLE graph against the published
#     GHCR images, so the two surfaces above carry real content on the way
#     through, and it adds a repair leg and an upgrade leg. It is a separate
#     workflow because it is a separate cost and a separate trigger; this one
#     stays cheap and runs on every install-script change. What that lane still
#     does not prove is written in its own header, at the same length as this.
#
#     THE SPLIT IS BY COST, NOT BY SCOPE. Do not "consolidate" a cluster
#     assertion into this file: the moment a job here needs a cluster, the lane
#     that gates every install-script edit stops being cheap enough to keep on
#     `pull_request`, and the first thing that happens after that is somebody
#     narrows its paths.
#   * THE FEDERATION GATE IS NEVER EXERCISED HERE, ONLY ITS SKIP. The
#     `providerFederation` step asks a running pod whether the cluster's
#     federated credential is accepted, and this lane builds no cluster -- so
#     there is nothing to ask. `installPlan` skips it satisfied, and what this
#     workflow proves is the SKIP: that it is marked satisfied, and that every
#     step declaring `dependsOn: [..., providerFederation]` still ran.
#
#     THE SKIP BEING SATISFIED IS THE WHOLE THING, and getting it wrong removes
#     the install. memql#3473 made the check a GATE: nothing touches the
#     machine until it passes, so an operator is never asked for a sudo
#     password and then told their credential is bad. An unsatisfied skip
#     therefore cascades through the entire graph and the run reports a tidy
#     list of skips having installed nothing -- and the round-trip diff below
#     would PASS, because a machine nothing touched reverses perfectly. That is
#     not hypothetical: it is exactly how the gate first failed this lane.
#
#     The check's own classification -- which conditions mean accepted, refused
#     or unreachable -- is tested in
#     scripts/install/verify_provider_key_test.go and is not re-proved here.
#     Note the step is `readOnly: true` and writes no receipt, so its skip
#     changes nothing about the artifact the uninstall reverses.
#   * THE TRUST STORE IS NOT EXERCISED. localCA is skipped: `mkcert -install`
#     writes a CA into the system trust store, which is a fifth surface this
#     snapshot does not describe, and a partial round trip there would be
#     worse than none.
#
#     AND THE SKIP COSTS MORE THAN THE TRUST STORE, which is the part that was
#     not written down and cost memql#4071. A `--skip` removes the step's
#     ARTIFACTS from this diff as well as its side effects, so nothing localCA
#     writes is created here and the round trip cannot fail on any of it. It
#     did not: `localCA` also issues the front-door pair into ~/.memql/certs --
#     inside the memqlHome surface, the one this lane checks most closely --
#     and its reversal removed the CA and left the certificate and PRIVATE KEY
#     behind. The uninstall reported OK on all seven steps.
#
#     The step is covered by install-cluster-e2e.yml, which cannot skip it
#     (clusterUp depends on it) and is where the leftover was finally seen. That
#     division of labour is now a gate rather than a habit:
#     TestEveryInstallStepIsExercisedByARoundTrip
#     (scripts/install/graph/round_trip_coverage_test.go) fails the build if a
#     receipt-writing step is skipped by EVERY round-trip lane. Adding a
#     `--skip=` here is fine; adding the same one there is not.
#   * THE SNAPSHOT IS NOT A WHOLE-FILESYSTEM DIFF. It describes four named
#     surfaces. Anything the installer touched outside them -- a kubeconfig,
#     apt state, $HOME outside ~/.memql -- is invisible to it.
#   * ONE PLATFORM. ubuntu-latest / linux-amd64 only; tool-pins.env pins
#     linux/amd64 artifacts.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/install/**"
      - "scripts/lib/capability.sh"
      - "editors/vscode/src/install/**"
      - ".github/workflows/install-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # THE ONLY PATH: no key, no vendor (epic memql#4440, epic memql#5088)
  # ==========================================================================
  #
  # It was `keyless-round-trip`, first of three, and the qualifier named a
  # contrast with two keyed jobs. Those are gone with the key itself, so the
  # contrast is gone and the name would name nothing: this is simply the
  # install. It reuses the deleted keyed job's key and check name rather than
  # inventing a third, so anything pinned to `round-trip` still resolves.
  #
  # WHAT MAKES THE VENDOR-SILENCE ASSERTION REAL, now that there is no closed
  # port to point at. It used to be that `providerKey.base-url` named
  # 127.0.0.1:8099 with nothing listening, so a regression that made the step
  # RUN would fail loudly instead of quietly calling Anthropic from CI. That
  # flag is gone -- `verify-provider-key.sh` declares no `--base-url` and does
  # not speak HTTP to a vendor at all; it execs `provider-auth check` inside a
  # Deployment, which this lane does not have.
  #
  # So the evidence is now the report itself: `providerFederation` is asserted
  # `skipped`, and `skipped` is a claim about a step that was never invoked.
  # A regression that made it run would report `failed` (no cluster to exec
  # into), which the assertion below names explicitly as the wrong answer.
  round-trip:
    name: install -> uninstall -> diff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Tag this checkout so the install has a real tag to pin
        id: tag
        run: |
          set -euo pipefail
          TAG="e2e-${GITHUB_SHA::12}"
          git -c user.email=ci@example.com -c user.name=ci tag -f "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A preinstalled tool changes what the receipt records, so the baseline
      # must describe the machine the install actually runs against.
      - name: Take preinstalled pinned tools out of the way
        run: |
          set -euo pipefail
          for tool in k3d kubectl mkcert; do
            if command -v "$tool" >/dev/null 2>&1; then
              found="$(command -v "$tool")"
              sudo mv "$found" "$RUNNER_TEMP/${tool}.preinstalled"
              echo "moved preinstalled $tool aside (was $found)"
            fi
          done

      - name: Build the install CLI
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build:install-cli

      # `Nothing is listening where a vendor would be` IS DELETED (epic
      # memql#5088). It curled 127.0.0.1:8099 and failed if anything answered,
      # which made the vendor-silence claim non-vacuous while the install
      # pinned `providerKey.base-url` at that port. Nothing points there any
      # more, so the check would have proved a property of an unused port.
      # See the job banner for what carries the claim instead.

      - name: Snapshot the machine BEFORE
        run: ./scripts/install/e2e-baseline.sh --mode=snapshot --out="$RUNNER_TEMP/before.txt"

      # NO AI CREDENTIAL, AND NO FLAG THAT COULD CARRY ONE (epic memql#5088).
      # `--provider-key-file`, `--provider` and
      # `--param=providerKey.base-url=...` were all passed here at some point
      # and none of them parses now: the CLI declares no such flag, and
      # `verify-provider-key.sh` declares neither a key nor a base URL. A
      # capability script exits 2 on an undeclared flag, so a re-added one is a
      # failed step rather than a silently ignored argument.
      - name: Install
        run: |
          set -euo pipefail
          sudo -E env "HOME=$HOME" "PATH=$PATH" \
            node editors/vscode/dist-install/cli.js install \
              --root="$GITHUB_WORKSPACE" \
              --receipt="$RUNNER_TEMP/install-receipt.json" \
              --repo="$GITHUB_WORKSPACE" \
              --tag="${{ steps.tag.outputs.tag }}" \
              --skip=localCA \
              --timeout=600 \
              --json > "$RUNNER_TEMP/report.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/install-receipt.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/report.json" 2>/dev/null || true

      - name: Show what the run reported
        if: always()
        run: cat "$RUNNER_TEMP/report.json" || true

      # THE SKIP, PINNED. `skipped` with the stated reason -- and crucially
      # NOT `failed`, which is what the step would report if it RAN: it execs
      # `provider-auth check` inside a Deployment, and this lane has no
      # cluster. So `failed` here means the skip regressed, not that a vendor
      # was unreachable.
      - name: providerFederation was SKIPPED, with a reason
        run: |
          set -euo pipefail
          status="$(jq -r '.outcomes[] | select(.id=="providerFederation") | .status' "$RUNNER_TEMP/report.json")"
          reason="$(jq -r '.outcomes[] | select(.id=="providerFederation") | .reason // ""' "$RUNNER_TEMP/report.json")"
          echo "providerFederation: status=$status reason=$reason"
          # A MISSING OUTCOME IS NOT A PASSING ONE. `jq` prints nothing for a
          # step the report does not carry, and an empty status would sail
          # through a naive comparison -- so the id is checked to be present
          # before its status is judged.
          [ -n "$status" ] && [ "$status" != "null" ] || {
            echo "ERROR: the report carries no providerFederation outcome at all. " \
                 "Either the step was renamed again or the graph no longer has it." >&2
            exit 1
          }
          [ "$status" = "skipped" ] || {
            echo "ERROR: providerFederation status is '$status', expected 'skipped'. " \
                 "'failed' means the step RAN -- which on a lane with no cluster is the " \
                 "regression this job exists to catch." >&2
            exit 1
          }
          case "$reason" in
            *"installing spends no AI credit"*) ;;
            *) echo "ERROR: the skip does not state why: '$reason'" >&2; exit 1 ;;
          esac
          # SATISFIED, asserted directly as well as through its consequence
          # below. The consequence check is the stronger test; this one names
          # the field, so a failure points at the line to fix rather than at
          # eight steps that did not run.
          satisfied="$(jq -r '.outcomes[] | select(.id=="providerFederation") | .satisfied' "$RUNNER_TEMP/report.json")"
          [ "$satisfied" = "true" ] || {
            echo "ERROR: the providerFederation skip is not marked satisfied (got '$satisfied'). " \
                 "Dependents block on an unsatisfied skip, so the whole install is about to be skipped." >&2
            exit 1
          }

      # THE CASCADE THAT MUST NOT HAPPEN. Every mutating step declares
      # dependsOn:[..., providerFederation], so a skip that did not mark itself
      # SATISFIED would skip the entire install -- and the round-trip diff
      # below would pass, because a machine nothing touched reverses
      # perfectly. This assertion is what stops that reading as success.
      - name: Every other step actually RAN
        run: |
          set -euo pipefail
          for id in detect dockerAccess toolK3d toolKubectl toolMkcert hostsBlock \
                    browserTrust stackCheckout; do
            status="$(jq -r --arg id "$id" '.outcomes[] | select(.id==$id) | .status' "$RUNNER_TEMP/report.json")"
            [ "$status" = "ok" ] || {
              echo "ERROR: $id is '$status'. The providerFederation skip cascaded " \
                   "through the dependency graph and the install did nothing." >&2
              exit 1
            }
          done
          echo "every mutating step ran"

      - name: The install actually changed the machine
        run: |
          set -euo pipefail
          if ./scripts/install/e2e-baseline.sh --mode=compare \
              --baseline="$RUNNER_TEMP/before.txt" --out="$RUNNER_TEMP/during.txt"; then
            echo "ERROR: the install left the machine identical" >&2
            exit 1
          fi
          echo "the install changed the machine, as it must"

      - name: Uninstall
        run: |
          set -euo pipefail
          sudo -E env "HOME=$HOME" "PATH=$PATH" \
            node editors/vscode/dist-install/cli.js uninstall \
              --root="$GITHUB_WORKSPACE" \
              --receipt="$RUNNER_TEMP/install-receipt.json" \
              --timeout=600

      - name: Snapshot the machine AFTER, and diff
        run: |
          ./scripts/install/e2e-baseline.sh --mode=compare \
            --baseline="$RUNNER_TEMP/before.txt" --out="$RUNNER_TEMP/after.txt"

      - name: Upload the receipt and the snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-e2e-evidence
          path: |
            ${{ runner.temp }}/before.txt
            ${{ runner.temp }}/during.txt
            ${{ runner.temp }}/after.txt
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/install-receipt.json
          if-no-files-found: warn
