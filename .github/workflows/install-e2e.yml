name: install-e2e

# The install/uninstall ROUND TRIP on a clean machine.
#
# The install receipt is a promise: everything the installer put on this
# machine can be taken back. "The uninstall looked clean" is an opinion, so
# this workflow holds the promise to account the only way it can be held --
# fingerprint the machine, install, uninstall, fingerprint again, DIFF. A
# difference is a receipt that lied.
#
# ============================ WHAT THIS PROVES ============================
#
#   * The graph reader, the runner and the executor drive the REAL capability
#     scripts end to end, not a mock of them.
#   * install.binary places the three pinned tools, and remove-artifact.sh
#     takes them back, leaving ~/.memql with no files in it.
#   * hosts-entries.sh writes its marked block into the REAL /etc/hosts and
#     remove-artifact.sh removes exactly that block, leaving the file
#     byte-identical -- every other line in a shared system file untouched.
#   * install.cloneStack checks the stack out at a TAG and the removal takes
#     the checkout back.
#   * The receipt survives the round trip and is what the uninstall reads its
#     --path and --pre-existing from. It is uploaded as an artifact so a
#     failure can be read afterwards.
#   * THE PROVIDER-KEY GATE HOLDS IN BOTH DIRECTIONS (memql#3473, #3507). The
#     round-trip job proves a good key lets everything downstream proceed; the
#     `refused-key` job proves a REFUSED one leaves all four surfaces
#     untouched. The second is the half the gate exists for -- an operator is
#     never asked for a sudo password and then told their key is wrong -- and
#     it is the half a unit test structurally cannot reach: installGraph.test.ts
#     asserts the graph DOCUMENT declares the edges, but only an execution
#     shows the executor still honours them.
#
# ========================== WHAT IT DOES NOT PROVE ========================
#
# Be honest about the gaps rather than let a green tick imply more than it is:
#
#   * THE CLUSTER LANE DOES NOT RUN. clusterUp / seedBootstrap / frontDoor /
#     magicLink need a real k3d cluster reconciled by ArgoCD from images this
#     workflow does not build. So two of the four surfaces -- dockerImages and
#     k3dClusters -- are TRIVIALLY unchanged here: nothing that ran could have
#     touched them. They are still snapshotted and diffed, because the day the
#     cluster lane does run they are the surfaces that matter, and a diff that
#     only exists when it is convenient proves nothing.
#   * THE PROVIDER KEY IS NOT A REAL ONE. providerKey runs against a LOCAL
#     STUB answering `GET /v1/models` with 200, not against Anthropic -- a
#     fork's pull request cannot hold a real key.
#
#     It is run rather than skipped because memql#3473 made it a GATE: every
#     mutating step now declares `dependsOn: [..., providerKey]`, so nothing
#     touches the machine until the key is verified, and an operator is never
#     asked for a sudo password and then told their key is wrong. Skipping it
#     here would therefore remove the ENTIRE install through the graph's own
#     dependencies, leaving the machine unchanged and the round trip below
#     proving nothing. (That is not hypothetical: it is exactly how the gate
#     first failed this lane.)
#
#     What the stub buys is the graph's SHAPE -- that a good key lets
#     everything downstream proceed -- which no unit test can reach. What it
#     does NOT cover is the key CLASSIFICATION itself: which HTTP codes mean
#     valid, refused or unreachable is tested in
#     scripts/install/verify_provider_key_test.go and is not re-proved here.
#     Note the step is `readOnly: true` and writes no receipt, so running it
#     adds nothing to the artifact the uninstall reverses.
#   * THE TRUST STORE IS NOT EXERCISED. localCA is skipped: `mkcert -install`
#     writes a CA into the system trust store, which is a fifth surface this
#     snapshot does not describe, and a partial round trip there would be
#     worse than none.
#   * THE SNAPSHOT IS NOT A WHOLE-FILESYSTEM DIFF. It describes four named
#     surfaces. Anything the installer touched outside them -- a kubeconfig,
#     apt state, $HOME outside ~/.memql -- is invisible to it.
#   * ONE PLATFORM. ubuntu-latest / linux-amd64 only; tool-pins.env pins
#     linux/amd64 artifacts.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/install/**"
      - "scripts/lib/capability.sh"
      - "editors/vscode/src/install/**"
      - ".github/workflows/install-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  round-trip:
    name: install -> uninstall -> diff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cloneStack fetches a TAG from this checkout, which needs the object
          # history a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # The tag rule is not waived for CI.
      #
      # clone-stack.sh refuses a branch: a branch moves, so two installs of the
      # "same version" would differ, and an installer that cannot say what it
      # installed is not an installer. CI is not an exception to that -- so the
      # workflow TAGS ITS OWN CHECKOUT and installs from the tag, exactly as an
      # operator installs from a release tag. Using --repo=$GITHUB_WORKSPACE
      # keeps it to the tree under test instead of whatever is on the remote.
      - name: Tag this checkout so the install has a real tag to pin
        id: tag
        run: |
          set -euo pipefail
          TAG="e2e-${GITHUB_SHA::12}"
          git -c user.email=ci@example.com -c user.name=ci tag -f "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The hosted runner ships kubectl on PATH, and a future runner image may
      # ship the others.
      #
      # install.binary's pre-existence flag is PATH-WIDE: it means "the machine
      # already had this tool", not "there is already a file at the destination
      # we are about to write". So a preinstalled kubectl makes the receipt say
      # the artifact pre-existed, and remove-artifact.sh then REFUSES to delete
      # the copy we placed under ~/.memql/bin -- conservative, deliberate, and
      # not the thing this workflow is here to measure. (It is also a real
      # asymmetry worth knowing about: our own file outlives the uninstall
      # whenever a same-named binary exists anywhere else on PATH.)
      #
      # Move any of the three aside BEFORE the baseline is taken, so the
      # baseline describes the machine the install actually runs against.
      - name: Take preinstalled pinned tools out of the way
        run: |
          set -euo pipefail
          for tool in k3d kubectl mkcert; do
            if command -v "$tool" >/dev/null 2>&1; then
              found="$(command -v "$tool")"
              sudo mv "$found" "$RUNNER_TEMP/${tool}.preinstalled"
              echo "moved preinstalled $tool aside (was $found)"
            fi
          done

      - name: Build the install CLI
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build:install-cli

      - name: Snapshot the machine BEFORE
        run: ./scripts/install/e2e-baseline.sh --mode=snapshot --out="$RUNNER_TEMP/before.txt"

      # THE PROVIDER STUB. verify-provider-key.sh does an authenticated
      # `GET <base-url>/v1/models` and classifies purely on the HTTP code, so a
      # server that answers 200 on that path is enough to exercise the gate.
      # Started AFTER the BEFORE snapshot deliberately: it is a process, not an
      # artifact, and it touches none of the four surfaces the diff describes.
      #
      # Bound to 127.0.0.1 so nothing off this runner can reach it, and the key
      # file holds an obvious non-credential -- the stub never reads it, but a
      # real-looking string sitting in a workflow is its own hazard.
      - name: Start the provider stub the key gate verifies against
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/provider-stub.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  # Only the path the script actually asks for. Answering
                  # everything 200 would hide the day it starts asking for
                  # something else.
                  ok = self.path == "/v1/models"
                  self.send_response(200 if ok else 404)
                  self.send_header("content-type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"data":[]}')

              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 8099), Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/provider-stub.py" &
          echo $! > "$RUNNER_TEMP/provider-stub.pid"
          # Wait for it rather than sleeping: a race here would fail the gate
          # and read exactly like a broken key.
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/v1/models; then
              echo "provider stub is answering"
              exit 0
            fi
            sleep 0.2
          done
          echo "ERROR: the provider stub never came up" >&2
          exit 1

      - name: Write the stub key file
        run: printf 'not-a-real-key-the-stub-ignores-it\n' > "$RUNNER_TEMP/provider-key"

      # Run as root: hostsBlock writes /etc/hosts. HOME is preserved so
      # ~/.memql stays the same directory the before/after snapshots describe.
      # The receipt is deliberately written OUTSIDE ~/.memql: it is the record
      # OF the install, not an artifact of it, and uninstall does not delete the
      # evidence it just consumed -- leaving it under ~/.memql would show up as
      # drift for the one file that is supposed to survive.
      - name: Install
        run: |
          set -euo pipefail
          sudo -E env "HOME=$HOME" "PATH=$PATH" \
            node editors/vscode/dist-install/cli.js install \
              --root="$GITHUB_WORKSPACE" \
              --receipt="$RUNNER_TEMP/install-receipt.json" \
              --repo="$GITHUB_WORKSPACE" \
              --tag="${{ steps.tag.outputs.tag }}" \
              --skip=localCA \
              --provider-key-file="$RUNNER_TEMP/provider-key" \
              --param=providerKey.base-url=http://127.0.0.1:8099 \
              --timeout=600
          # Running the CLI as root means everything it wrote is root-owned,
          # including the receipt -- and every step after this one runs as the
          # runner. The first real execution of this workflow died here with
          # "cat: install-receipt.json: Permission denied", which skipped the
          # uninstall and the diff and then failed the artifact upload too, so
          # the run produced no evidence about the thing it exists to test.
          # Hand the receipt back before anyone else needs to read it.
          #
          # Only the receipt: ~/.memql stays root-owned on purpose, because the
          # uninstall below also runs under sudo and must remove exactly what
          # the install created, as the same user that created it.
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/install-receipt.json"

      - name: Show what the install recorded
        run: cat "$RUNNER_TEMP/install-receipt.json"

      # A mid-flight snapshot is what makes the final one meaningful: if the
      # install changed nothing, the after-diff would pass for the wrong reason.
      - name: The install actually changed the machine
        run: |
          set -euo pipefail
          if ./scripts/install/e2e-baseline.sh --mode=compare \
              --baseline="$RUNNER_TEMP/before.txt" --out="$RUNNER_TEMP/during.txt"; then
            echo "ERROR: the install left the machine identical -- the round trip below would prove nothing" >&2
            exit 1
          fi
          echo "the install changed the machine, as it must"

      - name: Uninstall
        run: |
          set -euo pipefail
          sudo -E env "HOME=$HOME" "PATH=$PATH" \
            node editors/vscode/dist-install/cli.js uninstall \
              --root="$GITHUB_WORKSPACE" \
              --receipt="$RUNNER_TEMP/install-receipt.json" \
              --timeout=600

      # THE ASSERTION. Everything above is setup for this line.
      - name: Snapshot the machine AFTER, and diff
        run: |
          ./scripts/install/e2e-baseline.sh --mode=compare \
            --baseline="$RUNNER_TEMP/before.txt" --out="$RUNNER_TEMP/after.txt"

      # Stopped AFTER the diff, not before it: the stub is not one of the four
      # surfaces, but killing it mid-run would turn any late provider call into
      # a transport failure that reads like a broken gate. `always()` so a
      # failed diff still leaves no stray listener behind.
      - name: Stop the provider stub
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/provider-stub.pid"
          [ -f "$pid_file" ] || exit 0
          kill "$(cat "$pid_file")" 2>/dev/null || true

      - name: Upload the receipt and the snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-e2e-evidence
          path: |
            ${{ runner.temp }}/before.txt
            ${{ runner.temp }}/during.txt
            ${{ runner.temp }}/after.txt
            ${{ runner.temp }}/install-receipt.json
          if-no-files-found: warn

  # ==========================================================================
  # THE GATE'S NEGATIVE CASE (memql#3507)
  # ==========================================================================
  #
  # The round trip above proves a GOOD key lets everything downstream proceed.
  # This job proves the other half, which is the half memql#3473's gate
  # actually exists for: a REFUSED key must leave the machine untouched.
  #
  # WHY IT CANNOT BE A UNIT TEST. `installGraph.test.ts` asserts the DOCUMENT
  # says the right thing -- that every mutating step declares
  # `dependsOn: [..., providerKey]` -- and it fails against the pre-gate graph,
  # so it is a real guard. What it cannot see is whether the EXECUTOR honours
  # those edges in a live run: if skip-blocks-dependents semantics ever
  # changed, the document would still read correctly and the behaviour would be
  # gone. Only an execution against a refusing provider catches that.
  #
  # A SEPARATE JOB, NOT MORE STEPS. It needs its own runner and its own
  # baseline: this job asserts the machine is UNCHANGED and the job above
  # asserts it CHANGED, over the same four surfaces. Sharing a baseline
  # directory between two assertions that are exact opposites is how one
  # silently starts proving the other's claim.
  refused-key:
    name: a refused key changes nothing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Tag this checkout so the install has a real tag to pin
        id: tag
        run: |
          set -euo pipefail
          TAG="e2e-${GITHUB_SHA::12}"
          git -c user.email=ci@example.com -c user.name=ci tag -f "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Same reasoning as the round-trip job: a preinstalled tool changes what
      # the receipt records. It should not matter here -- nothing should get as
      # far as placing a binary -- but the baseline must describe the machine
      # the install actually runs against either way, or an unchanged-machine
      # assertion is comparing against the wrong thing.
      - name: Take preinstalled pinned tools out of the way
        run: |
          set -euo pipefail
          for tool in k3d kubectl mkcert; do
            if command -v "$tool" >/dev/null 2>&1; then
              found="$(command -v "$tool")"
              sudo mv "$found" "$RUNNER_TEMP/${tool}.preinstalled"
              echo "moved preinstalled $tool aside (was $found)"
            fi
          done

      - name: Build the install CLI
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build:install-cli

      - name: Snapshot the machine BEFORE
        run: ./scripts/install/e2e-baseline.sh --mode=snapshot --out="$RUNNER_TEMP/before.txt"

      # 401, not 404 and not a closed port. The distinction is the whole test:
      # verify-provider-key.sh classifies 401/403 as REFUSED (exit 3) and a
      # transport failure as UNREACHABLE (exit 5), and only the first says
      # anything about the key. A stub that failed to start would also leave
      # the machine unchanged -- passing a naive "it failed and nothing
      # happened" check while proving nothing about the gate.
      - name: Start a provider stub that REFUSES the key
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/refusing-stub.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  # 401 on the real path; 404 elsewhere, so the day the script
                  # asks for something else this fails loudly instead of
                  # refusing for the wrong reason.
                  refused = self.path == "/v1/models"
                  self.send_response(401 if refused else 404)
                  self.send_header("content-type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"error":{"message":"invalid api key"}}')

              def log_message(self, *args):
                  pass

          HTTPServer(("127.0.0.1", 8099), Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/refusing-stub.py" &
          echo $! > "$RUNNER_TEMP/refusing-stub.pid"
          for _ in $(seq 1 50); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/v1/models || true)"
            if [ "$code" = "401" ]; then
              echo "refusing stub is answering 401"
              exit 0
            fi
            sleep 0.2
          done
          echo "ERROR: the refusing stub never came up -- a 5 (unreachable) below would prove nothing" >&2
          exit 1

      - name: Write the stub key file
        run: printf 'not-a-real-key-and-the-stub-refuses-it\n' > "$RUNNER_TEMP/provider-key"

      # Run EXACTLY as the round-trip job does, including sudo. The only
      # difference between the two jobs must be what the stub answers.
      - name: Install, and expect it to refuse
        run: |
          set -uo pipefail
          set +e
          sudo -E env "HOME=$HOME" "PATH=$PATH" \
            node editors/vscode/dist-install/cli.js install \
              --root="$GITHUB_WORKSPACE" \
              --receipt="$RUNNER_TEMP/install-receipt.json" \
              --repo="$GITHUB_WORKSPACE" \
              --tag="${{ steps.tag.outputs.tag }}" \
              --skip=localCA \
              --provider-key-file="$RUNNER_TEMP/provider-key" \
              --param=providerKey.base-url=http://127.0.0.1:8099 \
              --timeout=600 \
              --json > "$RUNNER_TEMP/report.json"
          rc=$?
          set -e
          echo "cli exit: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: the install SUCCEEDED against a refused key -- the gate is not holding" >&2
            exit 1
          fi
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/install-receipt.json" 2>/dev/null || true

      - name: Show what the run reported
        if: always()
        run: cat "$RUNNER_TEMP/report.json" || true

      # EXIT 3, SPECIFICALLY. 5 is "provider unreachable", which says nothing
      # about the key -- so accepting any non-zero here would let a dead stub,
      # a wrong port or a DNS failure stand in for a refusal and pass this test
      # for entirely the wrong reason.
      - name: The refusal was a REFUSAL, not an outage
        run: |
          set -euo pipefail
          status="$(jq -r '.outcomes[] | select(.id=="providerKey") | .status' "$RUNNER_TEMP/report.json")"
          code="$(jq -r '.outcomes[] | select(.id=="providerKey") | .exitCode' "$RUNNER_TEMP/report.json")"
          echo "providerKey: status=$status exitCode=$code"
          [ "$status" = "failed" ] || { echo "ERROR: providerKey did not fail" >&2; exit 1; }
          [ "$code" = "3" ] || {
            echo "ERROR: expected exit 3 (refused); got $code. 5 means unreachable and would say nothing about the key." >&2
            exit 1
          }

      # THE ASSERTION. Everything above is setup for this line.
      #
      # `providerKey` is readOnly and writes no receipt, so it contributes
      # nothing to any surface itself. Any difference at all is therefore a
      # MUTATING step that ran when the gate should have blocked it.
      - name: The machine is untouched
        run: |
          ./scripts/install/e2e-baseline.sh --mode=compare \
            --baseline="$RUNNER_TEMP/before.txt" --out="$RUNNER_TEMP/after.txt"

      - name: Stop the refusing stub
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/refusing-stub.pid"
          [ -f "$pid_file" ] || exit 0
          kill "$(cat "$pid_file")" 2>/dev/null || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-e2e-refused-key-evidence
          path: |
            ${{ runner.temp }}/before.txt
            ${{ runner.temp }}/after.txt
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/install-receipt.json
          if-no-files-found: warn
