name: Bug report
description: Report a bug or unexpected behavior in memQL
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more specific you can be,
        the faster we can reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: memQL version / commit
      description: Output of `git log -1 --pretty=oneline` from the running checkout, or a release tag.
      placeholder: "e.g. 152347e or v0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, and how memQL is running (local Docker, Cloud Run, etc.)
      placeholder: "macOS 15.4, Go 1.26.1, local docker-compose"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what did you observe instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of commands, DSL snippet, or query that triggers the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Server logs, client error message, or any other output. Please redact sensitive data.
      render: text
