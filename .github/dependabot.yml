version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    ignore:
      # github.com/livekit/protocol is version-coupled to server-sdk-go and
      # must NOT be bumped standalone. protocol 1.46.7 dropped the
      # Scenario_*/ScenarioGroup_* types that server-sdk-go v2.16.6 still
      # imported, so even a patch bump (1.46.6 -> 1.46.8, PR #2192) failed
      # go-checks and every node build with
      # `undefined: livekit.Scenario_Create_Request`. See issue #2181.
      #
      # The COUPLING is the rule, and it is permanent -- not a wait for some
      # specific version to arrive. protocol moves only in lockstep with a
      # server-sdk-go release that supports it, which a server-sdk-go bump
      # pulls in transitively (that's server-sdk-go's own Dependabot PR,
      # unaffected by this ignore). That is the ONLY sanctioned path, and it
      # is a path this entry does not block, so there is nothing this entry
      # holds back.
      #
      # This has now happened once, which is the worked example: #3293 bumped
      # server-sdk-go 2.16.3 -> 2.18.1 and carried protocol 1.45.6 -> 1.49.0
      # in with it, green. So do NOT read the tree being past 1.46.6 as
      # evidence the hazard expired -- 1.49.0 is here BECAUSE it arrived the
      # coupled way.
      #
      # An earlier version of this comment said to remove the entry "once
      # server-sdk-go builds against protocol >= 1.48.x". Do not: that
      # condition is already true and acting on it would re-enable exactly the
      # standalone bump the rule exists to stop. #3299 proposed protocol
      # 1.50.4 on its own, unvalidated against server-sdk-go 2.18.1, and was
      # closed for that reason -- it only got proposed at all because the
      # since-removed nested gomod entry (memql#3300) carried no `ignore`
      # block and routed around this guard.
      - dependency-name: "github.com/livekit/protocol"

  # WHY THERE IS NO SEPARATE ENTRY FOR THE NESTED MODULES (memql#3300).
  #
  # There used to be one, listing `/component/**`, `/core`, `/docs`, `/dsl`,
  # `/integrations/**`. It was added on the belief that a nested `go.mod` is
  # invisible to the root entry and would go UNWATCHED. That belief was wrong,
  # and the entry was pure duplication.
  #
  # Dependabot's Go updater is `go.work`-AWARE. The entry above, at `/`,
  # resolves the whole WORKSPACE, so one PR updates every module that uses the
  # bumped dependency. Measured on the split tree: a single root-entry PR
  # (`grpc 1.82.1 -> 1.83.0`, #3295) touched 27 distinct module directories
  # spanning every tier -- wire, base, engine, platform and the servers.
  #
  # With both entries live, every dependency was processed twice and the
  # duplicates were visible as pairs: #3297 and #3294 were the same
  # `docker/cli` bump, #3298 and #3296 the same `runc` bump -- one from each
  # entry. Seven PRs for what was really two shipped-dependency updates.
  #
  # So: do NOT re-add a per-directory entry while `go.work` lists every module.
  # If a module ever stops being listed there, it leaves the workspace and DOES
  # become unwatched -- but the `module-boundaries` lane already fails on that,
  # because its first step asserts `go.work` matches the go.mod files on disk.
  # That assertion is what makes this entry sufficient rather than merely
  # convenient.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # codeql.yml pins init/autobuild/analyze to ONE SHA; a per-step bump
      # always fails the required Analyze (go) gate with a config/runtime
      # version mismatch (#2545), so the sub-actions must arrive as a single
      # lockstep PR. See #2553.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
