version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    ignore:
      # grpc 1.84.0 carries GO-2026-6443 (CVE-2026-84445): a server panic on a
      # request with neither :authority nor Host. The fix reached 1.82.2, 1.83.2
      # and master, but not the 1.84 branch, so 1.84.0 is the one release that
      # REINTRODUCES it. #5669 took it from #5605 and govulncheck went red on
      # main -- the lane runs on push and merge_group only, so no PR sees it.
      # Exact version only: a 1.84.x or 1.85.0 carrying the fix is still
      # proposed. Delete this entry once main moves past 1.84.0.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.0"]
      # livekit/protocol 1.51.0 changed TransferSIPParticipant to return a
      # TransferSIPParticipantResponse instead of emptypb.Empty, and every
      # tagged livekit/server-sdk-go (v2.18.1 at the time) still pins protocol
      # 1.49.0 and returns the old type -- so a protocol-only bump fails to
      # compile integrations/voice (#5675, declined). Protocol has to move WITH
      # server-sdk-go, and a server-sdk-go bump brings it along by MVS; this
      # entry only stops the protocol-alone proposals that cannot build.
      # Delete it once a tagged server-sdk-go requires protocol >= 1.51.
      - dependency-name: "github.com/livekit/protocol"
        versions: [">= 1.51.0"]

  # WHY THERE IS NO SEPARATE ENTRY FOR THE NESTED MODULES (memql#3300).
  #
  # There used to be one, listing `/component/**`, `/core`, `/docs`, `/dsl`,
  # `/integrations/**`. It was added on the belief that a nested `go.mod` is
  # invisible to the root entry and would go UNWATCHED. That belief was wrong,
  # and the entry was pure duplication.
  #
  # Dependabot's Go updater is `go.work`-AWARE. The entry above, at `/`,
  # resolves the whole WORKSPACE, so one PR updates every module that uses the
  # bumped dependency. Measured on the split tree: a single root-entry PR
  # (`grpc 1.82.1 -> 1.83.0`, #3295) touched 27 distinct module directories
  # spanning every tier -- wire, base, engine, platform and the servers.
  #
  # With both entries live, every dependency was processed twice and the
  # duplicates were visible as pairs: #3297 and #3294 were the same
  # `docker/cli` bump, #3298 and #3296 the same `runc` bump -- one from each
  # entry. Seven PRs for what was really two shipped-dependency updates.
  #
  # So: do NOT re-add a per-directory entry while `go.work` lists every module.
  # If a module ever stops being listed there, it leaves the workspace and DOES
  # become unwatched -- but the `module-boundaries` lane already fails on that,
  # because its first step asserts `go.work` matches the go.mod files on disk.
  # That assertion is what makes this entry sufficient rather than merely
  # convenient.

  # THE MISSING HALF OF A PRACTICE THIS REPO ALREADY HAD (Scorecard alert
  # #1080). Every Dockerfile here pins its base images by digest -- and
  # nothing was bumping those digests, so the pins were slowly going stale
  # instead of moving. A pinned base with no updater is not more secure than
  # an unpinned one; it is differently insecure, and quieter about it.
  #
  # One entry per directory that holds a Dockerfile, because the docker
  # updater is not workspace-aware the way the gomod one above is. Adding a
  # Dockerfile in a new directory means adding an entry here; there is no
  # gate that will tell you, which is why the list is written out rather than
  # globbed.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/cmd/deploy-gate-check"
      - "/deploy/db-image"
      - "/deploy/fleet"
      - "/deploy/toolchain-image"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # deploy/toolchain-image's kubectl is held at the MINOR of
      # scripts/k3d/up.sh's K3S_VERSION -- the Kubernetes the local deploy
      # target runs, kept at 1.32 for ArgoCD's schema -- and scripts/ci holds
      # the two equal, so a minor bump alone can only go red (#5903 proposed
      # 1.37.1). Moving Kubernetes is a platform change that moves both lines
      # together, never a Dependabot PR. Patch releases are still proposed.
      - dependency-name: "registry.k8s.io/kubectl"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
