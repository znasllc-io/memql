version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    ignore:
      # github.com/livekit/protocol is version-coupled to server-sdk-go and
      # must NOT be bumped standalone — ANY version above 1.46.6 breaks the
      # build. protocol 1.46.7 already dropped the Scenario_*/ScenarioGroup_*
      # types that server-sdk-go v2.16.6 still imports, so even a patch bump
      # (1.46.6 -> 1.46.8, PR #2192) fails go-checks and every node build with
      # `undefined: livekit.Scenario_Create_Request`. See issue #2181.
      # protocol must only move in lockstep with a server-sdk-go release that
      # supports it, which a server-sdk-go bump pulls in transitively (that's
      # server-sdk-go's own Dependabot PR, unaffected by this ignore).
      # Remove this entry once livekit tags a server-sdk-go/v2 that builds
      # against protocol >= 1.48.x, then bump both modules together.
      - dependency-name: "github.com/livekit/protocol"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # codeql.yml pins init/autobuild/analyze to ONE SHA; a per-step bump
      # always fails the required Analyze (go) gate with a config/runtime
      # version mismatch (#2545), so the sub-actions must arrive as a single
      # lockstep PR. See #2553.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
