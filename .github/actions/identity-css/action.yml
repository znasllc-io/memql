name: identity-css
description: >-
  Generate component/identity/web/static/app.css (plus the brand faces and
  favicon it references) so packages embedding it compile.

# WHY A JOB NEEDS THIS AT ALL
#
# component/identity/web embeds static/app.css BY NAME (see its embed.go).
# That file is generated by Tailwind from the shared brand/ layer and is
# gitignored, so a fresh checkout does not have it and any job compiling that
# package fails with:
#
#   pattern static/app.css: no matching files found
#
# The explicit embed is deliberate (memql#4268). Before it, the pattern was a
# glob, a glob that matches nothing still compiles, and a build that skipped
# the CSS step produced an identity binary serving /static/app.css as a 404 --
# every page unstyled, with nothing in the build output saying so. The root
# Dockerfile shipped exactly that image once already.
#
# The cost of making the dependency explicit is this action: run it after
# actions/setup-go in any job that compiles the repo broadly.

runs:
  using: composite
  steps:
    # The standalone Tailwind binary is a ~100MB download that once killed
    # whole cluster builds on a single TLS hiccup (memql#1351). Cache it on the
    # version pin so it is fetched once per runner image rather than per job.
    - name: Restore the Tailwind binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: bin/tools
        key: tailwind-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/identity/build-css.sh') }}

    - name: Build the identity stylesheet
      shell: bash
      run: bash scripts/identity/build-css.sh
