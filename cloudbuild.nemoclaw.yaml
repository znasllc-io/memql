# memQL + OpenClaw Cloud Build — Google Cloud Run (Multi-Container)
#
# Usage:
#   Manual:  gcloud builds submit --config cloudbuild.nemoclaw.yaml \
#              --substitutions=COMMIT_SHA=$(git rev-parse HEAD),_MEMQL_SERVICE_NAME=memql-anequim,...
#   Trigger: Attach to a Cloud Build trigger on the desired branch
#            with substitution overrides for the target client.
#
# This builds the memQL Docker image, pulls the OpenClaw image from
# GitHub Container Registry, pushes both to Artifact Registry, and
# deploys to Cloud Run using service.nemoclaw.yaml (multi-container:
# memQL ingress + OpenClaw sidecar).
#
# OpenClaw v2026.2.26+ (patches CVE-2026-25253, hardened config).
# Upgrade path: swap _OPENCLAW_IMAGE for NemoClaw when available.
#
# Default substitution values target the Anequim client.
# Override via trigger or --substitutions for other clients.

substitutions:
  _DEPLOY_REGION: 'us-central1'
  _MEMQL_SERVICE_NAME: 'anequim-memql-staging'
  _MEMQL_HOST: 'anequim-memql-staging-439288787761.us-central1.run.app'
  _DSN_SECRET: 'MEMORY_NODES_DATABASE_DSN_ANEQUIM'
  _CONTENTID_SALT_SECRET: 'MEMORY_NODES_CONTENTID_SALT_ANEQUIM'
  _IDENTITY_HOST: 'auth.example.com'
  _OPENCLAW_TAG: '2026.2.26'

steps:
  # ===========================================================================
  # 1. Build the memQL Docker image
  # ===========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:latest'
      - '.'

  # ===========================================================================
  # 2. Pull OpenClaw image from GHCR and re-tag for Artifact Registry
  # ===========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'pull'
      - 'ghcr.io/openclaw/openclaw:${_OPENCLAW_TAG}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'tag'
      - 'ghcr.io/openclaw/openclaw:${_OPENCLAW_TAG}'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/openclaw:${_OPENCLAW_TAG}'

  # ===========================================================================
  # 3. Push all images to Artifact Registry
  # ===========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/openclaw:${_OPENCLAW_TAG}']

  # ===========================================================================
  # 4. Prepare service.nemoclaw.yaml (inject all client-specific values)
  # ===========================================================================
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|IMAGE_PLACEHOLDER|us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA|g" service.nemoclaw.yaml
        sed -i "s|OPENCLAW_IMAGE_PLACEHOLDER|us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/openclaw:${_OPENCLAW_TAG}|g" service.nemoclaw.yaml
        sed -i "s|SERVICE_NAME_PLACEHOLDER|${_MEMQL_SERVICE_NAME}|g" service.nemoclaw.yaml
        sed -i "s|REGION_PLACEHOLDER|${_DEPLOY_REGION}|g" service.nemoclaw.yaml
        sed -i "s|DSN_SECRET_PLACEHOLDER|${_DSN_SECRET}|g" service.nemoclaw.yaml
        sed -i "s|CONTENTID_SALT_SECRET_PLACEHOLDER|${_CONTENTID_SALT_SECRET}|g" service.nemoclaw.yaml
        sed -i "s|IDENTITY_HOST_PLACEHOLDER|${_IDENTITY_HOST}|g" service.nemoclaw.yaml
        sed -i "s|MEMQL_HOST_PLACEHOLDER|${_MEMQL_HOST}|g" service.nemoclaw.yaml

  # ===========================================================================
  # 5. Deploy multi-container service to Cloud Run
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'service.nemoclaw.yaml'
      - '--region=${_DEPLOY_REGION}'

  # ===========================================================================
  # 6. Allow unauthenticated traffic (idempotent)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - '${_MEMQL_SERVICE_NAME}'
      - '--region=${_DEPLOY_REGION}'
      - '--member=allUsers'
      - '--role=roles/run.invoker'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:$COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/memql:latest'
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/memql-repo/openclaw:${_OPENCLAW_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
