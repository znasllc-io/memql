syntax = "proto3";

package znasllc.memql.node.v1;

option go_package = "github.com/znasllc-io/memql/component/node/gen;nodev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// NodeService provides bidirectional streaming for inter-node communication
// in a memQL cluster. All node types use this service to discover peers,
// exchange heartbeats, forward events, and coordinate work.
service NodeService {
  rpc Stream(stream NodeClientMessage) returns (stream NodeServerMessage);
}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

message NodeClientMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;
  // 60 (query_forward) retired with the cross-node query-forwarding
  // machinery, #2814.
  reserved 60;
  reserved "query_forward";

  oneof payload {
    NodeHello node_hello = 10;
    NodeHeartbeat heartbeat = 11;
    PeerIntroduction peer_intro = 12;
    SpawnRequest spawn_request = 20;
    SpawnResult spawn_result = 21;
    EventForward event_forward = 30;
    EventAck event_ack = 31;
    CapabilityQuery capability_query = 40;
    CapabilityResponse capability_response = 41;
    AiForwardRequest ai_forward_request = 70;
    AiForwardCancel ai_forward_cancel = 71;
    WorkbenchForwardRequest workbench_forward_request = 80;
    WorkbenchForwardCancel workbench_forward_cancel = 81;
  }
}

message NodeServerMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;
  // 60 (query_response) retired with the cross-node query-forwarding
  // machinery, #2814.
  reserved 60;
  reserved "query_response";

  oneof payload {
    NodeWelcome node_welcome = 10;
    NodeHeartbeat heartbeat = 11;
    PeerIntroduction peer_intro = 12;
    SpawnRequest spawn_request = 20;
    SpawnResult spawn_result = 21;
    EventForward event_forward = 30;
    EventAck event_ack = 31;
    CapabilityQuery capability_query = 40;
    CapabilityResponse capability_response = 41;
    NodeShutdown node_shutdown = 50;
    AiForwardResponse ai_forward_response = 70;
    WorkbenchForwardResponse workbench_forward_response = 80;
  }
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

// NodeHello is sent by a connecting node to identify itself.
message NodeHello {
  string node_id = 1;
  string node_type = 2;
  string version = 3;
  string address = 4;
  string parent_id = 5;
  map<string, string> labels = 6;
  repeated string capabilities = 7;
}

// NodeWelcome is sent by the server in response to NodeHello.
message NodeWelcome {
  string node_id = 1;
  repeated PeerInfo peers = 2;
  // Server's own node type (bff / voice / cognition / agent / planner).
  // Lets the client register the parent peer with a populated NodeType so
  // downstream consumers (NodeStatusWriter, CapabilityRouter) don't see
  // an empty-type peer.
  string node_type = 3;
}

// ---------------------------------------------------------------------------
// Heartbeat
// ---------------------------------------------------------------------------

message NodeHeartbeat {
  google.protobuf.Timestamp ts = 1;
  NodeHealthStatus health = 2;
  map<string, string> metrics = 3;
}

enum NodeHealthStatus {
  NODE_HEALTH_UNSPECIFIED = 0;
  // Registered but has not yet sent a heartbeat. Transient startup state.
  NODE_HEALTH_CONNECTING = 1;
  // Heartbeating within the liveness timeout.
  NODE_HEALTH_HEALTHY = 2;
  // Missed heartbeats but not yet past the offline threshold.
  NODE_HEALTH_DEGRADED = 3;
  // Voluntarily winding down (advertised via heartbeat or shutdown).
  NODE_HEALTH_DRAINING = 4;
  // Missed heartbeats past the offline threshold. Concept record retained
  // for display; removed from the in-memory peer routing table.
  NODE_HEALTH_OFFLINE = 5;
  // Received an explicit NodeShutdown.
  NODE_HEALTH_STOPPED = 6;
}

// ---------------------------------------------------------------------------
// Peer Discovery
// ---------------------------------------------------------------------------

message PeerInfo {
  string node_id = 1;
  string node_type = 2;
  string address = 3;
  NodeHealthStatus health = 4;
  repeated string capabilities = 5;
  map<string, string> labels = 6;
}

message PeerIntroduction {
  repeated PeerInfo peers = 1;
  bool removal = 2;
}

// ---------------------------------------------------------------------------
// Spawn
// ---------------------------------------------------------------------------

message SpawnRequest {
  string request_id = 1;
  string node_type = 2;
  map<string, string> labels = 3;
  map<string, string> env = 4;
}

message SpawnResult {
  string request_id = 1;
  bool success = 2;
  string node_id = 3;
  string error = 4;
}

// ---------------------------------------------------------------------------
// Distributed Events
// ---------------------------------------------------------------------------

message EventForward {
  string event_id = 1;
  string topic = 2;
  int32 kind = 3;
  google.protobuf.Timestamp ts = 4;
  google.protobuf.Struct payload = 5;
  string origin_node_id = 6;
  int32 ttl = 7;
}

message EventAck {
  string event_id = 1;
}

// ---------------------------------------------------------------------------
// Capability Query
// ---------------------------------------------------------------------------

message CapabilityQuery {
  string request_id = 1;
  string capability_name = 2;
}

message CapabilityResponse {
  string request_id = 1;
  bool available = 2;
  string node_id = 3;
  string address = 4;
}

// ---------------------------------------------------------------------------
// Query Forwarding -- RETIRED (#2814)
// ---------------------------------------------------------------------------
//
// QueryForward / QueryResponse carried a MemQL query from one node to another
// for execution, for the case where a client queried a node that did not own
// the target concept.
//
// The send side was already gone. ac3a751e ("simplify: drop per-node
// @visibility filtering + concept-ownership routing", 2026-05-16) deleted
// query_proxy.go and RegisterConceptOwnership deliberately, as over-engineered
// for this stage of the project. That left this receive side orphaned: zero
// producers anywhere in the tree including tests, no production caller of the
// SetQueryExecutor seam, and no registry left to decide which node owns a
// concept -- ownership is routing rules plus build tags now (see
// docs/internal/design/extension-points.md).
//
// It was removed rather than repaired because the repair was unsafe to
// publish. The handler executed forwarded DSL on context.Background(), so it
// ran with no actor at all; propagating the caller's claims to fix that meant
// prescribing auth.ForwardedClaimsFromIdentity as the producer recipe, and
// that recipe cannot carry a badge grant's `class` / `role_ceiling`. Since
// applyBadgeRoleCeiling clamps only when class=="badge", a forwarded badge
// session resolved the operator's UNCLAMPED stored role -- an owner badged
// into a reader kiosk came back isClusterOwner=true on a surface that
// dispatches mutations and logic.
//
// The mesh authority-propagation contract is being designed once, on #2876,
// against the AiForward path -- which unlike this one is live in production.
// See component/auth/forward.go for the constraints any such contract must
// satisfy. If concept-ownership routing is ever built, it needs that contract
// first, not this machinery back.

// ---------------------------------------------------------------------------
// AI / voice request forwarding
// ---------------------------------------------------------------------------

// AiForwardRequest carries an AI / voice envelope from a BFF node to a
// worker node that has the required provider registered. The body is the
// proto-serialized MemqlClientMessage the BFF originally received from
// its client -- the worker unmarshals it and dispatches to its local
// handler as if the client had connected to it directly.
//
// Using a byte-envelope here (rather than embedding each AI message
// type) keeps component/node/ independent of component/grpc/: the node
// layer just moves bytes; the grpc layer owns the wire-type semantics.
//
// `auth` carries the originating principal's claims (subject, email,
// role) so the worker can reconstruct a TokenInfo and enforce the same
// ACLs it would have applied if the client had connected directly.
message AiForwardRequest {
  string request_id = 1;
  map<string, string> auth = 2;
  reserved 3;
  reserved "partition";
  bytes memql_envelope = 4;  // Serialized memqlv1.MemqlClientMessage
}

// AiForwardResponse carries a worker's response back to the originating
// BFF. Streamed responses (e.g. aiChat with stream=true) send multiple
// messages with the same request_id. `done=true` marks the last one.
//
// `memql_server_msg` is a proto-serialized memqlv1.MemqlServerMessage
// (AiChunk / AiChatResult / AiSpeechResult / AiTranscribeResult /
// AiSuggestResult / ListToolsResult / CallToolResult / QueryError).
message AiForwardResponse {
  string request_id = 1;
  bytes memql_server_msg = 2;
  bool done = 3;
}

// AiForwardCancel signals the worker that the BFF's client cancelled
// the request (stream closed, explicit cancel message). The worker
// should stop producing responses for `request_id` and clean up.
message AiForwardCancel {
  string request_id = 1;
}

// ---------------------------------------------------------------------------
// Workbench forwarding
// ---------------------------------------------------------------------------
//
// WorkbenchForwardRequest carries an agent's workbenchHost.<action>
// dispatch from the agent node to the workbench node that holds the
// per-Plan workspace. Single round-trip semantics (no streaming);
// the agent's tool loop waits synchronously for the response.
//
// Unlike AiForward, this is a structured envelope (not a byte-wrapped
// MemqlClientMessage) because the workbench surface is a flat
// integration capability, not a gRPC message type. Args are encoded
// as JSON to keep the wire shape stable across action-specific arg
// variants without exploding the proto with one oneof per action.
//
// `auth` carries the originating principal's claims (subject, email,
// role) so the workbench node can reconstruct the actor context.
message WorkbenchForwardRequest {
  string request_id = 1;
  map<string, string> auth = 2;
  reserved 3;
  reserved "partition";
  string plan_id = 4;
  string action = 5;
  bytes args_json = 6;
  string agent_id = 7;
  string task_id = 8;
  // Optional timeout hint; the workbench node clamps to its own caps.
  int32 timeout_sec = 9;
}

// WorkbenchForwardResponse carries the dispatch result back to the
// agent node. `payload_json` is the JSON-marshalled dispatchResult
// shape ({ok, action, payload, errorCode, errorMessage}) the local
// path returns. Single message per request_id; no streaming.
message WorkbenchForwardResponse {
  string request_id = 1;
  bytes payload_json = 2;
  string error_code = 3;
  string error_message = 4;
}

// WorkbenchForwardCancel mirrors AiForwardCancel. The agent's tool
// loop fires it when the LLM call upstream is cancelled before the
// workbench finishes; the workbench should stop in-flight work
// for the request_id and free resources (kill exec, abort http_fetch).
message WorkbenchForwardCancel {
  string request_id = 1;
}

// ---------------------------------------------------------------------------
// Shutdown
// ---------------------------------------------------------------------------

message NodeShutdown {
  string reason = 1;
  int32 grace_seconds = 2;
}
