syntax = "proto3";

package znasllc.memql.node.v1;

option go_package = "github.com/znasllc-io/memql/component/node/gen;nodev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// NodeService provides bidirectional streaming for inter-node communication
// in a memQL cluster. All node types use this service to discover peers,
// exchange heartbeats, forward events, and coordinate work.
service NodeService {
  rpc Stream(stream NodeClientMessage) returns (stream NodeServerMessage);
}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

message NodeClientMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;
  // 60 (query_forward) retired with the cross-node query-forwarding
  // machinery, #2814.
  reserved 60;
  reserved "query_forward";

  oneof payload {
    NodeHello node_hello = 10;
    NodeHeartbeat heartbeat = 11;
    PeerIntroduction peer_intro = 12;
    SpawnRequest spawn_request = 20;
    SpawnResult spawn_result = 21;
    EventForward event_forward = 30;
    EventAck event_ack = 31;
    CapabilityQuery capability_query = 40;
    CapabilityResponse capability_response = 41;
    AiForwardRequest ai_forward_request = 70;
    AiForwardCancel ai_forward_cancel = 71;
    WorkbenchForwardRequest workbench_forward_request = 80;
    WorkbenchForwardCancel workbench_forward_cancel = 81;
  }
}

message NodeServerMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;
  // 60 (query_response) retired with the cross-node query-forwarding
  // machinery, #2814.
  reserved 60;
  reserved "query_response";

  oneof payload {
    NodeWelcome node_welcome = 10;
    NodeHeartbeat heartbeat = 11;
    PeerIntroduction peer_intro = 12;
    SpawnRequest spawn_request = 20;
    SpawnResult spawn_result = 21;
    EventForward event_forward = 30;
    EventAck event_ack = 31;
    CapabilityQuery capability_query = 40;
    CapabilityResponse capability_response = 41;
    NodeShutdown node_shutdown = 50;
    AiForwardResponse ai_forward_response = 70;
    WorkbenchForwardResponse workbench_forward_response = 80;
  }
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

// NodeHello is sent by a connecting node to identify itself.
message NodeHello {
  string node_id = 1;
  string node_type = 2;
  string version = 3;
  string address = 4;
  string parent_id = 5;
  map<string, string> labels = 6;
  repeated string capabilities = 7;
}

// NodeWelcome is sent by the server in response to NodeHello.
message NodeWelcome {
  string node_id = 1;
  repeated PeerInfo peers = 2;
  // Server's own node type (bff / voice / cognition / agent / planner).
  // Lets the client register the parent peer with a populated NodeType so
  // downstream consumers (NodeStatusWriter, CapabilityRouter) don't see
  // an empty-type peer.
  string node_type = 3;
}

// ---------------------------------------------------------------------------
// Heartbeat
// ---------------------------------------------------------------------------

message NodeHeartbeat {
  google.protobuf.Timestamp ts = 1;
  NodeHealthStatus health = 2;
  map<string, string> metrics = 3;
}

enum NodeHealthStatus {
  NODE_HEALTH_UNSPECIFIED = 0;
  // Registered but has not yet sent a heartbeat. Transient startup state.
  NODE_HEALTH_CONNECTING = 1;
  // Heartbeating within the liveness timeout.
  NODE_HEALTH_HEALTHY = 2;
  // Missed heartbeats but not yet past the offline threshold.
  NODE_HEALTH_DEGRADED = 3;
  // Voluntarily winding down (advertised via heartbeat or shutdown).
  NODE_HEALTH_DRAINING = 4;
  // Missed heartbeats past the offline threshold. Concept record retained
  // for display; removed from the in-memory peer routing table.
  NODE_HEALTH_OFFLINE = 5;
  // Received an explicit NodeShutdown.
  NODE_HEALTH_STOPPED = 6;
}

// ---------------------------------------------------------------------------
// Peer Discovery
// ---------------------------------------------------------------------------

message PeerInfo {
  string node_id = 1;
  string node_type = 2;
  string address = 3;
  NodeHealthStatus health = 4;
  repeated string capabilities = 5;
  map<string, string> labels = 6;
}

message PeerIntroduction {
  repeated PeerInfo peers = 1;
  bool removal = 2;
}

// ---------------------------------------------------------------------------
// Spawn
// ---------------------------------------------------------------------------

message SpawnRequest {
  string request_id = 1;
  string node_type = 2;
  map<string, string> labels = 3;
  map<string, string> env = 4;
}

message SpawnResult {
  string request_id = 1;
  bool success = 2;
  string node_id = 3;
  string error = 4;
}

// ---------------------------------------------------------------------------
// Distributed Events
// ---------------------------------------------------------------------------

message EventForward {
  string event_id = 1;
  string topic = 2;
  int32 kind = 3;
  google.protobuf.Timestamp ts = 4;
  google.protobuf.Struct payload = 5;
  string origin_node_id = 6;
  int32 ttl = 7;
}

message EventAck {
  string event_id = 1;
}

// ---------------------------------------------------------------------------
// Capability Query
// ---------------------------------------------------------------------------

message CapabilityQuery {
  string request_id = 1;
  string capability_name = 2;
}

message CapabilityResponse {
  string request_id = 1;
  bool available = 2;
  string node_id = 3;
  string address = 4;
}

// ---------------------------------------------------------------------------
// Query Forwarding -- RETIRED (#2814)
// ---------------------------------------------------------------------------
//
// QueryForward / QueryResponse carried a MemQL query from one node to another
// for execution, for the case where a client queried a node that did not own
// the target concept.
//
// The receive side is the only side that ever existed. No producer was ever
// built: nothing in this repo's history puts a QueryForward on a stream, and
// the sending half was always deferred. (Test fixtures on the abandoned
// issue-2814-queryforward-actor branch construct the message to drive this
// handler directly; none of them send it.) The routing stub that would have
// driven a real producer -- query_proxy.go, with RegisterConceptOwnership --
// resolved a target for the call site to log, and nothing more. ac3a751e
// ("simplify: drop per-node @visibility filtering + concept-ownership
// routing", 2026-05-16) deleted that stub as over-engineered, calling the
// proxy "log-only" and its deletion "a no-op behaviorally".
//
// So this handler had no caller it could ever have had, no production caller of
// the SetQueryExecutor seam, and -- since ac3a751e -- no registry to decide
// which node owns a concept. Ownership is routing rules plus build tags now
// (see docs/internal/design/extension-points.md).
//
// It was removed rather than repaired because the repair was unsafe to
// publish. The handler executed forwarded DSL on context.Background(), so it
// ran with no actor at all; propagating the caller's claims to fix that meant
// prescribing auth.ForwardedClaimsFromIdentity as the producer recipe, and
// that recipe cannot carry a badge grant's `class` / `role_ceiling`. Since
// applyBadgeRoleCeiling clamps only when class=="badge", a forwarded badge
// session resolved the operator's UNCLAMPED stored role -- an owner badged
// into a reader kiosk came back isClusterOwner=true on a surface that
// dispatches mutations and logic.
//
// The mesh authority-propagation contract belongs on #2876 -- the AiForward
// path, which unlike this one is live in production and carries the same
// missing-actor defect. That issue is PARKED as of this removal, and its one
// attempt was reverted for reintroducing the ceiling loss described above, so
// treat it as an open design problem rather than work in flight. See
// component/auth/forward.go for the constraints any such contract must
// satisfy. If concept-ownership routing is ever built, it needs that contract
// first, not this machinery back.

// ---------------------------------------------------------------------------
// AI / voice request forwarding
// ---------------------------------------------------------------------------

// AiForwardRequest carries an AI / voice envelope from a BFF node to a
// worker node that has the required provider registered. The body is the
// proto-serialized MemqlClientMessage the BFF originally received from
// its client -- the worker unmarshals it and dispatches to its local
// handler as if the client had connected to it directly.
//
// Using a byte-envelope here (rather than embedding each AI message
// type) keeps component/node/ independent of component/grpc/: the node
// layer just moves bytes; the grpc layer owns the wire-type semantics.
//
// `authority` is the MANDATORY authorization assertion (memql#3205). `auth`
// carries the originating principal's claims for `createdBy` ATTRIBUTION ONLY
// and is no longer an authorization input on the receiver -- it is derived from
// the same value as `authority` and cross-checked on receipt, so the two cannot
// drift.
message AiForwardRequest {
  string request_id = 1;
  map<string, string> auth = 2;
  reserved 3;
  reserved "partition";
  bytes memql_envelope = 4;  // Serialized memqlv1.MemqlClientMessage
  ForwardedAuthority authority = 5;
  // True iff sent via ForwardContinuation. Carried as a WIRE FACT because the
  // refusal shape must stay decidable even when memql_envelope fails to
  // unmarshal -- precisely the case where the payload type cannot be inspected.
  // The receiver prefers its OWN payload-class table whenever the envelope does
  // parse, and uses this only as a cross-check: a producer-set bool that
  // mislabelled an opener would hang that client forever.
  bool continuation = 6;
}

// ForwardedAuthority is the mandatory authorization assertion attached to every
// mesh forward (memql#3205). It carries the producer's ALREADY-RESOLVED,
// ALREADY-CLAMPED decision -- not the inputs to one. The receiver verifies it,
// binds it verbatim, and never re-resolves.
//
// "No badge" is the VALUE credential_class="user", never a missing key. That is
// the whole difference from the attempt refused as a net security regression,
// which carried two OPTIONAL claims whose absence was indistinguishable from
// "not a badge session".
//
// It lives on this node-layer message rather than on MemqlClientMessage
// deliberately: MemqlClientMessage is the CLIENT-facing wire type, where a
// browser can set any field, while AiForwardRequest is reachable only behind
// the class="node" stream interceptor.
//
// See component/auth/forward_authority.go for the verifier and its rule table,
// and docs/internal/design/mesh-forwarded-auth-contract.md for the design.
message ForwardedAuthority {
  string contract_version = 1;                 // "v1"; anything else is refused
  ForwardedPrincipalKind principal_kind = 2;
  string subject = 3;                          // AccessContext.UserId
  string primary_email = 4;                    // AccessContext.PrimaryEmail
  string role = 5;                             // AccessContext.Role -- ALREADY CLAMPED
  string identity_id = 6;                      // AccessContext.IdentityId
  string credential_class = 7;                 // never empty on a valid assertion
  string role_ceiling = 8;                     // non-empty IFF credential_class == "badge"
  int64 expires_at_unix = 9;                   // non-zero for a class that expires mid-stream
  string origin_node_id = 10;                  // audit only, never an input to a decision
  string origin_node_type = 11;                // audit only
  int64 asserted_at_unix = 12;                 // audit / clock-skew diagnostics

  // Display name, carried for PROVENANCE PARITY ONLY -- it feeds
  // component/metadata's identity.displayName, which the engine stamps onto
  // every row a mutation writes. Not an authorization input, and never read as
  // one: VerifyForwardedAuthority ignores both fields and the AccessContext it
  // returns has nowhere to put them.
  //
  // Present because dropping them silently changed what lands in audit
  // metadata: a row written by a worker on a forwarded turn omitted the name
  // that the same user's rows carry when written on the direct path, with
  // nothing in the data explaining the difference (memql#3221).
  //
  // If you are adding a field here, ask which of the two kinds it is. Every
  // field above is an authorization input the receiver binds; these two are
  // not, and the distinction is the only thing keeping them from becoming one
  // by accident.
  string first_name = 13;
  string last_name = 14;
}

enum ForwardedPrincipalKind {
  FORWARDED_PRINCIPAL_KIND_UNSPECIFIED = 0;    // always refused
  FORWARDED_PRINCIPAL_KIND_USER = 1;
  FORWARDED_PRINCIPAL_KIND_SYSTEM = 2;
}

// AiForwardResponse carries a worker's response back to the originating
// BFF. Streamed responses (e.g. aiChat with stream=true) send multiple
// messages with the same request_id. `done=true` marks the last one.
//
// `memql_server_msg` is a proto-serialized memqlv1.MemqlServerMessage
// (AiChunk / AiChatResult / AiSpeechResult / AiTranscribeResult /
// AiSuggestResult / ListToolsResult / CallToolResult / QueryError).
message AiForwardResponse {
  string request_id = 1;
  bytes memql_server_msg = 2;
  bool done = 3;
}

// AiForwardCancel signals the worker that the BFF's client cancelled
// the request (stream closed, explicit cancel message). The worker
// should stop producing responses for `request_id` and clean up.
message AiForwardCancel {
  string request_id = 1;
}

// ---------------------------------------------------------------------------
// Workbench forwarding
// ---------------------------------------------------------------------------
//
// WorkbenchForwardRequest carries an agent's workbenchHost.<action>
// dispatch from the agent node to the workbench node that holds the
// per-Plan workspace. Single round-trip semantics (no streaming);
// the agent's tool loop waits synchronously for the response.
//
// Unlike AiForward, this is a structured envelope (not a byte-wrapped
// MemqlClientMessage) because the workbench surface is a flat
// integration capability, not a gRPC message type. Args are encoded
// as JSON to keep the wire shape stable across action-specific arg
// variants without exploding the proto with one oneof per action.
//
// `authority` is the mandatory authorization assertion (memql#3205), and the
// workbench node refuses any envelope that does not carry a verifiable one.
//
// It replaces a `map<string, string> auth` that field 2 reserved below used to
// hold. That field's own doc comment claimed it "carries the originating
// principal's claims so the workbench node can reconstruct the actor context";
// nothing populated it and nothing read it, and the only reference to it
// anywhere in the tree was its generated getter (memql#3219). It is reserved
// rather than reused: a claims map cannot carry a role ceiling provably --
// "no badge" and "the key is missing" are the same value -- which is the
// property memql#3205 removed from the AI-forward path and memql#2814 removed
// from QueryForward.
//
// Unlike AiForwardRequest, this message carries NO attribution claims map
// beside the assertion. The receiver derives the createdBy claims from the
// authority itself (auth.ForwardedAuthority.Principal), so "claims without an
// authority" is inexpressible here rather than merely discouraged.
message WorkbenchForwardRequest {
  string request_id = 1;
  reserved 2;
  reserved "auth";
  reserved 3;
  reserved "partition";
  string plan_id = 4;
  string action = 5;
  bytes args_json = 6;
  string agent_id = 7;
  string task_id = 8;
  // Optional timeout hint; the workbench node clamps to its own caps.
  int32 timeout_sec = 9;
  ForwardedAuthority authority = 10;
}

// WorkbenchForwardResponse carries the dispatch result back to the
// agent node. `payload_json` is the JSON-marshalled dispatchResult
// shape ({ok, action, payload, errorCode, errorMessage}) the local
// path returns. Single message per request_id; no streaming.
message WorkbenchForwardResponse {
  string request_id = 1;
  bytes payload_json = 2;
  string error_code = 3;
  string error_message = 4;
}

// WorkbenchForwardCancel mirrors AiForwardCancel. The agent's tool
// loop fires it when the LLM call upstream is cancelled before the
// workbench finishes; the workbench should stop in-flight work
// for the request_id and free resources (kill exec, abort http_fetch).
message WorkbenchForwardCancel {
  string request_id = 1;
}

// ---------------------------------------------------------------------------
// Shutdown
// ---------------------------------------------------------------------------

message NodeShutdown {
  string reason = 1;
  int32 grace_seconds = 2;
}
