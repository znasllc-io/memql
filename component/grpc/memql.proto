}

message IdentityListMsg {
  string request_id = 1;
  string type = 2;                    // Filter by "human" or "synthetic"; empty = all
  string guardian_identity_id = 3;    // Filter by guardian
  bool active_only = 4;
}

message IdentityResult {
  string request_id = 1;
  bool success = 2;
  string error = 3;
  repeated IdentityInfo identities = 4;
}

message IdentityInfo {
  string id = 1;
  string type = 2;
  string first_name = 4;
  string last_name = 5;
  string display_name = 6;
  repeated string emails = 7;
  repeated string phones = 8;
  string avatar_url = 9;
  UserRole role = 10;
  repeated string group_ids = 11;
  bool active = 12;
  string guardian_identity_id = 13;
  bool guardian_approval_required = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp suspended_at = 16;
  string suspended_reason = 17;
}

message DelegationCreateMsg {
  string request_id = 1;
  string identity_id = 2;
  string agent_id = 3;
  UserRole role_ceiling = 4;
  repeated string scopes = 5;
  google.protobuf.Timestamp expires_at = 6;
  string note = 7;
}

message DelegationRevokeMsg {
  string request_id = 1;
  string delegation_id = 2;
}

message DelegationListMsg {
  string request_id = 1;
  string agent_id = 2;
  string identity_id = 3;
  bool active_only = 4;
}

message DelegationResult {
  string request_id = 1;
  bool success = 2;
  string error = 3;
  repeated DelegationInfo delegations = 4;
}

message DelegationInfo {
  string id = 1;
  string identity_id = 2;
  string identity_subject = 3;
  string identity_type = 4;
  string agent_id = 5;
  UserRole role_ceiling = 6;
  repeated string scopes = 7;
  google.protobuf.Timestamp expires_at = 8;
  bool active = 9;
  string created_by_subject = 10;
  string approved_by_subject = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp revoked_at = 13;
  string revoked_by_subject = 14;
  string note = 15;
}

// -----------------------------------------------------------------------------
// MemQL Sense -- Language Intelligence
// -----------------------------------------------------------------------------

message SensePosition {
  int32 line = 1;    // 1-indexed line number
  int32 column = 2;  // 1-indexed column number
}

message SenseRange {
  SensePosition start = 1;
  SensePosition end = 2;
}

// Tokenize -- returns semantic tokens for syntax highlighting.
message SenseTokenizeMsg {
  string request_id = 1;
  string source = 2;
}

message SenseTokenizeResult {
  string request_id = 1;
  repeated SenseToken tokens = 2;
}

message SenseToken {
  string type = 1;      // keyword, identifier, string, number, operator, annotation, comment, punctuation, concept
  string literal = 2;
  SenseRange range = 3;
}

// Complete -- returns completion suggestions at a cursor position.
message SenseCompleteMsg {
  string request_id = 1;
  string source = 2;
  SensePosition cursor = 3;
  string file_path = 4;  // optional context hint
}

message SenseCompleteResult {
  string request_id = 1;
  repeated SenseCompletionItem items = 2;
}

message SenseCompletionItem {
  string label = 1;          // display text
  string kind = 2;           // keyword, function, concept, annotation, builtin, spec, shape, provider, tool, field, snippet, receiver
  string detail = 3;         // short type/signature info
  string documentation = 4;  // longer description (markdown)
  string insert_text = 5;    // text to insert (may differ from label)
  int32 sort_priority = 6;   // lower = higher priority
}

// Diagnose -- returns errors and warnings for a document.
message SenseDiagnoseMsg {
  string request_id = 1;
  string source = 2;
  string file_path = 3;  // optional, helps resolve version prefix
}

message SenseDiagnoseResult {
  string request_id = 1;
  repeated SenseDiagnostic diagnostics = 2;
}

enum SenseSeverity {
  SENSE_SEVERITY_UNSPECIFIED = 0;
  SENSE_SEVERITY_ERROR = 1;
  SENSE_SEVERITY_WARNING = 2;
  SENSE_SEVERITY_INFO = 3;
  SENSE_SEVERITY_HINT = 4;
}

message SenseDiagnostic {
  SenseRange range = 1;
  SenseSeverity severity = 2;
  string message = 3;
  string code = 4;  // e.g., "unknown-function", "parse-error"
}

// Hover -- returns information about a symbol at a position.
message SenseHoverMsg {
  string request_id = 1;
  string source = 2;
  SensePosition position = 3;
}

message SenseHoverResult {
  string request_id = 1;
  string contents = 2;   // markdown formatted
  SenseRange range = 3;  // range of the hovered symbol
}

// SignatureHelp -- returns function signature help at a position.
message SenseSignatureHelpMsg {
  string request_id = 1;
  string source = 2;
  SensePosition position = 3;
}

message SenseSignatureHelpResult {
  string request_id = 1;
  repeated SenseSignature signatures = 2;
  int32 active_signature = 3;
  int32 active_parameter = 4;
}

message SenseSignature {
  string label = 1;          // full signature string
  string documentation = 2;  // description
  repeated SenseParameter parameters = 3;
}

message SenseParameter {
  string label = 1;          // parameter name
  string documentation = 2;  // parameter description
}

// -----------------------------------------------------------------------------
// Pack Browser -- read-only DSL pack enumeration (memql#2127 / B1)
// -----------------------------------------------------------------------------
//
// Surfaces the embedded + RegisterTree'd .memql tree (and the
// MEMQL_DSL_PATH overlay) to the cockpit so an operator can browse the
// packs a node carries. Read-only: there is no mutation message here.

// ListPackDomainsMsg requests the set of browsable DSL domains a node
// carries (embedded core domains + plugin-registered pack domains).
message ListPackDomainsMsg {
  string request_id = 1;
}

message ListPackDomainsResult {
  string request_id = 1;
  repeated PackDomain domains = 2;
}

message PackDomain {
  string name = 1;        // top-level namespace (e.g. "cognition", "copresent")
  string origin = 2;      // "embedded" | "pack:<domain>"
  int32 file_count = 3;   // recursive count of browsable files under the domain
}

// ListPackFilesMsg requests the browsable files under a single domain.
message ListPackFilesMsg {
  string request_id = 1;
  string domain = 2;
}

message ListPackFilesResult {
  string request_id = 1;
  string domain = 2;
  repeated PackFile files = 3;
}

message PackFile {
  string path = 1;  // relative to the domain root (e.g. "queries.memql", "prompts/x.tmpl")
  int64 size = 2;   // byte length
}

// ReadPackFileMsg fetches a single file's source.
message ReadPackFileMsg {
  string request_id = 1;
  string domain = 2;
  string path = 3;  // relative to the domain root (as returned by ListPackFiles)
}

message ReadPackFileResult {
  string request_id = 1;
  string domain = 2;
  string path = 3;
  string source = 4;   // file source (UTF-8)
  string origin = 5;   // "embedded" | "pack:<domain>" | "disk:<path>"
  bool found = 6;      // false when the file does not exist
}

// -----------------------------------------------------------------------------
// Authoring -- validate + session-define a user bundle (issue #2128 / C1)
// -----------------------------------------------------------------------------
//
// The cockpit-facing gRPC surface over the engine's existing authoring
// machinery (component/memql/authoring_sandbox.go + authoring_session.go),
// mirroring the MCP `define` tool's wiring (component/mcp/tool_surface.go).
// `sources` is a .memql bundle string (one or more constructs concatenated);
// the engine slices it into (kind, name, source) constructs internally.

// AuthoringDiagnostic is the per-construct compile-and-bind result, the wire
// form of memql.SandboxDiagnostic. `skipped` constructs (a kind this pass does
// not yet compile) report ok=false, skipped=true and do NOT fail the bundle.
message AuthoringDiagnostic {
  string name = 1;
  string kind = 2;
  bool ok = 3;
  bool skipped = 4;
  string error = 5;  // compile/bind failure or skip reason; empty on success
}

// AuthoringConstruct names one construct that a session-define registered.
message AuthoringConstruct {
  string kind = 1;
  string name = 2;
}

// AuthoringValidateBundleMsg requests a Gate-1 sandbox compile + bind of the
// bundle. NO engine mutation -- pure validation against a read-only clone of
// the live registry.
message AuthoringValidateBundleMsg {
  string request_id = 1;
  string sources = 2;  // .memql bundle source
}

message AuthoringValidateBundleResult {
  string request_id = 1;
  bool ok = 2;  // true only when every non-skipped construct compiled cleanly
  repeated AuthoringDiagnostic diagnostics = 3;
}

// AuthoringSessionDefineBundleMsg validates the bundle, then session-defines it
// into the caller's owner-scoped authored registry (stream-scoped, non-durable).
// Defined function-family constructs become callable by name within the session,
// never shadowing core, dropped when the stream ends.
message AuthoringSessionDefineBundleMsg {
  string request_id = 1;
  string sources = 2;  // .memql bundle source
}

message AuthoringSessionDefineBundleResult {
  string request_id = 1;
  bool ok = 2;
  repeated AuthoringConstruct defined = 3;     // constructs that became callable
  repeated AuthoringDiagnostic diagnostics = 4;
  string error = 5;  // non-empty when the bundle was rejected (validation or register)
}

// -----------------------------------------------------------------------------
// DSL spec export -- portable language-intelligence surface (memql#2125 / A4)
// -----------------------------------------------------------------------------
//
// Exports component/language/dslspec.Build() as portable JSON so the cockpit
// and a future web/Monaco editor consume the EXACT same authoring surface that
// memQL Sense is driven from: the top-level constructs, keywords, operators,
// field types, per-construct annotation legality, and "legal-next" completion
// rules. Read-only -- there is no spec mutation path; the spec is assembled
// from the engine's own grammar tables + annotation registry.

// DslSpecMsg requests the serialized DSL spec. The body is intentionally empty
// -- the spec is whole and node-agnostic; a future negotiated version field can
// be added without breaking the wire (the reply already carries the version).
message DslSpecMsg {
  string request_id = 1;
}

// DslSpecResult carries the spec as a JSON document plus its schema version.
//
// `spec_json` is the indented JSON produced by dslspec.(*Spec).JSON() -- the
// portable form a Monaco/CodeMirror grammar is generated from. Its top-level
// shape is { version, constructs[], annotations[], keywords[], operators[],
// fieldTypes[], nextRules[] } (see component/language/dslspec/spec.go for the
// per-element schemas). `version` mirrors the embedded spec.version
// (dslspec.SpecVersion) at the envelope level so a consumer can check the
// contract version WITHOUT parsing the document.
message DslSpecResult {
  string request_id = 1;
  string spec_json = 2;  // dslspec.(*Spec).JSON() -- indented JSON document
  string version = 3;    // schema version (dslspec.SpecVersion), echoed for cheap checks
}

