// ConceptsListMsg requests the full concept registry with event topics.
message ConceptsListMsg {
  string request_id = 1;
}

message ConceptsListResult {
  string request_id = 1;
  repeated ConceptInfo concepts = 2;
  repeated string base_topics = 3;
  repeated string system_topics = 4;
}

message ConceptInfo {
  string id = 1;
  string version = 2;
  string domain = 3;
  string entity = 4;
  string description = 5;
  string type = 6;

  // DisplayCard carries the per-concept rendering hints declared
  // via the `@displayCard(...)` DSL annotation. Concept-agnostic
  // clients (cockpit's Concepts tab, future generic browsers)
  // project rows through these slot names instead of carrying
  // per-concept rendering code. Absent when the concept didn't
  // declare the annotation -- clients should fall back to a
  // generic id+intrinsics rendering. See memql#160.
