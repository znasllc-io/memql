syntax = "proto3";

package znasllc.memql.v1;

option go_package = "github.com/znasllc-io/memql/grpc/gen;memqlv1";

//go:generate protoc --proto_path=. --go_out=gen --go_opt=paths=source_relative --go-grpc_out=gen --go-grpc_opt=paths=source_relative memql.proto

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service MemqlService {
  // Single multiplexed bidirectional streaming RPC for all MemQL operations.
  rpc Stream(stream MemqlClientMessage) returns (stream MemqlServerMessage);
}

// -----------------------------------------------------------------------------
// Envelopes
// -----------------------------------------------------------------------------

// Provenance is the engine-stamped origin metadata stored as an
// intrinsic on every MemoryNodes row. Carried on the envelope so
// cross-node forwarders (proxyAi / AiForward / NodeService) can
// propagate the caller's originating attribution across hops --
// otherwise a row written on the receiver gets stamped with the
// receiver's default Mutation(name) and loses the "kicked off by
// seed X / automation Y / etc." context.
//
// `kind` is a closed enum (engine-validated): seed | mutation |
// automation | direct | system | migration. See
// component/provenance/provenance.go for the Go-side canonical
// values + validator.
message Provenance {
  string kind    = 1;
  string name    = 2;
  string trigger = 3;
  string via     = 4;
}

message MemqlClientMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;
  string partition = 4;
  // Caller-stamped provenance for cross-node propagation. When set,
  // the receiver re-hydrates ctx so any rows the request writes are
  // attributed to the originator, not the receiver's default. When
  // unset the engine's auto-stamping path applies (Mutation /
  // Direct defaults).
  Provenance provenance = 100;

  oneof payload {
    ClientHello client_hello = 10;
    ExecuteQueryMsg execute_query = 11;
    CancelRequestMsg cancel_request = 12;
    SubscribeMsg subscribe = 13;
    UnsubscribeMsg unsubscribe = 14;
    AckMsg ack = 15;
    // MCP Tool operations
    ListToolsMsg list_tools = 16;
    CallToolMsg call_tool = 17;
    // AI operations
    AiChatMsg ai_chat = 18;
    AiSpeechMsg ai_speech = 19;
    AiTranscribeMsg ai_transcribe = 20;
    AiSuggestMsg ai_suggest = 21;
    // Identity and delegation operations
    IdentityCreateMsg identity_create = 22;
    IdentityUpdateMsg identity_update = 23;
    IdentityListMsg identity_list = 24;
    DelegationCreateMsg delegation_create = 25;
    DelegationRevokeMsg delegation_revoke = 26;
    DelegationListMsg delegation_list = 27;
    // MemQL Sense -- language intelligence
    SenseTokenizeMsg sense_tokenize = 30;
    SenseCompleteMsg sense_complete = 31;
    SenseDiagnoseMsg sense_diagnose = 32;
    SenseHoverMsg sense_hover = 33;
    SenseSignatureHelpMsg sense_signature_help = 34;
    // Polyphon -- multi-agent voice
    PolyphonRoomTokenMsg polyphon_room_token = 35;
    PolyphonStatusMsg polyphon_status = 36;
    PolyphonUtteranceMsg polyphon_utterance = 37;
    // Concepts -- schema metadata
    ConceptsListMsg concepts_list = 38;
    ConceptsSubscribeMsg concepts_subscribe = 39;
    // Access / authorization
    MyAccessMsg my_access = 40;
    // Streaming transcription (multi-message, keyed by request_id).
    // Start opens a provider session; Chunk pushes audio bytes; End
    // closes the session (or cancels). Server replies with repeated
    // AiTranscribeStreamDelta + final AiTranscribeStreamComplete.
    AiTranscribeStreamStart ai_transcribe_stream_start = 41;
    AiTranscribeStreamChunk ai_transcribe_stream_chunk = 42;
    AiTranscribeStreamEnd ai_transcribe_stream_end = 43;
    // Agent turn generation (cognition -> agent via NodeService.AiForwardRequest).
    // Agent node handles this message exactly as if a client had connected
    // directly; cognition wraps the serialized MemqlClientMessage in a
    // NodeClientMessage{AiForwardRequest} and ships it over the inter-node
    // stream. Streamed replies come back as AgentGenerateTurnDelta (N)
    // followed by AgentGenerateTurnComplete (1).
    AgentGenerateTurnMsg agent_generate_turn = 44;
    // Result of a ClientToolCall that the server emitted earlier. The
    // agent microservice parks its tool loop on a per-call channel
    // keyed by call_id; this message unblocks it and feeds the tool
    // result back into the streaming reply.
    ClientToolResult client_tool_result = 45;
    // Guest invite by email. The authenticated space owner sends this
    // to create an invitation record and deliver the email in one
    // transactional op. See SendGuestInviteResult for the reply and
    // docs/planning/GUEST_INVITE_SPECS.md for the full flow.
    SendGuestInviteMsg send_guest_invite = 46;
    // Public (unauthenticated) token resolution. The /join/<token>
    // landing page calls this to render space + inviter metadata
    // before asking the guest for a display name.
    ResolveGuestInviteMsg resolve_guest_invite = 47;
    // Guest-side accept + participant-create. Atomically marks the
    // invitation accepted and creates the guest's Participant record.
    // Called from the /join/<token> page after the guest confirms
    // their display name. Authenticated via `Authorization: Guest
    // <token>` which the stream interceptor resolves to a claims map
    // carrying the invitation + space IDs.
    JoinSpaceAsGuestMsg join_space_as_guest = 48;
    // Inviter-side revoke for a guest invitation. Server-side lookup
    // means we don't depend on the caller passing every required
    // field (kind, tokenHash, etc.), which was unreliable when the
    // shared respondToInvitation path was reused for guest rows.
    CancelGuestInviteMsg cancel_guest_invite = 49;
    // Re-send the invitation email for an EXISTING guest invitation
    // without creating a new record. Server looks up the invitation,
    // reads the stored plain token, and re-sends the same
    // /join/<token> URL. Used by the "resend email" button.
    ResendGuestInviteEmailMsg resend_guest_invite_email = 50;
    // Per-device sign-out. Marks the v1:identity:authSession row tied
    // to the caller's current bearer token as revoked, so the next
    // request from another tab/device using the same token is rejected
    // by the auth middleware. Other sessions for the same user are
    // unaffected. See RevokeAllSessionsMsg for the cross-device variant.
    RevokeCurrentSessionMsg revoke_current_session = 51;
    // Cross-device sign-out. Marks every v1:identity:authSession row
    // owned by the caller as revoked. Use this when the user suspects
    // a session is compromised.
    RevokeAllSessionsMsg revoke_all_sessions = 52;
    // Worker-token issuance. The frontend's AddWorkerModal calls
    // this to mint an mql_wkr_<...> credential the user pastes into
    // their cockpit-worker config. Plain token is returned in the
    // response and never persisted server-side -- only its SHA-256
    // hash lands on a v1:identity:identity row of identityType=
    // "worker_token".
    CreateWorkerTokenMsg create_worker_token = 53;
    // Worker-token revocation. Soft-deletes the v1:identity:identity
    // row by flipping active=false. The interceptor refuses any
    // future connect attempts with this token.
    RevokeWorkerTokenMsg revoke_worker_token = 54;
    // Worker-pairing-code create + redeem live on the identity
    // service's HTTP surface (POST /pair/codes, POST /pair/redeem)
    // -- pairing is fundamentally an auth operation, so it lives
    // alongside magic-link / OAuth / JWKS rather than on the BFF's
    // gRPC plane.
    // -------------------------------------------------------------
    // Realtime Voice + Video architecture (Initiative C, 2026-05).
    // -------------------------------------------------------------
    // The Python voice-agent process (LiveKit Agents 1.5) speaks
    // these messages over MemqlService.Stream. Authenticated via a
    // service-account JWT; the stream interceptor restricts that
    // identity-type to ONLY this group of message types -- it has
    // no surface for direct graph writes.
    //
    // Flow per utterance:
    //   1. voice-agent emits VoiceAgentPartialTranscript (N times).
    //   2. voice-agent emits VoiceAgentFinalTranscript (once).
    //   3. voice-agent emits VoiceAgentTurnRequest to ask the GA to
    //      respond. Server replies with N VoiceAgentTurnDelta
    //      messages and one terminal VoiceAgentTurnComplete.
    VoiceAgentPartialTranscript voice_agent_partial_transcript = 60;
    VoiceAgentFinalTranscript voice_agent_final_transcript = 61;
    VoiceAgentTurnRequest voice_agent_turn_request = 62;
    VoiceAgentSessionStart voice_agent_session_start = 63;
    VoiceAgentSessionEnd voice_agent_session_end = 64;
    // EvaluatePolicy -- runtime invocation of a `func (Policy)`
    // declared under dsl/v1/policies/{core,bff}/...  The handler
    // requires the policy to carry @frontend_visible AND tier=bff;
    // anything else is rejected with POLICY_NOT_FRONTEND_VISIBLE so
    // a UI cannot reach into core/auth or core/partition decisions.
    EvaluatePolicyMsg evaluate_policy = 70;
    // RotateAuth -- swap the bearer token on a live stream without
    // tearing it down. Long-lived stream clients (memql-cockpit
    // most notably) call this from their background token-refresh
    // path so admin-side revocation / access changes propagate to
    // an in-flight session in O(seconds) rather than O(stream
    // lifetime). The server re-verifies the presented token, reloads
    // the partition ACL, and swaps streamSession.identity + .access
    // atomically. See handleRotateAuth.
    RotateAuthMsg rotate_auth = 71;
  }
}

message MemqlServerMessage {
  string message_id = 1;
  string correlate_to = 2;
  map<string, string> metadata = 3;

  oneof payload {
    ServerHello server_hello = 10;
    QueryResultChunk query_result = 11;
    QueryErrorMsg query_error = 12;
    EventNotification event = 20;
    AiStreamChunk ai_chunk = 30;
    HeartbeatMsg heartbeat = 40;
    // MCP Tool results
    ListToolsResult list_tools_result = 50;
    CallToolResult call_tool_result = 51;
    // AI results
    AiChatResult ai_chat_result = 55;
    AiSpeechResult ai_speech_result = 56;
    AiTranscribeResult ai_transcribe_result = 57;
    AiSuggestResult ai_suggest_result = 58;
    // Identity and delegation results
    IdentityResult identity_result = 60;
    DelegationResult delegation_result = 61;
    // MemQL Sense results
    SenseTokenizeResult sense_tokenize_result = 70;
    SenseCompleteResult sense_complete_result = 71;
    SenseDiagnoseResult sense_diagnose_result = 72;
    SenseHoverResult sense_hover_result = 73;
    SenseSignatureHelpResult sense_signature_help_result = 74;
    // Polyphon results
    PolyphonRoomTokenResult polyphon_room_token_result = 75;
    PolyphonStatusResult polyphon_status_result = 76;
    PolyphonUtteranceResult polyphon_utterance_result = 77;
    // Concepts results
    ConceptsListResult concepts_list_result = 78;
    ConceptsSubscribeResult concepts_subscribe_result = 79;
    // Access / authorization
    MyAccessResult my_access_result = 80;
    // Streaming transcription replies (see AiTranscribeStreamStart).
    // Delta fires repeatedly with the full accumulated text; Complete
    // is the terminal message carrying the final transcript.
    AiTranscribeStreamDelta ai_transcribe_stream_delta = 81;
    AiTranscribeStreamComplete ai_transcribe_stream_complete = 82;
    // Agent turn streaming replies (see AgentGenerateTurnMsg).
    AgentGenerateTurnDelta agent_generate_turn_delta = 83;
    AgentGenerateTurnComplete agent_generate_turn_complete = 84;
    // Client-executed tool call. When the agent loop resolves a tool
    // whose ToolDefinition.client_execution is true, instead of
    // executing locally it emits this envelope on the stream and
    // parks the loop on a per-call channel keyed by call_id. The
    // client dispatches the call against its local Operator, runs
    // it, and responds with ClientToolResult.
    ClientToolCall client_tool_call = 85;
    // Guest invite results (see SendGuestInviteMsg / ResolveGuestInviteMsg).
    SendGuestInviteResult send_guest_invite_result = 86;
    ResolveGuestInviteResult resolve_guest_invite_result = 87;
    JoinSpaceAsGuestResult join_space_as_guest_result = 88;
    CancelGuestInviteResult cancel_guest_invite_result = 89;
    ResendGuestInviteEmailResult resend_guest_invite_email_result = 90;
    // Session-revocation replies (see RevokeCurrentSessionMsg / RevokeAllSessionsMsg).
    RevokeCurrentSessionResult revoke_current_session_result = 91;
    RevokeAllSessionsResult revoke_all_sessions_result = 92;
    // Worker-token mint / revoke replies.
    CreateWorkerTokenResult create_worker_token_result = 93;
    RevokeWorkerTokenResult revoke_worker_token_result = 94;
    // Voice-agent replies (Initiative C, 2026-05).
    // PartialAck / FinalAck are confirmation-only; the real value of
    // the partial/final flow is the v1:cognition:utterance.partial
    // graph event and the inserted utterance row, which the frontend
    // subscribes to independently. Acks are kept so the voice-agent
    // can correlate retries.
    VoiceAgentPartialAck voice_agent_partial_ack = 95;
    VoiceAgentFinalAck voice_agent_final_ack = 96;
    VoiceAgentTurnDelta voice_agent_turn_delta = 97;
    VoiceAgentTurnComplete voice_agent_turn_complete = 98;
    VoiceAgentSessionAck voice_agent_session_ack = 99;
    // Server-pushed "speak this text" command. Emitted by BFF when an
    // SI reply lands for a space and audio output is enabled
    // (always_on override). voice-agent handles by calling
    // AgentSession.say(text) so Aura-2 synthesizes and publishes
    // alongside the existing TurnRequest path.
    VoiceAgentSpeak voice_agent_speak = 100;
    // EvaluatePolicy reply -- carries the policy result, the
    // structured trace tree (when requested), and a typed error
    // string for the typical rejection cases (unknown policy, not
    // frontend-visible, tier mismatch, runtime error).
    EvaluatePolicyResult evaluate_policy_result = 110;
    // RotateAuth reply (see RotateAuthMsg). `ok=true` means the new
    // bearer was accepted; subsequent envelopes on this stream are
    // checked against the rotated identity. `ok=false` carries an
    // RFC-6749-shaped error / error_description ("invalid_token",
    // "verifier_unconfigured", "access_load_failed") so the client
    // can decide whether to retry or fall back to a fresh dial.
    // The stream remains open in either case -- a rejected rotation
    // does NOT tear down the existing session.
    RotateAuthResult rotate_auth_result = 111;
  }
}

// -----------------------------------------------------------------------------
// Roles
// -----------------------------------------------------------------------------

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_OWNER = 1;
  USER_ROLE_ADMIN = 2;
  USER_ROLE_WRITER = 3;
  USER_ROLE_READER = 4;
}

// -----------------------------------------------------------------------------
// Handshake / control
// -----------------------------------------------------------------------------

message ClientHello {
  string client_id = 1;
  string sdk_name = 2;
  string sdk_version = 3;
}

message ServerHello {
  string node_id = 1;
  string version = 2;
}

message HeartbeatMsg {
  google.protobuf.Timestamp ts = 1;
}

message AckMsg {
  string acked_message_id = 1;
}

// -----------------------------------------------------------------------------
// Queries
// -----------------------------------------------------------------------------

message ExecuteQueryMsg {
  string request_id = 1;
  string query = 2;
  google.protobuf.Struct variables = 3;
  // Client-provided ID for optimistic update reconciliation.
  // Echoed back in ResultMeta.client_id along with the server-generated ID.
  string client_id = 4;
}

message CancelRequestMsg {
  string request_id = 1;
}

message QueryResultChunk {
  string request_id = 1;
  Result result = 2;
  bool done = 3;
}

message QueryErrorMsg {
  string request_id = 1;
  QueryError error = 2;
}

// -----------------------------------------------------------------------------
// Subscriptions
// -----------------------------------------------------------------------------

message SubscribeMsg {
  string subscription_id = 1;
  SubscriptionKind kind = 2;
  string filter = 3;
  google.protobuf.Struct config = 4;
}

message UnsubscribeMsg {
  string subscription_id = 1;
}

enum SubscriptionKind {
  SUBSCRIPTION_KIND_UNSPECIFIED = 0;
  SUBSCRIPTION_KIND_TELEMETRY = 100;
  SUBSCRIPTION_KIND_MESSAGE = 200;
  SUBSCRIPTION_KIND_QUERY_SPEC = 300;
  SUBSCRIPTION_KIND_AI_STREAM = 400;
  SUBSCRIPTION_KIND_GRAPH_EVENTS = 500;
  SUBSCRIPTION_KIND_DOMAIN_EVENTS = 550;
  SUBSCRIPTION_KIND_AUTOMATION_EVENTS = 600;
  SUBSCRIPTION_KIND_ALL = 700;
}

message EventNotification {
  string subscription_id = 1;
  EventKind kind = 2;
  google.protobuf.Timestamp ts = 3;
  google.protobuf.Struct payload = 4;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // Telemetry events (100s)
  EVENT_KIND_TELEMETRY = 100;
  // Message events (200s)
  EVENT_KIND_MESSAGE = 200;
  // Graph events (300s)
  EVENT_KIND_GRAPH_UPDATE = 300;
  EVENT_KIND_NODE_CREATED = 301;
  EVENT_KIND_NODE_DELETED = 302;
  EVENT_KIND_NODE_UPDATED = 303;
  // Query events (400s)
  EVENT_KIND_QUERY_EXECUTED = 400;
  // AI events (500s)
  EVENT_KIND_AI_EVENT = 500;
  EVENT_KIND_AI_COMPLETION_STARTED = 501;
  EVENT_KIND_AI_COMPLETION_FINISHED = 502;
  EVENT_KIND_AI_COMPLETION_ERROR = 503;
  // Session events (600s)
  EVENT_KIND_SESSION_OPENED = 600;
  EVENT_KIND_SESSION_CLOSED = 601;
  // Automation events (700s)
  EVENT_KIND_AUTOMATION_STARTED = 700;
  EVENT_KIND_AUTOMATION_COMPLETED = 701;
  EVENT_KIND_AUTOMATION_FAILED = 702;
  EVENT_KIND_AUTOMATION_STEP_STARTED = 703;
  EVENT_KIND_AUTOMATION_STEP_COMPLETED = 704;
  EVENT_KIND_AUTOMATION_STEP_FAILED = 705;
  // MCP Tool events (800s)
  EVENT_KIND_TOOL_CALLED = 800;
  EVENT_KIND_TOOL_COMPLETED = 801;
  EVENT_KIND_TOOL_FAILED = 802;
}

// -----------------------------------------------------------------------------
// AI streaming
// -----------------------------------------------------------------------------

message AiStreamChunk {
  string stream_id = 1;
  string provider = 2;
  string request_id = 3;
  int64 index = 4;

  oneof chunk {
    string text_delta = 10;
    google.protobuf.Struct json_delta = 11;
    google.protobuf.Struct metadata = 12;
  }

  bool done = 20;
}

// -----------------------------------------------------------------------------
// Result data
// -----------------------------------------------------------------------------

message Result {
  GraphBundle bundle = 1;
  repeated google.protobuf.Value data = 2;
  ResultMeta meta = 3;
}

// ResultMeta contains pagination and performance metadata for query results.
message ResultMeta {
  // Total count of matching records (when known/cheap to compute).
  // Omitted when count is unknown or expensive to compute.
  optional int64 count = 1;
  
  // Whether there are more results beyond the current page.
  bool has_more = 2;
  
  // Cursor for fetching the next page of results.
  // Empty if no more results or cursor-based pagination not used.
  string cursor = 3;
  
  // Query execution time in milliseconds.
  int64 took_ms = 4;
  
  // Client-provided ID echoed back (for optimistic update reconciliation).
  string client_id = 5;
  
  // Server-generated ID (for optimistic update reconciliation).
  string server_id = 6;
  
  // Data version/generation (useful for optimistic concurrency).
  int64 version = 7;
}

message QueryError {
  string code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

message GraphBundle {
  repeated MemoryNode nodes = 1;
  repeated GraphEdge edges = 2;
  repeated string root_ids = 3;
}

message MemoryNode {
  string id = 1;
  string concept = 2;
  string type = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Struct payload = 6;
  google.protobuf.Struct schema = 7;
  string partition = 8;
  google.protobuf.Struct metadata = 9;
  // Engine-stamped origin metadata; intrinsic alongside id /
  // created_by / created_at. Required on every row at the DB layer
  // (NOT NULL JSONB column). See message Provenance above for shape
  // and component/provenance for the canonical Go values + validator.
  Provenance provenance = 10;
}

message GraphEdge {
  string type = 1;
  string from_id = 2;
  string to_id = 3;
  int32 depth = 4;
}

// -----------------------------------------------------------------------------
// MCP Tools (Model Context Protocol compatible)
// -----------------------------------------------------------------------------

// ListToolsMsg requests available tools (MCP tools/list equivalent).
message ListToolsMsg {
  string request_id = 1;
  // Optional cursor for pagination
  string cursor = 2;
}

// ListToolsResult returns available tools (MCP tools/list response equivalent).
message ListToolsResult {
  string request_id = 1;
  repeated ToolDefinition tools = 2;
  // Optional cursor for next page (empty if no more results)
  string next_cursor = 3;
}

// ToolDefinition describes an available tool (MCP Tool schema compatible).
message ToolDefinition {
  // Unique tool name (camelCase identifier)
  string name = 1;
  // Human-readable description of what the tool does
  string description = 2;
  // JSON Schema describing the tool's input parameters (as JSON string)
  string input_schema = 3;
  // When true, the tool is executed by the connected client (not the
  // backend). The agent loop will emit a ClientToolCall envelope and
  // await the matching ClientToolResult instead of running the tool
  // locally. Used by the CoPresent Operator primitive (ui.*, space.*,
  // agent.updateSelf) where the tool affects the browser UI.
  bool client_execution = 4;
  // Optional scopes the tool requires (e.g. "read", "navigate",
  // "highlight", "create", "update", "delete", "identity", "billing").
  // The caller's granted scope set must be a superset before dispatch.
  // Scopes live alongside the registry-level deny-list / per-agent role
  // gating as the defense-in-depth middle layer.
  repeated string scopes = 5;
}

// CallToolMsg executes a tool (MCP tools/call equivalent).
message CallToolMsg {
  string request_id = 1;
  // Name of the tool to call
  string name = 2;
  // Arguments as a Struct (JSON object)
  google.protobuf.Struct arguments = 3;
}

// CallToolResult returns tool execution result (MCP tools/call response equivalent).
message CallToolResult {
  string request_id = 1;
  // Content items returned by the tool
  repeated ToolResultContent content = 2;
  // Indicates if the result represents an error
  bool is_error = 3;
}

// ToolResultContent represents a single piece of content in a tool result.
message ToolResultContent {
  // Content type: "text", "image", "resource"
  string type = 1;
  // Text content (for type "text")
  string text = 2;
  // MIME type (for type "image" or "resource")
  string mime_type = 3;
  // Base64-encoded data (for type "image")
  string data = 4;
  // Resource URI (for type "resource")
  string uri = 5;
}

// ClientToolCall is emitted by the server when the agent loop resolves
// a tool marked client_execution=true. The connected client is expected
// to dispatch the call locally and reply with ClientToolResult bearing
// the same call_id. See MemqlServerMessage.client_tool_call.
message ClientToolCall {
  // Unique per-call correlation ID. The agent loop uses this to route
  // the matching ClientToolResult back to the parked tool call.
  string call_id = 1;
  // Optional grouping ID of the AgentGenerateTurn that owns this call.
  // Lets the client render per-turn progress and cancel in-flight calls
  // when the enclosing turn is cancelled.
  string turn_id = 2;
  // The v1:agents:agent (or equivalent) ID of the caller.
  string agent_id = 3;
  // Tool name as registered in the tool registry.
  string tool_name = 4;
  // Tool arguments (JSON string). Matches CallToolMsg semantics.
  string arguments_json = 5;
  // Deadline the server is willing to wait for a ClientToolResult. If
  // the client cannot complete within the budget it should reply with
  // is_error=true + a descriptive error_message rather than silently
  // timing out, so the agent reasoning trace stays coherent.
  int32 timeout_ms = 6;
}

// ClientToolResult is the client's reply to a ClientToolCall, carrying
// the outcome of the locally-executed tool. The agent loop matches on
// call_id and unblocks the parked tool call before resuming the
// streaming reply.
message ClientToolResult {
  // Matches ClientToolCall.call_id.
  string call_id = 1;
  // Same shape as CallToolResult.content.
  repeated ToolResultContent content = 2;
  // True if execution failed. The agent loop surfaces this to the
  // LLM so it can decide whether to retry, choose a different tool,
  // or abandon the step.
  bool is_error = 3;
  // Human-readable error message when is_error is true.
  string error_message = 4;
}

// -----------------------------------------------------------------------------
// AI Operations
// -----------------------------------------------------------------------------

message AiChatMsg {
  string request_id = 1;
  repeated AiChatMessage messages = 2;
  string provider = 3;
  bool stream = 4;
}

message AiChatMessage {
  string role = 1;
  string content = 2;
  string name = 3;
}

message AiChatResult {
  string request_id = 1;
  AiChatMessage message = 2;
}

message AiSpeechMsg {
  string request_id = 1;
  string input = 2;
  string voice = 3;
  string format = 4;
  string provider = 5;
}

message AiSpeechResult {
  string request_id = 1;
  bytes audio = 2;
  string format = 3;
}

message AiTranscribeMsg {
  string request_id = 1;
  string audio = 2;
  string mime_type = 3;
}

message AiTranscribeResult {
  string request_id = 1;
  string text = 2;
}

// Streaming transcription: Start / Chunk / End (client -> server).
// All messages in a stream share the same request_id. Opening two
// streams with the same request_id is an error.
message AiTranscribeStreamStart {
  string request_id = 1;
  string format = 2;           // "pcm16", "opus", "webm", "wav", ...
  int32 sample_rate = 3;       // e.g. 16000
  int32 channels = 4;          // 1 (mono) or 2 (stereo)
  string language_hint = 5;    // optional ISO-639-1 code (e.g. "en")
  string provider = 6;         // optional, e.g. "openai-realtime" or "openai-whisper" -- overrides default. Stage 2 of the Deepgram migration adds "deepgram".
}

message AiTranscribeStreamChunk {
  string request_id = 1;
  bytes audio = 2;             // raw audio bytes in the format declared by Start
}

message AiTranscribeStreamEnd {
  string request_id = 1;
  bool cancel = 2;             // true = abort without emitting Complete
}

// Streaming transcription replies (server -> client).
// Delta carries the full accumulated text so far (not incremental
// tokens) so the client can set the input field directly on each
// event. is_final=true marks the last Delta before Complete.
message AiTranscribeStreamDelta {
  string request_id = 1;
  string text = 2;
  bool is_final = 3;
