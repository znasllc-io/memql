// -----------------------------------------------------------------------------
// Access / authorization
// -----------------------------------------------------------------------------

// MyAccessMsg requests the caller's own access record: their cluster-
// wide role + the set of partition grants they hold. This is the data
// behind the Cockpit Settings tab's "My Access" section. Servers reject
// any attempt to query another user's access with this message; admin
// tooling for "who has access to X" uses the membersOfPartition query
// instead.
message MyAccessMsg {
  string request_id = 1;
}

message MyAccessResult {
  string request_id = 1;
  string user_id = 2;
  string primary_email = 3;
  UserRole cluster_role = 4;
  repeated PartitionGrant partitions = 5;
}

// PartitionGrant is one row from the caller's PartitionACL.
message PartitionGrant {
  string partition = 1;
  UserRole role = 2;
  string granted_by = 3;
  string granted_at = 4;       // RFC3339
  string expires_at = 5;       // RFC3339, empty when no expiry
  string source = 6;           // grant provenance, e.g. "manual"
  string source_ref = 7;       // optional back-reference (e.g. external id) for non-manual grants
}

// -----------------------------------------------------------------------------
// Agent turn generation
// -----------------------------------------------------------------------------
//
// Cognition selects a speaker via Polyphon scoring, then ships an
// AgentGenerateTurnMsg to an agent peer via NodeService.AiForwardRequest.
// The agent node renders the prompt, runs the tool-calling loop (or a
// non-tool generation for polyphon-text / voice paths), and streams
// AgentGenerateTurnDelta replies back, terminating with a single
// AgentGenerateTurnComplete. Cognition fans deltas out to the BFF for
// client delivery.

// AgentGenerateTurnMsg asks the agent node to generate one conversational
// turn on behalf of the named agent. The routing context is cognition's
// view of why this turn happened and who else is in the room; it is passed
// through verbatim into the prompt template.
message AgentGenerateTurnMsg {
  string request_id = 1;

  // Who is speaking.
  string agent_id = 2;              // v1:agents:agent ID
  string space_id = 3;
  string participant_id = 4;        // agent's participant record in this space

  // Conversation history (system / user / assistant / tool messages).
  repeated AgentTurnMessage history = 10;

  // Cognition's routing context -- opaque to agent beyond pass-through
  // into the prompt template.
  AgentTurnRoutingContext routing = 20;

  // Identity of the acting agent: role, domains, tools, system prompt.
  // Fills the `assistant` block in the agentReply prompt template and
  // drives the scope-fence / tool-gating guardrails.
  ActingAgentIdentity acting_agent = 21;

  // Pre-extracted attachment summaries (optional).
  repeated AgentTurnAttachment attachments = 30;

  // Caller hints. Known keys:
  //   "tools_disabled"    -- "true" to skip tool loop (polyphon text / voice paths)
  //   "streaming"         -- "false" to force non-streaming generation
  //   "text_only_fallback" -- "true" to suppress canvas directives
  map<string, string> hints = 40;
}

// ActingAgentIdentity carries the full identity of the agent being asked
// to generate this turn: role, domains, tools, system prompt. Populated
// by cognition's forwarder from the v1:agents:agent record. Distinct
// from AgentTurnPeer (used for rendering the peer roster) -- peers don't
// need tools or system prompt.
message ActingAgentIdentity {
  string id = 1;
  string name = 2;
  string description = 3;
  string personality = 4;     // inline persona block
  string system_prompt = 5;   // additional system instructions
  // Guardrail-routing role. One of: "specialist", "assistant".
  // Empty string defaults to specialist on the consumer side.
  string role = 6;
  repeated string domains = 7;
  repeated string keywords = 8;
  repeated string tools = 9;
}

message AgentTurnMessage {
  string role = 1;           // "system" | "user" | "assistant" | "tool"
  string content = 2;
  string name = 3;           // optional participant / agent name
  string tool_call_id = 4;   // when role == "tool"
}

message AgentTurnRoutingContext {
  string trigger = 1;              // "utterance" | "continuation" | "silence" | "addressed"
  string selection_reason = 2;     // why cognition picked this agent
  string handoff_from = 3;         // previous speaker on handoff, empty otherwise
  string space_architecture = 4;   // "polyphon" | "conductor" | ...
  repeated AgentTurnPeer peers = 5;
  repeated AgentTurnPeerActivity peer_activity = 6;
  AgentTurnSpaceContext space = 7;
  // Guardrail turn mode set by the cognition router. Drives the three
  // branches in the agentReply template:
  //   "answer"            -- specialist in scope; answer normally.
  //   "fallback_attempt"  -- assistant stretching on a soft gap;
  //                          try with general knowledge, flag uncertainty.
  //   "escalation_notice" -- assistant cannot help (hard gap);
  //                          acknowledge + flag for humans, do not attempt
  //                          the substantive answer.
  // Empty string defaults to "answer" on the consumer side.
  string turn_mode = 8;
  // Depth of the current handoff chain (0 on a fresh turn, increments on
  // each router handoff decision, resets on any non-handoff outcome).
  // Agents don't read this; it travels with the context for telemetry and
  // potential future use. Router-side cap enforcement uses in-session
  // state, not this field.
  int32 handoff_chain_depth = 9;
  // Router fit score for the chosen agent (0..1). Telemetry only on the
  // agent side; the router uses it to decide whether to gate, but agents
  // don't need to branch on it.
  double fit_score = 10;
  // Active human participants in the space, with display names. The
  // template uses this to ground "who's in the room" awareness so
  // agents can address users by name and know how many people are
  // present without a tool call. Distinct from `peers` (other AI
  // agents) and `peer_activity` (recent peer turns).
  repeated AgentTurnHuman humans = 11;
}

message AgentTurnHuman {
  string id = 1;            // participant id (v1:cognition:participant)
  string display_name = 2;  // user's display name -- the agent addresses by this
  bool is_current_speaker = 3;  // true for the user whose utterance triggered this turn
}

message AgentTurnPeer {
  string id = 1;
  string name = 2;
  string role = 3;
  repeated string domains = 4;
}

message AgentTurnPeerActivity {
  string name = 1;
  string role = 2;
  string last_message = 3;
  string last_topic = 4;
  int32 messages_ago = 5;
}

message AgentTurnSpaceContext {
  string id = 1;
  string type = 2;
  string description = 3;
  string architecture = 4;
  // Free-form additional context (survey progress, tour progress, etc.).
  map<string, string> extra = 5;
  // The short one-liner set by the Configure-manually path in
  // CreateSpaceModal ("Plan Q3 roadmap", "Talk to ops about the
  // Houston facility"). Distinct from `description` (which can be
  // long-form / AI-generated). Agents use this to ground their
  // first turn in a multi-agent space -- without it the agent has
  // no idea what the user is here to discuss and falls back to
  // generic "what are you working on?" prompting.
  string purpose = 6;
  // The current user's display name (the human whose utterance
  // triggered this turn). Lets agents address the user by name
  // and gives the model basic profile awareness without needing
  // a separate tool call. Empty when the user is anonymous or
  // unidentified.
  string current_user_display_name = 7;
}

message AgentTurnAttachment {
  string id = 1;
  string kind = 2;           // "pdf" | "image" | "docx" | ...
  string summary = 3;        // pre-extracted text summary
}

// AgentGenerateTurnDelta streams a single slice of turn output. Multiple
// deltas arrive per request_id. The chunk oneof carries either text,
// a tool call the model requested, or a tool result being fed back.
message AgentGenerateTurnDelta {
  string request_id = 1;

  oneof chunk {
    AgentTurnTextDelta text = 10;
    AgentTurnToolCall tool_call = 20;
    AgentTurnToolResult tool_result = 30;
  }
}

message AgentTurnTextDelta {
  string text = 1;
}

message AgentTurnToolCall {
  string tool_call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
}

message AgentTurnToolResult {
  string tool_call_id = 1;
  string result_json = 2;
  string error = 3;          // empty on success
}

// AgentGenerateTurnComplete is the single terminal message for a turn.
message AgentGenerateTurnComplete {
  string request_id = 1;
  string final_text = 2;              // full assembled text for persistence
  int32 text_chunks = 3;
  repeated AgentTurnToolCall tool_calls = 4;  // audit trail
  AgentTurnError error = 5;           // set iff turn failed
  int32 iterations = 6;               // tool-loop iterations used
  // Source-attribution entries from the respondToUser envelope. Each
  // entry names a knowledge-domain id and the verbatim substring of
  // final_text that the frontend should wrap with a clickable source
  // chip. Empty when the agent drew on no trained sources.
  repeated AgentTurnCitation citations = 7;
  // RAG retrieval audit. The chunks the replier pulled from the
  // agent's declared knowledge domains BEFORE invoking the LLM, in
  // similarity-desc order. Distinct from `citations`, which only
  // names sources the model chose to cite -- `retrieved` is the full
  // pool the model SAW. Frontend uses both to render the "Show
  // details" expander beneath each reply: lists what was searched
  // and what (if anything) was actually used. Empty when no domains
  // were attached or retrieval returned nothing.
  repeated AgentRetrievedChunk retrieved = 8;
}

// AgentTurnCitation is one source-attribution entry. domain_id is the
// bare slug of the knowledge domain (e.g. "customer_relations");
// matched_phrase is a verbatim substring of the reply text the
// frontend wraps with a chip. See integrations/agent/envelope.go.
message AgentTurnCitation {
  string domain_id = 1;
  string matched_phrase = 2;
}

// AgentRetrievedChunk is one retrieval-pool entry. Captures what the
// replier pulled (and the LLM saw) before deciding what to cite. The
// frontend's "Show details" expander shows these so the user can
// see exactly what trained content was consulted -- including the
// passages the model considered but didn't cite.
message AgentRetrievedChunk {
  string domain_id = 1;       // bare domain slug ("hist_ancient")
  string source_ref = 2;      // chunk identifier ("seed:v2:llm-generated:16")
  double similarity = 3;      // cosine distance, 0..1
  string text_preview = 4;    // first ~280 chars of body, truncated server-side
  string citation = 5;        // human-readable label ("your Ancient History training")
}

message AgentTurnError {
  string error_id = 1;       // matches ERR-XXXXXX format
  string message = 2;
  string code = 3;           // "timeout" | "tool_failure" | "model_error" | ...
}

// -----------------------------------------------------------------------------
// Guest invites (by email)
// -----------------------------------------------------------------------------
//
// Zoom-style external-guest invitations. A space owner sends
// SendGuestInviteMsg to create an Invitation record and deliver the
// invitation email in a single transactional op. The email carries a
// one-time join URL of the form <frontend>/join/<token>. The guest
// loads that URL, the page calls ResolveGuestInviteMsg (unauth) to
// render the space + inviter details, then the guest chooses a
// display name and the frontend runs mutationJoinSpaceAsGuest over an
// authenticated `Authorization: Guest <token>` stream to create the
// Participant record.
//
// Full flow + security notes:
//   docs/planning/GUEST_INVITE_SPECS.md

// SendGuestInviteMsg creates a guest invitation and emails the link
// to the recipient. Caller must be an authenticated participant of
// space_id.
message SendGuestInviteMsg {
  string request_id = 1;
  string space_id = 2;
  string space_name = 3;       // denormalized for the email body
  string inviter_name = 4;     // denormalized for the email body
  string email = 5;            // guest email address
  string guest_name = 6;       // optional suggested display name
  // Absolute base URL the frontend serves /join/<token> from. The
  // backend appends /join/<token> to build the link that goes in the
  // email. Example: "https://app.copresent.ai".
  string join_url_base = 7;
  // How long the invitation is valid for, in minutes. When unset or
  // <= 0 the backend falls back to the default TTL (currently 5 min).
  // The UI currently exposes 5 / 15 / 30 as choices. Kept as minutes
  // rather than seconds because the surface is deliberately coarse --
  // longer-lived "scheduled" invitations are a separate feature.
  int32 expires_in_minutes = 8;
}

// SendGuestInviteResult is the reply for SendGuestInviteMsg. error_code
// carries a short machine-readable tag on failure:
//   "" (empty)        -- success
//   "invalid_email"   -- email failed validation
//   "forbidden"       -- caller is not a participant of space_id
//   "space_not_found"
//   "email_failed"    -- persistence succeeded but delivery did not;
//                        invitation_id is set so the caller can retry
message SendGuestInviteResult {
  string request_id = 1;
  bool success = 2;
  string invitation_id = 3;
  string error_code = 4;
  string error_message = 5;
}

// ResolveGuestInviteMsg is the UNAUTHENTICATED public endpoint used
// by the /join/<token> landing page to render space + inviter details
// before the guest commits to a display name.
message ResolveGuestInviteMsg {
  string request_id = 1;
  string token = 2;            // plain token from the URL
}

// ResolveGuestInviteResult mirrors the guest-visible subset of the
// invitation. status carries the validation outcome:
//   "ok"                -- invitation is pending + not expired
//   "invalid"           -- no invitation matches the token
//   "expired"           -- token matched, invitation past expires_at
//   "already_accepted"  -- guest already joined via this invitation
//   "cancelled"         -- inviter kicked / dismissed the invitation
message ResolveGuestInviteResult {
  string request_id = 1;
  string status = 2;
  string invitation_id = 3;
  string space_id = 4;
  string space_name = 5;
  string inviter_name = 6;
  string invitee_email = 7;
  string invitee_name = 8;          // suggested name, may be empty
  google.protobuf.Timestamp expires_at = 9;
  string error_message = 10;        // populated when status != "ok"
  // Partition (workspace) the invited space lives in -- derived from
  // the space_id's leading segment server-side. The /join/<token>
  // landing page adopts this for its session so partition-scoped
  // queries (participant lookup, space metadata) hit the right
  // tenant. Empty when status != "ok".
  string partition = 11;
}

// JoinSpaceAsGuestMsg is the single atomic op the /join/<token> page
// fires once the guest confirms their display name. The stream
// interceptor has already validated `Authorization: Guest <token>`
// and stashed the resolved invitation + space in the request claims;
// the handler runs mutationMarkGuestInvitationAccepted +
// mutationCreateGuestParticipant back-to-back on the engine and
// replies with the created participant ID on success.
message JoinSpaceAsGuestMsg {
  string request_id = 1;
  string participant_id = 2;        // UUID minted by the frontend
  string display_name = 3;          // guest's confirmed display name
}

// JoinSpaceAsGuestResult is the reply for JoinSpaceAsGuestMsg.
// error_code carries a short machine-readable tag on failure:
//   ""                   -- success
//   "unauthenticated"    -- no guest claims on the stream
//   "invitation_expired"
//   "invitation_already_used"
//   "invalid_arguments"
//   "persist_failed"     -- engine.Execute returned an error
message JoinSpaceAsGuestResult {
  string request_id = 1;
  bool success = 2;
  string participant_id = 3;        // echoes the request value on success
  string space_id = 4;              // resolved from the guest claims
  string error_code = 5;
  string error_message = 6;
}

// CancelGuestInviteMsg revokes a still-pending guest invitation by
// invitation_id. Authenticated space-owner op (runs under the
// inviter's Bearer token); the handler looks up the current
// invitation row, preserves its guest fields, and rewrites it with
// status=kicked. No-op if the invitation is already accepted or
// kicked.
message CancelGuestInviteMsg {
  string request_id = 1;
  string invitation_id = 2;
}

// CancelGuestInviteResult - error_code values:
//   ""                  -- success
//   "not_found"         -- no invitation with this ID
//   "not_guest"         -- invitation isn't kind=guest
//   "invalid_arguments"
//   "persist_failed"
message CancelGuestInviteResult {
  string request_id = 1;
  bool success = 2;
  string invitation_id = 3;
  string error_code = 4;
  string error_message = 5;
}

// ResendGuestInviteEmailMsg asks the server to re-send the invitation
// email for an existing guest invitation. No new invitation is
// created; the server reads the stored plain token and emails the
// same /join/<token> URL. join_url_base is the frontend's current
// origin so a changed frontend host doesn't break the link.
message ResendGuestInviteEmailMsg {
  string request_id = 1;
  string invitation_id = 2;
  string join_url_base = 3;
}

// ResendGuestInviteEmailResult - error_code values:
//   ""                 -- success
//   "not_found"        -- invitation gone or not guest
//   "not_pending"      -- invitation was accepted / kicked / expired
//   "expired"          -- past expiresAt
//   "invalid_arguments"
//   "email_failed"     -- record ok but delivery failed; caller can retry
message ResendGuestInviteEmailResult {
  string request_id = 1;
  bool success = 2;
  string invitation_id = 3;
  string error_code = 4;
  string error_message = 5;
}

// -----------------------------------------------------------------------------
// Session revocation
// -----------------------------------------------------------------------------
//
// Per-device and cross-device sign-out. The auth middleware writes a
// v1:identity:authSession row at token-issuance time (BFF
// /auth/exchange and OIDC /auth/callback both); these messages flip
// the revokedAt stamp so subsequent requests bearing the same token
// are rejected.
//
// Both messages read the caller's bearer token out of the gRPC
// `authorization` metadata, hash it, and use the hash to locate the
// session. The token itself never crosses an envelope.

// RevokeCurrentSessionMsg revokes the single session tied to the
// caller's current bearer token. Used by the per-device "Sign out"
// button. Other sessions for the same user are untouched.
message RevokeCurrentSessionMsg {
  string request_id = 1;
}

// RevokeCurrentSessionResult - error_code values:
//   ""                  -- success
//   "no_session"        -- no session row matched the caller's token
//                          (already revoked, expired, or never issued).
//                          The frontend still clears local state.
//   "unauthenticated"   -- no bearer token on the stream metadata
message RevokeCurrentSessionResult {
  string request_id = 1;
  bool success = 2;
  string session_id = 3;
  string error_code = 4;
  string error_message = 5;
}

// RevokeAllSessionsMsg revokes every session owned by the caller.
// Used by the "Sign out of all sessions" button on the profile page.
message RevokeAllSessionsMsg {
  string request_id = 1;
}

// RevokeAllSessionsResult reports how many session rows were stamped
// revoked. revoked_count counts only rows newly transitioning to
// revoked -- already-revoked or already-expired rows are skipped.
message RevokeAllSessionsResult {
  string request_id = 1;
  bool success = 2;
  int32 revoked_count = 3;
  string error_code = 4;
  string error_message = 5;
}

// -----------------------------------------------------------------------------
// Worker tokens (computer-use feature)
// -----------------------------------------------------------------------------
//
// Worker tokens are bearer credentials issued to a user-owned
// machine running memql-cockpit-worker. The plain token is shown
// once in the AddWorkerModal and never persisted server-side --
// only the SHA-256 hash lands on a v1:identity:identity row of
// identityType="worker_token".
//
// Server-side scope: the gRPC stream interceptor admits these
// tokens ONLY on /znasllc.memql.worker.v1.WorkerService/* paths
// and rejects them on every other RPC.

// CreateWorkerTokenMsg mints a fresh worker token. Caller-supplied
// fields tag the credential for audit + listing in /me/workers.
message CreateWorkerTokenMsg {
  string request_id = 1;
  // User-chosen worker name; mirrors v1:worker:registration.name
  // when the worker first connects.
  string name = 2;
  // Optional ISO8601 expiry. Empty = never auto-expires (the user
  // can still revoke the token explicitly).
  string expires_at = 3;
  // Optional owner override. Empty = caller's identity. Admin
  // surfaces pass an explicit owner_user_id to provision tokens
  // for other users.
  string owner_user_id = 4;
}

message CreateWorkerTokenResult {
  string request_id = 1;
  bool success = 2;
  // Plain token -- "mql_wkr_<43 base64url>". Shown to the user
  // ONCE; never persisted server-side.
  string plain_token = 3;
  // Identity row id (v1:identity:identity).
  string identity_id = 4;
  // Resolved owner user id (matches owner_user_id when supplied,
  // otherwise the caller's id).
  string owner_user_id = 5;
  string error_code = 6;
  string error_message = 7;
}

// RevokeWorkerTokenMsg flips active=false on the worker_token
// identity row. The interceptor refuses any future connect attempt
// with this token; in-flight stream lifetimes are untouched (the
// agent node's worker registry handles those via mutationRevokeWorker
// on v1:worker:registration).
message RevokeWorkerTokenMsg {
  string request_id = 1;
  string identity_id = 2;
}

message RevokeWorkerTokenResult {
  string request_id = 1;
  bool success = 2;
  string error_code = 3;
  string error_message = 4;
}

// Worker pairing-code mint + redeem live on the identity service's
// HTTP surface (POST /pair/codes, POST /pair/redeem). Pairing is
// fundamentally an auth operation -- it sits next to magic-link /
// OAuth / JWKS, not on the BFF gRPC plane.

// -----------------------------------------------------------------------------
// Realtime Voice + Video (Initiative C, 2026-05-10)
// -----------------------------------------------------------------------------
//
// The Python voice-agent process (LiveKit Agents 1.5, lives at
// memql/voice-agent/) speaks these messages over MemqlService.Stream
// while authenticated as a service account. The stream interceptor
// pins service-account callers to this set of message types only --
// they CANNOT execute queries, run mutations, or call any other
// graph-writing surface. All graph writes happen server-side here,
// inside memql, with the partition / actor / forUserId server-stamped.
//
// Specialists are NEVER voice. The voice-agent only ever publishes
// for the Assistant in a space. Specialist replies that the
// cognition handler dispatches alongside the GA's response land in
// chat via the normal agent dispatch path; they never reach the
// voice-agent.

// VoiceAgentSessionStart announces a new LiveKit session for a space.
// Sent once when the voice-agent worker joins a room. Memql uses
// this to bind the session to the space and look up the GA's
// canonical voice, persona image, and audio/video control state.
message VoiceAgentSessionStart {
  string request_id = 1;
  string space_id = 2;      // v1:cognition:space.id
  string ga_agent_id = 3;   // v1:agents:agent.id of the Assistant
  string room_name = 4;     // LiveKit room name
  // Optional: identity hint for the avatar vendor. Currently
  // 'anam' or 'simli'. Driven by MEMQL_AVATAR_VENDOR on the
  // voice-agent side. Echoed for audit; memql does NOT switch
  // logic on this.
  string avatar_vendor = 5;
}

message VoiceAgentSessionAck {
  string request_id = 1;
  bool success = 2;
  string error_code = 3;
  string error_message = 4;
  // GA's canonical voice (alto / soprano / tenor / etc.).
  // The voice-agent resolves canonical -> Deepgram Aura-2 id
  // locally via its voice catalog.
  string ga_canonical_voice = 5;
  // Anam persona id when avatar_vendor=anam.
  // Empty if not configured yet (voice-agent disables avatar).
  string ga_avatar_persona_id = 6;
  // Initial audio/video gate decided from the GA's audioControl /
  // videoControl + any existing override row.
  // 'always_on' / 'always_off' / 'mirror_user'.
  string initial_audio_mode = 7;
  string initial_video_mode = 8;
}

// VoiceAgentSessionEnd closes a session. Memql persists a
// session-end audit event and tears down any per-session
// in-memory state.
message VoiceAgentSessionEnd {
  string request_id = 1;
  string space_id = 2;
  string room_name = 3;
  // Optional reason: 'normal', 'error', 'inactivity'.
  string reason = 4;
}

// VoiceAgentPartialTranscript carries an interim ASR transcript.
// Memql emits a v1:cognition:utterance.partial graph event so the
// chat UI can ghost-text the in-progress utterance in real time.
// No graph row inserted -- partials are event-only.
message VoiceAgentPartialTranscript {
  string request_id = 1;
  string space_id = 2;
  string speaker_user_id = 3;   // v1:identity:user.id
  string partial_text = 4;
  // Monotonic per (space, user) so out-of-order events sort
  // correctly client-side. voice-agent stamps a wall-clock-derived
  // counter; memql does not interpret it.
  int64 sequence = 5;
}

message VoiceAgentPartialAck {
  string request_id = 1;
  bool success = 2;
  string error_code = 3;
  string error_message = 4;
}

// VoiceAgentFinalTranscript carries the user's final utterance.
// Memql inserts the canonical chat row (v1:cognition:utterance)
// and server-stamps partition + createdBy; the voice-agent provides
// only content + speaker context.
message VoiceAgentFinalTranscript {
  string request_id = 1;
  string space_id = 2;
  string speaker_user_id = 3;
  string final_text = 4;
  // Provider confidence, 0.0-1.0 (Deepgram surfaces this).
  float confidence = 5;
  // Wall-clock millis the utterance ended (voice-agent side).
  int64 ended_at_ms = 6;
}

message VoiceAgentFinalAck {
  string request_id = 1;
  bool success = 2;
  string utterance_id = 3;   // canonical row id of the inserted utterance
  string thread = 4;         // 'team' | 'group'
  string error_code = 5;
  string error_message = 6;
}

// VoiceAgentTurnRequest asks memql to drive the Assistant
// for one turn. Memql runs the conductor (GA-always-primary on
// voice triggers), then the GA's agent tool loop, and streams
// the GA's response prose back via VoiceAgentTurnDelta. Tools
// execute server-side; voice-agent only ever sees the prose.
message VoiceAgentTurnRequest {
  string request_id = 1;
  string space_id = 2;
  string speaker_user_id = 3;
  // Final transcript text. Same content as the most-recent
  // VoiceAgentFinalTranscript; passed explicitly so the turn
  // request is self-contained and doesn't depend on memql's
  // ability to look up the just-inserted row.
  string utterance_text = 4;
  string ga_agent_id = 5;
  // Thread context. The voice-agent's thread_context tracks
  // active-human migration locally and stamps it here so memql
  // doesn't re-derive it on every turn.
  enum ThreadContext {
    THREAD_CONTEXT_UNSPECIFIED = 0;
    THREAD_CONTEXT_TEAM = 1;
    THREAD_CONTEXT_GROUP = 2;
  }
  ThreadContext thread = 6;
}

// VoiceAgentTurnDelta streams the GA's response prose. The
// voice-agent's memql LLM custom plugin feeds these directly into
// the Aura-2 TTS plugin's token-streaming input, so the first
// phrase starts synthesizing before the full response is ready.
//
// text_delta is the incremental chunk -- DO NOT pass the full
// accumulated text. (Contrast with AiTranscribeStreamDelta which
// is full-accumulated; that's an ASR ergonomic.)
message VoiceAgentTurnDelta {
  string request_id = 1;
  string text_delta = 2;
}

// VoiceAgentTurnComplete is the terminal message for a turn.
// final_text is the canonical full GA response (for the
// voice-agent's audit log + reconciliation). The chat row for
// the GA's reply is already inserted in memql by this point;
// utterance_id refers to that row.
message VoiceAgentTurnComplete {
  string request_id = 1;
  string final_text = 2;
  string utterance_id = 3;
  // GA's effective audio/video mode at the moment this turn
  // ran, so voice-agent can short-circuit publishing if the
  // mode flipped to always_off mid-turn.
  string effective_audio_mode = 4;
  string effective_video_mode = 5;
  string error_code = 6;
  string error_message = 7;
}

// VoiceAgentSpeak is a server-pushed "synthesize and publish
// this text" command. BFF emits one per SI reply utterance that
// lands in a voice-agent-bound space when audio output is
// enabled (current override is always_on) and no VoiceAgentTurn
// is in flight for the same space (the TurnRequest path already
// drives the audio for STT-initiated turns).
//
// Voice-agent handles by calling AgentSession.say(text) so the
// existing Aura-2 TTS + avatar lip-sync pipeline kicks in
// without needing a TurnRequest. This is how chat-typed user
// messages produce audible replies: cognition inserts the reply
// row -> BFF sees the SI utterance event -> emits Speak ->
// voice-agent synthesizes.
//
// Fire-and-forget: no ack message. Voice-agent logs failures.
message VoiceAgentSpeak {
  string request_id = 1;
  string space_id = 2;
  string ga_agent_id = 3;
  string utterance_id = 4;
  string text = 5;
}

// -----------------------------------------------------------------------------
// EvaluatePolicy (cross-cutting decision policies)
// -----------------------------------------------------------------------------

// EvaluatePolicyMsg invokes a `func (Policy)` registered under
// dsl/v1/policies/bff/...  The handler enforces:
//   - the named policy exists
//   - the policy carries @frontend_visible (otherwise reject)
//   - the policy is tier=bff (core policies are server-internal)
//
// args carries the caller-passed JSON object; the engine merges in
// standard ctx fields (actor, partition, now) automatically.
message EvaluatePolicyMsg {
  string request_id = 1;
  string policy_name = 2;
  // JSON-encoded args object (canonical wire form; the handler
  // decodes into map[string]any). Empty string is equivalent to {}.
  string args_json = 3;
  // When true the trace tree is always included in the reply; when
  // false the trace tree is included only if the policy carries
  // @returns_trace.
  bool return_trace = 4;
}

// EvaluatePolicyResult carries the policy's return value plus the
// structured trace tree (when requested or when @returns_trace is
// set). result_json is the JSON-encoded return value (canonical
// wire form); trace_json is the JSON-encoded PolicyTrace tree
// (empty when no trace is returned).
message EvaluatePolicyResult {
  string request_id = 1;
  string result_json = 2;
  string trace_json = 3;
  // Typed error_code values:
  //   POLICY_UNKNOWN              -- policy_name does not resolve
  //   POLICY_NOT_FRONTEND_VISIBLE -- policy is registered but lacks
  //                                  @frontend_visible
  //   POLICY_TIER_MISMATCH        -- policy is not tier=bff
  //   POLICY_RUNTIME_ERROR        -- evaluation errored
  string error_code = 4;
  string error_message = 5;
}

// -----------------------------------------------------------------------------
// In-stream bearer rotation
// -----------------------------------------------------------------------------

// RotateAuthMsg presents a freshly-minted access token on an
// already-open stream. The server re-verifies it with the per-node
// JWT verifier and, on success, swaps the streamSession's identity
// and partition ACL atomically. Used by long-lived stream clients
// (memql-cockpit) to keep the in-flight bearer aligned with their
// background refresh-token rotation, so admin-side revocation lands
// in O(seconds) on the live session instead of waiting for the next
// stream drop. The refresh token itself stays client-side; this RPC
// only carries the new access token.
message RotateAuthMsg {
  string access_token = 1;
}

// RotateAuthResult is the per-request reply for a RotateAuthMsg.
//   - ok=true:  identity and access have been swapped on this stream;
//               every subsequent envelope is checked against the new
//               identity.
//   - ok=false: the new token was rejected (see error / error_description).
//               The existing identity remains in effect; the stream is
//               NOT torn down so the client has time to fall back to
//               a fresh login on its own schedule.
//
// error values mirror RFC-6749 where applicable:
//   - "invalid_token"           token did not validate (expired, wrong
//                               aud/iss, missing kid, signature mismatch)
//   - "verifier_unconfigured"   the node was started without a verifier;
//                               rotation cannot be honored here
//   - "access_load_failed"      verification passed but the partition
//                               ACL reload errored; identity unchanged
message RotateAuthResult {
  bool ok = 1;
  string error = 2;
  string error_description = 3;
}
