  - name: MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT
    component: identity
    scope: global
    optional: true
    description: "RFC3339 date the operator MINTED the seed in MEMQL_IDENTITY_SIGNING_KEY_B64 (memql#3381). Not a secret and not used cryptographically -- a 32-byte seed carries no metadata, so this is the only way the service can know how old its signing key is. Rotation in env-seed mode is a manual re-seal-and-roll (docs/public/operate/auth/identity-service.md#rotating-the-signing-key), and the key-age alert is the only automated pressure toward ever doing it. Unset means age is reported as UNKNOWN (memql_identity_signing_key_age_known=0), never as zero. Set the SAME value on every identity replica -- it is a property of the key, not the pod -- and re-stamp it whenever the seed is re-sealed."

