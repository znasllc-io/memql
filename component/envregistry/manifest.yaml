  # The safety substrate's own env surface (memql#227-#235). None of it was
  # registered before memql#3818, because every name is reached through a
  # constant -- and the per-surface knobs below are reached through a
  # constant returned by a dispatch function, which even the constant-aware
  # scanner reports as unresolvable rather than resolves. They are registered
  # anyway: the global mode knobs ARE resolvable and had to land, and a
  # registry that documents the global mode while hiding the five overrides
  # that outrank it is worse than one that documents neither.

  - name: MEMQL_COMMAND_CLASSIFIER_MODE
    component: safety
    scope: node
    default: "shadow"
    optional: true
    description: "GLOBAL mode of the command-classifier gate: off / shadow / enforce. Shadow (the default, and what an unrecognised value falls back to) classifies and records but cannot block, so an accidentally-enabled rollout is observation-only. Read once at gate construction, so a change needs a restart. Every MEMQL_SAFETY_<SURFACE>_MODE override OUTRANKS this for its own surface -- check those before concluding what a node is enforcing."

  - name: MEMQL_SAFETY_OUTPUT_SCREEN_MODE
    component: safety
    scope: node
    default: "shadow"
    optional: true
    description: "GLOBAL mode of the output-screening gate: off / shadow / enforce. Separate from MEMQL_COMMAND_CLASSIFIER_MODE on purpose -- output screening usually reaches enforce earlier, because a blocked tool output is less disruptive than a blocked command. Read at gate construction. The per-channel MEMQL_SAFETY_OUTPUT_<CHANNEL>_MODE overrides outrank it."

  - name: MEMQL_SAFETY_LLM_PROVIDER
    component: safety
    scope: node
    optional: true
    description: "Opts this node into the LLM semantic classifier layer (memql#230) by naming a registered structured-chat provider. Unset -- or set to a name no provider answers to -- leaves the rules-only chain, which is the default posture; the mismatch case logs a WARN rather than failing boot. Adds an LLM call to the classification path, so it carries cost as well as coverage."

  - name: MEMQL_SAFETY_LLM_TIMEOUT_MS
    component: safety
    scope: node
    default: "5000"
    optional: true
    description: "Per-call timeout in milliseconds for the LLM safety classifier. On timeout the classifier returns an error and the per-surface fail-closed/fail-open posture decides what happens (see MEMQL_SAFETY_<SURFACE>_FAIL_CLOSED) -- so this knob and that one together determine whether a slow provider blocks work or waves it through."

  - name: MEMQL_SAFETY_LLM_CACHE_TTL_SECONDS
    component: safety
    scope: node
    default: "3600"
    optional: true
    description: "How long an LLM safety verdict stays cached. The dominant evictor, and the main lever on classifier cost. 0 disables caching entirely, which makes every classified call an LLM round-trip."

  - name: MEMQL_SAFETY_LLM_CACHE_MAX_ENTRIES
    component: safety
    scope: node
    default: "10000"
    optional: true
    description: "Soft upper bound on the LLM safety verdict cache. Eviction is expired-first; on overflow with nothing expired, NEW entries are dropped rather than old ones evicted, so the classifier simply re-classifies on the next miss. 0 means unbounded (not recommended); a negative value is coerced back to the default rather than bypassing the bound."

  - name: MEMQL_SAFETY_PERSIST_CLASSIFICATIONS
    component: safety
    scope: node
    default: "on"
    optional: true
    description: "Opts this node OUT of writing v1:safety:classification rows (memql#234) when set to off / false / 0. On by default whenever the engine is ready. Turning it off keeps the gate's decisions but loses the audit trail they are measured from, which is what shadow mode exists to collect."

  - name: MEMQL_SAFETY_APPROVAL_SINK
    component: safety
    scope: node
    default: "on"
    optional: true
    description: "Opts this node OUT of the DSL-backed approval sink (memql#232) when set to off / false / 0. On by default: Ask verdicts in enforce mode consult v1:safety:approvalRequest rows. Opted out, an Ask verdict falls back to the pre-approval \"requires user approval\" refusal -- so a human cannot grant the approval that would let the action through. Shadow mode never reaches the Ask branch either way."

  - name: MEMQL_SAFETY_APPROVAL_TTL_HOURS
    component: safety
    scope: node
    default: "24"
    optional: true
    description: "How long an approved v1:safety:approvalRequest acts as a bypass token. Shorter is safer (a mistaken approval does not haunt indefinitely) at the cost of re-approving more often. 0 is a legitimate posture, not a disabled knob: approvals expire on creation, so no approval can ever satisfy the bypass check. Missing / unparsable / negative falls back to 24. Advisory in v1 -- the check filters approved rows by expiresAt at read time; the sweep that flips status to expired is a follow-up."

  # Per-surface command-classifier mode. Overrides MEMQL_COMMAND_CLASSIFIER_MODE
  # for one surface, so a rollout is per-surface rather than a flag day. Values:
  # off / shadow / enforce; empty or unrecognised falls through to the global.

  - name: MEMQL_SAFETY_WORKBENCH_MODE
    component: safety
    scope: node
    optional: true
    description: "Command-classifier mode for the WORKBENCH surface (the per-Plan sandbox), overriding MEMQL_COMMAND_CLASSIFIER_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  - name: MEMQL_SAFETY_COMPUTER_USE_HEADLESS_MODE
    component: safety
    scope: node
    optional: true
    description: "Command-classifier mode for the computer_use_headless surface (shell / fs / http on the USER'S machine), overriding MEMQL_COMMAND_CLASSIFIER_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  - name: MEMQL_SAFETY_COMPUTER_USE_EMBODIED_MODE
    component: safety
    scope: node
    optional: true
    description: "Command-classifier mode for the computer_use_embodied surface (mouse / keyboard / screenshot on the USER'S machine), overriding MEMQL_COMMAND_CLASSIFIER_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  - name: MEMQL_SAFETY_TOOL_WEBHOOK_MODE
    component: safety
    scope: node
    optional: true
    description: "Command-classifier mode for the webhook-tool surface (outbound HTTP from a tool call), overriding MEMQL_COMMAND_CLASSIFIER_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  - name: MEMQL_SAFETY_TOOL_INTEGRATION_MODE
    component: safety
    scope: node
    optional: true
    description: "Command-classifier mode for the integration-tool surface (typed integration capability calls), overriding MEMQL_COMMAND_CLASSIFIER_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  # Per-channel output-screening mode. Same shape, but the axis is the INGRESS
  # channel rather than the calling surface, so http_fetch can enforce while
  # tool_output stays in shadow.

  - name: MEMQL_SAFETY_OUTPUT_TOOL_OUTPUT_MODE
    component: safety
    scope: node
    optional: true
    description: "Output-screening mode for the tool_output channel, overriding MEMQL_SAFETY_OUTPUT_SCREEN_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  - name: MEMQL_SAFETY_OUTPUT_HTTP_FETCH_MODE
    component: safety
    scope: node
    optional: true
    description: "Output-screening mode for the http_fetch channel -- the highest-risk ingress, since the content is whatever the open web returned -- overriding MEMQL_SAFETY_OUTPUT_SCREEN_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  - name: MEMQL_SAFETY_OUTPUT_FILE_READ_MODE
    component: safety
    scope: node
    optional: true
    description: "Output-screening mode for the file_read channel, overriding MEMQL_SAFETY_OUTPUT_SCREEN_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  - name: MEMQL_SAFETY_OUTPUT_KNOWLEDGE_SEED_MODE
    component: safety
    scope: node
    optional: true
    description: "Output-screening mode for the knowledge_seed channel (content entering a knowledge domain), overriding MEMQL_SAFETY_OUTPUT_SCREEN_MODE for it alone. off / shadow / enforce; unset falls through to the global."

  # Per-channel escalation of the Suspicious tier. Surfaces typically sanitise
  # only on Blocked, which leaves the suspicious-tier rules toothless; these
  # opt a channel into treating Suspicious AS Blocked. False by default.
  # Accepted true values: true / 1 / yes / on. Anything else is false.

  - name: MEMQL_SAFETY_OUTPUT_TOOL_OUTPUT_SUSPICIOUS_AS_BLOCKED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Escalate a Suspicious output-screening verdict to Blocked for the tool_output channel, so surfaces that sanitise only on Blocked act on it. Off by default (local tool output is the lower-risk channel)."

  - name: MEMQL_SAFETY_OUTPUT_HTTP_FETCH_SUSPICIOUS_AS_BLOCKED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Escalate a Suspicious output-screening verdict to Blocked for the http_fetch channel. The most likely one to want on, since the content came from the open web."

  - name: MEMQL_SAFETY_OUTPUT_FILE_READ_SUSPICIOUS_AS_BLOCKED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Escalate a Suspicious output-screening verdict to Blocked for the file_read channel. Off by default."

  - name: MEMQL_SAFETY_OUTPUT_KNOWLEDGE_SEED_SUSPICIOUS_AS_BLOCKED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Escalate a Suspicious output-screening verdict to Blocked for the knowledge_seed channel. Off by default."

  # Per-surface fail-closed-on-error posture: what happens when the classifier
  # itself ERRORS (timeout, provider outage). Accepted: true/1/yes/on =>
  # fail-closed (refuse the dispatch); false/0/no/off => fail-open (proceed).
  # An unrecognised value falls through to the surface default rather than
  # flipping the posture, so a typo cannot quietly change it.

  - name: MEMQL_SAFETY_WORKBENCH_FAIL_CLOSED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Whether a classifier ERROR blocks dispatch on the workbench surface. Defaults fail-OPEN: the workbench is a per-Plan sandbox, so a classifier outage lets work proceed rather than breaking every agent. Set it true during an incident where an unclassified action is the greater risk."

  - name: MEMQL_SAFETY_COMPUTER_USE_HEADLESS_FAIL_CLOSED
    component: safety
    scope: node
    default: "true"
    optional: true
    description: "Whether a classifier ERROR blocks dispatch on the computer_use_headless surface. Defaults fail-CLOSED, because the blast radius is the user's real machine. Setting it false lets unclassified actions through during a classifier outage."

  - name: MEMQL_SAFETY_COMPUTER_USE_EMBODIED_FAIL_CLOSED
    component: safety
    scope: node
    default: "true"
    optional: true
    description: "Whether a classifier ERROR blocks dispatch on the computer_use_embodied surface. Defaults fail-CLOSED, same reasoning as the headless surface: the blast radius is the user's real machine."

  - name: MEMQL_SAFETY_TOOL_WEBHOOK_FAIL_CLOSED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Whether a classifier ERROR blocks dispatch on the webhook-tool surface. Defaults fail-OPEN (typed signatures, smaller blast radius); note the webhook path has its own independent SSRF floor and MEMQL_WEBHOOK_ALLOWED_HOSTS allowlist regardless."

  - name: MEMQL_SAFETY_TOOL_INTEGRATION_FAIL_CLOSED
    component: safety
    scope: node
    default: "false"
    optional: true
    description: "Whether a classifier ERROR blocks dispatch on the integration-tool surface. Defaults fail-OPEN (typed signatures, smaller blast radius)."

  # --- workbench ---

  - name: MEMQL_WORKBENCH_REMOTE
    component: workbench
    scope: node
    optional: true
    description: "When truthy, agent nodes route workbench dispatch to a dedicated remote workbench node via NodeService.Stream instead of running the integration in-process. An ASSERTION rather than a preference (memql#3506): with no reachable workbench peer the call is refused (no_workbench_peer), not run on the agent's own disk."

  - name: MEMQL_WORKBENCH_LOCAL_FALLBACK
    component: workbench
    scope: node
    optional: true
    description: "Explicit opt-in that restores the pre-memql#3506 degrade-to-local behaviour: in remote mode, run a workbench call on the agent node when no workbench peer is reachable instead of refusing. Off by default -- a fallback reachable by the ABSENCE of configuration is what hid memql#3450."

  - name: MEMQL_WORKBENCH_ROOT
    component: workbench
    scope: node
    default: "/var/lib/memql/workbenches"
    optional: true
    description: "Filesystem root under which each Plan's sandboxed workspace directory is lazily provisioned, as <root>/<planId>/. Point it at a project-local path for dev, or a mounted volume where the default is not durable. The directory tree IS the workspace state -- it persists across calls within a Plan so multi-Task agents share files, and is torn down on Plan terminal status -- so moving this on a running node abandons live workspaces rather than relocating them."

  # --- worker ---

  - name: MEMQL_WORKER_DIAL_ENDPOINT
    component: worker
    scope: node
    optional: true
    description: "Explicit operator override for the gRPC address the cockpit-worker dials for WorkerService.Stream on the agent node; falls back to derivation from the stored pairing URL when empty. Write the SCHEME (https://agent.example.com for TLS, http://... for plaintext) -- the value is relayed to the worker, which reads a bare host:port as plaintext no matter which port it names (memql#3437)."

  - name: MEMQL_WORKER_PEERS
    component: worker
    scope: node
    optional: true
    description: "Comma-separated type=host:port seed list of worker nodes for cluster bootstrap; DB-based discovery via v1:cluster:node takes over once peers register."

  # TLS knobs read by the WORKER side (sdk/go/worker, i.e. the cockpit-worker
  # process on the user's machine) rather than by a cluster node. They belong in
  # the worker's own environment / ~/.memql/worker.yaml, not in a k8s Secret.

  - name: MEMQL_WORKER_CA_CERT_FILE
    component: worker
    scope: node
    optional: true
    description: "Path (on the WORKER's machine) to a PEM CA bundle used to validate the cluster's server certificate on the worker's gRPC dial. Set it when the cluster is fronted by a private or self-signed CA; unset uses the system trust store. This is the supported way to trust an internal CA -- as opposed to MEMQL_WORKER_TLS_INSECURE_SKIP_VERIFY, which trusts everything."

  - name: MEMQL_WORKER_CLIENT_CERT_FILE
    component: worker
    scope: node
    optional: true
    description: "Path (on the WORKER's machine) to the PEM client certificate the worker presents for mTLS. Must be set together with MEMQL_WORKER_CLIENT_KEY_FILE; exactly one of the pair is a load error. Note that mTLS is transport hardening on top of the worker token, not a replacement for it."

  - name: MEMQL_WORKER_CLIENT_KEY_FILE
    component: worker
    scope: node
    optional: true
    description: "Path (on the WORKER's machine) to the PEM private key for MEMQL_WORKER_CLIENT_CERT_FILE. The file mode is ENFORCED at load: anything granting group or other access is refused rather than warned about, so the key cannot be silently readable by other local accounts on a shared machine. Use 0600."

  - name: MEMQL_WORKER_TLS_INSECURE_SKIP_VERIFY
    component: worker
    scope: node
    default: "0"
    optional: true
    description: "DANGEROUS, dev-only. Set to exactly \"1\" and the worker's TLS handshake skips BOTH hostname pinning and chain validation, which is what otherwise stops a handshake against an attacker endpoint holding a valid-but-different certificate from succeeding. The worker carries a long-lived worker token and executes commands on the user's machine, so this is the highest-consequence verification switch in the tree. Every use emits a WARN so an accidental production toggle surfaces in the log shipper. Use MEMQL_WORKER_CA_CERT_FILE for a private CA instead."

  # --- mcp ---

  - name: MEMQL_MCP_AUTH_SERVER_URL
    component: mcp
    scope: node
    optional: true
    description: "Public OAuth authorization-server issuer advertised by the MCP HTTP head's Protected Resource Metadata; falls back to MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER when unset."

  - name: MEMQL_MCP_HTTP_ADDR
    component: mcp
    scope: node
    default: ":8090"
    optional: true
    description: "Bind address for the MCP Streamable HTTP transport listener."

  - name: MEMQL_MCP_MODE
    component: mcp
    scope: node
    default: "authoring"
    optional: true
    description: "MCP capability tier (Gate A), one of sealed, authoring, or inline."

  - name: MEMQL_MCP_PUBLIC_URL
    component: mcp
    scope: node
    optional: true
    description: "Public URL of the MCP resource advertised in OAuth discovery metadata and the 401 WWW-Authenticate hint. Derived from MEMQL_DOMAIN (as https://mcp.<domain>) when unset, set-if-absent, same mechanism as the identity URLs; empty when neither is set."

  - name: MEMQL_MCP_ROLE
    component: mcp
    scope: node
    optional: true
    description: "Acting role for the per-construct gate (Gate B); empty pins the role to the caller's verified token claim on HTTP."

  - name: MEMQL_MCP_TOOL_TIMEOUT
    component: mcp
    scope: node
    default: "30s"
    optional: true
    description: "Per-tools/call engine execution deadline as a Go duration; unset or invalid falls back to the default."

  - name: MEMQL_MCP_TRANSPORT
    component: mcp
    scope: node
    default: "stdio"
    optional: true
    description: "MCP transport selector, stdio for a local subprocess or http for the network listener."

  - name: MEMQL_MCP_USER
    component: mcp
    scope: node
    optional: true
    description: "Acting user that session-authored constructs are owner-scoped to; empty takes the user from the caller's token on HTTP."

  # --- observability ---

  - name: MEMQL_GEOIP_DB_PATH
    component: observability
    scope: node
    optional: true
    description: "Path to a GeoIP database; absent disables GeoIP enrichment."

  - name: MEMQL_OBSERVE_LEVEL
    component: observability
    scope: node
    default: "off"
    optional: true
    description: "Process-wide default verbosity of the per-invocation observe runtime: off / count / meta / verbose. Read once at package init(), so it cannot be changed without a restart -- per-FQN overrides via the v1:observability:codeProfile concept are the live mechanism and take precedence over this. Anything above off writes a record per instrumented call, so verbose on a busy node is a volume decision, not just a logging one."

