  - name: MEMQL_VOICE_ROOM_NAME
    component: voice
    scope: node
    optional: true
    description: "LiveKit room the Go voice-agent joins when no --room flag is passed (convention polyphon-<spaceId>)."

  - name: MEMQL_POLYPHON_LIVEKIT_PUBLIC_URL
    component: voice
    scope: node
