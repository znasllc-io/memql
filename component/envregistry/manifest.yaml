variables:

  # --- seal floor (a developer .env MUST cover these to seal) ---

  - name: MEMQL_IDENTITY_BASE_URL
    component: identity
    scope: global
    required: ["identity"]
    description: "Public origin of the identity service (e.g. https://auth.example.com). Used as JWT `iss` and in outbound email links."

  - name: MEMQL_IDENTITY_VERIFIER_BASE_URL
    component: identity
    scope: global
    description: "URL non-identity binaries fetch JWKS from. Typically equals MEMQL_IDENTITY_BASE_URL; override only when internal-mesh routing differs from the public origin."

  - name: MEMQL_EMAIL_AZURE_TENANT_ID
    component: email
    scope: global
    description: "Entra tenant ID for the email integration's Microsoft Graph sender: the tenant that HOSTS THE SENDER MAILBOX (the Microsoft 365 tenant the mail domain is verified on), which is not necessarily the AKS subscription's tenant -- the sender's app registration, Mail.Send consent and ApplicationAccessPolicy live there too (memql#4226). (Legacy name `AZURE_TENANT_ID` still accepted by integrations/email as a fallback.)"

  - name: MEMQL_EMAIL_AZURE_CLIENT_ID
    component: email
    scope: global
    description: "Azure AD application ID for the email integration's Microsoft Graph sender. (Legacy name `AZURE_CLIENT_ID` still accepted.)"

  - name: MEMQL_EMAIL_SENDER
    component: email
    scope: global
    description: "Email address used as the sender for transactional mail (e.g. no-reply@example.com). (Legacy name `MAIL_SENDER` still accepted.)"

  - name: MEMQL_EMAIL_FROM_NAME
    component: email
    scope: global
    default: "MemQL"
    description: "Display name shown in the From header of transactional mail. (Legacy name `MAIL_FROM_NAME` still accepted.)"

  # --- campaign sending engine (memql#3348) ---

  - name: MEMQL_CAMPAIGNS_ENABLED
    component: campaigns
    scope: node
    optional: true
    default: "true"
    description: "Campaign send worker on/off. Even when enabled no campaign can START without MEMQL_CAMPAIGNS_UNSUBSCRIBE_SECRET and _BASE_URL: a bulk send with no working RFC 8058 one-click unsubscribe is refused rather than sent."

  - name: MEMQL_CAMPAIGNS_UNSUBSCRIBE_SECRET
    component: campaigns
    scope: global
    optional: true
    secret: true
    description: "HMAC key that signs the one-click unsubscribe link in every campaign message. REQUIRED to send: without it campaignStartSend refuses. Rotate by moving the current value into MEMQL_CAMPAIGNS_UNSUBSCRIBE_SECRET_PREVIOUS in the SAME change, never on its own -- a link already in a recipient inbox is verified against the key its token names."

  - name: MEMQL_CAMPAIGNS_UNSUBSCRIBE_SECRET_PREVIOUS
    component: campaigns
    scope: global
    optional: true
    secret: true
    description: "The previous unsubscribe signing key: VERIFIED against, never signed with (memql#3458). Set it to the outgoing value of MEMQL_CAMPAIGNS_UNSUBSCRIBE_SECRET when rotating, and then LEAVE IT SET -- an unsubscribe link has no expiry, so dropping this is what breaks every link signed by the retired key. Unset on a deployment that has never rotated; the worker warns at boot if that is true and any campaign has already sent."

  - name: MEMQL_CAMPAIGNS_UNSUBSCRIBE_BASE_URL
    component: campaigns
    scope: global
    optional: true
    description: "Public origin the unsubscribe link points at, e.g. https://api.example.com. REQUIRED to send. Must be the externally reachable bff origin -- the recipient's mail client POSTs to it, so an internal address makes one-click silently fail. VALIDATED, not just checked for presence (memql#3481): must be an absolute https origin (http is accepted only for a loopback host, so the local cluster still runs), with no query string or fragment -- RFC 8058 section 3.1 requires an HTTPS URI and providers silently ignore one-click on anything else. A trailing path is allowed and preserved, for deployments served under SERVER_PUBLIC_PATH. A value that is set and invalid refuses the send at campaignStartSend and warns once at worker boot; it is not fatal to the node, because a node that never sends campaigns does not need this set at all."

  - name: MEMQL_CAMPAIGNS_SEND_RATE_PER_MINUTE
    component: campaigns
    scope: node
    optional: true
    default: "30"
    description: "OUR self-imposed send ceiling, per process. Sized to stay under the provider's rather than to discover it: Microsoft Graph throttles a mailbox at roughly this rate. Raise it only with a relay that documents a higher limit. Also the manual warming knob -- raise it on a schedule when a new sending domain is being warmed."

  - name: MEMQL_CAMPAIGNS_BATCH_SIZE
    component: campaigns
    scope: node
    optional: true
    default: "25"
    description: "Recipients one campaign gets per drain tick, so a large campaign cannot hold the loop while a second one waits."

  - name: MEMQL_CAMPAIGNS_MAX_ATTEMPTS
    component: campaigns
    scope: node
    optional: true
    default: "3"
    description: "Per-recipient delivery attempts before the delivery row goes terminal failed. Lower than the outbound worker's 5: a marketing message has a shelf life, and the eighth retry of a soft-bouncing address costs reputation rather than buying delivery."

  - name: MEMQL_CAMPAIGNS_SENDING_IDENTITY
    component: campaigns
    scope: node
    optional: true
    default: ""
    description: "Label for the sending mailbox the reputation counters and the warming ramp belong to (memql#3462). Defaults to the configured sender address (MEMQL_EMAIL_SENDER / MAIL_SENDER / SMTP_FROM_ADDR), or 'default' when none resolves. One deployment normally has exactly one sending mailbox -- the same fact the cluster-wide suppression list rests on -- so this is set only when that derivation is wrong."

  - name: MEMQL_CAMPAIGNS_WARMUP_ENABLED
    component: campaigns
    scope: node
    optional: true
    default: "false"
    description: "Turn on the evidence-driven warming ramp (memql#3462). OFF by default: an established sending domain does not want its rate re-derived by a control loop that has never seen it. When on, the effective send rate is min(the ramp's current step, MEMQL_CAMPAIGNS_SEND_RATE_PER_MINUTE) -- the ramp can hold the configured rate down and can never raise it past what you allowed."

  - name: MEMQL_CAMPAIGNS_WARMUP_STEPS
    component: campaigns
    scope: node
    optional: true
    default: "5,10,25,50,100,200"
    description: "The ramp's ladder, in messages per minute, ascending. A non-ascending or non-numeric list is REFUSED and leaves the ramp disabled with a boot warning rather than being sorted -- sorting it would run a ladder you did not write, and the value you typed is the one you will read back when you ask why the rate is what it is."

  - name: MEMQL_CAMPAIGNS_WARMUP_MIN_HOURS_PER_STEP
    component: campaigns
    scope: node
    optional: true
    default: "24"
    description: "How long a ramp step must run before it may advance. A day, because that is the granularity mailbox providers form an opinion at; a step they have not seen through a full daily cycle has not been judged however clean it looks."

  - name: MEMQL_CAMPAIGNS_WARMUP_MIN_VOLUME_PER_STEP
    component: campaigns
    scope: node
    optional: true
    default: "200"
    description: "How many messages a ramp step must produce before its rates mean anything. THE condition that stops an empty numerator reading as a clean bill of health: four messages with no bounces is a hard bounce rate of 0.0 and no evidence at all."

  - name: MEMQL_CAMPAIGNS_WARMUP_MIN_DOMAIN_VOLUME
    component: campaigns
    scope: node
    optional: true
    default: "50"
    description: "How much mail a single recipient domain must have received before its own rate is allowed to hold the ramp. Without it, one bounce at a domain we sent three messages to reads as 33% and pins the ramp permanently. The stated cost: a genuinely bad small domain is invisible to the ramp until it grows."

  - name: MEMQL_CAMPAIGNS_WARMUP_MAX_HARD_BOUNCE_RATE
    component: campaigns
    scope: node
    optional: true
    default: "0.02"
    description: "Per-domain permanent-bounce ceiling the ramp holds on, as a fraction or a percentage ('0.02' or '2%'). 2% is the conventional 'you are being watched' line. Evaluated PER DOMAIN, never in aggregate -- one badly-performing domain inside a large healthy total is exactly what an aggregate hides and what gets a sending domain blocked."

  - name: MEMQL_CAMPAIGNS_WARMUP_MAX_COMPLAINT_RATE
    component: campaigns
    scope: node
    optional: true
    default: "0.001"
    description: "Per-domain spam-complaint ceiling, as a fraction or a percentage. An order of magnitude tighter than the bounce ceiling, and that asymmetry is the providers' own: a bad address is a hygiene problem, a complaint is a person saying they did not want this. A domain over either ceiling REDUCES the ramp a step rather than merely holding it."

  - name: MEMQL_CAMPAIGNS_FEEDBACK_SOURCES
    component: campaigns
    scope: node
    optional: true
    default: ""
    description: "Which inbound webhook sources carry campaign bounce/complaint feedback, and in what format (memql#3461). Comma-separated source=format pairs, e.g. 'postmaster=rfc3464,ses-feedback=ses'. The source name is the {source} path segment of POST /inbound/{source} and must also be in MEMQL_INBOUND_SOURCE_ALLOWLIST with its own signing secret. Formats: rfc3464 (the standard delivery status notification every SMTP-era relay including Microsoft Graph produces) and ses (Amazon SES feedback over SNS, which additionally carries complaints). THIS IS THE AUTHORIZATION for the ingestion path -- listing a source here is the deployment-level decision that its signed payloads may write the cluster-wide suppression list. Empty means nothing is trusted to do so, which is the safe default and also the state in which no bounce ever reaches the list. An entry naming an unsupported format is dropped rather than defaulted, because a typo resolving to 'the standard one' would parse SES JSON as a DSN, report nothing, and look exactly like a deployment with no bounces."

  - name: MEMQL_CAMPAIGNS_MAX_AUDIENCE
    component: campaigns
    scope: node
    optional: true
    default: "250000"
    description: "Audience ceiling for a send. Since memql#3460 this is a deliberate product refusal rather than a correctness guard: the send WALKS the roster one page at a time and reads the delivery ledger per page, so no audience size is unsafe. What the ceiling stops is a mis-scoped audience or a bad import going out at a scale that cannot be recalled. Raising it is a decision about how large a send this deployment means to make; nothing else has to move with it."

  - name: MEMQL_CAMPAIGNS_POLL_SECONDS
    component: campaigns
    scope: node
    optional: true
    default: "15"
    description: "Campaign drain interval. Polling faster than the send rate only finds an empty token bucket."

  - name: MEMQL_CAMPAIGNS_STARTUP_DELAY_SECONDS
    component: campaigns
    scope: node
    optional: true
    default: "25"
    description: "Delay before the campaign worker's first drain so the engine + DSL finish loading."

  - name: MEMQL_CAMPAIGNS_CLAIM_TTL_SECONDS
    component: campaigns
    scope: node
    optional: true
    default: "300"
    description: "Lease on the cross-replica send claim. Above the longest a live batch can take, and far below the cluster guard's 1h retention prune, so a replica that died mid-batch does not wedge the campaign."

  - name: MEMQL_CAMPAIGNS_THROTTLE_SECONDS
    component: campaigns
    scope: node
    optional: true
    default: "60"
    description: "How long to park a campaign when the provider answers 429 WITHOUT a Retry-After. A throttle with no stated duration is still a throttle; this is the difference between backing off and hammering."

  - name: MEMQL_CAMPAIGNS_SEND_TIMEOUT_SECONDS
    component: campaigns
    scope: node
    optional: true
    default: "30"
    description: "Bounds a single message's delivery attempt, so one unresponsive provider connection cannot hold a batch -- and therefore the cross-replica claim -- open."

  # --- outbound delivery (memql#2521) ---

  - name: MEMQL_OUTBOUND_ENABLED
    component: outbound
    scope: node
    optional: true
    default: "true"
    description: "Outbound-delivery worker on/off. Even when enabled the worker is inert until a per-medium allowlist admits targets (deny-by-default egress)."

  - name: MEMQL_OUTBOUND_EMAIL_ALLOWLIST
    component: outbound
    scope: node
    optional: true
    description: "Comma-separated recipient domain suffixes the outbound worker may email (e.g. `example.com,ops.example.org`; subdomains admitted). Empty = email medium disabled; rows targeting it fail fast."

  - name: MEMQL_OUTBOUND_WEBHOOK_ALLOWLIST
    component: outbound
    scope: node
    optional: true
    description: "Comma-separated URL prefixes the outbound worker may POST to. HTTPS required unless a prefix is an explicit http:// entry (cluster-internal opt-in). Empty = webhook medium disabled; rows targeting it fail fast."

  - name: MEMQL_OUTBOUND_POLL_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "15"
    description: "Outbound worker safety-net drain interval. The graph.node.created fast-path delivers same-replica rows immediately; the poll covers cross-replica rows, retry due-times, and dropped events."

  - name: MEMQL_OUTBOUND_STARTUP_DELAY_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "20"
    description: "Delay before the outbound worker's first drain so the engine + DSL finish loading."

  - name: MEMQL_OUTBOUND_MAX_ATTEMPTS
    component: outbound
    scope: node
    optional: true
    default: "5"
    description: "Delivery attempts before an outboundRequest row is stamped failed (bounded exponential backoff between attempts)."

  - name: MEMQL_OUTBOUND_MAX_PAYLOAD_BYTES
    component: outbound
    scope: node
    optional: true
    default: "262144"
    description: "Maximum outboundRequest body size accepted at drain time; larger rows fail permanently."

  - name: MEMQL_OUTBOUND_HTTP_TIMEOUT_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "10"
    description: "Per-request timeout for the outbound webhook transport."

  - name: MEMQL_OUTBOUND_CLAIM_TTL_SECONDS
    component: outbound
    scope: node
    optional: true
    default: "300"
    description: "Attempt-scoped lease on the cross-replica delivery claim: how long a won claim blocks peers before a dead claimant's key is re-winnable, so a crash between claim and terminal stamp recovers instead of wedging the row until the guard retention prune. Keep it above MEMQL_OUTBOUND_HTTP_TIMEOUT_SECONDS."

  # --- inbound delivery (memql#2957) ---
  #
  # The per-source verification policy is a FAMILY of vars keyed on the source
  # name, so it cannot be enumerated here:
  #
  #   MEMQL_INBOUND_SOURCE_<NAME>_SECRET             the shared HMAC key
  #   MEMQL_INBOUND_SOURCE_<NAME>_SIGNATURE_SCHEME   hmac-sha256-hex | hmac-sha256-base64 | none
  #   MEMQL_INBOUND_SOURCE_<NAME>_SIGNATURE_HEADER   e.g. X-Hub-Signature-256
  #   MEMQL_INBOUND_SOURCE_<NAME>_SIGNATURE_PREFIX   e.g. "sha256=" (optional)
  #   MEMQL_INBOUND_SOURCE_<NAME>_TIMESTAMP_HEADER   enables the replay window (optional)
  #   MEMQL_INBOUND_SOURCE_<NAME>_DEDUPE_HEADER      sender idempotency key (optional)
  #
  # <NAME> is the source name uppercased with '-' mapped to '_'. The SECRET is
  # secret material and belongs in the deployment's secret store, never in an
  # overlay. A listed source that does not resolve to a usable policy is DROPPED
  # (404), never admitted unverified -- see docs/internal/design/inbound-delivery-adr.md.

  - name: MEMQL_INBOUND_ENABLED
    component: inbound
    scope: node
    optional: true
    default: "true"
    description: "Inbound-delivery receiver on/off. Even when enabled the receiver admits nothing until MEMQL_INBOUND_SOURCE_ALLOWLIST names a source (deny-by-default ingress)."

  - name: MEMQL_INBOUND_SOURCE_ALLOWLIST
    component: inbound
    scope: node
    optional: true
    description: "Comma-separated source names the receiver serves at POST /inbound/{source} (e.g. `shopify,tiktok`). Empty = every request is refused with 404. Each name needs its own MEMQL_INBOUND_SOURCE_<NAME>_* verification policy or it is dropped."

  - name: MEMQL_INBOUND_MAX_BODY_BYTES
    component: inbound
    scope: node
    optional: true
    default: "262144"
    description: "Maximum inbound request body the receiver reads; larger requests are refused with 413 and no row is staged. Bounds what an unauthenticated caller can make the node allocate before the signature check runs."

  - name: MEMQL_INBOUND_TIMESTAMP_TOLERANCE_SECONDS
    component: inbound
    scope: node
    optional: true
    default: "300"
    description: "Replay window for sources that sign a timestamp (MEMQL_INBOUND_SOURCE_<NAME>_TIMESTAMP_HEADER). A request outside the window in either direction is refused even when its signature is valid; without a timestamp header a signature is valid forever and dedupeKey is the only replay defence."

  # --- engine ---

  # The five engine knobs below were the gap memql#3818 made visible and
  # memql#3831 closed. They predate the MEMQL_ prefix convention, which is
  # exactly why they could not be registered: TestOwnedVarsArePrefixed refuses a
  # non-prefixed entry that is not a legacy alias, so registering them reddened
  # that gate while omitting them reddened the drift gate. Renaming them (old
  # names kept working as legacy aliases, component/envregistry/legacyalias.go)
  # dissolves the contradiction rather than exempting either side of it.

  - name: MEMQL_MEMORY_ENGINE_MAX_RESULTS
    component: engine
    scope: node
    optional: true
    description: "Hard ceiling on rows any single query may return. A value that does not parse, or is not positive, is ignored and the built-in default stands. Legacy alias: MEMORY_ENGINE_MAX_RESULTS (memql#3831)."

  - name: MEMQL_MEMORY_ENGINE_MAX_WINDOW
    component: engine
    scope: node
    optional: true
    description: "Ceiling on the row WINDOW the engine may scan to satisfy a sorted query -- sorting on a payload property can require fetching more rows than are returned, and this bounds that. Only applied when it parses and exceeds MEMQL_MEMORY_ENGINE_MAX_RESULTS, so it can never be configured tighter than the result ceiling it must contain. Legacy alias: MEMORY_ENGINE_MAX_WINDOW (memql#3831)."

  - name: MEMQL_MEMORY_ENGINE_DEFAULT_LIST_CAP
    component: engine
    scope: node
    optional: true
    description: "The unmarked-list backstop: rows returned by a list query that declares neither paginate nor sort (default 50). CLAMPED to MEMQL_MEMORY_ENGINE_MAX_RESULTS -- it is a tighter default than the hard ceiling, never a wider one, so a misconfigured override cannot quietly raise the real limit. Legacy alias: MEMORY_ENGINE_DEFAULT_LIST_CAP (memql#3831)."

  - name: MEMQL_MEMORY_ENGINE_CACHE_MAX_ITEMS
    component: engine
    scope: node
    optional: true
    description: "Maximum number of entries the engine's query result cache holds. A non-positive or unparsable value leaves the built-in default. Legacy alias: MEMORY_ENGINE_CACHE_MAX_ITEMS (memql#3831)."

  - name: MEMQL_CACHE_MAX_TTL
    component: engine
    scope: node
    optional: true
    description: "Ceiling in SECONDS on any engine query result-cache entry's TTL; 0 is accepted and disables caching. Distinct from MEMQL_SI_CACHE_MAX_SECONDS, which bounds AI-call result caching. Legacy alias: CACHE_MAX_TTL (memql#3831)."

  - name: MEMQL_AUTHORING_CAPTURE_ENABLED
    component: engine
    scope: node
    default: "true"
    optional: true
    description: "Master kill-switch for the planner authoring-capture path; set to a falsy value to disable capture cluster-wide for cost or incident control."

  - name: MEMQL_AUTHORING_CAPTURE_MODE
    component: engine
    scope: node
    default: "transcript"
    optional: true
    description: "Selects the authoring-capture mode, transcript (faithful record of literal calls) or author (the legacy LLM re-authoring path)."

  - name: MEMQL_AUTHORING_MAX_REPAIRS
    component: engine
    scope: node
    default: "4"
    optional: true
    description: "Per-bundle cap on authoring repair attempts before a broken bundle surfaces to the user rather than being retried."

  - name: MEMQL_DEMO_MODE
    component: engine
    scope: node
    default: "false"
    optional: true
    description: "Toggles demo-deployment behavior, notably for the webhook automation step."

  - name: MEMQL_DEPLOYMENT_ID
    component: engine
    scope: node
    default: "local"
    optional: true
    description: "Per-deploy identifier injected by the rollout and stamped on node and deployment records."

  - name: MEMQL_DEPLOY_ARGO_APP
    component: engine
    scope: node
    default: "memql"
    optional: true
    description: "ArgoCD Application name the deploy-pack executor targets; defaults to memql."

  - name: MEMQL_DEPLOY_PROVIDER
    component: engine
    scope: node
    optional: true
    description: "Explicit deploy-provider override; otherwise derived from the environment."

  - name: MEMQL_DEPLOY_REPO_ROOT
    component: engine
    scope: node
    optional: true
    description: "Repository root the deploy-control executor is anchored at; defaults to the process working directory."

  - name: MEMQL_ROWAUTHZ_SHADOW
    component: engine
    scope: node
    default: "false"
    optional: true
    description: "Row-authz SHADOW MODE (memql#2921). When true, the engine computes the predicate each concept's @rowAuthz declaration WOULD inject, decides whether the author's filter already implies it, and records a verdict (already-implied / would-narrow / undecidable). It INJECTS NOTHING: no predicate is added and no query returns a different row set with this on. A measurement tool for the #2803 Phase 3 enforcement ruling, not a production code path -- leave unset. The tree-wide measurement does not need this var at all; run `go test ./component/memql/ -run TestRowAuthzShadowReport -v`."

  - name: MEMQL_DSL_ALLOW_SKIPS
    component: engine
    scope: node
    default: "false"
    optional: true
    description: "Operator break-glass for strict DSL loading (memql#2357, memql#2830). Silences TWO independent gates: (1) engine.Init boots even if a unified loader skipped an in-tree construct or the uniqueness gate found a duplicate registration; (2) the automation loader loads even if an automation failed to read, lower, extract or compile, so the node boots with those automations MISSING. Both still ERROR-log their report. Leave unset (strict) in normal operation -- a skipped construct or dropped automation means the embedded tree or a pack half-loaded."

  - name: MEMQL_DSL_PATH
    component: engine
    scope: node
    optional: true
    description: "On-disk root of ADDITIONAL product-DSL domains mounted into the unified tree at boot (dsl.MountRuntimeDomainsFromEnv, accessor core/dslfs.PathFromEnv). This is the mechanism by which a product-agnostic engine image runs a product's DSL with zero compiled-in product code (memql#2472): a data-only bundle image's init-container copies the .memql tree into a shared volume and the node reads it here. One sub-directory per product namespace. It ADDS domains -- a directory whose name collides with a core embedded domain is skipped, and directories starting with _ or . are skipped. The mounted tree loads through the same strict-boot gate as the embedded one, so a malformed construct refuses boot. Unset is a no-op (embedded tree only)."

  - name: MEMQL_MASTER_KEY
    component: platform
    scope: node
    optional: true
    description: "The cluster's data-encryption key. Read by `memql backup` ONLY to fingerprint itself into a backup manifest (an HMAC of a fixed label, never the key), so a restore can tell the operator whether the backup's secret rows are decryptable here. It DECRYPTS; MEMQL_OPERATOR_KEY authenticates -- they are different secrets (memql#3519)."

  - name: MEMQL_OPERATOR_KEY
    component: platform
    scope: node
    optional: true
    description: "The cluster OPERATOR credential: the bearer token behind `Authorization: Operator <key>`, which admits a gRPC stream as a synthetic cluster owner so tooling can reach a cluster before any user exists. A FULL-AUTHORITY credential over the network -- treat it like a root password, deliver it via ESO/Key Vault, and never write it to a shell profile. Unset means the operator path is unavailable and every Operator stream is REFUSED; that is the safe default and the documented way to disable it. Distinct from MEMQL_MASTER_KEY since memql#3519: the master key DECRYPTS, this one AUTHENTICATES, and there is no fallback between them -- a cluster that has not been seeded this key refuses operator streams rather than accepting the old value."

  - name: MEMQL_MANIFEST_PATH
    component: engine
    scope: node
    optional: true
    description: "Explicit path to the secrets manifest.yaml, taking precedence over MEMQL_REPO and the embedded copy."

  - name: MEMQL_PUBLIC_PATH
    component: engine
    scope: node
    default: "/"
    optional: true
    description: "Base path prefix for the engine's HTTP handlers."

  - name: MEMQL_REGION
    component: engine
    scope: node
    default: "local"
    optional: true
    description: "Region label applied to events, deployment records, and metadata enrichment."

  - name: MEMQL_REPO
    component: engine
    scope: node
    optional: true
    description: "Repository root used to locate scripts/secrets/manifest.yaml when MEMQL_MANIFEST_PATH is unset."

  - name: MEMQL_TASKSTAMP_SELF_PLANNING_TOOLS
    component: engine
    scope: node
    optional: true
    description: "Comma-separated tool names added to the default self-planning set so ad-hoc calls to them are not wrapped in a synthetic adHocAction Plan."

  - name: MEMQL_TOOL_LOOP_MAX_ITERATIONS
    component: engine
    scope: node
    default: "120"
    optional: true
    description: "Per-turn ceiling on LLM rounds in the agent tool loop -- one iteration is one model round, during which it may emit up to MEMQL_TOOL_LOOP_MAX_TOOL_CALLS_PER_ITERATION calls. Read by BOTH the engine tool loop and the agent-node streaming loop, so it is one knob for walkthrough length. The counter resets on each user message, making this a per-turn budget rather than a conversation-wide one. Clamped to 1..200; a non-positive value falls back to the default. One of the LLM cost-control guardrails (docs/public/ai/llm-cost-control.md)."

  - name: MEMQL_TOOL_LOOP_MAX_TOOL_CALLS_PER_ITERATION
    component: engine
    scope: node
    default: "8"
    optional: true
    description: "Per-iteration ceiling on tool calls the model may emit in one round of the agent tool loop. Clamped to 1..12; a non-positive value falls back to the default. Multiplies with MEMQL_TOOL_LOOP_MAX_ITERATIONS to bound a single turn's fan-out. One of the LLM cost-control guardrails (docs/public/ai/llm-cost-control.md)."

  - name: MEMQL_WEBHOOK_ALLOWED_HOSTS
    component: engine
    scope: node
    optional: true
    description: "Comma-separated host:port EGRESS ALLOWLIST for the webhook tool. Two independent effects, and both matter: (1) an allowlisted host:port is permitted even when it resolves to a private address -- the operator escape valve for a deliberately-wired internal target; (2) once ANY entry is set, a non-allowlisted PUBLIC host is refused, so setting this turns webhook egress from allow-public into deny-by-default. Independent of it, an SSRF default-deny floor always blocks loopback / link-local (including 169.254.169.254) / private / mDNS targets whether or not this is set (memql#1561). Unset: no allowlist, public hosts permitted, floor still enforced."

  - name: MEMQL_WEBHOOK_TIMEOUT_SECONDS
    component: engine
    scope: node
    default: "30"
    optional: true
    description: "Per-request timeout in seconds for the webhook tool's outbound HTTP call. Clamped to 1..600; a non-positive or unparsable value falls back to the default."

  # --- database ---
  #
  # MEMQL_DATABASE_DSN is registered in the `secrets:` list above (it carries a
  # password). These are the non-secret database knobs, all read through named
  # constants and so unregistered until memql#3818.

  - name: MEMQL_DB_APP_NAME
    component: database
    scope: node
    optional: true
    description: "Overrides the Postgres application_name this process sets on every backend, which is what attributes a row in pg_stat_activity to a node type (memql#1817 -- it turns a 53300 connection-exhaustion triage into a GROUP BY). Unset derives it as memql-<MEMQL_NODE_TYPE>/<hostname>, which is what you want in a cluster; set it only when a deployment needs a different label."

  - name: MEMQL_DB_IDLE_IN_TX_TIMEOUT_MS
    component: database
    scope: node
    default: "60000"
    optional: true
    description: "Postgres idle_in_transaction_session_timeout, in milliseconds, applied as a SET on every backend this process opens (memql#1817). Reaps a session left idle mid-transaction -- a pod that died after BEGIN -- at the DATABASE, so it cannot pin a connection slot until the process exits. Healthy code never sits idle in a transaction. 0 omits the parameter and the server default stands."

  - name: MEMQL_DB_IDLE_SESSION_TIMEOUT_MS
    component: database
    scope: node
    default: "300000"
    optional: true
    description: "Postgres idle_session_timeout, in milliseconds, applied as a SET on every backend this process opens (memql#1817). Clears orphaned backends left by an ungracefully-killed pod. The default is deliberately ABOVE the client-side idle reaping (ConnMaxIdleTime 2min), so a LIVE pod always closes its own idle connection first and this only bites a connection the client can no longer close. Lowering it below the client-side window makes the server close connections a healthy pod still believes it owns. 0 disables it."

  - name: MEMQL_DB_TLS_INSECURE_SKIP_VERIFY
    component: database
    scope: node
    default: "0"
    optional: true
    description: "DANGEROUS, dev-only. Set to exactly \"1\" to skip verification of the Postgres server certificate; any other value (including unset) verifies against the system trust pool. With verification off, anything able to MITM the connection can present its own certificate and read every row in transit. The supported alternative for a private CA is to load that CA into the system trust pool. Production must leave this unset; a warning is logged at startup when it is on."

  - name: MEMQL_REQUIRE_DB
    component: database
    scope: node
    default: "0"
    optional: true
    description: "TEST-HARNESS knob (memql#2680). Truthy turns the db-gated suites' self-skip into a FAILURE, so a run intended to exercise Postgres cannot quietly report green-by-skip -- a wrong password looks identical to no database, and a whole verification session once passed that way with 17 conformance tests skipped. Set at job level in the CI db-tests lane. Not read by any node at runtime; unset for a normal deployment."

  - name: MEMQL_ALLOW_BOOTSTRAPPED_DB
    component: database
    scope: node
    default: "0"
    optional: true
    description: "TEST-HARNESS opt-in that lets the db-gated suites run against a database belonging to an already-bootstrapped cluster (detected by the v1:identity:clusterSettings singleton carrying a stamp). Deliberately separate from MEMQL_REQUIRE_DB: \"I want a database\" and \"I accept writing into a live cluster's data\" are different statements. Leave unset -- setting it points a destructive test suite at real data."

  # --- transport ---

  - name: MEMQL_GRPC_ADDRESS
    component: transport
    scope: node
    required: ["all"]
    default: ":50051"
    optional: true
    description: "MemqlService gRPC listen address for this node."

  - name: MEMQL_GRPC_ENDPOINT
    component: transport
    scope: node
    optional: true
    description: "Target gRPC endpoint the secrets-seed and rolling-drain CLIs dial when no explicit flag is passed."

  - name: MEMQL_GRPC_TLS_CERT_FILE
    component: transport
    scope: node
    optional: true
    description: "Path to the PEM server certificate the gRPC listener presents. Unset (with the key also unset) leaves gRPC PLAINTEXT -- the default, and correct behind a TLS-terminating ingress, which is how every current environment runs. Must be set together with MEMQL_GRPC_TLS_KEY_FILE; exactly one of the pair is a boot error. Setting it also switches the node's OUTBOUND inter-node dials to TLS and makes it present this same certificate as a client cert for mesh mTLS."

  - name: MEMQL_GRPC_TLS_KEY_FILE
    component: transport
    scope: node
    optional: true
    description: "Path to the PEM private key for MEMQL_GRPC_TLS_CERT_FILE. Must be set together with it. The file mode is ENFORCED at load: anything granting group or other access is refused with an error rather than warned about, so a misconfigured deployment cannot silently expose the key to other local accounts. Use 0600."

  - name: MEMQL_GRPC_TLS_CLIENT_CA_FILE
    component: transport
    scope: node
    optional: true
    description: "Path to a PEM CA bundle, used symmetrically: server-side it verifies CLIENT certificates (mTLS), and on outbound inter-node dials it is added to the trust anchors on top of the system pool. One CA file per cluster, no server-side/client-side variants. Unset server-side means client certificates are not requested at all."

  - name: MEMQL_GRPC_REQUIRE_CLIENT_CERT
    component: transport
    scope: node
    default: "0"
    optional: true
    description: "Set to exactly \"1\" to make the gRPC server REQUIRE and verify a client certificate (mTLS) rather than verify-if-given. Only meaningful with MEMQL_GRPC_TLS_CLIENT_CA_FILE set -- \"1\" without a CA bundle is a boot ERROR, because the server would have no way to verify what it is demanding. Note that gRPC transport auth is not the authorization model: streams are authenticated by identity-issued JWT regardless."

  - name: MEMQL_HTTP_TLS_CERT_FILE
    component: transport
    scope: node
    optional: true
    description: "Path to the PEM server certificate the MemQL HTTP server presents. Set on the node that must serve TLS itself -- in practice identity, whose POST /node/bootstrap refuses plaintext with 403 insecure_transport, so a cluster with no TLS terminator in front of identity needs this. Must be set together with MEMQL_HTTP_TLS_KEY_FILE; exactly one of the pair is a boot error. Unset leaves HTTP plaintext, which is correct behind a terminating ingress."

  - name: MEMQL_HTTP_TLS_KEY_FILE
    component: transport
    scope: node
    optional: true
    description: "Path to the PEM private key for MEMQL_HTTP_TLS_CERT_FILE. Must be set together with it."

  - name: MEMQL_HTTP_TLS_CA_FILE
    component: transport
    scope: node
    optional: true
    description: "Path to a PEM CA bundle trusted by this node's OUTBOUND HTTP clients, overlaid on the system roots. The counterpart of MEMQL_HTTP_TLS_CERT_FILE: set it on every node that dials the identity service over an internal or self-signed CA (node bootstrap + the JWKS verifier fetch), or those calls fail certificate verification. Unset uses the system roots only."

  - name: MEMQL_SERVER_PUBLIC_PATH
    component: transport
    scope: node
    default: "/"
    optional: true
    description: "Base URL path prefix the MemQL HTTP router is mounted under. It is not cosmetic: every declared HTTP path is re-spelled through it, so the health/ready probes, the WebSocket bridge and the unauthenticated-surface boot check all resolve against the prefixed form -- a node whose probes are configured for one spelling and whose router serves the other fails to come up. Hosted sites are exempt (each site owns its whole path space). Legacy alias: SERVER_PUBLIC_PATH (memql#3831)."

  # The rest of the SERVER_ family (memql#3892). These were live and
  # unregistered for the whole life of the registry, and the reason is worth
  # stating once here because it is a detection gap rather than an oversight:
  # component/server/env.go reads them as env.NewEnvReader(prefix).String(keys.Field),
  # so the composed name exists in no source file. A grep for the literal finds
  # nothing, envscan lists the sites in its unresolvable residual (memql#3834),
  # and the drift gate is therefore quiet about a variable that every node reads.

  - name: MEMQL_SERVER_ADDRESS
    component: transport
    scope: node
    default: ":8085"
    optional: true
    description: "HTTP listen address for this node's MemQL HTTP server (the health probes, the WebSocket bridge, and whichever documented HTTP exceptions this node type serves). Default \":8085\" on EVERY node type -- there are no per-binary port defaults, despite what env-vars.md claimed until memql#3892. Changing it moves only the process's listener; in Kubernetes the containerPort and Service must move with it or the pod becomes unreachable while looking healthy to itself. Legacy alias: SERVER_ADDRESS (memql#3892)."

  - name: MEMQL_SERVER_ALLOWED_ORIGINS
    component: transport
    scope: node
    default: "*"
    optional: true
    description: "Origins the generic HTTP CORS middleware admits, comma- or space-separated. Empty or unset means \"*\", which the middleware serves WITHOUT credentials -- a credential-less posture rather than an open one. Distinct from MEMQL_IDENTITY_CORS_ALLOWED_ORIGINS, which governs the identity service's own origin list and is the one to narrow when you mean to restrict identity. Legacy alias: SERVER_ALLOWED_ORIGINS (memql#3892)."

  - name: MEMQL_SERVER_READ_TIMEOUT_MS
    component: transport
    scope: node
    default: "15000"
    optional: true
    description: "http.Server ReadTimeout in milliseconds. Legacy alias: SERVER_READ_TIMEOUT_MS (memql#3892)."

  - name: MEMQL_SERVER_READ_HEADER_TIMEOUT_MS
    component: transport
    scope: node
    default: "5000"
    optional: true
    description: "http.Server ReadHeaderTimeout in milliseconds -- the Slowloris bound. Legacy alias: SERVER_READ_HEADER_TIMEOUT_MS (memql#3892)."

  - name: MEMQL_SERVER_WRITE_TIMEOUT_MS
    component: transport
    scope: node
    default: "15000"
    optional: true
    description: "http.Server WriteTimeout in milliseconds. Legacy alias: SERVER_WRITE_TIMEOUT_MS (memql#3892)."

  - name: MEMQL_SERVER_IDLE_TIMEOUT_MS
    component: transport
    scope: node
    default: "60000"
    optional: true
    description: "http.Server IdleTimeout in milliseconds -- how long a keep-alive connection may sit unused. Legacy alias: SERVER_IDLE_TIMEOUT_MS (memql#3892)."

  - name: MEMQL_SERVER_SHUTDOWN_TIMEOUT_MS
    component: transport
    scope: node
    default: "5000"
    optional: true
    description: "Budget in milliseconds for the HTTP server's graceful shutdown, spent after the drain delay and the in-flight wait that MEMQL_SHUTDOWN_DRAIN_DELAY_SECONDS and the grace period govern. terminationGracePeriodSeconds must exceed the sum. Legacy alias: SERVER_SHUTDOWN_TIMEOUT_MS (memql#3892)."

  - name: MEMQL_SERVER_CAPABILITIES_LOGGING_LOG_LEVEL
    component: transport
    scope: node
    optional: true
    description: "slog level for the HTTP server component (debug / info / warn / error). The reader also accepts the deprecated MEMQL_SERVER_LOGGER_LEVEL and MEMQL_SERVER_LOG_LEVEL spellings, in that order, and those two carry legacy aliases of their own. Legacy alias: SERVER_CAPABILITIES_LOGGING_LOG_LEVEL (memql#3892)."

  # --- service metadata ---

  - name: MEMQL_SERVICE_NAME
    component: engine
    scope: node
    default: "MemQL"
    optional: true
    description: "Service name stamped on this process's structured log records. Read through the same prefix-composed path as the SERVER_ family above, which is why it too went unregistered until memql#3892. Legacy alias: SERVICE_NAME (memql#3892)."

  - name: MEMQL_SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL
    component: engine
    scope: node
    optional: true
    description: "slog level for the process-level service logger (debug / info / warn / error). The deprecated MEMQL_SERVICE_LOGGER_LEVEL and MEMQL_SERVICE_LOG_LEVEL spellings are accepted after it, in that order. Legacy alias: SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL (memql#3892)."

  # --- portal ---
  #
  # MEMQL_PORTAL_DIST / MEMQL_PORTAL_OAUTH_CLIENT_ID / MEMQL_PORTAL_IDENTITY_URL /
  # MEMQL_PORTAL_IDENTITY_API_BASE_URL used to live here, read by
  # component/portal/config.go. That package is retired (memql#3711 -- the
  # portal is site #1, served by the generic component/edge, which must not
  # carry portal-specific config-serving logic). The portal's bundle location
  # is now the seeded site row's bundleRef (dsl/platform/seeds.memql), not an
  # env var. KNOWN GAP: nothing yet replaces the identity-discovery document
  # (runtime-config.json) these variables used to configure -- see
  # clients/portal/src/cluster/config.ts's file-level comment.

  # --- edge ---

  - name: MEMQL_EDGE_SITE_CACHE_TTL_SECONDS
    component: edge
    scope: node
    optional: true
    default: "30"
    description: "How long the edge node caches a request Host -> v1:platform:site resolution (a miss is cached too) before re-querying the engine. Bounds staleness after a site row changes on another node -- the write lands wherever the portal/an admin surface writes it, and this cache lives on every edge replica -- until the change-feed invalidation (memql#3710 Task 9) lands as the primary mechanism."

  - name: MEMQL_EDGE_API_TARGET
    component: edge
    scope: node
    optional: true
    description: "The bff's plain-HTTP address (e.g. http://bff-http:8085) that the edge's /_memql/* reverse proxy forwards to, so a hosted site reaches its API same-origin -- never the bff's gRPC address, since POST /memql/query is served by HTTP middleware, not the gRPC listener. Unset refuses /_memql/* for every site regardless of a site's apiProxy setting, and the edge warns once at boot when it is unset."

  # --- cluster ---

  - name: MEMQL_CLUSTER_ID
    component: cluster
    scope: node
    optional: true
    description: "Identifier stamped on deployment and cut-version records to attribute them to a cluster."

  - name: MEMQL_MESH_OUTBOX_RETENTION
    component: cluster
    scope: node
    default: "24h"
    optional: true
    description: "Go duration watermark for the mesh delivery-outbox sweep: rows older than this are pruned hourly from every replica (deletes are idempotent, so no cluster claim is taken). ZERO OR NEGATIVE DISABLES the sweep entirely and the tables grow without bound. An UNPARSABLE value warns and falls back to the default rather than disabling -- a typo'd knob must not silently turn retention off. The mesh_key_seq allocator rows are never swept (a seq restart hazard)."

  - name: MEMQL_NODE_ADDRESS
    component: cluster
    scope: node
    optional: true
    description: "Address peers dial back to reach this node; required in cluster mode."

  - name: MEMQL_NODE_BOOTSTRAP_RETRY_BUDGET
    component: cluster
    scope: node
    default: "90s"
    optional: true
    description: "Go duration bounding the total retry window for the startup node-token mint against identity (memql#542). Sized to outlast an identity pod restart during a simultaneous roll of every Deployment, which is the failure it exists for: the original single-attempt mint left any node that restarted while identity was briefly down with no token until manually re-rolled. Only TRANSIENT failures retry (unreachable / still starting / 5xx) on exponential backoff; a permanent rejection (wrong secret, 4xx) is not retried at all. 0 means a single attempt with no retry."

  - name: MEMQL_NODE_RECONCILE_INTERVAL_SECONDS
    component: cluster
    scope: node
    default: "3"
    optional: true
    description: "How often (seconds) the topology reconciler ticks. Every mesh replica runs the loop but a Postgres advisory lock elects ONE leader that actually reconciles, comparing the non-stopped v1:cluster:node set against live mesh membership. The first pass is deferred 20s past startup regardless, so a booting cluster's gossip converges before anyone is judged absent."

  - name: MEMQL_NODE_RECONCILE_GRACE_SECONDS
    component: cluster
    scope: node
    default: "20"
    optional: true
    description: "How long (seconds) a node must be CONTINUOUSLY absent from the live mesh set before the reconciler writes it health=\"stopped\". The debounce against a transient gossip gap: lower it and a briefly-unreachable healthy node gets retired, raise it and a genuinely dead pod lingers in topology. It also floors the second signal -- a node whose recorded lastSeen is fresher than this window is never reaped, on the grounds that it may just not have propagated to the leader's peer view yet. Orphan reaping (a superseded deployment's pods) ignores this knob and is immediate."

  - name: MEMQL_NODE_FLAVOR
    component: cluster
    scope: node
    optional: true
    description: "Optional node sub-type metadata reserved for future use."

  - name: MEMQL_NODE_ID
    component: cluster
    scope: node
    default: "auto-generated UUID"
    optional: true
    description: "Stable identifier for this node instance, injected per pod via the k8s downward API."

  - name: MEMQL_NODE_LABELS
    component: cluster
    scope: node
    optional: true
    description: "Comma-separated key=value metadata labels attached to this node."

  - name: MEMQL_NODE_SERVICE_ADDRESS
    component: cluster
    scope: node
    default: ":50052"
    optional: true
    description: "NodeService gRPC listen address used for inter-node mesh communication."

  - name: MEMQL_NODE_TYPE
    component: cluster
    scope: node
    default: "bff"
    optional: true
    description: "Node role for untagged binaries; a compiled build tag takes precedence over this value."

  - name: MEMQL_PARENT_ADDRESS
    component: cluster
    scope: node
    optional: true
    description: "Address of the BFF a worker node dials so its outbound stream reaches BFF for event forwarding; required for every non-BFF node in cluster mode."

  - name: MEMQL_SHUTDOWN_DRAIN_DELAY
    component: cluster
    scope: node
    default: "5s"
    optional: true
    description: "Go duration to wait after de-routing before draining in-flight streams during graceful shutdown."

  - name: MEMQL_SHUTDOWN_GRACE_PERIOD
    component: cluster
    scope: node
    default: "25s"
    optional: true
    description: "Go duration bounding how long graceful shutdown waits for in-flight user streams to finish after the node is de-routed."

  # --- ai ---

  # --- Anthropic workload identity federation (memql#4333) ---
  #
  # NAMES, NOT SECRETS. Each one identifies an object in the Anthropic Console
  # (a rule, an organization, a service account, a workspace) or a path on the
  # pod; the credential itself is the projected Kubernetes token, which is
  # never an env var. So they are VARIABLES and travel in a ConfigMap
  # (deploy/k8s/base/anthropic-federation-config.yaml), not in memql-secrets.
  #
  # ALL FOUR OF rule / organization / service account / token file, OR NONE.
  # A partial configuration REFUSES BOOT rather than falling back to
  # MEMQL_AI_ANTHROPIC_API_KEY -- see component/memql/ai_anthropic_federation.go
  # and docs/public/operate/auth/anthropic-federation.md. They are per-cluster
  # values: a re-created cluster has a new OIDC issuer and needs new ones.

  - name: MEMQL_AI_ANTHROPIC_FEDERATION_RULE_ID
    component: ai
    scope: node
    optional: true
    description: "Anthropic OIDC federation rule id (fdrl_...) the token exchange names. One of the four that together select federation instead of MEMQL_AI_ANTHROPIC_API_KEY; setting some but not all refuses boot."

  - name: MEMQL_AI_ANTHROPIC_ORGANIZATION_ID
    component: ai
    scope: node
    optional: true
    description: "UUID of the Anthropic organization the federation rule belongs to. One of the four federation values; see MEMQL_AI_ANTHROPIC_FEDERATION_RULE_ID."

  - name: MEMQL_AI_ANTHROPIC_SERVICE_ACCOUNT_ID
    component: ai
    scope: node
    optional: true
    description: "Anthropic service account id (svac_...) the federated token is minted for -- the identity the engine acts as. One of the four federation values."

  - name: MEMQL_AI_ANTHROPIC_WORKSPACE_ID
    component: ai
    scope: node
    optional: true
    description: "Anthropic workspace id (wrkspc_..., or the literal 'default') to scope the federated token to. OPTIONAL EVEN WHEN FEDERATING: Anthropic requires it only when the rule spans more than one workspace, and answers workspace_id_required when it needs one."

  - name: MEMQL_AI_ANTHROPIC_IDENTITY_TOKEN_FILE
    component: ai
    scope: node
    optional: true
    default: "/var/run/secrets/anthropic.com/token"
    description: "Path to the projected Kubernetes service-account token presented to Anthropic's token endpoint. Written by the anthropic-identity projected volume with audience https://api.anthropic.com; the base manifests set it on every engine Deployment. One of the four federation values."

  - name: MEMQL_DEFAULT_AGENT_PROVIDER
    component: ai
    scope: node
    optional: true
    description: "Overrides the AI router's default provider for agent replies when set."

  - name: MEMQL_COGNITION_FIT_THRESHOLD
    component: ai
    scope: node
    default: "0.4"
    optional: true
    description: "Float in [0,1] cognition turn-fit cutoff; higher is a stricter should-I-respond gate."

  - name: MEMQL_DEFAULT_PROVIDER
    component: ai
    scope: node
    optional: true
    description: "Default AI provider id used for chat completions when no per-request provider is given."

  - name: MEMQL_LLM_BG_MAX_CALLS_PER_WINDOW
    component: ai
    scope: node
    default: "40"
    optional: true
    description: "Background-lane rate ceiling; max LLM calls admitted per rate window before a synthetic 429."

  - name: MEMQL_LLM_BG_RATE_GUARD_ENABLED
    component: ai
    scope: node
    default: "true"
    optional: true
    description: "Enables the background-lane rate ceiling guard on the LLM provider chokepoint."

  - name: MEMQL_LLM_BG_RATE_WINDOW_SECONDS
    component: ai
    scope: node
    default: "10"
    optional: true
    description: "Sliding window in seconds over which the background-lane rate ceiling counts LLM calls."

  - name: MEMQL_LLM_COST_INPUT_PER_MILLION
    component: ai
    scope: node
    default: "15.0"
    optional: true
    description: "Estimated input-token price per million used by the kill-switch cost accounting."

  - name: MEMQL_LLM_COST_OUTPUT_PER_MILLION
    component: ai
    scope: node
    default: "75.0"
    optional: true
    description: "Estimated output-token price per million used by the kill-switch cost accounting."

  - name: MEMQL_LLM_KILL_SWITCH_ENABLED
    component: ai
    scope: node
    default: "true"
    optional: true
    description: "Master switch for the cumulative LLM kill-switch latch at the provider chokepoint."

  - name: MEMQL_LLM_LOOP_COOLDOWN_SECONDS
    component: ai
    scope: node
    default: "30"
    optional: true
    description: "Cooldown in seconds before the identical-request loop breaker re-admits a fingerprint."

  - name: MEMQL_LLM_LOOP_GUARD_ENABLED
    component: ai
    scope: node
    default: "true"
    optional: true
    description: "Enables the identical-request loop breaker on the LLM provider chokepoint."

  - name: MEMQL_LLM_LOOP_MAX_REPEAT
    component: ai
    scope: node
    default: "8"
    optional: true
    description: "Number of identical LLM requests within the loop window before the breaker fires."

  - name: MEMQL_LLM_LOOP_WINDOW_SECONDS
    component: ai
    scope: node
    default: "60"
    optional: true
    description: "Sliding window in seconds over which the loop breaker counts identical LLM requests."

  - name: MEMQL_LLM_MAX_CALLS_PER_WINDOW
    component: ai
    scope: node
    default: "20"
    optional: true
    description: "Foreground-lane rate ceiling; max LLM calls admitted per rate window before a synthetic 429."

  - name: MEMQL_LLM_MAX_TOTAL_CALLS
    component: ai
    scope: node
    default: "0"
    optional: true
    description: "Cumulative process LLM call cap that latches the kill-switch; 0 means unlimited."

  - name: MEMQL_LLM_MAX_TOTAL_COST_USD
    component: ai
    scope: node
    default: "0"
    optional: true
    description: "Cumulative process estimated-cost cap in USD that latches the kill-switch; 0 means unlimited."

  - name: MEMQL_LLM_RATE_GUARD_ENABLED
    component: ai
    scope: node
    default: "true"
    optional: true
    description: "Enables the foreground-lane rate ceiling guard on the LLM provider chokepoint."

  - name: MEMQL_LLM_RATE_WINDOW_SECONDS
    component: ai
    scope: node
    default: "10"
    optional: true
    description: "Sliding window in seconds over which the foreground-lane rate ceiling counts LLM calls."

  - name: MEMQL_LLM_SCOPE_GUARD_ENABLED
    component: ai
    scope: node
    default: "true"
    optional: true
    description: "Enables the per-scope cumulative budget latch keyed on space or plan-lineage."

  - name: MEMQL_LLM_SCOPE_IDLE_TTL_SECONDS
    component: ai
    scope: node
    default: "3600"
    optional: true
    description: "Idle time in seconds after which a tracked per-scope budget entry is pruned."

  - name: MEMQL_LLM_SCOPE_MAX_CALLS
    component: ai
    scope: node
    default: "600"
    optional: true
    description: "Cumulative LLM call cap per scope that latches the per-scope budget breaker."

  - name: MEMQL_LLM_SCOPE_MAX_COST_USD
    component: ai
    scope: node
    default: "20.0"
    optional: true
    description: "Cumulative estimated-cost cap in USD per scope that latches the per-scope budget breaker."

  - name: MEMQL_AI_OPENAI_PROJECT_ID
    component: ai
    scope: node
    optional: true
    description: "OpenAI organization or billing project id sent alongside OpenAI API requests."

  - name: MEMQL_STT_PROVIDER
    component: ai
    scope: node
    default: "openai-realtime"
    optional: true
    description: "Speech-to-text provider selector; openai-realtime or openai-whisper."

  - name: MEMQL_STT_LANGUAGE
    component: ai
    scope: node
    default: "en"
    optional: true
    description: "Hard-pins the transcription language server-side (ISO-639-1) for whichever provider MEMQL_STT_PROVIDER selects, and OVERRIDES any client-supplied language hint by design. Pinning it is the fix for the classic multi-language hallucination: an unpinned model auto-detects and drifts to another language on short or noisy audio, whatever the browser asked for."

  - name: MEMQL_STT_MIN_CONFIDENCE
    component: ai
    scope: node
    default: "0.6"
    optional: true
    description: "Confidence floor a FINAL transcript must clear to be emitted to the client, applied at the provider-agnostic delta pump. Genuine speech sits well above 0.6 while silence hallucinations come back at or below it. Note that OpenAI Realtime exposes no real per-alternative confidence and stamps 1.0 on finals, so on that provider this floor never bites and the empty-text plus known-phrase denylist filters do the work instead."

  - name: MEMQL_SI_CACHE_DEFAULT_ENABLED
    component: ai
    scope: node
    default: "true"
    optional: true
    description: "Whether AI-call result caching is on by default for calls that do not state their own preference. Accepts 1/true/yes/on and 0/false/no/off; anything else leaves the default in place."

  - name: MEMQL_SI_CACHE_MAX_SECONDS
    component: ai
    scope: node
    default: "60"
    optional: true
    description: "Ceiling in seconds on any AI-call result-cache TTL. CLAMPED to 0..300 in code: a larger value is silently reduced to 300, and 0 or negative disables AI result caching. Distinct from CACHE_MAX_TTL, which bounds the engine's query result cache."

  - name: MEMQL_AI_CACHE_MAX_ENTRIES
    component: ai
    scope: node
    default: "5000"
    optional: true
    description: "Maximum live entries in the exact-match AI response cache. At the cap the cache first reclaims entries already past their TTL, then sheds the live entries nearest to expiry in a batch. A non-positive value means UNBOUNDED -- the pre-memql#4124 behaviour, in which the map's only eviction was a read that happened to land on an expired key, so an entry never read again was never reclaimed. Distinct from MEMQL_SI_CACHE_MAX_SECONDS, which bounds the same cache's TTL, and from MEMQL_MEMORY_ENGINE_CACHE_MAX_ITEMS, which sizes the engine's query result cache."

  - name: MEMQL_SI_SEMANTIC_CACHE_NAMESPACES
    component: ai
    scope: node
    optional: true
    description: "Enables semantic (embedding-similarity) AI caching per namespace without a rebuild. Format: comma-separated \"namespace:threshold[:ttlSeconds]\" items, e.g. \"cognition.message_intent:0.96:86400\"; a bare \"namespace\" enables it at the default threshold and TTL. Env entries win over the compiled-in registry, which is EMPTY by design -- no namespace is enabled anywhere by default, because a semantic hit answers from a DIFFERENT-but-similar input and each candidate has to clear its false-positive eval first. Setting this changes a live decision path; the one declared candidate (cognition's message-intent classification) is explicitly gated on eval plus owner sign-off."

  - name: MEMQL_CLASSIFICATION_SHORTCIRCUIT
    component: ai
    scope: node
    default: "true"
    optional: true
    description: "Kill-switch for cognition's deterministic classification short-circuit, which skips the LLM classifier in a single-human single-agent space. Default ON; set false/0/off/no to force every turn back through the classifier (for A/B latency measurement, or if the trade-off proves wrong in practice). The trade-off it turns off: with the short-circuit on, text acknowledgements (\"ok thanks\") in a 1:1 space dispatch a reply instead of being suppressed. Behaviour is identical local and online -- this is an escape hatch, not an environment divergence."

  - name: MEMQL_WHISPER_MODEL
    component: ai
    scope: node
    default: "whisper-1"
    optional: true
    description: "OpenAI Whisper model id used when MEMQL_STT_PROVIDER is openai-whisper."

  - name: MEMQL_OPERATOR_AGENT_PROVIDER
    component: ai
    scope: node
    optional: true
    description: "Deploy-time default model-provider hint for the operator agent, used by the router when no explicit provider or policy applies."

  - name: MEMQL_OPERATOR_APP_PROFILES_DIR
    component: ai
    scope: node
    optional: true
    description: "Filesystem directory of app-profile markdown files that overrides the embedded profiles baked into the binary when set."

  # --- voice ---

  - name: MEMQL_OPENAI_REALTIME_MODEL
    component: voice
    scope: node
    optional: true
    description: "OpenAI realtime model id for the voice path; falls back to MEMQL_POLYPHON_OPENAI_ASR_MODEL when empty."

  - name: MEMQL_VOICE_AGENT_TOOL_LOOP
    component: voice
    scope: node
    default: "false"
    optional: true
    description: "Opt-in toggle enabling the agent tool loop for voice replies."

  - name: MEMQL_VOICE_GROUNDING
    component: voice
    scope: node
    default: "false"
    optional: true
    description: "Opt-in toggle enabling knowledge grounding for voice replies."

  # The voice-agent's own configuration (memql#3834). Every entry below was
  # LIVE and UNREGISTERED for its whole life, and for one reason: the agent
  # reads through an injected getter -- a local closure over a caller-supplied
  # `Getenv`, so tests can drive config resolution without touching the process
  # environment. The keys were plain string literals at every call site; what
  # the drift gate could not see was that the closure reads the environment at
  # all. envscan learned that shape in memql#3834 step 3, and these are what it
  # found.

  - name: MEMQL_GRPC_ADDR
    component: voice
    scope: node
    optional: true
    description: "The bff's gRPC address the voice-agent dials (e.g. bff:50051). The voice-AGENT fail-fasts without it -- a voice-agent that cannot reach the mesh has nothing to do -- but it is registered optional rather than required[voice] deliberately: the boot gate governs the voice NODE, which does not read this, and marking it required there would refuse to boot a node over a variable only its subcommand needs. The agent's own getRequired is the enforcement, at the layer that actually reads it."

  - name: MEMQL_VOICE_EXECUTOR
    component: voice
    scope: node
    default: "realtime"
    optional: true
    description: "Which voice executor runs: 'realtime' (OpenAI gpt-realtime speech-to-speech, the default) or 'cascade' (OpenAI STT -> cognition -> OpenAI TTS). Any other value refuses to boot. Both run on OpenAI, so MEMQL_OPENAI_API_KEY is required either way."

  - name: MEMQL_VOICE_AUTOJOIN
    component: voice
    scope: node
    default: "true"
    optional: true
    description: "Whether a voice-agent launched with no room watches LiveKit and joins human-occupied polyphon rooms itself. Set to exactly \"false\" for the plain idle behaviour."

  - name: MEMQL_VOICE_MAX_ROOMS
    component: voice
    scope: node
    default: "8"
    optional: true
    description: "How many rooms one voice-agent replica serves concurrently in auto-join mode (memql#1395). Each room is an isolated session, so two users in different spaces both get the general assistant. A non-positive value falls back to the default."

  - name: MEMQL_VOICE_REALTIME_NATIVE_STT
    component: voice
    scope: node
    default: "true"
    optional: true
    description: "Whether the realtime executor uses the model's native transcription rather than a separate STT pass. Set to exactly \"false\" to disable."

  - name: MEMQL_VOICE_AGENT_LOG_LEVEL
    component: voice
    scope: node
    default: "INFO"
    optional: true
    description: "Log level for the voice-agent process (DEBUG / INFO / WARN / ERROR; upper-cased on read). Legacy alias: VOICE_AGENT_LOG_LEVEL (memql#3834)."

  - name: MEMQL_POLYPHON_VOICE_LANGUAGE
    component: voice
    scope: node
    default: "en"
    optional: true
    description: "Language the voice-agent pins its speech pipeline to. Legacy alias: POLYPHON_VOICE_LANGUAGE (memql#3834)."

  # --- realtime executor (gpt-realtime) tuning ---

  - name: MEMQL_REALTIME_MODEL
    component: voice
    scope: node
    default: "gpt-realtime-2"
