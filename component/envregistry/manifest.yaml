# MemQL env-var registry -- EMBEDDED SNAPSHOT (generated, do not edit)
# ============================================================================
# This is a //go:embed snapshot of scripts/secrets/manifest.yaml baked into
# the binary as the last-resort fallback (loader priority 4), so `genesis
# init` works on operator machines without a memql checkout.
#
# DO NOT EDIT BY HAND. Regenerate with:
#     bash scripts/secrets/sync-embedded-manifest.sh
# TestEmbeddedManifestInSync fails CI if this drifts from the authored file.
# ============================================================================

# MemQL env-var & configuration registry
# ============================================================================
# THE source of truth for every environment variable MemQL reads (Epic 7 /
# memql#2103). One file drives THREE consumers, so they can never drift:
#   1. genesis sealing  -- the `secrets:` + `variables:` lists, validated as a
#      strict superset of the operator .env (the SEAL FLOOR, see below).
#   2. the cockpit Configuration screen (memql#2110) -- view/edit registry vars.
#   3. boot-time fail-fast validation (memql#2108) -- per MEMQL_NODE_TYPE.
# CI enforces drift both ways via `go run ./cmd/envscan -check` (memql#2105):
# a var read by code that is not registered here, OR a registry entry that
# appears nowhere in the repo, fails the build.
#
# Values are NOT in this file -- developers keep them in
# ~/.memql/dev-secrets.yaml (gitignored) or .env. `make secrets-init` walks
# this manifest and prompts; `make secrets-seal` seals them under
# MEMQL_MASTER_KEY.
#
# Entry fields (component/envregistry/manifest.go ManifestEntry):
#   name        -- the env var name.
#   component   -- owning subsystem (engine, identity, ai, voice, ...).
#   scope       -- node:      per-pod/process env from k8s/shell, NOT sealed
#                             into the genesis envelope (node id/type, grpc
#                             addr, mesh, feature toggles, deploy ids).
#                  global:    instance-wide sealed secret/config.
#                  partition: per-tenant concept-stored config.
#   kind        -- secret sub-kind (vendor_api_key | oauth_secret | integration).
#   required    -- node types that MUST have this var at boot ("all" = every
#                  node). Empty = optional/defaulted. Drives #2108.
#   default     -- default value when unset.
#   optional    -- true => NOT part of the seal floor (a .env that omits it
#                  still seals). Every var beyond the curated floor is optional;
#                  it may still be `required` at boot for a given node type.
#                  The two axes are independent.
#
# THE SEAL FLOOR: the non-optional entries (the small curated set at the top of
# each section) are the strict-superset floor `genesis-seal` enforces against a
# dev .env. The full ~200-var universe below is registered with optional: true
# so cataloguing every var does NOT break local sealing.
# ============================================================================

secrets:

  # --- seal floor (a developer .env MUST cover these to seal) ---

  - name: MEMQL_OPENAI_API_KEY
    component: ai
    scope: global
    kind: vendor_api_key
    description: "Instance-wide OpenAI API key. Used for chat, TTS, STT, and Realtime providers unless a tenant has their own partition-scoped key."

  - name: MEMQL_ANTHROPIC_API_KEY
    component: ai
    scope: global
    kind: vendor_api_key
    description: "Instance-wide Anthropic API key. Used for Claude chat / vision providers unless overridden per tenant."

  - name: MEMQL_IDENTITY_KEY_ENCRYPTION_KEY
    component: identity
    scope: global
    kind: integration
    description: "Master secret (>=16 bytes) wrapping the identity service's on-disk Ed25519 signing keypair (disk-key mode). Required in production only when MEMQL_IDENTITY_SIGNING_KEY_B64 is NOT set (i.e. the legacy on-disk KeyDir path)."

  - name: MEMQL_IDENTITY_SIGNING_KEY_B64
    component: identity
    scope: global
    kind: integration
    optional: true
    description: "Base64 (std) 32-byte Ed25519 signing seed (#550/#619). When set, identity runs in envMode -- every replica derives the SAME key + kid + JWKS from this seed, so identity needs NO single-writer RWO key PVC and runs >=2 replicas (HA). REQUIRED for the HA deploy/k8s/identity.yaml manifest; absent only in local-dev disk-key mode. Optional here so local seals don't fail; staging/prod envelopes MUST carry it. Rotate by re-sealing a new seed + rolling identity."

  - name: MEMQL_EMAIL_AZURE_CLIENT_SECRET
    component: email
    scope: global
    kind: oauth_secret
    description: "Azure Graph API client secret used by the email integration. (Legacy name `AZURE_CLIENT_SECRET` is still accepted as a fallback by integrations/email; remove the old row from the running MemQL once everyone has re-seeded.)"

  - name: MEMQL_ANAM_API_KEY
    component: avatar
    scope: global
    kind: integration
    description: "Anam avatar API key (server-side). Used by the voice-agent and the direct/Guide avatar path to mint/resolve Anam personas."

  - name: MEMQL_SIMLI_API_KEY
    component: avatar
    scope: global
    kind: integration
    description: "Simli avatar API key (server-side). Used by the voice-agent and the direct/Guide avatar path to mint/resolve Simli faces."

  # --- cluster ---

  - name: MEMQL_NODE_BOOTSTRAP_TOKEN
    component: cluster
    scope: node
    kind: integration
    optional: true
    description: "Shared bootstrap secret a node presents to the identity service to self-mint its node token when no MEMQL_NODE_TOKEN is provisioned."

  - name: MEMQL_NODE_TOKEN
    component: cluster
    scope: node
    kind: integration
    optional: true
    description: "Operator-provisioned bearer token this node presents on its outbound NodeService stream; empty when no auth is required or when self-bootstrapping."

  - name: MEMQL_SVC_JWT
    component: cluster
    scope: node
    kind: integration
    optional: true
    description: "class=service_account JWT bearer the deploy-gate-check CLI presents to run its authenticated query against the BFF."

  - name: MEMQL_SVC_JWT_FILE
    component: cluster
    scope: node
    kind: integration
    optional: true
    description: "Deploy-gate only (#2179): path to a file holding a class=service_account JWT, written by the deploy-gate self-mint init container; deploy-gate-check prefers it over the static MEMQL_SVC_JWT secret."

  # --- database ---

  - name: MEMQL_DATABASE_DSN
    component: database
    scope: global
    kind: integration
    required: ["all"]
    optional: true
    description: "Postgres+TimescaleDB connection string for the row store; every node needs it and the process exits at boot if it is missing."

  # --- ai ---

  - name: MEMQL_AI_ANTHROPIC_API_KEY
    component: ai
    scope: global
    kind: vendor_api_key
    optional: true
    description: "Instance-wide Anthropic API key for Claude chat and vision providers."

  - name: MEMQL_AI_OPENAI_API_KEY
    component: ai
    scope: global
    kind: vendor_api_key
    optional: true
    description: "Instance-wide OpenAI API key for chat, TTS, STT, and Realtime providers."

  # --- voice ---

  - name: MEMQL_POLYPHON_LIVEKIT_API_KEY
    component: voice
