  # --- identity ---

  - name: MEMQL_DISCOVERY_GRPC_ENDPOINT
    component: identity
    scope: node
    optional: true
    description: "The gRPC dial address the cluster advertises in /.well-known/memql-config.json and hands to a redeeming worker -- the FRONT DOOR, api.<domain>:443, declared in deploy/k8s/base/identity.yaml and patched per overlay. Published to the discovery document as a bare host:port (memql#3399); relayed to a paired worker with its transport stated, which a bare value cannot do -- write https:// if that listener is TLS on a non-standard port (memql#3437). Empty derives from MEMQL_IDENTITY_BASE_URL's host, which serves HTTP and no MemqlService, so set it. Its siblings MEMQL_DISCOVERY_CLIENT_ID and MEMQL_DISCOVERY_CLUSTER_NAME are read only through the handler's injected env accessor."

  - name: MEMQL_DOMAIN
    component: platform
    scope: node
    optional: true
    description: "The cluster's domain. Every domain-shaped identity value (base URL, expected issuer, bootstrap domain, discovery endpoint, CORS origins, OAuth redirect URIs) is derived from it set-if-absent at boot by component/envregistry/domain.go; an explicitly configured value always wins. Delivered to local pods as the single key of the memql-domain ConfigMap (memql#3593)."

  - name: MEMQL_IDENTITY_ACCESS_REQUEST_NOTIFY_EMAILS
    component: identity
    scope: node
    optional: true
    description: "Comma-separated admin recipients for waitlist access-request notification emails; empty falls back to all owner and admin users."

  - name: MEMQL_IDENTITY_ACCESS_REQUEST_NOTIFY_THROTTLE_MINUTES
    component: identity
    scope: node
    default: "5"
    optional: true
    description: "Batches waitlist notification emails so a burst of access requests does not spam the admin inbox."

  - name: MEMQL_IDENTITY_ACCESS_TOKEN_TTL_SECONDS
    component: identity
    scope: node
    default: "900"
    optional: true
    description: "Lifetime in seconds of issued access tokens."

  - name: MEMQL_IDENTITY_ALLOW_EPHEMERAL_KEY
    component: identity
    scope: node
    default: "false"
    optional: true
    description: "Opts a non-localhost deployment into per-pod ephemeral file-backed signing keys instead of a shared seed; single-node or dev only."

  - name: MEMQL_IDENTITY_ALLOW_INSECURE_BOOTSTRAP
    component: identity
    scope: node
    default: "0"
    optional: true
    description: "DEV-ONLY escape hatch for the https-end-to-end requirement on POST /node/bootstrap (memql#626). Set to exactly \"1\" to allow the call over plaintext. ONE variable, enforced on BOTH sides by design: identity's handler otherwise answers 403 insecure_transport, and the node-side client refuses before dialling so the misconfig fails fast and names itself instead of burning the retry budget on a doomed POST. Both halves parse it identically (only \"1\" permits) and both default to refusing, so they cannot disagree. The bootstrap secret is a long-lived bearer credential, so staging and production must leave this unset; every request that slips through logs a WARN."

  - name: MEMQL_IDENTITY_AUDIT_LOG_RETENTION_DAYS
    component: identity
    scope: node
    default: "365"
    optional: true
    description: "In-database retention window in days for identity audit-event rows."

  - name: MEMQL_IDENTITY_BADGE_GRANT_PER_HOUR
    component: identity
    scope: node
    default: "240"
    optional: true
    description: "Per-IP hourly ceiling on badge-grant ATTEMPTS. Deliberately generous -- floor work re-taps every few minutes -- because what the limiter exists to blunt is brute-force enumeration of badge ids, not normal use. Non-numeric or non-positive values are ignored and the default stands. The bucket is IN-MEMORY and per-Server, so a multi-replica identity deployment gives each replica its own budget."

  - name: MEMQL_IDENTITY_BADGE_GRANT_TTL_SECONDS
    component: identity
    scope: node
    default: "600"
    optional: true
    description: "Default lifetime in seconds of a badge grant, cluster-wide. Resolution order is per-request override > this > the built-in 600s, and the result is HARD-CAPPED at one hour: a badge grant is a walk-away containment boundary and anything longer defeats it. Raising this above 3600 has no effect."

  - name: MEMQL_IDENTITY_DEVICE_CODE_PER_HOUR
    component: identity
    scope: node
    default: "60"
    optional: true
    description: "Per-IP hourly ceiling on RFC 8628 device-authorization requests (POST /device/code). Each accepted request writes a row and burns a user_code out of a 40-bit space, so this is what stops an attacker carpeting that space with pending codes hoping a human approves one. An honest client makes one request per sign-in. In-memory and per-replica."

  - name: MEMQL_IDENTITY_DEVICE_CODE_TTL_SECONDS
    component: identity
    scope: node
    default: "600"
    optional: true
    description: "Lifetime in seconds of a device-authorization request -- the window in which the human must approve the user_code. HARD-CAPPED at 30 minutes: the pending authorization is an approvable credential sitting in the database behind a code short enough to type, so a long window is exactly the wrong trade. Values above the cap are reduced to it."

  - name: MEMQL_IDENTITY_DEVICE_VERIFY_PER_HOUR
    component: identity
    scope: node
    default: "120"
    optional: true
    description: "Per-IP hourly ceiling on submissions to the /device verification page. The page is a code ORACLE -- each submission reveals whether a given user_code exists and what state it is in -- so the 40-bit code space is only as strong as the number of guesses allowed against it. A human types one code, maybe twice. In-memory and per-replica."

  - name: MEMQL_IDENTITY_ENROLL_PER_HOUR
    component: identity
    scope: node
    default: "120"
    optional: true
    description: "Per-IP hourly ceiling on GET /enroll redemptions (memql#3408). The page is cheap, but the request behind it is a credential lookup keyed on a string, so the limiter bounds guessing. 120/h leaves a real person far more retries than they need while leaving a script nowhere near a 256-bit search. In-memory and per-replica."

  - name: MEMQL_IDENTITY_PASSKEY_REGISTER_PER_HOUR
    component: identity
    scope: node
    default: "60"
    optional: true
    description: "Per-IP hourly ceiling on WebAuthn REGISTRATION attempts (memql#3406). Tight on purpose: enrolling a passkey is a rare, deliberate act -- a handful per account per lifetime -- so what this blunts is a script hammering /register/begin to churn challenges. In-memory and per-replica."

  - name: MEMQL_IDENTITY_PASSKEY_LOGIN_PER_HOUR
    component: identity
    scope: node
    default: "240"
    optional: true
    description: "Per-IP hourly ceiling on WebAuthn LOGIN attempts (memql#3407). Looser than registration's because signing in is the routine act and a user who fumbles the platform sheet retries a few times. In-memory and per-replica."

