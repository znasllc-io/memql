  # --- telephony ---

  # --- agent turn + tool-loop guards ---
  #
  # These eleven (through MEMQL_PLANNER_WATCHDOG_POLL_SECONDS below) were made
  # visible by memql#3834, which taught envscan to join an env.NewEnvReader's
  # constructor prefix to the suffix at the read site. Every one of them is read
  # through a reader constructed with an EMPTY prefix, so the "suffix" was
  # already the whole key -- the scanner simply had no way to know that, and so
  # never demanded a registry entry.

  - name: MEMQL_BACKGROUND_REQUEST_TIMEOUT_SECONDS
    component: agent
    scope: node
    default: "300"
    optional: true
    description: "Per-request ceiling on one background (non-streaming) agent model call. Bounds a step that would otherwise hang indefinitely, so the loop surfaces an honest failure instead of stalling."

  - name: MEMQL_BACKGROUND_ESCALATE_AFTER_ERRORED_ROUNDS
    component: agent
    scope: node
    default: "2"
    optional: true
    description: "Number of consecutive all-errored rounds in a background agent loop after which the turn escalates to a stronger model -- repeated tool errors usually mean the cheap tier is mishandling the workbench/worker tool and a stronger model is likely to recover. Deliberately BELOW the hard all-errored break so escalation gets a chance to fire before the loop gives up. 0 disables escalation and pins the turn to the cheap tier."

  - name: MEMQL_STREAM_IDLE_TIMEOUT_SECONDS
    component: agent
    scope: node
    default: "30"
    optional: true
    description: "Idle gap tolerated within a STREAMING agent turn before the stream is treated as stalled. Measures silence between chunks, not total turn length -- MEMQL_TURN_WALLCLOCK_TIMEOUT_SECONDS is the whole-turn bound. Resolved once per process."

  - name: MEMQL_TURN_WALLCLOCK_TIMEOUT_SECONDS
    component: agent
    scope: node
    default: "180"
    optional: true
    description: "Whole-turn wall-clock ceiling for a streaming agent turn, the backstop for a turn that keeps emitting chunks and never converges. The default leaves roughly 2x headroom over the worst legitimate case while still catching pathological ones. Pairs with MEMQL_STREAM_IDLE_TIMEOUT_SECONDS, which bounds silence rather than duration."

  - name: MEMQL_TOOL_LOOP_MAX_REPEAT_FAILURES
    component: agent
    scope: node
    default: "3"
    optional: true
    description: "Circuit breaker on the agent tool loop: how many times the model may repeat the SAME failing tool call before the loop concludes it is stuck. The default leaves room for a model to read a structured error and retry once more. 0 disables the breaker, leaving only the loop's other guards and the iteration cap."

  - name: MEMQL_TASK_FAIRNESS_ENABLED
    component: planner
    scope: node
    default: "false"
    optional: true
    description: "Enables the planner's fairness sweep, which can pass a running plan's concurrency slot to a waiting one. OFF by default -- it changes scheduling behaviour, so it is opt-in."

  - name: MEMQL_TASK_FAIRNESS_MIN_RUN_SECONDS
    component: planner
    scope: node
    default: "1800"
    optional: true
    description: "Hysteresis floor for the fairness sweep: a running plan must have held its slot at least this long before it can be passed. Prevents thrash (passing a plan moments after it started) and gives short tasks room to simply finish. A non-positive value is ignored."

  - name: MEMQL_TASK_FAIRNESS_SWEEP_SECONDS
    component: planner
    scope: node
    default: "300"
    optional: true
    description: "How often the planner's fairness sweep wakes. A non-positive value is ignored and the default stands."

  - name: MEMQL_PLANNER_WATCHDOG_ENABLED
    component: planner
    scope: node
    default: "true"
    optional: true
    description: "Enables the stranded-plan watchdog, which re-enters plans that stopped making progress back into the agent loop. Default-ON: this is a data-loss safety net rather than an optional feature, so it runs unless explicitly disabled."

  - name: MEMQL_PLANNER_WATCHDOG_STRAND_SECONDS
    component: planner
    scope: node
    default: "300"
    optional: true
    description: "How long a plan may sit without progress before the watchdog treats it as stranded and recovers it. A non-positive value is ignored."

  - name: MEMQL_PLANNER_WATCHDOG_POLL_SECONDS
    component: planner
    scope: node
    default: "60"
    optional: true
    description: "How often the stranded-plan watchdog polls for stranded plans. A non-positive value is ignored."

  - name: MEMQL_TELEPHONY_CARRIER
    component: telephony
    scope: node
    default: "telnyx"
    optional: true
    description: "Selects the telephony carrier provider; empty falls back to the default carrier."

  - name: MEMQL_TELEPHONY_MODEL_COST_PER_MINUTE
    component: telephony
    scope: node
    default: "0.10"
    optional: true
    description: "Overrides the per-minute MODEL AUDIO rate used to cost a telephony call, in USD. The default is the OpenAI Realtime audio rate, so this is what an operator sets when their negotiated rate differs or the vendor's list price moves. A value that does not parse as a float is treated as unset and the built-in default stands. Distinct from the carrier's per-minute charge; this is the AI side of the call's cost."

  - name: MEMQL_TELEPHONY_OUTBOUND_AUTH_USERNAME
    component: telephony
    scope: node
    optional: true
    description: "Username for SIP-trunk authentication on outbound telephony calls."

  - name: MEMQL_TELEPHONY_OUTBOUND_SIP_ADDRESS
    component: telephony
    scope: node
    optional: true
    description: "Destination SIP address used when placing outbound telephony calls."

  - name: MEMQL_TELEPHONY_SIP_EDGE_URI
    component: telephony
    scope: node
    optional: true
    description: >-
      LiveKit SIP edge URI the carrier routes inbound DIDs to. Self-host plane
      (staging/prod): the in-cluster livekit/sip edge (e.g.
      sip:livekit-sip:5060). Cloud plane (local dev, #2186): UNSET/EMPTY --
      LiveKit Cloud is the edge, the Telnyx Connection
      (MEMQL_TELEPHONY_TELNYX_CONNECTION_ID) is pre-provisioned to point at the
      Cloud SIP URI, and the inbound trunk + dispatch rule are created via the
      LiveKit API by configureInboundNumber. carrier.ConfigureInbound only
      requires the connection id, so an empty value is correct on the Cloud
      path (it is recorded on the trunk row for documentation only)."

  - name: MEMQL_TELEPHONY_TELNYX_BASE_URL
    component: telephony
