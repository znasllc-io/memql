# The memQL mesh + CoPresent Application (deployment-v2 Phase 2, #700).
#
# Source of truth = the digest-pinned staging overlay (Phase 1, #699). Deploys
# are now MERGES: change a digest in deploy/k8s/overlays/staging -> Argo syncs.
# selfHeal continuously corrects out-of-band drift (this is the continuous
# equivalent of drift-check.sh --live). Rollback = `git revert` the overlay.
#
# FIRST-SYNC NOTE: the live Deployments today carry :tag image refs; this overlay
# pins the SAME image content by @sha256: digest. The first sync therefore rolls
# every Deployment once (content-identical) to move tag->digest. It is protected
# by the #615 graceful drain (maxUnavailable=0 + SIGTERM drain) and the live
# autoscaler (#614). Perform it as a WATCHED cutover (see ../README.md), then
# selfHeal keeps the cluster pinned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: memql
  source:
    repoURL: https://github.com/znasllc-io/memql.git
    targetRevision: main
    path: deploy/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: memql
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace is created by the overlay itself (base/namespace.yaml).
      - CreateNamespace=false
      # Don't fight server-side defaulting on fields we don't manage.
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
  # memql-secrets is created out-of-band (real values) and is NOT in git, so it
  # is never pruned. Phase 5 (#703) moves it to External Secrets <- Key Vault.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # HPA/autoscaler-owned; don't thrash on replica count
