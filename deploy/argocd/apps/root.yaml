# App-of-apps root (deployment-v2 Phase 2, #700). This single Application renders
# every Application/AppProject manifest under deploy/argocd/apps, so ADDING a new
# app to the cluster is a PR that drops a manifest here -- no manual `kubectl`.
# Bootstrap applies this once; thereafter it self-manages (incl. itself).
#
# ENGINE-ONLY (decoupling P3): the product Applications (memql / memql-prod /
# rollouts) moved to the downstream product pack's app-of-apps -- the pack owns
# reconciling the bff/SPA/rollouts surface now. Only the engine AppProject
# (project.yaml) + this root remain here; a future engine-only Application would
# be added to the include list below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/znasllc-io/memql.git
    targetRevision: main
    path: deploy/argocd/apps
    directory:
      recurse: true
      include: '{project.yaml,root.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
