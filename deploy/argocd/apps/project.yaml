# AppProject scoping the memql GitOps surface (deployment-v2 Phase 2, #700).
# Restricts what the reconciler may deploy: only THIS repo, only the memql (and
# argocd, for the app-of-apps) namespaces, on the in-cluster API. A tighter blast
# radius than the default project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: memql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: memQL engine mesh on AKS (digest-pinned overlays)
  sourceRepos:
    - https://github.com/znasllc-io/memql.git
  # THE TWO ENVIRONMENTS (epic memql#3748 / #3766). memql-prod and
  # memql-staging are namespaces in THIS cluster, not a second estate; an
  # Application whose destination namespace is missing from this list is
  # rejected at sync, so both had to be named here in the same commit that
  # added them. `memql` stays because the downstream product pack's own
  # Application still reconciles into it.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: memql
    - server: https://kubernetes.default.svc
      namespace: memql-prod
    - server: https://kubernetes.default.svc
      namespace: memql-staging
    - server: https://kubernetes.default.svc
      namespace: argocd
  # Cluster-scoped resources the mesh legitimately needs (none today beyond the
  # namespace, which is created by the overlay). Keep empty-ish; widen on need.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    # The public-entry overlay manages a cert-manager ClusterIssuer
    # (letsencrypt-prod) for the ingress TLS certs -- a cluster-scoped resource
    # the memql app legitimately owns, so the reconciler must be permitted it.
    - group: cert-manager.io
      kind: ClusterIssuer
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
