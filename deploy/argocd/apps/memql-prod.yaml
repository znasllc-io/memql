# The PRODUCTION environment (epic memql#3748 / #3766).
#
# One cluster, one ArgoCD, one repository, one base -- two Applications. This
# one and apps/memql-staging.yaml are the same manifest with a different
# `path`, a different destination `namespace`, and a different sync policy.
# Everything they reconcile comes from deploy/k8s/base; the overlays they point
# at differ only in values (namespace, the environment ConfigMap's two entries,
# replica counts, image digests).
#
# WHAT CHANGED, AND WHY IT IS SAFE. Prod used to be a SEPARATE CLUSTER reached
# through a placeholder API-server URL that had to be filled in before this app
# could do anything. It is now a namespace in the same cluster as staging, which
# removes the second ArgoCD estate, the second set of everything, and the
# "promote is a text edit copied between estates" problem. The isolation that
# mattered is not lost: it moved to the DATABASE CONNECTION, where no
# application code path can forget it. memql-prod's pods are put on
# `search_path = memql_prod, public` and memql-staging's on `memql_staging,
# public`, so a staging automation that fires and writes cannot reach a
# production row even though the two share a Postgres server. See
# component/database/search_path.go for why that could not be a filter.
#
# MANUAL SYNC IS DELIBERATE AND UNCHANGED. There is no `automated:` block: prod
# is the highest-stakes surface, and an operator triggers every sync explicitly.
# Promote to `automated: {prune, selfHeal}` once a couple of clean GitOps prod
# deploys have happened -- deploy/argocd/README.md carries the flow.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memql-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: memql
  source:
    repoURL: https://github.com/znasllc-io/memql.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: memql-prod
  syncPolicy:
    syncOptions:
      # The namespace is not a side effect of the sync option -- it is a
      # resource in the reconciled set. deploy/k8s/base/namespace.yaml declares
      # it and the overlay's `namespace: memql-prod` renames it, which is the
      # same one-base-two-values mechanism as everything else here.
      - CreateNamespace=false
  ignoreDifferences:
    # Replica counts are a RUNTIME dimension as well as a committed value.
    # `make scale N=<n> ENV=prod` writes /spec/replicas directly, and staging's
    # twin scales to zero when idle -- the property that makes a second
    # environment cost storage rather than compute. Without this, selfHeal
    # would fight the scale back within a reconcile interval and the operator
    # would be left doing manual repair. The committed counts in the overlay
    # remain what a fresh reconcile establishes; this only stops Argo treating
    # a deliberate scale as drift.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
