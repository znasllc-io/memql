# The PRODUCTION memQL mesh + CoPresent Application (#2207 -- put prod on ArgoCD).
#
# Closes the local/staging <-> prod GitOps gap: local + staging already reconcile
# via Argo (overlays/local, overlays/staging), but prod was still deployed
# imperatively (`make deploy ENV=production` / scripts/deploy/aks-deploy.sh). This
# Application makes a prod deploy a MERGE: pin a digest in
# deploy/k8s/overlays/prod -> sync -> Argo rolls it. Rollback = `git revert` the
# overlay. The imperative path stays only as a documented break-glass (#2205).
#
# MANUAL SYNC -- the `automated:` block is intentionally OMITTED (cf. memql.yaml /
# rollouts.yaml which DO auto-sync staging). Prod is the highest-stakes surface,
# so it starts manual-sync: an operator triggers `argocd app sync memql-prod`
# (or the Sync button) for every deploy, and runs the watched tag->digest cutover
# with a live-WS-client hold check (see ../README.md "Prod on ArgoCD"). Promote
# to `automated: {prune, selfHeal}` later, once a couple of clean GitOps prod
# deploys have happened. While on manual-sync there is no selfHeal, so prod can
# drift out-of-band -- `scripts/deploy/drift-check.sh --live --env=prod` (or the
# app's own OutOfSync status) is the drift authority until auto-sync is enabled.
#
# DESTINATION -- staging's memql.yaml targets the IN-CLUSTER API
# (https://kubernetes.default.svc) because staging Argo runs in the staging
# cluster. Prod is a SEPARATE cluster, so we must NOT point this at the in-cluster
# server (that would deploy the prod overlay onto whatever cluster renders this
# app-of-apps). The server below is a PLACEHOLDER that fails closed: until the
# owner (1) registers the prod cluster as an Argo CD cluster secret and (2)
# replaces this with the registered cluster's API server URL (and adds that server
# to the `memql` AppProject destinations in project.yaml), this app cannot sync.
# That inert-until-configured state is intentional -- see the owner-gated checklist
# in the PR and ../README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memql-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: memql
  source:
    repoURL: https://github.com/znasllc-io/memql.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    # PLACEHOLDER -- replace with the registered prod cluster's API server URL
    # (or use `name:` referencing the cluster secret) once the prod cluster is
    # registered in Argo CD. Must also be whitelisted in the `memql` AppProject
    # (apps/project.yaml destinations). Do NOT set https://kubernetes.default.svc.
    server: https://PROD-CLUSTER-API-SERVER-REPLACE-ME
    namespace: memql
  syncPolicy:
    # No `automated:` block -- prod is manual-sync first (#2207). Add
    # `automated: {prune: true, selfHeal: true}` to promote to auto-sync later.
    syncOptions:
      # The namespace is created by the overlay itself (base/namespace.yaml).
      - CreateNamespace=false
      # Don't fight server-side defaulting on fields we don't manage.
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
  # memql-secrets is created out-of-band (real values) and is NOT in git, so it
  # is never pruned (mirrors memql.yaml; Phase 5 / #703 moves it to External
  # Secrets <- Key Vault).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # HPA/autoscaler-owned; don't thrash on replica count
