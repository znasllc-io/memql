# Raise the Argo CD repo-server exec timeout.
#
# The repo-server runs `git fetch origin --tags --force --prune` against the
# memql repo on every manifest generation. memql carries a large history plus
# many release / SDK tags, so on a cold cache (first bootstrap) or a slow link
# that fetch can exceed Argo CD's default ARGOCD_EXEC_TIMEOUT of 90s, leaving
# the Application stuck in a ComparisonError:
#
#   Failed to load target state: ... `git fetch origin --tags --force --prune`
#   failed timeout after 1m30s
#
# 300s WAS NOT ENOUGH EITHER, and the reason is worth keeping. A cold fetch is
# the whole repository -- about 133,000 objects and 230 MB -- and git does not
# resume one: a fetch killed at the ceiling throws away its partial pack and the
# next attempt starts from zero. Measured inside a k3d cluster on a home
# connection (1.5-3.9 MiB/s), that fetch took about five minutes, so every
# attempt died just short of finishing and "Continue setup" could never get
# past the cluster step. 1800s completes the same fetch down to roughly
# 130 KiB/s -- this machine's WiFi has measured as low as 265 KiB/s -- and
# still bounds a genuinely hung one. Applies in every environment
# (same repo), so it lives in the shared bootstrap rather than a local overlay;
# a fast cloud link never comes near it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: "1800s"
