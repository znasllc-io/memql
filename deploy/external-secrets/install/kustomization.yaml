# External Secrets Operator install (deployment-v2 Phase 5, znasllc-io/memql#703 / #738).
#
# Installs the ESO controller + webhook into the `external-secrets` namespace.
# The webhook serving cert is issued by cert-manager (webhook-issuer.yaml), not
# by ESO's bundled cert-controller -- see #738 and eso-values.yaml for why. The
# CRDs are managed out-of-band (already installed, serving external-secrets.io/v1);
# this install is additive and does NOT touch memql-secrets until an
# ExternalSecret is applied (see ../secretstore.yaml + ../externalsecret-memql.yaml).
#
# external-secrets.yaml is `helm template`-rendered and pinned (chart 2.5.0).
# Re-render via the recipe in eso-values.yaml.
#
# Bootstrap (or manage via the Argo CD app-of-apps):
#   kubectl apply -k deploy/external-secrets/install
#   kubectl -n external-secrets rollout status deploy/external-secrets-webhook
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets

resources:
  - namespace.yaml
  # Self-signed cert-manager Issuer for the webhook serving cert (#738).
  - webhook-issuer.yaml
  # External Secrets Operator v2.5.0, rendered from the Helm chart with the
  # bundled cert-controller disabled and the webhook cert delegated to
  # cert-manager (k8s-1.34-compatible). See eso-values.yaml.
  - external-secrets.yaml
