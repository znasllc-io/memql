# SecretStore -> Azure Key Vault (deployment-v2 Phase 5, znasllc-io/memql#703).
#
# Points External Secrets at kv-memql-staging. Auth is via AKS WORKLOAD IDENTITY
# (the recommended, secret-less path): a federated managed identity bound to the
# external-secrets controller's ServiceAccount, granted `get`/`list` on the
# vault's secrets. No client secret lives in the cluster.
#
# Prereqs (one-time, documented in README.md "Key Vault auth"):
#   - a user-assigned managed identity with a federated credential for the
#     external-secrets SA (system:serviceaccount:external-secrets:external-secrets)
#   - that identity granted Key Vault Secrets User on kv-memql-staging
#   - the SA annotated azure.workload.identity/client-id=<the identity's clientId>
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: keyvault-staging
  namespace: memql
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-memql-staging.vault.azure.net
      # Azure AD tenant of kv-memql-staging / id-eso-memql. Required by the ESO
      # Azure provider under WorkloadIdentity (a tenant id is not a secret).
      tenantId: d1c0190e-eca9-422d-a7d2-74e9cebda7f5
      serviceAccountRef:
        name: external-secrets-kv   # SA in the memql ns, workload-identity annotated
