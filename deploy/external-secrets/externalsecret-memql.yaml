# ExternalSecret: memql-secrets <- Key Vault (deployment-v2 Phase 5, #703).
#
# Retires the hand-edited / `kubectl patch secret` flow for the cluster-facing
# secret material: ESO reconciles the keys of `memql-secrets` from Key Vault on
# a refresh interval, so the cluster secret state is declarative + reconciled
# (no operator drift).
#
# MEMQL_GENESIS_B64 IS GONE (epic memql#3958). It carried a sealed envelope that
# every pod decrypted into its own environment at boot -- a SECOND delivery path
# beside this Secret, which bought nothing this Secret does not already do. The
# one value it was genuinely load-bearing for, MEMQL_IDENTITY_SIGNING_KEY_B64,
# is declared in its own right on the second object below (memql#3960).
#
# Key Vault entries this expects (names in kv-<install>):
#   memql-master-key            -> MEMQL_MASTER_KEY
#   memql-operator-key          -> MEMQL_OPERATOR_KEY       (memql#3519)
#   memory-nodes-database-dsn   -> MEMQL_DATABASE_DSN
#
# AND FOUR MORE, on the second ExternalSecret at the bottom of this file
# (memql#3960). Read the block comment there before touching either object --
# the split into two objects is load-bearing, not tidiness.
---
# Workload-identity ServiceAccount the SecretStore authenticates as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-kv
  namespace: memql
  annotations:
    # The user-assigned managed identity's client id (federated to this SA).
    # Fill in at bootstrap; see README.md "Key Vault auth".
    azure.workload.identity/client-id: "765cb399-5d95-4099-b124-3dd1368ea91a"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memql-secrets
  namespace: memql
  annotations:
    # ARGO MUST NOT CLAIM `memql-secrets` (memql#4489).
    #
    # External Secrets copies this object's labels and annotations onto the
    # Secret it writes, and ArgoCD identifies its own resources by the
    # `app.kubernetes.io/instance` label. So an Argo-tracked ExternalSecret
    # hands its tracking label to a Secret that exists in NO repository, and
    # Argo reports it OutOfSync forever with nothing to sync and nothing to
    # fix. Observed live here: Secret/memql-secrets carrying
    # `app.kubernetes.io/instance: memql`.
    #
    # The fix turns the inheritance against itself -- the annotation rides the
    # same copy onto the generated Secret, where it tells Argo the omission is
    # deliberate. It is a no-op on this object, which IS in the repository.
    #
    # It matters MORE on this Secret than on any other: two ExternalSecrets
    # below merge into it, an instance repo may add a third, and every one of
    # them must carry the annotation or the Secret loses it again on the next
    # reconcile that writes the metadata.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keyvault
    kind: SecretStore
  target:
    name: memql-secrets
    # Merge: ESO manages these three keys without clobbering anything else on
    # the Secret. Flip to Owner once ESO is the sole writer (migration step in
    # README.md), so a key removed from Key Vault is removed from the cluster.
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: MEMQL_MASTER_KEY
      remoteRef:
        key: memql-master-key
    # The OPERATOR credential -- a different secret from the master key
    # (memql#3519). The master key decrypts; this one authenticates
    # `Authorization: Operator <key>` as a synthetic cluster owner.
    #
    # PREREQUISITE: create `memql-operator-key` in Key Vault BEFORE this
    # reconciles. ESO fails the whole ExternalSecret when a remoteRef cannot
    # be resolved, so a missing entry stalls the sync for every key here, not
    # just this one:
    #   az keyvault secret set --vault-name kv-<install> \
    #     --name memql-operator-key --value "$(openssl rand -hex 32)"
    - secretKey: MEMQL_OPERATOR_KEY
      remoteRef:
        key: memql-operator-key
    - secretKey: MEMQL_DATABASE_DSN
      remoteRef:
        key: memory-nodes-database-dsn
---
# ExternalSecret: the four keys the envelope used to smuggle (memql#3960).
#
# THE HOLE THIS CLOSES. Until now this file delivered exactly four keys, and
# MEMQL_IDENTITY_SIGNING_KEY_B64 was not among them. Yet
# deploy/k8s/base/identity.yaml runs `replicas: 2`, and that seed is what makes
# two replicas publish ONE JWKS: absent it, each pod falls through
# KeyManager.Load() to generateAndWriteCurrent(), mints its own Ed25519
# keypair, and a token minted by one replica is structurally unverifiable by
# any node that fetched JWKS from the other. That is memql#3400, and it
# presents as "sign-in is broken about half the time" with every manifest
# looking correct.
#
# So how did the cloud ever work? The seed rode INSIDE the sealed genesis
# envelope (MEMQL_GENESIS_B64 above), which every pod autoloaded set-if-absent
# at boot -- or an operator hand-added a key to memql-secrets outside ESO,
# which `creationPolicy: Merge` permits and nothing records or verifies. The
# envelope was therefore the only DECLARED delivery path for the one value that
# must be byte-identical on every identity replica, and deleting it
# (memql#3966) without this object is the outage.
#
# MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT, MEMQL_NODE_BOOTSTRAP_TOKEN and
# MEMORY_NODES_DATABASE_DIRECT_DSN sat in exactly the same undeclared position
# and are declared here for exactly the same reason.
#
# WHY THIS IS A SECOND OBJECT RATHER THAN FOUR MORE ENTRIES ABOVE. ESO fails
# the WHOLE ExternalSecret when any single remoteRef cannot be resolved -- the
# comment on memql-operator-key above says so, because it has already happened
# here once. Adding four not-yet-created refs to that object would stall
# reconciliation for MEMQL_MASTER_KEY, MEMQL_OPERATOR_KEY and
# MEMQL_DATABASE_DSN too, so a deploy of this change would freeze the secret
# material that already works. Split, a missing Key Vault entry stalls only the
# keys that are missing, which is the state the cluster is in today anyway.
#
# Both objects target the same Secret under `creationPolicy: Merge`, which is
# what makes the split invisible to every consumer: nodes envFrom
# `memql-secrets` and neither know nor care how many ExternalSecrets assembled
# it. Do not "tidy" these back together.
#
# PREREQUISITE -- create these in Key Vault BEFORE this reconciles:
#
#   # The Ed25519 signing seed. base64-STD of exactly 32 bytes
#   # (ed25519.SeedSize); `make identity-signing-key` prints one. Generating a
#   # NEW seed for a cluster that already has one is a hard swap of every
#   # unexpired JWT -- see identity-service.md#rotating-the-signing-key.
#   az keyvault secret set --vault-name kv-<install> \
#     --name memql-identity-signing-key-b64 --value "$(openssl rand -base64 32)"
#
#   # RFC3339 date the seed above was minted. Without it, key age reads as pod
#   # uptime and the overdue-rotation alert can never fire.
#   az keyvault secret set --vault-name kv-<install> \
#     --name memql-identity-signing-key-created-at --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
#
#   az keyvault secret set --vault-name kv-<install> \
#     --name memql-node-bootstrap-token --value "$(openssl rand -hex 32)"
#
#   # The DIRECT (non-pooled) DSN -- CNPG's -rw Service, not the pooler.
#   az keyvault secret set --vault-name kv-<install> \
#     --name memory-nodes-database-direct-dsn --value "postgres://..."
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memql-secrets-identity
  namespace: memql
  annotations:
    # The SAME annotation as the object above, and not optional here: both
    # objects write metadata onto the one `memql-secrets` Secret, so one of
    # them without it re-claims the Secret for Argo on its next reconcile
    # (memql#4489).
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keyvault
    kind: SecretStore
  target:
    name: memql-secrets
    # Merge, exactly as above: this object contributes four keys to the same
    # Secret and clobbers nothing else on it.
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    # THE #3400 KEY. Every identity replica must derive the same Ed25519 key,
    # kid and JWKS from this one seed.
    - secretKey: MEMQL_IDENTITY_SIGNING_KEY_B64
      remoteRef:
        key: memql-identity-signing-key-b64
    - secretKey: MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT
      remoteRef:
        key: memql-identity-signing-key-created-at
    - secretKey: MEMQL_NODE_BOOTSTRAP_TOKEN
      remoteRef:
        key: memql-node-bootstrap-token
    - secretKey: MEMORY_NODES_DATABASE_DIRECT_DSN
      remoteRef:
        key: memory-nodes-database-direct-dsn
