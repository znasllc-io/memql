# ExternalSecret: memql-secrets <- Key Vault (deployment-v2 Phase 5, #703).
#
# Retires the hand-edited / `kubectl patch secret` flow for the cluster-facing
# secret material: ESO reconciles the three keys of `memql-secrets` from
# kv-memql-staging on a refresh interval, so the cluster secret state becomes
# declarative + reconciled (no operator drift). The genesis A2 envelope keeps
# its role as the APP-INTERNAL shared-secret bootstrap (component/secret/,
# component/genesis/) -- ESO owns the *k8s Secret* that carries the envelope +
# master key + DSN, not the envelope's contents.
#
# Key Vault entries this expects (names in kv-memql-staging):
#   memql-master-key            -> MEMQL_MASTER_KEY
#   memql-genesis-b64           -> MEMQL_GENESIS_B64        (already in KV per §4)
#   memory-nodes-database-dsn   -> MEMORY_NODES_DATABASE_DSN
---
# Workload-identity ServiceAccount the SecretStore authenticates as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-kv
  namespace: memql
  annotations:
    # The user-assigned managed identity's client id (federated to this SA).
    # Fill in at bootstrap; see README.md "Key Vault auth".
    azure.workload.identity/client-id: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: memql-secrets
  namespace: memql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keyvault-staging
    kind: SecretStore
  target:
    name: memql-secrets
    # Merge: ESO manages these three keys without clobbering anything else on
    # the Secret. Flip to Owner once ESO is the sole writer (migration step in
    # README.md), so a key removed from Key Vault is removed from the cluster.
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: MEMQL_MASTER_KEY
      remoteRef:
        key: memql-master-key
    - secretKey: MEMQL_GENESIS_B64
      remoteRef:
        key: memql-genesis-b64
    - secretKey: MEMORY_NODES_DATABASE_DSN
      remoteRef:
        key: memory-nodes-database-dsn
