# Only the batch namespace and queue resources may depend on this webhook.
#
# THE TWO HOOKS ON JOBS FAIL OPEN. Under Fail, a controller restart answers every Job
# write in memql-pipelines with a 500 for about 13 s: a new step fails
# pipeline_execution_uncertain and stays failed, the isolation probe is refused, and so
# is a takeover claim. A step's Job needs neither hook to be safe: the runner creates a
# queued Job suspended, only the workbench's Role can create one here, and a Job a hook
# missed waits until the controller returns. Every other hook stays Fail, because no
# step writes those kinds and a queue written during an outage would go unvalidated.
# TestAControllerOutageCannotRefuseAStepsJob and
# TestNewStepsWaitThroughAControllerOutage hold this; the decision map says why.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kueue-mutating-webhook-configuration
webhooks:
- $patch: replace
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kueue-webhook-service
      namespace: kueue-system
      path: /mutate-kueue-x-k8s-io-v1beta2-clusterqueue
  failurePolicy: Fail
  name: mclusterqueue.kb.io
  rules:
  - apiGroups:
    - kueue.x-k8s.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    resources:
    - clusterqueues
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kueue-webhook-service
      namespace: kueue-system
      path: /mutate-batch-v1-job
  failurePolicy: Ignore
  name: mjob.kb.io
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: memql-pipelines
  rules:
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - jobs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kueue-webhook-service
      namespace: kueue-system
      path: /mutate-kueue-x-k8s-io-v1beta2-resourceflavor
  failurePolicy: Fail
  name: mresourceflavor.kb.io
  rules:
  - apiGroups:
    - kueue.x-k8s.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    resources:
    - resourceflavors
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: kueue-webhook-service
      namespace: kueue-system
      path: /mutate-kueue-x-k8s-io-v1beta2-workload
  failurePolicy: Fail
  name: mworkload.kb.io
  rules:
  - apiGroups:
    - kueue.x-k8s.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    resources:
    - workloads
  sideEffects: None
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: memql-pipelines
---
