apiVersion: v1
kind: ConfigMap
metadata:
  name: kueue-manager-config
  namespace: kueue-system
data:
  controller_manager_config.yaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    managedJobsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: memql-pipelines
    integrations:
      frameworks: ["batch/job"]
    manageJobsWithoutQueueName: false
    # Omitted deliberately: any non-null value enables eviction/requeue in
    # v0.20. This runner must never replay an admitted command.
