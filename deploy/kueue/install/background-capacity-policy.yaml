# A typed operator-owned parameter keeps the ceiling independent of runtime
# edits. A dedicated CRD also avoids the Kubernetes 1.32 shared core informer
# lifecycle: removing the last policy can stop a ConfigMap informer that the
# shared factory will not restart when a policy is installed again.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backgroundcapacitypolicies.capacity.memql.io
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  group: capacity.memql.io
  scope: Cluster
  names:
    plural: backgroundcapacitypolicies
    singular: backgroundcapacitypolicy
    kind: BackgroundCapacityPolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [cpuMilli, memoryMiB, diskMiB, jobs, nodePool]
              properties:
                cpuMilli: {type: integer, format: int64, minimum: 1, maximum: 1099511627776}
                memoryMiB: {type: integer, format: int64, minimum: 1, maximum: 1099511627776}
                diskMiB: {type: integer, format: int64, minimum: 1, maximum: 1099511627776}
                jobs: {type: integer, format: int64, minimum: 1, maximum: 1099511627776}
                nodePool: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
