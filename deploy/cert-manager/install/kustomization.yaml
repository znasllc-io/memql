# cert-manager install (epic memql#3842, task memql#3845).
#
# WHY THIS EXISTS NOW. cert-manager was already a DEPENDENCY of this repository
# and was installed nowhere in it. deploy/external-secrets/install ships a
# `cert-manager.io/v1` Issuer for the ESO webhook cert, and eso-values.yaml says
# plainly "cert-manager (already installed on this cluster)" -- an assumption
# held together by whoever installed it by hand. The front-door manifests carry
# ClusterIssuers on the same footing.
#
# The Barman Cloud plugin (../../cnpg/install) is what forced the issue: its
# manifest contains Certificate and Issuer objects for the plugin<->operator
# mTLS, so on a cluster without cert-manager's CRDs that Application does not
# degrade, it fails to apply. Making the dependency real -- pinned, reconciled,
# and identical in every environment -- is cheaper than a fourth consumer
# discovering it the same way.
#
# NOT INSTALLED FOR LOCAL TLS. The local front door uses mkcert
# (scripts/lib/localtls.sh), and that stays true; this install is here so the
# CRDs and the controller exist for the workloads that need them.
#
# UPGRADES. cert-manager supports roughly the two most recent minors. Bump the
# tag below, let ArgoCD sync, and confirm the three Deployments in the
# cert-manager namespace roll cleanly. CRD changes ride the same manifest --
# which is why this is pinned to an exact tag and never to `latest`.
#
# Reconciled by deploy/argocd/apps/cert-manager.yaml, which carries a sync-wave
# ahead of the CNPG stack so the CRDs land before anything references them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # cert-manager v1.21.1, upstream static install (controller + webhook +
  # cainjector + CRDs). Ships its own `cert-manager` Namespace, so this
  # kustomization deliberately declares no `namespace:` -- setting one would
  # rewrite the cluster-scoped and cross-namespace references the manifest
  # makes to itself.
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml

# ---- Azure workload identity for the DNS-01 solver (epic memql#4339, task memql#4347) ----
#
# The cloud overlays declare a `letsencrypt-dns01` ClusterIssuer whose azureDNS
# solver authenticates as a managed identity -- no client secret exists in the
# cluster to leak. That only works if the CONTROLLER POD is admitted by the
# Azure workload-identity webhook, and the webhook keys off two things the
# upstream static manifest does not carry: the label on the pod template and
# the client-id annotation on the ServiceAccount.
#
# WHY HERE AND NOT IN A CLOUD OVERLAY. Both cloud overlays set
# `namespace: memql`, and kustomize's namespace transformer rewrites the
# namespace of every resource it renders -- including one that names
# `cert-manager` explicitly. A ServiceAccount patch for the cert-manager
# namespace cannot live there. It also cannot live in a runbook: this path is
# an ArgoCD Application, so an operator's hand-patch is reverted on the next
# sync, and the DNS-01 issuer then fails to authenticate with nothing in the
# manifests to explain why.
#
# INERT WITHOUT AZURE, WHICH IS WHY ONE SHAPE SERVES EVERY TARGET. Both values
# are read ONLY by the azure-workload-identity mutating webhook. On a cluster
# where that webhook is not installed -- every local k3d cluster, which reaches
# this same path through scripts/k3d/up.sh -- the label matches no admission
# rule and the annotation is a string nothing dereferences. Neither changes
# what cert-manager does, so this stays a VALUE that varies (the client id) over
# a shape that does not, per the environment-parity rule.
#
# The client id is the same `REPLACE-WITH-` install-time placeholder idiom the
# cloud overlays already use for the database identity. Replace it with the
# identity that holds `DNS Zone Contributor` on the domain's Azure DNS zone and
# carries a federated credential for
# `system:serviceaccount:cert-manager:cert-manager`; the steps are in
# docs/public/operate/azure-entry-install.md.
patches:
  - target:
      kind: ServiceAccount
      name: cert-manager
      namespace: cert-manager
    patch: |
      - op: add
        path: /metadata/annotations/azure.workload.identity~1client-id
        value: "REPLACE-WITH-CERT-MANAGER-IDENTITY-CLIENT-ID"
  - target:
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    patch: |
      - op: add
        path: /spec/template/metadata/labels/azure.workload.identity~1use
        value: "true"
