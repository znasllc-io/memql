# Engine node canary Rollout -- cognition (deployment-v2 Phase 3, #701).
#
# The engine node-types (cognition/voice/agent/planner/workbench) are stateless
# behind the BFF, so they roll as CANARIES: shift a fraction of the new version
# in, gate it with the in-cluster deploy-gate, and only proceed on green;
# otherwise the Rollout aborts back to the stable ReplicaSet automatically.
#
# This file is the cognition exemplar; the same shape applies to the other
# engine nodes (swap the name + workloadRef). Like the BFF Rollout it ADOPTS the
# committed Deployment's pod template via workloadRef, so the image digest still
# comes from the Phase 1 overlay (single source of truth).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cognition
  namespace: memql
  labels:
    app.kubernetes.io/name: cognition
    app.kubernetes.io/part-of: memql
    memql/node-type: cognition
spec:
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cognition
    scaleDown: onsuccess
  replicas: 2
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      # Background analysis runs the in-cluster gate against the canary service
      # while traffic ramps; a failure aborts + rolls back automatically.
      analysis:
        templates:
          - templateName: deploy-gate
        args:
          - name: service
            value: cognition-canary
        startingStep: 1   # begin analysis after the first canary step is up
      canaryService: cognition-canary
      steps:
        - setWeight: 25
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: cognition-canary
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
    memql/node-type: cognition
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cognition
  ports:
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
    - { name: node, port: 50054, targetPort: 50054 }
