# deploy-gate service_account JWT provisioning (deployment-v2 Phase 3, #691/#701).
#
# The deploy-gate AnalysisTemplate authenticates with a short-lived
# class="service_account" JWT delivered as the `deploy-gate-jwt` Secret (key
# MEMQL_SVC_JWT). The JWT TTL is 1h (no refresh path), so a CronJob re-mints it
# ahead of expiry. Minting requires the identity signing key, which only the
# identity binary holds -- so the CronJob execs `service-account-token mint`
# inside the live identity pod (autoloads the genesis envelope per #751) and
# writes the result back to the Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-gate-jwt-minter
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-gate-jwt-minter
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
rules:
  # Find the running identity pod...
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # ...exec the mint inside it...
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # ...and write the minted JWT into the deploy-gate-jwt Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-gate-jwt-minter
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-gate-jwt-minter
subjects:
  - kind: ServiceAccount
    name: deploy-gate-jwt-minter
    namespace: memql
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deploy-gate-jwt-mint
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
spec:
  # 1h TTL -> re-mint every 45m so a fresh token is always in the Secret.
  schedule: "*/45 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: memql
        spec:
          serviceAccountName: deploy-gate-jwt-minter
          restartPolicy: Never
          containers:
            - name: mint
              # Pinned kubectl + shell (alpine/k8s; rancher/kubectl is distroless, no /bin/sh).
              image: alpine/k8s@sha256:dfe8c7a06c41d0b6e8757da99531f8f302e9a2687fa0155af4c4087df585c9c8
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pod="$(kubectl -n memql get pod -l app.kubernetes.io/name=identity \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{.items[0].metadata.name}')"
                  [ -n "$pod" ] || { echo "no running identity pod"; exit 1; }
                  echo "minting via $pod"
                  token="$(kubectl -n memql exec "$pod" -- \
                    /app/memql service-account-token mint \
                      --label deploy-gate-staging --subject system:deploy-gate)"
                  case "$token" in
                    eyJ*) : ;;  # looks like a JWT
                    *) echo "mint did not return a JWT"; exit 1 ;;
                  esac
                  kubectl -n memql create secret generic deploy-gate-jwt \
                    --from-literal=MEMQL_SVC_JWT="$token" \
                    --dry-run=client -o yaml | kubectl -n memql apply -f -
                  echo "deploy-gate-jwt updated"
