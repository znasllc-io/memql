# deploy-gate service_account JWT provisioning (deployment-v2 Phase 3, #691/#701).
#
# The deploy-gate AnalysisTemplate self-mints a fresh service_account JWT at gate
# time (#2179, see analysis/deploy-gate.yaml) and uses the `deploy-gate-jwt`
# Secret (key MEMQL_SVC_JWT) only as a FALLBACK. This CronJob keeps that fallback
# warm: it re-mints the static token with a wide 6h TTL on a */45m cadence, so a
# missed/failed mint can't expire it before the next run (the tight 1h TTL +
# stale secret was the #2179 root cause that aborted every bff rollout on the
# gate). Minting requires the identity signing key, which only the identity
# binary holds -- so the CronJob execs `service-account-token mint` inside the
# live identity pod (autoloads the genesis envelope per #751) and writes the
# result back to the Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-gate-jwt-minter
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-gate-jwt-minter
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
rules:
  # Find the running identity pod...
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # ...exec the mint inside it...
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # ...and write the minted JWT into the deploy-gate-jwt Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-gate-jwt-minter
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-gate-jwt-minter
subjects:
  - kind: ServiceAccount
    name: deploy-gate-jwt-minter
    namespace: memql
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deploy-gate-jwt-mint
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
spec:
  # 6h TTL -> re-mint every 45m so the fallback static token always has a wide
  # expiry margin (a missed/failed mint can't strand the gate). The gate's own
  # self-mint init container (#2179) is the primary credential; this keeps the
  # fallback fresh.
  schedule: "*/45 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: memql
        spec:
          serviceAccountName: deploy-gate-jwt-minter
          restartPolicy: Never
          containers:
            - name: mint
              # Pinned kubectl + shell (alpine/k8s; rancher/kubectl is distroless, no /bin/sh).
              image: alpine/k8s@sha256:dfe8c7a06c41d0b6e8757da99531f8f302e9a2687fa0155af4c4087df585c9c8
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pod="$(kubectl -n memql get pod -l app.kubernetes.io/name=identity \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{.items[0].metadata.name}')"
                  [ -n "$pod" ] || { echo "no running identity pod"; exit 1; }
                  echo "minting via $pod"
                  token="$(kubectl -n memql exec "$pod" -- \
                    /app/memql service-account-token mint \
                      --label deploy-gate-staging --subject system:deploy-gate --ttl 6h)"
                  case "$token" in
                    eyJ*) : ;;  # looks like a JWT
                    *) echo "mint did not return a JWT"; exit 1 ;;
                  esac
                  kubectl -n memql create secret generic deploy-gate-jwt \
                    --from-literal=MEMQL_SVC_JWT="$token" \
                    --dry-run=client -o yaml | kubectl -n memql apply -f -
                  echo "deploy-gate-jwt updated"
