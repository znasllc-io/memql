# Headless-browser deep-smoke tier as an AnalysisTemplate (deployment-v2 #658).
#
# Runs the Playwright tier (acrmemql.azurecr.io/deploy-gate-browser, built from
# deploy/gate-browser) as a SEPARATE job -- NOT folded into the BFF Rollout's
# fast prePromotionAnalysis (deploy-gate.yaml), because Chromium boot + the
# walkthrough are too slow to block every promotion (the #658 latency-vs-coverage
# decision). Attach it to a promotion when deeper coverage is wanted, and/or run
# it post-deploy to feed the promotion record. A non-zero Playwright exit fails
# the run.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: deploy-gate-browser
  namespace: memql
spec:
  args:
    - name: base-url
      value: https://app.staging.copresent.ai
  metrics:
    - name: headless-walkthrough
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 1
            activeDeadlineSeconds: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: gate-browser
                    image: acrmemql.azurecr.io/deploy-gate-browser:latest
                    env:
                      - name: GATE_BASE_URL
                        value: "{{args.base-url}}"
                      # Short-lived USER access token for the dedicated test user
                      # (NOT the service_account JWT -- the browser needs a user
                      # session). Minted into this Secret by an identity-side Job.
                      - name: GATE_AUTH_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: deploy-gate-browser-auth
                            key: GATE_AUTH_TOKEN
                            optional: true
                      # CoPresent UI contracts -- confirm at bring-up.
                      - name: GATE_AUTH_STORAGE_KEY
                        value: "memql.auth.token"
                      - name: GATE_DASHBOARD_SELECTOR
                        value: '[data-testid="dashboard"]'
