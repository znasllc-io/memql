# In-cluster deploy gate (deployment-v2 Phase 3, znasllc-io/memql#701).
#
# Replaces the bespoke public-host shell smoke (staging-smoke-test.sh) with an
# Argo Rollouts AnalysisTemplate that runs CONVERGENCE-SAFE, IN-CLUSTER checks
# against the new ReplicaSet's preview/canary service -- NOT a public host. This
# structurally eliminates the #680 (wrong host) and #682 (mixed-version
# convergence race) failure modes and needs no firewall exception, because the
# checks dial in-cluster service DNS and the Rollout only runs them once the
# analysed pods are Ready.
#
# Three checks (a failure on any aborts the Rollout -> automatic rollback to the
# stable ReplicaSet -- no `rollout undo`, no script):
#   1. readiness  -- GET /readyz on the analysed service; asserts the critical
#                    schema is present (#657). Proves a migration actually
#                    applied, credential-free.
#   2. auth-query -- an AUTHENTICATED query via the class="service_account" JWT
#                    (#691), fanning BFF -> cognition/agent. Proves the
#                    authenticated app path, not just front-door 200s (the 0.9.6
#                    incident went front-door-green while the app was broken).
#   3. slo        -- optional Prometheus gate: error-rate / p95 / active-stream
#                    drop. Enabled when a Prometheus address is provided.
#
# Args are passed by the Rollout (the analysed service name + the namespace).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: deploy-gate
  namespace: memql
spec:
  args:
    - name: service          # the analysed (preview/canary) Service name
    - name: namespace
      value: memql
  metrics:
    # ---- 1 + 2: readiness + authenticated query, in one Job ------------------
    - name: readyz-and-auth-query
      # Tolerate a TRANSIENT not-ready preview color so the gate doesn't
      # false-abort the promotion under brief capacity pressure (#2044). The
      # earlier `count: 1, failureLimit: 0` aborted on the very first probe, so
      # if the preview ReplicaSet's pods were still scheduling (or its Service
      # endpoints still propagating) the gate dialed bff-preview, got connection
      # refused, and killed the cutover -- observed across rev 73->76 on the
      # 0.9.89/0.9.90 staging cuts. Now:
      #   * initialDelay -- wait for the preview pods to register endpoints
      #     before the first probe;
      #   * count > 1 + interval -- re-probe a few times;
      #   * failureLimit: 1 -- tolerate ONE transient failure, but still abort a
      #     genuinely broken release (>=2 failures), so the gate stays strict.
      initialDelay: 30s
      count: 3
      interval: 20s
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 120
            template:
              spec:
                restartPolicy: Never
                # Self-mint a FRESH service_account JWT at gate time (#2179). The
                # `mint` init container (below) best-effort execs the mint inside
                # the running identity pod and writes the token to /gate/svc-jwt;
                # the `gate` container reads it via MEMQL_SVC_JWT_FILE. If the mint
                # fails for ANY reason (no identity pod, mint error, non-JWT output)
                # the init container exits 0 WITHOUT writing the file, and the gate
                # transparently falls back to the static MEMQL_SVC_JWT secret env
                # (the CronJob-minted deploy-gate-jwt Secret). So this is strictly
                # safer than the static-only path: best case a fresh mint, worst
                # case identical to before. The static secret going stale
                # (minted, then rejected Unauthenticated) was the #2179 root cause
                # that aborted every bff rollout on the gate.
                serviceAccountName: deploy-gate-jwt-minter
                volumes:
                  - name: gate-token
                    emptyDir: {}
                initContainers:
                  - name: mint
                    # Same pinned kubectl+shell image as the deploy-gate-jwt
                    # CronJob mint step (alpine/k8s; rancher/kubectl is distroless,
                    # no /bin/sh). Mirrors that script's structure + identity-pod
                    # selector. BEST-EFFORT: never `exit 1` on a mint failure --
                    # always `exit 0` so the gate falls back to the static secret.
                    image: alpine/k8s@sha256:dfe8c7a06c41d0b6e8757da99531f8f302e9a2687fa0155af4c4087df585c9c8
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -u
                        pod="$(kubectl -n {{args.namespace}} get pod -l app.kubernetes.io/name=identity \
                          --field-selector=status.phase=Running \
                          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
                        if [ -z "$pod" ]; then
                          echo "deploy-gate mint: no running identity pod; falling back to static MEMQL_SVC_JWT secret"
                          exit 0
                        fi
                        echo "deploy-gate mint: minting a fresh service_account JWT via $pod"
                        token="$(kubectl -n {{args.namespace}} exec "$pod" -- \
                          /app/memql service-account-token mint \
                            --label deploy-gate-staging --subject system:deploy-gate --ttl 3h 2>/dev/null || true)"
                        case "$token" in
                          eyJ*)
                            printf '%s' "$token" > /gate/svc-jwt
                            echo "deploy-gate mint: fresh token written to /gate/svc-jwt"
                            ;;
                          *)
                            echo "deploy-gate mint: mint did not return a JWT; falling back to static MEMQL_SVC_JWT secret"
                            ;;
                        esac
                        exit 0
                    volumeMounts:
                      - name: gate-token
                        mountPath: /gate
                containers:
                  - name: gate
                    # deploy-gate-check is a distroless static binary (no /bin/sh,
                    # no curl in the image). It runs BOTH gate legs in-process:
                    #   1. /readyz schema assertion (#657) -- derived from --addr
                    #      host as http://<host>:8085/readyz;
                    #   2. the authenticated service_account query over gRPC (#691).
                    #      Token resolution (#2179): MEMQL_SVC_JWT_FILE (the fresh
                    #      self-minted token at /gate/svc-jwt, if the init container
                    #      wrote it) > MEMQL_SVC_JWT (the static CronJob-minted
                    #      secret fallback). A missing/empty file falls through to
                    #      the secret, so the gate never depends on the static
                    #      secret being fresh -- only on at least one source being
                    #      valid.
                    # A non-200/not-ready /readyz, an auth rejection
                    # (Unauthenticated/PermissionDenied), or a backend Unavailable
                    # exits non-zero -> the metric fails -> the Rollout auto-aborts
                    # to the stable color. Invoke the ENTRYPOINT binary directly --
                    # do NOT wrap in `/bin/sh -c` (the image has no shell; that was
                    # the #712 false-negative that aborted the first cutover).
                    image: acrmemql.azurecr.io/deploy-gate@sha256:4a65bd3dcf9e2f25092617e76667b5f40bf1a122e8dd58a6973322de241189c7
                    env:
                      # Preferred: the fresh self-minted token written by the
                      # `mint` init container at gate time (#2179).
                      - name: MEMQL_SVC_JWT_FILE
                        value: /gate/svc-jwt
                      # Fallback: the static class=service_account JWT minted into
                      # this Secret by the deploy-gate-jwt CronJob. Used only when
                      # the self-mint file is absent/empty.
                      - name: MEMQL_SVC_JWT
                        valueFrom:
                          secretKeyRef:
                            name: deploy-gate-jwt
                            key: MEMQL_SVC_JWT
                    volumeMounts:
                      - name: gate-token
                        mountPath: /gate
                    args:
                      - "--addr={{args.service}}:50051"
                      # Must be a well-formed MemQL query: a parse error makes the
                      # engine log a `memql query execution failed` ERROR on the node
                      # on every gate run (znasllc-io/memql#1130). queryActivePartitionIds
                      # is the id-only projection of active v1:cognition:space rows
                      # -- a real cognition-concept read that exercises BFF->cognition.
                      - "--query=queryActivePartitionIds({})"
---
# ---- 3: optional SLO gate (Prometheus) --------------------------------------
# Enabled by referencing this template too in the Rollout's analysis block and
# providing `prometheus-addr`. Kept separate so the readiness+auth gate works
# even before Prometheus is wired. Thresholds are conservative starting points;
# tune against observed staging baselines.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: deploy-gate-slo
  namespace: memql
spec:
  args:
    - name: service
    - name: prometheus-addr
      value: http://prometheus-operated.monitoring:9090
  metrics:
    - name: error-rate
      interval: 30s
      count: 4
      successCondition: result[0] <= 0.02   # <=2% 5xx
      failureLimit: 1
      provider:
        prometheus:
          address: "{{args.prometheus-addr}}"
          query: |
            sum(rate(grpc_server_handled_total{grpc_code=~"Internal|Unknown|Unavailable",service="{{args.service}}"}[2m]))
            / clamp_min(sum(rate(grpc_server_handled_total{service="{{args.service}}"}[2m])), 1)
    - name: p95-latency-ms
      interval: 30s
      count: 4
      successCondition: result[0] <= 1500   # p95 <= 1.5s
      failureLimit: 1
      provider:
        prometheus:
          address: "{{args.prometheus-addr}}"
          query: |
            histogram_quantile(0.95, sum(rate(grpc_server_handling_seconds_bucket{service="{{args.service}}"}[2m])) by (le)) * 1000
    - name: active-stream-drop
      # The #616 activeStreams primitive: a healthy promotion must not drop
      # live user streams. Alert if active streams fall sharply during analysis.
      interval: 30s
      count: 4
      successCondition: result[0] >= 0
      failureLimit: 1
      provider:
        prometheus:
          address: "{{args.prometheus-addr}}"
          query: |
            min_over_time(memql_active_streams{service="{{args.service}}"}[2m])
