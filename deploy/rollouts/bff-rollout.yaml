# BFF blue/green Rollout (deployment-v2 Phase 3, znasllc-io/memql#701).
#
# Converts the single `bff` Deployment to an Argo Rollouts blue/green Rollout,
# realizing the #616/#675 design as a controller-driven, analysis-gated cutover
# (instead of the manual bff-bluegreen-cutover.sh script). Behavior preserved:
# NEW logins land on the new (preview->active) color; the previous color keeps
# serving its open MemqlService.Stream sessions until they drain (#615), then
# scales down.
#
# WHY workloadRef (not a duplicated pod template): the Rollout ADOPTS the
# existing `bff` Deployment's pod template (deploy/k8s/base/bff.yaml) by
# reference, so there is exactly one place the bff pod spec + image digest live
# (the digest-pinned overlay, Phase 1 #699). At cutover the controller scales
# the referenced Deployment to 0 and owns the ReplicaSets.
#
# GATE: prePromotionAnalysis runs the in-cluster deploy-gate (analysis/
# deploy-gate.yaml) against the PREVIEW service BEFORE traffic flips. A failed
# analysis aborts the promotion and keeps the active (stable) color serving --
# automatic rollback, no `rollout undo`.
#
# DEPLOY DRIVER (znasllc-io/memql#1878): the deploycontrol "azure" driver
# (component/deploycontrol/driver.go) reuses THIS rollout's path. Deploy /
# RollbackDeployment run scripts/release/promote.sh, which pins the
# digest-authority overlay; Argo CD + this blue/green Rollout's prePromotion
# gate then reconcile and cut over. Rollback redeploys a historical release's
# pinned digest through the same promote path (NOT a color flip -- the previous
# color only survives the scale-down window).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: bff
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
    memql/node-type: bff
spec:
  # Adopt the committed Deployment's pod template (image digest comes from the
  # Phase 1 overlay). scaleDown=onsuccess keeps the old Deployment definition
  # around but scaled to 0 once the Rollout owns traffic.
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff
    scaleDown: onsuccess
  replicas: 2
  strategy:
    blueGreen:
      # NEW logins AND internal mesh parent-stream dials land here once promoted
      # (#1399): bff-active carries 8085/50051/50058 and the Rollout pins its
      # selector to the active color, so neither user traffic nor a leaf's
      # parent stream can land on the draining old color. The unscoped `bff`
      # Service is retained only as a same-namespace DNS alias for tooling/
      # compatibility; nothing on the mesh hot path dials it anymore.
      activeService: bff-active
      previewService: bff-preview
      # Hold the new color as preview, gate it, THEN flip. Manual promote keeps
      # the operator in the loop for the first cutovers; set to true to make a
      # green analysis auto-promote.
      autoPromotionEnabled: false
      prePromotionAnalysis:
        templates:
          - templateName: deploy-gate
        args:
          - name: service
            value: bff-preview
      # After the flip, keep the old color up briefly to drain its open streams
      # (#615 + the #616 activeStreams primitive) before the controller scales it
      # down. Lowered 300->120 (#1858): the doubled bff pods + their DB pools held
      # for 5 min were a top contributor to the deploy-time 53300 connection-budget
      # overlap. 120s still drains most streams; older streams reconnect to the new
      # color, and #616 already scales down earlier once activeStreams hit zero --
      # so the ceiling rarely binds. Per-env override is fine if prod needs longer.
      #
      # memql#1875: the old color no longer holds its Postgres pool for the whole
      # window. When the controller scales the old ReplicaSet down (SIGTERM ->
      # preStop -> app drain), app/run.go now CLOSES the DB pool as an explicit
      # drain phase before the dependency Stop sweep, so the old color's TigerDB
      # sessions are handed back promptly at teardown rather than lingering. This
      # shrinks the worst-case overlap; lowering scaleDownDelaySeconds further is
      # an option once the TigerDB max_connections ceiling is confirmed.
      scaleDownDelaySeconds: 120
---
# Preview Service the Rollout points new (pre-promotion) pods at, so the gate can
# exercise the new color in-cluster before any user traffic flips to it. The
# Rollout controller manages the rollouts-pod-template-hash selector.
apiVersion: v1
kind: Service
metadata:
  name: bff-preview
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
    memql/node-type: bff
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
  ports:
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# Active Service the Rollout flips user traffic to. The public /memql Ingress
# points HERE (not the color-agnostic `bff` Service), so new logins land only on
# the active color. The Rollout controller manages the rollouts-pod-template-hash
# selector; on promote it repoints this Service to the new color. Established
# WS/gRPC streams stay bound to their old-color pods (the TCP connection is to a
# specific pod), so only NEW connections steer -- the zero-dropped-stream design.
#
# #1399: this Service ALSO carries the NodeService port (50058) and is the dial
# target for internal mesh consumers (MEMQL_PARENT_ADDRESS / MEMQL_GRPC_ADDR ->
# bff-active). The leaf mesh is a star: every leaf (cognition/agent/planner/
# voice/workbench/voice-agent) holds ONE parent stream to a bff and the bff
# fans events out to ITS monitored children -- there are no bff->bff cross-color
# forwards. So a leaf's parent stream MUST land on the ACTIVE color only. The
# old, unscoped `bff` Service selected both colors, so a leaf that (re)connected
# during the 3600s scaleDownDelay could pin its single parent stream to a
# DRAINING old-color pod -- the ~1h mixed-version mesh / dead-parent-stream
# window in #1399 (and the parent-stream face of the #1388 peer decay). Pinning
# the dial target to the Rollout-managed active selector closes that window:
# new mesh connections only ever land on the active color.
apiVersion: v1
kind: Service
metadata:
  name: bff-active
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
    memql/node-type: bff
    memql/role: user-entry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
  ports:
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
    # NodeService (mesh parent stream + cross-node forwards). #1399: internal
    # consumers dial bff-active:50058 so the parent stream is color-pinned to
    # the active Rollout color, never the draining old one.
    - { name: node, port: 50058, targetPort: 50058 }
