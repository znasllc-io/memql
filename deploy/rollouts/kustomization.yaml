# GitOps surface for the live BFF blue/green Rollout (deployment-v2, #766).
#
# This kustomization is what the `rollouts` Argo Application
# (deploy/argocd/apps/rollouts.yaml) renders. It selects ONLY the resources
# that are actually applied live in the cluster (the manual #712 cutover, now
# being reconciled into Git) -- NOT the exemplars or the controller install:
#
#   bff-rollout.yaml          -> the live Rollout + bff-active/bff-preview Services
#   analysis/deploy-gate.yaml -> the deploy-gate + deploy-gate-slo AnalysisTemplates
#   deploy-gate-jwt.yaml      -> the deploy-gate-jwt minter SA/Role/RoleBinding/CronJob
#
# Deliberately EXCLUDED:
#   cognition-canary.yaml     -> a canary EXEMPLAR; no cognition Rollout is live.
#   analysis/browser-gate.yaml-> not referenced by any live Rollout.
#   install/                  -> the Argo Rollouts controller; installed
#                                out-of-band (additive, cluster-scoped) and
#                                managed separately, not by the memql project.
#
# The deploy-gate-jwt SECRET (key MEMQL_SVC_JWT) is intentionally NOT listed:
# it is minted out-of-band by the deploy-gate-jwt-mint CronJob (like
# memql-secrets), so Argo never sees it and never prunes it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - bff-rollout.yaml
  - analysis/deploy-gate.yaml
  - deploy-gate-jwt.yaml
