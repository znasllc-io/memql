# Instance profile: SOLO -- the condensed shape (epic memql#3852, task memql#3853).
#
# One replica of every mesh node. Used by the Trial and Node tiers; see
# ../../README.md for the tier -> profile table and for why the presets are
# keyed by profile rather than by tier.
#
# ONE REPLICA IS A DELIBERATE TIER PROPERTY, not an oversight. Node's price does
# not include high availability, and rendering two replicas anyway would be
# giving away the add-on while still calling it an add-on. A Node tenant who
# buys HA gets ../../optional/ha composed on top of this, which raises the mesh
# counts to 2.
#
# WHAT THIS PRESET IS NOT, YET. This is the replica-count half of the condensed
# instance profile. The deeper condensation -- collapsing the mesh into fewer
# PROCESSES, which is what takes entry cost of goods from roughly $143 to
# roughly $90 -- is task memql#3856, and this preset is the seam it lands in.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # The mesh: one of each. Stated for every node rather than inherited from
  # base, for the reason overlays/cloud states its counts rather than inheriting
  # them -- a count that is inherited in one profile and stated in another is a
  # structural difference wearing a number's clothes.
  - target: { kind: Deployment, name: identity }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: bff }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: planner }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: workbench }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: mcp }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: edge }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }

