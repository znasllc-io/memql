# Instance profile: STANDARD -- the full mesh (epic memql#3852, task memql#3853).
#
# Two replicas of every mesh node, and the voice lane on. Used by the Graph
# tier; see ../../README.md for the tier -> profile table.
#
# TWO OF EVERYTHING IS THE TIER, not a capacity guess. Graph's price includes
# high availability, and "HA" for a mesh means every service replicated -- a
# tier that promises replication while running one replica of `agent` is a
# promise the running cluster does not keep, and nothing about the cluster would
# say so. This is also the topology the engine is DESIGNED against: multi-node
# is the default (CLAUDE.md, "Multi-node is the DEFAULT"), and the bug class
# that only appears at two replicas -- state living on one node while another
# handles the request -- is one a paying customer should never be the first to
# find.
#
# THE VOICE LANE IS ON, at one replica each. Graph includes 1,000 voice minutes,
# so the capability has to exist. One rather than two because voice-agent is a
# room DISPATCHER rather than a request-serving mesh node (one replica serves up
# to MEMQL_VOICE_MAX_ROOMS rooms concurrently), and because a second LiveKit
# server is a capacity decision rather than an availability one at this tier.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target: { kind: Deployment, name: identity }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: bff }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: cognition }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: planner }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: workbench }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: mcp }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: edge }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: voice }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: voice-agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: livekit }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
