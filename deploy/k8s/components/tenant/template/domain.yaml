# The tenant's domain (epic memql#3852, task memql#3853).
#
# Rendered by scripts/fleet/tenant-provision.sh; __TENANT__ and __DOMAIN__ are
# substituted.
#
# ONE KEY, and six things derive from it: identity's base URL, the issuer every
# node in this tenant verifies against, the discovery endpoint, the CORS
# origins, and the OAuth redirect URIs (component/envregistry/domain.go). Those used
# to be pinned separately, and missing one is not a visible failure -- memql#3315
# was a single forgotten CORS origin, and it presented as sign-in dying with an
# empty identity log.
#
# WHY THIS IS A COMMITTED RESOURCE HERE AND A SEEDED SECRET LOCALLY. The local
# cluster's memql-domain comes from `make secrets`, imperatively, because a
# developer's domain is a bring-up argument. A tenant's domain is part of what
# the customer bought and has to survive a cluster rebuild, so it belongs in the
# git state ArgoCD reconciles -- and it is not secret: it is the hostname the
# customer types into a browser.
#
# NOT `optional` on the mount. A node with no domain
# derives nothing, falls back to the base manifests' placeholder issuer, boots,
# forms a mesh, and rejects every token with an error naming neither the domain
# nor this ConfigMap. Refusing to start is the honest failure.
apiVersion: v1
kind: ConfigMap
metadata:
  name: memql-domain
  namespace: __TENANT__
  labels:
    app.kubernetes.io/name: memql-domain
    app.kubernetes.io/part-of: memql
data:
  MEMQL_DOMAIN: __DOMAIN__
