# JSON 6902 patch: mount the tenant's `memql-domain` ConfigMap as env on every
# engine node (epic memql#3852, task memql#3853).
#
# The per-tenant twin of deploy/k8s/overlays/local/patches/domain-envfrom.yaml,
# and it carries that file's reasoning: `envFrom` has no patch merge key, so a
# strategic-merge patch REPLACES the whole list -- which would silently drop
# `memql-secrets` (the master key, the genesis envelope, the database DSN) from
# every node it touched. `add` at `envFrom/-` appends, leaving what is there
# alone.
#
# NOT `optional`: see domain.yaml for why a node with
# no domain is a node that boots and then rejects every token.
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    configMapRef:
      name: memql-domain
