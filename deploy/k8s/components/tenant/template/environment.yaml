# The tenant's environment, expressed as VALUES (epic memql#3852, task memql#3853).
#
# The per-tenant twin of deploy/k8s/overlays/{prod,staging}/environment.yaml.
# Rendered by scripts/fleet/tenant-provision.sh; __TENANT__ is substituted.
#
# MEMQL_ENVIRONMENT IS `production`, AND THAT IS NOT A TYPO. A tenant is a
# customer's production system. The enum's three members name deploy TARGETS
# (development | staging | production), and every engine gate that reads it --
# TestNoEnvironmentBranchingInEngineCode forbids the engine from branching on
# the value at all -- treats it as a label stamped on v1:cluster:node rows.
# Calling a paying customer's instance anything else would make its node rows
# lie about what they are.
#
# THE SEARCH PATH IS UNSET, AND THAT IS THE ISOLATION MODEL. Staging and
# production share one cluster and one database server, so their boundary is a
# schema search path (memql#3765). A tenant does not share: it has its own CNPG
# Cluster, its own volumes, its own object store prefix. There is no second
# environment inside a tenant to be bounded away from, so an unset search path
# is exactly what "one environment" means to the engine -- the same thing it
# means on a developer's laptop, and asserted there by TestLocalStaysOneEnvironment.
#
# Setting one anyway would be worse than useless: it would imply a boundary that
# the tenant's single schema does not have, and the first person to read it
# would reasonably conclude some OTHER tenant's data was on the same server.
#
# MEMQL_HOST_LABEL IS EMPTY for the same reason. The label distinguishes two
# environments sharing one domain (`api-staging.<domain>` from
# `api.<domain>`). A tenant has a domain of its own -- that is what the
# customer bought -- so its role hosts are already unambiguous, and a label
# would only produce hostnames nothing serves.
apiVersion: v1
kind: ConfigMap
metadata:
  name: memql-environment
  namespace: __TENANT__
  labels:
    app.kubernetes.io/name: memql-environment
    app.kubernetes.io/part-of: memql
data:
  MEMQL_ENVIRONMENT: production
  MEMQL_DB_SEARCH_PATH: ""
  MEMQL_HOST_LABEL: ""
