# Optional operator profile for explicitly long pipeline workloads. No instance
# overlay composes this by default. Step budgets remain repository declarations.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Deployment, name: agent}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: MEMQL_PIPELINES_RUN_MAX_MINUTES
                    value: "480"
  - target: {kind: Deployment, name: workbench}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: MEMQL_PIPELINES_RUN_MAX_MINUTES
                    value: "480"
