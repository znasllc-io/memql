apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  labels: {app.kubernetes.io/name: livekit}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: livekit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: livekit}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.7
          args: ["--node-ip", "$(POD_IP)"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: MEMQL_DOMAIN
              valueFrom:
                configMapKeyRef: {name: memql-domain, key: MEMQL_DOMAIN}
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef: {name: memql-voice, key: LIVEKIT_KEYS}
            - name: LIVEKIT_CONFIG
              value: |
                port: 7880
                redis:
                  address: voice-redis:6379
                rtc:
                  use_external_ip: false
                  tcp_port: 7881
                  udp_port: 7882
                room:
                  auto_create: false
                  empty_timeout: 30
                  departure_timeout: 10
                  max_participants: 2
                  enabled_codecs:
                    - mime: audio/opus
                logging:
                  level: info
                  json: true
          ports:
            - {name: http, containerPort: 7880}
            - {name: rtc-tcp, containerPort: 7881}
            - {name: rtc-udp, containerPort: 7882, protocol: UDP}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
spec:
  selector: {app.kubernetes.io/name: livekit}
  ports:
    - {name: http, port: 7880, targetPort: http}
    - {name: turn-tls, port: 443, targetPort: 443}
