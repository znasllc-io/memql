# The identity every step pod runs as (epic memql#5478, task #5492): one that
# holds nothing.
#
# A step is code from a repository, run in an image the platform did not build.
# It gets no Kubernetes credential at all: no token is mounted for this account
# (automountServiceAccountToken: false, which the runner also sets on the pod),
# and nothing binds it to any Role. It exists so a step pod does not run as the
# namespace's `default` account, which a later grant aimed at "the namespace"
# could reach without anybody naming the steps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memql-pipelines-step
  namespace: memql-pipelines
  labels:
    app.kubernetes.io/part-of: memql
    app.kubernetes.io/name: pipelines-step
automountServiceAccountToken: false
