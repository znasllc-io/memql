# How much of a cluster pipeline steps may take (epic memql#5478, task #5492).
# Both numbers are the overlay's (pipelines-values.yaml); these are defaults a
# laptop can run.
#
# THE CEILING is a quota on the NUMBER OF JOBS, because one Job is one running
# step. The API server counts it atomically at admission, across every workbench
# replica at once, so two replicas cannot both create the step that exceeds it:
# the loser's create is refused with "exceeded quota", and the runner waits and
# retries rather than failing the step (the run shows it queued, bounded by the
# run's wall-clock ceiling). A finished Job counts until the runner deletes it
# after the agent has the result, or until its TTL does.
#
# JOBS AND NOTHING ELSE. A compute quota (requests.cpu, limits.memory, ...) is
# enforced when the Job's POD is created, after the Job exists, so a step
# refused by it would wait inside its own activeDeadlineSeconds instead of in
# the runner's queue, and time out having never run. What a step may take is
# the LimitRange's job, and how many run at once is this count's.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memql-pipelines-ceiling
  namespace: memql-pipelines
  labels:
    app.kubernetes.io/part-of: memql
    app.kubernetes.io/name: pipelines-ceiling
spec:
  hard:
    count/jobs.batch: "4"
---
# THE LIMITS are a LimitRange default, so the runner sets no resources on a step
# container and this is the one place a step's size is decided. It applies to
# every container in the pod -- the clone init container and each service
# sidecar as well as the step -- and fills only what a container leaves unset.
# A default request above its default limit is refused by the API server, so
# the two move together.
#
# DISK is ephemeral-storage: a container's own files outside any volume and
# its logs, against its own limit, and -- summed over the pod's containers --
# every emptyDir too, the step's workspace among them, against the sum of
# their limits. The kubelet evicts a pod past either, so no step can fill its
# node's disk (it fails pipeline_step_disk_exceeded). The workbench gives the
# workspace the same number as its own size limit
# (MEMQL_PIPELINES_WORKSPACE_LIMIT, config.yaml), which bounds it however many
# services share the sum; the overlays state both together.
apiVersion: v1
kind: LimitRange
metadata:
  name: memql-pipelines-limits
  namespace: memql-pipelines
  labels:
    app.kubernetes.io/part-of: memql
    app.kubernetes.io/name: pipelines-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 20Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
