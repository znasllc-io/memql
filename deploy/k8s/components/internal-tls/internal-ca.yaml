# INTERNAL TLS -- the CA every mesh node trusts, and identity's serving cert.
#
# WHAT THIS FIXES (memql#4484). Every mesh Deployment mounts `memql-ca`;
# identity mounts `identity-tls`; every node dials https://identity:8085 and
# verifies against /etc/memql/cacerts/ca.crt. NOTHING IN base, components OR
# EITHER CLOUD OVERLAY CREATED EITHER SECRET. Locally `make secrets` mints them
# with openssl. On the retired cloud cluster they had been HAND-SEEDED, which
# is memql#4463's "the cluster is its own source of truth" in a second place
# nobody had looked -- and the first bring-up on a genuinely empty subscription
# is what exposed it, because there was no hand-seeded copy to inherit.
#
# HOW IT FAILED, AND WHY THAT IS THE WHOLE ARGUMENT FOR SHIPPING IT. A missing
# Secret named by a volume does not error. The pod sits in ContainerCreating
# FOREVER:
#
#   MountVolume.SetUp failed for volume "memql-ca" : secret "memql-ca" not found
#
# Seven mesh Deployments hung together for seventeen minutes with NO container
# started -- so no log line, no CrashLoopBackOff, and nothing anywhere naming
# TLS. cert-manager itself was exactly this shape and was fixed upstream in
# memql#3845; this is the same treatment for the manifest the engine should
# have been shipping all along.
#
# THE CHAIN, and why it is four objects rather than two:
#
#   memql-internal-selfsigned (Issuer, selfSigned)
#     -> memql-internal-ca (Certificate, isCA)  --> Secret `memql-internal-ca`
#          -> memql-internal-ca (Issuer, ca:)      (NEVER mounted -- holds the CA key)
#               |-> memql-ca-bundle (Certificate) --> Secret `memql-ca`      (mounted x10)
#               '-> identity-tls    (Certificate) --> Secret `identity-tls`
#
# THE CA SECRET AND THE MOUNTED BUNDLE ARE TWO DIFFERENT OBJECTS (memql#4599),
# and that separation is the point: the Issuer reads the first, so it cannot go
# Ready against a CA this component is about to replace, and the bundle and the
# leaf are issued from that one Issuer, so they cannot disagree about who signed
# what. The old shape had both roles on `memql-ca` and could mint a leaf against
# the outgoing CA during adoption -- a failure no restart could fix.
#
# The two Issuers are NAMESPACED, not ClusterIssuers, deliberately: this CA is
# an internal trust root for one instance's mesh and has no business being
# offerable to any other namespace on the cluster. It is also why the AppProject
# needs no widening -- namespaced Issuers and Certificates are already inside
# `namespaceResourceWhitelist`, unlike a ClusterIssuer.
#
# THE PRIVATE KEY PROBLEM, and the mount change that goes with this file. A
# cert-manager Certificate produces a kubernetes.io/tls Secret carrying tls.crt,
# tls.key AND ca.crt. `memql-ca` is mounted by TEN workloads, and a volume with
# no `items:` selector projects EVERY key -- so shipping this chain naively
# would put a private key inside every mesh pod, and SSL_CERT_DIR would scan it.
# Every one of those ten mounts therefore selects `ca.crt` explicitly. Since
# memql#4599 the key in `memql-ca` belongs to a throwaway leaf rather than to
# the CA, so a forgotten selector is no longer a trust-root compromise -- but
# the selector stays required, because it is still a private key.
# The openssl path produces a generic Secret with ca.crt alone, so the same
# selector is correct there and the two paths stay interchangeable.
#
# NOT USED LOCALLY. k3d gets the openssl chain from `make secrets`, which skips
# when the Secrets already exist -- so this component and that script must never
# both run against one cluster. They do not: local composes neither.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: memql-internal-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: memql-internal-ca
spec:
  # THE CA'S OWN SECRET, WHICH NOTHING MOUNTS AND NOTHING PRE-SEEDS (memql#4599).
  #
  # This used to be `memql-ca` -- the same Secret the Issuer below reads and the
  # same one ten Deployments mount. Adopting the component on a live cluster
  # then had a race it could not lose gracefully: a hand-seeded `memql-ca`
  # already existed, so the CA Issuer went Ready against the OUTGOING CA and
  # signed identity-tls with it, one second before this Certificate replaced the
  # Secret's contents:
  #
  #   identity-tls        notBefore 2026-08-25T19:22:00Z   signer 7C:03:91...
  #   memql-internal-ca   notBefore 2026-08-25T19:22:01Z   bundle 6F:2F:94...
  #
  # Every mesh node then rejected identity with `remote error: tls: bad
  # certificate`, while every pod stayed Running and Ready and ArgoCD reported
  # Healthy -- only sign-in was broken, as a 502 on "Continue to sign in". A
  # restart did not help, because the certificate itself was wrong.
  #
  # With the CA in a Secret of its own, the Issuer CANNOT go Ready until this
  # Certificate has been issued, so a leaf can only ever be signed by the CA
  # this component minted. The race is gone by construction rather than by
  # ordering, which is the property the issue asked for: restart ORDERING is a
  # runbook step that gets skipped under pressure.
  secretName: memql-internal-ca
  isCA: true
  commonName: memql-internal-ca
  subject:
    organizations:
      - MemQL
  # Ten years, matching CA_DAYS in deploy/k8s/base/tls/gen-internal-ca.sh. A CA
  # rotation invalidates every leaf under it at once, so it is an operation to
  # schedule rather than one to have arrive.
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: RSA
    size: 4096
    # Rotate the key whenever the certificate is reissued. The alternative,
    # reusing a key across issuances, means a key compromise survives renewal.
    rotationPolicy: Always
  issuerRef:
    name: memql-internal-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: memql-internal-ca
spec:
  ca:
    # The CA's own Secret, not the mounted trust bundle. See memql#4599 above.
    secretName: memql-internal-ca
---
# THE TRUST BUNDLE THE MESH MOUNTS (memql#4599).
#
# `memql-ca` is the name ten Deployments carry, so it stays the contract -- what
# changes is what PRODUCES it. It is now a leaf issued by the CA above, which
# means cert-manager writes the CA into its `ca.crt` and keeps it in step with
# the signer: the bundle and identity-tls are issued from the SAME Issuer, so
# they cannot disagree about who the CA is. That is the defect this closes --
# the failure was permanent precisely because bundle and leaf came from two
# different CAs, and no restart could reconcile them.
#
# A ROTATION STILL NEEDS A MESH RESTART. Pods read ca.crt at startup, so a
# running pod keeps trusting the CA it booted with. What is different is that
# the restart is now SUFFICIENT: both Secrets carry the same new CA, so a roll
# in any order converges. scripts/deploy/verify-internal-tls.sh is the preflight
# that says whether one is needed, and prints the reissue remedy when the two
# have drifted.
#
# THE CA'S PRIVATE KEY IS NO LONGER IN THIS SECRET, and that is a second win.
# The old shape put the CA key in every one of the ten pods that mount this --
# survivable only because every mount selects `items: [ca.crt]`, one forgotten
# selector away from shipping a trust root's key to the mesh. The tls.key here
# now belongs to a throwaway leaf nothing presents.
#
# NOT A SERVING CERTIFICATE. It exists to materialise `ca.crt`; the commonName
# is descriptive and no dnsName is claimed, so it can never be mistaken for one.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: memql-ca-bundle
spec:
  # The Secret name IS the contract -- ten Deployments name it.
  secretName: memql-ca
  commonName: memql-ca-bundle
  usages:
    - client auth
  duration: 19800h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: memql-internal-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: identity-tls
spec:
  secretName: identity-tls
  commonName: identity
  # THE SHORT NAME ONLY, and that is a rule this repo already enforces.
  # Every node dials `https://identity:8085` -- the bare Service name, resolved
  # by the pod's own search path. Adding identity.memql.svc.cluster.local would
  # bake THE NAMESPACE into a committed manifest, which pins the mesh to one
  # namespace and makes a name resolve ACROSS an install boundary rather than
  # failing; TestNothingFullyQualifiesAClusterDNSName refuses it, and it is
  # right to. Nothing in the tree dials identity by a qualified name.
  dnsNames:
    - identity
  usages:
    - server auth
  # 825 days, matching CERT_DAYS in gen-internal-ca.sh.
  duration: 19800h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: memql-internal-ca
    kind: Issuer
