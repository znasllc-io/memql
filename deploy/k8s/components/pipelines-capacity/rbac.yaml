apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: memql-background-capacity
rules:
  - apiGroups: [capacity.memql.io]
    resources: [backgroundcapacitypolicies]
    resourceNames: [memql-background-capacity]
    verbs: [get]
  - apiGroups: [kueue.x-k8s.io]
    resources: [clusterqueues]
    resourceNames: [memql-background]
    verbs: [get, patch]
  - apiGroups: [kueue.x-k8s.io]
    resources: [resourceflavors]
    resourceNames: [memql-background]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: memql-background-capacity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: memql-background-capacity
subjects:
  - kind: ServiceAccount
    name: memql-engine
    namespace: memql
