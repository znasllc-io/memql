# Workbench node -- per-Plan sandboxed Linux execution environment. Receives
# WorkbenchForwardRequest envelopes from agent peers. Dials BFF (parent).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench
  namespace: memql
  labels:
    app.kubernetes.io/name: workbench
    app.kubernetes.io/part-of: memql
    memql/node-type: workbench
spec:
  # HA (#561): safe to run >=2 replicas now that automations are cluster-
  # singleton -- cron leader + the event-execution guard collapse any
  # cross-replica double-fire (watch the guard's duplicatesPrevented metric).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workbench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbench
        app.kubernetes.io/part-of: memql
        memql/node-type: workbench
    spec:
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
        - name: workbench-workspaces
          emptyDir: {}
      # Graceful shutdown (#552): must exceed MEMQL_SHUTDOWN_DRAIN_DELAY (5s
      # default) + the app Stop budget (30s) so drain + GracefulStop finish.
      terminationGracePeriodSeconds: 45

      containers:
        - name: workbench
          image: acrmemql.azurecr.io/memql-workbench:0.9.9
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50060 }
          envFrom:
            - secretRef:
                name: memql-secrets
          env:
            - { name: MEMQL_GENESIS_AUTOLOAD, value: "true" }
            - { name: SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "workbench" }
            - { name: MEMQL_NODE_ADDRESS, value: "workbench:50060" }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50060" }
            - { name: MEMQL_PARENT_ADDRESS, value: "bff:50058" }
            - { name: MEMQL_WORKBENCH_ROOT, value: "/var/lib/memql/workbenches" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: SERVER_ADDRESS, value: "0.0.0.0:8085" }
            - { name: IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            - { name: IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.staging.copresent.ai" }
            - { name: IDENTITY_ENABLED, value: "false" }
            # Internal TLS: trust the cluster CA when calling https://identity:8085.
            # SSL_CERT_DIR covers 0.9.0 images; MEMQL_HTTP_TLS_CA_FILE the explicit path at 0.9.1+.
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
            - { name: MEMORY_NODES_DATABASE_AUTO_MIGRATE, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
            - { name: workbench-workspaces, mountPath: /var/lib/memql/workbenches }
          readinessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: workbench
  namespace: memql
  labels:
    app.kubernetes.io/name: workbench
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workbench
  ports:
    - { name: node, port: 50060, targetPort: 50060 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# Keep >=1 workbench pod serving through voluntary disruptions (node drain,
# upgrade, rollout) now that it runs 2 replicas (#561).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workbench
  namespace: memql
  labels:
    app.kubernetes.io/name: workbench
    app.kubernetes.io/part-of: memql
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workbench
