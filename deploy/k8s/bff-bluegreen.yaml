# =============================================================================
# WIP (#616): Blue/green BFF topology -- DRAFT, NOT WIRED INTO kustomization.yaml
# =============================================================================
#
# This is the design-draft replacement for the single `bff` Deployment in
# bff.yaml. It is intentionally NOT added to kustomization.yaml yet -- it ships
# alongside bff.yaml so the owner can review the shape before we cut over. The
# implementation is finalized only after the open questions in PR #<this> are
# answered.
#
# GOAL (distinct from #615 graceful-drain, which already shipped):
#   - Two BFF colors run simultaneously (bff-blue + bff-green).
#   - NEW user logins land ONLY on the ACTIVE color (the user-facing entry
#     Services -- bff-active ClusterIP behind the nginx /memql Ingress, and
#     bff-external LoadBalancer -- select on memql/color=<active>).
#   - EXISTING bidirectional MemqlService.Stream sessions keep hitting the OLD
#     color until they close (the OLD color's pods are not killed at cutover;
#     they keep serving their already-open streams).
#   - The OLD color is removed only AFTER it has drained to 0 active streams
#     (polled via /healthz activeStreams, the #616 primitive) or a max-drain
#     deadline -- at which point the OLD color's pods take the #615 graceful
#     -drain teardown (preStop + GOAWAY + terminationGracePeriod).
#
# WHY the in-mesh `bff` Service stays color-agnostic:
#   Peer nodes dial `bff:50058` (NodeService) for cross-node forwards. Those
#   forwards must reach WHICHEVER color holds the user's stream, so the in-mesh
#   `bff` Service selects BOTH colors. Only the USER-facing entry (8085 via
#   Ingress + the external LB) is color-pinned, because that is where "new
#   login -> new color" is enforced.
#
# Cutover is driven by scripts/deploy/bff-bluegreen-cutover.sh (WIP).
#
# -----------------------------------------------------------------------------
# OPEN QUESTION (owner): one shared Deployment template parametrized by color
# via kustomize overlays, vs. two near-duplicate Deployments as below. The
# duplication is explicit-but-verbose; an overlay is DRYer but hides the color
# in patch files. Drafted as two explicit Deployments for review clarity.
# -----------------------------------------------------------------------------

# ---- BLUE color Deployment ---------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-blue
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
    memql/node-type: bff
    memql/color: blue
spec:
  # Each color carries the full replica count. During a cutover BOTH colors
  # are briefly up -> 2x BFF capacity is required (depends on #614 surge
  # headroom). OPEN QUESTION: scale the OLD color down to 0 only after drain,
  # or keep it at full replicas until drain completes (capacity vs. safety).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
      memql/color: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/part-of: memql
        memql/node-type: bff
        memql/color: blue
    spec:
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
      # #615 graceful-drain knobs are unchanged -- they govern the eventual
      # teardown of whichever color is being retired.
      terminationGracePeriodSeconds: 60
      containers:
        - name: bff
          image: acrmemql.azurecr.io/memql-bff-copresent:0.9.6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50058 }
          envFrom:
            - secretRef:
                name: memql-secrets
          env:
            - { name: MEMQL_GENESIS_AUTOLOAD, value: "true" }
            - { name: SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "bff" }
            - { name: MEMQL_NODE_ADDRESS, value: "bff:50058" }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50058" }
            - { name: MEMQL_WORKER_PEERS, value: "voice=voice:50059,agent=agent:50055,cognition=cognition:50054,planner=planner:50056,workbench=workbench:50060" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: SERVER_ADDRESS, value: "0.0.0.0:8085" }
            - { name: IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            - { name: IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.staging.copresent.ai" }
            - { name: IDENTITY_ENABLED, value: "false" }
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
            - { name: MEMORY_NODES_DATABASE_AUTO_MIGRATE, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
