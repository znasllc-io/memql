---
# ---- In-mesh Service (COLOR-AGNOSTIC) ---------------------------------------
# Cross-node forwards (peers dialing bff:50058 / grpc 50051) must reach the
# color holding the user's stream, so this Service selects BOTH colors. It does
# NOT carry memql/color in its selector. NodeService routing + AiForward rely on
# this resolving to any healthy bff pod regardless of color.
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
  ports:
    - { name: node, port: 50058, targetPort: 50058 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# ---- User-facing entry Service (COLOR-PINNED) -------------------------------
# This is the cutover anchor. The nginx /memql Ingress points at THIS Service
# (bff-active) instead of the color-agnostic bff Service, so NEW user logins
# land only on the active color. The cutover flips spec.selector.memql/color
# from old -> new (the "Service selector flip"). Existing streams already bound
# to OLD-color pods keep flowing because the TCP/WS connection is already
# established to a specific pod; only NEW connection establishment is steered.
apiVersion: v1
kind: Service
metadata:
  name: bff-active
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
    memql/role: user-entry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
    memql/color: green   # <-- ACTIVE color. Flipped by the cutover script.
  ports:
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# ---- External LoadBalancer (COLOR-PINNED) ----------------------------------
# Same color pin as bff-active. New external connections land on the active
# color only. (If the public path is exclusively the nginx Ingress -> bff-active
# in production, this LB may be redundant -- OPEN QUESTION for the owner.)
apiVersion: v1
kind: Service
metadata:
  name: bff-external
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
    memql/role: external-entry
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: bff
    memql/color: green   # <-- ACTIVE color. Flipped by the cutover script.
  ports:
    - { name: http, port: 8085, targetPort: 8085 }
