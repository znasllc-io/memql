# memql-secrets -- TEMPLATE ONLY. Do NOT commit real values.
#
# This Secret carries the three genesis-A2 inputs every memQL pod needs at
# boot. With MEMQL_GENESIS_AUTOLOAD=true (set on every Deployment), the boot
# hook in component/genesis decrypts MEMQL_GENESIS_B64 in-process under
# MEMQL_MASTER_KEY and applies the ~150 envelope vars set-if-absent. The
# per-pod overrides in each Deployment (MEMQL_NODE_TYPE, the mesh addresses,
# MEMORY_NODES_DATABASE_DSN, ...) are set BEFORE the process starts, so they
# always win over the envelope's local-dev defaults.
#
# NO database pod lives in this cluster: MEMORY_NODES_DATABASE_DSN points at
# the managed Tiger Cloud instance (xahn9ru4v6, Azure East US 2).
#
# -----------------------------------------------------------------------------
# RECOMMENDED: create the Secret imperatively (keeps plaintext out of git).
# -----------------------------------------------------------------------------
#
#   kubectl create secret generic memql-secrets -n memql \
#     --from-literal=MEMQL_MASTER_KEY="$MEMQL_MASTER_KEY" \
#     --from-literal=MEMQL_GENESIS_B64="$(base64 < ~/.memql/genesis.znas)" \
#     --from-literal=MEMORY_NODES_DATABASE_DSN="$(tiger db connection-string xahn9ru4v6 --with-password)"
#
# Re-run with `--dry-run=client -o yaml | kubectl apply -f -` to rotate
# idempotently.
#
# -----------------------------------------------------------------------------
# The three keys
# -----------------------------------------------------------------------------
#   MEMQL_MASTER_KEY          32-byte (64 hex chars) key that decrypts the
#                             genesis envelope.
#   MEMQL_GENESIS_B64         base64 of the SEALED (encrypted) genesis envelope
#                             (~/.memql/genesis.znas). Decrypted in-process at
#                             boot; never written to disk decrypted.
#   MEMORY_NODES_DATABASE_DSN Tiger Cloud connection string (with password).
#
# -----------------------------------------------------------------------------
# This manifest form (placeholders only) is provided for completeness. Prefer
# the imperative `kubectl create secret` above so real values never land in a
# file. If you DO apply this form, fill stringData and keep it out of git.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: memql-secrets
  namespace: memql
type: Opaque
stringData:
  MEMQL_MASTER_KEY: "REPLACE_WITH_64_HEX_CHAR_MASTER_KEY"
  MEMQL_GENESIS_B64: "REPLACE_WITH_BASE64_OF_SEALED_GENESIS_ENVELOPE"
  MEMORY_NODES_DATABASE_DSN: "REPLACE_WITH_TIGER_CLOUD_DSN"

# -----------------------------------------------------------------------------
# ALTERNATIVE: Azure Key Vault via the Secrets Store CSI driver.
# -----------------------------------------------------------------------------
# Instead of the in-cluster Secret above, sync the three Key Vault secrets
# (kv-memql-staging: memql-master-key / memql-genesis-b64 /
# memory-nodes-database-dsn) into a k8s Secret named `memql-secrets` via a
# SecretProviderClass with `secretObjects`. Requires the AKS addon
# `azure-keyvault-secrets-provider` and a pod identity / workload identity
# with `Key Vault Secrets User` on the vault. Each Deployment must then mount
# the CSI volume (a pod referencing the SecretProviderClass) for the synced
# Secret to be created/refreshed. Uncomment and fill tenantId / userAssigned
# identityID / keyvaultName, then add the matching volume + volumeMount to
# each Deployment.
#
