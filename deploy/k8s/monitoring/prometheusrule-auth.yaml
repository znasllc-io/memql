# PrometheusRule: auth-reject rate + JWKS incoherence alerts.
#
# memql#1523. On 2026-06-16 a ~50% auth failure stayed silent (WARN logs
# only) until a user noticed the product was broken. These rules page on
# the same conditions within minutes.
#
# ASSUMES: a prometheus-operator / kube-prometheus-stack whose Prometheus
# CR selects PrometheusRules (the `release` label must match its
# `ruleSelector`, same as the PodMonitor) and Alertmanager is wired for
# routing. The metrics referenced are emitted by component/metrics and
# scraped via monitoring/podmonitor.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memql-auth
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
    release: kube-prometheus-stack
spec:
  groups:
    - name: memql-auth-rejects
      rules:
        # Total auth-reject storm across every surface (grpc / http /
        # node). >1 reject/s sustained for 5m is well above the steady-
        # state noise floor (occasional expired/garbage tokens) and is
        # the symptom of the 2026-06-16 incident.
        - alert: MemqlAuthRejectRateHigh
          expr: |
            sum(rate(memql_auth_rejects_total{namespace="memql"}[5m])) > 1
          for: 5m
          labels:
            severity: critical
            team: memql
          annotations:
            summary: "memQL auth-reject rate elevated ({{ $value | printf \"%.2f\" }}/s)"
            description: >
              memQL is rejecting more than 1 authentication/authorization
              request per second (5m avg) across the cluster. Likely a
              JWKS / signing-key skew or a misconfigured verifier.
              Break down by reason/surface:
              sum by (surface,reason,code)(rate(memql_auth_rejects_total{namespace="memql"}[5m])).
              See memql#1523.

        # Unknown-kid specifically: a verifier holds no key for a token's
        # kid -> the JWKS the signer used and the JWKS the verifier holds
        # disagree. This is the crisp signing-key-skew signal; a much
        # lower threshold is justified because steady state is ~0.
        - alert: MemqlAuthRejectUnknownKid
          expr: |
            sum(rate(memql_auth_rejects_total{namespace="memql",reason="unknown_kid"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
            team: memql
          annotations:
            summary: "memQL rejecting tokens for unknown signing key (kid)"
            description: >
              Verifiers are rejecting JWTs whose kid is absent from their
              JWKS cache. The identity signing key and the per-node
              verifier keysets are out of sync (rotation gone wrong, a
              stale identity replica, or split signing material). Cross-
              check MemqlJWKSIncoherent. See memql#1523.

    - name: memql-jwks-coherence
      rules:
        # Identity replicas must serve an IDENTICAL key set (in seed mode
        # every replica derives the same key from MEMQL_IDENTITY_SIGNING_KEY_B64,
        # so the fingerprint is rock-stable). If the fingerprints diverge
        # across identity replicas, tokens signed by one replica's key are
        # rejected by verifiers that fetched the other replica's JWKS --
        # exactly the silent failure of 2026-06-16.
        - alert: MemqlJWKSIncoherent
          expr: |
            (
              max(memql_jwks_keyset_fingerprint{namespace="memql",app="identity"})
              - min(memql_jwks_keyset_fingerprint{namespace="memql",app="identity"})
            ) != 0
          for: 10m
          labels:
            severity: critical
            team: memql
          annotations:
            summary: "identity replicas serving different JWKS key sets"
            description: >
              memql_jwks_keyset_fingerprint differs across identity
              replicas: they are publishing different signing keys. Token
              verification will fail intermittently depending on which
              replica signed and which JWKS a verifier fetched. Inspect
              per-replica: memql_jwks_keyset_fingerprint{app="identity"}
              and memql_jwks_keyset_keys{app="identity"}. See memql#1523.

        # An identity replica serving an EMPTY keyset cannot validate any
        # token signed against it -- a different, equally fatal failure.
        - alert: MemqlJWKSEmpty
          expr: |
            min(memql_jwks_keyset_keys{namespace="memql",app="identity"}) == 0
          for: 5m
          labels:
            severity: critical
            team: memql
          annotations:
            summary: "an identity replica is serving an empty JWKS"
            description: >
              memql_jwks_keyset_keys is 0 on at least one identity replica
              -- it has no signing keys to publish, so every token it (or a
              verifier fetching from it) checks will be rejected. See
              memql#1523.

    - name: memql-identity-signing-key-age
      # memql#3381. Signing-key rotation is IMPOSSIBLE from inside a
      # deployed cluster: staging and prod supply the seed through the
      # sealed env envelope, so KeyManager.RotationSupported() is false and
      # the in-process 90-day scheduler is inert. Rotation there is a manual
      # re-seal-and-roll runbook. The recorded decision was to keep it that
      # way and close the gap with observability -- these two rules ARE that
      # compensation, so treat them as load-bearing rather than nice-to-have.
      # Runbook: docs/public/operate/auth/identity-service.md#rotating-the-signing-key
      rules:
        # The key has outlived the nominal 90-day cadence and, because
        # nothing in-cluster can rotate it, it will keep ageing until a
        # human runs the runbook. Warning, not critical: an overdue key is
        # a hygiene debt on a planned maintenance action, not an outage --
        # and paging someone at 03:00 for it would only teach them to
        # silence the one alert that makes the manual path visible.
        - alert: MemqlIdentitySigningKeyOverdue
          expr: |
            (
              time() - max(memql_identity_signing_key_created_timestamp_seconds{namespace="memql",app="identity"})
            ) > (90 * 24 * 3600)
            and
            min(memql_identity_signing_key_age_known{namespace="memql",app="identity"}) == 1
          for: 1h
          labels:
            severity: warning
            team: memql
          annotations:
            summary: "identity signing key is past its 90-day rotation cadence"
            description: >
              The active Ed25519 signing key was minted more than 90 days
              ago and no in-cluster mechanism will rotate it -- the seed
              rides the sealed env envelope, so the in-process scheduler is
              inert by design. Rotate by re-sealing a new seed and rolling
              identity. READ THE RUNBOOK FIRST: that path bypasses the JWKS
              overlap window, so it invalidates every unexpired access
              token, mesh node token, service-account JWT and voice-agent
              JWT at once. See
              docs/public/operate/auth/identity-service.md#rotating-the-signing-key
              and memql#3381.

        # Age is UNOBSERVABLE, which is strictly worse than age being high:
        # a bare 32-byte seed carries no creation date, so without
        # MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT the overdue rule above can
        # never fire and the absence of alerts means nothing. This rule
        # exists so that silence is earned rather than assumed.
        - alert: MemqlIdentitySigningKeyAgeUnknown
          expr: |
            min(memql_identity_signing_key_age_known{namespace="memql",app="identity"}) == 0
          for: 1h
          labels:
            severity: warning
            team: memql
          annotations:
            summary: "identity cannot tell how old its signing key is"
            description: >
              At least one identity replica reports
              memql_identity_signing_key_age_known=0: it was handed a seed
              with no MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT stamp, so the
              only date it has is its own process start. Key age is
              therefore unmeasured and MemqlIdentitySigningKeyOverdue cannot
              fire. Fix by sealing MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT
              (RFC3339, the date the seed was minted) next to the seed on
              every identity replica. See memql#3381.
