# memQL monitoring: metrics scrape config + alert rules (memql#1523).
#
# Apply with:  kubectl apply -k deploy/k8s/monitoring
#
# Deliberately NOT wired into deploy/k8s/base or the staging/prod overlays:
# these resources require the prometheus-operator CRDs (PodMonitor /
# PrometheusRule / ServiceMonitor), which live in the monitoring stack,
# not in the memQL app deploy. Keeping them separate means a `kubectl
# apply -k deploy/k8s/overlays/cloud` of the app never fails on a
# cluster that has no operator installed. See README.md.
#
# Each manifest declares its own metadata.namespace, so no namespace
# transformer is set here.
#
# servicemonitor-argo-rollouts.yaml is intentionally excluded -- it is
# OPTIONAL (apply only if your Prometheus does not already scrape the
# Argo Rollouts controller) and targets the argo-rollouts namespace. Apply
# it on its own:  kubectl apply -f monitoring/servicemonitor-argo-rollouts.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - podmonitor.yaml
  - prometheusrule-auth.yaml
  - prometheusrule-rollouts.yaml
  # The self-hosted database (epic memql#3842 / #3847). A separate PodMonitor
  # because CNPG's instance manager serves its own metrics on :9187 -- a
  # different surface from the app metrics on the node pods' :8085, with
  # different selectors and a different metric namespace.
  - podmonitor-database.yaml
  - prometheusrule-database.yaml
