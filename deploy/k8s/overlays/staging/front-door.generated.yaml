# GENERATED by cmd/frontdoorhosts -- DO NOT EDIT.
# Run `make frontdoor` (hosts, then paths). Hand edits are reverted by the generator
# and TestFrontDoorHostsAreNotStale fails the build until they are.
#
# The front door for the `staging` overlay (staging), as the product of
# ROLE x ENVIRONMENT (epic memql#3748 / memql#3767). The host COUNT is allowed to grow
# with environments -- a closed set the operator chooses -- and never with customers,
# apps or sites, which is what the sites wildcard is for (memql#3700).
#
#   api          api-staging.memql.localhost
#   identity     identity-staging.memql.localhost
#   mcp          mcp-staging.memql.localhost
#   sites        *.staging.memql.localhost
#
# This environment's label is "staging". Its ROLE hosts hyphenate (api-staging.<domain>) so the
# cluster's existing *.<domain> wildcard certificate still covers them -- a TLS
# wildcard matches exactly ONE label, and api.staging.<domain> would need a certificate
# of its own. Its SITES cannot do that, because a site's own name already occupies
# that label, so they nest and this environment requests ONE additional wildcard,
# *.staging.<domain> -- one certificate for all of its sites, not one per site.
#
# A site here lives under the CLUSTER's domain: the host for shop.acme.com is
# shop.staging.<clusterdomain>, never shop.staging.acme.com. This environment is the
# operator's own surface and must not require DNS the operator may not control.
#
# THE DOMAIN IS A COMMITTED DEFAULT, NOT A CONSTANT (memql#3593). No file under deploy/
# names a real domain: the domain is a value on the memql-domain ConfigMap, which every
# node derives its issuer, CORS origins and redirect URIs from at boot
# (component/genesis/domain.go, threaded through component/frontdoor so the hosts below
# and the hosts the nodes believe in cannot disagree). An Ingress host is a Kubernetes
# API object, so it has to be in the render; an install overrides these through the
# ArgoCD Application's spec.source.kustomize.patches. `.localhost` is unroutable, so an
# environment reconciled before its domain is set fails visibly rather than half-working.
#
# NO ROUTER-PRIORITY ANNOTATIONS, unlike the local overlay's traefik front door. nginx
# resolves server_name by specificity in its own core -- an exact name beats a leading
# wildcard -- so the role hosts outrank *.<domain> without anything being declared. That
# is a guarantee traefik does not give, which is why the local overlay declares the
# ranking by hand and why doing it there went wrong once (memql#3810). Do not copy that
# annotation here: it would be an unnecessary declaration of something nginx already
# does, and Ingress-level priority is what flattened the api host's path ordering.
---
# The front-door certificate for this namespace.
#
# ONE PER NAMESPACE, and the SAN sets overlap deliberately. A Kubernetes Secret cannot
# be referenced across namespaces, so a certificate shared between the environments is
# not expressible -- two orders for the same wildcard is the price of the namespace
# isolation the whole epic rests on, and it is paid once per renewal, not per site.
#
# *.<domain> is present in EVERY environment, and that is what the hyphenated role hosts
# buy: a labelled environment adds exactly one SAN for its sites and needs none for its
# api / identity / mcp hosts. The apex is a separate SAN because no wildcard covers it --
# *.<domain> matches one label and the bare domain has none.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: memql-front-door-tls
  namespace: memql
spec:
  secretName: memql-front-door-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.memql.localhost"
    - "*.staging.memql.localhost"
---
# The API edge's HTTP half.
#
# TWO INGRESS OBJECTS FOR ONE HOST, AND THIS IS THE CONSTRAINT THAT FORCES IT: an
# ingress controller's backend protocol is not a per-path setting. On nginx
# `backend-protocol` is an annotation on the INGRESS, so an object cannot route some of
# its paths to an h2c backend and the rest to an HTTP one; the bff's gRPC edge
# (bff:50051) and its HTTP edge (bff-http:8085) are already two Services over one
# Deployment for the same reason. So the HTTP paths live here and the gRPC catch-all
# lives in the object below. nginx merges rules for one host into one server block and
# orders locations by prefix length, so every path below outranks the `/` catch-all.
#
# MERGING THEM WOULD NOT 404 -- it would hand an HTTP/1.1 request to an h2c backend,
# which fails with a protocol error naming nothing. That is memql#3703, and it is the
# same failure the generated block below exists to prevent from the other direction.
#
# THE PATH LIST IS GENERATED BY A DIFFERENT TOOL. cmd/frontdoorpaths emits it from
# component/server's own path declarations; this tool preserves the block across a
# regeneration and `make frontdoor-paths` fills it. Hand-editing it is reverted by the
# generator, and some paths the bff serves are DELIBERATELY withheld from it --
# /metrics and /api/concepts* are unauthenticated because they are in-cluster only, so
# adding a rule for one is not a fix, it is an exposure.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-front-door
  namespace: memql
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api-staging.memql.localhost"
      secretName: memql-front-door-tls
