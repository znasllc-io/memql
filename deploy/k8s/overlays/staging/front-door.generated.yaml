# The API edge's gRPC half: the h2c catch-all, on the same host.
#
# Everything the bff serves over gRPC arrives here -- MemqlService.Stream is the primary
# surface, so this is the rule the Cockpit, the SDKs, the VS Code extension and the
# browser bridge all land on. It is `/` and it is a whole Ingress of its own because
# backend-protocol is Ingress-scoped; see the object above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-front-door-grpc
  namespace: memql
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api-staging.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    - host: api-staging.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 50051
---
# The identity service: /login, the WebAuthn ceremonies, the OAuth endpoints,
# /.well-known/jwks.json, /me/*, /enroll and /device.
#
# HTTPS ON THE INTERNAL HOP, VERIFICATION OFF. identity serves TLS in-cluster under the
# internal CA, which the ingress controller's trust store does not carry -- so the proxy
# speaks https to it and skips verification. The hop stays inside the cluster network.
# The local overlay expresses the same thing with a traefik ServersTransport.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-front-door
  namespace: memql
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "identity-staging.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    - host: identity-staging.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8085
---
# The MCP Streamable HTTP protocol head.
#
# Its own host rather than a path under the api host, for the constraint that shapes
# this whole file: the mcp node is a different Service on a different port (8090)
# speaking plain HTTP, and backend protocol is not a per-path setting. Not proxied
# through the edge either -- MCP clients configure a URL, they are not browsers, and an
# extra hop on a tool-calling path buys nothing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-front-door
  namespace: memql
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "mcp-staging.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    - host: mcp-staging.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8090
---
# The site edge -- the last front-door rules that will ever be added.
#
# Everything after this is a graph row. That is the whole of memql#3700's "a site is
# data, not infrastructure": the host count grows with ENVIRONMENTS, which are a closed
# set, and never with sites, which are not.
#
# The edge serves plain HTTP on :8085, so no backend-protocol annotation is needed here
# -- unlike the api host, which carries h2c for gRPC, and unlike identity, which is https
# behind a verification skip.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-front-door
  namespace: memql
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.staging.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    # Every hosted site in this environment: the portal, and every SPA or website the
    # operator creates a v1:platform:site row for. ONE rule, forever -- the edge node
    # resolves the request Host against the graph, so a new site is an upload plus a row
    # write and the number of Kubernetes objects does not grow with it.
    - host: "*.staging.memql.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8085
