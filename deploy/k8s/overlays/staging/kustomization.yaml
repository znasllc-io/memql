# Staging overlay -> 0.11.2: uniform FULL-STACK cut. All 9 images pinned
# at 0.11.2 (engineVersion 0.11.2). This release rolls up two boot fixes
# found while rolling 0.11.0 onto staging, where the live memql-secrets +
# genesis envelope still carry the pre-Epic-7.3 LEGACY env names:
#   - carrier main.go was missing genesis.ApplyLegacyEnvAliases, so every
#     carrier node fail-fast'd on MEMQL_DATABASE_DSN
#     (visionarys-io/memql-bff-copresent#144).
#   - the subcommand env loader was missing the same shim, so the
#     voice-agent subcommand fail-fast'd on MEMQL_OPENAI_API_KEY (#2177;
#     also repairs the #691 deploy-gate service_account mint path).
# Engine images (identity/mcp/voice) carry the subcommand fix at 0.11.2;
# the carriers carry the main.go fix (same digests as the 0.11.1 rebuild,
# re-tagged 0.11.2); the SPA is unchanged. See releases/0.11.2.yaml.
#
# Staging overlay history -> 0.11.0: FULL-STACK cut bringing staging current with
# main (the 115 commits since the 0.10.0 cut -- authoring promote/demote
# durability, the deploy-as-a-pack automation path + #2115 parity, the
# cockpit Editor/Sense + Clusters work, the env-config registry / Epic 7
# MEMQL_<COMPONENT>_ rename, telephony, MCP OAuth, and the voice hardening
# wave). All 9 engine+carrier+SPA images rebuilt on the GitHub BUILD SERVER
# (OIDC->ACR) at engineVersion 0.11.0 (build-engine-images + build-carrier-
# images dispatched at version=0.11.0; the CoPresent SPA is unchanged so its
# 0.10.0 digest is carried forward). Digests hand-applied in-place from
# releases/0.11.0.yaml (not promote.sh, which clobbers the livekit/sip/redis
# pins + the NODE_IP patch). NO DB reset: every schema change since 0.10.0 is
# ADDITIVE (deploymentNodeSpec, healedOverride, rbac concepts, env-var aliases
# shimmed at boot), so existing rows still satisfy the new queries.
# Tracking: #2026 (release), #2115 (the identity automation-driven cutover
# flag below stays on).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"
  # NOTE: the automation-driven deploy cutover (#2115) is now the ONLY path --
  # #2115 step 6 retired the synchronous Go apply and dropped the
  # MEMQL_DEPLOY_AUTOMATION_DRIVEN flag, so the deploy pack is always anchored
  # on the identity binary and Deploy/RollbackDeployment always kick off the
  # lifecycle automations. No env patch is needed here anymore.

images:
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:9a408bde0804474316b6e13323e987483368919c27f72cc0e9cf4710b3a420e0
