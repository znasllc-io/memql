  - name: acrmemql.azurecr.io/memql-cognition
    digest: sha256:48fdb5207327ba0124d9045d279f413552ad227aeee7189892d425687c2b1ee7
  - name: acrmemql.azurecr.io/memql-voice
    digest: sha256:00def056c944962cf92cac4faf8834827890fd3184b29ec17bfd9793eb2fdf77
  - name: acrmemql.azurecr.io/memql-agent
