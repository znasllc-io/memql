# Staging overlay -> 0.9.29 (releases/0.9.29.yaml). 0.9.29 = the 0.9.28
# engine/DSL bundle (carries #1099 timescaledb advisory lock + #1102
# produceArtifact false-refusal guard, both baked into the 0.9.28 engine/bff
# images) with the copresent SPA rebuilt from current main (bd507b5) to carry
# #1066 WS-reauth instrumentation + #909 Tasks queue + dep-security bumps +
# attachment/UI fixes. engineVersion 0.9.28 (engine source unchanged; only the
# copresent image changed). cognition/agent/planner/workbench/bff are
# CARRIER-built (memql-bff-copresent/Dockerfile + BUILD_TAGS=<type>); voice +
# identity stay engine builds. livekit pin (#1043) preserved across the bump.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
