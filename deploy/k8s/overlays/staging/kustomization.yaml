# Staging overlay -> 0.9.60. Engine/carrier rebuild from main carrying the
# realtime-voice produceArtifact fix (#1503/#1504): ExecuteTool now applies the
# @autoInjected tool-defaults, and the voice CallTool proxy hop resolves
# ownerUserId from the bound space owner -- so "Sofia, create a file" by voice
# mints a plan instead of failing with "requires ownerUserId". copresent SPA
# digest unchanged from 0.9.59 (frontend source didn't change).
# livekit pin (#1043) + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

