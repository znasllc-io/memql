# Staging overlay -> 0.9.20 (carrier-node architecture fix, #1053). cognition/agent/
# planner/workbench are now CARRIER-built (memql-bff-copresent/Dockerfile +
# BUILD_TAGS=<type>) so they carry the CoPresent DSL (agentReply etc.); voice +
# identity stay engine builds. memql@3e661ee + carrier@bba722f. See releases/0.9.20.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:06cea2b58d662fee2c6b49bddbbd5c3cabda4de2234853cd6cb9233e6079d254
  - name: acrmemql.azurecr.io/memql-bff-copresent
    digest: sha256:725e700fa7a83218c235c557fc77639ed1fff42f791e8026f7e301ffa23d3e9c
  # Carrier-built (engine + CoPresent DSL) -- #1053.
  - name: acrmemql.azurecr.io/memql-cognition
    digest: sha256:404ac08630fae00932ba6eb31e52695a3516d95bc5d638bbed094c9a16ee9977
  - name: acrmemql.azurecr.io/memql-voice
