# Staging overlay -> 0.9.46. Full coherent 8-image rebuild from main 66959bc:
# epic #1424 realtime-voice hardening (#1432 timing, #1433 transcript capture,
# #1435 avatar audio + simli manifest flip, #1436 noise reduction + confidence
# gate, #1437 hot-path async, #1438 async tools) + copresent f7209bf (UI sync +
# chimes #431, avatar tile #433). SPA REBUILT (copresent changed).
# cognition/agent/planner/workbench/bff CARRIER-built; voice + identity engine.
# livekit pin (#1043) preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

