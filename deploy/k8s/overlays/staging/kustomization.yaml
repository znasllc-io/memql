# Staging overlay -> 0.9.84: forge routing REAL fix (#1847 follow-up).
# 0.9.83 shipped #1850's system-actor guard fix, but live staging validation
# proved forge routing was STILL broken: a submitted v1:forge:request stayed
# 'submitted' with empty history. Root cause (PR #1856, closes #1847): three
# arg/condition resolution gaps in the automation-step Evaluator dropped a
# multi-step logic body's side-effecting steps when invoked as an automation
# step (routeRequest -> logicRouteRequest):
#   1. EvaluateFilterValue force-prefixed bare condition paths with 'event.',
#      so 'args.event.payload.submitterRole == "owner"' never resolved -> the
#      guarded mutationAdvanceRequest step was skipped (status stuck submitted);
#   2. bare single-identifier step refs in conditions compared literal text
#      (broke logicRecordTransition);
#   3. bare step vars as mutation args wrote their own name -> unqueryable rows.
# Fix makes every declared logic step run with real values on the automation
# path (identical to the tool path), covering routeRequest + recordTransition;
# locked in by a DB-backed node.created->automation->multi-step-logic
# conformance test. #1850's guard is now REACHED and correct (it lets the
# system-actor mutationAdvanceRequest through).
# All 9 images built on the GitHub BUILD SERVER (OIDC->ACR) against engine main
# 2917863; engineVersion 0.9.83 -> 0.9.84. SPA unchanged (engine-only, same
# digest). Digests hand-applied from releases/0.9.84.yaml. livekit pin (#1043)
# + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

