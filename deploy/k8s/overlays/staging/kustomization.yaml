# Staging overlay -> 0.9.61. Engine/carrier/mcp images rebuilt from main on the
# GitHub BUILD SERVER (OIDC->ACR; the first release through that path) carrying
# the MCP remote transport + node (#1550), OAuth 2.1 for custom connectors
# (#1556: PKCE/discovery/authorize/DCR), the three MCP follow-ups (#1557/#1558/
# #1559), and the webhook SSRF default-deny (#1561). NEW: the memql-mcp node now
# ships a real digest (placeholder retired). copresent SPA digest unchanged from
# 0.9.60 (frontend source didn't change). livekit pin (#1043) + NODE_IP patch
# preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

