# Staging overlay -> 0.9.34. All 7 node images + the copresent SPA REBUILT from
# current main (memql b2493b6 / memql-bff-copresent 586994a / copresent 80d9362).
# THE END STATE for the duplicate/dropped-reply saga:
#   - cognition now carries BOTH #1217 (exactly-once dispatch gate -> no dup) AND
#     #1232 (bounded per-peer outbox -> events to a churning/not-yet-attached
#     peer are buffered + flushed on connect instead of silently dropped -> no
#     missing replies). Retires the interim #1233 cognition revert.
#   - #1232 (mesh delivery) is in EVERY node image (component/node).
#   - copresent: document versioning + canvas artifact viewers (#405-#416),
#     copresent-sdk 0.1.8, on top of the prior batch.
# cognition/agent/planner/workbench/bff CARRIER-built; voice + identity engine.
# livekit pin (#1043) preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:0dfc873cb6f151d9392759781573d4c8d0cae1b1c20b3d1bf897d69768a835e1
  # Carrier-built; 0.9.34 — #1232 reliable mesh delivery.
