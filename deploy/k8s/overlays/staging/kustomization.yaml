# STAGING overlay -- ENGINE-ONLY (decoupling P3).
#
# ONE CLUSTER, ONE ArgoCD, ONE BASE, TWO ENVIRONMENTS (epic memql#3748 / #3766).
# This overlay and deploy/k8s/overlays/prod are the same file with different
# numbers in it. Diff them: the differences are the namespace, the environment
# ConfigMap's two values, and the image digests -- the replica counts match
# today, and are stated separately so either may move without the other. Staging is
# not a second installation any more -- it is a second namespace in the one
# cluster, reconciled from the same base by the same ArgoCD, its data separated
# from production's by the schema search path in environment.yaml and by
# nothing else.
#
# WHY THAT SEPARATION HAD TO BE THE CONNECTION. memQL has no tenancy dimension
# in the actor envelope (a recorded finding, memql#3321; the partition dimension
# that once did the job was retired in #56), so an environment boundary cannot
# be a filter -- there is nothing in `actor.*` to filter on. Nor can it be
# "shared data, separate artifacts": exercising a staging SPA performs
# MUTATIONS, automations fire and agents write, and those land wherever the
# connection points. The connection is the one place no code path can forget.
#
# COST SHAPE, and why it is not fewer replicas. Staging matches prod's replica
# counts and is expected to spend most of its life scaled to ZERO
# (`make scale N=0 ENV=staging`). The saving is the idle time, not the width:
# the design says as much -- "scales to zero when idle, which is what makes the
# second environment cost storage rather than compute" (§3.5) -- so running one
# replica while UP would trade the coverage for almost none of the money.
#
# The coverage is the point. CLAUDE.md's multi-node section is emphatic that a
# green single-node result is a FALSE signal for anything crossing a node
# boundary, and names three defects that shipped behind one (memql#1448 read
# session state off the wrong node, #1412 had no routing rule, #1388 reaped
# peers after a cutover). A staging that cannot fan out cannot catch that class,
# and it is the last environment before production that could.
#
# ArgoCD ignores /spec/replicas on this Application, so scaling to zero and back
# is a runtime act selfHeal will not fight and no manual repair follows.
#
# A product runs on this engine surface via a downstream product overlay that
# adds the deploy/k8s/components/dsl-bundle component (a data-only DSL bundle
# image, mounted at MEMQL_DSL_PATH by an init-container) and pins the {bundle
# digest, client digest} alongside these engine image digests. bff is a plain
# product-agnostic engine node fronting that bundle -- there is no bff carrier.
#
# Digests are cut on the GitHub build server (OIDC->ACR) and pinned here.
# Release lockfiles are retired entirely: a release is captured by the digest
# pins in the overlay, not by an on-disk lockfile.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is a VALUE -- see the prod twin for why kustomize's namespace
# transformer is what lets one base serve two environments with no
# per-environment manifest and no cross-talk between the two meshes.
namespace: memql-staging

resources:
  - ../../base
  # The three values that make this namespace an environment.
  - environment.yaml
  # The front door, GENERATED from the role x environment product by
  # cmd/frontdoorhosts (memql#3767) -- run `make frontdoor`, never edit it.
  # Diff it against the prod twin: same objects, same order, different hosts.
  - front-door.generated.yaml

patches:
  # Replica counts, stated rather than inherited -- the same nodes in the same
  # order as the prod twin, and currently the same integers. Restating them is
  # the point even when they match: the two overlays must differ only in VALUES,
  # so a count inherited here and overridden there would be a structural
  # difference wearing a number's clothes.
  #
  # They match PROD deliberately -- see the COST SHAPE note above. The saving is
  # the idle time, not the width.
  #
  # Scale to zero when idle with `make scale N=0 ENV=staging`; these are the
  # counts a reconcile returns to when you scale it back.
  - target: { kind: Deployment, name: identity }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: bff }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: cognition }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: planner }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: workbench }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: mcp }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: voice }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Deployment, name: edge }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  # voice-agent is a room DISPATCHER rather than a request-serving mesh node --
  # see the prod twin.
  - target: { kind: Deployment, name: voice-agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  # The self-hosted LiveKit server advertises this address to WebRTC clients:
  # the staging livekit-rtc LoadBalancer's external IP.
  #
  # NOTE: the automation-driven deploy cutover (#2115) is now the ONLY path --
  # #2115 step 6 retired the synchronous Go apply and dropped the
  # MEMQL_DEPLOY_AUTOMATION_DRIVEN flag, so the deploy pack is always anchored
  # on the identity binary and Deploy/RollbackDeployment always kick off the
  # lifecycle automations. No env patch is needed here anymore.
  - target: { kind: Deployment, name: livekit }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"


  # -------------------------------------------------------------------------
  # DATABASE -- staging VALUES over the cnpg-db component (memql#3847)
  # -------------------------------------------------------------------------
  # Everything here is an endpoint or a class name. The SHAPE -- four
  # resources, the preloaded library, the plugin archiver, the declared
  # extensions -- comes from the component; the SIZES come from the preset.
  - target: { kind: Cluster, name: memql-db }
    patch: |
      # Premium SSD v2, and it is LRS/zonal-only -- which is CORRECT here rather
      # than a compromise. Zone redundancy comes from Postgres replication
      # across zones (the preset's anti-affinity), so ZRS disks underneath would
      # buy the same property a second time and pay for it twice.
      #
      # The class is operator-provisioned: AKS ships no PSSDv2 StorageClass by
      # default. See docs/public/operate/database-platform.md.
      - { op: add, path: /spec/storage/storageClass, value: managed-csi-premium-v2 }
      - { op: add, path: /spec/walStorage/storageClass, value: managed-csi-premium-v2 }
      # A DEDICATED NODE POOL. The database is the one workload in the mesh
      # whose neighbours can hurt it: Postgres is memory- and IO-sensitive, and
      # a noisy agent pod sharing a node costs latency on every query rather
      # than on its own workload. The taint is what makes the pool dedicated --
      # a nodeSelector alone only says "put it there", not "keep others out".
      #
      # ONE POOL SERVES BOTH ENVIRONMENTS, which is the same choice the cluster
      # already makes everywhere else (epic memql#3748: one cluster, two
      # namespaces). Sized for production; staging's smaller database lands on
      # it too and spends most of its life scaled to zero anyway.
      - op: add
        path: /spec/affinity/nodeSelector
        value:
          memql.io/node-pool: database
      - op: add
        path: /spec/affinity/tolerations
        value:
          - key: memql.io/dedicated
            operator: Equal
            value: database
            effect: NoSchedule
      # Workload identity for the backup credentials: the instance pods
      # authenticate to Blob as a federated managed identity, so no storage key
      # exists in the cluster to leak or rotate.
      - op: add
        path: /spec/serviceAccountTemplate
        value:
          metadata:
            labels:
              azure.workload.identity/use: "true"
            annotations:
              # The user-assigned managed identity federated to this cluster's
              # database ServiceAccount. Granted Storage Blob Data Contributor
              # on the backup account and NOT granted delete/purge -- see the
              # ObjectStore note below.
              azure.workload.identity/client-id: "REPLACE-WITH-STAGING-DB-IDENTITY-CLIENT-ID"

  - target: { kind: ObjectStore, name: memql-db-backup }
    patch: |
      - op: replace
        path: /spec/configuration/destinationPath
        value: "azure://memql-staging-db-backups/"
      # inheritFromAzureAD replaces the connection string entirely: the sidecar
      # uses the pod's federated identity. This is what "no storage keys
      # in-cluster" means concretely.
      #
      # THE ACCOUNT ITSELF CARRIES THE OTHER HALF OF THE GUARANTEE, and no
      # manifest can express it: its own resource group, ZRS + Cool tier,
      # blob versioning and soft delete ON, and the cluster identity granted
      # WRITE BUT NOT PURGE. A backup an attacker who owns the cluster can
      # delete is not a backup -- and the identity that writes them is exactly
      # the credential such an attacker holds.
      - op: replace
        path: /spec/configuration/azureCredentials
        value:
          inheritFromAzureAD: true
      - { op: replace, path: /spec/retentionPolicy, value: "30d" }

images:
  # THE DATABASE OPERAND IMAGE (epic memql#3842 / #3847).
  #
  # Pinned by TAG here and NOT yet by digest, deliberately and visibly: this
  # image has never been cut on the build server, so no digest exists to pin.
  # Run .github/workflows/build-db-image.yml, then replace this with the
  # `@sha256:` the run summary prints -- `scripts/deploy/pin-overlay-digests.sh`
  # does it mechanically.
  #
  # Until then `scripts/deploy/drift-check.sh --rendered` FAILS this overlay,
  # which is the correct answer to "is this deployable?" -- and it can only give
  # that answer because memql#3847 taught it to read `imageName:` as well as
  # `image:`. Before that the database image was the one image outside the gate.
  #
  # The tag must begin with the PostgreSQL major: CNPG parses it.
  - name: memql-db
    newName: acrmemql.azurecr.io/memql-db
    newTag: 16.15-timescaledb-2.29.1
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:9a408bde0804474316b6e13323e987483368919c27f72cc0e9cf4710b3a420e0
  - name: acrmemql.azurecr.io/memql-cognition
    digest: sha256:d6a49703dc71b429a8539373288a8b6352c329ffaa0d64c4383ee839447f91eb
  - name: acrmemql.azurecr.io/memql-voice
    digest: sha256:a769c6968b78088acf472a7bdc9acfcb4cb922be6782db6942730165422a07da
  - name: acrmemql.azurecr.io/memql-agent
    digest: sha256:df6f3ea62dc387dfacec10d72447f1394fbe47abec422b5413d0cf46af2779a2
  - name: acrmemql.azurecr.io/memql-planner
    digest: sha256:c23cfd154c1a7940c38c9b3c774b9e48bd8cabdcf67ea6368d8adff7bab952a2
  - name: acrmemql.azurecr.io/memql-workbench
    digest: sha256:2ca234234d0b0fcaf3413b2288e2c184ea4bd1c7ff401bef7b7f1dd54394a282
  # memql-mcp (epic memql#1550): remote MCP node, engine-built on the GitHub
  # build server (#1581 wired it into build-engine-images + the release tooling).
  - name: acrmemql.azurecr.io/memql-mcp
    digest: sha256:8cd301fe1b84a8eb977d9b1a07bb566c2fad5e81c97afaf7bb37a2ca9aad1cd4
  # Self-hosted LiveKit server (memql#1043) -- upstream OSS image, digest-pinned.
  - name: livekit/livekit-server
    newName: livekit/livekit-server
    digest: sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
  # Telephony (memql#1910): livekit/sip PSTN edge + its Redis, upstream OSS,
  # digest-pinned. livekit/sip:v1.5.0, redis:7.4-alpine.
  - name: livekit/sip
    newName: livekit/sip
    digest: sha256:f8621da1f203ba46e567f08311771ee5f77b0f93aad3eb7f24aaf93067f253cc
  - name: redis
    newName: redis
    digest: sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99

components:
  - ../../components/engine-bff
  # THE DATABASE (epic memql#3842 / #3847). The same component local composes,
  # with the `mid` preset's numbers: 2 instances, 2 vCPU / 8 GiB, 128 + 32 GiB,
  # HA on. Diff this block against the prod twin -- it names a different preset
  # and nothing else, which is the whole claim.
  - ../../components/cnpg-db
  - ../../components/cnpg-db/presets/mid
