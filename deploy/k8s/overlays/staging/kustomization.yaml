# Staging overlay -> 0.9.67: FULL-STACK release of MCP connector hardening wave 2
# (epic #1609). ALL nine images re-pinned to 0.9.67, built on the GitHub BUILD
# SERVER (OIDC->ACR): engine (identity/voice/mcp) from main; carrier
# (bff/cognition/agent/planner/workbench) + SPA (copresent) rebuilt against
# engine main -> engineVersion + builtAgainstEngine bumped 0.9.63 -> 0.9.67.
# This supersedes the mcp-only 0.9.67 pin and brings the carrier nodes onto the
# same engine, so the fixes that run OFF the mcp node take effect in production:
#   - #1614: coalesce honors an empty-string fallback across all four evaluators
#     -> #1605 generatedOutput artifact indexing now yields "" (not nil) on the
#     carrier nodes (bff/agent) where that automation runs; WARN noise cleared.
#   - #1608: seed dedup resolves the canonical concept id (no v1::agent) on
#     every node's startup sweep.
#   - #1596/#1597: @mcp curated connector tool surface (~456 -> ~21).
#   - #1599: shared-session MCP automation runner.
#   - #1606: object/array tool-arg schema; #1607: identity refresh_token grant;
#     #1598: resources/prompts smoke assertion.
# livekit pin (#1043) + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

