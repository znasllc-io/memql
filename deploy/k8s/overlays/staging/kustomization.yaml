# Staging overlay -> 0.9.67: MCP connector hardening wave 2, final (epic #1609).
# mcp re-pinned to 0.9.67 (engine-built on the GitHub BUILD SERVER, OIDC->ACR);
# identity stays at its 0.9.66 digest (#1607 refresh_token grant, unchanged).
# The 0.9.67 mcp image carries the rest of the wave-2 hardening:
#   - #1596/#1597: @mcp curated connector tool surface -- tools/list reflects
#     only the ~21 @mcp-tagged tools instead of the full ~456 registry;
#     infra/admin/cluster/identity/sweep families excluded by omission.
#   - #1599: the MCP automation runner is shared across sessions + the
#     @mcp-promoted set memoized (no per-session full automation reload).
#   - #1614: coalesce honors an empty-string fallback across all four
#     evaluators -- makes #1605 generatedOutput artifact indexing actually
#     yield "" (not nil), and clears the coalesce/seed WARN noise.
#   - #1608: seed dedup resolves the canonical concept id (no malformed
#     v1::agent lookup).
#   - #1598: real-engine resources/prompts smoke assertion (no functional
#     change; bridge already wired).
# Prior 0.9.66 carried #1607 (identity) + #1606 + #1605 (mcp). All other
# images stay at their 0.9.63 digests, so engineVersion + builtAgainstEngine
# remain 0.9.63 (carrier coherence). copresent SPA digest unchanged. livekit
# pin (#1043) + NODE_IP patch preserved.
#
# NOTE: #1605's artifact-index automation runs on the CARRIER nodes (bff/agent),
# not mcp -- its #1614-backed fix reaches those nodes only on the next carrier
# rebuild; the un-deployed carrier delta is log-noise only (graceful fallbacks).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

