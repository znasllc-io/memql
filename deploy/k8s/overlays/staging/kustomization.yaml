# Staging overlay -> 0.10.0: FULL-STACK cut for Epic 6 (#2031) -- the DSL
# grammar redesign (mutate verb, structural refs, dependency-tree validator,
# trait/spec split, concept-SSoT, ~599-construct de-prefix), the CoPresent
# decouple (spaceId->partitionId wire rename across 4 repos + SDK chain;
# space + knowledge concepts moved to the pack), and the SI->AI cleanup.
# All 9 engine+carrier+SPA images rebuilt on the GitHub BUILD SERVER
# (OIDC->ACR) at engineVersion 0.10.0. Digests hand-applied in-place from
# releases/0.10.0.yaml (not promote.sh, which clobbers the livekit/sip/redis
# pins + NODE_IP patch). REQUIRES a staging DB reset: the partitionId wire
# rename changes stored payload keys, so existing rows won't match the new
# queries. Tracking: #2031, #2026 (release + DB reset).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
