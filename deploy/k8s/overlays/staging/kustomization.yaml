# Staging overlay -> 0.9.80: client-tool relay (UI takeover) diagnostics cut.
# Carries the relay observability needed to pinpoint why chat/voice
# `uiRequestControl` reaches the model but never the browser (epic #1833):
#   - mesh-side delivery trace + zero-peer-drop WARN on the cognition/bff
#     EventBridge for the client:tool:request/response legs (#1837);
#   - browser-side ClientToolRelayBridge per-hop logging + RELAY_SPACE_MISMATCH
#     typed error replacing the silent drop (copresent #451).
# Built on top of the 0.9.79 forge/identity wave (everything on main as of
# engine 01fbf74). All 9 images built on the GitHub BUILD SERVER (OIDC->ACR)
# against engine main 01fbf74; engineVersion 0.9.79 -> 0.9.80. copresent SPA
# rebuilt (new digest -- carries #451). Digests hand-applied from
# releases/0.9.80.yaml. livekit pin (#1043) + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

