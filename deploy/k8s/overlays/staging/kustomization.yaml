# Staging overlay -> 0.9.47. Engine + carrier images rebuilt from main 6464ee7:
# realtime tool-scope + persona fix (#1442/#1387 PR #1444), todos/notes/calendar
# on the Assistant + boot-time reconcile (#1443 PR #1445), client-tool relay so
# the realtime model drives the browser/Takeover (#1420 PR #1446). SPA digest
# reused from 0.9.46 (copresent main f7209bf unchanged). livekit pin (#1043) preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster.
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
