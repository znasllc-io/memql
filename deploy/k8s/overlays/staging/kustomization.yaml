# EMERGENCY ROLLBACK -> proven-good pre-gate state (was commit 255345b / the #1233
# rollback). The gate-based path (0.9.33/34/35) failed 3x: #1217 removed the
# double-dispatch redundancy that MASKED a star-topology delivery flaw (a worker
# can't reliably deliver the reply to the bff replica that owns the user's WS,
# only its parent). #1232 (buffer) + #1245 (skip) patched the symptom and #1245
# REGRESSED it (skips LIVE non-parent bff replicas -> no reply, no dispatch).
# Reverting to pre-gate cognition (ca99343d, double-dispatch = reliable, dup
# returns) + the coherent 0.9.33 node/SPA set. The root star-topology delivery
# fix must land + be verified on the PARITY CLUSTER (#1218) before any gate
# redeploy. Refs #1217 #1232 #1245 #1246.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:73ae6c7afbc817d61965320b5951d6553e22ffa12d80a1929a0f908eb7d6079c
  # Carrier-built; 0.9.33 — adds the #1217 dispatch gate.
  - name: acrmemql.azurecr.io/memql-bff-copresent
    digest: sha256:2179d543eb8a660c46e069de7ef7f28b01830a3e2c741a4f1aac6c843fc477e8
  # TEMPORARY ROLLBACK to the 0.9.32 (pre-#1217) cognition build. The #1217
  # exactly-once dispatch gate is CORRECT but exposed #1232 (cross-node
  # graph-event delivery silently drops to churning peers -> intermittent
  # missing replies); the prior double-dispatch was masking it. Reverting just
  # cognition restores the redundancy (reliable replies; the dup returns) until
  # #1232 lands, at which point #1217 is re-enabled on top. All other nodes stay
