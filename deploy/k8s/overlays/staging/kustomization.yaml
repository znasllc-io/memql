# Staging overlay -> 0.9.45. Engine + carrier images rebuilt from main 0542858:
# #1419/#1422 -- the realtime tool surface is scoped to the GA agent's
# slug-expanded tool list (was the 517-tool global registry, which inflated
# gpt-realtime first-audio latency and hid produceArtifact). SPA unchanged
# (digest reused from 0.9.42, source b5013ab).
# cognition/agent/planner/workbench/bff CARRIER-built; voice + identity engine.
# livekit pin (#1043) preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

