# Staging overlay -> 0.11.0 engine + 0.11.1 carriers. The five carrier
# nodes (bff/cognition/agent/planner/workbench) are pinned to the 0.11.1
# rebuild that adds the legacy env-alias shim to the carrier main.go
# (visionarys-io/memql-bff-copresent#144): without it the carriers
# fail-fast'd on MEMQL_DATABASE_DSN because the live memql-secrets +
# genesis envelope still use the pre-Epic-7.3 legacy names. Engine nodes
# (identity/mcp/voice) + the SPA stay at the 0.11.0 digests (unchanged
# source). See releases/0.11.1.yaml (engineVersion 0.11.0).
#
# Staging overlay -> 0.11.0: FULL-STACK cut bringing staging current with
# main (the 115 commits since the 0.10.0 cut -- authoring promote/demote
# durability, the deploy-as-a-pack automation path + #2115 parity, the
# cockpit Editor/Sense + Clusters work, the env-config registry / Epic 7
# MEMQL_<COMPONENT>_ rename, telephony, MCP OAuth, and the voice hardening
# wave). All 9 engine+carrier+SPA images rebuilt on the GitHub BUILD SERVER
# (OIDC->ACR) at engineVersion 0.11.0 (build-engine-images + build-carrier-
# images dispatched at version=0.11.0; the CoPresent SPA is unchanged so its
# 0.10.0 digest is carried forward). Digests hand-applied in-place from
# releases/0.11.0.yaml (not promote.sh, which clobbers the livekit/sip/redis
# pins + the NODE_IP patch). NO DB reset: every schema change since 0.10.0 is
# ADDITIVE (deploymentNodeSpec, healedOverride, rbac concepts, env-var aliases
# shimmed at boot), so existing rows still satisfy the new queries.
# Tracking: #2026 (release), #2115 (the identity automation-driven cutover
# flag below stays on).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"
  # E2.5a (#2115): owner-gated automation-driven deploy cutover on staging.
  # Flips the identity node's gRPC Deploy/RollbackDeployment to the thinned
  # kick-off path and anchors the deploy pack so its lifecycle automations
  # drive promote + terminal. SAFE because the identity image pinned below is
  # 0.11.0 (built from main >= #2159 + #2161 flag handling + #2168, which makes
  # an automation-driven rollback land in rolled_back, matching the Go path).
  # Revert this patch to restore the synchronous Go apply. See
  # docs/public/operate/deployment-console.md.
  - target:
      kind: Deployment
      name: identity
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MEMQL_DEPLOY_AUTOMATION_DRIVEN
          value: "true"

images:
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:b0f1382a7388fca993b9579a57906f905578e3c1dc1076b20b6b5ada89ccde81
  - name: acrmemql.azurecr.io/memql-bff-copresent
    digest: sha256:8095085e20c73b38a36c7a01a52c8d6777a4bff733e90e4c94f1c6209b80506d
  - name: acrmemql.azurecr.io/memql-cognition
    digest: sha256:d6a49703dc71b429a8539373288a8b6352c329ffaa0d64c4383ee839447f91eb
  - name: acrmemql.azurecr.io/memql-voice
    digest: sha256:00def056c944962cf92cac4faf8834827890fd3184b29ec17bfd9793eb2fdf77
  - name: acrmemql.azurecr.io/memql-agent
    digest: sha256:df6f3ea62dc387dfacec10d72447f1394fbe47abec422b5413d0cf46af2779a2
  - name: acrmemql.azurecr.io/memql-planner
    digest: sha256:c23cfd154c1a7940c38c9b3c774b9e48bd8cabdcf67ea6368d8adff7bab952a2
  - name: acrmemql.azurecr.io/memql-workbench
    digest: sha256:2ca234234d0b0fcaf3413b2288e2c184ea4bd1c7ff401bef7b7f1dd54394a282
  # memql-mcp (epic memql#1550): remote MCP node, engine-built on the GitHub
  # build server (#1581 wired it into build-engine-images + the release tooling).
  - name: acrmemql.azurecr.io/memql-mcp
    digest: sha256:68d02fdaf85b959fa50965d4ad357700e35364ff0fa1a29854cf473efe77c5ff
  # CoPresent SPA -- unchanged since 0.10.0, digest carried forward.
  - name: acrmemql.azurecr.io/copresent
    digest: sha256:68c6c465472d15cb6cd55ecf2a68912adf51820ae995f3889d76d4f2573f9227
  - name: livekit/livekit-server
    newName: livekit/livekit-server
    digest: sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
  # Telephony (memql#1910): livekit/sip PSTN edge + its Redis, upstream OSS,
