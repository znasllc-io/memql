# Staging overlay -> 0.9.27 (provider-lifecycle #1078: identity/cognition/agent
# rebuilt from main so the @disabled google/groq/mistral lanes take effect on
# every provider-loading node -- 0.9.26 caught the change only on bff/planner/
# workbench due to a build-time race vs the E merge). engineVersion 0.9.26
# (engine source unchanged; coherent rebuild). voice/planner/workbench/bff/
# copresent reuse their 0.9.26 digests. cognition/agent/planner/workbench are
# CARRIER-built (memql-bff-copresent/Dockerfile + BUILD_TAGS=<type>); voice +
# identity stay engine builds. See releases/0.9.27.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
