# Staging overlay -> 0.9.21 (SI-forward connected-peer fix #1056 on bff/cognition/
# planner, carrier-built; carrier-node architecture fix #1053). cognition/agent/
# planner/workbench are now CARRIER-built (memql-bff-copresent/Dockerfile +
# BUILD_TAGS=<type>) so they carry the CoPresent DSL (agentReply etc.); voice +
# identity stay engine builds. memql@3e661ee + carrier@bba722f. See releases/0.9.20.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:11d8b46c7c32956d2461498b1709e856e3e7ccdf03500aa93665c71d08b8cceb
  # Carrier-built; 0.9.21 carries the SI-forward connected-peer fix (#1056).
