# Staging overlay -> 0.9.85: forge audit-history id normalization (#1859) +
# persistent ReplicaSet hygiene.
#   - #1859: routeRequest/recordTransition wrote audit events under the CANONICAL
#     request id, so forgeRequestHistory(shortId) returned empty. Fixed (PR #1862)
#     with a DSL-native shortId() builtin normalizing requestEvent.requestId to the
#     short id at the single write funnel (mutationRecordRequestEvent), idempotent
#     across the tool + automation paths. Now forgeRequestHistory(shortId) returns
#     routed/approved/mentored.
#   - revisionHistoryLimit:1 added to every workload (base manifests) so the
#     controller auto-GCs old ReplicaSets, keeping active + 1 previous (rollback).
# Engine-only DSL wave; SPA unchanged (same digest). All 9 images built on the
# GitHub BUILD SERVER (OIDC->ACR) against engine main ac68f5b; engineVersion
# 0.9.84 -> 0.9.85. Digests hand-applied from releases/0.9.85.yaml. livekit pin
# (#1043) + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

