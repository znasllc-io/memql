# Staging overlay — the SINGLE image authority for aks-memql-staging.
#
# deployment-v2 Phase 1 (znasllc-io/memql#699): every deployable image is pinned
# here by @sha256: DIGEST, not a mutable tag. The base (../..) carries human-
# readable :tags for readability/local use, but THIS overlay is what gets
# applied/reconciled — kustomize's images: transformer replaces each tag with the
# pinned digest. Nothing mutates the cluster out-of-band: no `kubectl set image`,
# no `rollout undo`. Rollback = `git revert` of a change to this file.
#
# Digests below were captured from the live cluster (kubectl imageID) at the
# 0.9.9 cutover so the first apply/reconcile is a no-op. To deploy a new version:
# update the digest(s) here in a PR (Phase 4 assembles these from the release
# lockfile); merge -> Argo CD reconciles (Phase 2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

