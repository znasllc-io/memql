# Staging overlay -> 0.9.33. All 7 node images + the copresent SPA REBUILT from
# current main (memql fecdbb5 / memql-bff-copresent 2fa2778 / copresent 949163e).
# Carries on top of 0.9.32:
#   - memql: duplicate-utterance fix — advisory-lock dispatch gate so exactly one
#     cognition replica handles a turn (#1217); Anam avatar render-model + Sofia
#     persona fixes (#1209/#1219); local cluster parity tooling (#1212, dev-only,
#     no staging behavior change — the os.Hostname() node-id fallback is a no-op
#     where MEMQL_NODE_ID is set via fieldRef)
#   - copresent: persona-thumbnail same-origin (#403), Anam audio 24kHz (#401),
#     assistant Voice column align + randomize-name (#398/#399)
# cognition/agent/planner/workbench/bff CARRIER-built (memql-bff-copresent/
# Dockerfile + BUILD_TAGS); voice + identity engine builds. livekit pin (#1043)
# preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
