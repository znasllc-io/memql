# Staging overlay -> 0.9.83: forge approval-pipeline + sdk/mesh fixes wave.
# Carries five fixes merged on main after 0.9.82:
#   - #1847 (sev:blocker): the routeRequest automation runs logicRouteRequest
#     under the SYSTEM actor; validateForgeRequestTransition was the only forge
#     transition guard that didn't exempt the system actor, so owner->queued /
#     admin/writer->needs_approval were rejected and the request stuck at
#     "submitted" with empty history. Guard now exempts the system actor.
#   - #1848: logicAttachToRequest's append() array operand was quoted into a
#     literal string -> corrupted attachmentIds (`0="..."`) + second attach
#     clobbered the first. Compiler keeps step.First() accessor paths unquoted.
#   - #1846: client-tool relay REQUEST leg was fast-path-only and silently
#     dropped after a bff blue-green cutover de-peered the WS-owning replica;
#     now also delivered over the durable substrate keyed by space (mirrors
#     the #1843 response-leg fix). Verified by the 2-replica cluster-e2e gate.
#   - #1842: sdk Dispatcher.Run() now closes eventCh on exit (goroutine leak).
#   - #1840 already shipped in 0.9.81; included here on the coherent wave.
# All 9 images built on the GitHub BUILD SERVER (OIDC->ACR) against engine main
# a713f43; engineVersion 0.9.82 -> 0.9.83. SPA unchanged (engine-only wave,
# same digest). Digests hand-applied from releases/0.9.83.yaml. livekit pin
# (#1043) + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

