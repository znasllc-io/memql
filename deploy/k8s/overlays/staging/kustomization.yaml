# Staging overlay -> 0.9.78: FULL-STACK cut (deploy of the #1817 connection-
# lifecycle hardening). Carries database.go pool right-sizing (MaxIdleConns
# 3->1, ConnMaxIdleTime 10m->2m), per-connection idle reapers
# (idle_in_transaction_session_timeout + idle_session_timeout) + application_name
# stamping (#1818), and preStop drain on every DB-connecting node.
# All 9 engine + carrier + SPA images built on the GitHub BUILD SERVER
# (OIDC->ACR) against engine main a8c8d52; engineVersion + builtAgainstEngine
# bumped 0.9.75 -> 0.9.78. copresent SPA source unchanged (digest identical,
# re-tagged 0.9.78 for coherence). Digests hand-applied from releases/0.9.78.yaml
# (not promote.sh, which would drop the livekit pin + NODE_IP patch below).
# livekit pin (#1043) + NODE_IP patch preserved.
