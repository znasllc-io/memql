# Staging overlay -> 0.9.32. All 7 node images (identity, bff-copresent,
# cognition, voice, agent, planner, workbench) + the copresent SPA REBUILT from
# current main (memql c468081 / memql-bff-copresent 2fa2778 / copresent e670099)
# so staging carries today's batch:
#   - copresent UI: canvas newlines (#383), Share-to-group removal (#384),
#     Gallery-only presence / no Spotlight + no camera takeover (#390),
#     Library inline download (#392), deliverable "View task" link (#393),
#     Library summary guard (#396), MemQL-on-task view (#1187)
#   - memql backend: deliverable summary + producedByPlanId stamp (#1207),
#     transcript re-runnable Gate-1 (#1195), adHocAction wrapper suppression
#     (#1192/#1194) + finalize (#1186), authoring capture reliability (#1185),
#     realtime-voice parity epic (#1197: #1198 one-brain tool loop, #1199
#     transcript filter, #1200 faithful user utterances, #1203 server VAD)
# cognition/agent/planner/workbench/bff are CARRIER-built
# (memql-bff-copresent/Dockerfile + BUILD_TAGS=<type>); voice + identity are
# engine builds. livekit pin (#1043) preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
