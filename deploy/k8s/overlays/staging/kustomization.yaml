# Staging overlay -> 0.9.81: forge approval-pipeline fix (#1840) + coherent
# full-stack convergence. Resolves the logic-layer arg-resolution outage that
# took down routing / audit trail / mentoring / attachments on the forge tools:
#   - single-return logic (forgeRecordMentoring): *ast.ArgRefExpr now resolves;
#   - multi-step logic return (forgeAttachToRequest / routeRequest): _return now
#     goes through convertArgReferences (`function "arg" not found` gone);
#   - positional builtin render (append): `0=v0, 1=v1` corruption fixed.
# Also converges staging off a badly-skewed prior rollout (bff pods had been
# split across 0.9.75/78/79/80) onto a single coherent version. All 9 images
# built on the GitHub BUILD SERVER (OIDC->ACR) against engine main 7301e41;
# engineVersion 0.9.80 -> 0.9.81. SPA unchanged (re-tagged, same digest).
# Digests hand-applied from releases/0.9.81.yaml. livekit pin (#1043) + NODE_IP
# patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

