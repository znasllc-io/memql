# Staging overlay -> 0.9.35. All 7 node images + the copresent SPA REBUILT from
# current main (memql 56c802d / memql-bff-copresent 0636e33 / copresent 3397bdf).
# Mesh-robustness release on top of 0.9.34's no-dup/no-drop end state:
#   - #1245 (every node): the forwarder no longer buffers+TTL-expires reply
#     events to dead-for-delivery peers (old blue-green / unready / never-dialed
#     pods). Makes rollouts converge cleanly instead of dropping replies during
#     the post-roll window. Builds on #1217 (gate) + #1232 (outbox).
#   - #114 (carrier DSL): canonical-id @pattern now allows camelCase concepts
#     (canvasState/...), so mutationCreateCanvasState stops rejecting the
#     space.created card.
#   - copresent: Simli-only avatar picker (#418) on top of the prior batch.
# cognition/agent/planner/workbench/bff CARRIER-built; voice + identity engine.
# livekit pin (#1043) preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  # 0.9.40 — produceArtifact complexity routing (#1393): the classifier
  # (volume-aware prompt) decides direct-turn vs decompose, so large
  # deliverables stop timing out the 3m turn wallclock.
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:6315e3f4061885402145b286faac9c87f0b40d44608186cd8669171ed04f38c0
  # Carrier-built; 0.9.42.
  - name: acrmemql.azurecr.io/memql-bff-copresent
    digest: sha256:eda99455495efa682cf606b254c94311c9f74f50ec4a905f03d34172c13670bd
  # Carrier-built; 0.9.42.
  - name: acrmemql.azurecr.io/memql-cognition
    digest: sha256:a562fec0378838831b895a49d3fefdc55db43255a1accdc0fe5d3cddb91b9d33
  - name: acrmemql.azurecr.io/memql-voice
    digest: sha256:c1fd666f3f483df0e8f6aabff48f85afebdee9ddda50a1def25a8b1148c0c97b
  # Carrier-built; 0.9.42.
  - name: acrmemql.azurecr.io/memql-agent
    digest: sha256:cef9fd09efdfb86d9c0798e97cd8ccc4476cda8b7a468dd8da46b492bdb57b63
  # Carrier-built; 0.9.42.
  - name: acrmemql.azurecr.io/memql-planner
