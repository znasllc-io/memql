# Staging overlay -> 0.9.90: corrective re-cut of 0.9.89. 0.9.89 took staging
# down because the new Epic 4 telephony plug-in was fatal-at-boot without a
# Telnyx key (#2028); 0.9.90 (engine main 173f70a3) makes the plug-in load
# inert until configured. All 9 engine+carrier+SPA digests rebuilt on the
# GitHub BUILD SERVER (OIDC->ACR) at engineVersion 0.9.90 (SPA digest unchanged
# -- deterministic rebuild). Digests from releases/0.9.90.yaml; livekit/sip/redis
# pins + NODE_IP patch preserved (promote.sh clobbers the overlay, so digests
# are updated in-place per the release runbook). Tracking: #2026, fixes #2028.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
