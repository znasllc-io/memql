# Staging overlay -> 0.9.82: client-tool relay (UI takeover) FIX. The voice/
# service relay parked its waiter on the agent node and depended on best-effort
# mesh broadcast to return the browser response there; it reached cognition +
# the sibling agent replica instantly but the waiter's own node ~30s late, after
# the 30s timeout -- so "change the theme" over chat/voice always timed out
# (epic #1833). Fix (#1843, closes #1835): deliver the response over the durable,
# replica-addressed substrate (BeginTurn(callId) on the agent + cognition
# Deliver(callId) on no-pending-entry), the same return leg the text path uses.
# Built on the 0.9.81 forge wave (everything on main as of engine 98142b0).
# All 9 images built on the GitHub BUILD SERVER (OIDC->ACR) against engine main
# 98142b0; engineVersion 0.9.81 -> 0.9.82. SPA unchanged (engine-only fix,
# re-tagged, same digest). Digests hand-applied from releases/0.9.82.yaml.
# livekit pin (#1043) + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

