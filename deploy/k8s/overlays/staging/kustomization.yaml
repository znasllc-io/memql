# Staging overlay -> 0.9.66: MCP connector hardening wave 2 (epic #1609).
# identity + mcp re-pinned to 0.9.66 (engine-built on the GitHub BUILD SERVER,
# OIDC->ACR):
#   - memql-identity #1607: the OAuth token endpoint now implements the
#     refresh_token grant, so claude.ai can silently refresh its 15-min access
#     token instead of dropping the connector session at expiry.
#   - memql-mcp #1606: under-specified object/array tool-arg types no longer
#     reflect to over-strict JSON schema (scalar arrays + free-form
#     partial-update payloads are callable again) + #1605: generatedOutput
#     artifact indexing stops failing on null producedBy* refs.
# All other images stay at their 0.9.63 digests, so engineVersion +
# builtAgainstEngine remain 0.9.63 (carrier coherence). Prior: mcp 0.9.65 (#1595
# actor.userId envelope + #1602 unknown-tool JSON-RPC error); identity 0.9.62
# (OAuth consent). copresent SPA digest unchanged. livekit pin (#1043) + NODE_IP
# patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
