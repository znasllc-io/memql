# Staging overlay -> 0.9.31. All 7 node images (identity, bff-copresent,
# cognition, voice, agent, planner, workbench) REBUILT at main 995b8dd so they
# carry #1117 (/livez pure-liveness endpoint) + #1119 (bounded NodeServer
# shutdown) -- the #1115 re-ship that unblocks flipping liveness to /livez --
# plus #1118/#1129/#1130/#1131/#1134/#1138 fixes merged since 0.9.30. The
# copresent SPA + livekit pins are UNCHANGED (no /livez there; frontend
# untouched). cognition/agent/planner/workbench/bff are CARRIER-built
# (memql-bff-copresent/Dockerfile + BUILD_TAGS=<type>); voice + identity are
# engine builds. livekit pin (#1043) preserved. NOTE: liveness flips to /livez
# in a FOLLOW-UP overlay change only AFTER these images are confirmed live --
# the manifest + image must not split (the #1115 outage lesson).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

# Pin the media IP LiveKit advertises to the livekit-rtc LoadBalancer's public
# IP (#1043). Per-env because the LB IP differs by cluster. If the livekit-rtc
# Service is ever recreated and Azure assigns a new IP, update this value (or
# reserve a static IP — see docs/deploy/livekit-provision.md).
patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

images:
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:631abcf52ec6c9f5548a8cea6f5183d2eff25696224d1d46c2e5ff14f2a4eb1c
  # Carrier-built; 0.9.28 engine/DSL bug-fix bundle + #1102 produceArtifact guard.
