# Staging overlay -> 0.9.86: claim-email fail-safe (#1864) + deployer-leak reap (#1861).
#   - #1864 (PR #1866): the "claim the cluster" first-run email was re-sent on
#     every deploy. Two bugs: StampClusterBootstrapped failures were swallowed
#     (cluster stuck "awaiting claim" despite an owner), and the email guard
#     wasn't fail-safe -- a boot-time DB read error (during the 53300 storm)
#     fell through and re-sent. Fixed: gate on "owner exists", self-heal the
#     stamp, never send on a read error, bounded retry through the storm.
#   - #1861 (PR #1865): reap the leaked `deployer` tooling-role idle pool (~27
#     idle conns) that ate ~1/3 of the Tiger max_connections budget -- the
#     dominant residual 53300 driver once the mesh pools were bounded (#1858).
# NOTE (#1858): the mesh DB pools (engine AND carrier) are already bounded to 4
# and verified healthy via pg_stat_activity; the earlier "carrier unbounded"
# reading was a distroless printenv artifact, not a real gap.
# All 9 images built on the GitHub BUILD SERVER (OIDC->ACR) against engine main
# 9dbf1db; engineVersion 0.9.85 -> 0.9.86. SPA unchanged (same digest). Digests
# from releases/0.9.86.yaml; livekit pin (#1043) + NODE_IP patch preserved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: livekit
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_IP
          value: "20.246.247.180"

