components:
  - ../../components/engine-bff
  # AFTER engine-bff: domain-derive patches the `bff` Deployment that component
  # adds, and components apply in listed order.
  - ../../components/domain-derive
  - ../../components/cnpg-db
  - ../../components/cnpg-db/presets/entry
