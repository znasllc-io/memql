# CLOUD-ENTRY overlay -- the entry / client install shape (memql#4203).
#
# A SECOND INSTANCE overlay, not a staging/prod split. overlays/cloud stays
# on cnpg-db/presets/top + mesh 2 and is what deploy/argocd/apps/memql.yaml
# points at. This directory is what a ZNAS (or client) Argo in its OWN
# cluster reconciles: same base, same cnpg-db shape, entry sizes, mesh 1,
# voice-off. Do not apply overlays/cloud to an entry install's resource group.
#
# Voice-off is first-class replicas 0 on voice / voice-agent / livekit /
# livekit-sip / mcp (and livekit-redis, which exists only for the sip
# plane), AND the LiveKit Services held at ClusterIP (memql#4225) so that
# no public IP is allocated for a plane that is not running. It is not
# LiveKit NODE_IP=0.0.0.0 and not an all-zeros MCP digest -- those were
# fail-closed placeholders for a running pin.
#
# The generated front door lives in THIS directory (memql#4204).
# cmd/frontdoorhosts writes front-door.generated.yaml here with the
# committed default memql.localhost. kustomize will not load a sibling
# file from overlays/cloud, so each instance overlay owns its own copy.
# An install patches hosts and MEMQL_DOMAIN through the ArgoCD
# Application -- do not commit a real domain here (memql#3593).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base
  # The front door, GENERATED from the role set and the domain by
  # cmd/frontdoorhosts (memql#4204) -- run `make frontdoor`, never edit it.
  - front-door.generated.yaml
  # DNS-01 + the wildcard certificate for the sites plane (memql#4347). Hand-
  # authored and NOT part of the generated front door: the generator's whole
  # input is the role set and the domain, and this is neither -- it is a
  # certificate REGIME, chosen per install. Keeping it out of the generator is
  # also what keeps the reversal STAGED: front-door.generated.yaml still asks
  # letsencrypt-prod for the exact hosts, unchanged. Each instance overlay owns
  # its own copy for the same load-restrictor reason the front door does.
  - dns01-wildcard-tls.yaml

patches:
  # THE WILDCARD RULE GAINS ITS tls ENTRY (memql#4347) -- the half of the
  # reversal a Certificate alone cannot do.
  #
  # ingress-nginx builds a certificate-bearing server block per RULE host and
  # verifies the certificate against each host listed under `tls`. The
  # `*.<domain>` rule has always existed; until something could ISSUE for it,
  # listing it under `tls` made the controller serve its self-signed default for
  # every name the rule answers (memql#4224). With memql-wildcard-tls issuable by
  # DNS-01 it can finally be listed -- and it must be, because a rule host with a
  # usable certificate and no `tls` entry gets the default anyway.
  #
  # `add /spec/tls/-` rather than a rewrite: the entry already there is the apex
  # on memql-front-door-tls, and it stays exactly as generated. One tls entry per
  # certificate, so nothing that terminates today changes issuer.
  #
  # AN INSTALL MUST PATCH `/spec/tls/1/hosts/0` TOO. The Argo host-patch list in
  # docs/public/operate/azure-entry-install.md grew that pointer with this
  # change; a patch set written against the previous shape leaves the committed
  # `*.memql.localhost` behind, which is a tls host the real certificate does not
  # name -- the memql#4224 symptom, at the one host it was about.
  - target: { kind: Ingress, name: edge-front-door }
    patch: |
      - op: add
        path: /spec/tls/-
        value:
          hosts:
            - "*.memql.localhost"
          secretName: memql-wildcard-tls

  # Replica counts, STATED rather than inherited. Request-serving mesh
  # nodes are 1. Voice-off is 0, not a leftover placeholder.
  - target: { kind: Deployment, name: identity }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: bff }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: cognition }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: planner }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: workbench }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: edge }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: mcp }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: voice }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: voice-agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: livekit }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: livekit-sip }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: livekit-redis }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }

  # VOICE-OFF, PART TWO: NO PUBLIC IPs (memql#4225). Replicas 0 above stops
  # the pods; it does not stop Azure allocating a public IP for every
  # LoadBalancer Service base declares for the media plane (livekit-rtc)
  # and the SIP plane (livekit-sip). The first entry install converted both
  # to ClusterIP by hand, and the next Argo sync of this overlay was refused:
  #
  #   Service "livekit-rtc" is invalid: spec.externalTrafficPolicy: Invalid
  #   value: "Local": may only be set for externally-accessible services
  #
  # because the overlay still wanted LoadBalancer + externalTrafficPolicy
  # Local, and a ClusterIP Service cannot carry that field (nor
  # loadBalancerSourceRanges, nor the Azure mixed-protocol annotation). The
  # Application stayed OutOfSync/Failed with every pin inside it correct.
  # So voice-off is ONE decision, stated here for the Services as it is
  # above for the replicas: type ClusterIP, every LoadBalancer-only field
  # removed. `remove`, not `replace`-to-empty, so a base that stops
  # declaring a field fails this render loudly instead of leaving a silent
  # no-op behind. overlays/cloud keeps voice on and is untouched; the
  # `livekit` signaling Service is ClusterIP in base already.
  # Gated by ../livekit_entry_voice_off_test.go (text, cannot skip) and
  # ../render_cloud_entry_test.go (rendered).
  - target: { kind: Service, name: livekit-rtc }
    patch: |
      - { op: replace, path: /spec/type, value: ClusterIP }
      - { op: remove, path: /spec/externalTrafficPolicy }
      - { op: remove, path: /metadata/annotations/service.beta.kubernetes.io~1azure-load-balancer-mixed-protocols }
  - target: { kind: Service, name: livekit-sip }
    patch: |
      - { op: replace, path: /spec/type, value: ClusterIP }
      - { op: remove, path: /spec/externalTrafficPolicy }
      - { op: remove, path: /spec/loadBalancerSourceRanges }
      - { op: remove, path: /metadata/annotations/service.beta.kubernetes.io~1azure-load-balancer-mixed-protocols }

  # The domain is delivered by the components/domain-derive component at the
  # bottom of this file (memql#4281), not by a patch here. It used to be a
  # patch here, and it was HALF the job: it appended the memql-domain ConfigMap
  # to envFrom and did not delete the base's pinned placeholders, which beat
  # envFrom -- so this overlay rendered eleven workloads pinned to an issuer at
  # example.com and a cloud-entry install rejected every token. No hostname is
  # committed here or there.

  # -------------------------------------------------------------------------
  # DATABASE -- same cloud VALUES as overlays/cloud; SIZES come from entry.
  # -------------------------------------------------------------------------
  - target: { kind: Cluster, name: memql-db }
    patch: |
      - { op: add, path: /spec/storage/storageClass, value: managed-csi-premium-v2 }
      - { op: add, path: /spec/walStorage/storageClass, value: managed-csi-premium-v2 }
      - op: add
        path: /spec/affinity
        value:
          nodeSelector:
            memql.io/node-pool: database
          tolerations:
            - key: memql.io/dedicated
              operator: Equal
              value: database
              effect: NoSchedule
      - op: add
        path: /spec/serviceAccountTemplate
        value:
          metadata:
            labels:
              azure.workload.identity/use: "true"
            annotations:
              azure.workload.identity/client-id: "REPLACE-WITH-DB-IDENTITY-CLIENT-ID"
      # The POD label the workload-identity webhook actually selects on. The
      # ServiceAccountTemplate label above gates nothing -- the SA's job is to
      # carry the client-id annotation the webhook reads once it fires; with
      # the pod unlabelled it never fires, no token volume or AZURE_* env is
      # injected, and inheritFromAzureAD below has nothing to inherit
      # (memql#4460: 618 straight WAL-archive failures, zero blobs). CNPG
      # stamps pod labels via inheritedMetadata. The webhook mutates at pod
      # CREATION only, so on a running cluster this needs a pod roll.
      - op: add
        path: /spec/inheritedMetadata
        value:
          labels:
            azure.workload.identity/use: "true"

  - target: { kind: ObjectStore, name: memql-db-backup }
    patch: |
      # HOST FIRST (memql#4496 / memql#4460): barman-cloud's Azure grammar is
      #   https://<account>.blob.core.windows.net/<container>/
      # -- account in the hostname, container as the leading path segment.
      #
      # THE HOST IS NOT COSMETIC, IT SELECTS A CODE PATH. barman branches on
      # this host alone, before it reads any credential: anything not ending in
      # `blob.core.windows.net` is treated as an EMULATOR and then requires a
      # connection string, which `inheritFromAzureAD` deliberately does not
      # provide. So the old container-only "azure://memql-db-backups/" failed
      # as "connection string ... emulated storage"; a host with no container
      # segment fails as "Please specify a container name". Either way the
      # failure is silent -- Ready Cluster, healthy pods, WAL never recycled.
      # See deploy/k8s/components/cnpg-db/objectstore.yaml for the branch, and
      # TestBackupDestinationSurvivesBarmansEmulatorBranch for the gate.
      - op: replace
        path: /spec/configuration/destinationPath
        value: "https://REPLACE-WITH-STORAGE-ACCOUNT.blob.core.windows.net/memql-db-backups/"
      - op: replace
        path: /spec/configuration/azureCredentials
        value:
          inheritFromAzureAD: true
      - { op: replace, path: /spec/retentionPolicy, value: "30d" }

  # ANTHROPIC WORKLOAD IDENTITY FEDERATION -- the four ids (memql#4336).
  #
  # These are the ONLY per-cluster values federation needs, and they are values
  # rather than shape: the ServiceAccount, the projected token and the mount
  # path are in the base and identical everywhere, so the local cluster runs
  # this same YAML with these four left empty and keeps booting on the API key
  # (docs/public/operate/environment-parity.md -- credential source for a
  # vendor is an allowed value difference).
  #
  # FILL THESE FROM THE CONSOLE, NOT FROM ANOTHER CLUSTER. They identify one
  # federation rule bound to one cluster's OIDC issuer; a re-created cluster
  # has a NEW issuer and needs a new rule and new ids. Step 3 of
  # docs/public/operate/auth/anthropic-federation.md.
  #
  # Leave a value as its REPLACE-WITH- placeholder and the engine treats the
  # set as half-configured and REFUSES BOOT, naming what is missing. That is
  # deliberate: the alternative is falling back to a key the cutover deletes.
  #
  # MEMQL_AI_ANTHROPIC_WORKSPACE_ID stays empty unless the rule spans more than
  # one workspace (Anthropic answers workspace_id_required when it needs one).
  - target: { kind: ConfigMap, name: memql-anthropic-federation }
    patch: |
      - { op: replace, path: /data/MEMQL_AI_ANTHROPIC_FEDERATION_RULE_ID, value: "REPLACE-WITH-ANTHROPIC-FEDERATION-RULE-ID" }
      - { op: replace, path: /data/MEMQL_AI_ANTHROPIC_ORGANIZATION_ID, value: "REPLACE-WITH-ANTHROPIC-ORGANIZATION-ID" }
      - { op: replace, path: /data/MEMQL_AI_ANTHROPIC_SERVICE_ACCOUNT_ID, value: "REPLACE-WITH-ANTHROPIC-SERVICE-ACCOUNT-ID" }

images:
  # Engine pins from v0.19.6 (actions run 32514995614). overlays/cloud
  # is untouched. MCP is omitted on purpose: replicas 0, so there is
  # no running pin and no all-zeros digest (memql#4203).
  - name: memql-db
    newName: acrmemql.azurecr.io/memql-db
    newTag: 16.15-timescaledb-2.29.1
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:3a888674e20440f54ee7f25b9ed9cb739bb478e45d662df0a94a53bf10ee15c5
  - name: acrmemql.azurecr.io/memql-bff
    digest: sha256:b89d84d5d5426f70e130709401a3857636c4ecadfe398c3174c069e34fd8c4cf
  - name: acrmemql.azurecr.io/memql-cognition
    digest: sha256:1ef3dcf46aa5a9eb72e3a240493da5393bea35b477bcce822cf5ef36cd5536b2
