# CLOUD-ENTRY overlay -- keep-it / client install (memql#4203).
#
# A SECOND INSTANCE overlay, not a staging/prod split. overlays/cloud stays
# on cnpg-db/presets/top + mesh 2 and is what deploy/argocd/apps/memql.yaml
# points at. This directory is what a ZNAS (or client) Argo in its OWN
# cluster reconciles: same base, same cnpg-db shape, entry sizes, mesh 1,
# voice-off. Do not apply overlays/cloud to rg-znas-memql.
#
# Voice-off is first-class replicas 0 on voice / voice-agent / livekit /
# livekit-sip / mcp (and livekit-redis, which exists only for the sip
# plane). It is not LiveKit NODE_IP=0.0.0.0 and not an all-zeros MCP
# digest -- those were fail-closed placeholders for a running pin.
#
# The generated front door lives in THIS directory (memql#4204).
# cmd/frontdoorhosts writes front-door.generated.yaml here with the
# committed default memql.localhost. kustomize will not load a sibling
# file from overlays/cloud, so each instance overlay owns its own copy.
# An install patches hosts and MEMQL_DOMAIN through the ArgoCD
# Application -- do not commit a real domain here (memql#3593).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base
  # The front door, GENERATED from the role set and the domain by
  # cmd/frontdoorhosts (memql#4204) -- run `make frontdoor`, never edit it.
  - front-door.generated.yaml

patches:
  # Replica counts, STATED rather than inherited. Request-serving mesh
  # nodes are 1. Voice-off is 0, not a leftover placeholder.
  - target: { kind: Deployment, name: identity }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: bff }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: cognition }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: planner }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: workbench }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: edge }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Deployment, name: mcp }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: voice }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: voice-agent }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: livekit }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: livekit-sip }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }
  - target: { kind: Deployment, name: livekit-redis }
    patch: |
      - { op: replace, path: /spec/replicas, value: 0 }

  # The domain, delivered once (memql#4222 / #3593).
  # Every rematerializing engine node reads MEMQL_DOMAIN from the
  # memql-domain ConfigMap so SeedMaterializer can derive the portal
  # site hostname. envFrom has no merge key -- JSON 6902 append only.
  # No hostname is committed here.
  - path: patches/domain-envfrom.yaml
    target:
      kind: Deployment
      name: "^(identity|bff|cognition|agent|planner|workbench|mcp|voice|voice-agent|edge)$"

  # -------------------------------------------------------------------------
  # DATABASE -- same cloud VALUES as overlays/cloud; SIZES come from entry.
  # -------------------------------------------------------------------------
  - target: { kind: Cluster, name: memql-db }
    patch: |
      - { op: add, path: /spec/storage/storageClass, value: managed-csi-premium-v2 }
      - { op: add, path: /spec/walStorage/storageClass, value: managed-csi-premium-v2 }
      - op: add
        path: /spec/affinity
        value:
          nodeSelector:
            memql.io/node-pool: database
          tolerations:
            - key: memql.io/dedicated
              operator: Equal
              value: database
              effect: NoSchedule
      - op: add
        path: /spec/serviceAccountTemplate
        value:
          metadata:
            labels:
              azure.workload.identity/use: "true"
            annotations:
              azure.workload.identity/client-id: "REPLACE-WITH-DB-IDENTITY-CLIENT-ID"

  - target: { kind: ObjectStore, name: memql-db-backup }
    patch: |
      - op: replace
        path: /spec/configuration/destinationPath
        value: "azure://memql-db-backups/"
      - op: replace
        path: /spec/configuration/azureCredentials
        value:
          inheritFromAzureAD: true
      - { op: replace, path: /spec/retentionPolicy, value: "30d" }

images:
  # Engine pins from v0.19.3 (actions run 32451184414). overlays/cloud
  # is untouched. MCP is omitted on purpose: replicas 0, so there is
  # no running pin and no all-zeros digest (memql#4203).
  - name: memql-db
    newName: acrmemql.azurecr.io/memql-db
    newTag: 16.15-timescaledb-2.29.1
  - name: acrmemql.azurecr.io/memql-identity
    digest: sha256:6fd2be87aa2b09a19265dfbb3fe967a909421adba1a5b409f17f1f9cd3212324
  - name: acrmemql.azurecr.io/memql-bff
    digest: sha256:ad44b8102bbe155fa09332ded4b95c4f4528d5c9e68c8bc57b6db70e59454cb0
  - name: acrmemql.azurecr.io/memql-cognition
    digest: sha256:f9699dea16c39eced7340c3441100bb961c87b6a707fc24f882a5631da1826c9
  - name: acrmemql.azurecr.io/memql-voice
    digest: sha256:edff3fe6478fc8a9a142097cfdb87e299201a55ce869b776efb43b83317b900d
  - name: acrmemql.azurecr.io/memql-agent
    digest: sha256:ef0aa0c81bc30182328018ba6d84c1f9adcf997a6d01b56f257121613125e48c
  - name: acrmemql.azurecr.io/memql-planner
    digest: sha256:d00c1480c46d00aa83cac4dba9880fd7e277792a34544a34b275c49b6b0527a3
  - name: acrmemql.azurecr.io/memql-workbench
    digest: sha256:9de1d39682d9f584072342b6de930cae1c8640a506225f9a1c43f5164161e971
  - name: acrmemql.azurecr.io/memql-edge
    digest: sha256:6cedc5fd90fa2d5e06a7ffd7932fdc9fe2558450357ff8bf8ffe1b061c359e04
  - name: livekit/livekit-server
    newName: livekit/livekit-server
    digest: sha256:9e34703b97ceb9f622bcbb533107e4786c7aa65966f0494966a452ad41a0c0d4
  - name: livekit/sip
    newName: livekit/sip
    digest: sha256:f8621da1f203ba46e567f08311771ee5f77b0f93aad3eb7f24aaf93067f253cc
  - name: redis
    newName: redis
    digest: sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99

components:
  - ../../components/engine-bff
  - ../../components/cnpg-db
  - ../../components/cnpg-db/presets/entry
