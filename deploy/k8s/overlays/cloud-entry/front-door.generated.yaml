# The identity service: /login, the WebAuthn ceremonies, the OAuth endpoints,
# /.well-known/jwks.json, /me/*, /enroll and /device.
#
# HTTPS ON THE INTERNAL HOP, VERIFICATION OFF. identity serves TLS in-cluster under the
# internal CA, which the ingress controller's trust store does not carry -- so the proxy
# speaks https to it and skips verification. The hop stays inside the cluster network.
# The local overlay expresses the same thing with a traefik ServersTransport.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-front-door
  namespace: memql
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "identity.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    - host: identity.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8085
---
# The MCP Streamable HTTP protocol head.
#
# Its own host rather than a path under the api host, for the constraint that shapes
# this whole file: the mcp node is a different Service on a different port (8090)
# speaking plain HTTP, and backend protocol is not a per-path setting. Not proxied
# through the edge either -- MCP clients configure a URL, they are not browsers, and an
# extra hop on a tool-calling path buys nothing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-front-door
  namespace: memql
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "mcp.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    - host: mcp.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8090
---
# The portal -- site #1, and the ONE site with an exact rule of its own (memql#4224).
#
# To the edge the portal is a site like any other: the same Service the wildcard below
# points at, resolved against the same v1:platform:site rows, no special path
# (component/edge's dogfood gate forbids one). It gets its own Ingress for a TLS reason
# and only that: ingress-nginx creates a certificate-bearing server block per RULE host,
# never per tls host. With only the *.<domain> rule, portal.<domain> is answered by the
# wildcard's server block, whose certificate is the controller's self-signed default
# because no wildcard SAN can be issued over HTTP-01 -- exactly what the first entry-shape
# cluster served to Safari. An exact rule gives the portal a server block the
# certificate verifies for.
#
# It is the only site the generator can do this for, because it is the only site whose
# name exists before an operator creates a row. The engine seeds that row's hostname
# from MEMQL_DOMAIN through the same derivation that wrote this host
# (component/frontdoor.PortalHost), so the certificate cannot name a host the row does
# not carry. The same Service and port as the edge Ingress below, deliberately: this is
# not a second way to serve the portal, it is the first way with a certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-front-door
  namespace: memql
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "portal.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    - host: portal.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8085
---
# The site edge -- the wildcard and the apex, the last front-door rules that will ever
# be added.
#
# Everything after this is a graph row. That is the whole of memql#3700's "a site is
# data, not infrastructure": the host count is fixed by the closed ROLE set plus the
# platform's own portal, and never grows with sites.
#
# TLS NAMES THE APEX ONLY (memql#4224). The wildcard rule has no certificate behind it:
# the issuer is HTTP-01, which cannot issue *.<domain>, and listing the wildcard under
# tls anyway is what made ingress-nginx fall back to its self-signed default for every
# name this rule answers. A site routed by the wildcard terminates TLS with that default
# until it has a Certificate and an exact-host Ingress of its own
# (docs/public/operate/site-hosting.md).
#
# The edge serves plain HTTP on :8085, so no backend-protocol annotation is needed here
# -- unlike the api host, which carries h2c for gRPC, and unlike identity, which is https
# behind a verification skip.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-front-door
  namespace: memql
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "memql.localhost"
      secretName: memql-front-door-tls
  rules:
    # Every hosted site: every SPA or website the operator creates a v1:platform:site
    # row for (the portal has its own rule above, for TLS; it is served exactly like
    # these). ONE rule, forever -- the edge node resolves the request Host against the
    # graph, so a new site is an upload plus a row write and the number of Kubernetes
    # objects does not grow with it. What a new site does NOT get from this rule is a
    # certificate: see the tls block above.
    - host: "*.memql.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8085
    # The apex, and it is NOT a special case: for a customer cluster the bare domain IS
    # their main website, so it is a site row like any other -- it just happens to be the
    # one whose hostname is the domain itself. Same Service; the edge cannot tell the two
    # rules apart.
    - host: memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8085
