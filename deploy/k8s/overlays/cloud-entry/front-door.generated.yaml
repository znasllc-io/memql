# The API edge's gRPC half: the h2c catch-all, on the same host.
#
# Everything the bff serves over gRPC arrives here -- MemqlService.Stream is the primary
# surface, so this is the rule the Cockpit, the SDKs, the VS Code extension and the
# browser bridge all land on. It is `/` and it is a whole Ingress of its own because
# backend-protocol is Ingress-scoped; see the object above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-front-door-grpc
  namespace: memql
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api.memql.localhost"
      secretName: memql-front-door-tls
  rules:
    - host: api.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 50051
