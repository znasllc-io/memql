# Run `make frontdoor` (hosts, then paths). Hand edits are reverted by the generator
# and TestFrontDoorHostsAreNotStale fails the build until they are.
#
# The front door for the `cloud-entry` overlay, derived from the closed ROLE set plus
# the platform's own site (memql#3767, memql#4224). The host COUNT never grows with
# customers, apps or sites, which is what the sites wildcard is for (memql#3700).
#
#   api          api.memql.localhost
#   identity     identity.memql.localhost
#   mcp          mcp.memql.localhost
#   sites        portal.memql.localhost
#   sites        *.memql.localhost
#   sites        memql.localhost
#
# THE CERTIFICATE NAMES EXACT HOSTS, NOT A WILDCARD (memql#4224). The ClusterIssuer
# solves HTTP-01 only. ACME cannot serve an HTTP-01 challenge for *.<domain>, and ONE
# wildcard dnsName fails the WHOLE order -- so the Certificate that used to request it sat
# Pending, was hand-edited to exact names on the first entry-shape cluster, and the edge
# Ingress whose tls.hosts still said *.<domain> served ingress-nginx's self-signed default
# for portal.<domain> (Safari: "This Connection Is Not Private"). DECISION: the wildcard
# is NOT requested. dnsNames is every exact host above; every Ingress below lists exactly
# its own exact rule hosts under tls; and the union of those tls lists is the dnsNames
# set -- deploy/k8s/overlays/frontdoor_hosts_test.go fails the build when they differ.
# The *.<domain> RULE stays, because it is how every site reaches the edge, but it has no
# certificate behind it: a customer site hostname needs its own Certificate and its own
# exact-host Ingress until the issuer gains a DNS-01 solver
# (docs/public/operate/site-hosting.md). The portal is the one site the generator can
# name in advance, so it is the one site with an exact rule and a SAN.
#
# THE DOMAIN IS A COMMITTED DEFAULT, NOT A CONSTANT (memql#3593). No file under deploy/
# names a real domain: the domain is a value on the memql-domain ConfigMap, which every
# node derives its issuer, CORS origins, redirect URIs and portal site hostname from at
# boot (component/envregistry/domain.go and component/memql's SeedMaterializer, threaded
# through component/frontdoor so the hosts below and the hosts the nodes believe in
# cannot disagree). An Ingress host is a Kubernetes API object, so it has to be in the
# render; an install overrides these through the ArgoCD Application's
# spec.source.kustomize.patches. `.localhost` is unroutable, so a cluster reconciled
# before its domain is set fails visibly rather than half-working.
#
# NO ROUTER-PRIORITY ANNOTATIONS, unlike the local overlay's traefik front door. nginx
# resolves server_name by specificity in its own core -- an exact name beats a leading
# wildcard -- so the role hosts and the portal outrank *.<domain> without anything being
# declared. That is a guarantee traefik does not give, which is why the local overlay
# declares the ranking by hand and why doing it there went wrong once (memql#3810). Do
# not copy that annotation here: it would be an unnecessary declaration of something
# nginx already does, and Ingress-level priority is what flattened the api host's path
# ordering.
---
# The front-door certificate for this namespace: every EXACT host the front door serves,
# and nothing else (memql#4224).
#
# NO WILDCARD SAN. The issuer is HTTP-01 and a wildcard dnsName fails the whole order,
# not the one name -- the Certificate would sit Pending and every host here would serve
# the controller's default certificate. The apex is a dnsName like any other now; it
# used to be the one exception to a wildcard that matched exactly one label. One order,
# one renewal, and a new customer site does NOT join this list: it needs a Certificate
# of its own until a DNS-01 solver exists (docs/public/operate/site-hosting.md).
#
# This list and the tls.hosts of the Ingresses below are the SAME set, derived from
# component/frontdoor.CertificateSANs; the overlay render gate asserts the equality.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: memql-front-door-tls
  namespace: memql
spec:
  secretName: memql-front-door-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "api.memql.localhost"
    - "identity.memql.localhost"
    - "mcp.memql.localhost"
    - "portal.memql.localhost"
    - "memql.localhost"
---
# The API edge's HTTP half.
#
# TWO INGRESS OBJECTS FOR ONE HOST, AND THIS IS THE CONSTRAINT THAT FORCES IT: an
# ingress controller's backend protocol is not a per-path setting. On nginx
# `backend-protocol` is an annotation on the INGRESS, so an object cannot route some of
# its paths to an h2c backend and the rest to an HTTP one; the bff's gRPC edge
# (bff:50051) and its HTTP edge (bff-http:8085) are already two Services over one
# Deployment for the same reason. So the HTTP paths live here and the gRPC catch-all
# lives in the object below. nginx merges rules for one host into one server block and
# orders locations by prefix length, so every path below outranks the `/` catch-all.
#
# MERGING THEM WOULD NOT 404 -- it would hand an HTTP/1.1 request to an h2c backend,
# which fails with a protocol error naming nothing. That is memql#3703, and it is the
# same failure the generated block below exists to prevent from the other direction.
#
# THE PATH LIST IS GENERATED BY A DIFFERENT TOOL. cmd/frontdoorpaths emits it from
# component/server's own path declarations; this tool preserves the block across a
# regeneration and `make frontdoor-paths` fills it. Hand-editing it is reverted by the
# generator, and some paths the bff serves are DELIBERATELY withheld from it --
# /metrics and /api/concepts* are unauthenticated because they are in-cluster only, so
# adding a rule for one is not a fix, it is an exposure.
