# Local overlay -- k3d development (Epic 0, znasllc-io/memql#2064/#2065).
#
# PURPOSE
# This overlay runs the full MemQL stack on a local k3d cluster via ArgoCD.
# It differs from the cloud overlay in three ways only:
#   1. Config -- local DB (in-cluster CNPG Cluster + azurite blob), no Tiger Cloud.
#   2. Resources -- minimal requests; no limits set so developer laptops aren't
#      starved.
#   3. Replicas -- 1 per node type (multi-node is exercised via #2067).
#
# LOCAL INFRASTRUCTURE (defined here, absent in base)
#   - azurite.yaml       -- Azure Blob emulator (replaces Azure Blob Storage),
#                           and now also the backup destination the database's
#                           ObjectStore archives WAL and base backups to
#   - db-pool-local.yaml -- looser pool bounds for local Postgres (not Tiger Cloud)
#
# THE DATABASE IS A COMPONENT, not a local manifest (epic memql#3842 /
# #3846 / #3851). `components: ../../components/cnpg-db` brings the same four
# resources -- Cluster, Database, ObjectStore, ScheduledBackup -- that the cloud
# production and every tenant deployment compose; the patches further down
# supply local's VALUES (10Gi, Azurite, a 7-day retention). It replaced a
# hand-rolled `postgres` Deployment that was the one place the parity doctrine
# bent: no operator, no WAL archiving, no backups.
#
# SECRETS (created by `make secrets`, NOT committed)
#   - memql-secrets      -- the one config delivery path: master key, identity
#                          signing seed, node bootstrap token, DB DSNs, blob
#                          connection string (epic memql#3958)
#   - livekit-secrets    -- LiveKit API key+secret for local livekit server
#   - telephony-secrets  -- stub (telephony disabled locally)
#   - memql-db-app-creds -- Postgres credentials for the in-cluster DB. A
#                           kubernetes.io/basic-auth Secret (username /
#                           password), which is the shape CNPG's
#                           bootstrap.initdb.secret reads. The NAME is the
#                           component's contract -- local seeds it here, the
#                           cloud syncs it from Key Vault through ESO.
# See scripts/k3d/seed-secrets.sh for the creation logic.
#
# IMAGE AUTHORITY
# Unlike the cloud overlay, local images are NOT pinned by @sha256: digest.
# They are built locally by `make k3d-build` / the `make k3d-dev` inner loop
# (#2066) and imported into k3d via `k3d image import`.  The tag `local`
# is used; imagePullPolicy: IfNotPresent so the cluster never tries to pull
# from ACR (the dev machine may not have ACR credentials).
#
# CLOUD-ONLY RESOURCES EXCLUDED
# The base includes resources that require cloud infrastructure not present
# locally.  This overlay removes them with $patch: delete:
#   - ExternalSecret (livekit-secrets, telephony-secrets) -- needs ESO + Key Vault
#   - CronJob (conn-monitor) -- Tiger Cloud connection monitor; irrelevant locally
#   - livekit Ingress -- local livekit is accessed via k3d port-forward.
#
# The product public-entry ingresses + ClusterIssuer and the product bff/SPA
# workloads no longer live in the engine base (they moved to the downstream
# product pack), so this overlay no longer needs delete-patches for them.
#
# DRIFT-CHECK
# The CI drift-check (the scheduled drift job, now owned by the downstream
# product pack) enforces @sha256 pinning for every overlay.  That gate is
# skipped for the `local` overlay by design -- local images use mutable tags;
# the engine keeps the underlying scripts/deploy/drift-check.sh backend.
#
# See deploy/k8s/README.md for the full overlay taxonomy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - front-door.yaml
  - api-front-door.yaml
  - mcp-front-door.yaml
  - portal-front-door.yaml
  - edge-front-door.yaml
  - ../../base
  # Local-only infrastructure (absent in base and the cloud overlay)
  - azurite.yaml

# ---------------------------------------------------------------------------
# Remove cloud-only resources
# ---------------------------------------------------------------------------
patches:

  # Front door backend wiring: identity serves TLS in-cluster (internal CA),
  # so traefik must proxy https and skip verification (ServersTransport in
  # front-door.yaml). These are SERVICE-level traefik annotations.
  - target: { kind: Service, name: identity }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: identity
        namespace: memql
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.serverstransport: memql-internal-ca-skip-verify@kubernetescrd
  # API front door backend: the bff serves PLAINTEXT gRPC (:50051), so
  # traefik must forward HTTP/2 cleartext (h2c) -- the local analog of the cloud
  # nginx `backend-protocol: GRPC`. LOCAL only (cloud fronts bff with nginx).
  - target: { kind: Service, name: bff }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: bff
        namespace: memql
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: h2c
  # ExternalSecret resources require External Secrets Operator + Azure Key Vault.
  # Not available locally; the corresponding secrets are created directly via
  # `make secrets` in the local bootstrap (#2065).
  - target:
      kind: ExternalSecret
      name: livekit-secrets
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: livekit-secrets
  - target:
      kind: ExternalSecret
      name: telephony-secrets
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: telephony-secrets
  # Connection-budget CronJob monitors Tiger Cloud connection headroom.
  # Locally we run a plain Postgres container; the monitor is irrelevant.
  - target:
      kind: CronJob
      name: conn-monitor
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: conn-monitor
  # livekit Ingress (in livekit.yaml) -- requires ingress-nginx + cert-manager
  # on AKS.  Locally livekit is reached via k3d port-forward (#2065).
  - target:
      kind: Ingress
      name: livekit
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: livekit
  # ---------------------------------------------------------------------------
  # LiveKit Cloud for local dev (Epic #2184 / #2186)
  # ---------------------------------------------------------------------------
  # The local dev loop uses a LiveKit Cloud project as the SIP + WebRTC media
  # plane -- there is NO self-hosted livekit-server / livekit/sip / coordination
  # Redis locally (Cloud's TURN handles NAT, so no coturn/ngrok either). Remove
  # those base workloads, then repoint the LiveKit URL env on voice / voice-agent
  # / bff at the cloud project. The URL + key/secret are sourced from the
  # livekit-secrets Secret that seed-secrets.sh fills from the operator's
  # environment (LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET) -- NEVER
  # hard-coded. The cloud stays self-hosted and pulls these from ESO/Key Vault;
  # the no-cloud-leak guard (deploy/k8s/overlays/livekit_cloud_guard_test.go)
  # fails CI if a *.livekit.cloud reference ever lands in the cloud overlay or
  # in deploy/k8s/base. This overlay is deliberately out of its scope.
  #
  # Remove the self-hosted media-plane workloads (livekit-server + SIP edge +
  # the LiveKit<->SIP coordination Redis).
  - target: { kind: Deployment, name: livekit }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: livekit }
  - target: { kind: Service, name: livekit }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit }
  - target: { kind: Service, name: livekit-rtc }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit-rtc }
  - target: { kind: ConfigMap, name: livekit-config }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: livekit-config }
  - target: { kind: Deployment, name: livekit-sip }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: livekit-sip }
  - target: { kind: Service, name: livekit-sip }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit-sip }
  - target: { kind: ConfigMap, name: livekit-sip-config }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: livekit-sip-config }
  - target: { kind: Deployment, name: livekit-redis }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: livekit-redis }
  - target: { kind: Service, name: livekit-redis }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit-redis }
  # NOTE: the product SPA and the product `bff` workloads (Deployments,
  # Services, PodDisruptionBudget) are not in the engine base -- they live in the
  # downstream product overlay (bff is a plain engine node running the product via
  # the runtime dsl-bundle mount at MEMQL_DSL_PATH) -- so this overlay does not
  # delete them.
  # Repoint the LiveKit URL env at the cloud project (secret-sourced). The
  # `value: null` strategic-merge directive deletes the base's hard-coded
  # ws://livekit:7880 so valueFrom is the only source.
  - target: { kind: Deployment, name: voice-agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: voice-agent, namespace: memql }
      spec:
        template:
          spec:
            containers:
              - name: voice-agent
                env:
                  - name: LIVEKIT_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: LIVEKIT_URL }
                  # The avatar vendor (cloud) joins the room over a publicly-
                  # reachable URL -- the cloud project URL on the local path.
                  - name: LIVEKIT_PUBLIC_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: MEMQL_POLYPHON_LIVEKIT_PUBLIC_URL }
  - target: { kind: Deployment, name: voice }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: voice, namespace: memql }
      spec:
        template:
          spec:
            containers:
              - name: voice
                env:
                  - name: MEMQL_POLYPHON_LIVEKIT_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: MEMQL_POLYPHON_LIVEKIT_URL }
                  - name: MEMQL_POLYPHON_LIVEKIT_PUBLIC_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: MEMQL_POLYPHON_LIVEKIT_PUBLIC_URL }
  # ---------------------------------------------------------------------------
  # Replicas: 1 per app node (multi-node is a separate opt-in via #2067)
  # ---------------------------------------------------------------------------
  - target:
      kind: Deployment
      name: identity
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: cognition
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: voice
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: agent
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: planner
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: workbench
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: mcp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: edge
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # ---------------------------------------------------------------------------
  # imagePullPolicy: IfNotPresent for all ACR images
  # Locally-built images are imported via `k3d image import` -- they exist in
  # the containerd store but are not in ACR.  Never, Always would cause a pull
  # attempt that fails without ACR credentials.
  # ---------------------------------------------------------------------------
  - target:
      kind: Deployment
      name: identity
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: cognition
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: voice
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: agent
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: planner
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: workbench
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: mcp
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: edge
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: voice-agent
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # ---------------------------------------------------------------------------
  # The domain, delivered once (memql#3593)
  #
  # Every node's expected issuer used to be pinned here, eight times, each a
  # separate copy of one fact -- and identity's own base URL, bootstrap domain,
  # discovery endpoint, CORS origins and OAuth redirect URIs were pinned again
  # in its patch. They are all DERIVED now, from the single MEMQL_DOMAIN key of
  # the memql-domain ConfigMap, by component/envregistry/domain.go at boot. This
  # overlay states the RELATIONSHIP and never the value, which is why no file
  # under deploy/ names a domain any more except the two Ingress hosts.
  #
  # TWO PATCHES, because they need different mechanisms:
  #   - envFrom has no merge key, so the ConfigMap reference must be APPENDED
  #     with JSON 6902 or a strategic merge would replace the whole list (and
  #     with it memql-secrets);
  #   - an explicit `env` entry BEATS envFrom in Kubernetes regardless of order,
  #     so the base's placeholder issuer must be REMOVED or the ConfigMap is
  #     mounted and ignored, and the mesh rejects every node token with
  #     "invalid issuer" while everything looks correctly configured.
  #
  # Neither patch names a domain.
  # ---------------------------------------------------------------------------
  - path: patches/domain-envfrom.yaml
    target:
      kind: Deployment
      name: "^(identity|bff|cognition|agent|planner|workbench|mcp|voice|voice-agent|edge)$"
  - target: { kind: Deployment, name: identity }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: identity
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: identity
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
                  # ALL SIX, not just the issuer (memql#3600). The base sets
                  # every one of these to a staging placeholder, and an explicit
                  # env entry beats envFrom -- so leaving any of them in place
                  # means the derivation never runs for it and identity serves a
                  # domain nothing resolves. That is not hypothetical: the first
                  # install after memql#3593 produced a magic link at
                  # https://identity.staging.example.com, which nobody can click,
                  # so no owner account was ever created and the cluster could
                  # not be signed into at all.
                  - name: MEMQL_IDENTITY_BASE_URL
                    $patch: delete
                  - name: MEMQL_IDENTITY_BOOTSTRAP_DOMAIN
                    $patch: delete
                  - name: MEMQL_DISCOVERY_GRPC_ENDPOINT
                    $patch: delete
                  - name: MEMQL_IDENTITY_CORS_ALLOWED_ORIGINS
                    $patch: delete
                  - name: MEMQL_IDENTITY_REGISTERED_CLIENTS
                    $patch: delete
  - target: { kind: Deployment, name: bff }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bff
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: bff
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: cognition }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cognition
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: cognition
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: planner }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: planner
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: planner
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: workbench }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: mcp }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: mcp
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: voice }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: voice
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: voice
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: voice-agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: voice-agent
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: voice-agent
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  - target: { kind: Deployment, name: edge }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edge
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: edge
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    $patch: delete
  # identity-specific local overrides that carry NO domain: the vite dev-server
  # origins and running migrations on start.
  - path: patches/identity-local-config.yaml
    target:
      kind: Deployment
      name: identity
  # Installer-seeded bootstrap values (#3375): the MEMQL_IDENTITY_BOOTSTRAP_*
  # set that lets identity create the cluster owner with no /setup visit, plus
  # the AI provider key the rest of the mesh reads. Seeded by
  # scripts/install/seed-bootstrap.sh, `optional: true` so a cluster brought up
  # without the installer behaves exactly as it does today. Targeted by name
  # regex at the engine nodes that carry an envFrom list.
  - path: patches/bootstrap-secret-envfrom.yaml
    target:
      kind: Deployment
      name: "^(identity|bff|cognition|agent|planner|workbench|mcp|voice|voice-agent|edge)$"
  # Override the Postgres pool bounds (base is tuned for Tiger Cloud limits;
  # local in-cluster Postgres can handle larger pools).
  - path: patches/db-pool-local.yaml
    target:
      kind: ConfigMap
      name: memql-db-pool

  # -------------------------------------------------------------------------
  # DATABASE -- local VALUES over the cnpg-db component (memql#3846 / #3851)
  # -------------------------------------------------------------------------
  # Everything below is a number or an endpoint. The SHAPE -- four resources,
  # the preloaded library, the plugin archiver, the declared extensions -- comes
  # from the component and is identical in staging, production and every tenant.
  - target: { kind: Cluster, name: memql-db }
    patch: |
      # k3d imports the image into containerd; nothing pushes it to a registry.
      - { op: add, path: /spec/imagePullPolicy, value: IfNotPresent }
      # Laptop-sized. The component's defaults are already the smallest sane
      # shape, so these differ only in storage.
      - { op: replace, path: /spec/storage/size, value: 10Gi }
      - { op: replace, path: /spec/walStorage/size, value: 2Gi }

  - target: { kind: ObjectStore, name: memql-db-backup }
    patch: |
      # AN EMULATOR DESTINATION IS A FULL HTTP URL INCLUDING THE ACCOUNT, not
      # the `azure://<container>/` form staging uses against real Blob. barman
      # refuses the scheme form here outright --
      #   "emulated storage URL azure://memql-db-backups/ is malformed"
      # -- and it surfaces as ContinuousArchivingFailing on a Cluster that still
      # reports Ready, with an exit status naming neither the URL nor the shape.
      # This is a property of Azurite, not of the environment, which is why it
      # is the one line where local's value differs in kind rather than degree.
      - op: replace
        path: /spec/configuration/destinationPath
        value: "http://azurite:10000/devstoreaccount1/memql-db-backups"
      # A week, not thirty days: local is a rehearsal of the mechanism, not an
      # archive.
      - { op: replace, path: /spec/retentionPolicy, value: "7d" }

# ---------------------------------------------------------------------------
# Image tags for local builds
# Local images are built with `make dev-build` and imported into k3d.
# The `local` tag is mutable and updated by `make dev` (#2066).
# NO @sha256 digest here -- that is intentional and exempted from CI gate.
# ---------------------------------------------------------------------------
images:
  # The database operand image, built by `make db-image` and imported into k3d.
  # The tag MUST start with the PostgreSQL major -- CNPG parses it off
  # spec.imageName and refuses what it cannot read (deploy/db-image/README.md).
  - name: memql-db
    newName: memql-db
    newTag: 16-dev
  - name: acrmemql.azurecr.io/memql-bff
    newName: memql-bff
    newTag: local
  - name: acrmemql.azurecr.io/memql-identity
    newName: memql-identity
    newTag: local
  - name: acrmemql.azurecr.io/memql-cognition
    newName: memql-cognition
    newTag: local
  - name: acrmemql.azurecr.io/memql-voice
    newName: memql-voice
    newTag: local
  - name: acrmemql.azurecr.io/memql-agent
    newName: memql-agent
    newTag: local
  - name: acrmemql.azurecr.io/memql-planner
    newName: memql-planner
    newTag: local
  - name: acrmemql.azurecr.io/memql-workbench
    newName: memql-workbench
    newTag: local
  - name: acrmemql.azurecr.io/memql-mcp
    newName: memql-mcp
    newTag: local
  - name: acrmemql.azurecr.io/memql-edge
    newName: memql-edge
    newTag: local

components:
  - ../../components/engine-bff
  # The database, as the SAME component staging, production and every tenant
  # deployment composes (epic memql#3842 / #3851). Local supplies its own values
  # rather than a tier preset: the presets describe what a customer buys, and a
  # developer laptop is not a tier -- entry alone would ask for 1 vCPU / 4 GiB
  # and 48 GiB of disk on a machine that also runs the whole mesh.
  - ../../components/cnpg-db
