# Local overlay -- k3d development (Epic 0, znasllc-io/memql#2064/#2065).
#
# PURPOSE
# This overlay runs the full memQL stack on a local k3d cluster via ArgoCD.
# It differs from staging/prod in three ways only:
#   1. Config -- local DB (in-cluster postgres + azurite blob), no Tiger Cloud.
#   2. Resources -- minimal requests; no limits set so developer laptops aren't
#      starved.
#   3. Replicas -- 1 per node type (multi-node is exercised via #2067).
#
# LOCAL INFRASTRUCTURE (defined here, absent in base)
#   - postgres.yaml      -- in-cluster Postgres+TimescaleDB (replaces Tiger Cloud)
#   - azurite.yaml       -- Azure Blob emulator (replaces Azure Blob Storage)
#   - db-pool-local.yaml -- looser pool bounds for local Postgres (not Tiger Cloud)
#
# SECRETS (created by `make secrets`, NOT committed)
#   - memql-secrets         -- main app envelope (genesis, DB DSN, blob conn string)
#   - livekit-secrets       -- LiveKit API key+secret for local livekit server
#   - telephony-secrets     -- stub (telephony disabled locally)
#   - memql-local-db-creds  -- Postgres credentials for the in-cluster DB
# See scripts/k3d/seed-secrets.sh for the creation logic.
#
# IMAGE AUTHORITY
# Unlike staging/prod, local images are NOT pinned by @sha256: digest.
# They are built locally by `make k3d-build` / the `make k3d-dev` inner loop
# (#2066) and imported into k3d via `k3d image import`.  The tag `local`
# is used; imagePullPolicy: IfNotPresent so the cluster never tries to pull
# from ACR (the dev machine may not have ACR credentials).
#
# CLOUD-ONLY RESOURCES EXCLUDED
# The base includes resources that require cloud infrastructure not present
# locally.  This overlay removes them with $patch: delete:
#   - ExternalSecret (livekit-secrets, telephony-secrets) -- needs ESO + Key Vault
#   - CronJob (conn-monitor) -- Tiger Cloud connection monitor; irrelevant locally
#   - public-entry.yaml resources (ClusterIssuer + Ingresses) -- cert-manager/
#     ingress-nginx on AKS.  Local ingress is handled separately in this overlay.
#   - livekit Ingress -- local livekit is accessed via k3d port-forward.
#
# DRIFT-CHECK
# The CI drift-check (deploy-drift.yml) enforces @sha256 pinning for every
# overlay.  That gate is skipped for the `local` overlay by design -- local
# images use mutable tags; see scripts/deploy/drift-check.sh.
#
# See deploy/k8s/README.md for the full overlay taxonomy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - front-door.yaml
  - identity-external.yaml
  - ../../base
  # Local-only infrastructure (absent in base/staging/prod)
  - postgres.yaml
  - azurite.yaml

# ---------------------------------------------------------------------------
# Remove cloud-only resources
# ---------------------------------------------------------------------------
patches:

  # Front door backend wiring: identity serves TLS in-cluster (internal CA),
  # so traefik must proxy https and skip verification (ServersTransport in
  # front-door.yaml). These are SERVICE-level traefik annotations.
  - target: { kind: Service, name: identity }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: identity
        namespace: memql
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.serverstransport: memql-internal-ca-skip-verify@kubernetescrd
  # ExternalSecret resources require External Secrets Operator + Azure Key Vault.
  # Not available locally; the corresponding secrets are created directly via
  # `make secrets` in the local bootstrap (#2065).
  - target:
      kind: ExternalSecret
      name: livekit-secrets
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: livekit-secrets
  - target:
      kind: ExternalSecret
      name: telephony-secrets
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: telephony-secrets
  # Connection-budget CronJob monitors Tiger Cloud connection headroom.
  # Locally we run a plain Postgres container; the monitor is irrelevant.
  - target:
      kind: CronJob
      name: conn-monitor
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: conn-monitor
  # public-entry.yaml: Let's Encrypt ClusterIssuer + AKS Ingresses.
  # Local traffic is served via k3d port-forward or a simple traefik
  # ingress configured in the bootstrap (#2063/#2065).
  - target:
      kind: ClusterIssuer
      name: letsencrypt-prod
    patch: |
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
  - target:
      kind: Ingress
      name: staging-identity
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: staging-identity
  - target:
      kind: Ingress
      name: app-main
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: app-main
  - target:
      kind: Ingress
      name: app-identity-proxy
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: app-identity-proxy
  - target:
      kind: Ingress
      name: staging-mcp
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: staging-mcp
  - target:
      kind: Ingress
      name: staging-bff-grpc
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: staging-bff-grpc
  # livekit Ingress (in livekit.yaml) -- requires ingress-nginx + cert-manager
  # on AKS.  Locally livekit is reached via k3d port-forward (#2065).
  - target:
      kind: Ingress
      name: livekit
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: livekit
  # ---------------------------------------------------------------------------
  # LiveKit Cloud for local dev (Epic #2184 / #2186)
  # ---------------------------------------------------------------------------
  # The local dev loop uses a LiveKit Cloud project as the SIP + WebRTC media
  # plane -- there is NO self-hosted livekit-server / livekit/sip / coordination
  # Redis locally (Cloud's TURN handles NAT, so no coturn/ngrok either). Remove
  # those base workloads, then repoint the LiveKit URL env on voice / voice-agent
  # / bff at the cloud project. The URL + key/secret are sourced from the
  # livekit-secrets Secret that seed-secrets.sh fills from the operator's
  # environment (LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET) -- NEVER
  # hard-coded. Staging/prod stay self-hosted and pull these from ESO/Key Vault;
  # the no-cloud-leak guard (scripts/deploy/livekit_cloud_guard_test.go) fails
  # CI if a *.livekit.cloud reference ever lands in a staging/prod overlay.
  #
  # Remove the self-hosted media-plane workloads (livekit-server + SIP edge +
  # the LiveKit<->SIP coordination Redis).
  - target: { kind: Deployment, name: livekit }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: livekit }
  - target: { kind: Service, name: livekit }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit }
  - target: { kind: Service, name: livekit-rtc }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit-rtc }
  - target: { kind: ConfigMap, name: livekit-config }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: livekit-config }
  - target: { kind: Deployment, name: livekit-sip }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: livekit-sip }
  - target: { kind: Service, name: livekit-sip }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit-sip }
  - target: { kind: ConfigMap, name: livekit-sip-config }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: livekit-sip-config }
  - target: { kind: Deployment, name: livekit-redis }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: livekit-redis }
  - target: { kind: Service, name: livekit-redis }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: livekit-redis }
  # ---------------------------------------------------------------------------
  # CoPresent (SPA + bff carrier) -- NOT part of the engine repo (#2204)
  # ---------------------------------------------------------------------------
  # The `copresent` SPA and the `bff` (memql-bff-copresent carrier) are built
  # and version-pinned from their OWN sibling repos, not from this engine repo,
  # so they cannot be built by the local inner loop (`make dev`) and have no
  # business coming up on `make up`. They live in base/ because staging/prod
  # legitimately run them; the engine's local overlay deletes them. Remove the
  # bff Deployment + its two Services (cluster `bff` + `bff-external`
  # LoadBalancer) and the copresent Deployment + Service + PodDisruptionBudget.
  # The matching public-entry Ingresses are already deleted above.
  - target: { kind: Deployment, name: bff }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: bff }
  - target: { kind: Service, name: bff }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: bff }
  - target: { kind: Service, name: bff-external }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: bff-external }
  - target: { kind: Deployment, name: copresent }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: copresent }
  - target: { kind: Service, name: copresent }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: copresent }
  - target: { kind: PodDisruptionBudget, name: copresent }
    patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: { name: copresent }
  # Repoint the LiveKit URL env at the cloud project (secret-sourced). The
  # `value: null` strategic-merge directive deletes the base's hard-coded
  # ws://livekit:7880 so valueFrom is the only source. (bff is deleted from the
  # local overlay -- see the CoPresent delete block above -- so it carries no
  # local LiveKit repoint.)
  - target: { kind: Deployment, name: voice-agent }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: voice-agent, namespace: memql }
      spec:
        template:
          spec:
            containers:
              - name: voice-agent
                env:
                  - name: LIVEKIT_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: LIVEKIT_URL }
                  # The avatar vendor (cloud) joins the room over a publicly-
                  # reachable URL -- the cloud project URL on the local path.
                  - name: LIVEKIT_PUBLIC_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: MEMQL_POLYPHON_LIVEKIT_PUBLIC_URL }
  - target: { kind: Deployment, name: voice }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: voice, namespace: memql }
      spec:
        template:
          spec:
            containers:
              - name: voice
                env:
                  - name: MEMQL_POLYPHON_LIVEKIT_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: MEMQL_POLYPHON_LIVEKIT_URL }
                  - name: MEMQL_POLYPHON_LIVEKIT_PUBLIC_URL
                    value: null
                    valueFrom:
                      secretKeyRef: { name: livekit-secrets, key: MEMQL_POLYPHON_LIVEKIT_PUBLIC_URL }
  # ---------------------------------------------------------------------------
  # Replicas: 1 per app node (multi-node is a separate opt-in via #2067)
  # ---------------------------------------------------------------------------
  - target:
      kind: Deployment
      name: identity
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: cognition
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: voice
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: agent
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: planner
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: workbench
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: mcp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # ---------------------------------------------------------------------------
  # imagePullPolicy: IfNotPresent for all ACR images
  # Locally-built images are imported via `k3d image import` -- they exist in
  # the containerd store but are not in ACR.  Never, Always would cause a pull
  # attempt that fails without ACR credentials.
  # ---------------------------------------------------------------------------
  - target:
      kind: Deployment
      name: identity
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: cognition
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: voice
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: agent
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: planner
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: workbench
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: mcp
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: voice-agent
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # ---------------------------------------------------------------------------
  # Local environment config (staging URLs -> localhost)
  # All engine nodes carry MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER pointing at the
  # staging identity host (identity.staging.copresent.ai). This must match
  # what identity ISSUES in JWTs (MEMQL_IDENTITY_BASE_URL). Locally we set
  # MEMQL_IDENTITY_BASE_URL=http://localhost:8085, so all verifiers must also expect
  # http://localhost:8085. Each node patched individually (strategic merge).
  # ---------------------------------------------------------------------------
  # identity-specific overrides: URL, CORS, OAuth clients, migrations, issuer.
  - path: patches/identity-local-config.yaml
    target:
      kind: Deployment
      name: identity
  # Worker nodes: override MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER to the local
  # identity issuer (must be byte-identical to identity's BASE_URL above).
  # Using JSON 6902 `add` (with merge semantics for existing keys in env) is
  # not directly supported, so we use a strategic-merge patch as inline YAML.
  # The env entries below use the strategic merge key (env.name) to replace
  # the matching named entry without touching the rest of the env array.
  - target:
      kind: Deployment
      name: cognition
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cognition
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: cognition
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    value: "https://identity.local.znas.io"
  - target:
      kind: Deployment
      name: voice
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: voice
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: voice
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    value: "https://identity.local.znas.io"
  - target:
      kind: Deployment
      name: agent
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: agent
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    value: "https://identity.local.znas.io"
  - target:
      kind: Deployment
      name: planner
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: planner
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: planner
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    value: "https://identity.local.znas.io"
  - target:
      kind: Deployment
      name: workbench
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: workbench
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: workbench
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    value: "https://identity.local.znas.io"
  - target:
      kind: Deployment
      name: mcp
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: mcp
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    value: "https://identity.local.znas.io"
  - target:
      kind: Deployment
      name: voice-agent
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: voice-agent
        namespace: memql
      spec:
        template:
          spec:
            containers:
              - name: voice-agent
                env:
                  - name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER
                    value: "https://identity.local.znas.io"
  # Override the Postgres pool bounds (base is tuned for Tiger Cloud limits;
  # local in-cluster Postgres can handle larger pools).
  - path: patches/db-pool-local.yaml
    target:
      kind: ConfigMap
      name: memql-db-pool

# ---------------------------------------------------------------------------
# Image tags for local builds
# Local images are built with `make dev-build` and imported into k3d.
# The `local` tag is mutable and updated by `make dev` (#2066).
# NO @sha256 digest here -- that is intentional and exempted from CI gate.
# ---------------------------------------------------------------------------
images:
  - name: acrmemql.azurecr.io/memql-identity
    newName: memql-identity
    newTag: local
  - name: acrmemql.azurecr.io/memql-cognition
    newName: memql-cognition
    newTag: local
  - name: acrmemql.azurecr.io/memql-voice
    newName: memql-voice
    newTag: local
  - name: acrmemql.azurecr.io/memql-agent
    newName: memql-agent
    newTag: local
  - name: acrmemql.azurecr.io/memql-planner
    newName: memql-planner
    newTag: local
  - name: acrmemql.azurecr.io/memql-workbench
    newName: memql-workbench
    newTag: local
  - name: acrmemql.azurecr.io/memql-mcp
    newName: memql-mcp
    newTag: local
