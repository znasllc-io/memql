# Local overlay -- k3d development (Epic 0, znasllc-io/memql#2064/#2065).
#
# PURPOSE
# This overlay runs the full MemQL stack on a local k3d cluster via ArgoCD.
# It differs from the cloud overlay in three ways only:
#   1. Config -- local DB (in-cluster CNPG Cluster + azurite blob), no Tiger Cloud.
#   2. Resources -- minimal requests; no limits set so developer laptops aren't
#      starved.
#   3. Replicas -- 1 per node type (multi-node is exercised via #2067).
#
# LOCAL INFRASTRUCTURE (defined here, absent in base)
#   - azurite.yaml       -- Azure Blob emulator (replaces Azure Blob Storage),
#                           and now also the backup destination the database's
#                           ObjectStore archives WAL and base backups to
#   - db-pool-local.yaml -- looser pool bounds for local Postgres (not Tiger Cloud)
#
# THE DATABASE IS A COMPONENT, not a local manifest (epic memql#3842 /
# #3846 / #3851). `components: ../../components/cnpg-db` brings the same four
# resources -- Cluster, Database, ObjectStore, ScheduledBackup -- that the cloud
# production and every tenant deployment compose; the patches further down
# supply local's VALUES (10Gi, Azurite, a 7-day retention). It replaced a
# hand-rolled `postgres` Deployment that was the one place the parity doctrine
# bent: no operator, no WAL archiving, no backups.
#
# SECRETS (created by `make secrets`, NOT committed)
#   - memql-secrets      -- the one config delivery path: master key, identity
#                          signing seed, node bootstrap token, DB DSNs, blob
#                          connection string (epic memql#3958)
#   - memql-db-app-creds -- Postgres credentials for the in-cluster DB. A
#                           kubernetes.io/basic-auth Secret (username /
#                           password), which is the shape CNPG's
#                           bootstrap.initdb.secret reads. The NAME is the
#                           component's contract -- local seeds it here, the
#                           cloud syncs it from Key Vault through ESO.
# See scripts/k3d/seed-secrets.sh for the creation logic.
#
# IMAGE AUTHORITY
# Unlike the cloud overlay, local images are NOT pinned by @sha256: digest.
# They are built locally by `make k3d-build` / the `make k3d-dev` inner loop
# (#2066) and imported into k3d via `k3d image import`.  The tag `local`
# is used; imagePullPolicy: IfNotPresent so the cluster never tries to pull
# from ACR (the dev machine may not have ACR credentials).
#
# CLOUD-ONLY RESOURCES EXCLUDED
# The base includes resources that require cloud infrastructure not present
# locally.  This overlay removes them with $patch: delete:
#   - CronJob (conn-monitor) -- Tiger Cloud connection monitor; irrelevant locally
#
# The product public-entry ingresses + ClusterIssuer and the product bff/SPA
# workloads no longer live in the engine base (they moved to the downstream
# product pack), so this overlay no longer needs delete-patches for them.
#
# DRIFT-CHECK
# The CI drift-check (the scheduled drift job, now owned by the downstream
# product pack) enforces @sha256 pinning for every overlay.  That gate is
# skipped for the `local` overlay by design -- local images use mutable tags;
# the engine keeps the underlying scripts/deploy/drift-check.sh backend.
#
# See deploy/k8s/README.md for the full overlay taxonomy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - front-door.yaml
  - api-front-door.yaml
  - mcp-front-door.yaml
  - os-front-door.yaml
  - edge-front-door.yaml
  - ../../base
  # Local-only infrastructure (absent in base and the cloud overlay)
  - azurite.yaml

# ---------------------------------------------------------------------------
# Remove cloud-only resources
# ---------------------------------------------------------------------------
patches:

  # Front door backend wiring: identity serves TLS in-cluster (internal CA),
  # so traefik must proxy https and skip verification (ServersTransport in
  # front-door.yaml). These are SERVICE-level traefik annotations.
  - target: { kind: Service, name: identity }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: identity
        namespace: memql
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.serverstransport: memql-internal-ca-skip-verify@kubernetescrd
  # API front door backend: the bff serves PLAINTEXT gRPC (:50051), so
  # traefik must forward HTTP/2 cleartext (h2c) -- the local analog of the cloud
  # nginx `backend-protocol: GRPC`. LOCAL only (cloud fronts bff with nginx).
  - target: { kind: Service, name: bff }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: bff
        namespace: memql
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: h2c
  # Connection-budget CronJob monitors Tiger Cloud connection headroom.
  # Locally we run a plain Postgres container; the monitor is irrelevant.
  - target:
      kind: CronJob
      name: conn-monitor
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: conn-monitor
  # NOTE: the product SPA and the product `bff` workloads (Deployments,
  # Services, PodDisruptionBudget) are not in the engine base -- they live in the
  # downstream product overlay (bff is a plain engine node running the product via
  # the runtime dsl-bundle mount at MEMQL_DSL_PATH) -- so this overlay does not
  # delete them.
  # ---------------------------------------------------------------------------
  # Replicas: 1 per app node (multi-node is a separate opt-in via #2067)
  # ---------------------------------------------------------------------------
  - target:
      kind: Deployment
      name: identity
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: agent
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: planner
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: workbench
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: mcp
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: edge
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # ---------------------------------------------------------------------------
  # imagePullPolicy: IfNotPresent for all ACR images
  # Locally-built images are imported via `k3d image import` -- they exist in
  # the containerd store but are not in ACR.  Never, Always would cause a pull
  # attempt that fails without ACR credentials.
  # ---------------------------------------------------------------------------
  - target:
      kind: Deployment
      name: identity
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: agent
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: planner
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: workbench
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: mcp
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: edge
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # ---------------------------------------------------------------------------
  # The domain, delivered once (memql#3593, memql#3600, memql#4281)
  #
  # Both halves -- appending the memql-domain ConfigMap to envFrom, and deleting
  # the base's pinned placeholders that would otherwise beat it -- now live
  # together in ../../components/domain-derive, listed at the bottom of this
  # file. They were 160 lines here, and this overlay was the only one that had
  # both: cloud-entry appended the ConfigMap and skipped the deletes, which is
  # the silent half. The component's header carries the memql#3600 incident this
  # overlay recorded -- a magic link at a domain nobody owns, so no owner account
  # was ever created and the cluster could not be signed into at all.
  #
  # WHAT SEEDS IT LOCALLY: scripts/k3d/seed-secrets.sh, from the --domain the
  # bring-up was given. Neither this overlay nor the component names a domain.
  # ---------------------------------------------------------------------------
  # identity-specific local overrides that carry NO domain: the vite dev-server
  # origins and running migrations on start.
  - path: patches/identity-local-config.yaml
    target:
      kind: Deployment
      name: identity
  # Installer-seeded bootstrap values (#3375): the MEMQL_IDENTITY_BOOTSTRAP_*
  # set that lets identity create the cluster owner with no /setup visit, plus
  # the AI provider key the rest of the mesh reads. Seeded by
  # scripts/install/seed-bootstrap.sh, `optional: true` so a cluster brought up
  # without the installer behaves exactly as it does today. Targeted by name
  # regex at the engine nodes that carry an envFrom list.
  - path: patches/bootstrap-secret-envfrom.yaml
    target:
      kind: Deployment
      name: "^(identity|bff|agent|planner|workbench|mcp|edge)$"
  # Override the Postgres pool bounds (base is tuned for Tiger Cloud limits;
  # local in-cluster Postgres can handle larger pools).
  - path: patches/db-pool-local.yaml
    target:
      kind: ConfigMap
      name: memql-db-pool
  # Blob storage against the in-cluster Azurite (memql#4843): the container
  # name and the autocreate flag -- the two values the secret cannot carry.
  # bff serves the Library artifact routes; agent shares the attachment route.
  - path: patches/blob-storage-local.yaml
    target:
      kind: Deployment
      name: "^(bff|agent)$"

  # -------------------------------------------------------------------------
  # DATABASE -- local VALUES over the cnpg-db component (memql#3846 / #3851)
  # -------------------------------------------------------------------------
  # Everything below is a number or an endpoint. The SHAPE -- four resources,
  # the preloaded library, the plugin archiver, the declared extensions -- comes
  # from the component and is identical in staging, production and every tenant.
  - target: { kind: Cluster, name: memql-db }
    patch: |
      # k3d imports the image into containerd; nothing pushes it to a registry.
      - { op: add, path: /spec/imagePullPolicy, value: IfNotPresent }
      # Laptop-sized. The component's defaults are already the smallest sane
      # shape, so these differ only in storage.
      - { op: replace, path: /spec/storage/size, value: 10Gi }
      - { op: replace, path: /spec/walStorage/size, value: 2Gi }

  - target: { kind: ObjectStore, name: memql-db-backup }
    patch: |
      # EVERY DESTINATION NAMES THE ACCOUNT; only the SPELLING differs between
      # an emulator and a real account:
      #
      #   Azurite (here)    http://azurite:10000/<account>/<container>
      #   real Azure Blob   https://<account>.blob.core.windows.net/<container>/
      #
      # This comment used to describe `azure://<container>/` as "the form
      # staging uses against real Blob". IT IS NOT A VALID FORM ANYWHERE, and
      # believing it was is memql#4460: barman decides real-vs-emulated from the
      # HOST alone, so a bare container host sends a real Azure account down the
      # emulator path, where it then demands a connection string that workload
      # identity does not supply. Here that same bare form fails one step later
      # and more loudly, because local DOES supply a connection string, so
      # barman gets past the credential check and into the path split:
      #   "emulated storage URL azure://memql-db-backups/ is malformed"
      # Both surface as ContinuousArchivingFailing on a Cluster that still
      # reports Ready, with an exit status naming neither the URL nor the shape.
      #
      # So local's value differs from the cloud's in SPELLING, not in kind --
      # and it is the connection string, not the URL, that makes the emulator
      # path work at all.
      - op: replace
        path: /spec/configuration/destinationPath
        value: "http://azurite:10000/devstoreaccount1/memql-db-backups"
      # A week, not thirty days: local is a rehearsal of the mechanism, not an
      # archive.
      - { op: replace, path: /spec/retentionPolicy, value: "7d" }

# ---------------------------------------------------------------------------
# Image tags for local builds
# Local images are built with `make dev-build` and imported into k3d.
# The `local` tag is mutable and updated by `make dev` (#2066).
# NO @sha256 digest here -- that is intentional and exempted from CI gate.
# ---------------------------------------------------------------------------
images:
  # The database operand image, built by `make db-image` and imported into k3d.
  # The tag MUST start with the PostgreSQL major -- CNPG parses it off
  # spec.imageName and refuses what it cannot read (deploy/db-image/README.md).
  - name: memql-db
    newName: memql-db
    newTag: 16-dev
  - name: acrmemql.azurecr.io/memql-bff
    newName: memql-bff
    newTag: local
  - name: acrmemql.azurecr.io/memql-identity
    newName: memql-identity
    newTag: local
  - name: acrmemql.azurecr.io/memql-agent
    newName: memql-agent
    newTag: local
  - name: acrmemql.azurecr.io/memql-planner
    newName: memql-planner
    newTag: local
  - name: acrmemql.azurecr.io/memql-workbench
    newName: memql-workbench
    newTag: local
  - name: acrmemql.azurecr.io/memql-mcp
    newName: memql-mcp
    newTag: local
  - name: acrmemql.azurecr.io/memql-edge
    newName: memql-edge
    newTag: local

components:
  - ../../components/engine-bff
  # THE DOMAIN, both halves (memql#4281). Must follow engine-bff, which
  # adds the `bff` Deployment this patches; components apply in order.
  - ../../components/domain-derive
  # The database, as the SAME component every install and every tenant
  # deployment composes (epic memql#3842 / #3851). Local supplies its own values
  # rather than a tier preset: the presets describe what a customer buys, and a
  # developer laptop is not a tier -- entry alone would ask for 1 vCPU / 4 GiB
  # and 48 GiB of disk on a machine that also runs the whole mesh.
  - ../../components/cnpg-db
