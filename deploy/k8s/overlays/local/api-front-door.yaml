# The API front door. One host, two backends -- the constraint that shapes
# this file is that an ingress controller's backend protocol is a per-SERVICE
# setting, which is why `bff` and `bff-http` exist as two Services over one
# Deployment (see deploy/k8s/components/engine-bff/bff.yaml).
#
# THE HTTP PATH LIST IS GENERATED, NOT AUTHORED. `make frontdoor-paths` emits
# it from component/server's own path declarations; `make frontdoor-paths-check`
# fails CI when the two disagree. Hand-editing the block below will be reverted
# by the generator. The reason is memql's own history: /inbound/{source} and
# /unsubscribe are documented public HTTP exceptions that third parties dial,
# and NO overlay in this repo routed either one -- a missing rule does not 404,
# it hands an HTTP/1.1 request to an h2c backend.
#
# The derivation is per-ROUTE, not per-authentication-tier, and that is
# load-bearing. PublicPaths() + HandlerAuthorizedPaths() +
# SelfAuthenticatedPaths() answer "who may reach this without a bearer" -- an
# AUTHENTICATED HTTP route appears in none of them, which is how /spaces/
# (multipart attachment upload), /polyphon/room-token and /polyphon/status came
# to be served by the bff and routed by nothing. cmd/frontdoorpaths unions the
# aggregates AND every per-route declaration a bff-tagged build mounts; its
# package comment carries the full reasoning and the exhaustiveness gate that
# makes a new declaration break the build rather than go unrouted.
#
# AND SOME PATHS THE BFF SERVES ARE DELIBERATELY WITHHELD from this block, which
# is the half a reader is most likely to mistake for an omission. /metrics and
# /api/concepts* are served here and are in PublicPaths(), so the verifier
# bypasses them -- routing them would not cost a 404, it would publish an
# unauthenticated endpoint at the front door. /metrics is unauthenticated
# BECAUSE it is in-cluster-only; nothing dials /api/concepts* over HTTP at all
# (every consumer reads the registry over gRPC). They are classified
# servedButNotExternallyRouted in the generator and a test fails if either
# reappears here. Adding a rule for one by hand is not a fix, it is an exposure.
#
# THE HOSTNAME IS A COMMITTED DEFAULT, NOT A CONSTANT (memql#3593). An install
# choosing another domain overrides it through the ArgoCD Application's
# spec.source.kustomize.patches, emitted by scripts/k3d/up.sh. The default is
# committed so that a plain `kubectl apply -k` still produces a working front
# door, and so that the common case carries no generated YAML at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-front-door
  namespace: memql
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: ["api.memql.localhost"]
      secretName: memql-front-door-tls
  rules:
    - host: api.memql.localhost
      http:
        paths:
          # BEGIN generated bff HTTP paths -- make frontdoor-paths
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /.well-known/memql-config.json
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /polyphon/room-token
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /automations/resume
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /polyphon/status
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /auth/callback
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /auth/exchange
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /auth/landing
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /automations/
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /auth/logout
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /memql/query
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /unsubscribe
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /auth/login
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /inbound/
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /memql/ws
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /portal/
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /spaces/
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /sites/
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /livez
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          # END generated bff HTTP paths
          #
          # The h2c catch-all, and the ONE rule below the markers that is not
          # generated. Everything the bff serves over gRPC arrives here, so it
          # must stay LAST: it prefixes every absolute path, and an ingress that
          # matched it first would send the whole HTTP surface to :50051.
          #
          # The three explicit rules that used to sit here -- /portal,
          # /memql/ws and /healthz -- are gone (memql#3703). They were placed by
          # memql#3702 to keep two inherited routes working while the generated
          # block was still empty, and all three now come out of the generator:
          # /healthz via HealthzPaths(), /portal/ via PortalPaths() and
          # /memql/ws via HandlerAuthorizedPaths(). Keeping them would be
          # duplicate routing. Note that the generated spelling of the portal
          # prefix carries a trailing slash, which is the correct one -- see
          # component/server/nethttp.go's PortalPaths.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 50051
