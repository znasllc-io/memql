# Turn OFF genesis autoload on the local cluster (znasllc-io/memql#3580).
#
# WHY IT IS ON IN THE BASE. In staging and prod the genesis envelope IS the
# delivery mechanism: ESO pulls it from Key Vault and every node decrypts it
# into its own environment. `MEMQL_GENESIS_AUTOLOAD=true` there is correct and
# stays correct.
#
# WHY IT IS WRONG LOCALLY. scripts/k3d/seed-secrets.sh seeds those same values
# into `memql-secrets` DIRECTLY -- the master key, the identity signing seed,
# the database DSN, the blob connection string -- and every node reads that
# Secret through envFrom. The envelope would deliver a second copy of what is
# already there.
#
# Meanwhile the envelope is authored BY HAND: `memql-cockpit genesis init`
# writes ~/.memql/genesis.znas, which a developer has run once and an operator
# installing a cluster has never heard of. With autoload on and no envelope,
# every node carrying the flag exits at boot:
#
#   genesis autoload: MEMQL_GENESIS_AUTOLOAD=true but no envelope source:
#   MEMQL_GENESIS_B64 is empty and /root/.memql/genesis.znas does not exist
#
# So an install produced a cluster in which nothing could start -- and `make up`
# did the same for any developer who had not run the cockpit wizard.
#
# THIS IS A VALUE, NOT A SHAPE. Same manifests, same topology, same sync path;
# one variable differs because the two environments deliver the same secrets by
# different means, which is the line docs/public/operate/environment-parity.md
# draws.
#
# A STRATEGIC MERGE keyed on the container and variable NAMES, not a JSON 6902
# index: the flag sits at a different position in every node's env list, so an
# index would be right for one file and quietly wrong for the next.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: memql
  name: identity
spec:
  template:
    spec:
      containers:
        - name: identity
          env:
            - name: MEMQL_GENESIS_AUTOLOAD
              value: "false"
---
