# JSON 6902 patch: which workloads a DSL-carrying package deploy RESTARTS.
#
# The last stage of such a deploy is the roll: the engine patches each workload
# named here so the nodes pick up the newly-staged tree. UNSET MEANS THE ROLL
# REFUSES -- "this cluster names no workloads to roll" -- and it refuses AFTER
# the active-set pointer has already moved, so the cluster is left serving the
# old trees under a new pointer.
#
# THREE LISTS MUST AGREE and nothing can check it: this value, the
# `memql/product-dsl` label set in ../dsl-nodes, and the packages-roll-rbac
# Role's resourceNames. A name here and not in the Role is a 403 at the roll; a
# name in the Role and not here is a permission nobody uses.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MEMQL_PACKAGES_ROLL_TARGETS
    value: bff,agent,planner,workbench
