# JSON 6902 patch: mount the installer-seeded `memql-bootstrap` Secret as env on
# every engine node (znasllc-io/memql#3375).
#
# WHAT SEEDS IT: scripts/install/seed-bootstrap.sh (capability
# install.seedBootstrap), run by the install graph immediately after the cluster
# comes up and before the operator ever looks at it. The Secret carries the
# MEMQL_IDENTITY_BOOTSTRAP_* set identity needs to create the cluster owner
# without a /setup visit, plus the AI provider key the rest of the mesh needs to
# do anything once that owner signs in.
#
# WHY APPEND RATHER THAN A STRATEGIC MERGE: `envFrom` has no patch merge key, so
# a strategic-merge patch REPLACES the whole list -- which would silently drop
# `memql-secrets` (the master key, the genesis envelope, the database DSN) from
# every node it touched. `add` at `envFrom/-` appends, leaving the existing
# entry alone.
#
# WHY optional: true: the Secret is created by the INSTALLER, not by kustomize,
# so it does not exist during a plain `make up` on a machine that never ran the
# installer. Without `optional` every pod would sit in CreateContainerConfigError
# waiting for a Secret that is not coming. With it, an un-seeded cluster behaves
# exactly as it does today (the operator completes /setup by hand) and a seeded
# one self-bootstraps.
#
# ORDER MATTERS: this entry comes AFTER memql-secrets, so a key present in both
# resolves to the bootstrap value -- the installer's inputs are the more
# specific statement of intent.
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: memql-bootstrap
      optional: true
