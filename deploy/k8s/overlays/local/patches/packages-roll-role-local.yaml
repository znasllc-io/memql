# The roll Role's resourceNames must EQUAL MEMQL_PACKAGES_ROLL_TARGETS.
#
# The component ships agent, bff, planner -- the set its own header calls "the
# mesh node types the base ships". This install also rolls `workbench`, so the
# grant has to name it too: a name in the env var and NOT in the Role is a 403
# at the last stage of a deploy, after the build, the stage and the pointer
# flip have all succeeded.
- op: add
  path: /rules/0/resourceNames/-
  value: workbench
