# Strategic merge patch: the local-only identity settings that are NOT derived
# from the domain (znasllc-io/memql#3593).
#
# WHAT LEFT THIS FILE. MEMQL_IDENTITY_BASE_URL, the expected issuer, the
# bootstrap domain, MEMQL_DISCOVERY_GRPC_ENDPOINT, the CORS origins and the
# OAuth registered clients were all pinned here. Every one of them is the same
# fact -- the cluster's domain -- spelled a different way, and they are derived
# now from the single MEMQL_DOMAIN key of the memql-domain ConfigMap by
# component/envregistry/domain.go at boot.
#
# That matters because missing one was not a visible failure. memql#3315 was a
# single forgotten CORS origin and it presented as sign-in dying with an empty
# identity log.
#
# WHAT IS LEFT IS GENUINELY LOCAL, AND CARRIES NO DOMAIN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: memql
spec:
  template:
    spec:
      containers:
        - name: identity
          env:
            # The vite dev servers for the OS shell and a product SPA.
            #
            # An "extra" rather than part of what the domain derives, because
            # they are not domain-shaped: folding localhost origins into the
            # derived default would mean a staging deployment that forgot to
            # set CORS silently admits them. Appended to the derived-or-explicit
            # set by LoadConfigFromEnv.
            - name: MEMQL_IDENTITY_CORS_EXTRA_ORIGINS
              value: "http://localhost:8080,http://localhost:3000"
            # The same, for the redirect URIs those dev servers call back on.
            # Merged BY clientId, so this adds URIs to the derived `app` client
            # rather than creating a second one with the same id.
            - name: MEMQL_IDENTITY_EXTRA_REGISTERED_CLIENTS
              value: '[{"clientId":"app","redirectURIs":["http://localhost:8080/auth/callback","http://localhost:3000/auth/callback"]}]'
            # Run migrations on identity startup -- local Postgres starts empty
            # (Tiger Cloud staging has a pre-existing schema; local does not).
            - name: MEMORY_NODES_DATABASE_MIGRATE_ON_START
              value: "true"
            # This installation is not a deploy target (memql#4265).
            #
            # component/deploycontrol/driver.go has refused `docker-local`
            # deploys since the console was written -- local clusters are
            # operated with `make up` (k3d + ArgoCD) -- but nothing ever SET
            # the provider here, and deploymentProvider() defaults to "azure".
            # So that deliberate refusal was unreachable: a local operator
            # opening Deployments got an ENOENT on a cloud overlay path
            # instead of the sentence explaining why there is nothing to
            # deploy.
            #
            # A VALUE in an overlay, which is what overlays are for. It
            # introduces no environment branch -- `provider` is the deploy
            # TARGET axis the design already carries.
            - name: MEMQL_DEPLOY_PROVIDER
              value: "docker-local"
