# Local cockpit front door -- mirrors the cloud cockpit ingress topology so the
# Cockpit connects to https://cockpit.local.znas.io EXACTLY as it connects to
# https://cockpit.<staging-domain>: no ports, no port-forward. The k3s-bundled
# traefik terminates TLS on 443 with the operator's browser-trusted wildcard
# (local-znas-tls, seeded by seed-secrets.sh) and routes by hostname to the
# product-neutral bff gRPC edge.
#
# The bff serves PLAINTEXT gRPC on :50051, so traefik forwards HTTP/2 cleartext
# (h2c) end-to-end -- the local analog of the cloud nginx
# `backend-protocol: GRPC`. The h2c serversscheme is a SERVICE-level traefik
# annotation patched onto the bff Service in kustomization.yaml (local only;
# cloud fronts the bff with nginx). Only the ingress-controller annotation +
# the cert/DNS source differ per env -- the topology + the Cockpit dial path are
# identical.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cockpit-front-door
  namespace: memql
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
#
# THE HOST SERVES TWO PROTOCOLS. gRPC on :50051 for the Cockpit and the SDKs,
# and plain HTTP on :8085 for the memQL Portal's bundle plus the /memql/ws
# browser bridge the portal dials (memql#3314). They are split across two
# backends because an ingress controller's backend protocol is a per-SERVICE
# setting -- see the comment on the bff-http Service in
# deploy/k8s/components/engine-bff/bff.yaml. Traefik orders rules by
# specificity, so the two longer paths below win over `/`.
#
# The portal therefore lives at https://cockpit.local.znas.io/portal/ -- the
# ops edge's graphical half, alongside the gRPC half the terminal Cockpit
# uses. Same front door, same TLS, no port, no port-forward.
spec:
  tls:
    - hosts: ["cockpit.local.znas.io"]
      secretName: local-znas-tls
  rules:
    - host: cockpit.local.znas.io
      http:
        paths:
          # The portal's static bundle.
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          # The WebSocket bridge the portal dials. It is HTTP/1.1 with an
          # Upgrade, NOT gRPC, so it must reach the plain-HTTP backend even
          # though it tunnels to MemqlService.Stream on the other side.
          - path: /memql/ws
            pathType: Prefix
            backend:
              service:
                name: bff-http
                port:
                  number: 8085
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 50051
