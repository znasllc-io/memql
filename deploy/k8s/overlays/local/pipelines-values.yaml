# The pipelines substrate's LOCAL values (epic memql#5478, task #5492), over
# ../../components/pipelines -- one strategic-merge patch per object. The
# component's README.md says what each number bounds.
#
# THE CACHE's shape is the component's default, which is the local one: no
# storageClassName, so k3d's default local-path class provisions it, and
# ReadWriteOnce, the only mode local-path offers (per node, and the volume pins
# the step pods that mount it to its node). The one thing local adds is the
# binds-on-first-use mark, at the bottom.
#
# THE CEILING AND THE LIMITS are this overlay's decision. Steps run on the
# dedicated build node `make up` creates (scripts/k3d/up.sh,
# ensure_build_node), capped at the CPUs and memory it was given -- 16 CPUs
# and 40 GB on the workstation the 2026-10-11 design record sizes -- so six
# steps may run at once across all workbench replicas, each container
# reserving 250m / 512Mi / 1 GiB of disk and capped at two CPUs / 4 GiB /
# 20 GiB of disk -- the disk limit restated as the workspace's, in the
# ConfigMap after the limits. The node's own caps, not this count, keep a
# burst off the serving node; the count is tuned from the peaks phase 2 of
# that record measures.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memql-pipelines-ceiling
  namespace: memql-pipelines
spec:
  hard:
    count/jobs.batch: "6"
---
# `limits` is replaced whole, not merged, so the item is restated in full.
apiVersion: v1
kind: LimitRange
metadata:
  name: memql-pipelines-limits
  namespace: memql-pipelines
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 20Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
---
# THE WORKSPACE LIMIT is the LimitRange's default ephemeral-storage limit above,
# restated: the workbench gives every step's /workspace that size limit
# (render_pipelines_test.go holds the two equal).
apiVersion: v1
kind: ConfigMap
metadata:
  name: memql-pipelines
data:
  MEMQL_PIPELINES_WORKSPACE_LIMIT: 20Gi
  # THE BUILD POOL. Every step Job and isolation probe is pinned to nodes
  # labelled memql.io/pipeline-pool=builds and tolerates exactly that
  # NoSchedule taint (components/pipelines/README.md, "Dedicated build
  # placement"). `make up` creates that node; a cluster without it leaves
  # steps waiting rather than falling back onto the serving node.
  MEMQL_PIPELINES_NODE_POOL: builds
---
# BINDS ON FIRST USE. local-path is WaitForFirstConsumer, so this claim stays
# Pending until a pipeline step first mounts it. Argo CD reads a Pending claim
# as Progressing, and an Application takes its worst resource's health, so
# without this mark every dev cluster's Application reports Progressing for as
# long as no pipeline has run, and anything waiting for Healthy waits forever.
# The mark is what ../../../argocd/bootstrap/pvc-health.yaml reads: Pending
# plus memql.io/binds-on-first-use=true is Healthy. LOCAL ONLY: on a cloud
# cluster a Pending cache can mean its class does not exist (no Blob CSI
# driver), which must keep reading Progressing. `make up` gives every dev
# cluster the customization: a fresh one through the bootstrap, an existing
# one by merging pvc-health.yaml into its argocd-cm (scripts/k3d/up.sh).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memql-pipelines-cache
  namespace: memql-pipelines
  annotations:
    memql.io/binds-on-first-use: "true"
