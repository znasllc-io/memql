# Local front door (mirrors the cloud ingress topology): the k3s-bundled
# traefik terminates TLS on 443 with the operator's browser-trusted wildcard
# (memql-front-door-tls, seeded by seed-secrets.sh) and routes by hostname --
# https://identity.memql.localhost with no ports, exactly like the deployed
# environments' ingress. The identity backend serves TLS in-cluster with the
# internal CA (identity-tls), so traefik proxies https with verification
# skipped (the internal CA is not in traefik's trust store; the hop stays
# inside the cluster network).
#
# THE HOSTNAME IS A COMMITTED DEFAULT, NOT A CONSTANT (memql#3593). An install
# that chooses another domain overrides it through the ArgoCD Application's
# spec.source.kustomize.patches, emitted by scripts/k3d/up.sh -- the same seam
# memql#3572 uses for image overrides. The default is committed so that a plain
# `kubectl apply -k` still produces a working front door, and so that the common
# case carries no generated YAML at all.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: internal-ca-skip-verify
  namespace: memql
spec:
  insecureSkipVerify: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-front-door
  namespace: memql
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: ["identity.memql.localhost"]
      secretName: memql-front-door-tls
  rules:
    - host: identity.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 8085
