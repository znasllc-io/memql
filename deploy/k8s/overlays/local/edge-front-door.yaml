# The last two front-door rules that will ever be added.
#
# Everything after this is a graph row. `*.memql.localhost` and the apex both
# reach svc/edge, which resolves the request Host against v1:platform:site and
# serves the bundle that row's bundleRef names -- so a new site is an upload
# plus a row write, and the number of Kubernetes objects does not grow with the
# number of sites. That is the whole of memql#3700's "a site is data, not
# infrastructure": adding shop.<domain> touches nothing in this directory.
#
# THE APEX IS NOT A SPECIAL CASE. For a customer cluster the bare domain IS
# their main website, so it is a site row like any other -- it just happens to
# be the one whose hostname has no label in front of it. Both rules point at the
# same Service and the edge cannot tell them apart.
#
# WILDCARD VERSUS EXACT -- DECLARED, NOT SPEC-GUARANTEED. `*.memql.localhost`
# also matches api., identity. and mcp., so whether the four named hosts keep
# their own backends is not a given. The Ingress spec says what a wildcard host
# MATCHES and says nothing about which rule wins when an exact rule and a
# wildcard rule both match -- there is no spec guarantee to lean on, and
# traefik's own default (router priority = compiled rule LENGTH) probably
# points the wrong way: the wildcard's `HostRegexp(...)` rule is longer than
# most of the three exact hosts' own rules, so on default priority the
# wildcard could outrank them and the whole API would be served by the site
# edge instead of the bff. So precedence is DECLARED -- and it is declared HERE,
# on this Ingress, as the wildcard naming itself LOWEST.
#
# IT USED TO BE DECLARED THE OTHER WAY ROUND, and that broke the API
# (memql#3810). api-front-door.yaml, front-door.yaml and mcp-front-door.yaml
# each carried `router.priority: "100"` to sit above the wildcard's computed
# default. The intent was right and the annotation was RIGHT TO EXIST -- without
# some declaration the wildcard genuinely does swallow the exact hosts, which
# was measured, so nobody should "fix" a future problem here by deleting the
# ranking outright. What was wrong was WHERE it went.
#
# THE MECHANISM, because the next person to reach for a uniform high priority
# will reach for exactly the thing that broke: the annotation is INGRESS-LEVEL,
# so one value applies to EVERY router that Ingress generates. api-front-door
# declares twenty-two paths. Traefik's default priority is the compiled rule
# LENGTH, and that length is what made `Host(api...) && PathPrefix(/healthz)`
# outrank `Host(api...) && PathPrefix(/)`. A single number for all of them
# erases that difference -- so `/`, the h2c gRPC catch-all pointed at
# bff:50051, could win over the 21 specific paths pointed at bff-http:8085.
# It did: `curl --http1.1 https://api.<domain>/healthz` answered
# `415 Unsupported Media Type` with `Content-Type: application/grpc`. That is
# memql#3703's failure -- an HTTP/1.1 request handed to an h2c backend, failing
# with a protocol error that names nothing -- reached from the other side.
# #3703 was a path with no rule; this was a path whose rule lost.
#
# Only api. broke, and the asymmetry is the tell: identity. and mcp. declare a
# single path each, so a uniform value costs them nothing. It is also why
# verify-frontdoor.sh's `precedence` passed for identity. and went INCONCLUSIVE
# for api. rather than failing.
#
# So the ranking lives on THIS Ingress, whose two rules are the same shape (`/`
# on the wildcard and on the apex) and therefore have no intra-host ordering for
# a uniform value to destroy. Priority 1 loses to every rule-length default, so
# every exact host outranks the wildcard while keeping its own paths ordered by
# length. One annotation, one direction, nothing else disturbed.
#
# Gated by ../render_priority_test.go: no Ingress declaring more than one
# distinct path may carry a uniform priority, and this one must carry it.
#
# This is checked by the `precedence` check in
# scripts/install/verify-frontdoor.sh, for api. and identity. only -- never
# mcp., whose Ingress routes :8090 while the check reads :8085's /healthz, so
# it can never report more than inconclusive for that host. A probe compares
# responses at the paths it dials, so a passing check is evidence for the
# design rather than proof of it at every path; the DECLARED priority above is
# what holds everywhere, including the paths and hosts nothing dials. See
# docs/public/operate/front-door.md's precedence section for the full
# reasoning and measurement.
#
# THE HOSTNAME IS A COMMITTED DEFAULT, NOT A CONSTANT (memql#3593). An install
# that chooses another domain overrides both hosts through the ArgoCD
# Application's spec.source.kustomize.patches, emitted by scripts/k3d/up.sh --
# the same seam every other front-door rule uses. The default is committed so a
# plain `kubectl apply -k` still produces a working front door.
#
# The edge serves plain HTTP on :8085, so no backend-protocol annotation is
# needed here -- unlike the api. host, which carries h2c for gRPC, and unlike
# identity., which is https behind a ServersTransport that skips verification.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-front-door
  namespace: memql
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # The wildcard declares itself LOWEST (memql#3810). 1 loses to every
    # rule-length default, so api. / identity. / mcp. outrank it while keeping
    # their own paths ordered by specificity. See the mechanism above before
    # changing this, and do not move the ranking back onto the exact hosts.
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  tls:
    - hosts:
        - "*.memql.localhost"
        - memql.localhost
      secretName: memql-front-door-tls
  rules:
    # Every hosted site: the portal at portal.<domain>, and every customer SPA
    # or website the operator creates a row for.
    - host: "*.memql.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8085
    # The apex. For a customer cluster this is their main website.
    - host: memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8085
