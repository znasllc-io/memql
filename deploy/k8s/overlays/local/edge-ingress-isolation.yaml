# The right-most forwarded address is authoritative only on the measured
# Traefik -> edge hop. ClusterIP alone does not keep another pod from choosing
# that header. Local k3s enforces this policy; verify enforcement after sync,
# not merely that Kubernetes accepted the object. See edge-ingress-isolation.md.
#
# These labels were read from the local Traefik Deployment. Namespace and pod
# selectors belong in ONE peer (AND), not separate peers (OR). Do not replace
# them with the whole pod CIDR or an unrestricted kube-system namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-http-from-local-ingress
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edge
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - {protocol: TCP, port: 8085}
    # Preserve the existing mesh reachability. This change isolates HTTP only;
    # it does not redefine authentication or membership of the native mesh.
    - ports:
        - {protocol: TCP, port: 50051}
        - {protocol: TCP, port: 50062}
# Kubelet health probes from the edge pod's node remain Kubernetes node traffic.
# No egress policy, host port, public API route or BFF policy is introduced here.
