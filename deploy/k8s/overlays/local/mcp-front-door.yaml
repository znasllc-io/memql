# The MCP protocol head. Its own host rather than a path under api.<domain>
# for the reason that shapes this whole directory: an ingress controller's
# backend protocol is a per-SERVICE setting, and the mcp node is a different
# Service on a different port (8090) speaking plain HTTP, not h2c.
#
# Not proxied through the edge either -- MCP clients configure a URL, they are
# not browsers, and an extra hop on a tool-calling path buys nothing.
#
# FIRST REAL EXERCISE OF :8090. deploy/k8s/base/mcp.yaml has carried the port
# and a comment saying a public ingress targets it, but no overlay in this
# repository defined one. Protocol details (streamable HTTP vs SSE, timeouts)
# may surface here that nothing has tested.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-front-door
  namespace: memql
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # PRECEDENCE IS DECLARED, NOT INHERITED (memql#3714). Traefik's default
    # router priority is the LENGTH of the compiled rule string, and the
    # wildcard's `HostRegexp(...) && PathPrefix(...)` rule is longer than this
    # host's own `Host(...) && PathPrefix(...)` rule -- so on default priority
    # the wildcard could outrank mcp., and MCP clients would reach the site
    # edge instead of the protocol head. 100 matches the priority declared on
    # api-front-door.yaml and front-door.yaml so all three exact hosts rank
    # identically above the wildcard rather than coincidentally. This host is
    # NOT covered by verify-frontdoor.sh's `precedence` check (its Ingress
    # routes :8090, while the check reads :8085's /healthz) -- see
    # docs/public/operate/front-door.md's precedence section for why the
    # declaration still matters here even though it cannot be measured here.
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  tls:
    - hosts: ["mcp.memql.localhost"]
      secretName: memql-front-door-tls
  rules:
    - host: mcp.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8090
