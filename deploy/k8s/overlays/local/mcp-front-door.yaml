# The MCP protocol head. Its own host rather than a path under api.<domain>
# for the reason that shapes this whole directory: an ingress controller's
# backend protocol is a per-SERVICE setting, and the mcp node is a different
# Service on a different port (8090) speaking plain HTTP, not h2c.
#
# Not proxied through the edge either -- MCP clients configure a URL, they are
# not browsers, and an extra hop on a tool-calling path buys nothing.
#
# FIRST REAL EXERCISE OF :8090. deploy/k8s/base/mcp.yaml has carried the port
# and a comment saying a public ingress targets it, but no overlay in this
# repository defined one. Protocol details (streamable HTTP vs SSE, timeouts)
# may surface here that nothing has tested.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-front-door
  namespace: memql
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # NO router.priority HERE, DELIBERATELY (memql#3810). Precedence over the
    # `*.<domain>` wildcard is still declared -- without it the wildcard can
    # outrank mcp. and MCP clients reach the site edge instead of the protocol
    # head -- but it is declared ON THE WILDCARD, in edge-front-door.yaml, which
    # names itself lowest.
    #
    # This host matters most for that choice, because it is the one that CANNOT
    # be measured: verify-frontdoor.sh's `precedence` check reads :8085's
    # /healthz and this Ingress routes :8090, so no probe can ever report more
    # than inconclusive for mcp. A ranking declared in one place, on the Ingress
    # whose rules are a single shape, is a claim a reader can check by reading;
    # three coordinated numbers on three files was not, and the host where that
    # went wrong (api.) was one of the two the probe DOES cover.
spec:
  tls:
    - hosts: ["mcp.memql.localhost"]
      secretName: memql-front-door-tls
  rules:
    - host: mcp.memql.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8090
