# Identity node -- in-house auth provider (magic-link, JWT issuance, JWKS).
# Every other node's verifier points at https://identity:8085 (internal
# TLS, self-signed cluster CA -- see deploy/k8s/tls/). This is the ONLY
# node that runs DB migrations against the shared Tiger Cloud instance --
# all others set MIGRATE/AUTO_MIGRATE=false to avoid a 7-way migration race.
#
# TLS: identity serves its HTTP surface (/.well-known/jwks.json,
# /node/bootstrap, /healthz) over TLS so the node-bootstrap handler's
# https requirement is satisfied without an insecure-transport bypass.
# Cert (identity-tls) + CA (memql-ca) are mounted; MEMQL_HTTP_TLS_* point
# the server + clients at them. IDENTITY_KEY_ENCRYPTION_KEY and
# MEMQL_NODE_BOOTSTRAP_TOKEN are NOT here -- they ride the sealed genesis
# envelope (memql-secrets / MEMQL_GENESIS_B64) and autoload at boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: memql
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: memql
    memql/node-type: identity
spec:
  replicas: 1
  # identity-keys is an RWO PVC; a RollingUpdate would deadlock waiting for
  # the old pod to release the volume before the new one can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: memql
        memql/node-type: identity
    spec:
      volumes:
        - name: identity-keys
          persistentVolumeClaim:
            claimName: identity-keys
        - name: identity-tls
          secret:
            secretName: identity-tls
        - name: memql-ca
          secret:
            secretName: memql-ca
      containers:
        - name: identity
          image: acrmemql.azurecr.io/memql-identity:0.9.5
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50061 }
          envFrom:
            - secretRef:
                name: memql-secrets
          env:
            - { name: MEMQL_GENESIS_AUTOLOAD, value: "true" }
            - { name: SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "identity" }
            - { name: MEMQL_NODE_ADDRESS, value: "identity:50061" }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50061" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: SERVER_ADDRESS, value: "0.0.0.0:8085" }
            # Persist the Ed25519 signing key across restarts (else every
            # identity restart rotates it and invalidates issued tokens).
            - { name: IDENTITY_KEY_DIR, value: "/data/identity-keys" }
            # Internal TLS: serve https + trust the cluster CA.
            - { name: MEMQL_HTTP_TLS_CERT_FILE, value: "/etc/memql/tls/tls.crt" }
            - { name: MEMQL_HTTP_TLS_KEY_FILE, value: "/etc/memql/tls/tls.key" }
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            # Public identity host = the JWT issuer (staging convention: identity.<domain>).
            - { name: IDENTITY_BASE_URL, value: "https://identity.staging.copresent.ai" }
            - { name: IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.staging.copresent.ai" }
            - { name: IDENTITY_BOOTSTRAP_DOMAIN, value: "staging.copresent.ai" }
            # CORS + OAuth redirect for the SPA at app.staging.copresent.ai.
            - { name: IDENTITY_CORS_ALLOWED_ORIGINS, value: "https://app.staging.copresent.ai" }
            - { name: IDENTITY_REGISTERED_CLIENTS, value: '[{"clientId":"app","redirectURIs":["https://app.staging.copresent.ai/auth/callback"]},{"clientId":"cockpit","redirectURIs":["http://127.0.0.1/cockpit/callback","http://localhost/cockpit/callback"]}]' }
            - { name: SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: IDENTITY_ENABLED, value: "true" }
            # Migrations run ONCE, here. Every other node has these false.
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "true" }
            - { name: MEMORY_NODES_DATABASE_AUTO_MIGRATE, value: "true" }
          volumeMounts:
            - { name: identity-keys, mountPath: /data/identity-keys }
            - { name: identity-tls, mountPath: /etc/memql/tls, readOnly: true }
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: 8085, scheme: HTTPS }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8085, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8085, scheme: HTTPS }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: memql
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity
  ports:
    - { name: node, port: 50061, targetPort: 50061 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# Persistent home for the identity Ed25519 signing key (jwt-current.ed25519).
# Without this the key lives on ephemeral pod disk and rotates on every
# restart -- which invalidates all issued tokens and breaks the mesh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-keys
  namespace: memql
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
