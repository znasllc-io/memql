# ExternalSecret: livekit-secrets <- Key Vault (memql#1043).
#
# ESO reconciles the self-hosted LiveKit shared-secret material from
# kv-<install> into the k8s Secret `livekit-secrets`, mirroring the
# memql-secrets pattern (declarative, reconciled — no ad-hoc kubectl drift).
#
# Key Vault entries this expects (kv-<install>):
#   livekit-keys                 -> LIVEKIT_KEYS                ("<apiKey>: <secret>")
#   polyphon-livekit-api-key     -> MEMQL_POLYPHON_LIVEKIT_API_KEY
#   polyphon-livekit-api-secret  -> MEMQL_POLYPHON_LIVEKIT_API_SECRET
#
# LIVEKIT_KEYS feeds the livekit-server (deploy/k8s/base/livekit.yaml); the
# POLYPHON_* keys feed the BFF/voice token minter (bff.yaml / voice.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit-secrets
  annotations:
    # ARGO MUST NOT CLAIM THE SECRET THIS WRITES (memql#4489).
    #
    # External Secrets copies this object's labels and annotations onto the
    # target Secret it generates. ArgoCD's label tracking identifies its
    # resources by `app.kubernetes.io/instance`, so the moment Argo tracks
    # this ExternalSecret the generated Secret INHERITS the tracking label --
    # and Argo then reports an object that exists in no repository as
    # OutOfSync, forever, with nothing to sync and nothing to fix. Observed
    # live as Secret/memql-secrets carrying `app.kubernetes.io/instance: memql`.
    #
    # The fix uses the same inheritance against itself: put the annotation
    # HERE, and inheritance delivers it onto the generated Secret, where it
    # tells Argo the omission is deliberate. On this object it is a no-op --
    # this one IS in the repository, so Argo tracks it normally.
    #
    # Gated by deploy/k8s/overlays/externalsecrets_test.go, which walks every
    # ExternalSecret under deploy/ (text-level, cannot skip).
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  namespace: memql
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/part-of: memql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keyvault
    kind: SecretStore
  target:
    name: livekit-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LIVEKIT_KEYS
      remoteRef:
        key: livekit-keys
    - secretKey: MEMQL_POLYPHON_LIVEKIT_API_KEY
      remoteRef:
        key: polyphon-livekit-api-key
    - secretKey: MEMQL_POLYPHON_LIVEKIT_API_SECRET
      remoteRef:
        key: polyphon-livekit-api-secret
