# ExternalSecret: telephony-secrets <- Key Vault (memql#1910).
#
# ESO reconciles carrier (Telnyx) credentials from kv-memql-staging into the
# k8s Secret `telephony-secrets`, mirroring the livekit-secrets pattern. These
# feed the memQL telephony integration (CarrierProvider) on the node(s) that
# provision DIDs and place/route calls -- NOT livekit-sip itself (which only
# needs the LiveKit API pair). Secret values never live in a row; concepts
# carry only references.
#
# Key Vault entries this expects (kv-memql-staging):
#   telnyx-api-key        -> TELNYX_API_KEY
#   telnyx-connection-id  -> TELNYX_CONNECTION_ID   (the connection fronting livekit-sip)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telephony-secrets
  namespace: memql
  labels:
    app.kubernetes.io/name: telephony
    app.kubernetes.io/part-of: memql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keyvault-staging
    kind: SecretStore
  target:
    name: telephony-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TELNYX_API_KEY
      remoteRef:
        key: telnyx-api-key
    - secretKey: TELNYX_CONNECTION_ID
      remoteRef:
        key: telnyx-connection-id
