# ExternalSecret: telephony-secrets <- Key Vault (memql#1910).
#
# ESO reconciles carrier (Telnyx) credentials from kv-<install> into the
# k8s Secret `telephony-secrets`, mirroring the livekit-secrets pattern. These
# feed the MemQL telephony integration (CarrierProvider) on the node(s) that
# provision DIDs and place/route calls -- NOT livekit-sip itself (which only
# needs the LiveKit API pair). Secret values never live in a row; concepts
# carry only references.
#
# Key Vault entries this expects (kv-<install>):
#   telnyx-api-key        -> MEMQL_TELEPHONY_TELNYX_API_KEY
#   telnyx-connection-id  -> MEMQL_TELEPHONY_TELNYX_CONNECTION_ID   (the connection fronting livekit-sip)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telephony-secrets
  annotations:
    # Inherited onto the generated Secret, where it stops Argo claiming an
    # object that exists in no repository (memql#4489). The full reasoning is
    # on the same annotation in externalsecret-livekit.yaml; the one-line
    # version is that External Secrets copies this metadata onto the Secret it
    # writes, Argo's tracking label rides along, and Argo then reports a Secret
    # that is in no repository as OutOfSync forever.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  namespace: memql
  labels:
    app.kubernetes.io/name: telephony
    app.kubernetes.io/part-of: memql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keyvault
    kind: SecretStore
  target:
    name: telephony-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MEMQL_TELEPHONY_TELNYX_API_KEY
      remoteRef:
        key: telnyx-api-key
    - secretKey: MEMQL_TELEPHONY_TELNYX_CONNECTION_ID
      remoteRef:
        key: telnyx-connection-id
