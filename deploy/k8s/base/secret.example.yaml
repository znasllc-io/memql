# memql-secrets -- TEMPLATE ONLY. Do NOT commit real values.
#
# This Secret is THE config delivery path (epic memql#3958): every value a MemQL
# pod needs at boot and does not carry as an explicit `env:` entry is a KEY on
# this Secret. Every DB-connecting node mounts it via
# `envFrom: secretRef: memql-secrets`, so a key added here reaches all pods with
# no manifest change. The per-pod overrides in each Deployment
# (MEMQL_NODE_TYPE, the mesh addresses, ...) are explicit `env:` entries, which
# beat envFrom in Kubernetes regardless of order.
#
# There WAS a second path -- MEMQL_GENESIS_B64, a sealed envelope each pod
# decrypted in-process under MEMQL_MASTER_KEY and applied set-if-absent. It is
# gone. If you are reading an older runbook that tells you to seal one, it is
# describing a mechanism that no longer exists.
#
# NO database pod lives in this cluster: the DB keys point at the managed Tiger
# Cloud instance (xahn9ru4v6, Azure East US 2).
#
# -----------------------------------------------------------------------------
# Hybrid connection-pool endpoint split (epic memql#1925)
# -----------------------------------------------------------------------------
# Two DB endpoints on the SAME Tiger service:
#   MEMQL_DATABASE_DSN         -> the TRANSACTION POOLER (PgBouncer,
#                                        db `tsdb_transaction`, pooler port
#                                        39578). Carries all BULK traffic so a
#                                        deploy surge decouples from Postgres
#                                        backends -- the storm fix.
#   MEMORY_NODES_DATABASE_DIRECT_DSN  -> the DIRECT (non-pooled) endpoint (db
#                                        `tsdb`, direct port). Session-stateful
#                                        work (session advisory locks, leader
#                                        election, migrations) resolves here so
#                                        the pooler can't recycle a held
#                                        session-scoped backend out from under
#                                        it. Optional: if unset, the code falls
#                                        back to the main pool (single-pool
#                                        behavior, env-agnostic).
# Get both strings from the Tiger console (Service -> Connect; the "Connection
# pooling" tab gives the pooler host/port/db) or `tiger db connection-string`.
#
# -----------------------------------------------------------------------------
# RECOMMENDED: create the Secret imperatively (keeps plaintext out of git).
# -----------------------------------------------------------------------------
#
#   # $POOLER_DSN = the transaction-pooler string (db tsdb_transaction, port
#   #               39578) from the Tiger console "Connection pooling" tab.
#   kubectl create secret generic memql-secrets -n memql \
#     --from-literal=MEMQL_MASTER_KEY="$MEMQL_MASTER_KEY" \
#     --from-literal=MEMQL_IDENTITY_SIGNING_KEY_B64="$MEMQL_IDENTITY_SIGNING_KEY_B64" \
#     --from-literal=MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
#     --from-literal=MEMQL_DATABASE_DSN="$POOLER_DSN" \
#     --from-literal=MEMORY_NODES_DATABASE_DIRECT_DSN="$(tiger db connection-string xahn9ru4v6 --with-password)"
#
# Re-run with `--dry-run=client -o yaml | kubectl apply -f -` to rotate
# idempotently. After changing either DSN, roll the pods so they reconnect:
# `kubectl rollout restart deploy -n memql` (identity first).
#
# -----------------------------------------------------------------------------
# The keys
# -----------------------------------------------------------------------------
#   MEMQL_MASTER_KEY                 32-byte (64 hex chars) key that DECRYPTS
#                                    stored secrets at rest
#                                    (v1:platform:globalSecret). NOT an auth
#                                    credential -- see MEMQL_OPERATOR_KEY.
#   MEMQL_OPERATOR_KEY               32-byte (64 hex chars) credential that
#                                    AUTHENTICATES `Authorization: Operator
#                                    <key>` as a synthetic cluster owner
#                                    (memql#3519). A DIFFERENT value from the
#                                    master key, deliberately: the thing that
#                                    decrypts must not be the thing that
#                                    authenticates, because the master key also
#                                    lives on operator laptops. Generate with
#                                    `openssl rand -hex 32`. Leave it out
#                                    entirely to disable the operator path --
#                                    the interceptor then refuses every
#                                    Operator stream, which is safe. See
#                                    docs/public/operate/auth/operator-credential.md
#   MEMQL_IDENTITY_SIGNING_KEY_B64   base64-std of a 32-byte Ed25519 seed
#                                    (#550). REQUIRED wherever identity runs
#                                    more than one replica -- the base manifest
#                                    runs two. Every replica derives the SAME
#                                    key + kid + JWKS from it. May instead ride
#                                    inside the sealed envelope; declaring it
#                                    here wins (autoload is set-if-absent).
#                                    Absent from BOTH, each pod generates its
#                                    own key, JWKS diverges, and ~half of all
#                                    token verifications fail (memql#3400) --
#                                    which is why identity refuses to boot
#                                    without it on a non-loopback issuer.
#                                    Generate: make identity-signing-key
#                                    Rotating it is a HARD SWAP: no JWKS overlap
#                                    window applies, so every live session and
#                                    every minted mesh node token dies at once.
#                                    Read the procedure + blast-radius table in
#                                    docs/public/operate/auth/identity-service.md
#                                    ("Rotating the signing key") first
#                                    (memql#3381).
#   MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT
#                                    RFC3339 date the seed above was minted.
#                                    Not a secret; it lives here so it travels
#                                    with the seed and is re-stamped alongside
#                                    it. Without it the service cannot tell how
#                                    old its signing key is, and the overdue-
#                                    rotation alert can never fire (memql#3381).
#   MEMQL_NODE_BOOTSTRAP_TOKEN       shared secret that gates node-token
#                                    minting. identity mints a class="node" JWT
#                                    for any caller presenting it; every leaf
#                                    node presents it to get one, then
#                                    authenticates its outbound
#                                    NodeService.Stream with the JWT. So this
#                                    single value is what lets the mesh form.
#                                    May instead ride inside the sealed
#                                    envelope; declaring it here wins (autoload
#                                    is set-if-absent).
#                                    Absent from BOTH, identity answers every
#                                    mint 503 bootstrap_disabled and every node
#                                    dials its peers with no Authorization
#                                    header -- so NO cross-node event is ever
#                                    delivered, while every readiness probe
#                                    stays green (memql#3784).
#                                    No format is imposed: identity compares it
#                                    with a constant-time byte comparison.
#                                    Generate: openssl rand -hex 32
#                                    Rotating it is a HARD SWAP for the same
#                                    reason the seed above is -- pods read their
#                                    environment once, at start, so every peer
#                                    connection stays refused until all nodes
#                                    have restarted.
#   MEMQL_DATABASE_DSN        Tiger Cloud connection string (with
#                                    password) -- the TRANSACTION POOLER
#                                    endpoint (tsdb_transaction, port 39578).
#   MEMORY_NODES_DATABASE_DIRECT_DSN Tiger Cloud connection string (with
#                                    password) -- the DIRECT (non-pooled)
#                                    endpoint (tsdb). Optional; falls back to
#                                    the main pool when unset.
#
# -----------------------------------------------------------------------------
# This manifest form (placeholders only) is provided for completeness. Prefer
# the imperative `kubectl create secret` above so real values never land in a
# file. If you DO apply this form, fill stringData and keep it out of git.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: memql-secrets
  namespace: memql
type: Opaque
stringData:
  MEMQL_MASTER_KEY: "REPLACE_WITH_64_HEX_CHAR_MASTER_KEY"
  # A DIFFERENT 64-hex value from the one above (memql#3519).
  MEMQL_OPERATOR_KEY: "REPLACE_WITH_A_SECOND_64_HEX_VALUE"
  MEMQL_IDENTITY_SIGNING_KEY_B64: "REPLACE_WITH_BASE64_OF_32_BYTE_ED25519_SEED"
  MEMQL_IDENTITY_SIGNING_KEY_CREATED_AT: "REPLACE_WITH_RFC3339_DATE_THE_SEED_WAS_MINTED"
  # Without this the mesh never forms -- see the note above (memql#3784).
  MEMQL_NODE_BOOTSTRAP_TOKEN: "REPLACE_WITH_A_THIRD_64_HEX_VALUE"
  MEMQL_DATABASE_DSN: "REPLACE_WITH_TIGER_CLOUD_POOLER_DSN"
  MEMORY_NODES_DATABASE_DIRECT_DSN: "REPLACE_WITH_TIGER_CLOUD_DIRECT_DSN"

# -----------------------------------------------------------------------------
# ALTERNATIVE: Azure Key Vault via the Secrets Store CSI driver.
# -----------------------------------------------------------------------------
# Instead of the in-cluster Secret above, sync the Key Vault secrets
# (kv-memql-staging: memql-master-key / memql-operator-key /
# memql-identity-signing-key-b64 / memory-nodes-database-dsn /
# memory-nodes-database-direct-dsn) into a k8s
# Secret named `memql-secrets` via a
# SecretProviderClass with `secretObjects`. Requires the AKS addon
# `azure-keyvault-secrets-provider` and a pod identity / workload identity
# with `Key Vault Secrets User` on the vault. Each Deployment must then mount
# the CSI volume (a pod referencing the SecretProviderClass) for the synced
# Secret to be created/refreshed. Uncomment and fill tenantId / userAssigned
# identityID / keyvaultName, then add the matching volume + volumeMount to
# each Deployment.
#
