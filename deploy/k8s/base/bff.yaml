# BFF node -- backend for frontend, primary external API surface.
# Mesh parent of the worker nodes; its Service name `bff` makes the compose
# value `bff:50058` resolve unchanged via same-namespace cluster DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
    memql/node-type: bff
spec:
  # 2 replicas so the external LB always has a serving pod during a roll
  # (the BFF is the user connection anchor). With maxUnavailable=0 +
  # maxSurge=1 a ready new pod always exists before an old one is removed.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/part-of: memql
        memql/node-type: bff
    spec:
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
      # Graceful shutdown (#552 + zero-downtime #615): grace period must
      # exceed preStop (5s) + MEMQL_SHUTDOWN_DRAIN_DELAY (5s) + the app Stop
      # budget (30s) so endpoint-deregistration + drain + GracefulStop finish.
      terminationGracePeriodSeconds: 60

      containers:
        - name: bff
          image: acrmemql.azurecr.io/memql-bff-copresent:0.9.9
          # preStop (#615): pause before SIGTERM so the EndpointSlice
          # controller removes this pod from the bff / bff-external
          # Services first -- new connections stop landing here while the
          # app's graceful drain (#552) finishes the in-flight streams.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50058 }
          envFrom:
            - secretRef:
                name: memql-secrets
          env:
            - { name: MEMQL_GENESIS_AUTOLOAD, value: "true" }
            - { name: SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "bff" }
            - { name: MEMQL_NODE_ADDRESS, value: "bff:50058" }
            # Unique per-pod mesh identity (#1042). Overrides the shared genesis
            # MEMQL_NODE_ID=bff-local (set-if-absent) so PeerManager keys each
            # node distinctly and cross-node event forwarding works.
            - { name: MEMQL_NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50058" }
            - { name: MEMQL_WORKER_PEERS, value: "voice=voice:50059,agent=agent:50055,cognition=cognition:50054,planner=planner:50056,workbench=workbench:50060" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            # Self-hosted LiveKit (#1043). URLs are non-secret config; the
            # api key/secret come from the ESO-synced livekit-secrets. The BFF
            # mints LiveKit room tokens here (LiveKitConfigured() => true).
            - { name: POLYPHON_LIVEKIT_URL, value: "ws://livekit:7880" }
            - { name: POLYPHON_LIVEKIT_PUBLIC_URL, value: "wss://livekit.staging.copresent.ai" }
            - { name: POLYPHON_LIVEKIT_API_KEY, valueFrom: { secretKeyRef: { name: livekit-secrets, key: POLYPHON_LIVEKIT_API_KEY } } }
            - { name: POLYPHON_LIVEKIT_API_SECRET, valueFrom: { secretKeyRef: { name: livekit-secrets, key: POLYPHON_LIVEKIT_API_SECRET } } }
            # MEMQL_NODE_BOOTSTRAP_TOKEN comes from the genesis envelope
            # (autoload, set-if-absent). Not overridden here so the sealed
            # value wins; for dev override it via the Secret if needed.
            - { name: SERVER_ADDRESS, value: "0.0.0.0:8085" }
            - { name: IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            - { name: IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.staging.copresent.ai" }
            - { name: IDENTITY_ENABLED, value: "false" }
            # Internal TLS: trust the cluster CA when calling https://identity:8085.
            # SSL_CERT_DIR covers 0.9.0 images; MEMQL_HTTP_TLS_CA_FILE the explicit path at 0.9.1+.
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: SERVER_ALLOWED_ORIGINS, value: "*" }
            # Shared Tiger DB -- migrations run ONCE on the identity node.
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
            - { name: MEMORY_NODES_DATABASE_AUTO_MIGRATE, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          # Slow boot (DSL load + mesh connect) must not trip liveness/readiness (#1117).
          startupProbe:
            httpGet: { path: /healthz, port: 8085 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            # /healthz is dependency- + drain-aware: a degraded/draining pod leaves
            # the Service WITHOUT being killed (#1117).
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # /livez is pure process-liveness (#1117): a transient dependency/mesh
            # blip never liveness-kills an otherwise-alive pod. Decoupled from
            # /healthz to stop rollout-triggered restart storms.
            httpGet: { path: /livez, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
# ClusterIP -- in-mesh DNS target `bff` (NodeService 50058 + http 8085 + grpc).
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
  ports:
    - { name: node, port: 50058, targetPort: 50058 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# External entry point. Maps to app.copresent.ai later (epic #522).
apiVersion: v1
kind: Service
metadata:
  name: bff-external
  namespace: memql
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: memql
    memql/role: external-entry
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: bff
  ports:
    - { name: http, port: 8085, targetPort: 8085 }
