# Identity node -- in-house auth provider (magic-link, JWT issuance, JWKS).
# Every other node's verifier points at https://identity:8085 (internal
# TLS, self-signed cluster CA -- see deploy/k8s/tls/). This is the ONLY
# node that runs DB migrations against the shared Tiger Cloud instance --
# all others set MIGRATE_ON_START=false to avoid a 7-way migration race.
#
# TLS: identity serves its HTTP surface (/.well-known/jwks.json,
# /node/bootstrap, /healthz) over TLS so the node-bootstrap handler's
# https requirement is satisfied without an insecure-transport bypass.
# Cert (identity-tls) + CA (memql-ca) are mounted; MEMQL_HTTP_TLS_* point
# the server + clients at them. MEMQL_IDENTITY_SIGNING_KEY_B64 (the Ed25519
# signing seed, #550), MEMQL_IDENTITY_KEY_ENCRYPTION_KEY and
# MEMQL_NODE_BOOTSTRAP_TOKEN are NOT here -- they ride the sealed genesis
# envelope (memql-secrets / MEMQL_GENESIS_B64) and autoload at boot.
#
# HA (#550): the signing key comes from the envelope (same seed on every
# pod -> identical JWKS), so there is NO single-writer key PVC and identity
# runs 2 replicas on a RollingUpdate (surge) -- no more Recreate-strategy
# auth-down window on every deploy. A PodDisruptionBudget keeps >=1 up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: memql
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: memql
    memql/node-type: identity
spec:
  replicas: 2
  revisionHistoryLimit: 1   # keep active + 1 previous (rollback); auto-GC older RS (#1858 cleanup)
  # Bound the roll so identity doesn't surge a 3rd pod (its DB pool) onto the
  # connection budget (memql#1858). Default RollingUpdate is 25%/25% (= surge 1
  # at 2 replicas); pin to drain-before-start. identity stays available because
  # the other replica keeps serving JWKS while one rolls.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: memql
        memql/node-type: identity
    spec:
      volumes:
        - name: identity-tls
          secret:
            secretName: identity-tls
        - name: memql-ca
          secret:
            secretName: memql-ca
      # Graceful shutdown (#552): must exceed MEMQL_SHUTDOWN_DRAIN_DELAY (5s
      # default) + the app Stop budget (30s) so drain + GracefulStop finish.
      terminationGracePeriodSeconds: 45

      containers:
        - name: identity
          image: acrmemql.azurecr.io/memql-identity:0.9.9
          # preStop drain (memql#1817): pause before SIGTERM so the node
          # deregisters and its DB pool closes gracefully instead of being
          # SIGKILLed at the grace deadline and orphaning Postgres backends.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50061 }
          envFrom:
            - secretRef:
                name: memql-secrets
            # Bounded Postgres pool (MAX_OPEN_CONNS/MAX_IDLE_CONNS) so the
            # mesh stays under max_connections during a rollout (memql#1858).
            - configMapRef:
                name: memql-db-pool
          env:
            - { name: MEMQL_GENESIS_AUTOLOAD, value: "true" }
            - { name: SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "identity" }
            - { name: MEMQL_NODE_ADDRESS, value: "identity:50061" }
            # Unique per-pod mesh identity (#1042). Overrides the shared genesis
            # MEMQL_NODE_ID=bff-local (set-if-absent) so PeerManager keys each
            # node distinctly and cross-node event forwarding works.
            - { name: MEMQL_NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            # Deployment id (#1873): ties this node's v1:cluster:node row to the
            # deploy that created it. pod-template-hash is unique per rollout
            # revision, so every pod of one deploy shares it and a pod left over
            # from a previous deploy carries a different value -- the orphan
            # signal queryNodesNotInDeployment surfaces. Stamped at registration
            # by logicRegisterNode via EmitSystemStartup (MEMQL_DEPLOYMENT_ID).
            - { name: MEMQL_DEPLOYMENT_ID, valueFrom: { fieldRef: { fieldPath: "metadata.labels['pod-template-hash']" } } }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50061" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: SERVER_ADDRESS, value: "0.0.0.0:8085" }
            # Signing key (#550): MEMQL_IDENTITY_SIGNING_KEY_B64 rides the sealed
            # genesis envelope, so every replica derives the SAME Ed25519
            # key + kid + JWKS. No on-disk MEMQL_IDENTITY_KEY_DIR / RWO PVC ->
            # identity scales to >=2 replicas. (Rotate by re-sealing + roll.)
            # Internal TLS: serve https + trust the cluster CA.
            - { name: MEMQL_HTTP_TLS_CERT_FILE, value: "/etc/memql/tls/tls.crt" }
            - { name: MEMQL_HTTP_TLS_KEY_FILE, value: "/etc/memql/tls/tls.key" }
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: MEMQL_IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            # Public identity host = the JWT issuer (staging convention: identity.<domain>).
            # Deployment-specific placeholders; a product stack's overlay patches the
            # real hosts. Unpatched, JWKS/issuer checks fail loudly (intended).
            - { name: MEMQL_IDENTITY_BASE_URL, value: "https://identity.staging.example.com" }
            - { name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.staging.example.com" }
            - { name: MEMQL_IDENTITY_BOOTSTRAP_DOMAIN, value: "staging.example.com" }
            # CORS + OAuth redirect for the product SPA host (deployment-specific placeholder).
            - { name: MEMQL_IDENTITY_CORS_ALLOWED_ORIGINS, value: "https://app.staging.example.com" }
            # Only the product-neutral cockpit client (engine tooling) lives in
            # base. The product SPA's OAuth client is registered per-environment
            # via the identity-product-config overlay patch (staging / prod).
            - { name: MEMQL_IDENTITY_REGISTERED_CLIENTS, value: '[{"clientId":"cockpit","redirectURIs":["http://127.0.0.1/cockpit/callback","http://localhost/cockpit/callback"]}]' }
            - { name: SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: MEMQL_IDENTITY_ENABLED, value: "true" }
            # Migrations run ONCE, here. Every other node has this false.
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "true" }
          volumeMounts:
            - { name: identity-tls, mountPath: /etc/memql/tls, readOnly: true }
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: 8085, scheme: HTTPS }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8085, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # /livez is pure process-liveness (#1117): decoupled from /healthz so a
            # transient dependency blip never liveness-kills an otherwise-alive pod.
            # Live now that the 0.9.31 images serve /livez (#1115; canary #1149 OK).
            httpGet: { path: /livez, port: 8085, scheme: HTTPS }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: memql
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity
  ports:
    - { name: node, port: 50061, targetPort: 50061 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# Keep at least one identity pod serving auth through voluntary disruptions
# (node drain / cluster upgrade / rollout), now that identity runs >=2
# replicas (#550). The signing key is env-provided (no PVC), so any pod can
# serve JWKS + issue tokens.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity
  namespace: memql
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: memql
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
