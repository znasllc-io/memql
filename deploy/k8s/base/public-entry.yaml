# Public HTTPS entry for staging. Requires the cluster add-ons installed
# out-of-band (see deploy/k8s/README-public-entry.md):
#   - ingress-nginx controller (provides the LoadBalancer + a pinned static IP)
#   - cert-manager (issues the Let's Encrypt certs referenced below)
#
# Hosts:
#   app.staging.copresent.ai       -> copresent SPA (+ same-origin proxy to BFF/identity)
#   identity.staging.copresent.ai  -> identity service (login UI, /setup, /admin)
#   mcp.staging.copresent.ai       -> mcp node (remote MCP head, /mcp; memql#1550)
# All A records point at the ingress controller's static public IP.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: znas@znas.io
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
# identity.staging.copresent.ai -> identity (HTTPS backend; identity serves TLS
# with the internal self-signed cert, so skip backend cert verification).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-identity
  namespace: memql
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [identity.staging.copresent.ai]
      secretName: identity-staging-copresent-tls
  rules:
    - host: identity.staging.copresent.ai
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
---
# app.staging.copresent.ai main routes: SPA (/) -> copresent, WS (/memql) -> bff,
# audio WS (/memql/audio) -> voice. The audio path needs the voice node's STT
# provider, not the BFF, so it gets its own longer-prefix rule (wins over /memql).
# This Ingress owns the host's TLS cert (cert-manager).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-main
  namespace: memql
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.staging.copresent.ai]
      secretName: app-staging-copresent-tls
  rules:
    - host: app.staging.copresent.ai
      http:
        paths:
          - { path: /memql/audio, pathType: Prefix, backend: { service: { name: voice, port: { number: 8085 } } } }
          # /memql targets the Rollout's ACTIVE color (bff-active), not the
          # color-agnostic `bff` Service, so NEW logins land only on the active
          # color (deployment-v2 #766). bff-active is managed by the `rollouts`
          # Argo app; established streams stay bound to their old-color pods.
          - { path: /memql, pathType: Prefix, backend: { service: { name: bff-active, port: { number: 8085 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: copresent, port: { number: 8080 } } } }
---
# app.staging.copresent.ai same-origin auth proxy: the token-management XHRs
# the SPA makes (relative paths) must reach identity, NOT the SPA. Separate
# Ingress because these need the HTTPS-backend annotation (identity serves TLS).
# Longest-prefix match means these win over "/" above; /auth/callback (an SPA
# route) falls through to copresent since it doesn't match these prefixes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-identity-proxy
  namespace: memql
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.staging.copresent.ai]
      secretName: app-staging-copresent-tls
  rules:
    - host: app.staging.copresent.ai
      http:
        paths:
          - { path: /auth/refresh, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
          - { path: /auth/logout, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
          - { path: /oauth/token, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
          - { path: /.well-known/jwks.json, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
---
# mcp.staging.copresent.ai -> mcp node (remote MCP head; memql#1550). cert-manager
# owns the TLS cert; nginx terminates TLS and forwards plain HTTP to the mcp
# Service :8090 (the node serves the head over plain HTTP behind the ingress).
# The MCP auth is mandatory + default-deny at the app layer (identity bearer JWT
# on /mcp); the ingress does NOT add a second auth layer. Long read/send timeouts
# + buffering off keep the GET /mcp SSE notification channel open and unbuffered.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-mcp
  namespace: memql
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Sticky sessions for the MCP head: an Mcp-Session-Id maps to an in-process
    # *mcp.Server on ONE pod, so every follow-up /mcp request (POST calls + the
    # GET SSE channel) must return to the pod that created the session. nginx
    # cookie affinity sets `mcp_route` on the first response and routes by it
    # thereafter -> HA across >1 mcp replica without 404-on-wrong-pod.
    # SameSite=None; Secure so the cross-origin remote connector echoes it back.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "mcp_route"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "None"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mcp.staging.copresent.ai]
      secretName: mcp-staging-copresent-tls
  rules:
    - host: mcp.staging.copresent.ai
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: mcp, port: { number: 8090 } } } }
