# Agent node -- task execution and SI work. Dials BFF (parent) and routes
# workbench host calls to the dedicated workbench node (MEMQL_WORKBENCH_REMOTE).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: memql
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: memql
    memql/node-type: agent
spec:
  # HA (#561): safe to run >=2 replicas now that automations are cluster-
  # singleton -- cron leader + the event-execution guard collapse any
  # cross-replica double-fire (watch the guard's duplicatesPrevented metric).
  replicas: 2
  revisionHistoryLimit: 1   # keep active + 1 previous (rollback); auto-GC older RS (#1858 cleanup)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Drain old before starting new so a roll doesn't transiently double this
      # node's Postgres pools and overshoot max_connections (memql#1858).
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: memql
        memql/node-type: agent
    spec:
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
      # Graceful shutdown (#552): must exceed MEMQL_SHUTDOWN_DRAIN_DELAY (5s
      # default) + the app Stop budget (30s) so drain + GracefulStop finish.
      terminationGracePeriodSeconds: 45

      containers:
        - name: agent
          image: acrmemql.azurecr.io/memql-agent:0.9.9
          # preStop drain (memql#1817): pause before SIGTERM so the node
          # deregisters and its DB pool closes gracefully instead of being
          # SIGKILLed at the grace deadline and orphaning Postgres backends.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50055 }
          envFrom:
            - secretRef:
                name: memql-secrets
            # Bounded Postgres pool (MAX_OPEN_CONNS/MAX_IDLE_CONNS) so the
            # mesh stays under max_connections during a rollout (memql#1858).
            - configMapRef:
                name: memql-db-pool
          env:
            - { name: MEMQL_GENESIS_AUTOLOAD, value: "true" }
            - { name: SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "agent" }
            - { name: MEMQL_NODE_ADDRESS, value: "agent:50055" }
            # Unique per-pod mesh identity (#1042). Overrides the shared genesis
            # MEMQL_NODE_ID=bff-local (set-if-absent) so PeerManager keys each
            # node distinctly and cross-node event forwarding works.
            - { name: MEMQL_NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            # Deployment id (#1873): ties this node's v1:cluster:node row to the
            # deploy that created it. pod-template-hash is unique per rollout
            # revision, so every pod of one deploy shares it and a pod left over
            # from a previous deploy carries a different value -- the orphan
            # signal nodesNotInDeployment surfaces. Stamped at registration
            # by logicRegisterNode via EmitSystemStartup (MEMQL_DEPLOYMENT_ID).
            - { name: MEMQL_DEPLOYMENT_ID, valueFrom: { fieldRef: { fieldPath: "metadata.labels['pod-template-hash']" } } }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50055" }
            # #1399: dial the Rollout-managed ACTIVE bff (color-pinned), not the
            # unscoped `bff` Service, so this leaf's parent stream never lands on
            # a draining old-color pod during a blue/green cutover.
            - { name: MEMQL_PARENT_ADDRESS, value: "bff-active:50058" }
            - { name: MEMQL_WORKBENCH_REMOTE, value: "1" }
            - { name: MEMQL_WORKER_PEERS, value: "workbench=workbench:50060" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: SERVER_ADDRESS, value: "0.0.0.0:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            # Deployment-specific placeholder; a product stack's overlay patches the real host.
            - { name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.staging.example.com" }
            - { name: MEMQL_IDENTITY_ENABLED, value: "true" }
            # Internal TLS: trust the cluster CA when calling https://identity:8085.
            # SSL_CERT_DIR covers 0.9.0 images; MEMQL_HTTP_TLS_CA_FILE the explicit path at 0.9.1+.
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          # Slow boot (DSL load + mesh connect) must not trip liveness/readiness (#1117).
          startupProbe:
            httpGet: { path: /healthz, port: 8085 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            # /healthz is dependency- + drain-aware: a degraded/draining pod leaves
            # the Service WITHOUT being killed (#1117).
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # /livez is pure process-liveness (#1117): a transient dependency/mesh
            # blip never liveness-kills an otherwise-alive pod. Decoupled from
            # /healthz to stop rollout-triggered restart storms. Live on /livez
            # now that the 0.9.31 images serve it (#1115 re-ship; canary #1149 OK).
            httpGet: { path: /livez, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: memql
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent
  ports:
    - { name: node, port: 50055, targetPort: 50055 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# Keep >=1 agent pod serving through voluntary disruptions (node drain,
# upgrade, rollout) now that it runs 2 replicas (#561).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent
  namespace: memql
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: memql
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
