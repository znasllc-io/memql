# Edge node -- serves every hosted site (the memQL Portal is site #1) behind
# the `*.<domain>` and apex Ingress rules (deploy/k8s/overlays/local/
# edge-front-door.yaml, memql#3714a). Resolves the request Host against
# v1:platform:site (cached, a miss is cached too, concurrent cold-cache
# resolutions for the same hostname coalesce via singleflight -- see
# component/edge/resolve.go) and serves that site's bundle. Dials BFF
# (parent) like every other leaf node.
#
# MEMQL_EDGE_API_TARGET names the bff's PLAIN-HTTP address (bff-http:8085),
# NOT its gRPC address (bff:50051): the same-origin /_memql/* proxy a site
# with apiProxy=true mounts (component/edge/proxy.go) forwards HTTP requests,
# and POST /memql/query is served by HTTP middleware
# (component/grpc/gateway.go), not the gRPC listener -- so this whole prefix
# has no gRPC leg to dial even if it wanted one.
#
# MEMQL_EDGE_SITE_CACHE_TTL_SECONDS bounds staleness after a site row changes
# on ANOTHER node until the change-feed invalidation reaches this replica
# (component/edge's SiteInvalidationSubscriber, wired in app/transport_edge.go
# -- subscribes to the site concept's graph.node.{created,updated} events,
# forwarded cross-node by the routing rules in component/node/routing.go, the
# same shape as v1:cluster:* / v1:planner:*). The TTL is the backstop, not the
# mechanism -- see resolve.go's own comment on NewResolver.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: memql
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: memql
    memql/node-type: edge
spec:
  # HA (#561): safe to run >=2 replicas now that automations are cluster-
  # singleton -- cron leader + the event-execution guard collapse any
  # cross-replica double-fire (watch the guard's duplicatesPrevented metric).
  replicas: 2
  revisionHistoryLimit: 1   # keep active + 1 previous (rollback); auto-GC older RS (#1858 cleanup)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Drain old before starting new so a roll doesn't transiently double this
      # node's Postgres pools and overshoot max_connections (memql#1858).
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
        app.kubernetes.io/part-of: memql
        memql/node-type: edge
    spec:
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
      # Graceful shutdown (#552): must exceed MEMQL_SHUTDOWN_DRAIN_DELAY (5s
      # default) + the app Stop budget (30s) so drain + GracefulStop finish.
      terminationGracePeriodSeconds: 45

      containers:
        - name: edge
          image: acrmemql.azurecr.io/memql-edge:0.9.9
          # preStop drain (memql#1817): pause before SIGTERM so the node
          # deregisters and its DB pool closes gracefully instead of being
          # SIGKILLed at the grace deadline and orphaning Postgres backends.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50062 }
          envFrom:
            - secretRef:
                name: memql-secrets
            # Bounded Postgres pool (MAX_OPEN_CONNS/MAX_IDLE_CONNS) so the
            # mesh stays under max_connections during a rollout (memql#1858).
            - configMapRef:
                name: memql-db-pool
          env:
            - { name: MEMQL_SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "edge" }
            - { name: MEMQL_NODE_ADDRESS, value: "edge:50062" }
            # Unique per-pod mesh identity (#1042). Overrides the shared genesis
            # MEMQL_NODE_ID=bff-local (set-if-absent) so PeerManager keys each
            # node distinctly and cross-node event forwarding works.
            - { name: MEMQL_NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            # Deployment id (#1873): ties this node's v1:cluster:node row to the
            # deploy that created it. pod-template-hash is unique per rollout
            # revision, so every pod of one deploy shares it and a pod left over
            # from a previous deploy carries a different value -- the orphan
            # signal nodesNotInDeployment surfaces. Stamped at registration
            # by logicRegisterNode via EmitSystemStartup (MEMQL_DEPLOYMENT_ID).
            - { name: MEMQL_DEPLOYMENT_ID, valueFrom: { fieldRef: { fieldPath: "metadata.labels['pod-template-hash']" } } }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50062" }
            # #1399: dial the Rollout-managed ACTIVE bff (color-pinned), not the
            # unscoped `bff` Service, so this leaf's parent stream never lands on
            # a draining old-color pod during a blue/green cutover.
            - { name: MEMQL_PARENT_ADDRESS, value: "bff-active:50058" }
            # The bff's plain-HTTP address (NOT bff:50051 gRPC) -- see the file
            # header. Registered in scripts/secrets/manifest.yaml (component: edge).
            - { name: MEMQL_EDGE_API_TARGET, value: "http://bff-http:8085" }
            # Backstop TTL behind the change-feed invalidation -- see the file
            # header. Registered in scripts/secrets/manifest.yaml (component: edge).
            - { name: MEMQL_EDGE_SITE_CACHE_TTL_SECONDS, value: "30" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: MEMQL_SERVER_ADDRESS, value: "0.0.0.0:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            # Deployment-specific placeholder; a product stack's overlay patches the real host.
            - { name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.example.com" }
            - { name: MEMQL_IDENTITY_ENABLED, value: "true" }
            # Internal TLS: trust the cluster CA when calling https://identity:8085.
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: MEMQL_SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          # Slow boot (DSL load + mesh connect) must not trip liveness/readiness (#1117).
          startupProbe:
            httpGet: { path: /healthz, port: 8085 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            # /healthz is dependency- + drain-aware: a degraded/draining pod leaves
            # the Service WITHOUT being killed (#1117).
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # /livez is pure process-liveness (#1117): a transient dependency/mesh
            # blip never liveness-kills an otherwise-alive pod. Decoupled from
            # /healthz to stop rollout-triggered restart storms.
            httpGet: { path: /livez, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
# The public front door targets this Service (deploy/k8s/overlays/local/
# edge-front-door.yaml -> svc/edge:8085). Its absence is exactly what makes an
# unrouted hostname and a routed-but-undeployed hostname the same 404 -- see
# that file's header and docs/public/operate/front-door.md.
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: memql
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edge
  ports:
    - { name: node, port: 50062, targetPort: 50062 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
# Keep >=1 edge pod serving through voluntary disruptions (node drain,
# upgrade, rollout) now that it runs 2 replicas (#561).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge
  namespace: memql
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: memql
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
