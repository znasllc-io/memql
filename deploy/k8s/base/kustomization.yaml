# memQL backend cluster on AKS (epic znasllc-io/memql#522) -- the BASE.
#
# deployment-v2 Phase 1 (#699): do NOT apply this base directly. The committed
# overlay deploy/k8s/overlays/<env> is the single image authority -- it pins
# every image by @sha256: digest. Apply/reconcile the OVERLAY. The :tags carried
# in the base manifests below are human-readable placeholders only; the overlay's
# images: transformer replaces them with the pinned digest.
#
# NO database resource: staging/prod use the managed Tiger Cloud DB
# (xahn9ru4v6) via the MEMQL_DATABASE_DSN (transaction pooler) +
# MEMORY_NODES_DATABASE_DIRECT_DSN (direct) keys in memql-secrets (#1925).
#
# The `memql-secrets` Secret is intentionally NOT listed here -- it carries
# real values and is created out-of-band (see secret.example.yaml). Create it
# BEFORE applying this kustomization so the pods can mount it. $POOLER_DSN is
# the transaction-pooler string (tsdb_transaction:39578).
#
#   kubectl apply -f deploy/k8s/namespace.yaml
#   kubectl create secret generic memql-secrets -n memql \
#     --from-literal=MEMQL_MASTER_KEY="$MEMQL_MASTER_KEY" \
#     --from-literal=MEMQL_GENESIS_B64="$(base64 < ~/.memql/genesis.znas)" \
#     --from-literal=MEMQL_DATABASE_DSN="$POOLER_DSN" \
#     --from-literal=MEMORY_NODES_DATABASE_DIRECT_DSN="$(tiger db connection-string xahn9ru4v6 --with-password)"
#   kubectl apply -k deploy/k8s/overlays/staging   # digest-pinned (#699)
#
# identity comes up first (runs the one-time migration + serves JWKS); the
# other nodes' verifiers retry JWKS non-fatally until it is ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - namespace.yaml
  # Shared Postgres connection-pool bounds (MAX_OPEN_CONNS / MAX_IDLE_CONNS)
  # consumed via envFrom: configMapRef on every DB-connecting node, so the
  # whole mesh stays under Tiger Cloud's max_connections during a rollout
  # (znasllc-io/memql#1858).
  - db-pool-config.yaml
  - identity.yaml
  - bff.yaml
  - cognition.yaml
  - voice.yaml
  - agent.yaml
  - planner.yaml
  - workbench.yaml
  # Remote MCP protocol head (engine-built; epic memql#1550). Exposed publicly
  # via the mcp.staging.copresent.ai ingress in public-entry.yaml.
  - mcp.yaml
  - copresent.yaml
  # Public HTTPS entry (needs ingress-nginx + cert-manager installed first;
  # see README-public-entry.md).
  - public-entry.yaml
  # Self-hosted LiveKit server + its ESO-synced secret (memql#1043).
  - livekit.yaml
  - externalsecret-livekit.yaml
  # Telephony (memql#1910): Redis for server<->sip coordination, the
  # livekit/sip PSTN edge, and the carrier-credential ESO secret.
  - redis.yaml
  - livekit-sip.yaml
  - externalsecret-telephony.yaml
  # Go voice-agent -- assistant's voice participant in LiveKit rooms (memql#1049).
  - voice-agent.yaml
  # Connection-budget monitor: */5 leak/storm early-warning (memql#1958).
  - conn-monitor-cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: memql
    includeSelectors: false
