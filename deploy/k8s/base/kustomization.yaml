# MemQL backend cluster on AKS (epic znasllc-io/memql#522) -- the BASE.
#
# deployment-v2 Phase 1 (#699): do NOT apply this base directly. The committed
# overlay deploy/k8s/overlays/<env> is the single image authority -- it pins
# every image by @sha256: digest. Apply/reconcile the OVERLAY. The :tags carried
# in the base manifests below are human-readable placeholders only; the overlay's
# images: transformer replaces them with the pinned digest.
#
# NO database resource HERE, and that is a composition choice rather than an
# absence (epic memql#3842 / #3848). The cluster runs a self-hosted
# CloudNativePG database, composed by the overlay from
# deploy/k8s/components/cnpg-db with a tier preset -- so a deployment picks its
# own size without a bespoke manifest. Nodes reach it through the
# MEMQL_DATABASE_DSN + MEMORY_NODES_DATABASE_DIRECT_DSN keys in memql-secrets
# (#1925), both pointing at CNPG's -rw Service.
#
# THE NAMESPACE IS A VALUE. The `namespace: memql` below is the base's default
# and an overlay may override it; kustomize's namespace transformer rewrites
# both `metadata.namespace` on every resource here AND `metadata.name` on
# namespace.yaml, so no overlay needs a namespace-bearing manifest of its own.
#
# WHAT THIS BUYS ONLY IF NOTHING BREAKS IT: every intra-mesh address below is a
# BARE Service name (`identity:50061`, `bff-active:50058`), resolved by
# same-namespace cluster DNS. A fully-qualified `<svc>.memql.svc.cluster.local`
# anywhere in this base would pin the mesh to one namespace and resolve ACROSS
# an install boundary if a second one ever shared the cluster -- so it fails
# silently and in the worst direction. There is a render gate on it
# (deploy/k8s/overlays/render_cloud_test.go).
#
# The `memql-secrets` Secret is intentionally NOT listed here -- it carries
# real values and is created out-of-band (see secret.example.yaml), PER
# NAMESPACE. Create it BEFORE applying an overlay so the pods can mount it.
# $POOLER_DSN is now the same -rw address (no pooler in the path today).
#
#   kubectl create secret generic memql-secrets -n memql \
#     --from-literal=MEMQL_MASTER_KEY="$MEMQL_MASTER_KEY" \
#     --from-literal=MEMQL_IDENTITY_SIGNING_KEY_B64="$(make identity-signing-key)" \
#     --from-literal=MEMQL_DATABASE_DSN="$POOLER_DSN" \
#     --from-literal=MEMORY_NODES_DATABASE_DIRECT_DSN="postgres://memql:<pw>@memql-db-rw:5432/memql"
#   kubectl apply -k deploy/k8s/overlays/cloud   # digest-pinned (#699); creates the namespace
#
# identity comes up first (runs the one-time migration + serves JWKS); the
# other nodes' verifiers retry JWKS non-fatally until it is ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - namespace.yaml
  # Shared Postgres connection-pool bounds (MAX_OPEN_CONNS / MAX_IDLE_CONNS)
  # consumed via envFrom: configMapRef on every DB-connecting node, so the
  # whole mesh stays under the database's max_connections during a rollout
  # (znasllc-io/memql#1858).
  - db-pool-config.yaml
  # The engine's workload identity: the memql-engine ServiceAccount every
  # engine Deployment runs as, and the (empty) ConfigMap the cloud overlay
  # fills with the four Anthropic federation ids (memql#4336). Listed before
  # the Deployments that reference it for readability only -- kustomize does
  # not order-apply.
  - anthropic-federation.yaml
  - identity.yaml
  # RBAC for the deploy console's in-cluster substrate (memql#4257).
  - identity-rbac.yaml
  # RBAC for custom domains (epic memql#4805): the two object kinds a bound
  # client domain needs -- an exact-host Ingress and a cert-manager
  # Certificate -- in this namespace, bound to the memql-engine ServiceAccount
  # every engine Deployment already runs as.
  - custom-domain-rbac.yaml
  - agent.yaml
  - planner.yaml
  - workbench.yaml
  # Site edge -- serves every hosted site (the portal is site #1) behind the
  # `*.<domain>` and apex Ingress rules (memql#3700 / memql#3714).
  - edge.yaml
  # Remote MCP protocol head (engine-built; epic memql#1550). The public
  # HTTPS entry (ingress + cert-manager ClusterIssuer) that fronts this node
  # -- along with the product bff/SPA Services it used to sit beside -- is now
  # owned by the downstream product pack's overlay, not this engine base.
  - mcp.yaml
  # Redis. Its only consumer was the LiveKit server <-> livekit/sip pair, both
  # removed with the voice node type; retained pending an explicit decision to
  # drop it (nothing in this tree dials it today).
  # Connection-budget monitor: */5 leak/storm early-warning (memql#1958).
  - conn-monitor-cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: memql
    includeSelectors: false
