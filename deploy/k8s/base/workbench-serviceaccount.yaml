# The workbench alone receives the pipeline runner's Kubernetes grant.
# The engine prefix also matches the existing Anthropic subject-prefix rule.
# OpenAI needs this exact subject in the existing mapping's explicit allowlist
# before rollout. Keep the provider and target account; do not create a second
# mapping for that pair. See the federation runbook. No provider keys are copied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memql-engine-workbench
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
    app.kubernetes.io/name: workbench
automountServiceAccountToken: true
