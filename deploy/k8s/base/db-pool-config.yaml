# Shared Postgres connection-pool bounds for every DB-connecting node
# (znasllc-io/memql#1858).
#
# WHY THIS EXISTS
# Every staging deploy tripped a Postgres connection-exhaustion storm
# (SQLSTATE=53300 -- "remaining connection slots are reserved for roles with
# privileges of the pg_use_reserved_connections role"). Root cause: the
# per-pod database/sql pool was never bounded by env, so each node fell back
# to the engine's conservative-but-still-too-high default and -- multiplied by
# the steady mesh fleet PLUS the rollout surge -- the transient connection
# count blew past Tiger Cloud staging's small max_connections ceiling.
#
# These keys carry the MEMORY_NODES_DATABASE_ prefix because the memory-nodes
# database reads its pool config through that env prefix
# (component/database/memory-nodes/database.go: memoryNodesDatabaseEnvPrefix);
# the bare MAX_OPEN_CONNS / MAX_IDLE_CONNS names are NOT read.
#
# CONNECTION BUDGET: calculate from the rendered instance and live database.
# This ConfigMap caps only the memory-nodes MAIN pool. When DIRECT_DSN is set,
# component/database/database.go opens a separate pool capped at 4, and startup
# migrations can open one additional connection per process. With main=4, allow
# up to 9 connections per process; other independent pools add to that bound.
#
# Count every engine and product workload sharing the database, active Jobs,
# scheduled monitors, operator/backup headroom, and PostgreSQL reserved slots.
# During a roll include old pods still terminating, new replicas AND surge;
# maxSurge alone does not bound connections held by terminating processes.
# A conservative rolling bound per Deployment is (2 * replicas + surge) * 9.
# Compare the combined bound with the instance's actual max_connections, not
# the historical Tiger Cloud ceiling or a different engine preset's settings.
# The ZNAS instance maintains its evaluated budget and refusal gate in its own
# docs/database-reliability.md and scripts/dev/database-budget.py
# (znasllc-io/memql-znas#110).
# Generic guidance: docs/public/operate/db-connection-budget.md.
#
# Idle is held at 2 (not 0/1) so a steadily-busy node keeps a small warm pool
# without round-tripping a fresh TCP+TLS connect per query, while idle nodes
# release back toward 2 rather than pinning 10. Lifetime/idle-time rotation
# (ConnMaxLifetime 1h, ConnMaxIdleTime 2min) is set in the engine default and
# is unchanged here.
#
# Per-instance override: patch these values only after checking that instance's
# full connection budget. Raising max_connections also consumes database memory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: memql-db-pool
  namespace: memql
  labels:
    app.kubernetes.io/name: memql-db-pool
    app.kubernetes.io/part-of: memql
data:
  MEMORY_NODES_DATABASE_MAX_OPEN_CONNS: "4"
  MEMORY_NODES_DATABASE_MAX_IDLE_CONNS: "2"
