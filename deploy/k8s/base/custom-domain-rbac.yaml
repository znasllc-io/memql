# RBAC for custom domains (epic memql#4805, design D6) AND for account front
# doors (epic memql#5168, design E), which need no grant of their own.
#
# TWO FEATURES, ONE ROLE, AND THAT IS DELIBERATE. A reserved MemQL name is
# provisioned by the same reconciler package, as the same ServiceAccount, in the
# same namespace, writing the same two kinds -- it just writes five objects
# instead of two (one Certificate naming three hosts, and four Ingresses,
# because api. needs one per backend protocol). A second Role would grant
# exactly this set again under another name, so the only thing it would add is
# a second place to forget when the set changes.
#
# The object names differ (`account-front-door-<accountId>` rather than
# `custom-domain-<domainId>`) and the field manager differs
# (`memql-account-front-door`), which is what lets `kubectl get -o yaml` say
# which of the two reconcilers owns a field. Neither is a permission boundary,
# and the paragraph on resourceNames below explains why there could not be one.
#
# WHAT THIS GRANTS, AND WHY IT IS THIS NARROW
#
# When a client's own domain has passed BOTH DNS checks, the reconciliation
# sweep provisions exactly two objects for it -- an exact-host Ingress that
# routes the hostname to the edge, and a cert-manager Certificate that gets it a
# certificate over HTTP-01 -- and removes the same two when the binding is taken
# down. That is the complete set of API calls this feature can make. Two kinds,
# one namespace, no wildcard verb, no wildcard resource, and no ClusterRole.
#
# The subjects are the shared engine and dedicated workbench identities.
# The automation cron leader can run on either; both retain this namespace-
# scoped grant. Pipeline Job/Secret access remains a separate workbench-only
# Role in memql-pipelines.
#
# WHY THE ENGINE REACHES THE API AT ALL, when the design specifies a capability
# script. The engine runtime image is gcr.io/distroless/base-debian12: no bash,
# no kubectl, and no scripts/ tree -- `.dockerignore` keeps deploy/k8s out of
# the build context and nothing mounts the repository. A sweep that could only
# dispatch the script would leave every binding in `issuing` forever on every
# deployed cluster while passing every test and running perfectly from a
# developer's shell. This is the same wall memql#4257 hit with deploy-control,
# and the same answer it reached: plain HTTPS to the API server with the pod's
# own ServiceAccount, which is what kubectl does underneath, minus kubectl.
# scripts/deploy/bind-custom-domain.sh remains the operator's path and the
# cockpit surface's, and applies the identical objects.
#
# NO client-go, deliberately and provably (design D2): no k8s.io dependency
# exists anywhere in this workspace, and the substrate is
# component/deploycontrol.ClusterAPI -- net/http and the projected token.
#
# WHY create/update/patch/delete AND NOT resourceNames. The object names are
# derived per binding (`custom-domain-<domainId>`), so the set is not knowable
# when this file is written; Kubernetes RBAC also ignores resourceNames for
# `list`, which would make a rule read as narrower than it is. Two named kinds
# in the mesh's own namespace is the honest scope. What bounds the privilege is
# what the code does with it: two object shapes, both composed in Go from a
# hostname the graph has already verified.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memql-custom-domain
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
    app.kubernetes.io/name: custom-domain
rules:
  # The route. `get` is what makes the apply idempotent and what reads back
  # what is actually there; `delete` is the unbind half.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # The certificate. `get` is load-bearing beyond the apply: `issuing` becomes
  # `live` ONLY when a read of this object's Ready condition says so, because
  # applying a Certificate is not the same as holding one -- a status that went
  # live on the apply would tell somebody their domain was serving while
  # browsers were still being handed the controller's self-signed default.
  #
  # NOTE what is absent: no grant on `secrets`. The TLS Secret cert-manager
  # writes is read by the ingress controller, never by the engine, and a grant
  # to read certificate private keys is not one this feature needs to do its
  # job.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memql-custom-domain
  namespace: memql
  labels:
    app.kubernetes.io/part-of: memql
    app.kubernetes.io/name: custom-domain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memql-custom-domain
subjects:
  - kind: ServiceAccount
    name: memql-engine
    namespace: memql
  - kind: ServiceAccount
    name: memql-engine-workbench
    namespace: memql
