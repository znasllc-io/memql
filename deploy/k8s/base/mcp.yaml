# MCP node -- remote Model Context Protocol head (epic memql#1550, child C).
#
# Engine-built (BUILD_TAGS=mcp, no product DSL -- it exposes the MemQL engine
# tool surface, not a product pack's DSL). It stands up the standard base
# surface every node has (MemqlService gRPC + the :8085 HTTP /healthz//readyz/
# /livez server) PLUS the MCP Streamable HTTP protocol head on :8090
# (POST/GET/DELETE /mcp), selected by MEMQL_MCP_TRANSPORT=http.
#
# AUTH (MANDATORY, default-deny): /mcp is wrapped with the identity bearer-JWT
# verifier (same JWKS path workbench/agent use). No valid token -> 401 before
# any engine work. The acting user/role for a session is derived from the
# verified token claims (MEMQL_MCP_ROLE/USER are left UNSET here so each caller
# acts as themselves, not a shared pinned identity). This endpoint can author
# DSL + run mutations/automations, so it must never be reachable unauthenticated.
#
# CAPABILITY TIER: MEMQL_MCP_MODE=authoring (Gate A; owner decision 2026-06-16)
# -- the named tool surface + session-scoped `define`. `define`/`promote` and
# inline DSL stay gated by the caller's role (Gate B) on top of the tier.
#
# HA (2 replicas) WITH STICKY SESSIONS: an MCP session (Mcp-Session-Id) maps to
# an in-process *mcp.Server on ONE pod, so a follow-up request MUST return to
# the pod that created the session. The public-entry ingress (staging-mcp) pins
# this with nginx cookie session-affinity (affinity: cookie, cookie `mcp_route`,
# SameSite=None; Secure so the cross-origin connector echoes it): the first /mcp
# response sets the route cookie for the serving pod, and every subsequent
# request (POST calls + the GET SSE channel) carries it back to that pod. With
# stickiness in place we run >1 replica for availability.
#
# TLS: the public-entry ingress (the product MCP host) terminates TLS and
# forwards plain HTTP to :8090, so this node serves the head over plain HTTP
# internally (unlike identity, which serves its own internal TLS). It still
# mounts memql-ca so the verifier can call https://identity:8085 for JWKS.
#
# No DB migrations (identity owns the one-time migration). No mesh parent: like
# identity, the head runs its own in-process engine against the shared DB and
# does not dial a parent (engine node, no cross-node product forwarding).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: memql
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/part-of: memql
    memql/node-type: mcp
spec:
  replicas: 2
  revisionHistoryLimit: 1   # keep active + 1 previous (rollback); auto-GC older RS (#1858 cleanup)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Drain old before starting new so a roll doesn't transiently double this
      # node's Postgres pools and overshoot max_connections (memql#1858).
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp
        app.kubernetes.io/part-of: memql
        memql/node-type: mcp
    spec:
      serviceAccountName: memql-engine
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
        # ONLY ca.crt. cert-manager issues memql-ca as a kubernetes.io/tls
        # Secret carrying tls.crt, tls.key AND ca.crt, and a volume with no
        # `items:` projects EVERY key -- which would put the internal CA's
        # PRIVATE KEY inside this pod, with SSL_CERT_DIR scanning it. The
        # openssl path (make secrets) produces ca.crt alone, so the selector is
        # correct for both and the two remain interchangeable (memql#4484).
            items:
              - { key: ca.crt, path: ca.crt }
        # The pod's OWN identity, minted for Anthropic and nobody else
        # (memql#4336). audience is what makes this token non-interchangeable
        # with the default kube-api-access one: Anthropic verifies it against
        # the cluster's public OIDC JWKS and refuses a token minted for
        # anything but itself. expirationSeconds bounds the blast radius of a
        # leaked assertion to an hour, and kubelet re-projects the file in
        # place -- the SDK re-reads it on every exchange, so rotation needs no
        # restart. It costs nothing on a cluster that is not federating.
        - name: anthropic-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://api.anthropic.com
                  expirationSeconds: 3600
                  path: token
      # Graceful shutdown (#552): must exceed MEMQL_SHUTDOWN_DRAIN_DELAY (5s
      # default) + the app Stop budget (30s) so drain + GracefulStop finish.
      terminationGracePeriodSeconds: 45

      containers:
        - name: mcp
          image: acrmemql.azurecr.io/memql-mcp:0.9.60
          # preStop drain (memql#1817): pause before SIGTERM so the node
          # deregisters and its DB pool closes gracefully instead of being
          # SIGKILLed at the grace deadline and orphaning Postgres backends.
          lifecycle:
            preStop:
              # The NATIVE sleep action, not `exec: /bin/sh -c sleep 5`. The
              # runtime image is distroless and has no shell, so the exec form
              # fails on every drain -- silently, because a failed preStop is
              # logged as an event and the pod is terminated anyway. Requires
              # k8s >= 1.30 (GA 1.32); the local cluster pins v1.32.
              sleep:
                seconds: 5
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50060 }
            - { name: mcp, containerPort: 8090 }
          envFrom:
            - secretRef:
                name: memql-secrets
            # The four Anthropic federation ids. optional: true because the
            # base ships them EMPTY and the local overlay leaves them that
            # way; a cluster that never applied the ConfigMap still boots.
            - configMapRef:
                name: memql-anthropic-federation
                optional: true
            # Bounded Postgres pool (MAX_OPEN_CONNS/MAX_IDLE_CONNS) so the
            # mesh stays under max_connections during a rollout (memql#1858).
            - configMapRef:
                name: memql-db-pool
          env:
            - { name: MEMQL_SERVICE_NAME, value: "MemQL" }
            - { name: MEMQL_AI_ANTHROPIC_IDENTITY_TOKEN_FILE, value: "/var/run/secrets/anthropic.com/token" }
            - { name: MEMQL_NODE_TYPE, value: "mcp" }
            - { name: MEMQL_NODE_ADDRESS, value: "mcp:50060" }
            # Unique per-pod mesh identity (#1042). Overrides the shared genesis
            # MEMQL_NODE_ID=bff-local (set-if-absent) so PeerManager keys each
            # node distinctly.
            - { name: MEMQL_NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            # Deployment id (#1873): ties this node's v1:cluster:node row to the
            # deploy that created it. pod-template-hash is unique per rollout
            # revision, so every pod of one deploy shares it and a pod left over
            # from a previous deploy carries a different value -- the orphan
            # signal nodesNotInDeployment surfaces. Stamped at registration
            # by logicRegisterNode via EmitSystemStartup (MEMQL_DEPLOYMENT_ID).
            - { name: MEMQL_DEPLOYMENT_ID, valueFrom: { fieldRef: { fieldPath: "metadata.labels['pod-template-hash']" } } }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50060" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: MEMQL_SERVER_ADDRESS, value: "0.0.0.0:8085" }
            # --- MCP remote transport (child B env surface) ---
            - { name: MEMQL_MCP_TRANSPORT, value: "http" }
            - { name: MEMQL_MCP_HTTP_ADDR, value: ":8090" }
            # OAuth discovery (RFC 9728): this resource's public base URL,
            # advertised in /.well-known/oauth-protected-resource + the 401
            # WWW-Authenticate resource_metadata hint. AuthServerURL falls back
            # to MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER set below.
            #
            # Not pinned here (memql#3704): component/envregistry/domain.go derives
            # it set-if-absent as "https://mcp." + MEMQL_DOMAIN, the same
            # mechanism the identity URLs below rely on. A deployment that sets
            # MEMQL_DOMAIN gets this for free; one that sets neither MEMQL_DOMAIN
            # nor its own MEMQL_MCP_PUBLIC_URL runs with it unset -- registered
            # optional: true, so empty is the honest failure rather than a
            # placeholder host nothing resolves.
            # Capability tier (Gate A). authoring = named tools + session-scoped
            # define; role gate (Gate B) still applies on top. Owner-confirmed.
            - { name: MEMQL_MCP_MODE, value: "authoring" }
            # MEMQL_MCP_ROLE / MEMQL_MCP_USER intentionally UNSET: the acting
            # identity is taken from the caller's verified token claims, so every
            # caller acts as themselves rather than a shared pinned identity.
            # --- identity verifier (bearer-JWT auth for /mcp) ---
            - { name: MEMQL_IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            # Deployment-specific placeholder; a product stack's overlay patches the real host.
            - { name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.example.com" }
            - { name: MEMQL_IDENTITY_ENABLED, value: "true" }
            # Internal TLS: trust the cluster CA when calling https://identity:8085.
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: MEMQL_SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
            - { name: anthropic-identity, mountPath: /var/run/secrets/anthropic.com, readOnly: true }
          # Slow boot (DSL load + engine init) must not trip liveness/readiness (#1117).
          # Probes target the standard :8085 server (createHTTPServer), same as
          # every other node -- /healthz is dependency- + drain-aware, /livez is
          # pure process-liveness.
          startupProbe:
            httpGet: { path: /healthz, port: 8085 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: memql
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - { name: node, port: 50060, targetPort: 50060 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
    # The public ingress (the product MCP host) targets this port.
    - { name: mcp, port: 8090, targetPort: 8090 }
