        export GOTOOLCHAIN=go1.26.6 GOWORK=off GOFLAGS=-p=2 GOMAXPROCS=2
        python3 scripts/ci/prepare.py
        cd .memql-ci/memql-cockpit
        test "$(go env GOOS)/$(go env GOARCH)" = darwin/amd64
        env -u GOFLAGS make cockpit-computeruse-host
        ./scripts/macos/package-menubar.sh --arch=amd64
        python3 scripts/macos/package_test.py --archive=dist/memql-menubar-darwin-amd64.tar.gz
        ./scripts/macos/package-app.sh --worker="$PWD/bin/memql-computeruse-darwin-amd64" --arch=amd64
        python3 scripts/macos/app_package_test.py --archive=dist/memql-app-darwin-amd64.tar.gz
        mkdir -p sbom
        go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
        export PATH="$(go env GOPATH)/bin:$PATH"
        for asset in bin/memql-*; do
          name=$(basename "$asset")
          cyclonedx-gomod bin -version "$(cat VERSION)" -json -output "sbom/$name.cdx.json" "$asset"
          cyclonedx-gomod bin -version "$(cat VERSION)" -output "sbom/$name.cdx.xml" "$asset"
        done
    - name: computeruse-linux-arm64
      placement: fleet
      timeout: 60m
      execution: native
      platform: linux/arm64
      artifacts:
      - .memql-ci/memql-cockpit/bin
      - .memql-ci/memql-cockpit/sbom
      run: |
        set -eu
        export GOTOOLCHAIN=go1.26.6 GOWORK=off GOFLAGS=-p=2 GOMAXPROCS=2
        python3 scripts/ci/prepare.py
        cd .memql-ci/memql-cockpit
        test "$(go env GOOS)/$(go env GOARCH)" = linux/arm64
        env -u GOFLAGS make cockpit-computeruse-host
        mkdir -p sbom
        go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
        export PATH="$(go env GOPATH)/bin:$PATH"
        for asset in bin/memql-*; do
          name=$(basename "$asset")
          cyclonedx-gomod bin -version "$(cat VERSION)" -json -output "sbom/$name.cdx.json" "$asset"
          cyclonedx-gomod bin -version "$(cat VERSION)" -output "sbom/$name.cdx.xml" "$asset"
        done
    - name: computeruse-linux-amd64
      placement: fleet
      timeout: 60m
      execution: native
      platform: linux/amd64
      artifacts:
      - .memql-ci/memql-cockpit/bin
      - .memql-ci/memql-cockpit/sbom
      run: |
