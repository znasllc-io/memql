          cpuMilli: 3000
          memoryMiB: 8192
          timeout: 90m
          imageBuild:
            context: .
            dockerfile: Dockerfile
            target: runtime
            args:
              BUILD_TAGS: agent
              SPA_DIST_STAGE: spa-skip
              GOFLAGS: -p=2
              GOMEMLIMIT: 1GiB
              GOGC: "75"
        - name: planner
          placement: cluster
          caches: []
          cpuMilli: 3000
          memoryMiB: 8192
          timeout: 90m
          imageBuild:
            context: .
            dockerfile: Dockerfile
            target: runtime
            args:
              BUILD_TAGS: planner
              SPA_DIST_STAGE: spa-skip
              GOFLAGS: -p=2
              GOMEMLIMIT: 1GiB
              GOGC: "75"
        - name: workbench
          placement: cluster
