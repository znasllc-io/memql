          imageBuild:
            context: .
            dockerfile: Dockerfile
            target: runtime
            args:
              BUILD_TAGS: mcp
              SPA_DIST_STAGE: spa-skip
              GOFLAGS: -p=2
              GOMEMLIMIT: 1GiB
              GOGC: "75"
        - name: agent
          placement: cluster
