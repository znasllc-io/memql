# gitleaks configuration for memQL
#
# Wired into CI in a follow-up (Wave 2 of the pre/post-OSS security audit, see
# issue #91). This file establishes the baseline and documents the known false
# positives so the audit history stays explicit.

title = "memQL gitleaks config"

[extend]
# Inherit the upstream default rule set.
useDefault = true

# -----------------------------------------------------------------------------
# Allowlists
# -----------------------------------------------------------------------------
# Each allowlist uses condition = "AND" so that BOTH the regex AND the path
# constraint must match before a finding is suppressed. This keeps the
# suppression narrow: the literal dev credential is OK in compose / docs /
# dev-scripts, but the same string appearing in Go source or anywhere else
# still trips the scanner.

[[allowlists]]
description    = "Local Postgres dev credentials (memql_dev). Dev-only; not a production fallback -- see issue #85. Allowed in Docker Compose files, dev scripts, the local k3d overlay and seed-secrets script, and documentation."
condition      = "AND"
regexTarget    = "match"
regexes        = ['''memql_dev''']
paths = [
  '''^docker/docker-compose\..*\.ya?ml$''',
  '''^docker/README\.md$''',
  '''^scripts/dev/.*''',
  '''^scripts/k3d/.*''',
  '''^deploy/k8s/overlays/local/.*''',
  '''^Makefile$''',
  '''^CLAUDE\.md$''',
  '''^DEPLOYMENT_STRATEGY\.md$''',
  '''^GLOSSARY\.md$''',
  '''^QUICKSTART\.md$''',
  '''^README\.md$''',
  '''^TECH_STACK_AND_PRACTICES\.md$''',
]

[[allowlists]]
description    = "Azurite well-known dev storage account key (memql#806). Public constant documented by Microsoft at https://learn.microsoft.com/azure/storage/common/storage-use-azurite#well-known-storage-account-and-key -- not a production credential. Every Azurite install ships this same literal key. Also in the local k3d overlay (deploy/k8s/overlays/local/) and seed-secrets script (scripts/k3d/)."
condition      = "AND"
regexTarget    = "match"
regexes        = ['''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq''']
paths = [
  '''^docker/docker-compose\..*\.ya?ml$''',
  '''^scripts/dev/.*''',
  '''^scripts/k3d/.*''',
  '''^deploy/k8s/overlays/local/.*''',
]

[[allowlists]]
description    = "Dummy key-encryption-key literal in identity ephemeral-key guard tests. Not a credential -- a fake KEK used to assert the guard's behavior. Tripped the full-history `gitleaks git .` (generic-api-key) on the merge_group candidate and wedged the merge queue (memql#1539)."
condition      = "AND"
regexTarget    = "match"
regexes        = ['''encryption-secret-16b''']
paths = [
  '''^component/identity/.*_test\.go$''',
]

[[allowlists]]
description    = "Synthetic 64-char hex fixtures in the k3d seed-secrets master-key guard tests (memql#2958). Not credentials -- the guard asserts seed-secrets.sh only ever seeds a key matching ^[0-9a-fA-F]{64}$, so the test must carry literals of exactly that shape. Their entropy tripped generic-api-key on the full-history pass and wedged the merge queue repo-wide (memql#2996). Keyed on the SHAPE rather than the literals, so no fixture value is copied into this config; AND-scoped to the test path, so the same shape in a non-test file still trips the scanner (verified: identical value flagged in a non-test path, allowlisted in a _test.go one)."
condition      = "AND"
# Deliberately NO regexTarget: the pattern must apply to the extracted SECRET.
# Against "match" it would be tested against the surrounding `name = "..."`
# span, where an anchored shape regex can never fire -- the allowlist would
# silently do nothing.
regexes        = ['''^[0-9a-fA-F]{64}$''']
paths = [
  '''^scripts/k3d/.*_test\.go$''',
]
