# gitleaks configuration for MemQL
#
# Wired into CI in a follow-up (Wave 2 of the pre/post-OSS security audit, see
# issue #91). This file establishes the baseline and documents the known false
# positives so the audit history stays explicit.

title = "MemQL gitleaks config"

[extend]
# Inherit the upstream default rule set.
useDefault = true

# -----------------------------------------------------------------------------
# Rules
# -----------------------------------------------------------------------------
# The upstream default set knows nothing about MemQL's own credentials, so
# until memql#3962 this file's `useDefault = true` and zero custom rules meant
# every bearer token this platform mints was undetectable by its own secret
# scanner. A leaked PAT, worker token or recovery key would have passed the
# push lane, the PR lane and the weekly schedule alike.

[[rules]]
id          = "memql-credential-token"
description = "MemQL credential bearer token (mql_<kind>_<43 base64url chars>)"
# MATCH THE SHAPE, NOT THE CONSTANTS. Every MemQL credential minter draws 32
# CSPRNG bytes and encodes them with base64.RawURLEncoding, which is 43
# characters with no padding -- so one shape covers all of them, including the
# ones no constant declares. `mql_node_` is an inline literal at
# component/identity/http/node_bootstrap.go:501 and `mql_va_` an inline literal
# at subcommand_voice_agent_token.go:277; an enumeration of the declared
# `TokenPrefix` constants would have missed both.
#
# THE QUANTIFIER IS {2,5} AND THE LOWER BOUND IS LOAD-BEARING. The eight
# `mql_<letters>_` prefixes in the tree are, by length: va (2), acc/dvc/enr/pat/
# rec/wkr (3), acct/node (4). A {3,5} bound reads as safe and silently omits
# `mql_va_`, the voice-agent auxiliary bearer -- a real credential, hashed
# SHA-256 at rest exactly like the others. Do not tighten this bound.
#
# `mql_acc_` is the one non-credential in that list: a three-character negative
# fixture (`mql_acc_abc`) in component/identity/accounttoken/token_test.go. It
# cannot match, because it has 3 body characters where the rule demands 43.
# That is the whole reason the body length is pinned rather than open-ended:
# the prefix alone is a namespace, and only the prefix PLUS a 43-character
# body is a secret.
#
# Verified at authoring time (memql#3962): zero matches in the working tree,
# and `git log -G` over HEAD's whole ancestry finds no commit that ever added
# or removed a matching line -- so this rule needs no allowlist entry, and the
# full-history lane stays green. If a future fixture trips it, read the
# allowlist header below before touching the fixture.
regex    = '''mql_[a-z]{2,5}_[A-Za-z0-9_-]{43}'''
keywords = ["mql_"]
tags     = ["memql", "credential", "bearer-token"]

# -----------------------------------------------------------------------------
# Allowlists
# -----------------------------------------------------------------------------
# Two shapes of entry live here, and picking the wrong one is the mistake this
# comment exists to prevent (memql#3484).
#
#   PATH-SCOPED  -- condition = "AND" plus a `paths` list, so BOTH the regex and
#   the path must match. Correct when the regex matches a SHAPE rather than a
#   value: the AAGUID entry below is a bare UUID pattern, and unscoping it would
#   blind the scanner to every UUID-shaped secret in the repo. The dev-credential
#   entries are the same idea from the other direction -- `memql_dev` is fine in
#   compose and dev scripts and is not fine in Go source.
#
#   VALUE-KEYED  -- regex only, no `paths`. Correct when the literal identifies
#   ITSELF: a published RFC test vector, a fixture whose own name says PLANTED, a
#   JWT that decodes to an empty payload. Nothing is gained by also constraining
#   where it appears, and constraining it does active harm, because
#   `gitleaks git .` scans COMMITS: a path-scoped suppression stops matching the
#   moment the file moves, and the historical finding comes back.
#
# The value-keyed entries carry no `condition` because with `paths` gone there
# is one criterion, and naming AND or OR would imply a constraint that is not
# there.
#
# HISTORICAL FINDINGS CANNOT BE FIXED BY EDITING THE FILE. See the note in
# .github/workflows/gitleaks.yml. If a fixture of yours turns the push lane red,
# the fix is an entry here, not a change to the fixture -- three separate people
# have now tried the second thing (memql#3484).

[[allowlists]]
description    = "Local Postgres dev credentials (memql_dev). Dev-only; not a production fallback -- see issue #85. Allowed in Docker Compose files, dev scripts, the local k3d overlay and seed-secrets script, and documentation."
condition      = "AND"
regexTarget    = "match"
regexes        = ['''memql_dev''']
paths = [
  '''^docker/docker-compose\..*\.ya?ml$''',
  '''^docker/README\.md$''',
  '''^scripts/dev/.*''',
  '''^scripts/k3d/.*''',
  '''^deploy/k8s/overlays/local/.*''',
  '''^Makefile$''',
  '''^CLAUDE\.md$''',
  '''^DEPLOYMENT_STRATEGY\.md$''',
  '''^GLOSSARY\.md$''',
  '''^QUICKSTART\.md$''',
  '''^README\.md$''',
  '''^TECH_STACK_AND_PRACTICES\.md$''',
]

[[allowlists]]
description    = "Azurite well-known dev storage account key (memql#806). Public constant documented by Microsoft at https://learn.microsoft.com/azure/storage/common/storage-use-azurite#well-known-storage-account-and-key -- not a production credential. Every Azurite install ships this same literal key. Also in the local k3d overlay (deploy/k8s/overlays/local/) and seed-secrets script (scripts/k3d/)."
condition      = "AND"
regexTarget    = "match"
regexes        = ['''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq''']
paths = [
  '''^docker/docker-compose\..*\.ya?ml$''',
  '''^scripts/dev/.*''',
  '''^scripts/k3d/.*''',
  '''^deploy/k8s/overlays/local/.*''',
]

[[allowlists]]
description    = "Dummy key-encryption-key literal in identity ephemeral-key guard tests. Not a credential -- a fake KEK used to assert the guard's behavior. Tripped the full-history `gitleaks git .` (generic-api-key) on the merge_group candidate and wedged the merge queue (memql#1539)."
condition      = "AND"
regexTarget    = "match"
regexes        = ['''encryption-secret-16b''']
paths = [
  '''^component/identity/.*_test\.go$''',
]

[[allowlists]]
description    = "WebAuthn AAGUIDs in the authenticator-name table (memql#3409). An AAGUID is an authenticator's PUBLIC make/model identifier, published by vendors through the FIDO Metadata Service and reproduced in the open passkey-authenticator-aaguid dataset -- the same twelve literals appear in every WebAuthn implementation on the internet. They are the OPPOSITE of a secret: the file's own header records that they are display-only and never authorization, because under the `none` attestation this cluster accepts they are self-asserted. `generic-api-key` matches them purely on UUID shape. Scoped to the one file that holds the table, so a UUID appearing anywhere else -- including elsewhere in this package -- still trips the scanner."
condition      = "AND"
regexTarget    = "match"
regexes        = ['''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''']
paths = [
  '''^component/identity/webauthn/aaguid\.go$''',
]

# -----------------------------------------------------------------------------
# Value-keyed entries (memql#3484) -- no `paths`, deliberately. Each of these
# is a literal that identifies itself as a non-credential; see the header.
# -----------------------------------------------------------------------------

[[allowlists]]
description = "RFC 7636 Appendix B PKCE test vectors, used by the WebAuthn-login and SSO-PKCE tests. NOT a credential: both literals are PUBLISHED IN THE RFC as the worked example every OAuth implementation tests against, so an attacker holding them holds what the standards document hands out. Value-keyed with no `paths` (memql#3484): these are exact published strings, safe to suppress wherever they appear, and a path constraint would resurface the finding the moment the test file moves."
regexTarget = "match"
regexes = [
  '''dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk''',
  '''E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM''',
]

[[allowlists]]
description = "Redaction-test fixture in the email status tests (memql#3484). NOT a credential: the value's own name records that it is PLANTED, and it exists so the test can assert the status path redacts it -- a real secret would defeat the test's purpose. An earlier attempt to fix this by renaming the constants in the tree did not clear it, because `gitleaks git .` scans commits."
regexTarget = "match"
regexes = ['''PLANTED-ROW-SECRET-c41d55''']

[[allowlists]]
description = "Elided RS256 JWT header in the runtime-panel docs (memql#3484). NOT a credential: `eyJhbGciOiJSUzI1NiIsImtpZCI6` is the base64 of {\"alg\":\"RS256\",\"kid\": -- byte-identical in EVERY RS256 JWT, carrying no claims and no signature. The regex is ANCHORED ON THE TRAILING LITERAL `...`, so it matches only the elided form: a real token continues past that prefix with its own payload, produces a different match, and still trips the scanner."
regexTarget = "match"
regexes = ['''eyJhbGciOiJSUzI1NiIsImtpZCI6\.\.\.''']

[[allowlists]]
description = "Synthetic JWT fixture in the VS Code cluster-registration tests (memql#3484). NOT a credential: it decodes to {\"alg\":\"RS256\"} . {} . the literal string `sig` -- an empty payload and a three-character signature. It names no subject, carries no claim, and authorizes nothing. The tree spelling was later split across a newline to dodge the regex; that did not clear the historical finding, which is what this entry is for."
regexTarget = "match"
regexes = ['''eyJhbGciOiJSUzI1NiJ9\.e30\.sig''']

[[allowlists]]
description = "Anthropic's federation beta-header VALUES (memql#4333). `oidc-federation-2026-04-01` and `oauth-2025-04-20` are the two published `anthropic-beta` opt-in strings the SDK sends on EVERY workload-identity token exchange -- protocol version labels, the OPPOSITE of a secret: an implementation that does not transmit them in the clear cannot federate at all. They are hard-coded as exported constants in the vendored SDK (config/federation.go) and appear in Anthropic's public documentation; `generic-api-key` matches the first purely on the entropy of a hyphenated date-stamped label. Value-keyed with no `paths` (memql#3484): they are exact published strings, so suppressing them wherever they appear is safe, and a path constraint would resurface the finding the moment the design doc or the exchange test moves -- which is not hypothetical here, since one of the two hits is in a spec file and `gitleaks git .` scans commits."
regexTarget = "match"
regexes = [
  '''oidc-federation-2026-04-01''',
  '''oauth-2025-04-20''',
]

[[allowlists]]
description = "Fake magic-link token in the VS Code install-receipt test. NOT a credential: `abcdef0123456789abcdef0123456789` is a counting sequence, and the test it appears in (`editors/vscode/test/receiptSecrets.test.ts`) exists to assert that install receipts do NOT carry live credentials -- the commit that introduced it is literally `fix(install): stop writing live credentials into the install receipt`. A real token there would defeat the test's purpose. Value-keyed with no `paths` (memql#3484): the literal is a self-identifying counting sequence, and `gitleaks git .` scans COMMITS, so the tree spelling has already changed and the historical finding survives it -- which is what this entry is for."
regexTarget = "match"
regexes = [
  '''abcdef0123456789abcdef0123456789''',
]

[[allowlists]]
description = "Secret-key FINGERPRINT in the backup format fixture. NOT a credential and not truncated key material: `secretKeyFingerprint` is the 4-character-style display hash `component/secret/encryption.go` emits so a UI can say WHICH key encrypted a row without showing it, and this occurrence is in `component/backup/testdata/format-v1.jsonl`, a golden fixture for the v1 manifest shape. `generic-api-key` matches it purely on the entropy of 16 hex characters. Value-keyed rather than path-scoped so a renamed or relocated fixture does not resurface the historical finding."
regexTarget = "match"
regexes = [
  '''3f6a1c9d20b74e58''',
]

[[allowlists]]
description = "Placeholder key-encryption-key in the custom-local-domain PLAN document. NOT a credential: `0123456789abcdef0123` is a counting sequence in a Go snippet inside `docs/superpowers/plans/2026-08-12-custom-local-domain.md`, illustrating the branch of an identity guard -- and the line above it in the same snippet says `SigningKeyB64 unset -- the branch the guard lives in`. It is documentation of a code path, not configuration of one. Same value-keyed reasoning as the dummy KEK entry above it, which is the same class of literal in the test that plan describes."
regexTarget = "match"
regexes = [
  '''0123456789abcdef0123''',
]

[[allowlists]]
description = "MemQL OS per-app settings-store keys (epic memql#4819). NOT credentials: `memql-os-<app>-v1` is the localStorage KEY NAME a per-app settings store writes under -- the string a browser looks a document up by, not anything in the document. Every OS app declares one under the same house pattern (`ACCOUNTS_SETTINGS_KEY`, `FILES_SETTINGS_KEY`, `DEPLOYABLES_SETTINGS_KEY`, ...), and `generic-api-key` matched exactly one of them, the campaigns app's, purely on the entropy of a longer hyphenated label -- so the finding is about the app's NAME LENGTH rather than about anything the value contains. Value-keyed with no `paths` (memql#3484): the literal identifies itself, the pattern is closed and app-scoped, and a path constraint would resurface the finding the moment a settings module moves or the seventh app is named something a syllable longer. Renaming the value to dodge the entropy check was the alternative and is worse: it would leave one app spelling its key differently from six siblings for a reason nothing in the code records, and `gitleaks git .` scans COMMITS, so the historical finding would survive the rename anyway."
regexTarget = "match"
regexes = ['''memql-os-[a-z]+-v[0-9]+''']
