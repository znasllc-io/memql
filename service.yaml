apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: SERVICE_NAME_PLACEHOLDER
  labels:
    cloud.googleapis.com/location: REGION_PLACEHOLDER
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8085
          env:
            # --- SECRETS (Mapped to Google Secret Manager) ---
            - name: MEMORY_NODES_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: DSN_SECRET_PLACEHOLDER
                  key: 'latest'
            - name: MEMORY_NODES_VISIONARYS_LAB_CONTENTID_SALT
              valueFrom:
                secretKeyRef:
                  name: CONTENTID_SALT_SECRET_PLACEHOLDER
                  key: 'latest'
            - name: MEMQL_SI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: MEMQL_SI_OPENAI_API_KEY
                  key: 'latest'
            - name: MEMQL_SI_OPENAI_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: MEMQL_SI_OPENAI_PROJECT_ID
                  key: 'latest'
            # Identity verifier: every non-identity binary points at
            # the identity service's public origin to fetch JWKS.
            - name: IDENTITY_VERIFIER_BASE_URL
              value: "https://IDENTITY_HOST_PLACEHOLDER"
            - name: IDENTITY_VERIFIER_AUDIENCE
              value: "memql"
            - name: MEMQL_SECRET_VARIABLE_DISCORD_DEVAUTO_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: MEMQL_SECRET_VARIABLE_DISCORD_DEVAUTO_WEBHOOK_URL
                  key: 'latest'
            - name: MEMQL_SECRET_VARIABLE_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: MEMQL_SECRET_VARIABLE_DISCORD_DEVAUTO_WEBHOOK_URL
                  key: 'latest'

            # --- SERVICE CONFIG ---
            - name: SERVICE_NAME
              value: "memQL"
            - name: SERVICE_CAPABILITIES_LOGGING
              value: "true"
            - name: SERVICE_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: SERVICE_CAPABILITIES_LOGGING_LOG_COLOR
              value: "brightcyan"
            - name: SERVICE_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"

            # --- SERVER CONFIG ---
            - name: SERVER_ADDRESS
              value: "0.0.0.0:8085"
            - name: SERVER_READ_TIMEOUT_MS
              value: "15000"
            - name: SERVER_READ_HEADER_TIMEOUT_MS
              value: "5000"
            - name: SERVER_WRITE_TIMEOUT_MS
              value: "15000"
            - name: SERVER_IDLE_TIMEOUT_MS
              value: "60000"
            - name: SERVER_SHUTDOWN_TIMEOUT_MS
              value: "5000"
            - name: SERVER_PUBLIC_PATH
              value: "/"
            - name: SERVER_CAPABILITIES_LOGGING
              value: "true"
            - name: SERVER_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: SERVER_CAPABILITIES_LOGGING_LOG_COLOR
              value: "brightblue"
            - name: SERVER_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"
            # TODO: Lock down to specific origins once Koyeb + GCR URLs are finalized
            - name: SERVER_ALLOWED_ORIGINS
              value: "*"
            - name: MEMQL_GRPC_ADDRESS
              value: ":50051"

            # --- WEBSOCKETS ---
            - name: MEMQL_WS_DIAL_TIMEOUT_MS
              value: "5000"
            - name: MEMQL_WS_WRITE_TIMEOUT_MS
              value: "10000"
            - name: MEMQL_WS_MAX_CONCURRENT_REQUESTS
              value: "4"
            - name: MEMQL_WS_MAX_MESSAGE_BYTES
              value: "5242880"
            - name: MEMQL_WS_PING_INTERVAL_MS
              value: "30000"

            # --- CACHE ---
            - name: CACHE_CAPABILITIES_LOGGING
              value: "true"
            - name: CACHE_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: CACHE_CAPABILITIES_LOGGING_LOG_COLOR
              value: "brightyellow"
            - name: CACHE_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"
            - name: CACHE_MAX_TTL
              value: "86400"

            # --- MEMORY ENGINE ---
            - name: MEMORY_ENGINE_CAPABILITIES_LOGGING
              value: "true"
            - name: MEMORY_ENGINE_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: MEMORY_ENGINE_CAPABILITIES_LOGGING_LOG_COLOR
              value: "brightwhite"
            - name: MEMORY_ENGINE_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"
            - name: MEMORY_ENGINE_MAX_RESULTS
              value: "500"
            - name: MEMORY_ENGINE_MAX_WINDOW
              value: "5000"
            - name: MEMORY_ENGINE_CACHE_MAX_ITEMS
              value: "1024"
            - name: MEMORY_ENGINE_AI_TOOL_LOOP_MAX_ITERATIONS
              value: "8"
            - name: MEMORY_ENGINE_AI_TOOL_LOOP_MAX_TOOL_CALLS_PER_ITERATION
              value: "4"
            - name: MEMQL_SI_CACHE_DEFAULT_ENABLED
              value: "true"
            - name: MEMQL_SI_CACHE_MAX_SECONDS
              value: "120"
            - name: MEMQL_DEMO_MODE
              value: "false"

            # --- DATABASE CONFIG ---
            - name: MEMORY_NODES_DATABASE_MAX_CONN_RETRIES
              value: "3"
            - name: MEMORY_NODES_DATABASE_MAX_CONN_RETRIES_INTERVAL_MS
              value: "1000"
            - name: MEMORY_NODES_DATABASE_TICKER_INTERVAL_MS
              value: "30000"
            - name: MEMORY_NODES_DATABASE_MIGRATION_TIMEOUT_MS
              value: "30000"
            - name: MEMORY_NODES_DATABASE_AUTO_MIGRATE
              value: "true"
            - name: MEMORY_NODES_DATABASE_MIGRATE_ON_START
              value: "true"
            - name: MEMORY_NODES_DATABASE_CAPABILITIES_LOGGING
              value: "true"
            - name: MEMORY_NODES_DATABASE_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: MEMORY_NODES_DATABASE_CAPABILITIES_LOGGING_LOG_COLOR
              value: "gold"
            - name: MEMORY_NODES_DATABASE_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"

            # --- CONCEPT SEEDER ---
            - name: CONCEPT_SEEDER_CAPABILITIES_LOGGING
              value: "true"
            - name: CONCEPT_SEEDER_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: CONCEPT_SEEDER_CAPABILITIES_LOGGING_LOG_COLOR
              value: "pink"
            - name: CONCEPT_SEEDER_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"

            # --- AUTOMATIONS ---
            - name: AUTOMATIONS_CAPABILITIES_LOGGING
              value: "true"
            - name: AUTOMATIONS_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: AUTOMATIONS_CAPABILITIES_LOGGING_LOG_COLOR
              value: "brightcyan"
            - name: AUTOMATIONS_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"
            - name: MEMQL_STEP_CACHE_ENABLED
              value: "true"

            # --- EVENT BUS ---
            - name: EVENT_BUS_CAPABILITIES_LOGGING
              value: "true"
            - name: EVENT_BUS_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: EVENT_BUS_CAPABILITIES_LOGGING_LOG_COLOR
              value: "coral"
            - name: EVENT_BUS_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"

            # --- AST CONVERTER ---
            - name: AST_CONVERTER_CAPABILITIES_LOGGING
              value: "true"
            - name: AST_CONVERTER_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: AST_CONVERTER_CAPABILITIES_LOGGING_LOG_COLOR
              value: "teal"
            - name: AST_CONVERTER_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"

            # --- INTEGRATIONS ---
            - name: INTEGRATIONS_CAPABILITIES_LOGGING
              value: "true"
            - name: INTEGRATIONS_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: INTEGRATIONS_CAPABILITIES_LOGGING_LOG_COLOR
              value: "violet"
            - name: INTEGRATIONS_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"

            # --- COGNITION INTEGRATION ---
            - name: COGNITION_INTEGRATION_CAPABILITIES_LOGGING
              value: "true"
            - name: COGNITION_INTEGRATION_CAPABILITIES_LOGGING_LOG_COLOR_ENABLED
              value: "true"
            - name: COGNITION_INTEGRATION_CAPABILITIES_LOGGING_LOG_COLOR
              value: "orange"
            - name: COGNITION_INTEGRATION_CAPABILITIES_LOGGING_LOG_LEVEL
              value: "info"
